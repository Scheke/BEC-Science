const STEPS=[
{title:'What Is Puberty?',
content:`<h2>Growing Up — Physical and Emotional Changes</h2>
<p><strong>Puberty</strong> is the time when the body changes from a child's body into an adult's body capable of reproduction. It is controlled by <strong>hormones</strong>.</p>
<ul>
<li>👧 Girls: usually starts <strong>ages 8–13</strong></li>
<li>👦 Boys: usually starts <strong>ages 9–14</strong></li>
</ul>
<p>Puberty happens at different ages for different people — <em>this is normal</em>.</p>
<p>Key hormones:</p>
<ul>
<li>🔵 <strong>Testosterone</strong> (testes) — controls male changes</li>
<li>🔴 <strong>Oestrogen</strong> (ovaries) — controls female changes</li>
</ul>
<p>Hormones are chemical messengers that travel in the blood.</p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,270);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let t=0;
  p.draw=()=>{
    p.background(245);
    // timeline bars
    p.fill('#e3f2fd');p.noStroke();p.rect(40,100,340,45,8);
    p.fill('#fce4ec');p.noStroke();p.rect(40,160,340,45,8);
    p.fill('#555');p.textSize(11);p.text('Boys: 9-14 years',210,120);p.text('Girls: 8-13 years',210,180);
    // slider
    const pos=(p.sin(t*0.03)+1)/2;
    const bx=40+pos*340-10,by=80;
    p.fill('#1565c0');p.noStroke();p.ellipse(bx+10,122,22,22);
    p.fill(255);p.textSize(8);p.text('👦',bx+10,122);
    const gx=40+pos*280-10;
    p.fill('#e91e63');p.noStroke();p.ellipse(gx+30,182,22,22);
    p.fill(255);p.textSize(8);p.text('👧',gx+30,182);
    p.fill('#333');p.textSize(10);p.noStroke();p.text('Age (years) →',210,250);
    for(let age=8;age<=15;age++){const ax=40+(age-8)*48;p.text(age,ax,250);}
    t++;
  };
}},
{title:'Changes in Boys',
content:`<h2>Male Puberty Changes</h2>
<p>Controlled by <strong>testosterone</strong> from the testes:</p>
<table style="width:100%;border-collapse:collapse;margin:8px 0">
<tr><th style="background:#1565c0;color:#fff;padding:6px">Physical Changes</th><th style="background:#1565c0;color:#fff;padding:6px">Other Changes</th></tr>
<tr style="background:#e3f2fd"><td style="padding:5px">Voice gets DEEPER (larynx grows)</td><td style="padding:5px">Increased sweating</td></tr>
<tr><td style="padding:5px">Facial and body hair grows</td><td style="padding:5px">Acne (spots) may appear</td></tr>
<tr style="background:#e3f2fd"><td style="padding:5px">Muscles develop and grow</td><td style="padding:5px">Emotional changes (moods)</td></tr>
<tr><td style="padding:5px">Testes and penis enlarge</td><td style="padding:5px">Interest in relationships</td></tr>
<tr style="background:#e3f2fd"><td style="padding:5px">SPERM production begins</td><td style="padding:5px">More self-conscious</td></tr>
<tr><td style="padding:5px">Growth spurt (get much taller)</td><td style="padding:5px">Need more sleep</td></tr>
</table>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,270);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let t=0,growth=0;
  p.draw=()=>{
    p.background(245);
    growth=0.5+0.5*Math.min(t/200,1);
    // boy before
    p.fill('#1565c0');p.noStroke();p.textSize(64);p.textAlign(p.CENTER,p.CENTER);p.text('👦',100,110);
    p.fill('#555');p.textSize(11);p.text('Before',100,180);
    // arrow
    p.stroke('#333');p.strokeWeight(3);p.line(150,110,220,110);
    p.fill('#333');p.noStroke();p.triangle(220,104,234,110,220,116);
    // boy after (taller)
    p.textSize(64*growth);p.fill('#0d47a1');p.noStroke();p.text('👨',310,100+10*(1-growth));
    p.fill('#555');p.textSize(11);p.text('After puberty',310,180);
    // labels
    const changes=['Deeper voice','More muscle','Facial hair','Taller'];
    changes.forEach((c,i)=>{const a=Math.floor(t/50)%4===i;p.fill(a?'#1565c0':'#aaa');p.textSize(a?12:10);p.text(c,310,205+i*16*(growth));});
    t++;
  };
}},
{title:'Changes in Girls',
content:`<h2>Female Puberty Changes</h2>
<p>Controlled by <strong>oestrogen</strong> from the ovaries:</p>
<table style="width:100%;border-collapse:collapse;margin:8px 0">
<tr><th style="background:#880e4f;color:#fff;padding:6px">Physical Changes</th><th style="background:#880e4f;color:#fff;padding:6px">Other Changes</th></tr>
<tr style="background:#fce4ec"><td style="padding:5px">Breasts develop</td><td style="padding:5px">Increased sweating</td></tr>
<tr><td style="padding:5px">Hips widen</td><td style="padding:5px">Acne (spots) may appear</td></tr>
<tr style="background:#fce4ec"><td style="padding:5px">Pubic and underarm hair</td><td style="padding:5px">Emotional changes (moods)</td></tr>
<tr><td style="padding:5px">MENSTRUATION begins (periods)</td><td style="padding:5px">More self-conscious</td></tr>
<tr style="background:#fce4ec"><td style="padding:5px">Growth spurt</td><td style="padding:5px">Need more sleep</td></tr>
<tr><td style="padding:5px">Ovaries begin releasing eggs</td><td style="padding:5px">Interest in relationships</td></tr>
</table>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,260);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let t=0;
  p.draw=()=>{
    p.background(245);
    // menstrual cycle diagram
    const cx=210,cy=130,r=90;
    const phases=[{n:'Days 1-5\nMenstruation',c:'#e53935',a:-p.HALF_PI},{n:'Days 6-13\nLining rebuilds',c:'#f4511e',a:0},{n:'Day 14\nOvulation',c:'#8e24aa',a:p.HALF_PI},{n:'Days 15-28\nWait for fertilisation',c:'#1e88e5',a:p.PI}];
    const active=Math.floor(t/70)%4;
    phases.forEach((ph,i)=>{
      const isA=active===i;
      const x=cx+r*Math.cos(ph.a),y=cy+r*Math.sin(ph.a);
      p.fill(isA?ph.c:'#ddd');p.noStroke();p.ellipse(x,y,isA?100:80,isA?58:44);
      p.fill(isA?255:'#555');p.textSize(isA?11:9);
      ph.n.split('\n').forEach((l,li)=>p.text(l,x,y-8+li*16));
      const a2=(i+1<4?phases[i+1].a:phases[0].a-p.TWO_PI);
      p.stroke('#bbb');p.strokeWeight(2);
      const nx=cx+r*Math.cos(phases[(i+1)%4].a),ny=cy+r*Math.sin(phases[(i+1)%4].a);
      p.line(x,y,nx,ny);
    });
    p.noStroke();p.fill('#333');p.textSize(11);p.text('The Menstrual Cycle (~28 days)',cx,cy);
    t++;
  };
}},
{title:'Fertilisation and Development',
content:`<h2>How a New Life Begins</h2>
<ol>
<li>🥚 <strong>Ovulation</strong> — egg released from ovary (~day 14)</li>
<li>🏊 <strong>Sperm meets egg</strong> in the fallopian tube</li>
<li>🔬 <strong>Fertilisation</strong> — one sperm fuses with egg → ZYGOTE</li>
<li>🧫 <strong>Cell division</strong> — zygote divides as it travels to uterus</li>
<li>📌 <strong>Implantation</strong> — embryo embeds in uterus wall</li>
<li>🤱 <strong>Development</strong> — placenta forms; embryo → foetus → baby</li>
<li>👶 <strong>Birth</strong> — after ~40 weeks (9 months)</li>
</ol>
<p>The <strong>placenta</strong> passes oxygen and nutrients from mother to baby, and removes CO₂ and waste.</p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,280);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let t=0;
  p.draw=()=>{
    p.background(245);
    const steps=[{n:'Ovulation',x:60,y:80},{n:'Fertilisation',x:160,y:120},{n:'Cell division',x:260,y:90},{n:'Implantation',x:360,y:130},{n:'Development',x:360,y:210},{n:'Birth 👶',x:210,y:240}];
    const cols=['#8e24aa','#e53935','#f4511e','#1e88e5','#43a047','#ffd600'];
    const active=Math.floor(t/70)%6;
    for(let i=0;i<steps.length-1;i++){
      p.stroke('#bbb');p.strokeWeight(2);p.line(steps[i].x,steps[i].y,steps[i+1].x,steps[i+1].y);
    }
    steps.forEach((s,i)=>{
      const isA=active===i;
      p.fill(isA?cols[i]:'#ddd');p.noStroke();p.ellipse(s.x,s.y,isA?90:72,isA?46:36);
      p.fill(isA?255:'#555');p.textSize(isA?11:9);p.text(s.n,s.x,s.y);
    });
    t++;
  };
}},
{title:'Reproductive Health and Hygiene',
content:`<h2>Taking Care of Yourself</h2>
<p>Good reproductive health means looking after your body and wellbeing during and after puberty.</p>
<p><strong>Personal hygiene:</strong></p>
<ul>
<li>🚿 Bathe daily — sweat increases during puberty</li>
<li>👕 Change underwear daily</li>
<li>🩸 Girls: use sanitary products during menstruation</li>
</ul>
<p><strong>General health:</strong></p>
<ul>
<li>🥗 Eat a balanced diet to support hormones and growth</li>
<li>🏃 Exercise regularly</li>
<li>😴 Get enough sleep (8-9 hours)</li>
<li>🚭 Avoid tobacco and alcohol — harmful to reproductive organs</li>
<li>👨‍⚕️ Talk to a trusted adult or doctor about any concerns</li>
</ul>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,270);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  const icons=[{i:'🚿',l:'Hygiene',x:70,y:100},{i:'🥗',l:'Nutrition',x:175,y:100},{i:'🏃',l:'Exercise',x:280,y:100},{i:'😴',l:'Sleep',x:360,y:160},{i:'🚭',l:'No smoking',x:280,y:210},{i:'💬',l:'Talk to adults',x:130,y:210}];
  let t=0,active=0;
  p.draw=()=>{
    p.background(245);
    if(t%80===0)active=(active+1)%icons.length;
    p.fill('#6a1b9a');p.noStroke();p.ellipse(210,145,80,80);p.fill(255);p.textSize(28);p.text('❤️',210,145);
    icons.forEach((ic,i)=>{
      const isA=active===i;
      p.fill(isA?'#6a1b9a':'#ddd');p.noStroke();p.ellipse(ic.x,ic.y,isA?70:58,isA?44:36);
      p.textSize(isA?20:16);p.text(ic.i,ic.x,ic.y-4);
      p.fill(isA?255:'#888');p.textSize(isA?11:9);p.text(ic.l,ic.x,ic.y+14);
      p.stroke('#ccc');p.strokeWeight(1);p.line(ic.x,ic.y,210,145);
    });
    p.fill('#333');p.noStroke();p.textSize(11);p.text('Good reproductive health habits',210,255);
    t++;
  };
}},

{title:'The Female Reproductive System',
content:`<h3>Female Reproductive System</h3>
<p>The female reproductive system produces <strong>egg cells (ova)</strong>, provides the site for <strong>fertilisation</strong>, and supports the <strong>developing baby</strong>.</p>`,
visual:`<svg viewBox="0 0 420 258" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect width="420" height="258" fill="#fce4ec" rx="8"/>
  <text x="210" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#880e4f">The Female Reproductive System</text>
  <!-- Uterus (womb) central shape -->
  <path d="M175 120 Q162 98 168 82 Q180 65 210 63 Q240 65 252 82 Q258 98 245 120 Q232 148 210 155 Q188 148 175 120 Z" fill="#f48fb1" stroke="#880e4f" stroke-width="2"/>
  <text x="210" y="112" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">Uterus</text>
  <text x="210" y="124" text-anchor="middle" font-size="8" fill="#fff">(Womb)</text>
  <!-- Cervix -->
  <rect x="200" y="155" width="20" height="20" rx="4" fill="#f06292" stroke="#880e4f" stroke-width="1.5"/>
  <text x="260" y="163" font-size="9" fill="#880e4f">Cervix</text>
  <text x="260" y="174" font-size="8" fill="#555">(lower opening</text>
  <text x="260" y="184" font-size="8" fill="#555">of uterus)</text>
  <line x1="220" y1="165" x2="258" y2="165" stroke="#880e4f" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Vagina -->
  <rect x="204" y="175" width="12" height="30" rx="3" fill="#ef9a9a" stroke="#c62828" stroke-width="1.5"/>
  <text x="135" y="192" font-size="9" fill="#c62828">Vagina</text>
  <text x="135" y="202" font-size="8" fill="#555">(birth canal)</text>
  <line x1="204" y1="192" x2="165" y2="192" stroke="#c62828" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Left fallopian tube -->
  <path d="M175 88 Q148 75 130 80 Q112 85 108 98" fill="none" stroke="#9c27b0" stroke-width="2.5"/>
  <!-- Right fallopian tube -->
  <path d="M245 88 Q272 75 290 80 Q308 85 312 98" fill="none" stroke="#9c27b0" stroke-width="2.5"/>
  <!-- Fimbriae (finger-like projections) -->
  <path d="M108 98 Q102 94 98 100 M108 98 Q106 90 100 90 M108 98 Q112 92 108 87" fill="none" stroke="#9c27b0" stroke-width="1.5"/>
  <path d="M312 98 Q318 94 322 100 M312 98 Q314 90 320 90 M312 98 Q308 92 312 87" fill="none" stroke="#9c27b0" stroke-width="1.5"/>
  <!-- Label fallopian tube -->
  <text x="60" y="68" font-size="8.5" fill="#9c27b0">Fallopian tube</text>
  <text x="60" y="78" font-size="8" fill="#555">(fertilisation</text>
  <text x="60" y="88" font-size="8" fill="#555">occurs here)</text>
  <line x1="108" y1="82" x2="88" y2="80" stroke="#9c27b0" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Left ovary -->
  <ellipse cx="104" cy="112" rx="18" ry="13" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="104" y="115" text-anchor="middle" font-size="8.5" fill="#e65100">Ovary</text>
  <text x="40" y="135" font-size="8.5" fill="#e65100">Ovaries: produce</text>
  <text x="40" y="146" font-size="8.5" fill="#e65100">eggs &amp; oestrogen</text>
  <line x1="86" y1="115" x2="72" y2="135" stroke="#f9a825" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Right ovary -->
  <ellipse cx="316" cy="112" rx="18" ry="13" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="316" y="115" text-anchor="middle" font-size="8.5" fill="#e65100">Ovary</text>
  <!-- Egg cell being released (right ovary) -->
  <circle cx="298" cy="100" r="5" fill="#ffd600" stroke="#f57f17" stroke-width="1.5"/>
  <text x="338" y="95" font-size="8" fill="#f57f17">Egg released</text>
  <text x="338" y="105" font-size="8" fill="#555">(ovulation)</text>
  <!-- Uterus labels -->
  <text x="125" y="125" font-size="8.5" fill="#880e4f">Baby develops</text>
  <text x="125" y="136" font-size="8.5" fill="#880e4f">here for 9 months</text>
  <line x1="175" y1="120" x2="160" y2="128" stroke="#880e4f" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Bottom summary -->
  <rect x="0" y="214" width="420" height="44" rx="0" fill="#880e4f"/>
  <text x="210" y="229" text-anchor="middle" font-size="9.5" font-weight="bold" fill="white">Egg path: Ovary → Fallopian tube (fertilised here) → Uterus (implants here)</text>
  <text x="210" y="244" text-anchor="middle" font-size="9" fill="#fce4ec">Ovaries release one egg per month | Uterus sheds lining monthly if no fertilisation</text>
</svg>`},
{title:'The Menstrual Cycle — 28 Days',
content:`<h3>The Menstrual Cycle</h3>
<p>The menstrual cycle prepares the body for possible pregnancy each month. It is controlled by hormones and lasts approximately <strong>28 days</strong>.</p>`,
visual:`<svg viewBox="0 0 420 258" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="420" height="258" fill="#fce4ec" rx="8"/>
  <text x="210" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#880e4f">The Menstrual Cycle — 28 Days</text>
  <!-- Circle timeline -->
  <circle cx="210" cy="120" r="85" fill="none" stroke="#ddd" stroke-width="3"/>
  <!-- Phase 1: Menstruation Days 1-5 (top-left arc) -->
  <path d="M210 35 A85 85 0 0 0 125 120" fill="none" stroke="#e53935" stroke-width="12" stroke-linecap="butt"/>
  <!-- Phase 2: Rebuilding Days 6-13 (left to bottom arc) -->
  <path d="M125 120 A85 85 0 0 0 210 205" fill="none" stroke="#fb8c00" stroke-width="12" stroke-linecap="butt"/>
  <!-- Phase 3: Ovulation Day 14 (bottom marker) -->
  <circle cx="210" cy="205" r="12" fill="#8e24aa" stroke="white" stroke-width="2"/>
  <text x="210" y="209" text-anchor="middle" font-size="8" fill="white">14</text>
  <!-- Phase 4: Waiting Days 15-28 (right arc) -->
  <path d="M210 205 A85 85 0 0 0 210 35" fill="none" stroke="#1565c0" stroke-width="12" stroke-linecap="butt"/>
  <!-- Day markers -->
  <circle cx="210" cy="35" r="8" fill="#e53935" stroke="white" stroke-width="2"/>
  <text x="210" y="39" text-anchor="middle" font-size="8" fill="white">1</text>
  <circle cx="125" cy="120" r="8" fill="#fb8c00" stroke="white" stroke-width="2"/>
  <text x="125" y="124" text-anchor="middle" font-size="8" fill="white">6</text>
  <!-- Centre labels -->
  <text x="210" y="108" text-anchor="middle" font-size="9" font-weight="bold" fill="#555">~28 day</text>
  <text x="210" y="120" text-anchor="middle" font-size="9" fill="#555">cycle</text>
  <text x="210" y="133" text-anchor="middle" font-size="8" fill="#888">hormone</text>
  <text x="210" y="143" text-anchor="middle" font-size="8" fill="#888">controlled</text>
  <!-- Phase labels (outside circle) -->
  <!-- Phase 1 label -->
  <text x="140" y="52" text-anchor="middle" font-size="9" font-weight="bold" fill="#e53935">Days 1-5</text>
  <text x="140" y="63" text-anchor="middle" font-size="8.5" fill="#e53935">Menstruation</text>
  <text x="140" y="74" text-anchor="middle" font-size="8" fill="#555">Uterus lining</text>
  <text x="140" y="84" text-anchor="middle" font-size="8" fill="#555">shed (bleeding)</text>
  <!-- Phase 2 label -->
  <text x="72" y="150" text-anchor="middle" font-size="9" font-weight="bold" fill="#fb8c00">Days 6-13</text>
  <text x="72" y="161" text-anchor="middle" font-size="8.5" fill="#fb8c00">Lining rebuilds</text>
  <text x="72" y="172" text-anchor="middle" font-size="8" fill="#555">Uterus wall</text>
  <text x="72" y="182" text-anchor="middle" font-size="8" fill="#555">thickens again</text>
  <!-- Phase 3 label -->
  <text x="210" y="226" text-anchor="middle" font-size="9" font-weight="bold" fill="#8e24aa">Day 14 — Ovulation</text>
  <text x="210" y="237" text-anchor="middle" font-size="8" fill="#555">Egg released from ovary</text>
  <!-- Phase 4 label -->
  <text x="348" y="120" text-anchor="middle" font-size="9" font-weight="bold" fill="#1565c0">Days 15-28</text>
  <text x="348" y="131" text-anchor="middle" font-size="8.5" fill="#1565c0">Waiting phase</text>
  <text x="348" y="142" text-anchor="middle" font-size="8" fill="#555">Lining stays thick</text>
  <text x="348" y="152" text-anchor="middle" font-size="8" fill="#555">waiting for</text>
  <text x="348" y="162" text-anchor="middle" font-size="8" fill="#555">fertilised egg</text>
  <text x="348" y="173" text-anchor="middle" font-size="8" fill="#e53935">→ if no fertilisation</text>
  <text x="348" y="183" text-anchor="middle" font-size="8" fill="#e53935">cycle restarts Day 1</text>
  <!-- Arrow showing cycle direction -->
  <path d="M205 35 A85 85 0 0 1 210 35" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
</svg>`},
{title:'Fertilisation and Development — Flow Diagram',
content:`<h3>From Egg to Baby</h3>
<p>Fertilisation is the joining of a sperm cell and an egg cell. The fertilised egg then develops over <strong>9 months (40 weeks)</strong> into a baby.</p>`,
visual:`<svg viewBox="0 0 420 258" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="420" height="258" fill="#f3e5f5" rx="8"/>
  <text x="210" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">Fertilisation and Development</text>
  <!-- Step 1: Egg released -->
  <rect x="8" y="28" width="90" height="46" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="53" y="45" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#e65100">1. Ovulation</text>
  <text x="53" y="57" text-anchor="middle" font-size="8" fill="#555">Egg released</text>
  <text x="53" y="67" text-anchor="middle" font-size="8" fill="#555">from ovary</text>
  <!-- Arrow 1-->2 -->
  <line x1="98" y1="51" x2="112" y2="51" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <!-- Step 2: Travels down -->
  <rect x="114" y="28" width="90" height="46" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="159" y="45" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#0288d1">2. Travels Down</text>
  <text x="159" y="57" text-anchor="middle" font-size="8" fill="#555">Egg moves along</text>
  <text x="159" y="67" text-anchor="middle" font-size="8" fill="#555">fallopian tube</text>
  <!-- Arrow 2-->3 -->
  <line x1="204" y1="51" x2="218" y2="51" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <!-- Step 3: Fertilisation -->
  <rect x="220" y="28" width="90" height="46" rx="6" fill="#fce4ec" stroke="#e91e63" stroke-width="2"/>
  <text x="265" y="42" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#e91e63">3. Fertilisation</text>
  <text x="265" y="54" text-anchor="middle" font-size="8" fill="#555">Sperm meets egg</text>
  <text x="265" y="64" text-anchor="middle" font-size="8" fill="#555">in fallopian tube</text>
  <!-- Arrow 3-->4 -->
  <line x1="310" y1="51" x2="324" y2="51" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <!-- Step 4: Zygote -->
  <rect x="326" y="28" width="88" height="46" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="370" y="42" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2e7d32">4. Zygote</text>
  <text x="370" y="54" text-anchor="middle" font-size="8" fill="#555">Egg + Sperm =</text>
  <text x="370" y="64" text-anchor="middle" font-size="8" fill="#555">1 fertilised cell</text>
  <!-- Arrow 4 going down -->
  <line x1="370" y1="74" x2="370" y2="108" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <!-- Step 5: Cell division -->
  <rect x="326" y="110" width="88" height="46" rx="6" fill="#ede7f6" stroke="#7b1fa2" stroke-width="2"/>
  <text x="370" y="124" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#7b1fa2">5. Cell Division</text>
  <text x="370" y="136" text-anchor="middle" font-size="8" fill="#555">Zygote divides</text>
  <text x="370" y="146" text-anchor="middle" font-size="8" fill="#555">→ becomes embryo</text>
  <!-- Arrow 5-->6 -->
  <line x1="326" y1="133" x2="210" y2="133" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <!-- Step 6: Implantation -->
  <rect x="115" y="110" width="90" height="46" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="160" y="124" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#e65100">6. Implantation</text>
  <text x="160" y="136" text-anchor="middle" font-size="8" fill="#555">Embryo embeds in</text>
  <text x="160" y="146" text-anchor="middle" font-size="8" fill="#555">uterus wall</text>
  <!-- Arrow 6-->7 -->
  <line x1="115" y1="133" x2="100" y2="133" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <!-- Step 7: Growth -->
  <rect x="8" y="110" width="90" height="46" rx="6" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
  <text x="53" y="124" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#00695c">7. Growth</text>
  <text x="53" y="136" text-anchor="middle" font-size="8" fill="#555">Embryo → Foetus</text>
  <text x="53" y="146" text-anchor="middle" font-size="8" fill="#555">Placenta forms</text>
  <!-- Arrow 7-->8 -->
  <line x1="53" y1="156" x2="53" y2="170" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <!-- Step 8: Birth -->
  <rect x="8" y="172" width="90" height="46" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5"/>
  <text x="53" y="186" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#388e3c">8. Birth</text>
  <text x="53" y="198" text-anchor="middle" font-size="8" fill="#555">After 40 weeks</text>
  <text x="53" y="208" text-anchor="middle" font-size="8" fill="#555">(~9 months)</text>
  <!-- Timeframe annotations -->
  <text x="210" y="175" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#4a148c">Key Timeframes:</text>
  <text x="210" y="188" text-anchor="middle" font-size="8" fill="#555">Day 0: Fertilisation</text>
  <text x="210" y="200" text-anchor="middle" font-size="8" fill="#555">Week 1-2: Cell division + travel</text>
  <text x="210" y="212" text-anchor="middle" font-size="8" fill="#555">Week 2-8: Embryo stage</text>
  <text x="210" y="224" text-anchor="middle" font-size="8" fill="#555">Week 9-40: Foetus stage</text>
  <!-- Placenta note box -->
  <rect x="300" y="172" width="114" height="62" rx="5" fill="white" stroke="#880e4f" stroke-width="1.5"/>
  <text x="357" y="186" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#880e4f">Placenta role:</text>
  <text x="357" y="198" text-anchor="middle" font-size="8" fill="#333">Passes O&#x2082; &amp; nutrients</text>
  <text x="357" y="209" text-anchor="middle" font-size="8" fill="#333">to baby via blood</text>
  <text x="357" y="220" text-anchor="middle" font-size="8" fill="#333">Removes CO&#x2082; &amp; waste</text>
  <text x="357" y="231" text-anchor="middle" font-size="8" fill="#555">Connected by umbilical cord</text>
</svg>`},
{title:'Mini-Quiz: Puberty',
mcq:[
  {q:'Which hormone controls puberty changes in boys?',opts:['Oestrogen','Progesterone','Testosterone','Adrenaline'],ans:2,exp:'TESTOSTERONE is produced by the TESTES and is responsible for male puberty changes: deeper voice, facial hair, muscle growth, enlargement of reproductive organs, and sperm production.'},
  {q:'What is ovulation?',opts:['The start of menstruation','The release of an egg from the ovary','The fusion of sperm and egg','The thickening of the uterus lining'],ans:1,exp:'OVULATION is the RELEASE of an EGG (ovum) from the OVARY. It happens approximately on day 14 of the menstrual cycle. This is when pregnancy is most likely to occur if sperm are present.'},
]},
{title:'Mini-Quiz: Fertilisation & Health',
mcq:[
  {q:'Where does fertilisation of the human egg normally occur?',opts:['Uterus (womb)','Vagina','Fallopian tube (oviduct)','Ovary'],ans:2,exp:'FERTILISATION normally occurs in the FALLOPIAN TUBE (oviduct). A sperm cell fuses with an egg released from the ovary. The fertilised egg then travels to the uterus and implants in the wall.'},
  {q:'Why should tobacco and alcohol be avoided during puberty?',opts:['They make you grow too tall','They are harmful to developing reproductive organs and overall health','They cause you to grow faster','They have no effect on health'],ans:1,exp:'TOBACCO and ALCOHOL are harmful to the developing body during puberty. They can damage reproductive organs, harm the developing brain, reduce fertility, and increase risk of cancer and other diseases.'},
]},
];
