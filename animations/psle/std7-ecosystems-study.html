{title:'Food Chains & Energy Flow',content:`<h2>Energy Movement Through Ecosystems</h2><p><strong>Food chain:</strong> Linear sequence where energy flows from one organism to next</p><ul><li>🌿 <strong>Producer</strong> (Plants) — capture sunlight via photosynthesis</li><li>🦌 <strong>Primary consumer</strong> (Herbivores) — eat plants</li><li>🐺 <strong>Secondary consumer</strong> (Carnivores) — eat herbivores</li><li>🦅 <strong>Apex predator</strong> — top of the chain</li></ul><p><strong>Energy loss:</strong> Only ~10% energy passes to next level (rest used for living)</p>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><circle cx="80" cy="100" r="25" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/><text x="80" y="105" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Producer</text><circle cx="170" cy="100" r="25" fill="#ff9800" stroke="#e65100" stroke-width="2"/><text x="170" y="105" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Herbivore</text><circle cx="260" cy="100" r="25" fill="#f44336" stroke="#c62828" stroke-width="2"/><text x="260" y="105" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Carnivore</text><circle cx="340" cy="100" r="25" fill="#8b0000" stroke="#4a0000" stroke-width="2"/><text x="340" y="105" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Apex</text><line x1="105" y1="100" x2="145" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><line x1="195" y1="100" x2="235" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><line x1="285" y1="100" x2="315" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><text x="210" y="200" font-size="8" fill="#555" text-anchor="middle">100% → 10% → 1% → 0.1% (Energy flow)</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#333"/></marker></defs></svg>`}
,{title:'Ecosystem Balance & Biodiversity',content:`<h2>Interconnected Living Systems</h2><p><strong>Ecosystems</strong> = communities of organisms + physical environment</p><ul><li>🌳 <strong>Biotic factors</strong> — all living things (plants, animals, microbes)</li><li>⛰️ <strong>Abiotic factors</strong> — non-living (water, soil, temperature, light)</li><li>🔄 <strong>Decomposers</strong> — bacteria, fungi break down dead matter</li><li>⚖️ <strong>Balance</strong> — remove one species, ecosystem suffers</li></ul><p><strong>Example impact:</strong> Removing wolves → deer overpopulate → overgraze vegetation → habitat destroyed</p>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><circle cx="210" cy="125" r="80" fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="5,5"/><polygon points="80,120 60,180 100,180" fill="#4caf50" stroke="#2e7d32" stroke-width="1"/><circle cx="150" cy="90" r="15" fill="#ffb74d" stroke="#e65100" stroke-width="1"/><circle cx="200" cy="70" r="12" fill="#81c784" stroke="#2e7d32" stroke-width="1"/><circle cx="260" cy="80" r="14" fill="#ff5252" stroke="#c62828" stroke-width="1"/><circle cx="300" cy="130" r="13" fill="#8d6e63" stroke="#4e342e" stroke-width="1"/><text x="300" y="135" font-size="6" fill="#fff" font-weight="bold" text-anchor="middle">Decomposer</text><circle cx="270" cy="180" r="12" fill="#64b5f6" stroke="#1565c0" stroke-width="1"/><circle cx="150" cy="160" r="14" fill="#9575cd" stroke="#512da8" stroke-width="1"/><rect x="40" y="220" width="340" height="15" rx="4" fill="#8d6e63"/><text x="210" y="231" font-size="7" fill="#fff" font-weight="bold" text-anchor="middle">Soil (Abiotic Factor)</text></svg>`}
