<script src="../study-engine.js"></script>
<script>
const STEPS=[

/* ══ STEPS 0–4  ANIMATIONS ══ */

{title:'What Is Science?',
content:`<h2>Science Is About Asking Questions</h2>
<p>Science is a way of learning about the world by <strong>observing</strong>, <strong>testing</strong>, and <strong>explaining</strong>. Scientists use a special method to investigate their questions.</p>
<ul>
<li>🔍 <strong>Observe</strong> — notice something interesting</li>
<li>❓ <strong>Question</strong> — ask WHY or HOW</li>
<li>💡 <strong>Hypothesis</strong> — make a testable prediction</li>
<li>🧪 <strong>Experiment</strong> — test the hypothesis</li>
<li>📊 <strong>Results</strong> — record what happens</li>
<li>✅ <strong>Conclusion</strong> — decide if the hypothesis was right</li>
</ul>
<p>Watch the animation — it shows the steps of the scientific method as a cycle!</p>`,
draw(p){
  const steps=['Observe','Question','Hypothesis','Experiment','Results','Conclusion'];
  const colors=['#e53935','#8e24aa','#1e88e5','#00897b','#f4511e','#43a047'];
  p.setup=()=>{p.createCanvas(420,340);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let frame=0;
  p.draw=()=>{
    p.background(245);
    const cx=210,cy=170,r=120;
    for(let i=0;i<steps.length;i++){
      const a=p.TWO_PI*(i/6)-p.HALF_PI;
      const x=cx+r*p.cos(a), y=cy+r*p.sin(a);
      const active=Math.floor(frame/60)%6===i;
      p.fill(active?colors[i]:'#ddd');p.noStroke();p.ellipse(x,y,64,44);
      p.fill(active?255:80);p.textSize(active?11:10);p.text(steps[i],x,y);
      if(i<5){const a2=p.TWO_PI*((i+1)/6)-p.HALF_PI;const x2=cx+r*p.cos(a2),y2=cy+r*p.sin(a2);const mx=(x+x2)/2+(y2-y)*0.15,my=(y+y2)/2-(x2-x)*0.15;p.stroke('#999');p.strokeWeight(2);p.noFill();p.beginShape();p.vertex(x,y);p.quadraticVertex(mx,my,x2,y2);p.endShape();}
    }
    p.noStroke();p.fill('#333');p.textSize(13);p.text('The Scientific Method',cx,cy);
    frame++;
  };
}},

{title:'Making a Hypothesis',
content:`<h2>A Hypothesis Is a Testable Prediction</h2>
<p>A <strong>hypothesis</strong> is a suggested answer to your question — but it must be <em>testable</em>. A good hypothesis follows the format:</p>
<blockquote style="background:#e3f2fd;border-left:4px solid #1565c0;padding:8px 12px;margin:8px 0;border-radius:4px"><strong>"If … then … because …"</strong></blockquote>
<p><strong>Example:</strong></p>
<ul>
<li><em>Question:</em> Does more sunlight make a plant grow taller?</li>
<li><em>Hypothesis:</em> "If a plant gets more sunlight, then it will grow taller, because sunlight is needed for photosynthesis."</li>
</ul>
<p>A hypothesis is NOT a guess — it must be based on what you already know, and it must be possible to TEST it.</p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,300);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let t=0;
  p.draw=()=>{
    p.background(245);
    const parts=[{label:'IF',sub:'You change something',col:'#1565c0'},{label:'THEN',sub:'Something else changes',col:'#2e7d32'},{label:'BECAUSE',sub:'Your reasoning',col:'#e65100'}];
    parts.forEach((pt,i)=>{
      const x=70+i*140,y=150;const pulse=1+0.06*p.sin(t*0.05+i*2);
      p.fill(pt.col);p.noStroke();p.ellipse(x,y,100*pulse,100*pulse);
      p.fill(255);p.textSize(14);p.text(pt.label,x,y-8);p.textSize(10);p.text(pt.sub,x,y+14);
      if(i<2){p.fill('#555');p.textSize(20);p.text('→',x+70,y);}
    });
    p.fill('#333');p.textSize(12);p.noStroke();p.text('If → Then → Because = A testable hypothesis!',210,260);
    t++;
  };
}},

{title:'Variables in an Experiment',
content:`<h2>Understanding Variables</h2>
<p>In any experiment, there are three types of variables:</p>
<table style="width:100%;border-collapse:collapse;margin:8px 0">
<tr><th style="background:#1565c0;color:#fff;padding:6px">Type</th><th style="background:#1565c0;color:#fff;padding:6px">What it is</th><th style="background:#1565c0;color:#fff;padding:6px">Example</th></tr>
<tr style="background:#e3f2fd"><td style="padding:6px"><strong>Independent</strong></td><td style="padding:6px">What YOU change</td><td style="padding:6px">Amount of sunlight</td></tr>
<tr><td style="padding:6px"><strong>Dependent</strong></td><td style="padding:6px">What you MEASURE</td><td style="padding:6px">Plant height</td></tr>
<tr style="background:#e3f2fd"><td style="padding:6px"><strong>Controlled</strong></td><td style="padding:6px">Kept the SAME</td><td style="padding:6px">Water, soil, temperature</td></tr>
</table>
<p>Changing only ONE variable at a time makes it a <strong>fair test</strong> — then you know the results are caused by the variable you changed!</p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,300);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let frame=0;
  p.draw=()=>{
    p.background(245);
    const items=[{x:70,y:120,col:'#e53935',label:'INDEPENDENT',sub:'You change this'},{x:210,y:200,col:'#1e88e5',label:'DEPENDENT',sub:'You measure this'},{x:350,y:120,col:'#43a047',label:'CONTROLLED',sub:'Keep the same'}];
    p.stroke('#aaa');p.strokeWeight(2);p.line(70,120,210,200);p.line(350,120,210,200);p.line(70,120,350,120);
    items.forEach((it,i)=>{
      const pulse=1+0.07*p.sin(frame*0.05+i*2);
      p.fill(it.col);p.noStroke();p.ellipse(it.x,it.y,90*pulse,70*pulse);
      p.fill(255);p.textSize(10);p.text(it.label,it.x,it.y-8);p.textSize(9);p.text(it.sub,it.x,it.y+8);
    });
    p.noStroke();p.fill('#333');p.textSize(12);p.text('The "triangle" of experimental variables',210,270);
    frame++;
  };
}},

{title:'Recording and Presenting Data',
content:`<h2>Tables and Graphs</h2>
<p>After an experiment, you must <strong>record results</strong> neatly. Use a <strong>table</strong> first, then present them in a <strong>graph</strong>.</p>
<p><strong>Which graph to use?</strong></p>
<ul>
<li>📊 <strong>Bar graph</strong> — comparing categories (e.g. types of soil)</li>
<li>📈 <strong>Line graph</strong> — continuous data over time (e.g. temperature over 5 days)</li>
<li>🥧 <strong>Pie chart</strong> — proportions (e.g. % of each food type)</li>
</ul>
<p>Always label your graph: <em>Title, axes, units</em>. To find the mean: add all values ÷ number of values.</p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,300);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  const data=[{label:'Sand',val:4,col:'#f4511e'},{label:'Clay',val:8,col:'#8e24aa'},{label:'Loam',val:14,col:'#43a047'},{label:'Gravel',val:6,col:'#1e88e5'}];
  let revealed=0,frame=0;
  p.draw=()=>{
    p.background(245);
    if(frame%90===0) revealed=Math.min(revealed+1,data.length);
    const maxV=15,W=54,bx=40,by=240,bw=340,bh=180;
    p.stroke('#ccc');p.strokeWeight(1);p.fill('#eee');p.rect(bx,by-bh,bw,bh);
    p.noStroke();p.fill('#333');p.textSize(11);p.textAlign(p.LEFT);p.text('Plant height (cm)',bx,by-bh-8);
    p.textAlign(p.CENTER);
    for(let i=0;i<revealed;i++){
      const d=data[i];const barH=(d.val/maxV)*bh;const x=bx+20+i*W;
      p.fill(d.col);p.rect(x,by-barH,W-6,barH);
      p.fill('#333');p.textSize(11);p.text(d.label,x+W/2-3,by+14);p.text(d.val,x+W/2-3,by-barH-8);
    }
    p.stroke('#555');p.strokeWeight(2);p.line(bx,by-bh,bx,by);p.line(bx,by,bx+bw,by);
    p.noStroke();p.fill('#333');p.textSize(12);p.textAlign(p.CENTER);p.text('Soil Type vs. Plant Growth (Bar Graph)',210,270);
    frame++;
  };
}},

{title:'Drawing Conclusions',
content:`<h2>What Do the Results Mean?</h2>
<p>A <strong>conclusion</strong> must refer back to your hypothesis and your data. A good conclusion:</p>
<ul>
<li>States whether the hypothesis was <strong>supported or not</strong></li>
<li>Uses <strong>actual data values</strong> as evidence</li>
<li>Suggests possible <strong>sources of error</strong></li>
<li>Suggests how the experiment could be <strong>improved</strong></li>
</ul>
<p><strong>Example:</strong><br>"My hypothesis was <em>supported</em>. Plants in full sunlight grew taller (14 cm) than those in low sunlight (6 cm). An error was that pots were different sizes. Improvement: use identical pots next time."</p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,280);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let t=0;
  p.draw=()=>{
    p.background(245);
    const cx=210,cy=140;
    const phases=['Hypothesis','Data','Conclusion','Improvement'];
    const cols=['#1e88e5','#43a047','#e53935','#f4511e'];
    const active=Math.floor(t/70)%4;
    phases.forEach((ph,i)=>{
      const a=p.TWO_PI*(i/4)-p.HALF_PI;
      const x=cx+110*p.cos(a),y=cy+90*p.sin(a);const isAct=active===i;
      p.fill(isAct?cols[i]:'#ccc');p.noStroke();p.ellipse(x,y,isAct?90:70,isAct?56:44);
      p.fill(isAct?255:'#555');p.textSize(isAct?12:10);p.text(ph,x,y);
      const a2=p.TWO_PI*((i+1)/4)-p.HALF_PI;const x2=cx+110*p.cos(a2),y2=cy+90*p.sin(a2);
      p.stroke('#bbb');p.strokeWeight(2);p.line(x,y,x2,y2);
    });
    p.noStroke();p.fill(cols[active]);p.textSize(12);p.text('Now: '+phases[active],cx,cy);
    t++;
  };
}},

/* ══ STEPS 5–10  SVG DIAGRAMS ══ */

{title:'The Fair Test — Labeled Experiment',
content:`<h3>Identifying Variables in a Real Experiment</h3>
<p>The diagram below shows a plant growth experiment testing how sunlight affects height. Study it carefully — every exam experiment can be analysed the same way.</p>
<ul>
<li>🔴 <strong>Independent variable</strong> = the one thing you CHANGE between groups</li>
<li>🔵 <strong>Dependent variable</strong> = what you MEASURE to see if it changed</li>
<li>🟢 <strong>Controlled variables</strong> = EVERYTHING ELSE kept the same to make it fair</li>
</ul>
<p>Tip: if two variables both change, you cannot tell which one caused the result!</p>`,

{title:'Scientific Measurement Tools',
content:`<h3>Choosing the Right Instrument</h3>
<p>Scientists always use the <strong>correct tool</strong> for the measurement. Using the wrong tool gives inaccurate data.</p>
<table style="width:100%;border-collapse:collapse;margin:6px 0;font-size:.88rem">
<tr style="background:#1565c0;color:#fff"><th style="padding:5px">Instrument</th><th style="padding:5px">Measures</th><th style="padding:5px">Unit</th></tr>
<tr style="background:#e3f2fd"><td style="padding:5px">Ruler / Tape measure</td><td style="padding:5px">Length, height, width</td><td style="padding:5px">cm, m, mm</td></tr>
<tr><td style="padding:5px">Measuring cylinder</td><td style="padding:5px">Volume of liquid</td><td style="padding:5px">mL, cm³</td></tr>
<tr style="background:#e3f2fd"><td style="padding:5px">Thermometer</td><td style="padding:5px">Temperature</td><td style="padding:5px">°C</td></tr>
<tr><td style="padding:5px">Balance (scale)</td><td style="padding:5px">Mass</td><td style="padding:5px">g, kg</td></tr>
<tr style="background:#e3f2fd"><td style="padding:5px">Stopwatch</td><td style="padding:5px">Time</td><td style="padding:5px">seconds (s), minutes</td></tr>
</table>
<p>Always read a measuring cylinder at <strong>eye level</strong> — read the bottom of the curved meniscus.</p>`,

{title:'Choosing the Right Graph Type',
content:`<h3>Presenting Your Data Clearly</h3>
<p>The type of data you collected determines which graph is best. Choosing the wrong graph type is a common exam mistake.</p>
<ul>
<li>📊 <strong>Bar chart</strong>: use when the x-axis has <em>categories</em> (discrete groups like soil types, colours, names)</li>
<li>📈 <strong>Line graph</strong>: use when the x-axis is <em>continuous</em> (numbers like time, temperature, volume)</li>
<li>🥧 <strong>Pie chart</strong>: use to show <em>proportions</em> (parts of a whole, usually as percentages)</li>
</ul>
<p>All graphs must have: a <strong>title</strong>, labeled <strong>axes with units</strong>, and an appropriate <strong>scale starting at 0</strong>.</p>`,

{title:'The 6 Scientific Skills',
content:`<h3>Skills Scientists Use Every Day</h3>
<p>Science is not only about knowing facts — it is about using <strong>process skills</strong>. These 6 skills are used at every stage of an investigation and are tested in your exam.</p>
<ul>
<li>🔍 <strong>Observing</strong> — using your 5 senses to gather information</li>
<li>📏 <strong>Measuring</strong> — using instruments to get accurate, numerical data</li>
<li>🗂️ <strong>Classifying</strong> — grouping things by shared features</li>
<li>💡 <strong>Predicting</strong> — saying what will happen BEFORE the experiment</li>
<li>🧪 <strong>Experimenting</strong> — planning and carrying out a fair test</li>
<li>📢 <strong>Communicating</strong> — sharing results using tables, graphs, reports</li>
</ul>`,

{title:'Scientific Method — Full Flowchart',
content:`<h3>All Steps in Order</h3>
<p>Every scientific investigation follows the same logical path. This flowchart is the complete scientific method — memorise the ORDER of steps and what each one involves.</p>
<ul>
<li>🔁 If the conclusion does NOT support the hypothesis, you form a <strong>new hypothesis</strong> and repeat</li>
<li>✏️ If results are unexpected, they are still valuable — they show something new to investigate</li>
<li>📋 Scientists <strong>repeat experiments</strong> and <strong>share results</strong> so others can check them</li>
</ul>`,
visual:`<svg viewBox="0 0 420 250" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">

  <line x1="232" y1="43" x2="252" y2="43" stroke="#333" stroke-width="1.5" marker-end="url(#da)"/>

  <rect x="254" y="25" width="155" height="36" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>

{title:'Good Data vs Poor Data',
content:`<h3>Why Data Quality Matters</h3>
<p>Even a good experiment can give <strong>unreliable results</strong> if the data is not collected carefully. You must know the difference between good and poor experimental practice.</p>
<table style="width:100%;border-collapse:collapse;margin:6px 0;font-size:.88rem">
<tr style="background:#1565c0;color:#fff"><th style="padding:5px">Source of Error</th><th style="padding:5px">Problem</th><th style="padding:5px">Improvement</th></tr>
<tr style="background:#e3f2fd"><td style="padding:5px">Only 1 trial</td><td style="padding:5px">Result may be a fluke</td><td style="padding:5px">Repeat at least 3 times, calculate mean</td></tr>
<tr><td style="padding:5px">Eye not level when reading cylinder</td><td style="padding:5px">Parallax error — wrong reading</td><td style="padding:5px">Read at eye level (bottom of meniscus)</td></tr>
<tr style="background:#e3f2fd"><td style="padding:5px">Different sized pots</td><td style="padding:5px">Unfair test — another variable changed</td><td style="padding:5px">Use identical pots for all plants</td></tr>
<tr><td style="padding:5px">Estimating instead of measuring</td><td style="padding:5px">Inaccurate, not reproducible</td><td style="padding:5px">Always use a measuring instrument</td></tr>
</table>`,
visual:`<svg viewBox="0 0 420 225" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">
  <text x="210" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Poor Experiment vs Good Experiment</text>
  <!-- POOR (left) -->
  <rect x="10" y="22" width="190" height="170" rx="8" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
  <text x="105" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">✗ POOR EXPERIMENT</text>
  <!-- Poor elements -->
  <rect x="20" y="48" width="170" height="24" rx="5" fill="#fff" stroke="#e53935" stroke-width="1"/>
  <text x="105" y="64" text-anchor="middle" font-size="9" fill="#555">Different pot sizes used</text>
  <rect x="20" y="80" width="170" height="24" rx="5" fill="#fff" stroke="#e53935" stroke-width="1"/>
  <text x="105" y="96" text-anchor="middle" font-size="9" fill="#555">Only tested once (1 trial)</text>
  <rect x="20" y="112" width="170" height="24" rx="5" fill="#fff" stroke="#e53935" stroke-width="1"/>
  <text x="105" y="128" text-anchor="middle" font-size="9" fill="#555">Estimated measurements</text>
  <rect x="20" y="144" width="170" height="24" rx="5" fill="#fff" stroke="#e53935" stroke-width="1"/>
  <text x="105" y="160" text-anchor="middle" font-size="9" fill="#555">Changed 2 variables at once</text>
  <!-- Result: unreliable -->
  <text x="105" y="185" text-anchor="middle" font-size="10" fill="#c62828" font-weight="bold">Result: UNRELIABLE</text>
  <!-- GOOD (right) -->
  <rect x="220" y="22" width="190" height="170" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="315" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">✓ GOOD EXPERIMENT</text>
  <!-- Good elements -->
  <rect x="230" y="48" width="170" height="24" rx="5" fill="#fff" stroke="#2e7d32" stroke-width="1"/>
  <text x="315" y="64" text-anchor="middle" font-size="9" fill="#555">Identical pots (controlled)</text>
  <rect x="230" y="80" width="170" height="24" rx="5" fill="#fff" stroke="#2e7d32" stroke-width="1"/>
  <text x="315" y="96" text-anchor="middle" font-size="9" fill="#555">3 trials → calculate mean</text>
  <rect x="230" y="112" width="170" height="24" rx="5" fill="#fff" stroke="#2e7d32" stroke-width="1"/>
