<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Advanced Body Systems Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Advanced Body Systems — Std 7 Science Quiz',
  color:'#4527a0',dark:'#000070',light:'#ede7f6',
    mcq:[
    {q:'The part of the nervous system that controls voluntary actions is the:',opts:['Autonomic nervous system','Somatic nervous system','Peripheral nervous system','Sympathetic nervous system'],ans:1,exp:'The SOMATIC nervous system controls VOLUNTARY (conscious) actions — e.g. walking, talking, picking up objects. The AUTONOMIC system controls involuntary functions like heart rate, digestion, and breathing.'},
    {q:'Insulin is produced by the:',opts:['Liver','Kidneys','Pancreas','Adrenal glands'],ans:2,exp:'INSULIN is produced by the PANCREAS (by beta cells in the islets of Langerhans). Insulin lowers blood glucose by stimulating cells to absorb glucose. Lack of insulin → Type 1 diabetes.'},
    {q:'Which organ produces bile?',opts:['Stomach','Pancreas','Gallbladder','Liver'],ans:3,exp:'The LIVER produces BILE. Bile is STORED in the GALLBLADDER and released into the small intestine. Bile EMULSIFIES (breaks up) fats — turning fat globules into smaller droplets with more surface area for lipase enzymes to digest.'},
    {q:'The function of the lymphatic system is to:',opts:['Pump blood around the body','Filter and return tissue fluid to blood, and help fight infection','Produce hormones','Digest fats in the intestine'],ans:1,exp:'The LYMPHATIC SYSTEM: 1. Drains TISSUE FLUID back to blood. 2. Carries absorbed FATS from gut (lacteals). 3. IMMUNITY — lymph nodes filter pathogens; lymphocytes produce antibodies. Lymph vessels run alongside blood vessels.'},
    {q:'During exercise, which hormone is released that prepares the body for action?',opts:['Insulin','Oestrogen','Adrenaline','Glucagon'],ans:2,exp:'ADRENALINE is released by the ADRENAL GLANDS (on top of kidneys) during stress, fear, or exercise. It prepares the body for "FIGHT OR FLIGHT": increases heart rate, breathing rate, blood to muscles; dilates pupils; raises blood glucose.'},
    {q:'Which part of the brain is responsible for balance and coordinating muscle movements?',opts:['Cerebrum','Medulla oblongata','Cerebellum','Hypothalamus'],ans:2,exp:'The CEREBELLUM is responsible for BALANCE, POSTURE, and the COORDINATION of fine motor movements. It ensures smooth, controlled motions like walking or catching a ball.'},
    {q:'The functional unit of the kidney, where filtration and reabsorption occur, is the:',opts:['Glomerulus','Nephron','Ureter','Collecting duct'],ans:1,exp:'The NEPHRON is the microscopic functional unit of the kidney. There are over a million nephrons in each kidney. Each nephron consists of a glomerulus (filtration), Bowman\'s capsule, and tubules (reabsorption).'},
    {q:'Which gland in the brain releases hormones that control other endocrine glands?',opts:['Thyroid gland','Pituitary gland','Adrenal gland','Pancreas'],ans:1,exp:'The PITUITARY GLAND is often called the "master gland". It is located at the base of the brain and releases hormones (such as FSH and LH) that stimulate other glands (ovaries, testes, thyroid) to release their hormones.'},
    {q:'The breakdown of excess amino acids in the liver produces:',opts:['Glucose','Urea and ammonia','Bile','Glycogen'],ans:1,exp:'The LIVER breaks down excess amino acids in a process called DEAMINATION. This produces AMMONIA (which is converted into the less toxic UREA) and a carbohydrate residue that can be used for energy. Urea is excreted by the kidneys.'},
    {q:'Adrenaline increases blood glucose concentration by:',opts:['Stimulating the liver to convert glycogen to glucose','Increasing insulin production','Decreasing the heart rate','Stimulating fat storage'],ans:0,exp:'Adrenaline prepares the body for "fight or flight". One of its effects is to stimulate the LIVER to break down GLYCOGEN into GLUCOSE, providing an immediate energy boost for muscles.'},
    {q:'A synapse is a gap between:',opts:['Two muscles','Two neurons','A neuron and a gland','A sensory receptor and the skin'],ans:1,exp:'A SYNAPSE is the microscopic gap between the axon terminal of one NEURON and the dendrite of another NEURON (or an effector cell). Chemical messengers called neurotransmitters diffuse across this gap to transmit the impulse.'},
    {q:'The hormone responsible for controlling water reabsorption in the kidney is:',opts:['Insulin','Adrenaline','ADH (Anti-Diuretic Hormone)','Oestrogen'],ans:2,exp:'ADH (Anti-Diuretic Hormone) is released by the pituitary gland. It makes the collecting ducts of the kidney MORE PERMEABLE to water, meaning more water is reabsorbed back into the blood, producing a small volume of concentrated urine.'},
    {q:'Which of the following is NOT a function of the liver?',opts:['Storing glycogen','Detoxifying alcohol','Producing insulin','Producing bile'],ans:2,exp:'INSULIN is produced by the PANCREAS. The liver produces bile, stores glycogen, detoxifies alcohol, and carries out deamination. Insulin is not a liver function.'},
    {q:'The myelin sheath around an axon functions to:',opts:['Store nutrients for the neuron','Speed up the transmission of nerve impulses','Connect neurons to each other','Insulate the dendrites'],ans:1,exp:'The MYELIN SHEATH is a fatty insulating layer that wraps around the axon of a neuron. It speeds up nerve impulse transmission by allowing the impulse to "jump" from node to node (saltatory conduction).'},
    {q:'Glucagon is a hormone that:',opts:['Lowers blood glucose by converting glucose to glycogen','Raises blood glucose by converting glycogen to glucose','Increases the heart rate','Helps digest food'],ans:1,exp:'GLUCAGON is released by the pancreas when blood glucose is LOW. It stimulates the liver to break GLYCOGEN back into GLUCOSE, which is released into the blood to raise glucose levels.'},
    {q:'Which of the following is part of the peripheral nervous system?',opts:['Brain','Spinal cord','Cranial and spinal nerves','Hypothalamus'],ans:2,exp:'The PERIPHERAL NERVOUS SYSTEM (PNS) consists of all the nerves that branch out from the brain and spinal cord. These include CRANIAL nerves (from brain) and SPINAL nerves (from spinal cord). The brain and spinal cord form the CENTRAL nervous system.'},
    {q:'In a reflex arc, the role of the relay neuron is to:',opts:['Carry the impulse from the receptor to the spinal cord','Connect sensory neurons to motor neurons within the spinal cord','Carry the impulse to the effector','Detect the stimulus'],ans:1,exp:'The RELAY NEURON (or interneuron) is found entirely within the CNS (spinal cord). Its role is to CONNECT the SENSORY neuron to the MOTOR neuron, allowing the reflex arc to bypass the conscious brain.'},
    {q:'Reabsorption of glucose in the kidney occurs in the:',opts:['Glomerulus','Bowman\'s capsule','Proximal convoluted tubule','Collecting duct'],ans:2,exp:'The PROXIMAL CONVOLUTED TUBULE is responsible for the reabsorption of USEFUL substances, including GLUCOSE, amino acids, and some water and salts. Glucose is reabsorbed via active transport back into the blood.'},
    {q:'The pancreas produces both insulin and:',opts:['Adrenaline','Glucagon','Oestrogen','Bile'],ans:1,exp:'The PANCREAS is both an endocrine gland (releases insulin and glucagon into the blood) and an exocrine gland (releases digestive enzymes into the small intestine). It produces GLUCAGON to raise blood glucose levels when they fall too low.'},
    {q:'Which structure in the brain acts as the body\'s thermostat?',opts:['Cerebrum','Cerebellum','Hypothalamus','Medulla'],ans:2,exp:'The HYPOTHALAMUS is the body\'s thermostat. It monitors blood temperature and triggers responses (e.g., sweating, shivering, vasodilation) to bring the body back to 37°C. It also monitors water balance and thirst.'},
  ],
  match:[
    {term:'Cerebrum',def:'The largest part of the brain; responsible for conscious thought, memory, voluntary movement, and processing sensory information'},
    {term:'Cerebellum',def:'The part of the brain that coordinates balance, posture, and fine muscle movements'},
    {term:'Medulla oblongata',def:'The part of the brain that controls automatic, involuntary functions such as breathing, heart rate, and blood pressure'},
    {term:'Hypothalamus',def:'The brain region responsible for maintaining homeostasis, including temperature regulation, thirst, hunger, and controlling the pituitary gland'},
    {term:'Hormone',def:'A chemical messenger produced by an endocrine gland and transported in the blood to target organs'},
    {term:'Nephron',def:'The microscopic structural and functional unit of the kidney where filtration and reabsorption take place'},
    {term:'Bile',def:'A fluid produced by the liver, stored in the gallbladder, and released into the small intestine to emulsify fats'},
    {term:'Insulin',def:'A hormone released by the pancreas that lowers blood glucose concentration by stimulating the absorption of glucose into cells and storage as glycogen'},
    {term:'Glucagon',def:'A hormone released by the pancreas that raises blood glucose concentration by stimulating the liver to break down glycogen into glucose'},
    {term:'Adrenaline',def:'A hormone released by the adrenal glands during stress that prepares the body for "fight or flight" by increasing heart rate and blood glucose'},
    {term:'ADH',def:'Anti-Diuretic Hormone; released by the pituitary gland to increase water reabsorption in the kidney collecting ducts'},
    {term:'Synapse',def:'The microscopic gap between neurons, across which neurotransmitters diffuse to transmit a nerve impulse'},
    {term:'Myelin sheath',def:'A fatty insulating layer around the axon of a neuron that speeds up the transmission of nerve impulses'},
    {term:'Reflex arc',def:'A rapid, automatic nerve pathway that bypasses the brain to respond to a stimulus quickly'},
    {term:'Sensory neuron',def:'A nerve cell that carries impulses from receptors to the central nervous system'},
    {term:'Motor neuron',def:'A nerve cell that carries impulses from the central nervous system to effectors (muscles or glands)'},
    {term:'Relay neuron',def:'A neuron located in the central nervous system that connects sensory neurons to motor neurons'},
    {term:'Endocrine gland',def:'A gland that secretes hormones directly into the bloodstream without a duct (e.g., pituitary, pancreas, adrenal)'},
    {term:'Target organ',def:'An organ or tissue that has specific receptors for a hormone and responds to its presence'},
    {term:'Homeostasis',def:'The maintenance of a constant internal environment in the body, despite external changes (e.g., temperature, blood glucose, water balance)'},
  ],
  flashcards:[
    {q:'Describe the pathway of a nerve impulse in a simple reflex arc.',a:'RECEPTOR (detects stimulus) → SENSORY NEURON → RELAY NEURON (in spinal cord) → MOTOR NEURON → EFFECTOR (muscle or gland). This bypasses the brain for speed.'},
    {q:'Explain how insulin and glucagon work together to regulate blood glucose levels.',a:'After a meal, glucose RISES → PANCREAS releases INSULIN → cells absorb glucose; liver stores glucose as GLYCOGEN → blood glucose falls. Between meals, glucose FALLS → PANCREAS releases GLUCAGON → liver breaks glycogen to glucose → blood glucose rises. This is a NEGATIVE FEEDBACK loop.'},
    {q:'Describe the structure and function of a nephron.',a:'NEPHRON structure: 1. GLOMERULUS (knot of capillaries) filters blood into BOWMAN\'S CAPSULE. 2. PROXIMAL TUBULE reabsorbs glucose, amino acids, water. 3. LOOP OF HENLE creates a salt concentration gradient. 4. DISTAL TUBULE and COLLECTING DUCT adjust water reabsorption under the control of ADH.'},
    {q:'Compare the nervous system and the endocrine system.',a:'NERVOUS: uses electrical impulses along neurones; VERY FAST (milliseconds); SHORT-LIVED effects; very LOCALISED (specific targets). ENDOCRINE: uses chemical hormones in blood; SLOWER (seconds to minutes/hours); LONGER-LASTING effects; WIDESPREAD. Both systems coordinate body functions.'},
    {q:'Explain why the liver is considered a highly active metabolic organ.',a:'The LIVER performs many functions: 1. DEAMINATION — breaks excess amino acids into urea. 2. STORES GLYCOGEN (controls blood glucose). 3. PRODUCES BILE. 4. DETOXIFIES alcohol, drugs, and toxins. 5. SYNTHESISES plasma proteins and blood clotting factors. 6. STORES iron and fat-soluble vitamins (A, D, E, K).'},
    {q:'Explain how ADH helps the body control water balance.',a:'When blood is too concentrated (dehydrated), osmoreceptors in the hypothalamus stimulate the PITUITARY to release ADH. ADH increases the PERMEABILITY of the collecting duct walls in the kidney, allowing MORE water to be reabsorbed, producing CONCENTRATED urine and restoring water balance.'},
    {q:'Describe the effects of adrenaline on the body.',a:'ADRENALINE is the "fight or flight" hormone. Effects: 1. Increases HEART RATE. 2. Increases BREATHING RATE. 3. Increases BLOOD GLUCOSE (liver converts glycogen to glucose). 4. Dilates the PUPILS. 5. Diverts blood to MUSCLES and away from digestion and skin.'},
    {q:'What are the differences between the somatic and autonomic nervous systems?',a:'SOMATIC: controls VOLUNTARY movements of skeletal muscles; conscious control; single neuron pathway from CNS to muscle. AUTONOMIC: controls INVOLUNTARY functions (heart, gut, glands); subconscious control; two-neuron pathway. Divided into sympathetic (stress) and parasympathetic (rest).'},
    {q:'Explain why the pituitary gland is called the "master gland".',a:'The PITUITARY GLAND (at base of brain) produces hormones that STIMULATE other endocrine glands. For example, it releases FSH to stimulate the ovaries and TSH to stimulate the thyroid. It also produces ADH and growth hormone, controlling many body functions.'},
    {q:'Describe what happens during a synapse transmission.',a:'Impulse reaches the PRE-SYNAPTIC KNOB → vesicles fuse with membrane → NEUROTRANSMITTERS are released into the synaptic cleft → they DIFFUSE across the gap → bind to RECEPTORS on the POST-SYNAPTIC membrane → new impulse is generated (or inhibited).'},
    {q:'What is the function of the myelin sheath?',a:'The MYELIN SHEATH is a fatty insulating layer surrounding the axon. It speeds up impulse transmission by allowing the electrical signal to "jump" between Nodes of Ranvier (saltatory conduction). It also insulates the axon.'},
    {q:'How does the liver handle excess protein in the diet?',a:'The liver breaks down excess amino acids through DEAMINATION. The amino group is removed, forming ammonia (NH₃), which is converted into the less toxic UREA. The remaining carbon skeleton is used for energy. Urea is excreted by the kidneys.'},
    {q:'Compare the endocrine and exocrine functions of the pancreas.',a:'ENDOCRINE: The Islets of Langerhans produce INSULIN and GLUCAGON directly into the blood to regulate blood sugar. EXOCRINE: The acinar cells produce digestive ENZYMES (amylase, lipase, trypsin) which are released via ducts into the small intestine to digest food.'},
    {q:'Why does the liver store glucose as glycogen rather than as glucose?',a:'GLYCOGEN is an insoluble polysaccharide. If the liver stored glucose (soluble), it would draw water into the cells by osmosis, causing them to swell. Glycogen is stored as insoluble granules without disrupting water balance.'},
    {q:'What is the effect of a lack of ADH production?',a:'Lack of ADH leads to DIABETES INSIPIDUS. The collecting ducts in the kidneys do not reabsorb enough water. The patient produces a very LARGE VOLUME of DILUTE urine and experiences constant thirst.'},
    {q:'How does the nervous system help the body maintain homeostasis?',a:'The NERVOUS system, especially the HYPOTHALAMUS, monitors internal conditions (temperature, water, blood glucose). It sends nerve impulses to effectors (muscles, glands) to make rapid corrective responses, such as sweating to cool down, or shivering to warm up.'},
    {q:'Describe the role of the kidney nephron in glucose reabsorption.',a:'Glucose is filtered from the blood in the GLOMERULUS and enters the Bowman\'s capsule. All glucose is actively REABSORBED in the PROXIMAL CONVOLUTED TUBULE and returned to the blood. If blood glucose is too high (diabetes), the carriers are overwhelmed, and glucose appears in the urine.'},
    {q:'What is the difference between a hormone and a neurotransmitter?',a:'HORMONES are chemical messengers released by ENDOCRINE glands into the BLOOD, affecting target organs over a wider area and longer time. NEUROTRANSMITTERS are chemicals released at SYNAPSES, diffusing across a tiny gap to affect the next neuron or effector rapidly.'},
    {q:'Explain why the sympathetic nervous system and adrenaline have similar effects.',a:'The SYMPATHETIC nervous system (part of the autonomic system) and ADRENALINE both prepare the body for "fight or flight". The nervous system provides a rapid, immediate response, while adrenaline release sustains the response for longer.'},
    {q:'How does the liver contribute to the immune system?',a:'The liver produces many PROTEINS involved in the immune response, including ACUTE PHASE PROTEINS (like C-reactive protein) and components of the COMPLEMENT SYSTEM. It also filters blood from the gut via the hepatic portal vein, removing toxins and pathogens before they enter general circulation.'},
  ],
  blanks:{
    passage:'The largest part of the brain, responsible for conscious thought and memory, is the [_]. The part that coordinates balance and movement is the [_]. Chemical messengers produced by glands and carried in the blood are called [_]. When blood glucose levels rise, the pancreas releases [_], which stimulates cells to absorb glucose. Under stress, the adrenal glands release [_], which prepares the body for a rapid response by increasing heart rate and blood glucose.',
    answers:['cerebrum','cerebellum','hormones','insulin','adrenaline'],
    wordbank:['cerebrum','cerebellum','hormones','insulin','adrenaline','glucagon','medulla','enzymes'],
  },
  sentences:[
    {prompt:'Explain why a reflex action (like pulling your hand away from a hot stove) is significantly faster than a voluntary action, such as deciding to lift a book.',keywords:['spinal cord','brain','short pathway','sensory neuron','motor neuron','relay neuron','reflex arc','no conscious decision','fast'],hint:'Where does the reflex arc bypass that a voluntary action must pass through? How does this make the pathway shorter and the response faster?'},
    {prompt:'Explain what would happen to a person\'s blood glucose levels if their pancreas stopped producing insulin. What disease would they develop?',keywords:['high blood glucose','cells cannot absorb glucose','diabetes','hyperglycaemia','glucose in urine','Type 1 diabetes','beta cells','pancreas'],hint:'What is the primary role of insulin in the body? What happens to glucose in the blood when this hormone is absent?'},
    {prompt:'Explain why a person who has just completed an intense sprint continues to breathe deeply for several minutes even after they have stopped running.',keywords:['oxygen debt','lactic acid','CO₂','blood pH','medulla','breathing rate','anaerobic respiration','oxidise'],hint:'What chemical product accumulates in the muscles during intense exercise? What must happen to this product after the exercise stops?'},
    {prompt:'Explain how ADH (Anti-Diuretic Hormone) helps the kidneys regulate water balance in the body when a person is dehydrated.',keywords:['dehydration','ADH','pituitary gland','collecting duct','permeability','water reabsorption','concentrated urine','osmoregulation'],hint:'When the body is low on water, which gland releases ADH? What effect does ADH have on the permeability of the kidney tubules, and how does this affect urine volume and concentration?'},
    {prompt:'Compare the roles of insulin and glucagon in maintaining blood glucose homeostasis.',keywords:['insulin','glucagon','blood glucose','pancreas','glycogen','liver','negative feedback','regulate'],hint:'Which hormone is released when blood glucose is high? Which is released when it is low? What does each hormone signal the liver to do?'},
    {prompt:'Describe the structure and functions of a nephron in the kidney.',keywords:['glomerulus','Bowman\'s capsule','ultrafiltration','proximal tubule','reabsorption','loop of Henle','collecting duct','urine','ADH'],hint:'What happens at the glomerulus? Where is glucose reabsorbed? Where does the final adjustment of water occur under the control of ADH?'},
    {prompt:'Explain the role of the hypothalamus in maintaining body temperature.',keywords:['hypothalamus','thermostat','37°C','temperature','sweating','vasodilation','shivering','homeostasis'],hint:'What part of the brain monitors blood temperature? What responses does it trigger when the body is too hot or too cold?'},
    {prompt:'Describe the role of the myelin sheath in the nervous system.',keywords:['myelin sheath','axon','insulation','saltatory conduction','speed','impulse','nodes of Ranvier','fatty layer'],hint:'How does the myelin sheath affect the speed of a nerve impulse? What physical property makes it effective?'},
    {prompt:'Explain how the liver breaks down excess amino acids and what happens to the waste product.',keywords:['liver','deamination','amino acids','excess','urea','ammonia','excretion','kidneys'],hint:'What is the process called when the liver removes the nitrogenous part of an amino acid? What is the waste product formed and which organ removes it?'},
    {prompt:'Explain why the pituitary gland is often referred to as the "master gland".',keywords:['pituitary gland','master gland','hormones','stimulate','thyroid','FSH','LH','endocrine'],hint:'Why does the pituitary gland have influence over so many other glands in the body? What does it release to make these other glands work?'},
    {prompt:'Describe the events that occur at a synapse between two neurons.',keywords:['synapse','vesicles','neurotransmitters','diffuse','receptors','post-synaptic','gap','chemical'],hint:'How does an electrical impulse cross the physical gap between two neurons? What chemicals are involved?'},
    {prompt:'Explain how adrenaline prepares the body for a "fight or flight" response.',keywords:['adrenaline','fight or flight','heart rate','breathing','blood glucose','muscles','pupils','stress'],hint:'What are the immediate physical effects of adrenaline release on the heart, breathing, and energy supply?'},
    {prompt:'Compare the nervous system and the endocrine system in terms of speed, mode of action, and duration of effect.',keywords:['nervous','electrical impulses','fast','short-lived','endocrine','hormones','slow','long-lasting','blood','neurons'],hint:'How do these two systems differ in how they send messages and how quickly and long they affect the body?'},
    {prompt:'Explain why glucose does not normally appear in the urine of a healthy person.',keywords:['glomerulus','filtered','glucose','reabsorption','proximal tubule','active transport','carrier proteins','urine'],hint:'What happens to glucose after it is filtered from the blood into the kidney nephron? Is it excreted or returned to the body?'},
    {prompt:'Describe the role of the somatic nervous system and the autonomic nervous system.',keywords:['somatic','voluntary','skeletal muscle','autonomic','involuntary','heart','digestion','glands'],hint:'One system controls conscious movements; the other controls involuntary processes. What is the target of each system?'},
    {prompt:'Explain why the liver is a vital organ for maintaining homeostasis in the body.',keywords:['liver','homeostasis','glycogen','glucose','urea','bile','detoxification','plasma proteins'],hint:'List at least three different ways the liver helps keep the body\'s internal environment stable.'},
    {prompt:'Compare a reflex arc to a conscious response.',keywords:['reflex arc','spinal cord','relay neuron','fast','conscious response','brain','processing','slow'],hint:'How does the pathway differ? Which one involves the brain\'s conscious decision-making?'},
    {prompt:'Explain what would happen to blood glucose levels if the pancreas stopped producing glucagon.',keywords:['glucagon','blood glucose','glycogen','liver','low blood sugar','hypoglycaemia','pancreas'],hint:'When does the pancreas release glucagon? What would happen to blood sugar levels between meals without this hormone?'},
    {prompt:'Describe the response of the body to a drop in core body temperature.',keywords:['hypothalamus','vasoconstriction','shivering','goosebumps','hair','insulation','heat','temperature'],hint:'What physical mechanisms does the body use to generate heat and reduce heat loss when it gets too cold?'},
    {prompt:'Explain how the nervous system coordinates a rapid withdrawal response when you touch a sharp object.',keywords:['receptor','sensory neuron','spinal cord','relay neuron','motor neuron','muscle','withdrawal','reflex'],hint:'Trace the neural pathway from the finger to the muscle that pulls the hand away. Where does the impulse bypass the brain?'},
  ],
});
</script></body></html>
