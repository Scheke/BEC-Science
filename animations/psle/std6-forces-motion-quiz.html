<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Forces and Motion Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Forces & Motion — Std 6 Science Quiz',
  color:'#1565c0',dark:'#003c8f',light:'#e3f2fd',
   mcq:[
    {q:'A force is measured in units called:',opts:['Kilograms','Metres per second','Newtons','Joules'],ans:2,exp:'Forces are measured in NEWTONS (N), named after Sir Isaac Newton. Force = mass × acceleration. Weight is also measured in Newtons — weight = mass × g, where g = 10 N/kg on Earth.'},
    {q:'When all forces on an object are balanced, the object will:',opts:['Always stay still','Speed up','Stay still or continue moving at constant speed','Slow down and stop'],ans:2,exp:'BALANCED FORCES (net force = 0): the object stays at rest OR continues moving at CONSTANT SPEED in a straight line. This is Newton\'s First Law. Unbalanced forces cause acceleration or deceleration.'},
    {q:'Friction is a force that:',opts:['Speeds objects up','Acts in the direction of motion','Opposes motion and creates heat','Pulls objects downward'],ans:2,exp:'FRICTION acts OPPOSITE to the direction of motion. It slows things down and converts kinetic energy to HEAT. Useful: stopping cars, writing with a pen. Harmful: wears out car engines, slows machinery.'},
    {q:'What is the difference between mass and weight?',opts:['They are the same thing','Mass is a force, weight is not','Mass is the amount of matter (kg); weight is the gravitational force on that mass (N)','Weight is measured in kg'],ans:2,exp:'MASS: amount of matter in a body — measured in kg — SAME everywhere. WEIGHT: force of gravity on that mass — measured in Newtons — CHANGES with gravity. On Moon: same mass, but weight = 1/6 of Earth weight.'},
    {q:'A car decelerates (slows down). The resultant force acts:',opts:['In the direction of travel','Opposite to the direction of travel','Perpendicular to motion','There is no force'],ans:1,exp:'DECELERATION means the car is slowing down. The resultant force (e.g. from brakes/friction) acts OPPOSITE to the direction of travel — this is the "unbalanced force" causing the deceleration. Friction decelerates; engine force accelerates.'},
    {q:'If an object has a mass of 10 kg, what is its weight on Earth? (g = 10 N/kg)',opts:['1 N','10 N','100 N','1000 N'],ans:2,exp:'Weight = mass × g = 10 kg × 10 N/kg = 100 N. The object weighs 100 Newtons on Earth. On the Moon (g ≈ 1.6 N/kg), it would weigh 16 N.'},
    {q:'Which force pulls objects toward the centre of the Earth?',opts:['Friction','Magnetism','Gravity','Tension'],ans:2,exp:'GRAVITY is the force of attraction between masses. On Earth, gravity pulls everything toward the centre of the planet, giving them WEIGHT.'},
    {q:'When a force is unbalanced, an object will:',opts:['Stay still','Change its speed, direction, or both (accelerate)','Move at constant speed','Stop immediately'],ans:1,exp:'UNBALANCED FORCES cause a change in motion — an ACCELERATION. This means the object speeds up, slows down, or changes direction. Balanced forces keep the object at rest or constant speed.'},
    {q:'Air resistance is a type of:',opts:['Magnetic force','Frictional force (drag)','Gravitational force','Elastic force'],ans:1,exp:'AIR RESISTANCE (also called DRAG) is a frictional force that opposes the motion of an object through the air. It is caused by the object colliding with air particles as it moves.'},
    {q:'The force of gravity on Earth is approximately:',opts:['1 N/kg','10 N/kg','100 N/kg','1000 N/kg'],ans:1,exp:'The gravitational field strength on Earth (g) is approximately 10 N/kg (or 9.8 N/kg for greater precision). This means that a 1 kg mass has a weight of 10 N.'},
    {q:'If you push a wall and it does not move, what can you conclude about the forces?',opts:['The wall is not pushing back','Your push is a balanced force','You are not applying enough force','The forces are unbalanced'],ans:1,exp:'The wall exerts an EQUAL and OPPOSITE force back on your hands. Since the wall does not move, the forces are BALANCED. This is an application of Newton\'s Third Law.'},
    {q:'How does friction affect a rolling ball?',opts:['It speeds the ball up','It keeps the ball moving forever','It slows the ball down','It changes the ball\'s colour'],ans:2,exp:'Friction between the ball and the ground OPPOSES the motion of the ball, causing it to SLOW DOWN. The kinetic energy of the moving ball is converted into HEAT and sound.'},
    {q:'A 2 kg object is lifted on Earth. Its mass is 2 kg. If taken to the Moon:',opts:['Its mass changes to 0.3 kg','Its weight remains the same','Its mass stays 2 kg, but its weight changes','Both mass and weight change'],ans:2,exp:'MASS is constant (the amount of matter stays the same, 2 kg). WEIGHT depends on gravitational field strength, so it changes. On the Moon (g ≈ 1.6 N/kg), its weight would be 3.2 N compared to 20 N on Earth.'},
    {q:'When a skydiver first jumps from a plane, the net force is:',opts:['Zero','Downward and unbalanced (gravity > air resistance)','Upward and unbalanced (air resistance > gravity)','Sideways'],ans:1,exp:'At the start, gravity is much greater than air resistance. The net (resultant) force acts DOWNWARD, causing the skydiver to ACCELERATE toward the ground.'},
    {q:'A ball is thrown up into the air. At the very top of its path:',opts:['There are no forces acting on it','The forces are balanced','The force of gravity is still acting downward','The ball is weightless'],ans:2,exp:'Even at the peak, the force of GRAVITY is still acting DOWNWARD on the ball. It is the only force acting (ignoring air resistance) — so it is UNBALANCED and causes the ball to accelerate back down.'},
    {q:'The force that prevents a car from skidding on a wet road is:',opts:['Gravity','Magnetism','Friction','Tension'],ans:2,exp:'FRICTION between the tyres and the road provides the grip needed to accelerate, brake, and turn. When the road is wet, friction is reduced, making skidding more likely.'},
    {q:'If an object is moving at constant velocity, the net force acting on it is:',opts:['Large','Small','Zero','Constantly changing'],ans:2,exp:'Newton\'s First Law: if the net force is ZERO, an object will continue to move at CONSTANT VELOCITY. This means all forces acting on it are balanced.'},
    {q:'When a car engine provides a forward force that is GREATER than the friction and air resistance, the car will:',opts:['Slow down','Move at constant speed','Accelerate','Stop instantly'],ans:2,exp:'If the forward force is GREATER than the opposing forces, there is an UNBALANCED force in the forward direction. According to Newton\'s Second Law (F = ma), this causes ACCELERATION.'},
    {q:'A 60 kg person stands on a bathroom scale. What does the scale read?',opts:['60 kg','60 N','600 N','6 N'],ans:2,exp:'The scale measures weight. Weight = mass × g = 60 kg × 10 N/kg = 600 N. The scale might display "60 kg" if it is calibrated to show mass, but the actual force exerted is 600 Newtons.'},
    {q:'How does a parachute help a skydiver land safely?',opts:['It increases gravity','It increases air resistance, reducing speed','It reduces mass','It turns off gravity'],ans:1,exp:'The parachute has a large surface area, which GREATLY INCREASES AIR RESISTANCE (drag). This provides a large upward force that opposes gravity, allowing the skydiver to reach a slow, safe terminal velocity.'},
  ],
  match:[
    {term:'Gravity',def:'A non-contact force that pulls all masses toward each other; gives objects their weight on Earth'},
    {term:'Friction',def:'A contact force that opposes the relative motion between two surfaces in contact; converts kinetic energy into heat'},
    {term:'Air resistance (drag)',def:'A type of frictional force that opposes the motion of an object as it moves through air or another fluid'},
    {term:'Newton (N)',def:'The SI unit of force; 1 N is the force required to accelerate a 1 kg mass by 1 m/s²'},
    {term:'Weight',def:'The gravitational force acting on an object\'s mass; calculated as Weight = mass × gravitational field strength (W = mg)'},
    {term:'Mass',def:'The amount of matter in an object; measured in kilograms (kg) and is constant everywhere in the universe'},
    {term:'Balanced forces',def:'Forces that are equal in magnitude and opposite in direction; result in zero net force and no acceleration'},
    {term:'Unbalanced forces',def:'Forces that are not equal and opposite; result in a net force that causes acceleration (change in speed or direction)'},
    {term:'Terminal velocity',def:'The constant maximum velocity reached when the upward force of air resistance equals the downward force of weight (net force = 0)'},
    {term:'Streamlining',def:'Designing an object with a smooth, pointed shape to reduce air resistance and make it move more efficiently'},
    {term:'Normal reaction force',def:'The force exerted by a surface perpendicular to the surface, supporting an object and preventing it from falling through'},
    {term:'Tension',def:'The pulling force transmitted through a string, rope, or cable when it is pulled tight'},
    {term:'Thrust',def:'The forward force produced by an engine or motor that drives an object forward'},
    {term:'Net force (resultant force)',def:'The single force that has the same effect as all the individual forces acting on an object combined'},
    {term:'Inertia',def:'The tendency of an object to resist any change in its state of rest or motion'},
    {term:'Newton\'s First Law',def:'An object at rest stays at rest, and an object in motion stays in motion at constant velocity, unless acted upon by a net external force'},
    {term:'Newton\'s Second Law',def:'The net force acting on an object equals the product of its mass and acceleration (F = ma)'},
    {term:'Newton\'s Third Law',def:'For every action force, there is an equal and opposite reaction force acting on a different object'},
    {term:'Acceleration',def:'The rate of change of velocity; caused by an unbalanced force (a = F/m)'},
    {term:'Deceleration',def:'A negative acceleration caused by an unbalanced force acting opposite to the direction of motion'},
  ],
  flashcards:[
    {q:'State Newton\'s First, Second, and Third Laws of Motion in simple terms.',a:'1st LAW (Inertia): An object stays at rest or moves at constant velocity unless acted upon by an unbalanced force. 2nd LAW: Force = mass × acceleration (F = ma). 3rd LAW: For every action, there is an EQUAL and OPPOSITE reaction acting on a different object.'},
    {q:'A mass of 5 kg is on Earth (g = 10 N/kg). What is its weight? What would its weight be on the Moon (g ≈ 1.6 N/kg)?',a:'On Earth: Weight = mass × g = 5 kg × 10 N/kg = 50 N. On the Moon: Weight = 5 kg × 1.6 N/kg = 8 N. The MASS stays 5 kg everywhere, but the WEIGHT changes because the gravitational field strength is different.'},
    {q:'Give 2 examples where friction is useful and 2 where it is a problem (harmful).',a:'USEFUL: 1. Car brakes — friction slows the wheels and stops the car. 2. Shoe soles/tyres — friction provides grip to prevent slipping. HARMFUL: 1. Moving engine parts — friction causes wear and generates unwanted heat. 2. Air resistance — slows down vehicles and wastes fuel. Lubricants (oil, grease) are used to reduce harmful friction.'},
    {q:'Explain how a skydiver reaches terminal velocity.',a:'When the skydiver jumps, gravity > air resistance → ACCELERATES downward. As speed increases, air resistance (drag) INCREASES. Eventually, air resistance equals gravity → forces are BALANCED → terminal velocity (constant speed, zero acceleration). When the parachute opens, air resistance increases greatly → decelerates until a slower, safe terminal velocity is reached.'},
    {q:'How does streamlining reduce air resistance?',a:'Streamlining gives an object a smooth, pointed shape that allows air to flow smoothly around it instead of being pushed aside violently. This reduces the DRAG FORCE (air resistance). Cars, aeroplanes, and fish have streamlined shapes to move efficiently with less energy wasted.'},
    {q:'Describe the difference between mass and weight.',a:'MASS is the amount of matter in an object (kg). It is SCALAR and CONSTANT everywhere in the universe. WEIGHT is the GRAVITATIONAL force acting on that mass (N). It is a VECTOR and CHANGES depending on the gravitational field strength (W = mg).'},
    {q:'Calculate the weight of a 70 kg person on Earth and on the Moon.',a:'On Earth (g = 10 N/kg): Weight = 70 kg × 10 N/kg = 700 N. On the Moon (g ≈ 1.6 N/kg): Weight = 70 kg × 1.6 N/kg = 112 N. The person\'s mass is 70 kg in both locations.'},
    {q:'Explain why a heavy truck takes longer to stop than a light car travelling at the same speed.',a:'MOMENTUM = mass × velocity. The heavy truck has a much greater momentum than the light car at the same speed. To stop the truck, a greater force or a longer braking time is needed to change its momentum to zero.'},
    {q:'What is the net force acting on an object moving at constant velocity?',a:'The net (resultant) force is ZERO. According to Newton\'s First Law, if the net force is zero, the object will maintain its current state of motion — either at REST or moving at CONSTANT VELOCITY. The forces acting on it are balanced.'},
    {q:'Explain how a seatbelt helps protect a passenger during a sudden car crash.',a:'A seatbelt provides a force that restrains the passenger, slowing them down over a longer distance/time. This reduces the DECELERATION. According to F = ma, a smaller deceleration means a smaller force on the passenger, reducing the risk of injury.'},
    {q:'A 1000 kg car accelerates at 2 m/s². What is the net force acting on it?',a:'F = ma = 1000 kg × 2 m/s² = 2000 N. A net force of 2000 Newtons is needed to produce this acceleration.'},
    {q:'Why do cars have tyres with tread patterns?',a:'Tread patterns increase FRICTION by providing more grip between the tyre and the road surface. This prevents slipping, especially on wet or uneven roads, making braking and cornering safer.'},
    {q:'Explain what happens to the forces on a skydiver when they first jump out of a plane.',a:'Initially, GRAVITY (downward) is much greater than AIR RESISTANCE (upward). The net force is downward and UNBALANCED, so the skydiver ACCELERATES toward the ground. As they fall faster, air resistance increases until it equals gravity.'},
    {q:'If the forces on an object are unbalanced, what will happen to its motion?',a:'Unbalanced forces cause ACCELERATION. This means the object will: 1. Speed up, 2. Slow down, or 3. Change direction. The acceleration is directly proportional to the net force and inversely proportional to the mass (a = F/m).'},
    {q:'Calculate the mass of an object that has a weight of 500 N on Earth.',a:'Mass = Weight / g = 500 N / 10 N/kg = 50 kg. The object has a mass of 50 kg on Earth, and its mass would still be 50 kg anywhere in the universe.'},
    {q:'Explain the effect of air resistance on a falling object.',a:'Air resistance is a force that acts OPPOSITE to the object\'s motion. As the object falls faster, air resistance increases. It reduces the acceleration of the object and eventually leads to a constant speed called terminal velocity when it balances with gravity.'},
    {q:'A box is pushed with a force of 50 N to the right and experiences friction of 30 N to the left. What is the net force and will the box accelerate?',a:'Net force = 50 N (right) - 30 N (left) = 20 N to the right. Since the net force is not zero, the forces are UNBALANCED and the box WILL accelerate to the right.'},
    {q:'Why do aeroplanes have a streamlined shape?',a:'A streamlined shape reduces AIR RESISTANCE (drag). This allows the aeroplane to fly more efficiently, using less fuel to maintain speed because the force opposing its motion is smaller.'},
    {q:'What is the relationship between mass and inertia?',a:'INERTIA is the resistance of an object to a change in its state of motion. MASS is a measure of inertia. The greater the mass of an object, the GREATER its inertia, and the harder it is to change its speed or direction.'},
    {q:'Explain why a bullet train cannot stop instantly.',a:'A bullet train has a very large MASS and is moving at high speed, giving it a large MOMENTUM. The brakes must apply a force over a long distance and time to reduce this momentum to zero. Stopping instantly would require an impossibly large force.'},
  ],
  blanks:{
    passage:'The SI unit for measuring force is the [_]. When the forces acting on an object are balanced (net force = 0), the object will either remain at rest or move at a constant [_]. The force that opposes motion between two surfaces in contact and generates heat is called [_]. Weight is calculated as mass multiplied by the gravitational field strength, [_]. The greater the mass of an object, the greater its inertia and the harder it is to accelerate. When a skydiver reaches a constant speed because the upward force of air resistance equals the downward force of gravity, they have reached [_] velocity.',
    answers:['Newton','speed','friction','g','terminal'],
    wordbank:['Newton','speed','friction','g','terminal','unbalanced','weight','mass'],
  },
  sentences:[
    {prompt:'Explain why it is significantly harder to stop a fully loaded heavy lorry than a small car, even when both are travelling at the same speed.',keywords:['mass','momentum','force','braking','deceleration','inertia','kinetic energy','heavy lorry','car','stopping distance'],hint:'How does mass affect the momentum (mass × velocity) of an object? What does this mean for the amount of force or time needed to bring the object to a stop?'},
    {prompt:'A textbook is resting on a table and is not moving. Identify all the forces acting on the book and explain why they do not cause it to move.',keywords:['gravity','weight','downward','normal reaction','upward','balanced','net force','zero','Newton\'s 1st Law'],hint:'What force pulls the book downward? What force pushes the book upward from the table? Are these forces equal or unequal in magnitude and direction?'},
    {prompt:'Describe the changes in speed and forces acting on a raindrop as it falls from a cloud, from the moment it begins to fall until it reaches the ground.',keywords:['gravity','accelerates','air resistance','increases','terminal velocity','constant speed','balanced forces','drag','falling'],hint:'How does the speed of the raindrop change as it first starts to fall? How does the upward force of air resistance change as the drop falls faster? What happens when the upward and downward forces become equal?'},
    {prompt:'A 50 kg person stands on a bathroom scale. Calculate their weight on Earth and explain what the scale reading would mean on the Moon.',keywords:['50 kg','weight','g=10 N/kg','500 N','Moon','g=1.6 N/kg','80 N','mass','constant'],hint:'Use the formula Weight = mass × g to calculate the weight on Earth and on the Moon. Remember that mass is constant, but weight changes with gravitational field strength.'},
    {prompt:'Explain why a car engine must produce a forward force that is greater than the combined forces of friction and air resistance for the car to accelerate.',keywords:['forward force','friction','air resistance','unbalanced force','acceleration','Newton\'s 2nd Law','net force','motion'],hint:'If the forward force exactly equals the opposing forces, what is the net force? What happens to the car if the net force is not zero?'},
    {prompt:'State Newton\'s three laws of motion and provide a real-world example for each.',keywords:['Newton\'s 1st Law','inertia','seatbelt','2nd Law','F=ma','force','acceleration','3rd Law','action','reaction','swimming','recoil'],hint:'What does each law state? Think about objects staying still/constant speed, the relationship between force and acceleration, and how forces occur in pairs.'},
    {prompt:'Discuss the practical applications of friction in everyday life.',keywords:['friction','useful','walking','brakes','tyres','harmful','engine wear','machinery','lubricants','heat','energy','wasted'],hint:'List at least two situations where friction is essential and useful. List at least two situations where friction is harmful or causes problems.'},
    {prompt:'A 1200 kg car accelerates from 0 to 20 m/s. Calculate the net force required to produce this acceleration over 10 seconds.',keywords:['1200 kg','acceleration','a = v-u/t','2 m/s²','F = ma','2400 N','net force','Newton\'s 2nd Law'],hint:'First, calculate the acceleration using a = (v - u) / t. Then, apply Newton\'s Second Law, F = ma, to find the net force.'},
    {prompt:'Explain how the design of a parachute helps a skydiver land safely, using the concept of forces.',keywords:['parachute','air resistance','drag','large surface area','gravity','weight','terminal velocity','safe landing'],hint:'What does opening the parachute do to the upward force? How does this affect the net force and the skydiver\'s speed?'},
    {prompt:'Compare the concepts of mass and weight, highlighting their units, whether they change with location, and how they are measured.',keywords:['mass','kg','constant','weight','Newtons','varies','g','scalar','vector','gravitational field'],hint:'One is a measure of matter and is always the same; the other is a force that depends on gravity. What are their units and how do they behave on the Moon?'},
    {prompt:'Using Newton\'s First Law, explain why passengers lurch forward when a bus suddenly stops.',keywords:['Newton\'s 1st Law','inertia','constant velocity','lurch','forward','sudden stop','seatbelt','rest','motion'],hint:'Why does the passenger\'s body tend to continue moving forward when the bus slows down? What law of motion explains this?'},
    {prompt:'A cyclist is travelling at a constant speed. Describe the forces acting on the bicycle in the horizontal direction.',keywords:['constant speed','forward force','air resistance','friction','balanced forces','net force zero','pedalling','road'],hint:'What forces push the bicycle forward? What forces resist its forward motion? Since the speed is constant, what can you conclude about the net force?'},
    {prompt:'Calculate the weight of a 200 g object on Earth and on the Moon.',keywords:['200 g','0.2 kg','weight','g=10','2 N','Moon','g=1.6','0.32 N','mass','convert','kilograms'],hint:'Remember to convert the mass from grams to kilograms before using the formula W = mg.'},
    {prompt:'Explain why a ball thrown upward eventually stops at the top of its path and then falls back down.',keywords:['upward','gravity','air resistance','speed','decelerates','stops','falls','force','unbalanced'],hint:'What force acts on the ball as it travels upward? What happens to its speed? What force causes it to fall back down?'},
    {prompt:'Describe how a car\'s braking system uses friction to stop the vehicle.',keywords:['brakes','brake pads','friction','kinetic energy','heat','slowing','stopping','discs'],hint:'What happens when the driver presses the brake pedal? How does the friction between the brake pads and the wheel discs change the car\'s motion?'},
    {prompt:'A 5 kg box is pulled across a floor with a force of 20 N. The friction between the box and the floor is 8 N. Calculate the net force and the acceleration of the box.',keywords:['net force','20 N','8 N','12 N','F=ma','5 kg','2.4 m/s²','acceleration','Newton\'s 2nd Law'],hint:'Subtract the friction from the pulling force to find the net force. Then use F = ma to calculate the acceleration.'},
    {prompt:'Using the concepts of forces, explain why a skydiver reaches a constant speed (terminal velocity).',keywords:['gravity','weight','air resistance','drag','terminal velocity','balanced','net force','zero','acceleration','constant speed'],hint:'What two main forces act on the skydiver? What happens to the upward force as the skydiver falls faster? When do these forces become equal?'},
    {prompt:'Explain why an object with a larger mass is harder to accelerate than an object with a smaller mass.',keywords:['mass','acceleration','inertia','Newton\'s 2nd Law','F=ma','force','harder','heavy','light'],hint:'According to Newton\'s Second Law, a = F/m. If the force is the same, how does the mass affect the acceleration?'},
    {prompt:'Describe two methods used to reduce friction in moving parts of machines.',keywords:['friction','reduce','lubricants','oils','grease','smooth surfaces','ball bearings','machines','efficiency','wear'],hint:'What substances can be added to moving parts to make them slide more easily? What changes can be made to the surfaces themselves?'},
  ],
});
</script></body></html>
