<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Diseases and Health Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Diseases & Health — Std 7 Science Quiz',
  color:'#b71c1c',dark:'#7f0000',light:'#ffebee',
    mcq:[
    {q:'Communicable diseases are caused by:',opts:['Eating too much sugar','Poor ventilation only','Pathogens that can spread from person to person','Genetic mutations'],ans:2,exp:'COMMUNICABLE (infectious) diseases are caused by PATHOGENS (bacteria, viruses, fungi, parasites) that can be SPREAD from person to person through direct contact, air, water, food, or vectors. Examples: flu (virus), tuberculosis (bacteria), malaria (parasite via mosquito).'},
    {q:'The Anopheles mosquito is a vector for:',opts:['Dengue fever','HIV/AIDS','Malaria','Cholera'],ans:2,exp:'The ANOPHELES mosquito is the VECTOR for MALARIA. A vector carries the pathogen (Plasmodium parasite) from one host to another without being harmed. Malaria causes fever, chills, and can be fatal — it is very common in Africa.'},
    {q:'Vaccines work by:',opts:['Killing all bacteria in the body','Introducing a weakened pathogen to stimulate antibody production','Providing ready-made antibiotics','Increasing white blood cell production permanently'],ans:1,exp:'VACCINES contain a WEAKENED, KILLED, or part of a pathogen. The body\'s immune system RECOGNISES it and produces ANTIBODIES + memory cells. On future exposure to the real pathogen, the immune system responds QUICKLY before illness develops. This is ACTIVE IMMUNITY.'},
    {q:'HIV destroys which type of cells?',opts:['Red blood cells','Platelets','Helper T cells (CD4 cells)','Neurons'],ans:2,exp:'HIV (Human Immunodeficiency Virus) attacks and destroys HELPER T CELLS (CD4+ T cells) — key cells of the immune system that coordinate immune responses. As CD4 count drops, the body cannot fight infections → AIDS (Acquired Immunodeficiency Syndrome).'},
    {q:'Which practice best reduces the spread of waterborne diseases like cholera?',opts:['Taking vitamin supplements','Washing hands with clean water and soap','Eating more protein','Exercising daily'],ans:1,exp:'WATERBORNE diseases like cholera spread through contaminated water. The most effective prevention is HANDWASHING with clean water and soap (especially before food and after toilet), and using CLEAN, safe water sources. Proper sanitation also critical.'},
    {q:'A disease that cannot be spread from one person to another is called:',opts:['Communicable','Infectious','Non-communicable','Contagious'],ans:2,exp:'NON-COMMUNICABLE diseases cannot be spread from person to person. They are often caused by lifestyle factors (diet, smoking), genetics, or environmental factors. Examples include diabetes, heart disease, cancer, and asthma.'},
    {q:'Which type of pathogen causes diseases like measles, flu, and COVID-19?',opts:['Bacteria','Fungi','Viruses','Parasites'],ans:2,exp:'VIRUSES are very small pathogens that cannot replicate on their own — they invade host cells. They cause diseases like measles, influenza (flu), and COVID-19. Antibiotics do NOT work against viruses.'},
    {q:'Tuberculosis (TB) is a bacterial disease that primarily attacks the:',opts:['Liver','Lungs','Kidneys','Brain'],ans:1,exp:'TUBERCULOSIS (TB) is caused by the bacterium Mycobacterium tuberculosis. It primarily attacks the LUNGS, causing severe coughing, chest pain, and fever. It is spread through the air via coughs and sneezes.'},
    {q:'Antibiotics are effective against:',opts:['Viruses only','Bacteria','Fungi','All pathogens'],ans:1,exp:'ANTIBIOTICS are medicines that kill or stop the growth of BACTERIA. They do NOT work on viruses, fungi, or parasites. Examples of bacterial diseases treated by antibiotics include strep throat, TB, and cholera.'},
    {q:'The body\'s first line of defence against pathogens includes:',opts:['White blood cells and antibodies','Skin, mucus, stomach acid, and cilia','Vaccines and antibiotics','Fever and inflammation'],ans:1,exp:'The FIRST LINE of defence is physical and chemical barriers: SKIN (blocks entry), MUCUS (traps pathogens), CILIA (sweeps mucus away), and STOMACH ACID (kills swallowed pathogens). White blood cells and antibodies are the SECOND LINE of defence.'},
    {q:'What is a vector in disease transmission?',opts:['A type of virus','An organism that transmits a pathogen from one host to another','A chemical that kills bacteria','A place where pathogens live'],ans:1,exp:'A VECTOR is a living organism that transmits a pathogen from an infected individual to another individual. For example, the Anopheles mosquito transmits the Plasmodium parasite that causes malaria.'},
    {q:'HIV is transmitted through:',opts:['Air','Sharing food','Blood, semen, vaginal fluids, and breast milk','Casual contact like hugging'],ans:2,exp:'HIV is transmitted through contact with INFECTED BODY FLUIDS: blood, semen, vaginal secretions, and breast milk. It is NOT transmitted through air, casual contact, sharing food, or insect bites.'},
    {q:'The most effective way to prevent the spread of airborne diseases like COVID-19 is:',opts:['Antibiotics','Vaccination and wearing masks in crowded places','Drinking more water','Taking vitamins'],ans:1,exp:'AIRBORNE diseases are spread by droplets when coughing/sneezing. Prevention includes VACCINATION (builds immunity) and WEARING MASKS (traps droplets). Handwashing and social distancing also help.'},
    {q:'What is the function of antibodies in the immune system?',opts:['To kill bacteria directly','To recognise and neutralise specific pathogens (antigens)','To produce red blood cells','To digest pathogens'],ans:1,exp:'ANTIBODIES are Y-shaped proteins produced by white blood cells (lymphocytes). They bind to specific antigens (markers on pathogens), marking them for destruction and neutralising their toxins.'},
    {q:'Which of the following is a non-communicable disease?',opts:['Cholera','Malaria','Diabetes','HIV/AIDS'],ans:2,exp:'DIABETES is a NON-COMMUNICABLE disease. It is not caused by a pathogen and cannot be spread between people. It is often linked to lifestyle (diet, inactivity) and genetics. Cholera, malaria, and HIV are communicable.'},
    {q:'Malaria is caused by a:',opts:['Bacterium','Virus','Parasite (Plasmodium)','Fungus'],ans:2,exp:'MALARIA is caused by the Plasmodium PARASITE. It is transmitted by the female Anopheles mosquito. Symptoms include fever, chills, and flu-like illness. It is preventable with mosquito nets and antimalarial drugs.'},
    {q:'What is the role of memory cells after vaccination?',opts:['They produce antibiotics','They remain in the body to provide a rapid immune response if the pathogen enters again','They die immediately after infection','They cause allergies'],ans:1,exp:'MEMORY CELLS (B and T lymphocytes) are produced during the primary immune response. They stay in the body for years. If the same pathogen attacks again, they rapidly multiply and produce antibodies, preventing illness. This is the basis of long-term immunity.'},
    {q:'A person with AIDS (Acquired Immunodeficiency Syndrome) is vulnerable to opportunistic infections because:',opts:['Their red blood cells are destroyed','Their immune system is severely damaged by HIV','They lack antibodies','They are allergic to antibiotics'],ans:1,exp:'AIDS occurs when HIV has destroyed so many HELPER T CELLS that the immune system can no longer fight off even mild pathogens. Opportunistic infections (like Pneumocystis pneumonia) and cancers become life-threatening.'},
    {q:'How can the transmission of vector-borne diseases like malaria be reduced?',opts:['Using insecticide-treated bed nets and draining standing water','Taking antibiotics','Isolating infected patients','Using clean needles'],ans:0,exp:'VECTOR control is key. Using INSECTICIDE-TREATED BED NETS prevents mosquito bites. DRAINING STANDING WATER eliminates mosquito breeding sites. Insecticide spraying also reduces the vector population.'},
    {q:'Antibiotic resistance occurs when:',opts:['Antibiotics are taken exactly as prescribed','Bacteria mutate and develop the ability to survive antibiotics','Viruses become resistant to antibiotics','The body becomes immune to antibiotics'],ans:1,exp:'ANTIBIOTIC RESISTANCE happens when bacteria undergo genetic mutations that allow them to survive exposure to antibiotics. This is accelerated by overuse and misuse of antibiotics. Resistant bacteria (like MRSA) are very difficult to treat.'},
  ],
  match:[
    {term:'Pathogen',def:'A microorganism that causes disease; includes bacteria, viruses, fungi, and parasites'},
    {term:'Vector',def:'A living organism that carries and transmits a pathogen from one host to another (e.g., mosquito, tick)'},
    {term:'Antibiotic',def:'A medicine that kills or inhibits the growth of bacteria; ineffective against viruses'},
    {term:'Vaccine',def:'A biological preparation containing a weakened or killed pathogen that stimulates the immune system to produce antibodies and memory cells'},
    {term:'Antibody',def:'A Y-shaped protein produced by white blood cells (lymphocytes) that binds specifically to a pathogen\'s antigen to neutralise it'},
    {term:'Non-communicable disease',def:'A disease that cannot be spread directly from one person to another (e.g., diabetes, cancer, heart disease)'},
    {term:'Communicable disease',def:'A disease caused by a pathogen that can be transmitted from one person to another (e.g., flu, cholera, HIV)'},
    {term:'Malaria',def:'A parasitic disease caused by Plasmodium and transmitted by the female Anopheles mosquito'},
    {term:'HIV',def:'Human Immunodeficiency Virus; a virus that attacks and destroys helper T cells of the immune system'},
    {term:'AIDS',def:'Acquired Immunodeficiency Syndrome; the final stage of HIV infection when the immune system is severely damaged'},
    {term:'Tuberculosis (TB)',def:'A bacterial disease caused by Mycobacterium tuberculosis that primarily affects the lungs'},
    {term:'Cholera',def:'A waterborne bacterial disease that causes severe diarrhoea and dehydration; transmitted through contaminated water'},
    {term:'Helper T cell',def:'A type of white blood cell that coordinates the immune response and is targeted and destroyed by HIV'},
    {term:'Memory cell',def:'A long-lived lymphocyte that remains in the body after infection to provide a rapid response to a future encounter with the same pathogen'},
    {term:'Antigen',def:'A substance on the surface of a pathogen that triggers an immune response and is recognised by antibodies'},
    {term:'Immunity',def:'The body\'s ability to resist and fight off infection, either naturally (innate) or after vaccination (acquired)'},
    {term:'Active immunity',def:'Immunity produced by the body\'s own immune response after exposure to a pathogen or vaccination'},
    {term:'Passive immunity',def:'Immunity acquired when ready-made antibodies are transferred to a person (e.g., from mother to baby or via antiserum)'},
    {term:'Antibiotic resistance',def:'The ability of bacteria to survive and multiply in the presence of antibiotics; a global health threat'},
    {term:'Herd immunity',def:'Protection of unvaccinated individuals when a large percentage of the population is immunised, reducing pathogen spread'},
  ],
  flashcards:[
    {q:'Compare bacteria and viruses as types of pathogens.',a:'BACTERIA: living single-celled organisms; reproduce independently; cause diseases like TB, cholera, and food poisoning; treatable with ANTIBIOTICS. VIRUSES: non-living, tiny particles; require a host cell to replicate; cause flu, HIV, COVID-19, and measles; NOT treatable with antibiotics; managed with antiviral drugs or prevented by vaccines.'},
    {q:'Explain the body\'s three lines of defence against disease.',a:'FIRST LINE: Physical and chemical barriers — SKIN blocks entry, MUCUS traps pathogens, CILIA sweep mucus away, STOMACH ACID kills swallowed pathogens. SECOND LINE: Non-specific immune response — PHAGOCYTES (white blood cells) engulf and digest pathogens. THIRD LINE: Specific immune response — LYMPHOCYTES produce ANTIBODIES specific to each pathogen, and MEMORY CELLS provide long-term protection.'},
    {q:'List and describe 5 methods of disease transmission with examples.',a:'1. AIRBORNE (droplets) — flu, COVID-19, TB. 2. DIRECT CONTACT — STIs (syphilis, HIV), ringworm. 3. CONTAMINATED FOOD/WATER — cholera, typhoid. 4. VECTOR-BORNE — malaria (mosquito), dengue. 5. BLOOD CONTACT — HIV, hepatitis B via needles/transfusions. 6. FOMITES (contaminated objects) — cold viruses on doorknobs.'},
    {q:'How can the transmission of HIV/AIDS be prevented?',a:'1. ABSTINENCE or mutual monogamy with an uninfected partner. 2. Consistent and correct CONDOM use. 3. Never share needles/syringes. 4. Regular TESTING and knowing your status. 5. ANTIRETROVIRAL drugs (ARVs) reduce viral load and prevent mother-to-child transmission. 6. Safe medical practices (screened blood). 7. Reducing STIGMA to promote testing and treatment.'},
    {q:'What is antibiotic resistance and why is it a serious global health threat?',a:'ANTIBIOTIC RESISTANCE occurs when bacteria mutate and become unaffected by antibiotics. It is accelerated by overusing antibiotics and not completing prescribed courses. This leads to "SUPERBUGS" (e.g., MRSA) that are very difficult or impossible to treat, causing prolonged illness and death. To slow it, only use antibiotics when prescribed by a doctor and always finish the course.'},
    {q:'Explain the difference between active immunity and passive immunity.',a:'ACTIVE IMMUNITY occurs when the body\'s own immune system produces antibodies and memory cells in response to a pathogen or vaccine. It provides LONG-LASTING protection. PASSIVE IMMUNITY occurs when ready-made antibodies are transferred to a person (e.g., from mother to baby via placenta or breast milk, or via antiserum injection). It provides IMMEDIATE but SHORT-LIVED protection.'},
    {q:'Describe how vaccines stimulate the immune system and provide protection.',a:'1. A vaccine introduces a weakened, killed, or partial pathogen (antigen) into the body. 2. The immune system recognises it as foreign. 3. Lymphocytes produce specific ANTIBODIES to neutralise it. 4. MEMORY CELLS are produced and remain in the body. 5. If the real pathogen enters later, memory cells rapidly produce antibodies, preventing illness.'},
    {q:'What are the symptoms and transmission routes of malaria?',a:'Malaria is transmitted by the FEMALE ANOPHELES MOSQUITO. Symptoms include: fever, chills, sweating, headache, and vomiting. Prevention includes using insecticide-treated bed nets, indoor spraying, and taking antimalarial medications.'},
    {q:'Why are antibiotics ineffective against viral diseases like influenza?',a:'ANTIBIOTICS target specific structures in bacterial cells, such as their cell walls or protein synthesis machinery. VIRUSES are not cells; they have no cell walls and use the host cell\'s machinery to replicate. Antibiotics cannot kill viruses because they do not have the necessary targets.'},
    {q:'Describe the transmission and prevention of cholera.',a:'CHOLERA is a bacterial disease caused by Vibrio cholerae. It is transmitted via CONTAMINATED WATER OR FOOD. Symptoms include severe diarrhoea and dehydration. PREVENTION: Boil or treat drinking water, wash hands with soap, improve sanitation, and avoid raw/undercooked seafood.'},
    {q:'What is herd immunity and how does it protect vulnerable individuals?',a:'HERD IMMUNITY occurs when a large proportion of a population is vaccinated against a disease. This reduces the overall number of susceptible individuals, making it very hard for the pathogen to spread. This protects vulnerable people who cannot be vaccinated (e.g., those with weakened immune systems, newborns, the elderly).'},
    {q:'Explain the relationship between HIV and AIDS.',a:'HIV is the VIRUS that infects and destroys helper T cells (CD4 cells). Over time, as the immune system weakens, the body becomes susceptible to opportunistic infections. AIDS is the FINAL STAGE of HIV infection, diagnosed when the CD4 count drops below 200 cells/mm³ or specific opportunistic infections appear.'},
    {q:'How do white blood cells defend the body against pathogens?',a:'PHAGOCYTES engulf and digest pathogens (nonspecific response). LYMPHOCYTES produce ANTIBODIES that bind specifically to antigens on pathogens, neutralising them. Some lymphocytes become MEMORY CELLS, providing rapid, long-lasting immunity for future infections.'},
    {q:'List 4 risk factors for non-communicable diseases.',a:'1. Unhealthy DIET — high in saturated fats, salt, and sugar (heart disease, diabetes). 2. Physical INACTIVITY — increases risk of obesity and heart disease. 3. SMOKING — damages lungs, heart, and causes cancer. 4. Excessive ALCOHOL consumption — damages the liver and increases cancer risk.'},
    {q:'What is tuberculosis (TB) and how is it spread?',a:'TB is a bacterial disease caused by Mycobacterium tuberculosis. It primarily attacks the LUNGS. It is spread through AIRBORNE droplets when an infected person coughs or sneezes. Symptoms include a persistent cough, chest pain, fever, and weight loss.'},
    {q:'How can a person reduce the risk of HIV transmission?',a:'Prevent HIV by: 1. Using CONDOMS during sexual intercourse. 2. Avoid sharing NEEDLES. 3. Ensure blood transfusions are SCREENED. 4. Take PRE-EXPOSURE PROPHYLAXIS (PrEP) if at high risk. 5. Regular TESTING. 6. Mothers living with HIV can take ARVs to prevent transmission to their babies.'},
    {q:'Describe the role of vectors in disease transmission.',a:'A VECTOR is a living organism, often an arthropod (mosquito, tick, fly), that carries a pathogen from an infected host to a new host. Unlike a mechanical carrier, the vector is essential for the pathogen\'s life cycle. Example: Anopheles mosquito transmits Plasmodium (malaria).'},
    {q:'Why is antibiotic resistance considered a public health crisis?',a:'Antibiotic resistance reduces the effectiveness of standard treatments, making infections harder to cure. This leads to prolonged illness, higher healthcare costs, and an increased risk of death. Without new antibiotics, routine surgeries and chemotherapy will become life-threatening due to untreatable infections.'},
    {q:'Explain why some diseases like measles are more common in unvaccinated communities.',a:'Measles is highly contagious. In unvaccinated communities, the virus spreads easily through airborne droplets. Without vaccination, the community lacks herd immunity, so outbreaks are common. Measles can cause severe complications, including pneumonia and brain damage.'},
    {q:'What is the difference between a bacterium and a virus?',a:'BACTERIA: living single-celled organisms, have cell walls, reproduce independently by binary fission, can be treated with antibiotics. VIRUSES: non-living infectious particles, no cellular structure, require a host cell to reproduce, cannot be treated with antibiotics, can only be treated with antivirals or prevented by vaccines.'},
  ],
  blanks:{
    passage:'Communicable diseases are caused by [_], such as bacteria and viruses. A living organism that carries a pathogen from one host to another is called a [_], such as the mosquito that transmits malaria. [_] contain weakened pathogens and stimulate the body to produce antibodies and memory cells. Medicines that treat bacterial infections are called [_]. HIV specifically destroys [_] T cells, which are essential for the immune response. Diseases that cannot be passed from person to person, such as diabetes or cancer, are called [_] diseases.',
    answers:['pathogens','vector','Vaccines','Antibiotics','helper','non-communicable'],
    wordbank:['pathogens','vector','Vaccines','Antibiotics','helper','non-communicable','virus','communicable'],
  },
  sentences:[
    {prompt:'Explain why antibiotics are completely ineffective against viral infections such as influenza (the flu).',keywords:['virus','bacteria','antibiotics','cell wall','ribosomes','host cell','replicate','structure','target'],hint:'What type of pathogen is the flu caused by? How do antibiotics work to kill bacteria? Why does this mechanism fail against viruses?'},
    {prompt:'Describe how a vaccine protects an individual from a disease, and explain how widespread vaccination can protect the broader community (herd immunity).',keywords:['vaccine','antigen','immune system','antibodies','memory cells','rapid response','herd immunity','unvaccinated','spread'],hint:'What happens in the body after a vaccine is given? How does this prepare the immune system for a real infection? What happens to the spread of a disease when most people are vaccinated?'},
    {prompt:'Explain three effective methods that can be used to prevent malaria both at the individual level and at the community level.',keywords:['malaria','mosquito','Anopheles','bed nets','insecticide','drain water','standing water','prophylactic drugs','vector control','spray','breeding'],hint:'Think about how to protect yourself from mosquito bites, how to kill mosquitoes, and how to eliminate their breeding sites in the community.'},
    {prompt:'Describe the difference between communicable and non-communicable diseases, giving two examples of each.',keywords:['communicable','infectious','pathogen','spread','virus','bacteria','non-communicable','lifestyle','diabetes','cancer','heart disease','genetics'],hint:'One type is caused by a pathogen and can be transmitted. The other is caused by lifestyle or genetic factors and cannot be transmitted.'},
    {prompt:'Explain why HIV/AIDS is a serious global health issue, especially in sub-Saharan Africa.',keywords:['HIV','AIDS','CD4','helper T cells','immune system','opportunistic infections','stigma','ARVs','antiretroviral','transmission','prevention'],hint:'How does HIV affect the body\'s immune system? Why are infections more dangerous for people with AIDS? What role do antiretroviral drugs play?'},
    {prompt:'Describe the role of memory cells in the immune system and how they contribute to long-term immunity.',keywords:['memory cells','antibodies','immune system','pathogen','rapid response','vaccine','infection','lymphocytes'],hint:'What happens to memory cells after the first infection? How do they respond if the same pathogen enters the body years later?'},
    {prompt:'Explain the mechanism of antibiotic resistance and why it is dangerous.',keywords:['antibiotic','resistance','bacteria','mutation','survive','superbug','MRSA','misuse','overuse','completion'],hint:'How do bacteria become resistant? What human actions accelerate this process?'},
    {prompt:'A patient with a sore throat is prescribed antibiotics by a doctor. Explain why the doctor should not prescribe antibiotics for a viral sore throat.',keywords:['antibiotic','virus','bacteria','sore throat','prescription','resistance','treatment','unnecessary','side effects'],hint:'Why would antibiotics not help if the sore throat is viral? What are the risks of prescribing antibiotics unnecessarily?'},
    {prompt:'Explain how the human body\'s non-specific defences provide a first line of protection against pathogens.',keywords:['skin','mucus','cilia','stomach acid','sebum','defence','barrier','physical','chemical','innate'],hint:'What physical structures and chemical barriers prevent pathogens from entering the body?'},
    {prompt:'Describe the life cycle of the Plasmodium parasite in the mosquito and in humans.',keywords:['Plasmodium','mosquito','Anopheles','human','liver','red blood cells','sporozoites','merozoites','transmission','malaria'],hint:'How does the parasite enter a human? Where does it develop inside the body before causing symptoms?'},
    {prompt:'Explain the importance of reducing stigma associated with HIV/AIDS.',keywords:['HIV','AIDS','stigma','discrimination','testing','treatment','prevention','support','community','healthcare'],hint:'Why might someone avoid getting tested if they fear stigma? How does stigma affect the fight against HIV?'},
    {prompt:'Discuss the role of the World Health Organization (WHO) in global disease control.',keywords:['WHO','disease','outbreak','vaccine','campaign','eradication','smallpox','polio','COVID-19','guidelines'],hint:'What does the WHO do to coordinate responses to infectious disease outbreaks?'},
    {prompt:'Differentiate between active immunity and passive immunity with examples.',keywords:['active immunity','long-lasting','memory cells','vaccine','passive immunity','short-term','antibodies','mother to baby','antiserum'],hint:'One involves the body actively producing its own immune response, while the other involves receiving ready-made antibodies from an external source.'},
    {prompt:'Why do healthcare workers recommend getting vaccinated against influenza every year?',keywords:['influenza','flu','vaccine','annual','mutation','strain','variant','immunity','protection'],hint:'Does the flu virus remain the same every year? How does the virus change, and why does this require a new vaccine?'},
    {prompt:'Explain the role of vector control in reducing the spread of diseases like malaria and dengue.',keywords:['vector','mosquito','insecticide','bed nets','breeding','standing water','spray','control','prevention','dengue'],hint:'How can targeting the mosquito prevent the spread of diseases it transmits?'},
    {prompt:'Describe the symptoms and prevention of cholera.',keywords:['cholera','diarrhoea','dehydration','waterborne','contaminated','water','sanitation','oral rehydration','hygiene'],hint:'What are the key symptoms of cholera? How is it spread, and what can be done to prevent it?'},
    {prompt:'Explain the difference between a bacterium and a virus in terms of structure, reproduction, and treatment.',keywords:['bacterium','living','cell','binary fission','antibiotics','virus','non-living','host cell','replicate','antivirals'],hint:'One is a cellular organism that can reproduce on its own. The other is a non-cellular particle that requires a host to reproduce.'},
    {prompt:'Why is it dangerous to stop taking a course of antibiotics before it is finished?',keywords:['antibiotic','course','complete','bacteria','resistance','survive','stronger','mutate','treatment','infection'],hint:'What happens to the bacteria that survive a partially completed course of antibiotics?'},
    {prompt:'Describe the transmission of HIV and the conditions required for it to spread.',keywords:['HIV','transmission','blood','semen','vaginal fluids','breast milk','unprotected sex','needles','mother to child','casual contact'],hint:'What body fluids can transmit HIV? What activities put someone at risk?'},
    {prompt:'Explain how a mother with HIV can prevent passing the virus to her baby.',keywords:['HIV','mother to child','ARVs','antiretroviral','pregnancy','labour','breastfeeding','prevention','viral load','treatment'],hint:'What medications can the mother take? What advice is given about feeding the baby?'},
  ],
});
</script></body></html>
