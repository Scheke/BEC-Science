{title:'The Three States of Matter',
content:`<h2>Solid, Liquid, and Gas</h2>
<p>All matter is made of tiny <strong>particles</strong>. The way these particles are arranged and move determines the <strong>state of matter</strong>.</p>
<table style="width:100%;border-collapse:collapse;margin:8px 0">
<tr><th style="background:#006064;color:#fff;padding:6px">State</th><th style="background:#006064;color:#fff;padding:6px">Arrangement</th><th style="background:#006064;color:#fff;padding:6px">Movement</th><th style="background:#006064;color:#fff;padding:6px">Shape</th></tr>
<tr style="background:#e0f7fa"><td style="padding:6px"><strong>Solid</strong></td><td style="padding:6px">Regular, close</td><td style="padding:6px">Vibrate only</td><td style="padding:6px">Fixed</td></tr>
<tr><td style="padding:6px"><strong>Liquid</strong></td><td style="padding:6px">Irregular, close</td><td style="padding:6px">Slide around</td><td style="padding:6px">Takes container shape</td></tr>
<tr style="background:#e0f7fa"><td style="padding:6px"><strong>Gas</strong></td><td style="padding:6px">Random, far apart</td><td style="padding:6px">Move fast, all directions</td><td style="padding:6px">Fills container</td></tr>
</table>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,290);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  const states=[{n:'SOLID',x:70},{n:'LIQUID',x:210},{n:'GAS',x:350}];
  const particles={solid:[],liquid:[],gas:[]};
  for(let i=0;i<9;i++){particles.solid.push({x:50+i%3*14,y:110+Math.floor(i/3)*14,vx:0,vy:0});}
  for(let i=0;i<9;i++){particles.liquid.push({x:185+Math.random()*50,y:105+Math.random()*50,vx:(Math.random()-0.5)*1.2,vy:(Math.random()-0.5)*1.2});}
  for(let i=0;i<9;i++){particles.gas.push({x:320+Math.random()*60,y:90+Math.random()*70,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3});}
  let t=0;
  p.draw=()=>{
    p.background(245);
    states.forEach((s)=>{p.fill('#00838f');p.noStroke();p.rect(s.x-45,80,90,100,8);p.fill('#333');p.textSize(12);p.text(s.n,s.x,240);});
    particles.solid.forEach(pt=>{pt.x+=0.4*p.sin(t*0.2+pt.y);p.fill('#1565c0');p.noStroke();p.ellipse(pt.x,pt.y,10,10);});
    particles.liquid.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;if(pt.x<170||pt.x>240)pt.vx*=-1;if(pt.y<90||pt.y>160)pt.vy*=-1;p.fill('#1e88e5');p.noStroke();p.ellipse(pt.x,pt.y,10,10);});
    particles.gas.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;if(pt.x<310||pt.x>390)pt.vx*=-1;if(pt.y<85||pt.y>175)pt.vy*=-1;p.fill('#e53935');p.noStroke();p.ellipse(pt.x,pt.y,10,10);});
    t++;
  };
}},

{title:'Changes of State',
content:`<h2>Heating and Cooling Change States</h2>
<p>Matter changes state when it gains or loses <strong>heat energy</strong>:</p>
<p>🔥 <strong>Heating (gaining energy):</strong></p>
<ul><li>Solid → Liquid = <strong>Melting</strong></li><li>Liquid → Gas = <strong>Evaporation / Boiling</strong></li><li>Solid → Gas directly = <strong>Sublimation</strong></li></ul>
<p>❄️ <strong>Cooling (losing energy):</strong></p>
<ul><li>Gas → Liquid = <strong>Condensation</strong></li><li>Liquid → Solid = <strong>Freezing / Solidification</strong></li></ul>
<p>Water melts at <strong>0°C</strong> and boils at <strong>100°C</strong>.</p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,290);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let t=0;
  p.draw=()=>{
    p.background(245);
    const cx=210;
    const nodes=[{n:'SOLID ❄️',x:cx,y:240,c:'#1565c0'},{n:'LIQUID 💧',x:cx,y:145,c:'#1e88e5'},{n:'GAS 💨',x:cx,y:50,c:'#e53935'}];
    const arrows=[{from:0,to:1,lx:cx-70,ly:192,label:'Melting'},{from:1,to:2,lx:cx-70,ly:97,label:'Evaporation'},{from:1,to:0,lx:cx+70,ly:192,label:'Freezing'},{from:2,to:1,lx:cx+70,ly:97,label:'Condensation'}];
    const active=Math.floor(t/70)%4;
    arrows.forEach((ar,i)=>{
      const fn=nodes[ar.from],tn=nodes[ar.to];
      p.stroke(i===active?'#f4511e':'#bbb');p.strokeWeight(i===active?3:1.5);
      const dx=i<2?-40:40;
      p.line(fn.x+dx,fn.y,tn.x+dx,tn.y);
      p.noStroke();p.fill(i===active?'#f4511e':'#888');p.textSize(i===active?12:10);p.text(ar.label,ar.lx,ar.ly);
    });
    nodes.forEach(nd=>{p.fill(nd.c);p.noStroke();p.ellipse(nd.x,nd.y,90,46);p.fill(255);p.textSize(12);p.text(nd.n,nd.x,nd.y);});
    t++;
  };
}},

{title:'Evaporation vs Boiling',
content:`<h2>Two Ways Liquid Becomes Gas</h2>
<table style="width:100%;border-collapse:collapse;margin:8px 0">
<tr><th style="background:#006064;color:#fff;padding:6px"></th><th style="background:#006064;color:#fff;padding:6px">Evaporation</th><th style="background:#006064;color:#fff;padding:6px">Boiling</th></tr>
<tr style="background:#e0f7fa"><td style="padding:6px"><strong>Where?</strong></td><td style="padding:6px">Surface only</td><td style="padding:6px">Throughout liquid</td></tr>
<tr><td style="padding:6px"><strong>Temperature?</strong></td><td style="padding:6px">Any temperature</td><td style="padding:6px">Only at boiling point</td></tr>
<tr style="background:#e0f7fa"><td style="padding:6px"><strong>Speed?</strong></td><td style="padding:6px">Slow</td><td style="padding:6px">Fast</td></tr>
<tr><td style="padding:6px"><strong>Bubbles?</strong></td><td style="padding:6px">No</td><td style="padding:6px">Yes</td></tr>
</table>
<p>Evaporation COOLS a surface — sweating cools you because the fastest particles escape, taking heat energy away from your skin!</p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,280);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  const evapPts=Array.from({length:8},()=>({x:80+Math.random()*80,y:140+Math.random()*60,vy:0}));
  const boilPts=Array.from({length:8},()=>({x:260+Math.random()*80,y:140+Math.random()*60,vy:-(1+Math.random()),size:Math.random()*10+6}));
  let t=0;
  p.draw=()=>{
    p.background(245);
    p.fill('#b3e5fc');p.stroke('#006064');p.strokeWeight(2);p.rect(60,140,120,80,0,0,8,8);
    p.noStroke();p.fill('#333');p.textSize(11);p.text('Evaporation',120,240);
    evapPts.forEach((pt,i)=>{if(t%80===i*10)pt.vy=-1.5-Math.random();if(pt.vy<0){pt.y+=pt.vy;if(pt.y<40){pt.y=140+Math.random()*60;pt.vy=0;}}p.fill(pt.vy<0?'#e53935':'#1e88e5');p.noStroke();p.ellipse(pt.x,pt.y,10,10);});
    p.fill('#ffecb3');p.stroke('#f57f17');p.strokeWeight(2);p.rect(240,140,120,80,0,0,8,8);
    p.noStroke();p.fill('#333');p.textSize(11);p.text('Boiling (100°C)',300,240);
    boilPts.forEach(pt=>{pt.y+=pt.vy;if(pt.y<60){pt.y=140+Math.random()*60;}p.fill('#e65100');p.noStroke();p.ellipse(pt.x,pt.y,pt.size,pt.size);});
    t++;
  };
}},

{title:'Condensation',
content:`<h2>Gas Becomes Liquid</h2>
<p><strong>Condensation</strong> is when a gas (water vapour) loses energy and turns into a liquid. You see it every day!</p>
<ul><li>💧 Water droplets on a cold glass</li><li>🌫️ Dew on grass in the morning</li><li>🪟 Foggy windows on a cold day</li><li>☁️ Cloud formation</li></ul>
<p>It happens because water vapour in warm air hits a <strong>cold surface</strong>, LOSES energy, and becomes liquid.</p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,280);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  const drops=[];let t=0;
  p.draw=()=>{
    p.background(245);
    p.fill('#b3e5fc');p.stroke('#1e88e5');p.strokeWeight(2);p.rect(150,60,120,180,8);
    p.fill('#e3f2fd');p.noStroke();p.rect(155,65,50,170,6);
    p.fill('#555');p.textSize(11);p.text('Cold glass',210,260);
    for(let i=0;i<3;i++){const vx=20+i*160,vy=40+p.sin(t*0.05+i)*20;p.fill('#f4511e');p.noStroke();p.ellipse(vx,vy,14,14);const targetX=150+(i%2)*80,targetY=80+i*40;if(t%100==i*30){drops.push({x:targetX,y:targetY,r:4,dy:0.5});}}
    drops.forEach(d=>{d.y+=d.dy;d.r=Math.min(d.r+0.02,8);p.fill('#1e88e5');p.noStroke();p.ellipse(d.x,d.y,d.r*2,d.r*2);});
    if(drops.length>18) drops.splice(0,3);
    p.fill('#333');p.noStroke();p.textSize(11);p.text('Water vapour condenses on cold surface',210,25);
    t++;
  };
}},

{title:'Particle Energy and Temperature',
content:`<h2>Temperature = Average Particle Energy</h2>
<p>Temperature measures the <strong>average kinetic energy</strong> of particles.</p>
<ul><li>❄️ <strong>Cold</strong> = slow particles = low energy</li><li>🔥 <strong>Hot</strong> = fast particles = high energy</li></ul>
<p>This explains why: hot water cooks food faster · gases expand when heated · sugar dissolves faster in hot water</p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,280);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  const coldPts=Array.from({length:9},()=>({x:60+Math.random()*80,y:90+Math.random()*80,vx:(Math.random()-0.5)*0.6,vy:(Math.random()-0.5)*0.6}));
  const hotPts=Array.from({length:9},()=>({x:280+Math.random()*80,y:90+Math.random()*80,vx:(Math.random()-0.5)*3.5,vy:(Math.random()-0.5)*3.5}));
  p.draw=()=>{
    p.background(245);
    p.fill('#e3f2fd');p.stroke('#1565c0');p.strokeWeight(2);p.rect(40,70,120,120,8);
    p.fill('#fff3e0');p.stroke('#e65100');p.rect(260,70,120,120,8);
    p.noStroke();p.fill('#1565c0');p.textSize(13);p.text('Cold ❄️',100,58);
    p.fill('#e65100');p.text('Hot 🔥',320,58);
    coldPts.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;if(pt.x<44||pt.x>156)pt.vx*=-1;if(pt.y<74||pt.y>186)pt.vy*=-1;p.fill('#42a5f5');p.noStroke();p.ellipse(pt.x,pt.y,12,12);});
    hotPts.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;if(pt.x<264||pt.x>376)pt.vx*=-1;if(pt.y<74||pt.y>186)pt.vy*=-1;p.fill('#ef5350');p.noStroke();p.ellipse(pt.x,pt.y,12,12);});
    p.fill('#333');p.textSize(11);p.text('Slow particles',100,220);p.text('Fast particles',320,220);
  };
}},

{title:'Inside a Solid — Particle Structure',
content:`<h3>Why Solids Have a Fixed Shape</h3>
<p>Solid particles are held in a <strong>regular lattice</strong> (grid) by strong forces. Each particle can only <strong>vibrate on the spot</strong> — it cannot move away from its position. That is why a solid keeps its shape.</p>
<ul>
<li>🔵 Particles are <strong>touching</strong> — almost no gaps</li>
<li>📐 Arranged in <strong>neat rows and columns</strong></li>
<li>💪 <strong>Strong forces</strong> lock every particle in place</li>
<li>📦 Result: fixed shape, fixed volume, very high density</li>
</ul>`,

{title:'Inside a Liquid — Particle Structure',
content:`<h3>Why Liquids Can Flow</h3>
<p>Liquid particles are <strong>close together</strong> but arranged <strong>irregularly</strong>. The forces between them are weaker than in a solid, so particles can <strong>slide past each other</strong>. That is why liquids flow.</p>
<ul>
<li>💧 Particles are <strong>close together</strong> but NOT in neat rows</li>
<li>🔄 Particles <strong>slide past each other</strong> freely</li>
<li>🫙 Takes the <strong>shape of its container</strong></li>
<li>📏 Volume stays fixed — you cannot compress a liquid</li>
</ul>`,

{title:'Inside a Gas — Particle Structure',
content:`<h3>Why Gases Fill Their Container</h3>
<p>In a gas, particles are <strong>very far apart</strong> and move <strong>very fast in all directions</strong>. There are almost no forces between them, so particles are completely free to spread out and fill any container.</p>
<ul>
<li>🔴 Particles are <strong>far apart</strong> — huge gaps between them</li>
<li>💨 Move very <strong>fast in random directions</strong></li>
<li>📦 <strong>Fill any container</strong> completely</li>
<li>🗜️ Can be <strong>compressed</strong> (squeezed) — gaps get smaller</li>
</ul>`,
visual:`<svg viewBox="0 0 420 240" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">

<li>🔗 Solid has strongest forces · Gas has almost none</li>

{title:'All Six Changes of State',
content:`<h3>Six Named Processes</h3>
<p>Every change between the three states has a specific name. You must know all six for your exam!</p>
<table style="width:100%;border-collapse:collapse;margin:6px 0;font-size:.9rem">
<tr style="background:#006064;color:#fff"><th style="padding:5px">Process</th><th style="padding:5px">From</th><th style="padding:5px">To</th><th style="padding:5px">Heat</th></tr>
<tr style="background:#e0f7fa"><td style="padding:5px"><strong>Melting</strong></td><td style="padding:5px">Solid</td><td style="padding:5px">Liquid</td><td style="padding:5px">🔥 Absorbed</td></tr>
<tr><td style="padding:5px"><strong>Freezing</strong></td><td style="padding:5px">Liquid</td><td style="padding:5px">Solid</td><td style="padding:5px">❄️ Released</td></tr>
<tr style="background:#e0f7fa"><td style="padding:5px"><strong>Evaporation / Boiling</strong></td><td style="padding:5px">Liquid</td><td style="padding:5px">Gas</td><td style="padding:5px">🔥 Absorbed</td></tr>
<tr><td style="padding:5px"><strong>Condensation</strong></td><td style="padding:5px">Gas</td><td style="padding:5px">Liquid</td><td style="padding:5px">❄️ Released</td></tr>
<tr style="background:#e0f7fa"><td style="padding:5px"><strong>Sublimation</strong></td><td style="padding:5px">Solid</td><td style="padding:5px">Gas</td><td style="padding:5px">🔥 Absorbed</td></tr>
<tr><td style="padding:5px"><strong>Deposition</strong></td><td style="padding:5px">Gas</td><td style="padding:5px">Solid</td><td style="padding:5px">❄️ Released</td></tr>
</table>`,
visual:`<svg viewBox="0 0 420 240" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">

    <marker id="ba" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1565c0"/></marker>

  <text x="120" y="108" text-anchor="end" font-size="10" fill="#f44336">Melting 🔥</text>

{title:'The Heating Curve',
content:`<h3>What Happens as You Heat Water?</h3>
<p>When you heat ice from −20°C and plot the temperature, you get a special graph called the <strong>heating curve</strong>. The <strong>flat sections</strong> are the most important — they show where heat energy is used to <em>break the forces</em> between particles instead of raising temperature.</p>
<ul>
<li>📈 <strong>Sloped sections</strong>: temperature rises — particles gain energy</li>
<li>➡️ <strong>Flat sections</strong>: temperature STAYS SAME while state changes</li>
<li>🧊 Flat at <strong>0°C</strong> = melting (ice → water)</li>
<li>💧 Flat at <strong>100°C</strong> = boiling (water → steam)</li>
</ul>`,

  <rect x="273" y="20" width="55" height="175" fill="#fff9c4" fill-opacity=".7"/>

  <polyline points="58,197 118,172 168,172 273,60 328,60 400,36" fill="none" stroke="#d32f2f" stroke-width="2.5" stroke-linejoin="round"/>

  <text x="143" y="168" text-anchor="middle" font-size="8" fill="#006064">0°C</text>

{title:'Thermal Expansion — Why Bridges Have Gaps',
content:`<h3>Solids Expand When Heated</h3>
<p>When a solid is heated, its particles vibrate <strong>more vigorously</strong>. They push each other apart slightly — the solid gets <strong>bigger</strong>. This is called <strong>thermal expansion</strong>.</p>
<ul>
<li>🌉 Bridges have <strong>expansion gaps</strong> — room for the metal to expand in summer</li>
<li>🚂 Railway tracks have gaps for the same reason</li>
<li>🥫 Metal lids on jars loosen when run under hot water — the lid expands!</li>
<li>🌡️ Liquids in thermometers expand when hot, rising up the tube</li>
</ul>`,
visual:`<svg viewBox="0 0 420 240" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">

  <circle cx="48" cy="52" r="10" fill="#1565c0"/><circle cx="76" cy="52" r="10" fill="#1565c0"/><circle cx="104" cy="52" r="10" fill="#1565c0"/><circle cx="132" cy="52" r="10" fill="#1565c0"/><circle cx="160" cy="52" r="10" fill="#1565c0"/>

  <circle cx="48" cy="108" r="10" fill="#1565c0"/><circle cx="76" cy="108" r="10" fill="#1565c0"/><circle cx="104" cy="108" r="10" fill="#1565c0"/><circle cx="132" cy="108" r="10" fill="#1565c0"/><circle cx="160" cy="108" r="10" fill="#1565c0"/>
  <circle cx="48" cy="136" r="10" fill="#1565c0"/><circle cx="76" cy="136" r="10" fill="#1565c0"/><circle cx="104" cy="136" r="10" fill="#1565c0"/><circle cx="132" cy="136" r="10" fill="#1565c0"/><circle cx="160" cy="136" r="10" fill="#1565c0"/>
  <text x="105" y="173" text-anchor="middle" font-size="10" fill="#555">Gap between particles: small</text>
  <!-- HOT side label -->
  <text x="315" y="18" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">HOT 🔥</text>
  <rect x="230" y="25" width="178" height="135" rx="8" fill="#fff3e0" stroke="#c62828" stroke-width="2"/>

  <circle cx="260" cy="50" r="10" fill="#ef5350"/><circle cx="292" cy="50" r="10" fill="#ef5350"/><circle cx="324" cy="50" r="10" fill="#ef5350"/><circle cx="356" cy="50" r="10" fill="#ef5350"/><circle cx="388" cy="50" r="10" fill="#ef5350"/>

  <circle cx="260" cy="116" r="10" fill="#ef5350"/><circle cx="292" cy="116" r="10" fill="#ef5350"/><circle cx="324" cy="116" r="10" fill="#ef5350"/><circle cx="356" cy="116" r="10" fill="#ef5350"/><circle cx="388" cy="116" r="10" fill="#ef5350"/>
  <circle cx="260" cy="149" r="10" fill="#ef5350"/><circle cx="292" cy="149" r="10" fill="#ef5350"/><circle cx="324" cy="149" r="10" fill="#ef5350"/><circle cx="356" cy="149" r="10" fill="#ef5350"/><circle cx="388" cy="149" r="10" fill="#ef5350"/>

{title:'Diffusion — Particles Spread Out',
content:`<h3>Diffusion: Particles Mix on Their Own</h3>
<p><strong>Diffusion</strong> is the movement of particles from an area of <strong>high concentration</strong> to an area of <strong>low concentration</strong>. It happens because particles are always moving randomly.</p>
<ul>
<li>🌸 You can smell perfume across a room — gas molecules diffuse through air</li>
<li>🍵 Food colouring spreads through water — liquid diffusion (slower)</li>
<li>⚡ Diffusion is <strong>faster in gases</strong> than liquids (particles move faster)</li>
<li>🌡️ Diffusion is <strong>faster at higher temperatures</strong> (more energy)</li>
<li>🔬 <strong>Smaller particles</strong> diffuse faster than larger ones</li>
</ul>`,

{title:'Density — Why Ice Floats on Water',
content:`<h3>Density and the Particle Model</h3>
<p><strong>Density</strong> = mass per unit volume. The more particles packed into the same space, the denser the material.</p>
<ul>
<li>⬛ <strong>Solids</strong> are usually the most dense — most particles in the same volume</li>
<li>💧 <strong>Liquids</strong> are slightly less dense — small gaps between particles</li>
<li>💨 <strong>Gases</strong> are very low density — particles far apart</li>
<li>❄️ Special case: <strong>Ice is LESS dense than liquid water</strong> — that is why ice floats! Water expands when it freezes, forming a hexagonal lattice with bigger gaps.</li>
</ul>`,

{title:'The Water Cycle',
content:`<h3>Applying Changes of State to Nature</h3>
<p>The <strong>water cycle</strong> shows all the changes of state happening in nature, driven by energy from the Sun.</p>
<ul>
<li>☀️ Sun heats ocean → <strong>evaporation</strong> (liquid → gas)</li>
<li>☁️ Water vapour rises, cools → <strong>condensation</strong> (gas → liquid) → clouds</li>
<li>🌧️ Droplets too heavy → <strong>precipitation</strong> (rain or snow)</li>
<li>❄️ At high altitude (cold) → <strong>freezing/sublimation</strong> → snow and ice</li>
<li>🔄 Water runs back to ocean — the cycle repeats</li>
</ul>`,

{title:'Pressure in Gases',
content:`<h3>What Causes Gas Pressure?</h3>
<p>Gas pressure is caused by <strong>particles colliding with the walls</strong> of their container. Every collision exerts a tiny force on the wall — millions of collisions per second create noticeable pressure.</p>
<ul>
<li>🎈 Blow more air into a balloon → more particles → more collisions → higher pressure → balloon expands</li>
<li>🌡️ Heat a sealed container → particles move faster → harder collisions → higher pressure (danger!)</li>
<li>📦 Compress a gas → smaller volume → particles hit walls more often → higher pressure</li>
</ul>
<p><strong>Pressure Law:</strong> at fixed volume, doubling temperature (in Kelvin) doubles pressure.</p>`,

{title:'Dissolving — The Particle Model',
content:`<h3>How Does Salt Dissolve in Water?</h3>
<p>When a solid dissolves in a liquid, its particles are pulled apart by the liquid particles and spread through the liquid — forming a <strong>solution</strong>. No new substance is made; the particles are just separated and mixed.</p>
<ul>
<li>🧂 Salt (NaCl) breaks into Na⁺ and Cl⁻ ions pulled away by water molecules</li>
<li>🌡️ <strong>Hot water</strong> dissolves more solid faster — particles have more energy to break the crystal apart</li>
<li>🥄 <strong>Stirring</strong> speeds up dissolving — brings fresh water into contact with the solid</li>
<li>🔬 The dissolved particles are too small to be seen — the solution looks clear</li>
</ul>`,
visual:`<svg viewBox="0 0 420 240" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="dis" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0, 7 3, 0 6" fill="#666"/></marker>
  </defs>
  <!-- BEFORE: solid crystal + water -->

{title:'Mini-Quiz: Particles and Changes',
mcq:[
  {q:'When a liquid cools and becomes a solid, the process is called:',opts:['Melting','Condensation','Evaporation','Freezing'],ans:3,exp:'FREEZING is when a liquid LOSES heat energy and becomes a solid. Particles slow down and form a regular, fixed arrangement. Water freezes at 0°C.'},
  {q:'In which state of matter do particles have the MOST energy?',opts:['Solid','Liquid','Gas','All the same'],ans:2,exp:'Gas particles move very fast in all directions — they have the most energy. In solids, particles only vibrate and have the least energy.'},
  {q:'Which process is shown by dry ice disappearing straight into gas without melting?',opts:['Evaporation','Condensation','Sublimation','Diffusion'],ans:2,exp:'SUBLIMATION is when a solid changes directly into a gas without passing through the liquid state. Dry ice (solid CO₂) sublimes at −78°C at normal pressure.'},
]},

{title:'Mini-Quiz: Evaporation and Condensation',
mcq:[
  {q:'Why does sweating cool your body?',opts:['Sweat weighs you down','Sweat evaporates and takes heat energy away from your skin','Sweat is cold','Sweat blocks the sun'],ans:1,exp:'When sweat EVAPORATES, the fastest particles escape and take heat energy with them from your skin. This lowers the temperature — called evaporative cooling.'},
  {q:'Condensation on a cold glass occurs because:',opts:['Water leaks through the glass','Water vapour in air cools and becomes liquid on the cold surface','The glass melts','Ice forms inside and leaks'],ans:1,exp:'CONDENSATION: warm moist air meets a cold surface. Water vapour loses energy, slows down, and becomes liquid water on the glass surface (gas → liquid).'},
  {q:'What is happening on the FLAT section of a heating curve at 100°C?',opts:['Temperature is rising','The thermometer is broken','Heat energy is breaking forces between liquid particles, not raising temperature','Water is cooling down'],ans:2,exp:'The flat section at 100°C shows boiling. ALL the heat energy goes into breaking forces between particles (changing state) rather than raising temperature, so the thermometer stays at 100°C until all liquid becomes gas.'},
]},

  {q:'A gas is heated in a sealed container. What happens to the pressure?',opts:['Decreases','Stays the same','Increases','The gas disappears'],ans:2,exp:'Heating a gas increases the kinetic energy of the particles. They move faster and collide with the container walls more frequently and with greater force — PRESSURE INCREASES.'},
  {q:'Why does a solid have a fixed shape but a liquid does not?',opts:['A solid has more mass','In a solid, particles are held in fixed positions by strong forces; in a liquid, particles can slide past each other','A liquid is heavier','Solids are larger than liquids'],ans:1,exp:'The STRONG FORCES in a solid lock each particle in a fixed position so the solid keeps its shape. In a liquid, forces are weaker and particles can slide past each other, so the liquid takes the shape of its container.'},
  {q:'Diffusion occurs faster when temperature is increased. Why?',opts:['Particles get bigger','Particles have more energy and move faster, spreading more quickly','The container gets bigger','Temperature has no effect on diffusion'],ans:1,exp:'At higher temperatures, particles have MORE KINETIC ENERGY and therefore move FASTER. This means they spread from high to low concentration more quickly — diffusion rate increases with temperature.'},
