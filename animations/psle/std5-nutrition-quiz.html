<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nutrition Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Nutrition & Food — Std 5 Science Quiz',
  color:'#e65100',dark:'#ac1900',light:'#fbe9e7',
    mcq:[
    {q:'Which nutrient is the main source of energy for the body?',opts:['Proteins','Fats','Carbohydrates','Vitamins'],ans:2,exp:'CARBOHYDRATES are the main and quickest source of ENERGY. They include sugars (glucose, sucrose) and starches (found in bread, rice, potatoes). Glucose is used directly by cells for respiration.'},
    {q:'Proteins are needed by the body mainly for:',opts:['Giving quick energy','Growth and repair of cells','Protecting against disease','Keeping bones strong'],ans:1,exp:'PROTEINS are needed for GROWTH and REPAIR of body cells and tissues. They also make enzymes, hormones, and antibodies. Sources: meat, fish, eggs, beans, nuts.'},
    {q:'Which vitamin is made in the skin when exposed to sunlight?',opts:['Vitamin A','Vitamin B','Vitamin C','Vitamin D'],ans:3,exp:'VITAMIN D is produced in the SKIN when it is exposed to SUNLIGHT (UV rays). It is needed for CALCIUM absorption → healthy bones and teeth. Deficiency causes RICKETS.'},
    {q:'Lack of iron in the diet causes:',opts:['Scurvy','Rickets','Anaemia','Night blindness'],ans:2,exp:'Iron is needed to make HAEMOGLOBIN in red blood cells. ANAEMIA (lack of iron) causes tiredness, pale skin, and breathlessness because red blood cells cannot carry enough oxygen. Sources: meat, leafy vegetables, beans.'},
    {q:'The food test for starch uses:',opts:['Biuret solution','Iodine solution','Benedict\'s solution','Ethanol'],ans:1,exp:'IODINE solution tests for STARCH. If starch is present, the iodine changes from yellow-brown to BLUE-BLACK. For proteins: Biuret (purple). For reducing sugars: Benedict\'s (brick-red). For fats: ethanol emulsion test (milky white).'},
    {q:'Which mineral is essential for making haemoglobin in red blood cells?',opts:['Calcium','Iron','Sodium','Potassium'],ans:1,exp:'IRON is a vital mineral used to make HAEMOGLOBIN, the oxygen-carrying protein in red blood cells. Without iron, the body cannot produce enough healthy red blood cells, leading to anaemia.'},
    {q:'A diet that contains all the necessary nutrients in the correct proportions is called:',opts:['A vegetarian diet','A balanced diet','A high-protein diet','A liquid diet'],ans:1,exp:'A BALANCED DIET is one that contains all the necessary nutrients (carbohydrates, proteins, fats, vitamins, minerals, fibre, and water) in the right amounts to maintain good health.'},
    {q:'Which food component provides the body with insulation and a store of energy?',opts:['Carbohydrates','Proteins','Fats','Vitamins'],ans:2,exp:'FATS (lipids) provide a STORED energy reserve, insulate the body against cold, and protect delicate internal organs. They are also important for making cell membranes.'},
    {q:'The deficiency disease caused by a lack of Vitamin C is:',opts:['Rickets','Anaemia','Scurvy','Goitre'],ans:2,exp:'SCURVY is caused by a lack of VITAMIN C. Symptoms include bleeding gums, poor wound healing, and weakness. Citrus fruits (oranges, lemons) are rich sources of Vitamin C.'},
    {q:'Roughage (dietary fibre) is important because it:',opts:['Provides energy','Helps prevent constipation by adding bulk to faeces','Builds muscle','Makes bones stronger'],ans:1,exp:'FIBRE (roughage) is the indigestible part of plant foods. It adds BULK to the faeces, helping food move through the digestive system more easily and preventing CONSTIPATION. Sources: vegetables, fruits, whole grains.'},
    {q:'Which nutrient is needed in the largest amounts for energy?',opts:['Vitamins','Minerals','Carbohydrates','Protein'],ans:2,exp:'CARBOHYDRATES are the body\'s preferred source of ENERGY and are needed in the largest amounts. They are broken down into glucose, which is used in cellular respiration.'},
    {q:'A person who suffers from weak bones and poor bone development may be deficient in:',opts:['Iron and protein','Calcium and Vitamin D','Vitamin C and B','Fibre and water'],ans:1,exp:'CALCIUM and VITAMIN D work together. Vitamin D helps the body absorb calcium, which is essential for strong bones and teeth. Lack of these leads to weak bones and conditions like rickets or osteoporosis.'},
    {q:'The Biuret test is used to test for the presence of:',opts:['Starch','Reducing sugar','Protein','Fat'],ans:2,exp:'The BIURET test is used to test for PROTEIN. When Biuret solution (a mixture of sodium hydroxide and copper sulfate) is added to a protein sample, it turns from blue to PURPLE.'},
    {q:'Which of the following is a rich source of protein?',opts:['Butter and margarine','Bread and rice','Eggs and fish','Oranges and lemons'],ans:2,exp:'EGGS and FISH are excellent sources of PROTEIN. Proteins are essential for growth and repair. Butter/margarine are fats; bread/rice are carbohydrates; oranges/lemons are vitamin C sources.'},
    {q:'The Benedict\'s test is used to detect:',opts:['Starch','Protein','Reducing sugars (like glucose)','Fats'],ans:2,exp:'BENEDICT\'S solution is used to test for REDUCING SUGARS (such as glucose). The sample is heated with Benedict\'s solution. If a reducing sugar is present, it changes from blue to BRICK-RED (or orange/yellow depending on concentration).'},
    {q:'Why is water essential in the diet?',opts:['It provides energy','It is a solvent for chemical reactions and helps regulate body temperature','It builds muscle','It stores vitamins'],ans:1,exp:'Water is vital for life. It acts as a SOLVENT for biochemical reactions, transports nutrients and waste products (in blood and urine), and helps regulate body TEMPERATURE through sweating.'},
    {q:'Vitamin A deficiency can lead to:',opts:['Scurvy','Rickets','Night blindness','Anaemia'],ans:2,exp:'A lack of VITAMIN A can cause NIGHT BLINDNESS, where a person cannot see well in dim light. It is also needed for healthy skin and immune function. Sources: carrots, liver, spinach.'},
    {q:'The test for fat using the emulsion test involves:',opts:['Adding iodine and seeing a colour change','Shaking the food sample with ethanol and water to produce a milky white emulsion','Adding Benedict\'s solution and heating','Adding Biuret solution'],ans:1,exp:'The EMULSION test for fats: Add ETHANOL to the food, shake, then add WATER. If fat is present, a MILKY WHITE EMULSION forms because the fat is insoluble in water.'},
    {q:'A student eats a diet with plenty of carbohydrates but very little protein. Which health problem is most likely to develop?',opts:['Constipation','Poor growth and weakened muscles','Anaemia','Rickets'],ans:1,exp:'Without enough PROTEIN, the body cannot repair tissues or grow properly. This leads to POOR GROWTH and WEAKENED MUSCLES. Carbohydrates provide energy but cannot replace proteins for growth and repair.'},
    {q:'Why is it important for children to have calcium in their diet?',opts:['To provide energy for play','To build strong teeth and growing bones','To prevent scurvy','To improve eyesight'],ans:1,exp:'Children need CALCIUM for the development of STRONG, healthy TEETH and BONES as they grow. Calcium is stored in bones and teeth, giving them strength and structure.'},
  ],
  match:[
    {term:'Carbohydrates',def:'The main source of quick energy for the body; includes sugars and starches (e.g., bread, rice, potatoes)'},
    {term:'Proteins',def:'Nutrients needed for the growth and repair of body cells and tissues (e.g., meat, eggs, fish, beans)'},
    {term:'Fats (Lipids)',def:'A concentrated store of energy; also provides insulation and protection for organs (e.g., oils, butter, nuts)'},
    {term:'Vitamins',def:'Organic nutrients needed in small amounts to regulate body processes and prevent deficiency diseases'},
    {term:'Minerals',def:'Inorganic nutrients needed for various body functions (e.g., calcium for bones, iron for haemoglobin)'},
    {term:'Vitamin C',def:'A vitamin needed for healthy skin, gums, and wound healing; deficiency causes scurvy'},
    {term:'Vitamin D',def:'A vitamin produced in the skin when exposed to sunlight; aids calcium absorption for healthy bones'},
    {term:'Calcium',def:'A mineral essential for building strong bones and teeth; also important for muscle contraction and nerve function'},
    {term:'Iron',def:'A mineral needed to produce haemoglobin in red blood cells for oxygen transport; deficiency causes anaemia'},
    {term:'Fibre (Roughage)',def:'Indigestible plant material that adds bulk to food and helps prevent constipation'},
    {term:'Water',def:'An essential component of the diet; acts as a solvent, transport medium, and helps regulate body temperature'},
    {term:'Balanced diet',def:'A diet containing the correct proportions of all essential nutrients to maintain good health'},
    {term:'Iodine solution',def:'A reagent used in the food test for starch; turns blue-black in the presence of starch'},
    {term:'Biuret test',def:'A food test for protein; turns from blue to purple if protein is present'},
    {term:'Benedict\'s test',def:'A food test for reducing sugars (e.g., glucose); changes from blue to brick-red upon heating'},
    {term:'Emulsion test',def:'A test for fats; involves adding ethanol and water to produce a milky white emulsion'},
    {term:'Anaemia',def:'A deficiency disease caused by lack of iron, leading to tiredness and pale skin'},
    {term:'Scurvy',def:'A deficiency disease caused by lack of Vitamin C, leading to bleeding gums and poor wound healing'},
    {term:'Rickets',def:'A deficiency disease caused by lack of Vitamin D (or calcium), leading to soft, weak bones'},
    {term:'Night blindness',def:'A deficiency disease caused by lack of Vitamin A, causing an inability to see clearly in dim light'},
  ],
  flashcards:[
    {q:'Name the 7 components of a balanced diet and state their main functions.',a:'1. CARBOHYDRATES — provide quick energy. 2. PROTEINS — growth and repair of tissues. 3. FATS — stored energy, insulation, protection. 4. VITAMINS — regulate body processes and prevent diseases. 5. MINERALS — essential for bones, blood, and body functions. 6. WATER — solvent, transport, temperature regulation. 7. FIBRE — aids digestion and prevents constipation.'},
    {q:'State the food tests for starch, protein, and glucose (reducing sugar).',a:'STARCH: Add IODINE solution → turns BLUE-BLACK if positive. PROTEIN: Add BIURET solution (NaOH + CuSO₄) → turns PURPLE if positive. REDUCING SUGAR (glucose): Add BENEDICT\'S solution and HEAT → turns BRICK-RED/ORANGE if positive.'},
    {q:'What is the difference between macronutrients and micronutrients?',a:'MACRONUTRIENTS are needed in LARGE amounts for energy and structure. They include carbohydrates, proteins, and fats. MICRONUTRIENTS are needed in SMALL amounts for regulating body functions. They include vitamins and minerals.'},
    {q:'Name 3 deficiency diseases, their causes, and one food source to prevent them.',a:'1. SCURVY — caused by lack of Vitamin C. Eat citrus fruits (oranges, lemons). 2. RICKETS — caused by lack of Vitamin D/calcium. Eat dairy (milk), get sunlight. 3. ANAEMIA — caused by lack of iron. Eat red meat, leafy green vegetables (spinach), beans.'},
    {q:'Why is water essential for life?',a:'Water is needed for: 1. TRANSPORT — blood carries nutrients and waste. 2. SOLVENT — chemical reactions occur in solution. 3. TEMPERATURE REGULATION — sweating cools the body. 4. DIGESTION — saliva and digestive juices. 5. WASTE REMOVAL — urine removes urea. Approximately 60-70% of our body weight is water.'},
    {q:'Describe the balanced diet and explain why each nutrient is important.',a:'A balanced diet contains carbohydrates (energy), proteins (growth/repair), fats (energy store/insulation), vitamins (regulate processes), minerals (bones, blood), fibre (digestion), and water (all body processes). Eating a variety of foods ensures all these needs are met.'},
    {q:'Explain how you would test a piece of bread for the presence of starch.',a:'Place a few drops of IODINE SOLUTION onto the bread. If starch is present, the iodine will turn from yellow-brown to BLUE-BLACK. This is a simple, reliable test for the presence of starch.'},
    {q:'What are the sources and functions of calcium and iron in the body?',a:'CALCIUM (sources: milk, cheese, leafy greens): needed for strong bones and teeth. IRON (sources: red meat, spinach, beans): needed to make HAEMOGLOBIN in red blood cells for oxygen transport.'},
    {q:'State the symptoms and causes of scurvy, rickets, and anaemia.',a:'SCURVY: bleeding gums, weakness (lack Vitamin C). RICKETS: soft, bowed bones (lack Vitamin D/calcium). ANAEMIA: tiredness, pale skin (lack iron).'},
    {q:'Why are fats an essential part of a balanced diet, despite being associated with weight gain?',a:'Fats are essential because they provide a CONCENTRATED ENERGY STORE, help the body absorb fat-soluble vitamins (A, D, E, K), insulate the body against cold, and protect vital organs. Only excess fat intake leads to health problems.'},
    {q:'Describe how you would carry out the Benedict\'s test for reducing sugars.',a:'1. Add a few drops of BENEDICT\'S solution to the food sample in a test tube. 2. Place the test tube in a boiling water bath and HEAT gently for a few minutes. 3. If a reducing sugar (like glucose) is present, the blue solution will change to BRICK-RED/ORANGE.'},
    {q:'Why do children need more protein per kg of body weight than adults?',a:'Children are in a phase of rapid GROWTH. Proteins are the building blocks for new cells and tissues. Adults have largely completed growth and only need proteins for repair and maintenance.'},
    {q:'What is the role of fibre (roughage) in the digestive system?',a:'Fibre is the indigestible part of plant foods. It adds BULK to the faeces, which stimulates the muscles of the large intestine to move waste along. This helps prevent CONSTIPATION by ensuring regular bowel movements.'},
    {q:'Explain why a person living in a cold climate may need more fats in their diet.',a:'Fats provide INSULATION and act as a heat trap in the body. A layer of fat under the skin (subcutaneous fat) reduces heat loss, helping to maintain body temperature. This is why animals in cold climates have thick fat layers.'},
    {q:'How does Vitamin D help maintain healthy bones?',a:'Vitamin D aids in the ABSORPTION of CALCIUM from the food you eat. Without Vitamin D, the body cannot absorb enough calcium, leading to soft, weak bones (rickets in children or osteoporosis in adults).'},
    {q:'Identify three food sources for each of the following: carbohydrates, proteins, and fats.',a:'CARBOHYDRATES: bread, rice, potatoes. PROTEINS: meat, fish, eggs. FATS: butter, cooking oil, nuts.'},
    {q:'Why is a varied diet better than eating only a few types of food?',a:'A varied diet ensures that all ESSENTIAL NUTRIENTS (vitamins, minerals, amino acids, fatty acids) are consumed in adequate amounts. No single food contains all the nutrients the body needs. A limited diet can lead to nutrient deficiencies.'},
    {q:'What is the difference between the Biuret test and the Benedict\'s test?',a:'The BIURET test uses Biuret reagent to test for PROTEIN (turns purple). The BENEDICT\'S test uses Benedict\'s solution to test for REDUCING SUGARS (turns brick-red when heated).'},
    {q:'Explain the importance of water for temperature regulation.',a:'Water helps regulate body temperature through the process of SWEATING. When the body heats up, sweat is produced. As sweat evaporates from the skin, it removes heat energy from the body, helping to cool the person down.'},
    {q:'A person is constantly tired and has pale skin. What deficiency might they have, and what food should they eat to improve?',a:'These are symptoms of ANAEMIA, caused by a lack of IRON. The person should eat iron-rich foods such as red meat, leafy green vegetables (spinach), beans, and fortified cereals.'},
  ],
  blanks:{
    passage:'Carbohydrates are the main source of [_] for the body and are found in foods like bread and rice. Proteins are essential for the [_] and repair of body cells. A lack of Vitamin C in the diet can lead to a disease called [_]. A deficiency of the mineral iron causes [_], which makes a person feel tired. The chemical test for starch uses iodine solution, which turns the sample [_] if starch is present.',
    answers:['energy','growth','scurvy','anaemia','blue-black'],
    wordbank:['energy','growth','scurvy','anaemia','blue-black','proteins','rickets','vitamins'],
  },
  sentences:[
    {prompt:'Explain why a child whose diet consists almost entirely of rice and bread may become ill over time.',keywords:['balanced diet','protein','vitamins','minerals','deficiency','growth','illness'],hint:'What nutrients are missing or lacking in a diet of only carbohydrates? What health problems could result from these deficiencies over a long period?'},
    {prompt:'Describe the steps you would take in a laboratory to test a food sample to determine if it contains starch.',keywords:['iodine','blue-black','yellow-brown','add','observe','colour change','starch','food test'],hint:'What is the name of the chemical reagent used? What colour change indicates that starch is present?'},
    {prompt:'Explain why fats are an essential component of a healthy diet, even though eating too much fat can be harmful.',keywords:['stored energy','insulation','brain','cell membranes','vitamins','excess','heart disease','essential'],hint:'What are the beneficial roles of fats in the body? What problems can arise if a person consumes too many fats?'},
    {prompt:'A student has bleeding gums and their wounds heal very slowly. Which nutrient are they likely lacking, and what foods should they eat?',keywords:['Vitamin C','scurvy','citrus','oranges','lemons','bleeding gums','wound healing','deficiency'],hint:'What deficiency disease is characterised by these symptoms? What food sources would be good for this condition?'},
    {prompt:'Explain the functions of proteins, carbohydrates, and fats in the body.',keywords:['protein','growth','repair','carbohydrate','energy','fat','insulation','stored energy','diet'],hint:'For each of these three macronutrients, describe its main role in maintaining a healthy body.'},
    {prompt:'Describe how the food tests for proteins and reducing sugars are carried out.',keywords:['Biuret test','purple','protein','Benedict\'s test','brick-red','glucose','reducing sugar','heat'],hint:'Name the reagents used for each test, describe the procedure, and state what a positive result looks like.'},
    {prompt:'Compare the roles of calcium and iron in the human body.',keywords:['calcium','bones','teeth','iron','haemoglobin','blood','oxygen','minerals','deficiency'],hint:'What is each mineral used for? What deficiency disease would a lack of each cause?'},
    {prompt:'Why is water considered one of the most essential components of the diet?',keywords:['water','solvent','transport','temperature','regulation','sweat','digestion','waste','urine'],hint:'List at least three vital functions that water performs in the human body.'},
    {prompt:'A patient is diagnosed with rickets. Explain what is likely causing this condition and suggest how they can improve their bone health.',keywords:['rickets','Vitamin D','calcium','bones','sunlight','milk','dairy','deficiency'],hint:'What two nutrients are essential for bone health? How can the body naturally produce one of them?'},
    {prompt:'Explain the difference between macronutrients and micronutrients, giving two examples of each.',keywords:['macronutrient','carbohydrate','protein','fat','micronutrient','vitamin','mineral','amount'],hint:'One group is needed in large amounts, the other in tiny amounts. What nutrients fall into each group?'},
    {prompt:'State the function of fibre in the digestive system.',keywords:['fibre','roughage','digestion','constipation','bulk','facces','intestine','bowel'],hint:'What happens to fibre in the digestive tract? How does it help maintain a healthy gut?'},
    {prompt:'Explain why a balanced diet must include a variety of foods.',keywords:['variety','nutrients','essential','deficiency','immune system','health','diet'],hint:'Can a single food provide all the nutrients the body needs? Why is eating different types of food important?'},
    {prompt:'Describe the symptoms of iron deficiency anaemia.',keywords:['anaemia','iron','tired','pale','haemoglobin','oxygen','blood','deficiency'],hint:'What physical signs would a person show if they were lacking iron?'},
    {prompt:'Why is a breakfast rich in carbohydrates a good choice for a student?',keywords:['carbohydrates','energy','glucose','brain','respiration','concentration','breakfast'],hint:'How does the body use carbohydrates? Why is it important to have energy at the start of the school day?'},
    {prompt:'A person is experiencing night blindness. What advice would you give them regarding their diet?',keywords:['Vitamin A','night blindness','carrots','liver','deficiency','retinol','eyes','vision'],hint:'Which vitamin is responsible for good vision in dim light? What foods contain this vitamin?'},
    {prompt:'Explain the procedure for the emulsion test for fats.',keywords:['emulsion','ethanol','water','milky','white','fat','test','food'],hint:'What steps are involved? What is the final observation if fat is present?'},
    {prompt:'Compare the roles of carbohydrates and proteins in the body.',keywords:['carbohydrate','energy','protein','growth','repair','body','cells','muscle'],hint:'One provides quick energy; the other builds and fixes body parts. What are the primary roles of each?'},
    {prompt:'What are the symptoms of Vitamin C deficiency, and why is it rare in modern diets?',keywords:['Vitamin C','scurvy','gums','wounds','fruit','vegetables','deficiency','symptoms'],hint:'What disease is caused by lack of Vitamin C? Why is it less common now than in the past?'},
    {prompt:'Explain why athletes often eat a high-carbohydrate meal before a competition.',keywords:['carbohydrate','energy','glucose','muscle','performance','exercise','ATP','glycogen'],hint:'Why is glucose important for muscle function? How does a carbohydrate-rich meal provide long-lasting energy?'},
    {prompt:'Describe how the Biuret test is used to identify proteins in a food sample.',keywords:['Biuret','protein','sodium hydroxide','copper sulfate','purple','food test','detect'],hint:'What are the reagents used? What colour change confirms the presence of protein?'},
  ],
});
</script></body></html>
