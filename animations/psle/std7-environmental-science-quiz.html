<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Environmental Science Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Environmental Science — Std 7 Science Quiz',
  color:'#2e7d32',dark:'#005005',light:'#e8f5e9',
    mcq:[
    {q:'The greenhouse effect is caused mainly by:',opts:['Holes in the ozone layer','Greenhouse gases like CO₂ trapping heat in the atmosphere','Green plants absorbing too much sunlight','The Sun getting hotter'],ans:1,exp:'GREENHOUSE EFFECT: Greenhouse gases (CO₂, methane, water vapour) in the atmosphere ABSORB infrared radiation re-emitted by Earth\'s surface and RE-RADIATE it back → Earth is warmer than it would otherwise be. Human activities increase CO₂ → ENHANCED greenhouse effect → global warming.'},
    {q:'Acid rain is formed when:',opts:['CO₂ dissolves in rainwater','SO₂ and NO₂ from burning fossil fuels dissolve in rainwater','Volcanoes release water vapour','Rivers become polluted'],ans:1,exp:'ACID RAIN forms when SULPHUR DIOXIDE (SO₂) and NITROGEN OXIDES (NOₓ) from burning fossil fuels dissolve in atmospheric water → form sulphuric acid and nitric acid → pH <5.6. Damages forests, lakes (kills aquatic life), buildings, and metals.'},
    {q:'Eutrophication occurs when:',opts:['Rivers freeze over','Excess fertilisers run into water, causing algal blooms and oxygen depletion','Factories dump plastic in rivers','Fish consume too much oxygen'],ans:1,exp:'EUTROPHICATION: excess NITRATES and PHOSPHATES (from fertiliser run-off) → rapid algae GROWTH (algal bloom) → algae block sunlight → aquatic plants die → bacteria decompose dead matter using up all O₂ → fish and other organisms SUFFOCATE. This is a very common water pollution problem.'},
    {q:'Which gas in the stratosphere protects Earth from harmful UV radiation?',opts:['CO₂','N₂','O₃ (ozone)','CH₄'],ans:2,exp:'OZONE (O₃) in the stratosphere (OZONE LAYER) absorbs harmful ULTRAVIOLET (UV) radiation from the Sun. Without it, increased UV reaching Earth\'s surface would increase SKIN CANCER and CATARACTS, and harm ecosystems. CFCs destroy ozone.'},
    {q:'Which of the following is a sustainable practice?',opts:['Burning waste in open fields','Using pesticides in large amounts','Crop rotation and conservation farming','Dumping sewage in rivers'],ans:2,exp:'SUSTAINABLE practices meet present needs without preventing future generations from meeting theirs. CROP ROTATION prevents soil nutrient depletion; conservation farming reduces erosion. Sustainable = protecting resources for the future.'},
    {q:'The main cause of the enhanced greenhouse effect is:',opts:['Natural volcanic eruptions','Increased burning of fossil fuels and deforestation','The Sun\'s activity cycle','Natural animal respiration'],ans:1,exp:'The ENHANCED greenhouse effect is primarily caused by HUMAN activities: BURNING FOSSIL FUELS (coal, oil, gas) releases large amounts of CO₂, and DEFORESTATION reduces the number of trees absorbing CO₂.'},
    {q:'Deforestation leads to soil erosion because:',opts:['Trees block the wind','Tree roots hold the soil in place','Leaves prevent rain from falling','Trees absorb too much water'],ans:1,exp:'Tree ROOTS bind the soil together. When forests are cleared, there are no roots to anchor the topsoil. Rain washes the loose soil away, leading to EROSION, loss of fertile land, and silting of rivers.'},
    {q:'The destruction of the ozone layer is primarily caused by:',opts:['CO₂ emissions','CFCs (Chlorofluorocarbons) from aerosols and refrigerants','Methane from livestock','Nitrogen oxides from cars'],ans:1,exp:'CFCs (Chlorofluorocarbons) are chemicals once used in refrigerators, air conditioners, and aerosol sprays. They rise to the stratosphere and break down ozone (O₃) molecules, thinning the ozone layer.'},
    {q:'Biodiversity loss is a major concern because:',opts:['It makes ecosystems less stable and reduces genetic resources','It increases the number of predators','It causes more rain','It improves air quality'],ans:0,exp:'BIODIVERSITY loss reduces the resilience of ecosystems. A diverse ecosystem is better able to recover from disturbances (drought, disease). Loss of biodiversity also reduces the genetic pool for crops and medicines.'},
    {q:'Which renewable energy source harnesses the power of flowing water?',opts:['Solar','Wind','Hydroelectric','Geothermal'],ans:2,exp:'HYDROELECTRIC power uses the kinetic energy of FALLING or FLOWING WATER to spin turbines and generate electricity. It is renewable and does not produce CO₂ during operation.'},
    {q:'Bioaccumulation of pesticides in a food chain results in:',opts:['Higher concentrations of toxins in top predators (biomagnification)','Immediate death of all plants','Lower nutrient levels in the soil','Cleaner water in rivers'],ans:0,exp:'BIOACCUMULATION (or BIOMAGNIFICATION) occurs when non-biodegradable toxins (like DDT or heavy metals) accumulate in the bodies of organisms. Because each predator eats many prey, the concentration of the toxin INCREASES at each trophic level, becoming most dangerous for top predators like eagles and humans.'},
    {q:'What is the primary source of nitrogen oxides (NOₓ) that contribute to acid rain?',opts:['Agriculture','Vehicle exhausts and power stations','Plastic waste','Deforestation'],ans:1,exp:'NITROGEN OXIDES (NOₓ) are primarily released from the burning of fossil fuels in VEHICLE ENGINES and POWER STATIONS. They react with water vapour to form nitric acid, contributing to acid rain.'},
    {q:'Which of the following is an example of conservation?',opts:['Hunting endangered species','Creating national parks and protected areas','Draining wetlands for farming','Clearing forests for timber'],ans:1,exp:'CONSERVATION involves PROTECTING and MANAGING natural resources. Creating NATIONAL PARKS and GAME RESERVES (like Chobe or Moremi in Botswana) protects habitats and the species within them.'},
    {q:'The greenhouse gas released from the decomposition of waste in landfills is:',opts:['CO₂','Methane (CH₄)','Nitrous oxide','CFCs'],ans:1,exp:'METHANE (CH₄) is a potent greenhouse gas released when organic waste (food, paper) decomposes anaerobically (without oxygen) in LANDFILLS. Methane traps 25 times more heat than CO₂ over a 100-year period.'},
    {q:'One major effect of global warming on polar regions is:',opts:['Increasing ice thickness','Melting of ice caps and rising sea levels','Cooling of the oceans','Expansion of polar deserts'],ans:1,exp:'Global warming is causing temperatures to rise fastest in polar regions. This is causing ICE CAPS and GLACIERS to MELT at an accelerated rate, releasing freshwater into the oceans and causing SEA LEVELS to RISE, threatening coastal communities.'},
    {q:'Plastic pollution is a major environmental issue because:',opts:['Plastic is biodegradable','Plastic is not biodegradable and persists in the environment, harming wildlife','Plastic is easily recycled everywhere','Plastic is made from renewable resources'],ans:1,exp:'PLASTIC does NOT BIODEGRADE easily; it persists in the environment for hundreds of years. Animals mistake it for food (causing starvation), get entangled in it, and microplastics enter the food chain. It is a major threat to marine ecosystems.'},
    {q:'How does conservation farming help improve soil health?',opts:['By burning crop residues','By using heavy machinery on the land','By using minimal tillage, cover crops, and crop rotation','By applying high doses of chemical fertilisers'],ans:2,exp:'Conservation farming uses MINIMAL TILLAGE (no ploughing) to keep soil structure intact, COVER CROPS to protect the soil from rain, and CROP ROTATION to prevent nutrient depletion. This improves soil organic matter and reduces erosion.'},
    {q:'Carbon sequestration refers to:',opts:['The release of carbon from burning coal','The removal and storage of CO₂ from the atmosphere by forests and oceans','The production of carbon in factories','The recycling of carbon in plastic'],ans:1,exp:'CARBON SEQUESTRATION is the process of capturing and storing atmospheric CO₂. Forests act as carbon SINKs because trees ABSORB CO₂ during photosynthesis and store it as biomass. Protecting forests helps reduce global warming.'},
    {q:'Which human activity contributes most to the loss of biodiversity in tropical rainforests?',opts:['Ecotourism','Deforestation for timber and agriculture','Planting native trees','Research and conservation studies'],ans:1,exp:'Deforestation in tropical rainforests (like the Amazon and Congo Basin) destroys the habitat of millions of species. It is driven by logging for timber and clearing land for CATTLE RANCHING and SOYA farming, leading to local and global biodiversity loss.'},
    {q:'What is the main advantage of using solar energy over coal?',opts:['It is cheaper to build','It does not produce greenhouse gases or air pollutants','It works 24 hours a day','It requires less land space'],ans:1,exp:'SOLAR energy is a clean, renewable source. It produces NO CO₂ or other pollutants during operation, unlike coal, which emits large amounts of CO₂, SO₂, and NOₓ when burned.'},
  ],
  match:[
    {term:'Biodiversity',def:'The variety of living organisms found in a specific ecosystem or on Earth as a whole'},
    {term:'Deforestation',def:'The large-scale clearing of forests, leading to loss of biodiversity, increased CO₂, and soil erosion'},
    {term:'Eutrophication',def:'The pollution of water bodies by excess nutrients (nitrates/phosphates) causing algal blooms and oxygen depletion'},
    {term:'Ozone layer',def:'A layer of ozone (O₃) gas in the stratosphere that absorbs harmful ultraviolet (UV) radiation from the Sun'},
    {term:'Carbon footprint',def:'The total amount of greenhouse gases (CO₂ equivalents) released into the atmosphere by an individual, organisation, or activity'},
    {term:'Renewable resource',def:'A natural resource that can be replenished naturally at a rate equal to or faster than its consumption (e.g., solar, wind, wood)'},
    {term:'Non-renewable resource',def:'A finite resource that cannot be replenished on a human timescale (e.g., coal, oil, natural gas)'},
    {term:'Acid rain',def:'Rainwater that is more acidic than normal due to the dissolution of SO₂ and NOₓ from fossil fuel combustion'},
    {term:'Global warming',def:'The long-term increase in Earth\'s average surface temperature due to the enhanced greenhouse effect'},
    {term:'Greenhouse gas',def:'A gas that traps heat in the atmosphere, such as CO₂, methane (CH₄), and water vapour'},
    {term:'Ozone depletion',def:'The thinning of the ozone layer, primarily caused by the release of CFCs (Chlorofluorocarbons)'},
    {term:'CFCs',def:'Ozone-depleting chemicals once used in refrigerators, air conditioners, and aerosol propellants'},
    {term:'Bioaccumulation',def:'The build-up of persistent, toxic substances (like pesticides) in the tissues of organisms over time'},
    {term:'Biomagnification',def:'The increasing concentration of a toxic substance at each successive trophic level in a food chain'},
    {term:'Conservation',def:'The protection and careful management of natural resources and ecosystems to sustain them for the future'},
    {term:'Carbon sink',def:'A natural or artificial reservoir (like a forest or ocean) that absorbs and stores CO₂ from the atmosphere'},
    {term:'Sustainable development',def:'Development that meets the needs of the present without compromising the ability of future generations to meet their own needs'},
    {term:'Desertification',def:'The process by which fertile land becomes desert, often caused by deforestation, overgrazing, and climate change'},
    {term:'Erosion',def:'The wearing away and movement of soil and rock by water, wind, or ice'},
    {term:'Algal bloom',def:'A rapid increase in the population of algae in a water body, often caused by nutrient pollution'},
  ],
  flashcards:[
    {q:'Explain the difference between the natural greenhouse effect and the enhanced greenhouse effect.',a:'The NATURAL greenhouse effect is essential for life: gases like CO₂ trap some heat, keeping Earth warm enough to support life. The ENHANCED greenhouse effect is caused by human activities (burning fossil fuels, deforestation) which add EXTRA greenhouse gases, trapping TOO MUCH heat and causing GLOBAL WARMING.'},
    {q:'State 4 major effects of deforestation on the environment.',a:'1. HABITAT LOSS — reduces biodiversity and causes species extinction. 2. INCREASED CO₂ — fewer trees to absorb CO₂, worsening global warming. 3. SOIL EROSION — without tree roots, topsoil is washed away, leading to desertification. 4. DISRUPTED WATER CYCLE — less transpiration leads to reduced local rainfall.'},
    {q:'Explain how pesticides can harm top predators through bioaccumulation.',a:'BIOACCUMULATION (or BIOMAGNIFICATION): A pesticide enters the food chain (e.g., in plants or water). Small organisms absorb it. As one organism eats many smaller ones, the concentration of the pesticide BUILDS UP. TOP PREDATORS (eagles, large fish, humans) accumulate the HIGHEST concentration, causing severe health problems, reproductive failure, and death.'},
    {q:'Compare renewable and non-renewable energy sources, giving two examples of each.',a:'RENEWABLE: replenished naturally and won\'t run out. Examples: SOLAR (sunlight), WIND, HYDROELECTRIC, GEOTHERMAL. DISADVANTAGE: Can be intermittent (no sun/wind at times). NON-RENEWABLE: finite, will eventually run out. Examples: COAL, OIL, NATURAL GAS. DISADVANTAGE: Produce CO₂ and other pollutants; mining damages ecosystems.'},
    {q:'What is conservation and why is it important for Botswana?',a:'CONSERVATION is the careful management and protection of natural resources and ecosystems. It is important because: 1. Protects BIODIVERSITY (animals like elephants, rhinos). 2. Maintains ECOSYSTEM SERVICES (clean water, pollination). 3. Supports TOURISM (a major economic sector in Botswana). 4. Preserves resources for FUTURE GENERATIONS.'},
    {q:'Describe the process of eutrophication and its effects.',a:'1. Excess fertilisers (nitrates/phosphates) run off from farmland into water. 2. Rapid ALGAL BLOOM occurs. 3. Algae block sunlight, so aquatic plants die. 4. Bacteria decompose the dead plants, using up all the OXYGEN in the water. 5. Fish and other aquatic organisms SUFFOCATE and die.'},
    {q:'How does acid rain damage the environment and human structures?',a:'Acid rain (pH < 5.6) damages: 1. LAKES/RIVERS — acidifies water, killing fish and aquatic life. 2. FORESTS — leaches nutrients from the soil, weakening trees. 3. BUILDINGS — dissolves limestone and marble structures. 4. METALS — corrodes iron and steel, damaging bridges and vehicles.'},
    {q:'Explain the role of the ozone layer and the impact of CFCs on it.',a:'The OZONE LAYER (O₃) in the stratosphere absorbs 99% of harmful UV radiation from the Sun, protecting life on Earth from skin cancer and cataracts. CFCs (from refrigerants and aerosols) rise to the stratosphere and BREAK DOWN OZONE molecules, thinning the layer and allowing more UV radiation to reach Earth.'},
    {q:'State 3 ways individuals can reduce their carbon footprint.',a:'1. Reduce ENERGY use — turn off lights, use energy-efficient bulbs. 2. Use PUBLIC TRANSPORT, walk, or cycle instead of driving alone. 3. Reduce WASTE — recycle, compost food waste, avoid single-use plastics. 4. Eat less MEAT — meat production has a high carbon footprint.'},
    {q:'Explain why Botswana\'s wetlands (like the Okavango Delta) are important to conserve.',a:'The Okavango Delta is a unique wetland ecosystem. Conservation is vital because: 1. It supports high BIODIVERSITY (birds, fish, elephants, hippos). 2. It is a major TOURIST attraction, contributing to the economy. 3. It regulates the LOCAL WATER CYCLE. 4. It provides water and resources for local communities.'},
    {q:'What is the difference between a carbon sink and a carbon source?',a:'A CARBON SINK absorbs more CO₂ than it releases. Examples: FORESTS (through photosynthesis) and OCEANS (dissolving CO₂). A CARBON SOURCE releases more CO₂ than it absorbs. Examples: BURNING FOSSIL FUELS (power stations, cars) and DEFORESTATION.'},
    {q:'Describe the threats to biodiversity in Botswana and how they can be addressed.',a:'Threats: 1. HABITAT LOSS from agricultural expansion. 2. POACHING of elephants and rhinos. 3. HUMAN-WILDLIFE CONFLICT. 4. CLIMATE CHANGE reducing water availability. Solutions: Anti-poaching patrols, community-based conservation programmes (like CBNRM), and sustainable land-use planning.'},
    {q:'How does the burning of fossil fuels contribute to both global warming and acid rain?',a:'Burning coal/oil releases: 1. CO₂ → traps heat, causing GLOBAL WARMING. 2. SO₂ and NOₓ → react with water in the atmosphere to form SULPHURIC and NITRIC ACID → falls as ACID RAIN.'},
    {q:'Explain what desertification is and what causes it.',a:'DESERTIFICATION is the transformation of fertile land into desert. Causes: 1. DEFORESTATION (removes trees holding soil). 2. OVERGRAZING (animals eat all vegetation). 3. POOR FARMING PRACTICES (stripping soil of nutrients). 4. CLIMATE CHANGE (reduced rainfall).'},
    {q:'Why are renewable energy sources considered sustainable?',a:'Renewable energy sources (solar, wind, hydro) are considered SUSTAINABLE because they are naturally replenished and will not run out. They produce LITTLE TO NO CO₂ or other pollutants during operation, helping to reduce global warming and pollution.'},
    {q:'How does overgrazing contribute to land degradation?',a:'Overgrazing happens when too many livestock (cattle, goats) feed on a piece of land, removing all the vegetation. This exposes the SOIL to wind and rain erosion. It also compacts the soil, reducing its ability to absorb water, leading to desertification.'},
    {q:'Explain the importance of crop rotation in sustainable agriculture.',a:'Crop rotation involves planting different crops on the same land in a planned sequence. It prevents the build-up of soil-borne PESTS and DISEASES. Different crops use different nutrients from the soil, preventing nutrient DEPLETION. It also improves soil fertility and yields.'},
    {q:'What is the effect of microplastics on marine ecosystems?',a:'MICROPLASTICS are tiny plastic particles (<5mm) that enter oceans. Marine animals (fish, turtles, plankton) INGEST them, mistaking them for food. This blocks their digestive systems, reduces their ability to feed, and introduces toxins into the food chain.'},
    {q:'Why is public awareness important for environmental conservation?',a:'Public awareness helps people understand the IMPACT of their actions on the environment. It encourages BEHAVIOUR CHANGE (reducing waste, saving energy, supporting conservation policies). It also creates public SUPPORT for environmental laws and protected areas.'},
    {q:'Explain how climate change is affecting agriculture in southern Africa.',a:'Southern Africa is experiencing increasing DROUGHTS, higher temperatures, and more unpredictable rainfall due to climate change. This REDUCES crop yields, increases irrigation costs, and leads to CROP FAILURES. It threatens food security and livelihoods of millions of farmers.'},
  ],
  blanks:{
    passage:'Greenhouse gases like carbon dioxide trap heat in the atmosphere, leading to global warming. The burning of coal and oil releases sulphur dioxide, which dissolves in rainwater to form [_] rain. Excess nitrates from fertilisers running into water bodies cause a process called [_] which depletes oxygen. The layer of ozone in the [_] protects us from harmful ultraviolet radiation. Energy sources like solar and wind are [_] because they will not run out. The variety of species and life in an ecosystem is referred to as [_].',
    answers:['acid','eutrophication','stratosphere','renewable','biodiversity'],
    wordbank:['acid','eutrophication','stratosphere','renewable','biodiversity','greenhouse','troposphere','fossil'],
  },
  sentences:[
    {prompt:'Explain how the widespread clearing of rainforests (deforestation) affects the global carbon cycle and accelerates climate change.',keywords:['CO₂','photosynthesis','absorb','carbon sink','burn','release','greenhouse gas','atmosphere','global warming','climate change'],hint:'What role do healthy forests play in absorbing CO₂? What happens to the carbon stored in trees when they are cut down and burned or left to rot?'},
    {prompt:'Describe the sequence of events in the process of eutrophication, explaining how excess fertilisers ultimately lead to the death of fish in lakes and rivers.',keywords:['nitrates','phosphates','fertiliser','run-off','algal bloom','light','aquatic plants','die','bacteria','oxygen','suffocate','fish','decompose'],hint:'Trace the sequence from the fertiliser entering the water to the fish dying. How does the algal bloom affect light and oxygen levels?'},
    {prompt:'Suggest THREE practical actions an individual living in a city in Botswana could take to reduce their personal carbon footprint and contribute to environmental sustainability.',keywords:['electricity','energy','transport','walk','cycle','public transport','food','local','waste','recycle','solar','reduce','carbon footprint'],hint:'Think about energy use in the home, how you travel from place to place, and the types of food and goods you consume.'},
    {prompt:'Explain the difference between renewable and non-renewable energy sources, giving two examples of each, and state why the world is moving towards renewable sources.',keywords:['renewable','solar','wind','hydroelectric','run out','non-renewable','coal','oil','natural gas','CO₂','pollution','sustainable','greenhouse','climate change'],hint:'One type will never run out; the other is finite. What environmental problems are associated with the non-renewable sources?'},
    {prompt:'Describe three major environmental problems caused by the burning of fossil fuels.',keywords:['fossil fuels','CO₂','global warming','SO₂','acid rain','NOₓ','health','pollution','climate change','greenhouse effect','particulates'],hint:'Think about gases released into the atmosphere and their effects on the climate, the environment, and human health.'},
    {prompt:'Explain how the ozone layer protects life on Earth and what chemical has caused its thinning.',keywords:['ozone layer','O₃','stratosphere','UV radiation','skin cancer','CFCs','chlorofluorocarbons','refrigerants','aerosols','protection','depletion'],hint:'Where is the ozone layer? What does it protect us from? What chemicals have been found to break it down?'},
    {prompt:'Explain what biomagnification (bioaccumulation) is, and why top predators like eagles are often at the greatest risk from pesticides.',keywords:['bioaccumulation','biomagnification','pesticides','food chain','trophic level','top predators','toxin','concentration','accumulate','DDT'],hint:'What happens to the concentration of a toxin as it moves up the food chain? Why does this make animals at the top of the food chain more vulnerable?'},
    {prompt:'What is the main cause of soil erosion, and how does it lead to desertification?',keywords:['soil erosion','deforestation','overgrazing','roots','topsoil','wind','water','desertification','fertile land','degradation'],hint:'What removes the vegetation that protects the soil? How does the loss of topsoil lead to the creation of a desert?'},
    {prompt:'Describe four benefits of conserving biodiversity and protecting natural habitats.',keywords:['biodiversity','conservation','ecosystem services','pollination','clean water','medicines','tourism','climate regulation','future generations'],hint:'What practical and economic benefits do intact ecosystems provide for humans?'},
    {prompt:'Explain how crop rotation and minimal tillage (conservation farming) help maintain healthy soil for sustainable agriculture.',keywords:['crop rotation','nutrients','pests','minimal tillage','erosion','organic matter','soil health','sustainable agriculture'],hint:'How does changing crops each year help the soil? Why is ploughing less beneficial for soil structure?'},
    {prompt:'Describe the formation of acid rain and explain its effects on the environment and infrastructure.',keywords:['SO₂','NOₓ','fossil fuels','coal','sulphuric acid','nitric acid','pH','lakes','forests','buildings','corrosion','acid rain'],hint:'What gases combine with water in the atmosphere to form acid rain? What damage does it cause?'},
    {prompt:'Explain why plastic pollution is a major threat to marine environments, even when the plastic is broken into tiny pieces.',keywords:['plastic','non-biodegradable','microplastics','marine life','entanglement','ingestion','food chain','toxins','persistent','harm'],hint:'What happens to plastic in the ocean over time? How does it affect marine animals and the broader food chain?'},
    {prompt:'Define the term "carbon footprint" and state three lifestyle changes a person can make to lower theirs.',keywords:['carbon footprint','CO₂','greenhouse gas','lifestyle','energy','transport','waste','recycling','diet','public transport','renewable'],hint:'What does the term measure? What daily choices contribute to it, and how can they be changed?'},
    {prompt:'Describe the link between deforestation and climate change.',keywords:['deforestation','climate change','CO₂','carbon sink','photosynthesis','temperature','greenhouse gas','atmosphere','global warming'],hint:'How do trees influence the amount of CO₂ in the atmosphere? What happens to global temperatures when large areas of forest are removed?'},
    {prompt:'Explain the concept of sustainable development and why it is important.',keywords:['sustainable development','future generations','resources','economic growth','environmental protection','social equity','Brundtland','long-term'],hint:'What does it mean to meet the needs of the present without harming the future? Why is this balance necessary?'},
    {prompt:'What are the main threats to biodiversity in southern Africa, and how can they be addressed?',keywords:['biodiversity','threats','habitat loss','poaching','climate change','conservation','protected areas','community involvement','anti-poaching','CBNRM'],hint:'What human activities are reducing the number of species? What strategies are used to protect wildlife and habitats?'},
    {prompt:'Describe how the greenhouse effect works naturally, and explain why it is becoming a problem today.',keywords:['greenhouse effect','infrared','radiation','CO₂','trap','heat','natural','enhanced','fossil fuels','global warming'],hint:'How do gases like CO₂ keep the Earth warm? Why is this natural process being amplified?'},
    {prompt:'Explain the benefits of Botswana\'s policy of high-value, low-impact tourism in the Okavango Delta.',keywords:['Okavango Delta','ecotourism','low-impact','conservation','economic development','communities','wildlife','habitat','sustainability'],hint:'How does high-value tourism balance economic benefits with environmental protection?'},
    {prompt:'Discuss the role of international agreements like the Paris Agreement in tackling climate change.',keywords:['Paris Agreement','climate change','CO₂','emissions','global warming','international','targets','renewable','commitments','UNFCCC'],hint:'How do countries work together to address a global problem? What does the Paris Agreement ask countries to do?'},
    {prompt:'Explain how water pollution from agriculture (e.g., fertiliser run-off) affects both the environment and human communities.',keywords:['agriculture','water pollution','fertilisers','nitrates','eutrophication','drinking water','aquatic life','health','contamination','algae','oxygen'],hint:'What happens to water when fertilisers wash into it? How does this affect wildlife, and what are the risks for people living downstream?'},
  ],
});
</script></body></html>
