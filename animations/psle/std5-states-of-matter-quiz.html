<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>States of Matter Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'States of Matter — Std 5 Science Quiz',
  color:'#006064',dark:'#00363a',light:'#e0f7fa',
    mcq:[
    {q:'In which state of matter are particles closest together and most strongly attracted?',opts:['Gas','Liquid','Solid','Plasma'],ans:2,exp:'In a SOLID, particles are CLOSEST together in a regular arrangement (lattice) with very strong forces between them. They vibrate in fixed positions — this is why solids keep their shape.'},
    {q:'When a liquid changes to a gas, the process is called:',opts:['Condensation','Solidification','Evaporation','Sublimation'],ans:2,exp:'EVAPORATION (or BOILING at boiling point) is when a liquid changes to a gas. Heat energy gives particles enough energy to escape from the liquid surface and become gas particles.'},
    {q:'Water condenses on a cold glass because:',opts:['The glass is melting','Water vapour in air cools and becomes liquid','The glass is evaporating','Ice forms inside the glass'],ans:1,exp:'CONDENSATION: water vapour in warm air hits the COLD glass surface, LOSES energy, and turns back into liquid water. This is condensation — gas → liquid.'},
    {q:'The boiling point of water at sea level is:',opts:['0°C','37°C','100°C','212°C'],ans:2,exp:'Water BOILS at 100°C at sea level (standard pressure). It FREEZES/MELTS at 0°C. At high altitudes (lower pressure) it boils at a lower temperature.'},
    {q:'In which state do particles move fastest and have the most energy?',opts:['Solid','Liquid','Gas','All the same'],ans:2,exp:'In a GAS, particles move VERY FAST in all directions with large gaps between them. They have the MOST ENERGY. In solids, particles only vibrate — they have the LEAST energy.'},
    {q:'Which change of state occurs when a solid turns directly into a gas?',opts:['Melting','Evaporation','Sublimation','Condensation'],ans:2,exp:'SUBLIMATION is the process where a solid changes directly into a gas without passing through the liquid state. Examples include dry ice (solid CO₂) and iodine crystals.'},
    {q:'When a gas changes into a liquid, the process is called:',opts:['Freezing','Melting','Condensation','Evaporation'],ans:2,exp:'CONDENSATION is the change of state from GAS to LIQUID. This happens when gas particles lose energy and slow down enough for the attractive forces between them to pull them together into a liquid.'},
    {q:'In a liquid, the particles:',opts:['Are fixed in a regular pattern','Vibrate in fixed positions','Slide and move past each other','Move freely in all directions'],ans:2,exp:'In a LIQUID, particles are close together but are NOT fixed in a regular pattern. They have enough energy to SLIDE and MOVE PAST each other, which allows liquids to flow and take the shape of their container.'},
    {q:'Which process requires the ABSORPTION (taking in) of heat energy?',opts:['Freezing','Condensation','Melting','Solidification'],ans:2,exp:'MELTING (solid → liquid) requires the ABSORPTION of heat energy. The added energy gives particles more kinetic energy, allowing them to overcome the forces holding them in a fixed lattice.'},
    {q:'The temperature at which a liquid changes into a solid is called the:',opts:['Boiling point','Melting point','Freezing point','Condensation point'],ans:2,exp:'The FREEZING point is the temperature at which a liquid changes into a solid. For water, this is 0°C. The melting point and freezing point of a pure substance are the same temperature.'},
    {q:'Why do gases have no fixed shape or volume?',opts:['Because particles are very closely packed','Because particles move freely and spread out to fill any container','Because particles are frozen in place','Because particles are very small'],ans:1,exp:'Gases have NO fixed shape or volume because their particles are far apart and moving RAPIDLY in all directions. They spread out to fill the entire container they are in.'},
    {q:'When water freezes into ice, what happens to the arrangement of water particles?',opts:['They move faster','They become more disordered','They form a regular crystalline structure','They spread far apart completely'],ans:2,exp:'When water freezes, the particles lose energy and arrange themselves into a REGULAR, FIXED CRYSTALLINE STRUCTURE (ice lattice). This is why ice has a definite shape. Interestingly, ice is less dense than water, which is why it floats.'},
    {q:'A puddle of water disappears on a hot, sunny day. This is because of:',opts:['Condensation','Sublimation','Evaporation','Freezing'],ans:2,exp:'The heat from the sun provides energy to the water particles in the puddle. The most energetic particles escape from the surface into the air as water vapour. This is EVAPORATION.'},
    {q:'Solids cannot be compressed easily because:',opts:['Their particles are far apart','Their particles are very close with almost no empty space between them','They are hard','Their particles move very fast'],ans:1,exp:'Solids have particles that are VERY CLOSE together in a regular lattice with almost NO EMPTY SPACES. Therefore, there is no room for the particles to be pushed closer together, so solids CANNOT be compressed easily.'},
    {q:'What happens to the particles of a substance as it cools down?',opts:['They gain energy and move faster','They lose energy and move slower','They stay the same','They become larger'],ans:1,exp:'When a substance COOLS, its particles LOSE kinetic energy. This causes them to move SLOWER and, eventually, they may become arranged in fixed positions (solid). This is why heating causes particles to move faster.'},
    {q:'Which statement about boiling is true?',opts:['Boiling only occurs at the surface of the liquid','Boiling occurs throughout the liquid at a specific temperature','Boiling happens at any temperature','Boiling does not require heat'],ans:1,exp:'BOILING occurs THROUGHOUT the entire liquid at a specific temperature called the boiling point (100°C for water). Bubbles of vapour form everywhere within the liquid, not just at the surface.'},
    {q:'Sublimation is most easily observed with:',opts:['Water','Dry ice (solid carbon dioxide) and iodine','Table salt','Sugar'],ans:1,exp:'Dry ice (solid CO₂) and iodine crystals SUBLIME — they change directly from solid to gas when warmed, without becoming a liquid. You can see the purple gas of iodine or the white fog of dry ice.'},
    {q:'When liquid water is placed in a freezer, it turns into ice. This process is called:',opts:['Melting','Condensation','Freezing','Evaporation'],ans:2,exp:'FREEZING (or solidification) is the change of state from liquid to solid. In a freezer, water particles lose energy and rearrange into a rigid ice lattice.'},
    {q:'Why do liquids take the shape of their container?',opts:['Because their particles are arranged in a fixed pattern','Because their particles are far apart','Because their particles can slide and flow past each other','Because their particles do not move'],ans:2,exp:'Liquids take the shape of their container because their particles are close together but can SLIDE and FLOW past each other. They do not have a fixed, rigid arrangement like solids.'},
    {q:'Which of the following is NOT a state of matter?',opts:['Solid','Liquid','Gas','Energy'],ans:3,exp:'ENERGY is not a state of matter. The three common states of matter are SOLID, LIQUID, and GAS. Plasma is sometimes called the fourth state of matter. Energy is the ability to do work.'},
  ],
  match:[
    {term:'Solid',def:'A state of matter where particles are closely packed in a regular pattern and vibrate in fixed positions'},
    {term:'Liquid',def:'A state of matter where particles are close together but can slide and move past each other, allowing the substance to flow'},
    {term:'Gas',def:'A state of matter where particles are far apart and move freely and rapidly in all directions'},
    {term:'Melting',def:'The change of state from solid to liquid, which requires the absorption of heat energy'},
    {term:'Freezing',def:'The change of state from liquid to solid, which releases heat energy to the surroundings'},
    {term:'Evaporation',def:'The change of state from liquid to gas, which occurs at the surface of a liquid at any temperature below its boiling point'},
    {term:'Condensation',def:'The change of state from gas to liquid, which releases heat energy to the surroundings'},
    {term:'Sublimation',def:'The change of state from solid directly to gas, without passing through the liquid phase (e.g., dry ice)'},
    {term:'Boiling',def:'The rapid change of state from liquid to gas, which occurs throughout the liquid at a specific boiling point'},
    {term:'Melting point',def:'The constant temperature at which a solid changes into a liquid (e.g., 0°C for ice)'},
    {term:'Boiling point',def:'The constant temperature at which a liquid changes into a gas (e.g., 100°C for water at sea level)'},
    {term:'Freezing point',def:'The constant temperature at which a liquid changes into a solid (0°C for water)'},
    {term:'Particle model',def:'A scientific model that describes matter as being made of tiny particles that are in constant motion'},
    {term:'Kinetic energy',def:'The energy an object or particle has due to its motion'},
    {term:'Intermolecular forces',def:'The forces of attraction between particles that hold them together in solids and liquids'},
    {term:'Compressibility',def:'The ability of a substance to be reduced in volume by applying pressure; gases are highly compressible'},
    {term:'Density',def:'The mass of a substance per unit volume (ρ = m/V); solids are generally more dense than liquids and gases'},
    {term:'Volume',def:'The amount of space an object or substance occupies'},
    {term:'Diffusion',def:'The process by which particles spread out from an area of high concentration to an area of low concentration'},
    {term:'Expansion',def:'The increase in volume of a substance when it is heated (particles move further apart)'},
  ],
  flashcards:[
    {q:'Describe the arrangement and movement of particles in a solid, liquid, and gas.',a:'SOLID: Regular lattice arrangement; particles vibrate in fixed positions; very close together; very strong forces. LIQUID: Irregular arrangement; particles slide and move past each other; close but can flow; moderate forces. GAS: Random arrangement; particles move freely and rapidly in all directions; far apart; very weak forces.'},
    {q:'Explain why gases can be compressed but solids cannot.',a:'In a GAS, particles are FAR APART with large EMPTY SPACES between them. Applying pressure forces particles closer together, so gases CAN be compressed. In SOLIDS, particles are already VERY CLOSE together with almost no empty space, so they CANNOT be compressed further.'},
    {q:'Why does evaporation cause a cooling effect on the surface of a liquid?',a:'During evaporation, the FASTEST-MOVING (most energetic) particles escape from the liquid surface. The remaining particles have a LOWER average kinetic energy, which means a LOWER temperature. This is why sweating cools you down — sweat evaporates and removes heat from your skin.'},
    {q:'Explain what happens to water particles when water reaches its boiling point.',a:'At 100°C, water particles have gained enough energy to completely overcome the forces holding them together in the liquid. They leave the liquid and become STEAM (water vapour) — gas particles. The temperature does NOT rise above 100°C while boiling because the energy is used to break the forces between particles (latent heat).'},
    {q:'State the differences between evaporation and boiling.',a:'EVAPORATION: Occurs only at the SURFACE of the liquid; happens at ANY temperature below the boiling point; is a slow process. BOILING: Occurs THROUGHOUT the liquid; happens only at the BOILING POINT (100°C for water); is a rapid process with bubbles forming throughout the liquid.'},
    {q:'Describe what happens to the particles of a solid when it is heated to its melting point.',a:'When a solid is heated, its particles gain energy and vibrate more vigorously. At the melting point, the vibrations are strong enough to overcome the forces holding the particles in their fixed lattice. The particles become able to slide past each other, and the solid changes to a liquid.'},
    {q:'Why does a liquid have a definite volume but no definite shape?',a:'A liquid has a DEFINITE VOLUME because its particles are close together and cannot be easily compressed. However, it has NO DEFINITE SHAPE because the particles can SLIDE and flow past each other, allowing the liquid to take the shape of its container.'},
    {q:'Explain why dry ice (solid carbon dioxide) does not leave a puddle when it melts.',a:'Dry ice undergoes SUBLIMATION. It changes directly from a SOLID to a GAS without passing through the liquid state. Therefore, it does not form a liquid puddle when it warms up.'},
    {q:'A student leaves a glass of cold water on a table. After a few minutes, they notice water droplets on the outside of the glass. Explain this observation.',keywords:['condensation','water vapour','cold','glass','liquid','energy'],hint:'What is the temperature of the glass? What is in the air around it? What happens when the air hits the cold glass?'},
    {q:'Why does a puddle of water dry up faster on a windy day than on a still day?',a:'Wind moves the air above the puddle, REMOVING the water vapour that has just evaporated. This keeps the concentration of water vapour near the surface LOW, which increases the rate of evaporation. Wind also adds energy to the water particles.'},
    {q:'Explain why boiling is considered a rapid change of state.',a:'Boiling is rapid because it occurs THROUGHOUT the liquid at a specific temperature. Bubbles of water vapour form everywhere within the liquid simultaneously. In contrast, evaporation only occurs at the surface and is a much slower process.'},
    {q:'Why do substances expand when heated?',a:'When substances are heated, the particles gain KINETIC ENERGY and move FASTER. This increased motion causes the particles to PUSH FARTHER APART on average, leading to an overall increase in volume (expansion).'},
    {q:'What is the difference between diffusion and evaporation?',a:'DIFFUSION is the movement of particles from an area of high concentration to an area of low concentration. EVAPORATION is the change of state from liquid to gas at the surface of a liquid, which can occur even without a concentration gradient.'},
    {q:'Explain why water in a sealed bottle does not evaporate away.',a:'In a sealed bottle, the water vapour that evaporates from the surface is TRAPPED inside the bottle. The space above the liquid quickly becomes SATURATED with water vapour, so no more liquid can evaporate. This is an equilibrium between evaporation and condensation.'},
    {q:'What is the difference between the boiling point and the melting point of a substance?',a:'The BOILING POINT is the temperature at which a liquid changes into a gas. The MELTING POINT is the temperature at which a solid changes into a liquid. For water, the melting point is 0°C and the boiling point is 100°C.'},
    {q:'If you increase the pressure on a gas, the volume decreases. Why?',a:'Increasing pressure FORCES the gas particles CLOSER TOGETHER, reducing the amount of empty space between them. This causes the gas to occupy a smaller volume while its mass remains the same.'},
    {q:'Describe how the arrangement of particles changes when a liquid freezes.',a:'When a liquid freezes, the particles LOSE KINETIC ENERGY and move slower. The forces of attraction between them become strong enough to pull them into a REGULAR, RIGID LATTICE. The particles become fixed in position, changing from a liquid to a solid.'},
    {q:'What is the role of heat in a change of state?',a:'Heat energy is either ABSORBED or RELEASED during a change of state. When a solid melts or a liquid evaporates, heat energy is ABSORBED (taken in) to break the forces between particles. When a gas condenses or a liquid freezes, heat energy is RELEASED as the particles come closer together.'},
    {q:'Why do you feel cold when you get out of a swimming pool on a windy day?',a:'Water on your skin EVAPORATES, using heat energy from your skin to turn the liquid into a gas. The wind speeds up evaporation by carrying away the water vapour. This removes heat from your body, making you feel cold.'},
    {q:'Explain why a container of water slowly loses volume over time, even if it is not heated.',a:'The water undergoes EVAPORATION. Some particles at the surface gain enough kinetic energy from the surroundings (even at room temperature) to escape into the air as water vapour, slowly reducing the total volume of the liquid.'},
  ],
  blanks:{
    passage:'Matter exists in three main states: solid, liquid, and gas. In a solid, the particles are very [_] together in a regular arrangement and only vibrate in fixed positions. When a solid is heated, it absorbs energy and changes into a liquid; this process is called [_]. When a liquid cools down and turns into a solid, the process is called [_]. The change of state from a gas to a liquid is known as [_]. Gases can be easily [_] because their particles are far apart with large spaces between them.',
    answers:['close','melting','freezing','condensation','compressed'],
    wordbank:['close','melting','freezing','condensation','compressed','far','evaporates','sublimation'],
  },
  sentences:[
    {prompt:'Explain why a puddle of water on the road completely disappears on a hot, sunny day, using the particle model.',keywords:['evaporation','heat','energy','gas','water vapour','surface','particles','sun'],hint:'What happens to the water particles when they absorb heat from the sun? Where do they go? What change of state is occurring?'},
    {prompt:'Using the particle model, describe the differences in the arrangement and movement of particles in a liquid compared to a gas.',keywords:['close','far apart','random','slide','free','spaces','forces','arrangement'],hint:'How closely packed are the particles in each state? How do they move in each state? What kind of forces act between them?'},
    {prompt:'Explain why tiny water droplets appear on the outside of a cold bottle of water when it is taken out of the fridge on a hot day.',keywords:['water vapour','air','cools','condenses','liquid','temperature','condensation','glass'],hint:'What is present in the warm air around the bottle? What happens when this comes into contact with the cold surface of the bottle?'},
    {prompt:'A student leaves an uncovered beaker of water on a table. After a week, the volume of the water has noticeably decreased. Explain why, even though the room was not hot.',keywords:['evaporation','particles','energy','surface','liquid','vapour','volume','room temperature'],hint:'Do particles in a liquid always stay in the liquid? Can some particles escape even without heating? Where do they go?'},
    {prompt:'Explain why solids have a fixed shape while liquids take the shape of their container.',keywords:['solid','lattice','vibrate','fixed','liquid','slide','flow','container','shape','particles'],hint:'How does the arrangement and freedom of movement of particles determine whether a substance has a fixed shape or not?'},
    {prompt:'When water is heated in a kettle, it eventually boils. Compare the process of boiling with evaporation.',keywords:['boiling','evaporation','surface','throughout','bubbles','temperature','100°C','particles'],hint:'Where do these processes happen? At what temperature do they happen? Do bubbles form?'},
    {prompt:'Explain the process of sublimation using dry ice as an example.',keywords:['sublimation','dry ice','solid','gas','direct','solid carbon dioxide','state','change'],hint:'Does dry ice melt into a liquid first? What happens to it as it warms up?'},
    {prompt:'A car tyre feels harder after a long journey on a hot road. Explain this in terms of particles.',keywords:['tyre','harder','heat','particles','kinetic energy','expand','pressure','temperature'],hint:'What happens to the air particles inside the tyre when they are heated by the hot road? How does this affect the pressure inside the tyre?'},
    {prompt:'Describe what happens to the particles in an ice cube when it is left out of the freezer at room temperature.',keywords:['ice','particles','heat','energy','melt','liquid','water','temperature'],hint:'What happens to the movement and arrangement of particles as they absorb heat from the surroundings?'},
    {prompt:'Explain why a gas is much easier to compress than a liquid or a solid.',keywords:['compress','gas','spaces','particles','far apart','pressure','liquid','solid','volume'],hint:'What is the difference in the amount of empty space between particles in a gas compared to a liquid or solid?'},
    {prompt:'A student says that water boils at 100°C everywhere in the world. Is this statement correct? Explain.',keywords:['boiling point','100°C','altitude','sea level','pressure','water','boil','mountain'],hint:'Does air pressure affect the boiling point? What happens to air pressure at high altitudes?'},
    {prompt:'Explain why a wet towel dries faster on a warm, windy day than on a cold, still day.',keywords:['evaporation','warm','wind','dry','towel','energy','surface','temperature','convection'],hint:'How do both temperature and wind affect the rate of evaporation?'},
    {prompt:'Using the particle model, explain what happens when water vapour condenses on a cold mirror.',keywords:['water vapour','condenses','cold','mirror','gas','liquid','particles','energy','loss'],hint:'What causes the gas particles to change into a liquid? What happens to their energy?'},
    {prompt:'Describe the differences between boiling and evaporation.',keywords:['boiling','evaporation','surface','throughout','temperature','bubbles','fast','slow','heat'],hint:'Where do these changes occur? At what temperature do they occur? How fast are they?'},
    {prompt:'Explain why a balloon filled with helium will expand slightly if left in a hot car.',keywords:['balloon','helium','heat','expand','temperature','particles','kinetic energy','volume'],hint:'What happens to the helium particles when the temperature inside the car increases? How does this affect the size of the balloon?'},
    {prompt:'Why do particles in a solid vibrate in place rather than moving around freely like in a liquid?',keywords:['solid','vibrate','forces','attract','fixed','lattice','kinetic energy','movement'],hint:'What holds the particles in a solid in their fixed positions? Does the kinetic energy of particles in a solid allow them to overcome these forces?'},
    {prompt:'Explain what happens to the temperature of boiling water if you continue to add heat to it.',keywords:['boiling water','temperature','heat','energy','latent heat','state change','100°C','steam'],hint:'Does the temperature increase past 100°C? Where does the added heat energy go?'},
    {prompt:'A student places a pot of cold water on a stove and turns the heat on. Describe the changes in the movement and arrangement of water particles as the water heats up and boils.',keywords:['heat','particles','energy','movement','boil','steam','water','temperature','100°C'],hint:'What happens to the particles as the temperature rises? What happens when they reach the boiling point?'},
    {prompt:'Explain why a solid has a definite shape and volume.',keywords:['solid','definite','shape','volume','lattice','fixed','vibrate','particles'],hint:'What holds the particles in a solid in a fixed arrangement? Does the space between particles change easily?'},
    {prompt:'Compare the particle arrangements and movements in a solid, a liquid, and a gas.',keywords:['solid','liquid','gas','arrangement','movement','particles','forces','energy','state'],hint:'For each state, describe how closely packed the particles are, how they move, and what kind of forces hold them together.'},
  ],
});
</script></body></html>
