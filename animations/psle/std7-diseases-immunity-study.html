{title:'What Are Diseases?',content:`<h2>Disease = Illness from Pathogens or Dysfunction</h2><p><strong>Pathogens</strong> cause infectious diseases:</p><ul><li>🦠 <strong>Bacteria</strong> — single-celled, cause strep throat, food poisoning</li><li>🧬 <strong>Viruses</strong> — need host cells, cause colds, flu, COVID-19</li><li>🍄 <strong>Fungi</strong> — cause athlete's foot, ringworm</li><li>🐛 <strong>Parasites</strong> — worms, protozoa that feed on hosts</li></ul><p><strong>Transmission:</strong> Droplets, contact, contaminated food/water</p>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><circle cx="80" cy="80" r="20" fill="#1e88e5" stroke="#0d47a1" stroke-width="2"/><text x="80" y="85" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Bacteria</text><circle cx="160" cy="80" r="20" fill="#ff5252" stroke="#c62828" stroke-width="2"/><text x="160" y="85" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Virus</text><circle cx="240" cy="80" r="20" fill="#ab47bc" stroke="#7b1fa2" stroke-width="2"/><text x="240" y="85" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Fungi</text><circle cx="320" cy="80" r="20" fill="#ff9800" stroke="#e65100" stroke-width="2"/><text x="320" y="85" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Parasite</text><rect x="60" y="140" width="300" height="80" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/><text x="210" y="160" font-size="9" fill="#333" font-weight="bold" text-anchor="middle">Transmission Routes</text><circle cx="100" cy="190" r="8" fill="#e65100"/><text x="100" y="220" font-size="7" fill="#333" text-anchor="middle">Droplets</text><circle cx="160" cy="190" r="8" fill="#e65100"/><text x="160" y="220" font-size="7" fill="#333" text-anchor="middle">Contact</text><circle cx="220" cy="190" r="8" fill="#e65100"/><text x="220" y="220" font-size="7" fill="#333" text-anchor="middle">Food/Water</text><circle cx="280" cy="190" r="8" fill="#e65100"/><text x="280" y="220" font-size="7" fill="#333" text-anchor="middle">Air</text></svg>`}
,{title:'Immune System Defense',content:`<h2>Body's Defense Against Pathogens</h2><p><strong>Three lines of defense:</strong></p><ol><li><strong>Physical barriers</strong> — skin, mucus, stomach acid (prevent entry)</li><li><strong>Innate immunity</strong> — white blood cells attack immediately</li><li><strong>Adaptive immunity</strong> — antibodies specifically target pathogens</li></ol><p><strong>Key cells:</strong> Phagocytes engulf invaders, T-cells coordinate response, B-cells produce antibodies</p><p><strong>Memory:</strong> Once infected, immune cells remember and respond faster next time!</p>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><rect x="50" y="30" width="320" height="30" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="210" y="50" font-size="9" fill="#2e7d32" font-weight="bold" text-anchor="middle">Physical Barriers (Skin, Mucus)</text><circle cx="100" cy="120" r="18" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/><circle cx="100" cy="120" r="9" fill="#fff"/><text x="100" y="160" font-size="8" fill="#555" text-anchor="middle">Phagocyte</text><circle cx="160" cy="120" r="18" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/><text x="160" y="125" font-size="7" fill="#fff" font-weight="bold" text-anchor="middle">T-cell</text><text x="160" y="160" font-size="8" fill="#555" text-anchor="middle">Coordinator</text><circle cx="220" cy="120" r="18" fill="#ff9800" stroke="#e65100" stroke-width="2"/><text x="220" y="125" font-size="7" fill="#fff" font-weight="bold" text-anchor="middle">B-cell</text><text x="220" y="160" font-size="8" fill="#555" text-anchor="middle">Antibody</text><circle cx="280" cy="120" r="18" fill="#64b5f6" stroke="#1565c0" stroke-width="2"/><text x="280" y="125" font-size="7" fill="#fff" font-weight="bold" text-anchor="middle">Antibody</text><text x="280" y="160" font-size="8" fill="#555" text-anchor="middle">Attacker</text><circle cx="100" cy="200" r="8" fill="#ff5252" stroke="#c62828" stroke-width="1.5"/><text x="100" y="235" font-size="7" fill="#333" text-anchor="middle">Invader</text></svg>`}
,{title:'Vaccines & Prevention',content:`<h2>Training the Immune System</h2><p><strong>Vaccines</strong> = weak/dead pathogens train immunity WITHOUT causing disease</p><p><strong>How they work:</strong></p><ol><li>Inject weakened pathogen</li><li>Immune system recognizes it</li><li>Produces antibodies & memory cells</li><li>Protected against real infection!</li></ol><p><strong>Prevention tips:</strong> Wash hands, cover coughs, stay home when sick, maintain hygiene</p>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><circle cx="80" cy="80" r="15" fill="#ff5252" stroke="#c62828" stroke-width="2"/><text x="80" y="85" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Pathogen</text><rect x="110" y="70" width="30" height="20" rx="4" fill="#2196f3" stroke="#1565c0" stroke-width="2"/><text x="125" y="83" font-size="7" fill="#fff" font-weight="bold" text-anchor="middle">Vaccine</text><circle cx="200" cy="80" r="18" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/><circle cx="200" cy="80" r="9" fill="#fff"/><text x="200" y="115" font-size="8" fill="#555" text-anchor="middle">WBC trained</text><circle cx="280" cy="80" r="18" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/><text x="280" y="85" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Memory</text><text x="280" y="115" font-size="8" fill="#555" text-anchor="middle">Protected</text><line x1="95" y1="80" x2="110" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/><line x1="155" y1="80" x2="180" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/><line x1="218" y1="80" x2="260" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/><text x="210" y="180" font-size="9" fill="#333" font-weight="bold" text-anchor="middle">Prevention: Hygiene, Vaccines, Healthy Habits</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#333"/></marker></defs></svg>`}
