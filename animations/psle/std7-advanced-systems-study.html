<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="../study-engine.js"></script>
<script>
const STEPS=[
{title:'The Nervous System',content:`<h2>Your Body's Control Network</h2><p>The <strong>nervous system</strong> coordinates all body activities by sending electrical impulses along nerve cells (neurones).</p><p><strong>Main parts:</strong></p><ul><li>🧠 <strong>Brain</strong> — central control; has 3 main regions</li><li>🔗 <strong>Spinal cord</strong> — connects brain to body</li><li>🕸️ <strong>Peripheral nerves</strong> — network throughout body</li></ul><p><strong>Brain regions:</strong></p><ul><li><strong>Cerebrum</strong> — conscious thought, memory, senses, voluntary movement</li><li><strong>Cerebellum</strong> — coordination, balance, fine movement</li><li><strong>Medulla oblongata</strong> — automatic functions: breathing, heart rate</li></ul>`,draw(p){p.setup=()=>{p.createCanvas(420,280);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};let t=0,pulse=0;p.draw=()=>{p.background(245);pulse=(Math.sin(t*0.08)+1)/2;p.fill(p.lerpColor(p.color('#e8eaf6'),p.color('#3949ab'),pulse*0.6));p.noStroke();p.ellipse(210,90,180,100);p.fill('#fff');p.textSize(12);p.text('CEREBRUM',210,82);p.textSize(9);p.text('Thinking, memory, senses',210,98);p.fill('#e1f5fe');p.noStroke();p.ellipse(270,148,80,50);p.fill('#555');p.textSize(10);p.text('Cerebellum',270,145);p.textSize(8);p.text('Balance',270,158);p.fill('#fce4ec');p.ellipse(210,165,70,36);p.fill('#555');p.textSize(9);p.text('Medulla',210,163);p.textSize(8);p.text('Auto',210,175);p.stroke('#3949ab');p.strokeWeight(6);p.line(210,183,210,260);const iy=183+pulse*70;p.fill('#ffd600');p.noStroke();p.ellipse(210,iy,12,12);p.fill('#333');p.textSize(11);p.text('Impulse travelling down spinal cord',210,275);t++;};}}

,{title:'Reflex Actions',content:`<h2>Fast Automatic Responses</h2><p>A <strong>reflex action</strong> is an automatic, very fast response to a stimulus — it bypasses the brain for speed!</p><p><strong>Reflex arc pathway:</strong></p><blockquote style="background:#ede7f6;border-left:4px solid #4527a0;padding:8px 12px;border-radius:4px">Stimulus → RECEPTOR → Sensory neurone → Relay neurone in SPINAL CORD → Motor neurone → EFFECTOR → Response</blockquote><p>Examples of reflexes:</p><ul><li>Pulling hand away from hot object</li><li>Blinking when something approaches the eye</li><li>Knee-jerk reflex</li><li>Pupil constricting in bright light</li></ul><p>Reflexes are faster than voluntary actions because the signal goes to the <em>spinal cord</em>, not the brain!</p>`,draw(p){p.setup=()=>{p.createCanvas(420,270);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};const nodes=['Stimulus','Receptor','Sensory\nneurone','Spinal cord','Motor\nneurone','Effector','Response'];const cols=['#e53935','#8e24aa','#1e88e5','#4527a0','#43a047','#f4511e','#43a047'];let t=0,active=0;p.draw=()=>{p.background(245);if(t%55===0)active=(active+1)%7;nodes.forEach((nd,i)=>{const x=30+i*58,y=i%2===0?120:160;const isA=active===i;p.fill(isA?cols[i]:'#ddd');p.noStroke();p.ellipse(x,y,isA?68:52,isA?42:34);p.fill(isA?255:'#555');p.textSize(isA?10:9);nd.split('\n').forEach((l,li)=>p.text(l,x,y-6+li*14));if(i<6){p.stroke(isA?cols[i]:'#bbb');p.strokeWeight(isA?3:1.5);const nx=30+(i+1)*58,ny=(i+1)%2===0?120:160;p.line(x+26,y,nx-26,ny);}});p.noStroke();p.fill('#4527a0');p.textSize(11);p.text('Reflex arc — bypasses brain for speed!',210,245);t++;};}}

,{title:'The Endocrine System',content:`<h2>Chemical Messengers — Hormones</h2><p><strong>Hormones</strong> are chemical messengers produced by <strong>endocrine glands</strong> and carried in the blood to target organs.</p><table style="width:100%;border-collapse:collapse;margin:8px 0"><tr><th style="background:#4527a0;color:#fff;padding:5px">Gland</th><th style="background:#4527a0;color:#fff;padding:5px">Hormone</th><th style="background:#4527a0;color:#fff;padding:5px">Function</th></tr><tr style="background:#ede7f6"><td style="padding:5px">Pancreas</td><td style="padding:5px">Insulin / Glucagon</td><td style="padding:5px">Regulates blood glucose</td></tr><tr><td style="padding:5px">Adrenal glands</td><td style="padding:5px">Adrenaline</td><td style="padding:5px">Fight or flight response</td></tr><tr style="background:#ede7f6"><td style="padding:5px">Ovaries</td><td style="padding:5px">Oestrogen</td><td style="padding:5px">Female puberty and menstrual cycle</td></tr><tr><td style="padding:5px">Testes</td><td style="padding:5px">Testosterone</td><td style="padding:5px">Male puberty and sperm production</td></tr><tr style="background:#ede7f6"><td style="padding:5px">Pituitary</td><td style="padding:5px">Growth hormone</td><td style="padding:5px">Controls growth</td></tr></table>`,draw(p){p.setup=()=>{p.createCanvas(420,270);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};let t=0;p.draw=()=>{p.background(245);p.stroke('#ef5350');p.strokeWeight(8);p.noFill();p.line(60,135,360,135);for(let i=0;i<5;i++){const hx=(60+(t*1.5+i*60)%300);p.fill('#ab47bc');p.noStroke();p.ellipse(hx,135,12,12);p.fill(255);p.textSize(7);p.text('H',hx,135);}const glands=[{n:'Pancreas',x:100,y:60},{n:'Adrenal',x:210,y:60},{n:'Ovary/Testes',x:320,y:60}];glands.forEach((g,i)=>{const active=Math.floor(t/80)%3===i;p.fill(active?'#4527a0':'#ddd');p.noStroke();p.ellipse(g.x,g.y,90,44);p.fill(active?255:'#555');p.textSize(active?11:9);p.text(g.n,g.x,g.y);if(active){p.stroke('#ab47bc');p.strokeWeight(2);p.line(g.x,g.y+22,g.x,135);}});p.fill('#333');p.noStroke();p.textSize(11);p.text('Hormones travel in blood to target organs',210,250);t++;};}}

,{title:'Blood Glucose Regulation',content:`<h2>Insulin and Glucagon — Negative Feedback</h2><p>Blood glucose is kept within a narrow range by two opposing hormones from the <strong>pancreas</strong>:</p><p>🍚 <strong>After a meal</strong> (blood glucose rises):</p><ul><li>Pancreas releases INSULIN</li><li>Cells absorb glucose for respiration</li><li>Liver converts glucose → glycogen (stored)</li><li>Blood glucose FALLS back to normal</li></ul><p>😴 <strong>Between meals</strong> (blood glucose falls):</p><ul><li>Pancreas releases GLUCAGON</li><li>Liver converts glycogen → glucose</li><li>Blood glucose RISES back to normal</li></ul><p>This is called <strong>negative feedback</strong> — the response reverses the change.</p>`,draw(p){p.setup=()=>{p.createCanvas(420,270);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};let t=0;p.draw=()=>{p.background(245);const points=[];for(let x=0;x<=420;x+=4){const base=135;const variation=50*Math.sin((x+t*2)*0.015);const damped=variation*Math.exp(-0.002*x);points.push({x,y:base+damped});}p.stroke('#ef5350');p.strokeWeight(3);p.noFill();p.beginShape();points.forEach(pt=>p.vertex(pt.x,pt.y));p.endShape();p.fill(0,200,0,30);p.noStroke();p.rect(0,110,420,50);p.fill('#43a047');p.textSize(10);p.text('Normal blood glucose range',210,140);p.fill('#e53935');p.textSize(11);p.text('↑ Insulin released (too high)',110,100);p.fill('#1e88e5');p.textSize(11);p.text('↓ Glucagon released (too low)',310,175);p.fill('#333');p.textSize(11);p.text('Negative feedback keeps glucose stable',210,255);t++;};}}

,{title:'The Liver',content:`<h2>The Body's Chemical Factory</h2><p>The <strong>liver</strong> is the largest internal organ and performs over 500 functions! Key ones:</p><ul><li>🍬 <strong>Glucose regulation</strong> — stores glycogen; converts it back to glucose</li><li>☠️ <strong>Deamination</strong> — breaks down excess amino acids → urea (sent to kidneys)</li><li>💛 <strong>Bile production</strong> — emulsifies fats in digestion</li><li>🍷 <strong>Detoxification</strong> — breaks down alcohol, drugs, toxins</li><li>🔴 <strong>Plasma proteins</strong> — makes clotting factors and albumin</li><li>🌡️ <strong>Heat production</strong> — its high activity generates heat</li></ul>`,draw(p){p.setup=()=>{p.createCanvas(420,260);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};let t=0,active=0;const fns=[{n:'Glycogen storage',c:'#fdd835'},{n:'Bile production',c:'#43a047'},{n:'Deamination → urea',c:'#8e24aa'},{n:'Detoxification',c:'#e53935'},{n:'Plasma proteins',c:'#1e88e5'},{n:'Heat generation',c:'#f4511e'}];p.draw=()=>{p.background(245);if(t%80===0)active=(active+1)%6;p.fill('#ef9a9a');p.stroke('#c62828');p.strokeWeight(2);p.ellipse(210,120,200,130);p.noStroke();p.fill('#c62828');p.textSize(14);p.text('LIVER',210,90);fns.forEach((fn,i)=>{const a=p.TWO_PI*(i/6)-p.HALF_PI;const r=110,x=210+r*p.cos(a),y=120+r*p.sin(a);const isA=active===i;p.fill(isA?fn.c:'#ddd');p.noStroke();p.ellipse(x,y,isA?90:70,isA?36:28);p.fill(isA?255:'#555');p.textSize(isA?10:8);p.text(fn.n,x,y);p.stroke(isA?fn.c:'#ccc');p.strokeWeight(isA?3:1);p.line(210,120,x,y);});t++;};}}

,{title:'The Excretory System',content:`<h3>Excretion = Removing Metabolic Waste</h3><p>Excretion removes waste products of metabolism. Key excretory organs: kidneys, lungs, and skin.</p><p><strong>Three main waste products:</strong></p><ul><li>CO₂ + H₂O — removed by lungs</li><li>Urea — removed by kidneys (in urine)</li><li>Water + salts — removed by skin (in sweat)</li></ul>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><ellipse cx="210" cy="60" rx="35" ry="45" fill="#ffccbc" stroke="#bf360c" stroke-width="2"/><rect x="175" y="110" width="70" height="100" rx="8" fill="#ffccbc" stroke="#bf360c" stroke-width="2"/><ellipse cx="190" cy="140" rx="18" ry="35" fill="#ef9a9a" stroke="#b71c1c" stroke-width="1.5"/><ellipse cx="230" cy="140" rx="18" ry="35" fill="#ef9a9a" stroke="#b71c1c" stroke-width="1.5"/><ellipse cx="185" cy="175" rx="12" ry="18" fill="#8d6e63" stroke="#4e342e" stroke-width="1.5"/><ellipse cx="235" cy="175" rx="12" ry="18" fill="#8d6e63" stroke="#4e342e" stroke-width="1.5"/><line x1="185" y1="193" x2="185" y2="210" stroke="#795548" stroke-width="2"/><line x1="235" y1="193" x2="235" y2="210" stroke="#795548" stroke-width="2"/><ellipse cx="210" cy="215" rx="22" ry="15" fill="#b3e5fc" stroke="#0288d1" stroke-width="1.5"/><text x="280" y="85" font-size="10" fill="#b71c1c" font-weight="bold">Lungs</text><text x="280" y="97" font-size="8" fill="#555">CO₂ + H₂O</text><text x="280" y="180" font-size="10" fill="#4e342e" font-weight="bold">Kidneys</text><text x="280" y="192" font-size="8" fill="#555">Urea</text><text x="210" y="235" font-size="9" fill="#0288d1" font-weight="bold" text-anchor="middle">Bladder</text></svg>`}
,{title:'The Eye',content:`<h3>How the Eye Works</h3><p>The eye detects light through specialized structures that focus an image onto the retina. The retina sends signals to the brain via the optic nerve.</p><p><strong>Key parts:</strong> Cornea → Iris → Lens → Retina → Optic nerve</p>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><ellipse cx="210" cy="125" rx="110" ry="85" fill="#e3f2fd" stroke="#006064" stroke-width="2"/><ellipse cx="210" cy="125" rx="100" ry="75" fill="#e8f5e9"/><path d="M140 60 Q100 125 140 190" fill="none" stroke="#c62828" stroke-width="7"/><path d="M280 95 Q305 125 280 155" fill="none" stroke="#80deea" stroke-width="6"/><circle cx="280" cy="125" r="28" fill="#5c6bc0" stroke="#303f9f" stroke-width="2"/><circle cx="280" cy="125" r="14" fill="#111"/><circle cx="275" cy="120" r="3" fill="white"/><ellipse cx="255" cy="125" rx="12" ry="22" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/><rect x="90" y="119" width="40" height="12" rx="4" fill="#ffa726" stroke="#e65100" stroke-width="1"/><text x="310" y="85" font-size="9" fill="#80deea" font-weight="bold">Cornea</text><text x="310" y="135" font-size="9" fill="#303f9f" font-weight="bold">Iris</text><text x="255" y="155" font-size="9" fill="#f9a825" font-weight="bold">Lens</text><text x="140" y="220" font-size="9" fill="#c62828" font-weight="bold">Retina</text><text x="60" y="135" font-size="9" fill="#e65100" font-weight="bold">Nerve</text></svg>`}
,{title:'The Ear',content:`<h3>How the Ear Hears</h3><p>The ear has three regions: outer ear (captures sound), middle ear (amplifies vibrations), and inner ear (converts to signals).</p><p><strong>Path:</strong> Sound → Pinna → Eardrum → Ossicles → Cochlea → Nerve</p>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><path d="M50 70 Q40 125 50 180 Q65 195 80 180 Q90 170 85 125 Q80 80 70 70 Z" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/><rect x="90" y="115" width="50" height="20" rx="4" fill="#ffe082" stroke="#f9a825" stroke-width="1"/><ellipse cx="160" cy="125" rx="5" ry="30" fill="#f48fb1" stroke="#ad1457" stroke-width="2"/><circle cx="185" cy="115" r="7" fill="#ef9a9a" stroke="#ad1457" stroke-width="1"/><circle cx="205" cy="110" r="6" fill="#ef9a9a" stroke="#ad1457" stroke-width="1"/><circle cx="220" cy="115" r="6" fill="#ef9a9a" stroke="#ad1457" stroke-width="1"/><path d="M280 125 Q280 95 305 95 Q330 95 330 120 Q330 145 310 145 Q290 145 290 125 Q290 110 305 110" fill="none" stroke="#4527a0" stroke-width="4"/><path d="M340 85 Q375 70 385 105 Q395 135 365 145" fill="none" stroke="#7986cb" stroke-width="3"/><line x1="270" y1="120" x2="255" y2="120" stroke="#7b1fa2" stroke-width="2"/><text x="70" y="210" font-size="9" fill="#e65100" font-weight="bold" text-anchor="middle">Pinna</text><text x="115" y="145" font-size="8" fill="#f9a825" font-weight="bold">Canal</text><text x="160" y="165" font-size="8" fill="#ad1457" font-weight="bold">Eardrum</text><text x="200" y="140" font-size="8" fill="#ad1457" font-weight="bold">Ossicles</text><text x="305" y="165" font-size="9" fill="#4527a0" font-weight="bold">Cochlea</text><text x="365" y="175" font-size="8" fill="#7986cb" font-weight="bold">Nerve</text></svg>`}
,{title:'Sense Organs Summary',content:`<h3>The Five Senses</h3><p>Each sense has specialized receptor cells that detect a specific stimulus. All signals travel to the brain via nerves:</p><ul><li>👁️ <strong>Eyes</strong> — detect light (vision)</li><li>👂 <strong>Ears</strong> — detect sound waves (hearing)</li><li>👃 <strong>Nose</strong> — detect chemicals in air (smell)</li><li>👅 <strong>Tongue</strong> — detect chemicals in food (taste)</li><li>🖐️ <strong>Skin</strong> — detect touch, temperature, pain</li></ul>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><ellipse cx="210" cy="125" rx="55" ry="45" fill="#006064"/><circle cx="100" cy="70" r="28" fill="#1565c0" stroke="#1565c0" stroke-width="2"/><circle cx="100" cy="70" r="15" fill="#111"/><circle cx="95" cy="65" r="3" fill="white"/><path d="M330 50 Q320 70 330 90 Q345 100 360 90 Q370 80 365 65 Q360 50 345 45 Z" fill="#f57f17" stroke="#e65100" stroke-width="1.5"/><path d="M100 170 Q85 180 80 195 Q88 205 100 203 Q112 205 120 195 Q115 180 100 170 Z" fill="#ffb74d" stroke="#f57f17" stroke-width="1.5"/><path d="M330 170 Q315 173 312 188 Q312 206 330 210 Q348 206 348 188 Q345 173 330 170 Z" fill="#f48fb1" stroke="#ad1457" stroke-width="1.5"/><rect x="185" y="190" width="50" height="25" rx="6" fill="#ffe082" stroke="#f9a825" stroke-width="1.5"/><text x="100" y="50" font-size="10" fill="#1565c0" font-weight="bold" text-anchor="middle">Eyes</text><text x="330" y="30" font-size="10" fill="#e65100" font-weight="bold" text-anchor="middle">Ears</text><text x="100" y="225" font-size="10" fill="#f57f17" font-weight="bold" text-anchor="middle">Nose</text><text x="330" y="225" font-size="10" fill="#ad1457" font-weight="bold" text-anchor="middle">Tongue</text><text x="210" y="245" font-size="10" fill="#f9a825" font-weight="bold" text-anchor="middle">Skin</text><text x="210" y="110" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">BRAIN</text></svg>`}
,{title:'Kidney Structure',content:`<h2>The Kidneys — Filtering Blood</h2><p>Two kidneys filter waste (urea) from blood and produce urine. They maintain water balance and regulate ions.</p><p><strong>Parts:</strong></p><ul><li>📍 <strong>Cortex</strong> — outer region where filtration begins</li><li>📍 <strong>Medulla</strong> — inner region with pyramids</li><li>📍 <strong>Pelvis</strong> — funnel that collects urine</li><li>📍 <strong>Ureter</strong> — tube carrying urine to bladder</li></ul>`,visual:`<svg viewBox="0 0 420 270" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="270" fill="#f5f5f5"/><ellipse cx="140" cy="135" rx="85" ry="120" fill="#d81b60"/><ellipse cx="140" cy="110" rx="75" ry="100" fill="#ec407a"/><polygon points="140,70 125,100 155,100" fill="#f48fb1"/><polygon points="140,95 120,130 160,130" fill="#f48fb1"/><ellipse cx="140" cy="165" rx="42" ry="38" fill="#c2185b"/><line x1="140" y1="185" x2="140" y2="240" stroke="#c2185b" stroke-width="4"/><text x="200" y="90" font-size="11" fill="#555" font-weight="bold">Cortex</text><text x="200" y="120" font-size="11" fill="#555" font-weight="bold">Medulla</text><text x="140" y="170" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">Pelvis</text><text x="140" y="255" font-size="10" fill="#c2185b" font-weight="bold" text-anchor="middle">Ureter</text></svg>`}
,{title:'Nephron — Filtering Unit',content:`<h2>How Kidneys Filter Waste</h2><p>Each kidney has ~1 million nephrons. Three stages:</p><ol><li><strong>Ultrafiltration:</strong> Small molecules forced through capillary into Bowman's capsule</li><li><strong>Selective Reabsorption:</strong> Useful substances reabsorbed in proximal tubule</li><li><strong>Collection:</strong> Waste (urea) becomes urine in collecting duct</li></ol>`,visual:`<svg viewBox="0 0 420 280" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="280" fill="#f5f5f5"/><ellipse cx="80" cy="80" rx="60" ry="60" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/><ellipse cx="75" cy="80" rx="40" ry="40" fill="#f5f5f5" stroke="#3949ab" stroke-width="1"/><line x1="50" y1="80" x2="100" y2="80" stroke="#e91e63" stroke-width="3"/><path d="M100 60 L200 40 L220 80 L120 100 Z" fill="none" stroke="#1565c0" stroke-width="2.5"/><line x1="220" y1="80" x2="260" y2="150" stroke="#f57c00" stroke-width="2"/><line x1="260" y1="150" x2="240" y2="220" stroke="#f57c00" stroke-width="2"/><line x1="240" y1="220" x2="200" y2="220" stroke="#f57c00" stroke-width="2"/><line x1="200" y1="220" x2="200" y2="280" stroke="#7b1fa2" stroke-width="2.5"/><text x="80" y="145" font-size="10" fill="#555" text-anchor="middle" font-weight="bold">Bowman's</text><text x="160" y="70" font-size="9" fill="#555" font-weight="bold">Proximal</text><text x="260" y="185" font-size="9" fill="#555" font-weight="bold">Loop of</text><text x="260" y="196" font-size="9" fill="#555" font-weight="bold">Henle</text><text x="200" y="250" font-size="10" fill="#555" font-weight="bold" text-anchor="middle">Collecting duct</text></svg>`}
,{title:'Heart & Circulation',content:`<h2>The Heart — 4 Chambers</h2><p>The heart pumps blood through two circuits:</p><p><strong>Right side:</strong> Deoxygenated blood → Lungs</p><p><strong>Left side:</strong> Oxygenated blood → Body</p><p>The heart beats ~70 times per minute!</p>`,visual:`<svg viewBox="0 0 420 280" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="280" fill="#f5f5f5"/><ellipse cx="140" cy="90" rx="60" ry="50" fill="#64b5f6" stroke="#1565c0" stroke-width="2"/><ellipse cx="140" cy="180" rx="75" ry="70" fill="#42a5f5" stroke="#0d47a1" stroke-width="2"/><ellipse cx="280" cy="90" rx="60" ry="50" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/><ellipse cx="280" cy="180" rx="75" ry="70" fill="#f48fb1" stroke="#ad1457" stroke-width="2"/><line x1="140" y1="30" x2="140" y2="50" stroke="#1565c0" stroke-width="2.5"/><line x1="130" y1="35" x2="150" y2="35" stroke="#1565c0" stroke-width="2.5"/><line x1="280" y1="30" x2="280" y2="50" stroke="#c62828" stroke-width="2.5"/><line x1="270" y1="35" x2="290" y2="35" stroke="#c62828" stroke-width="2.5"/><text x="140" y="95" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">RA</text><text x="140" y="185" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">RV</text><text x="280" y="95" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">LA</text><text x="280" y="185" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">LV</text></svg>`}
,{title:'Blood Vessels',content:`<h2>Three Types of Vessels</h2><p>Blood travels through arteries, capillaries, and veins:</p><table style="width:100%;border-collapse:collapse;margin:8px 0"><tr><td style="padding:5px;border:1px solid #ccc"><strong>Artery</strong></td><td style="padding:5px;border:1px solid #ccc">Thick wall, high pressure</td></tr><tr><td style="padding:5px;border:1px solid #ccc"><strong>Capillary</strong></td><td style="padding:5px;border:1px solid #ccc">1 cell thick, gas exchange</td></tr><tr><td style="padding:5px;border:1px solid #ccc"><strong>Vein</strong></td><td style="padding:5px;border:1px solid #ccc">Thin wall, low pressure</td></tr></table>`,visual:`<svg viewBox="0 0 420 270" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="270" fill="#f5f5f5"/><rect x="30" y="50" width="100" height="35" rx="5" fill="#c62828"/><rect x="30" y="130" width="100" height="20" rx="3" fill="#e91e63"/><rect x="30" y="210" width="100" height="35" rx="5" fill="#1565c0"/><circle cx="260" cy="70" r="8" fill="#e53935" opacity="0.8"/><circle cx="280" cy="68" r="8" fill="#e53935" opacity="0.8"/><circle cx="300" cy="72" r="8" fill="#e53935" opacity="0.8"/><circle cx="250" cy="150" r="4" fill="#e53935" opacity="0.6"/><circle cx="270" cy="150" r="4" fill="#e53935" opacity="0.6"/><circle cx="290" cy="150" r="4" fill="#e53935" opacity="0.6"/><circle cx="260" cy="230" r="7" fill="#e53935" opacity="0.7"/><circle cx="280" cy="232" r="7" fill="#e53935" opacity="0.7"/><circle cx="300" cy="228" r="7" fill="#e53935" opacity="0.7"/><text x="80" y="72" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">ARTERY</text><text x="80" y="142" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">CAPILLARY</text><text x="80" y="232" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">VEIN</text></svg>`}
,{title:'Blood Cells',content:`<h2>Three Types of Blood Cells</h2><p>Blood contains three main cell types:</p><ul><li><strong>🔴 Red Blood Cells</strong> — transport oxygen via haemoglobin</li><li><strong>⚪ White Blood Cells</strong> — defend against pathogens</li><li><strong>🟣 Platelets</strong> — initiate blood clotting in wounds</li></ul><p>All produced in bone marrow!</p>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><circle cx="60" cy="50" r="12" fill="#d32f2f"/><circle cx="120" cy="50" r="12" fill="#d32f2f"/><circle cx="180" cy="50" r="12" fill="#d32f2f"/><circle cx="240" cy="50" r="12" fill="#d32f2f"/><circle cx="80" cy="140" r="16" fill="none" stroke="#1565c0" stroke-width="2"/><circle cx="80" cy="140" r="8" fill="#1565c0"/><circle cx="160" cy="145" r="16" fill="none" stroke="#1565c0" stroke-width="2"/><circle cx="160" cy="145" r="10" fill="#1565c0"/><circle cx="240" cy="145" r="16" fill="none" stroke="#1565c0" stroke-width="2"/><circle cx="240" cy="145" r="7" fill="#1565c0"/><circle cx="100" cy="220" r="5" fill="#ab47bc"/><circle cx="120" cy="215" r="4" fill="#ab47bc"/><circle cx="140" cy="220" r="5" fill="#ab47bc"/><text x="150" y="80" font-size="10" fill="#d32f2f" font-weight="bold">Red Blood Cells</text><text x="160" y="185" font-size="10" fill="#1565c0" font-weight="bold">White Blood Cells</text><text x="120" y="245" font-size="10" fill="#ab47bc" font-weight="bold" text-anchor="middle">Platelets</text></svg>`}
,{title:'Homeostasis',content:`<h2>Stable Internal Environment</h2><p><strong>Homeostasis</strong> = maintaining stable conditions despite changes.</p><p>The body regulates:</p><ul><li>🌡️ <strong>Temperature</strong> (~37°C)</li><li>💧 <strong>Water potential</strong></li><li>📊 <strong>Glucose</strong> (~100 mmol)</li><li>⚖️ <strong>pH</strong> (~7.4)</li></ul><p>Achieved through <strong>negative feedback</strong>!</p>`,visual:`<svg viewBox="0 0 420 270" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="270" fill="#f5f5f5"/><rect x="120" y="80" width="180" height="120" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><line x1="60" y1="120" x2="120" y2="120" stroke="#d32f2f" stroke-width="2.5"/><line x1="300" y1="120" x2="360" y2="120" stroke="#d32f2f" stroke-width="2.5"/><line x1="120" y1="200" x2="60" y2="200" stroke="#1b5e20" stroke-width="2.5"/><line x1="300" y1="200" x2="360" y2="200" stroke="#1b5e20" stroke-width="2.5"/><text x="210" y="140" font-size="11" fill="#2e7d32" font-weight="bold" text-anchor="middle">NORMAL RANGE</text><text x="210" y="155" font-size="9" fill="#555" text-anchor="middle">37°C / pH 7.4</text></svg>`}
,{title:'Thermoregulation',content:`<h2>Temperature Control</h2><p><strong>Hypothalamus</strong> detects body temperature and triggers responses:</p><p><strong>Too HOT:</strong> Sweat + dilate blood vessels</p><p><strong>Too COLD:</strong> Shiver + constrict blood vessels</p><p>Target: 37°C</p>`,visual:`<svg viewBox="0 0 420 280" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="280" fill="#f5f5f5"/><text x="100" y="100" font-size="40">🔥</text><text x="300" y="100" font-size="40">❄️</text><ellipse cx="100" cy="170" rx="40" ry="30" fill="#ff6f00" opacity="0.3"/><ellipse cx="300" cy="170" rx="40" ry="30" fill="#1e88e5" opacity="0.3"/><line x1="120" y1="200" x2="300" y2="200" stroke="#4527a0" stroke-width="3"/><circle cx="210" cy="200" r="20" fill="#4527a0"/><text x="100" y="145" font-size="11" fill="#d84315" font-weight="bold" text-anchor="middle">HOT</text><text x="100" y="200" font-size="9" fill="#555" text-anchor="middle">Sweat</text><text x="300" y="145" font-size="11" fill="#1565c0" font-weight="bold" text-anchor="middle">COLD</text><text x="300" y="200" font-size="9" fill="#555" text-anchor="middle">Shiver</text><text x="210" y="208" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Brain</text></svg>`}
,{title:'Reproduction',content:`<h2>Reproduction Basics</h2><p><strong>Male:</strong> Testes produce sperm + testosterone</p><p><strong>Female:</strong> Ovaries produce eggs + oestrogen/progesterone</p><p>Both systems release sex hormones that trigger puberty and sexual development!</p>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><ellipse cx="100" cy="100" rx="25" ry="35" fill="#1565c0" opacity="0.3"/><ellipse cx="100" cy="100" rx="15" ry="25" fill="#1565c0"/><ellipse cx="320" cy="70" rx="15" ry="20" fill="#ad1457"/><ellipse cx="305" cy="100" rx="12" ry="18" fill="#ad1457"/><ellipse cx="335" cy="100" rx="12" ry="18" fill="#ad1457"/><line x1="100" y1="135" x2="100" y2="180" stroke="#1565c0" stroke-width="2"/><line x1="320" y1="120" x2="320" y2="180" stroke="#ad1457" stroke-width="2"/><text x="100" y="60" font-size="12" fill="#1565c0" font-weight="bold" text-anchor="middle">MALE</text><text x="100" y="205" font-size="9" fill="#555" text-anchor="middle">Testes</text><text x="100" y="217" font-size="8" fill="#555" text-anchor="middle">Sperm</text><text x="320" y="45" font-size="12" fill="#ad1457" font-weight="bold" text-anchor="middle">FEMALE</text><text x="320" y="205" font-size="9" fill="#555" text-anchor="middle">Ovaries</text><text x="320" y="217" font-size="8" fill="#555" text-anchor="middle">Eggs</text></svg>`}
,{title:'Mini-Quiz: Nervous &amp; Endocrine',mcq:[{q:'Which part of the brain controls balance and coordination?',opts:['Cerebrum','Medulla oblongata','Cerebellum','Spinal cord'],ans:2,exp:'The CEREBELLUM controls BALANCE, COORDINATION, and fine motor skills. The cerebrum controls conscious thought. The medulla controls automatic functions (breathing, heart rate). The spinal cord is a pathway, not a brain region.'},{q:'A reflex action bypasses the brain because:',opts:['The brain is too busy','The impulse goes through the spinal cord directly to the effector','The brain is too far away','Reflexes only use muscles, not nerves'],ans:1,exp:'In a REFLEX ARC, the impulse travels: receptor → sensory neurone → relay neurone in the SPINAL CORD → motor neurone → effector. The spinal cord sends the motor signal WITHOUT waiting for the brain — making the response extremely fast.'}]}
,{title:'Mini-Quiz: Glucose &amp; Liver',mcq:[{q:'When blood glucose is too high, the pancreas releases:',opts:['Glucagon','Adrenaline','Insulin','Oestrogen'],ans:2,exp:'When blood glucose is TOO HIGH (after a meal), the pancreas releases INSULIN. Insulin stimulates body cells to absorb glucose and the liver to convert glucose to glycogen. This LOWERS blood glucose back to normal.'},{q:'Deamination in the liver produces which waste product?',opts:['CO₂','Urea','Bile','Lactic acid'],ans:1,exp:'DEAMINATION: the liver breaks down excess amino acids. The nitrogen from the amino group is converted to UREA, which is then sent to the kidneys and removed in URINE. The remaining carbon skeleton is used for energy.'}]}
