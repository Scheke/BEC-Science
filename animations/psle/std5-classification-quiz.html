<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Classification Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Classification of Living Things — Std 5 Quiz',
  color:'#2e7d32',dark:'#1b5e20',light:'#e8f5e9',
    mcq:[
    {q:'Living things are grouped together based on their:',opts:['Colour only','Size only','Similar features and characteristics','Where they live'],ans:2,exp:'Scientists CLASSIFY (group) living things by looking at their SIMILAR FEATURES — body structure, how they reproduce, how they feed, etc. This helps us study and identify millions of organisms.'},
    {q:'Which of the following is NOT a characteristic of living things?',opts:['Growth','Movement','Made of metal','Reproduction'],ans:2,exp:'Living things must show: MRS GREN — Movement, Respiration, Sensitivity, Growth, Reproduction, Excretion, Nutrition. Being "made of metal" is NOT a life characteristic — that describes non-living things.'},
    {q:'Vertebrates are animals that have:',opts:['Six legs','A backbone (spine)','Wings','Scales'],ans:1,exp:'VERTEBRATES have a BACKBONE (spinal column / vertebral column). Examples: fish, amphibians, reptiles, birds, mammals. Animals WITHOUT a backbone are called INVERTEBRATES.'},
    {q:'Which group of vertebrates are warm-blooded AND have feathers?',opts:['Mammals','Reptiles','Birds','Amphibians'],ans:2,exp:'BIRDS are WARM-BLOODED, have FEATHERS, lay hard-shelled eggs, and have wings (though some cannot fly). Mammals are also warm-blooded but have hair/fur and suckle young.'},
    {q:'Mushrooms belong to which kingdom?',opts:['Plant','Animal','Fungi','Bacteria'],ans:2,exp:'MUSHROOMS are FUNGI. Fungi cannot photosynthesise — they absorb nutrients from dead or living material (decomposers). They have cell walls made of chitin. Other fungi: yeast, moulds.'},
    {q:'Which of these is a characteristic of ALL living things?',opts:['They can fly','They have hair','They respire (release energy from food)','They live on land'],ans:2,exp:'RESPIRATION is a characteristic of ALL living things. All living cells break down glucose to release energy (ATP). Not all living things fly, have hair, or live on land.'},
    {q:'An animal with a backbone and dry, scaly skin that lays eggs on land is a:',opts:['Fish','Amphibian','Reptile','Bird'],ans:2,exp:'REPTILES are vertebrates with DRY, SCALY skin and they lay eggs with leathery shells on land. Examples: snakes, lizards, crocodiles. Fish have wet scales; amphibians have moist skin.'},
    {q:'Which characteristic of living things allows a plant to turn its leaves towards the sunlight?',opts:['Reproduction','Sensitivity','Excretion','Nutrition'],ans:1,exp:'SENSITIVITY is the ability of living things to respond to changes in their environment (stimuli). Turning towards light is a plant responding to a light stimulus.'},
    {q:'In the classification system, the largest and most general group is called the:',opts:['Species','Class','Kingdom','Phylum'],ans:2,exp:'The KINGDOM is the highest and most broad level of classification. There are 5 kingdoms widely recognised: Animalia, Plantae, Fungi, Protista, and Monera (Bacteria).'},
    {q:'Bacteria belong to the kingdom:',opts:['Plantae','Monera','Fungi','Animalia'],ans:1,exp:'BACTERIA are Prokaryotes and belong to the Kingdom MONERA (or Prokaryotae). They are microscopic, single-celled organisms with no true nucleus.'},
    {q:'A puppy grows into a dog. This is an example of:',opts:['Respiration','Growth','Nutrition','Excretion'],ans:1,exp:'GROWTH is the permanent increase in size and mass of an organism. A puppy growing into a larger dog is a clear example of growth in living things.'},
    {q:'Which of the following is NOT a vertebrate?',opts:['Eagle','Frog','Lizard','Ladybug'],ans:3,exp:'A LADYBUG is an INSECT, which is an INVERTEBRATE (no backbone). An eagle (bird), frog (amphibian), and lizard (reptile) are all VERTEBRATES with backbones.'},
    {q:'Living things remove waste materials from their bodies in a process called:',opts:['Respiration','Nutrition','Excretion','Growth'],ans:2,exp:'EXCRETION is the removal of waste products from the body. For example, humans excrete urea in urine and carbon dioxide through the lungs.'},
    {q:'An example of an invertebrate with a segmented body is:',opts:['Snail','Earthworm','Jellyfish','Spider'],ans:1,exp:'An EARTHWORM is an ANNELID — an invertebrate with a long, segmented (ringed) body. Snails (molluscs), jellyfish (cnidarians), and spiders (arachnids) are also invertebrates but are not segmented like an earthworm.'},
    {q:'Which of the following is a characteristic that distinguishes BIRDS from all other vertebrates?',opts:['They lay eggs','They have feathers','They are warm-blooded','They have wings'],ans:1,exp:'FEATHERS are unique to BIRDS. No other vertebrate group has feathers. While birds lay eggs and are warm-blooded, other animals (like reptiles and mammals) also share some of these traits.'},
    {q:'All living things need to take in substances for energy and growth. This characteristic is:',opts:['Excretion','Nutrition','Reproduction','Sensitivity'],ans:1,exp:'NUTRITION is the process by which living things obtain food (nutrients) to provide energy for life processes and materials for growth. Plants make food; animals eat food.'},
    {q:'A whale is classified as a mammal because:',opts:['It lives in water','It has scales','It feeds its young with milk and has hair','It breathes through gills'],ans:2,exp:'MAMMALS are defined by: (1) feeding their young with MILK, (2) having HAIR or fur, and (3) being warm-blooded. Whales do all of these, even though they live in water.'},
    {q:'Which kingdom includes organisms like yeast and mould?',opts:['Animalia','Plantae','Fungi','Protista'],ans:2,exp:'YEAST and MOULD belong to the KINGDOM FUNGI. They are eukaryotic organisms that absorb nutrients from organic matter and have cell walls made of chitin. They are not plants or animals.'},
    {q:'The process of producing new individuals of the same species is called:',opts:['Excretion','Respiration','Reproduction','Movement'],ans:2,exp:'REPRODUCTION is the biological process by which living organisms produce new individuals (offspring) of their own species to ensure the species continues to exist.'},
    {q:'In classification, organisms are placed into smaller and smaller groups based on:',opts:['Their habitat','Their increasing similarities','Their colour','Their size'],ans:1,exp:'Classification is a HIERARCHICAL system. At the top (Kingdom), organisms are broadly similar. As you move down through Phylum, Class, Order, Family, Genus, and Species, organisms share MORE specific and similar features.'},
  ],
  match:[
    {term:'Vertebrate',def:'An animal that possesses a backbone or spinal column (e.g., fish, mammals)'},
    {term:'Invertebrate',def:'An animal that does NOT have a backbone (e.g., insects, worms, jellyfish)'},
    {term:'Mammal',def:'A warm-blooded vertebrate that has hair/fur and feeds its young with milk from mammary glands'},
    {term:'Bird',def:'A warm-blooded vertebrate with feathers, wings, and lays hard-shelled eggs'},
    {term:'Reptile',def:'A cold-blooded vertebrate with dry, scaly skin that lays leathery-shelled eggs on land'},
    {term:'Amphibian',def:'A cold-blooded vertebrate that lives part of its life in water and part on land, with moist skin'},
    {term:'Fish',def:'A cold-blooded vertebrate that lives in water, has gills, fins, and scales'},
    {term:'Fungi',def:'A kingdom of organisms that absorb nutrients from dead or decaying matter and cannot photosynthesise (e.g., mushrooms, yeast)'},
    {term:'Plant',def:'A multicellular organism that uses photosynthesis to make its own food; has cell walls made of cellulose'},
    {term:'Animal',def:'A multicellular organism that cannot photosynthesise and obtains food by eating other organisms'},
    {term:'Bacteria',def:'A microscopic, single-celled organism without a true nucleus; belongs to the Kingdom Monera'},
    {term:'Kingdom',def:'The largest and most general group in the classification system of living things'},
    {term:'Species',def:'The smallest and most specific group of living things; organisms of the same species can breed to produce fertile offspring'},
    {term:'Classification',def:'The process of grouping living things based on their shared characteristics and evolutionary relationships'},
    {term:'Respiration',def:'The chemical process in cells that releases energy from glucose; a characteristic of all living things'},
    {term:'Sensitivity',def:'The ability of a living thing to detect and respond to changes in its environment (stimuli)'},
    {term:'Growth',def:'The permanent increase in size and mass of an organism as it develops'},
    {term:'Reproduction',def:'The biological process by which living organisms produce new individuals of the same species'},
    {term:'Excretion',def:'The removal of waste products produced by the body\'s metabolic processes'},
    {term:'Nutrition',def:'The process by which living things obtain food to provide energy and materials for growth'},
  ],
  flashcards:[
    {q:'Name the 5 main vertebrate groups and give one example of each.',a:'1. FISH — shark or tilapia (gills, scales, cold-blooded). 2. AMPHIBIANS — frog or toad (moist skin, aquatic larvae, terrestrial adults). 3. REPTILES — crocodile or snake (dry scaly skin, cold-blooded). 4. BIRDS — eagle or ostrich (feathers, warm-blooded). 5. MAMMALS — human or elephant (hair, warm-blooded, suckle young).'},
    {q:'State the 7 characteristics of living things using the mnemonic MRS GREN.',a:'M — MOVEMENT: ability to change position. R — RESPIRATION: releasing energy from food. S — SENSITIVITY: responding to the environment. G — GROWTH: increasing in size. R — REPRODUCTION: producing offspring. E — EXCRETION: removing waste. N — NUTRITION: obtaining food. All living things show ALL of these.'},
    {q:'What is the difference between warm-blooded (endothermic) and cold-blooded (ectothermic) animals?',a:'WARM-BLOODED animals (Birds and Mammals) maintain a CONSTANT internal body temperature regardless of the external environment. COLD-BLOODED animals (Fish, Amphibians, Reptiles) have a body temperature that CHANGES with the environment. They must rely on external heat sources (like the sun) to warm up.'},
    {q:'How are plants fundamentally different from fungi?',a:'PLANTS: Contain CHLOROPHYLL, photosynthesise to make their own food, have cell walls made of CELLULOSE. FUNGI: Do NOT contain chlorophyll, CANNOT photosynthesise, absorb nutrients from dead/decaying matter, and have cell walls made of CHITIN.'},
    {q:'Name 3 types of invertebrates and their key characteristics.',a:'1. INSECTS — 6 legs, 3 body parts (head, thorax, abdomen), exoskeleton (e.g., butterfly, ant). 2. ARACHNIDS — 8 legs, 2 body parts (cephalothorax, abdomen), e.g., spider, scorpion. 3. MOLLUSCS — soft body, often with a hard shell (e.g., snail, clam). 4. ANNELIDS — segmented worms (e.g., earthworm).'},
    {q:'Explain the levels of classification from broadest to most specific.',a:'Kingdom (broadest) → Phylum → Class → Order → Family → Genus → Species (most specific). A helpful mnemonic is "King Philip Called Out For Good Soup".'},
    {q:'Describe the key features that distinguish birds from other vertebrates.',a:'Birds are unique because they have FEATHERS. They are also warm-blooded, lay hard-shelled eggs, have wings (even if flightless), and have a beak instead of teeth.'},
    {q:'What are the main differences between a reptile and an amphibian?',a:'REPTILES: dry scaly skin, lay eggs with leathery shells on land, fully adapted to terrestrial life. AMPHIBIANS: moist skin, lay eggs in water (jelly-like eggs), have an aquatic larval stage (e.g., tadpole) and a terrestrial adult stage.'},
    {q:'Explain why a whale is classified as a mammal and not a fish.',a:'Whales are MAMMALS because they: (1) are WARM-BLOODED, (2) have HAIR (a small amount), (3) breathe AIR using LUNGS, (4) give BIRTH to live young, and (5) feed their young with MILK. Fish are cold-blooded, have scales, and breathe through gills.'},
    {q:'Give an example of a stimulus and a response in a living organism.',a:'A STIMULUS is a change in the environment. A RESPONSE is the reaction to that change. Example: A plant stem bending towards sunlight (stimulus = light; response = growth towards light).'},
    {q:'How do fungi obtain their nutrition?',a:'Fungi are SAPROPHYTES. They release digestive enzymes onto dead/decaying organic matter (like fallen leaves or bread). These enzymes break down the food, and the fungi absorb the dissolved nutrients through their cell walls.'},
    {q:'Why is reproduction considered essential for the survival of a species?',a:'Reproduction ensures the CONTINUATION of the species. While individual organisms eventually die, reproduction produces new offspring, ensuring that the species does not become extinct.'},
    {q:'What is the difference between the Plant Kingdom and the Animal Kingdom?',a:'Plants are AUTOTROPHS (they make their own food via photosynthesis), have cell walls made of cellulose, and do not move from place to place. Animals are HETEROTROPHS (they eat other organisms for food), do not have cell walls, and are capable of movement.'},
    {q:'Describe the key characteristics of the Kingdom Fungi.',a:'Fungi are eukaryotic, heterotrophic organisms. They have cell walls made of CHITIN. They do NOT photosynthesise. They absorb nutrients from decaying organic matter (saprophytic nutrition). Examples include mushrooms, yeast, and mould.'},
    {q:'Why are viruses not classified in any of the five kingdoms?',a:'Viruses are NOT considered living things because they do not show ALL the characteristics of life. They cannot reproduce on their own (they need a host cell) and do not respire or carry out metabolic processes independently. They are considered "non-living infectious agents".'},
    {q:'A student observes an animal with fur and thinks it is a mammal. List one more characteristic that must be checked to confirm.',a:'In addition to having fur, it must be WARM-BLOODED, feed its young with MILK, and give BIRTH to live young (or lay eggs in a few rare species like the platypus).'},
    {q:'What is the main difference between an invertebrate and a vertebrate in terms of support?',a:'VERTEBRATES have an internal skeleton made of bone or cartilage, with a backbone as the central support. INVERTEBRATES do not have a backbone; they may have an external skeleton (exoskeleton) like insects or a hydrostatic skeleton like worms.'},
    {q:'Explain the importance of classification for the study of biology.',a:'Classification helps scientists: (1) IDENTIFY and name millions of species, (2) organise information logically, (3) predict the characteristics of an organism based on its group, and (4) understand evolutionary relationships between different species.'},
    {q:'What is the scientific name of a species?',a:'The scientific name is the BINOMIAL NOMENCLATURE, consisting of two parts: the GENUS (capitalised) and the SPECIES name (lowercase). For example, Homo sapiens (human). It is always written in italics.'},
    {q:'Which kingdom do humans belong to, and what makes us part of that kingdom?',a:'Humans belong to the Kingdom ANIMALIA. We are multicellular, we HETEROTROPHIC (eat food), we have cells without cell walls, we can move, and we have a nervous system that allows us to respond to our environment.'},
  ],
  blanks:{
    passage:'The seven characteristics of living things can be remembered using the mnemonic MRS [_]. Animals that have a backbone are classified as [_]. Mammals are [_]-blooded animals that feed their offspring with [_], which is produced in mammary glands. Organisms like mushrooms and yeast belong to the kingdom [_], which does not photosynthesise. In classification, scientists use shared features to divide organisms into smaller and smaller groups, starting with the broadest group, the [_].',
    answers:['GREN','vertebrates','warm','milk','Fungi','Kingdom'],
    wordbank:['GREN','vertebrates','warm','milk','Fungi','Kingdom','cold','Invertebrates','Plantae'],
  },
  sentences:[
    {prompt:'Explain why a bat is classified as a MAMMAL and not as a BIRD, even though both can fly and have wings.',keywords:['bat','bird','flight','mammal','hair','fur','suckles young','milk','feathers','warm-blooded'],hint:'What features define a mammal? Which of these does a bat have that defines it as a mammal, and what key feature do birds have that bats lack?'},
    {prompt:'Describe THREE major differences between plants and animals.',keywords:['photosynthesis','movement','chlorophyll','food','cell wall','cellulose','respond','root','locomotion'],hint:'Think about how they obtain food, whether they can move from one location to another, and what their cells are made of.'},
    {prompt:'Explain why it is important for biologists to classify living things into groups based on their features.',keywords:['identify','organise','study','millions','species','communicate','evolution','standardise'],hint:'There are millions of different species on Earth. How does a standard system of naming and grouping help scientists understand and communicate about them?'},
    {prompt:'A new organism is discovered. It is multicellular, has a cell wall (but not made of cellulose), and feeds on dead plants. Which kingdom does it belong to? Explain.',keywords:['fungi','cell wall','chitin','non-cellulose','decomposer','saprophyte','kingdom','classification'],hint:'Which kingdom does not photosynthesise, has cell walls made of chitin, and absorbs nutrients from dead matter?'},
    {prompt:'Describe the complete life cycle of a frog, listing how it changes at each stage.',keywords:['frog','amphibian','eggs','water','tadpole','gills','tail','metamorphosis','adult','lungs','land'],hint:'Frogs are amphibians. How do they start their lives, and what physical changes do they undergo as they become adults?'},
    {prompt:'What are the main differences between warm-blooded and cold-blooded animals? Give one example of each.',keywords:['warm-blooded','endothermic','constant','mammal','bird','cold-blooded','ectothermic','variable','lizard','frog','sun'],hint:'Which animals maintain a steady body temperature regardless of the weather? Which animals depend on the weather to warm their bodies?'},
    {prompt:'How would you distinguish between a reptile (like a snake) and an amphibian (like a salamander) just by looking at their skin and habitat?',keywords:['reptile','scales','dry','amphibian','moist','wet','skin','habitat','land','water'],hint:'What is the texture of their skin? Where do they typically spend most of their adult lives?'},
    {prompt:'Explain how fungi are different from plants in terms of how they get their food.',keywords:['fungi','plants','nutrition','photosynthesis','absorb','dead','decay','chlorophyll','saprophytic'],hint:'Can fungi make their own food using sunlight? If not, how do they obtain the nutrients they need to grow?'},
    {prompt:'Why is a spider classified as an invertebrate while a lizard is a vertebrate?',keywords:['spider','invertebrate','backbone','lizard','vertebrate','spine','skeleton','exoskeleton','endoskeleton'],hint:'What physical structure does the lizard have that the spider does not have?'},
    {prompt:'A child says that a mushroom is a plant. Explain why this statement is scientifically incorrect.',keywords:['mushroom','plant','fungi','chlorophyll','photosynthesis','cellulose','chitin','decomposer','kingdom'],hint:'What do plants have that mushrooms lack? How do they each get their food?'},
    {prompt:'List the 7 characteristics of living things and give an example for each.',keywords:['MRS GREN','movement','respiration','sensitivity','growth','reproduction','excretion','nutrition'],hint:'Use the mnemonic MRS GREN and think of one example for each characteristic.'},
    {prompt:'Explain the classification hierarchy from Kingdom to Species.',keywords:['Kingdom','Phylum','Class','Order','Family','Genus','Species','taxonomy','hierarchy'],hint:'Arrange these terms from the broadest, most general category to the narrowest, most specific category.'},
    {prompt:'Describe the characteristics of mammals that make them different from all other vertebrates.',keywords:['mammal','hair','fur','milk','suckle','warm-blooded','live birth','mammary','glands'],hint:'What physical features and behaviours are unique to mammals?'},
    {prompt:'A tiger and a house cat are classified in the same family, but not the same species. Explain what this means in terms of classification.',keywords:['tiger','cat','species','classification','family','genus','similarities','differences'],hint:'They share a broad group (family) because they have many similarities, but they are different enough that they are separated into distinct species. Can they breed together?'},
    {prompt:'What is excretion, and why is it essential for living things?',keywords:['excretion','waste','carbon dioxide','urea','urine','toxic','remove','poisonous'],hint:'What happens to your body if waste products are not removed? What waste products do animals excrete?'},
    {prompt:'How do living things respond to their environment? Give three examples.',keywords:['sensitivity','stimulus','light','sound','touch','plant','leaf','animal','response','environment'],hint:'Think of how plants and animals react to changes around them, such as light, heat, or touch.'},
    {prompt:'Explain why a virus is not considered a living organism.',keywords:['virus','non-living','host','reproduce','cells','metabolism','respiration','life','characteristics','obligate parasite'],hint:'Can a virus reproduce on its own? Does it carry out metabolic processes like respiration?'},
    {prompt:'Compare a fish and a mammal in terms of how they breathe and regulate body temperature.',keywords:['fish','mammal','gills','lungs','cold-blooded','warm-blooded','oxygen','temperature','adaptation'],hint:'One breathes by extracting oxygen from water; the other breathes air. One has a constant body temperature; the other changes temperature with its surroundings.'},
    {prompt:'What is a species? Give an example of two animals that are the same species and two that are different.',keywords:['species','breed','fertile','offspring','lion','tiger','domestic','cat','classification'],hint:'What is the most specific classification group? What does it mean for two organisms to belong to the same species?'},
    {prompt:'Describe the role of classification in understanding evolution.',keywords:['classification','evolution','ancestry','shared','characteristics','common ancestor','homologous','DNA','phylogeny'],hint:'How does grouping organisms by their physical and genetic similarities help us understand how they are related through evolutionary history?'},
  ],
});
</script></body></html>
