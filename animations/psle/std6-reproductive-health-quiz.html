<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reproductive Health Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Reproductive Health — Std 6 Science Quiz',
  color:'#6a1b9a',dark:'#38006b',light:'#f3e5f5',
    mcq:[
    {q:'Puberty in girls usually begins:',opts:['At age 5','Between 8 and 13 years','At age 18','Between 20 and 25 years'],ans:1,exp:'Puberty in GIRLS usually begins between ages 8 and 13 (can vary). Key changes: growth of breasts, pubic and underarm hair, widening of hips, start of menstruation, increased height, emotional changes.'},
    {q:'The main hormone that controls puberty changes in boys is:',opts:['Oestrogen','Progesterone','Testosterone','Adrenaline'],ans:2,exp:'TESTOSTERONE is produced by the TESTES and controls male puberty changes: deeper voice, growth of facial/body hair, muscle development, enlargement of testes and penis, production of sperm.'},
    {q:'What is menstruation?',opts:['The release of an egg','The shedding of the uterus lining when pregnancy does not occur','The fertilisation of an egg','The growth of the foetus'],ans:1,exp:'MENSTRUATION (period): each month, the uterus lining builds up to receive a fertilised egg. If no fertilisation occurs, the lining is SHED as blood through the vagina. The cycle is ~28 days.'},
    {q:'Fertilisation of a human egg occurs in the:',opts:['Uterus (womb)','Vagina','Fallopian tube (oviduct)','Ovary'],ans:2,exp:'FERTILISATION occurs in the FALLOPIAN TUBE (oviduct). A sperm cell fuses with an egg cell (ovum) released from the ovary (ovulation). The fertilised egg then travels to the UTERUS where it implants and develops.'},
    {q:'Which of the following is a way to maintain good reproductive health?',opts:['Avoiding all exercise','Using tobacco and alcohol freely','Practising good hygiene and regular health check-ups','Staying indoors always'],ans:2,exp:'Good reproductive health includes: personal HYGIENE, regular HEALTH CHECK-UPS, avoiding tobacco/alcohol, HEALTHY DIET, EXERCISE, safe relationships, emotional well-being, and knowing about STIs.'},
    {q:'Which hormone is primarily responsible for female puberty changes?',opts:['Testosterone','Oestrogen','Insulin','Adrenaline'],ans:1,exp:'OESTROGEN is the main female sex hormone, produced by the OVARIES. It controls female puberty changes including breast development, widening of hips, and the regulation of the menstrual cycle.'},
    {q:'The male reproductive organ that produces sperm and testosterone is the:',opts:['Penis','Vas deferens','Testes','Urethra'],ans:2,exp:'The TESTES (testicles) are the primary male reproductive organs. They produce SPERM cells and secrete the hormone TESTOSTERONE, which is responsible for male secondary sexual characteristics.'},
    {q:'The release of a mature egg from the ovary is called:',opts:['Menstruation','Fertilisation','Ovulation','Implantation'],ans:2,exp:'OVULATION is the process where a mature egg (ovum) is released from the ovary into the fallopian tube. This occurs approximately midway through the menstrual cycle (around day 14).'},
    {q:'After fertilisation, the zygote divides and implants into the lining of the:',opts:['Ovary','Fallopian tube','Uterus (womb)','Vagina'],ans:2,exp:'After fertilisation in the fallopian tube, the zygote travels to the UTERUS (womb). It IMPLANTS into the thickened lining of the uterus, where it will grow and develop into an embryo.'},
    {q:'The organ that connects the developing foetus to the placenta is the:',opts:['Amnion','Umbilical cord','Vagina','Fallopian tube'],ans:1,exp:'The UMBILICAL CORD is a flexible tube that connects the developing foetus to the PLACENTA. It contains blood vessels that transport oxygen and nutrients from the placenta to the foetus, and remove waste products.'},
    {q:'During the menstrual cycle, the uterus lining is built up to:',opts:['Prepare for a potential pregnancy','Release a new egg','Start menstruation','Produce oestrogen'],ans:0,exp:'The uterus lining thickens and becomes rich in blood vessels during the first half of the cycle. This preparation is to provide a suitable environment for a potential EMBRYO to implant and develop.'},
    {q:'Which of the following is a secondary sexual characteristic in boys?',opts:['Production of eggs','Growth of facial hair','Menstruation','Widening of hips'],ans:1,exp:'SECONDARY sexual characteristics are physical changes that occur during puberty but are not directly involved in reproduction. For boys, GROWTH OF FACIAL HAIR is a secondary characteristic, controlled by testosterone.'},
    {q:'The female egg cell (ovum) is produced in the:',opts:['Uterus','Fallopian tube','Vagina','Ovary'],ans:3,exp:'The OVARY is the female gonad. It produces and releases mature eggs (ova) during ovulation and also produces the female hormones oestrogen and progesterone.'},
    {q:'When a sperm cell penetrates and fuses with an egg cell, the process is called:',opts:['Ovulation','Implantation','Fertilisation','Menstruation'],ans:2,exp:'FERTILISATION occurs when the nucleus of a sperm cell fuses with the nucleus of an egg cell. This produces a single, diploid cell called a ZYGOTE, which is the first stage of a new organism.'},
    {q:'The average duration of a human menstrual cycle is:',opts:['7 days','14 days','28 days','365 days'],ans:2,exp:'The average human MENSTRUAL CYCLE is approximately 28 DAYS, though it varies significantly from person to person. Day 1 is the first day of menstruation, and day 14 is typically ovulation.'},
    {q:'What is the role of the amnion (amniotic sac)?',opts:['To provide nutrients to the foetus','To produce hormones','To protect the foetus from physical shock and infection','To remove waste products'],ans:2,exp:'The AMNION is a fluid-filled sac that surrounds the developing foetus. The amniotic fluid acts as a CUSHION, protecting the foetus from physical shocks and bumps, and helps prevent infection.'},
    {q:'The hormone that maintains the thickened lining of the uterus after ovulation is:',opts:['Oestrogen','Testosterone','Progesterone','Insulin'],ans:2,exp:'PROGESTERONE is produced by the corpus luteum (the remains of the follicle after ovulation). It maintains the thickened uterus lining, preparing it for possible implantation of a fertilised egg.'},
    {q:'Which part of the female reproductive system receives the penis during sexual intercourse?',opts:['Uterus','Vagina','Fallopian tube','Ovary'],ans:1,exp:'The VAGINA is a muscular, elastic canal that receives the penis during intercourse. It also acts as the birth canal through which the baby passes during childbirth.'},
    {q:'Puberty is triggered when the brain releases hormones that signal the:',opts:['Adrenal glands','Pancreas','Pituitary gland','Liver'],ans:2,exp:'The PITUITARY GLAND (a small gland at the base of the brain) releases hormones that stimulate the OVARIES (in girls) and TESTES (in boys) to produce the sex hormones oestrogen and testosterone. This starts puberty.'},
    {q:'The process of releasing a mature egg from the ovary usually occurs around:',opts:['Day 1 of the cycle','Day 14 of the cycle','Day 28 of the cycle','Day 21 of the cycle'],ans:1,exp:'OVULATION typically occurs around DAY 14 of a 28-day cycle. This is when a mature egg is released from the ovary into the fallopian tube.'},
    {q:'Why is it important for adolescents to understand the changes that occur during puberty?',opts:['So they can be embarrassed','To help them manage physical and emotional changes, and make informed decisions about their health','So they can stop the changes','To make them feel isolated'],ans:1,exp:'Understanding puberty helps adolescents NORMALISE the changes, reduce anxiety, manage their personal hygiene, and make healthy, informed choices regarding their physical and emotional wellbeing.'},
  ],
  match:[
    {term:'Puberty',def:'The stage of development during which the body matures sexually and becomes capable of reproduction'},
    {term:'Ovulation',def:'The release of a mature egg (ovum) from the ovary into the fallopian tube, occurring mid-cycle'},
    {term:'Fertilisation',def:'The fusion of a sperm cell with an egg cell, occurring in the fallopian tube'},
    {term:'Implantation',def:'The attachment of a fertilised egg (zygote) to the thickened lining of the uterus'},
    {term:'Placenta',def:'The organ that develops in the uterus during pregnancy to supply oxygen and nutrients to the foetus and remove wastes'},
    {term:'Testosterone',def:'The male sex hormone produced by the testes; controls male puberty changes and sperm production'},
    {term:'Oestrogen',def:'The female sex hormone produced by the ovaries; controls female puberty changes and the menstrual cycle'},
    {term:'Progesterone',def:'The hormone produced after ovulation that maintains the thickened uterus lining for potential implantation'},
    {term:'Menstruation',def:'The shedding of the thickened uterus lining through the vagina when pregnancy does not occur; marks the start of a new cycle'},
    {term:'Umbilical cord',def:'The flexible tube that connects the developing foetus to the placenta, transporting nutrients and oxygen'},
    {term:'Amnion',def:'The fluid-filled sac that surrounds the foetus, protecting it from physical shock and infection'},
    {term:'Uterus (womb)',def:'The muscular organ where the fertilised egg implants and the foetus develops during pregnancy'},
    {term:'Fallopian tube (oviduct)',def:'The tube that transports the egg from the ovary to the uterus; the site of fertilisation'},
    {term:'Ovary',def:'The female reproductive organ that produces eggs (ova) and the hormones oestrogen and progesterone'},
    {term:'Testes',def:'The male reproductive organs that produce sperm and the hormone testosterone'},
    {term:'Vagina',def:'The muscular canal that receives the penis during intercourse and serves as the birth canal during childbirth'},
    {term:'Secondary sexual characteristics',def:'Physical changes that occur during puberty but are not directly involved in reproduction (e.g., facial hair, breast development)'},
    {term:'Zygote',def:'A single, diploid cell formed by the fusion of a sperm and an egg during fertilisation'},
    {term:'Pituitary gland',def:'The gland in the brain that releases hormones to trigger puberty in both boys and girls'},
    {term:'Reproductive health',def:'A state of physical, mental, and social well-being regarding the reproductive system, including hygiene, disease prevention, and emotional care'},
  ],
  flashcards:[
    {q:'List 4 physical changes that occur during puberty in girls and 4 in boys.',a:'GIRLS: 1. Breasts develop. 2. Hips widen. 3. Growth of pubic/underarm hair. 4. Menstruation begins (periods). 5. Growth spurt. BOYS: 1. Voice deepens. 2. Growth of facial and body hair. 3. Muscles develop. 4. Testes and penis enlarge. 5. Sperm production begins. 6. Growth spurt. Both sexes also experience emotional changes, acne, and increased sweating.'},
    {q:'Describe the key stages of the human menstrual cycle.',a:'Day 1-5: MENSTRUATION (uterus lining is shed as blood). Day 6-13: Uterus lining REBUILDS (oestrogen levels rise). Day 14: OVULATION (an egg is released from the ovary). Day 15-28: Lining thickens further (progesterone rises). If no fertilisation occurs, the cycle restarts at Day 1.'},
    {q:'Describe the process of human fertilisation and early development.',a:'1. An egg is released from the ovary during OVULATION. 2. Sperm cells travel through the uterus to the fallopian tube. 3. One sperm FUSES with the egg in the fallopian tube (FERTILISATION). 4. The fertilised egg (zygote) divides repeatedly as it travels to the uterus. 5. It IMPLANTS into the thickened uterus lining. 6. It develops into an EMBRYO → FOETUS → baby over approximately 40 weeks.'},
    {q:'How does the placenta support the developing foetus during pregnancy?',a:'The PLACENTA has several essential functions: 1. It transfers OXYGEN and NUTRIENTS from the mother\'s blood to the foetus. 2. It removes CARBON DIOXIDE and other waste products from the foetus. 3. It acts as a barrier against some pathogens. 4. It produces HORMONES that help maintain the pregnancy. The mother\'s and foetus\'s blood are separated, but substances are exchanged across the placental membrane.'},
    {q:'State 4 ways to maintain good reproductive health during adolescence.',a:'1. Personal HYGIENE — wash regularly and wear clean undergarments. 2. Healthy DIET — eat a balanced diet to support hormonal and physical development. 3. Regular EXERCISE — maintain fitness and support emotional health. 4. Avoid harmful substances — do not use TOBACCO or ALCOHOL. 5. Regular health CHECK-UPS. 6. Seek INFORMATION from trusted adults. 7. Emotional WELLBEING — talk about feelings and seek support.'},
    {q:'Compare the roles of oestrogen and progesterone in the menstrual cycle.',a:'OESTROGEN is produced in the first half of the cycle (days 1-13). It repairs and thickens the uterus lining. PROGESTERONE is produced after ovulation (days 15-28). It maintains the thickened lining to prepare for implantation. If no pregnancy occurs, progesterone levels drop, triggering menstruation.'},
    {q:'Describe the journey of a sperm cell from the testes to the site of fertilisation.',a:'Sperm are produced in the TESTES. During ejaculation, they travel through the VAS DEFERENS, mix with seminal fluid, pass through the URETHRA, and are deposited in the VAGINA. From the vagina, they swim through the UTERUS and into the FALLOPIAN TUBE, where they can meet and fertilise an egg.'},
    {q:'What is the function of the umbilical cord and the amnion during pregnancy?',a:'The UMBILICAL CORD connects the foetus to the placenta, transporting oxygen and nutrients to the foetus and removing waste. The AMNION (amniotic sac) is a fluid-filled membrane that surrounds the foetus, protecting it from physical shock, maintaining a constant temperature, and preventing infection.'},
    {q:'Explain why the timing of ovulation is important for family planning.',a:'Ovulation occurs roughly on DAY 14 of a 28-day cycle. The egg is viable for about 24 hours. Sperm can survive inside the female body for up to 5 days. Knowing when ovulation occurs helps individuals understand the "fertile window" (the days when pregnancy is most likely to occur).'},
    {q:'Describe three emotional and social changes that occur during puberty.',a:'1. Mood swings — hormone levels can cause emotional highs and lows. 2. Self-consciousness — increased awareness of body image and how peers perceive them. 3. Identity exploration — desire for independence and a stronger sense of personal identity. 4. Attraction — developing feelings of attraction to others.'},
    {q:'What is the role of the pituitary gland in starting puberty?',a:'The PITUITARY GLAND, located at the base of the brain, releases hormones (such as FSH and LH) that travel to the ovaries in girls and the testes in boys. These hormones stimulate the ovaries to produce OESTROGEN and the testes to produce TESTOSTERONE, which trigger the physical changes of puberty.'},
    {q:'Explain the importance of hygiene during menstruation.',a:'Good menstrual hygiene is essential for preventing infections, reducing discomfort, and maintaining overall well-being. It involves: 1. Changing sanitary pads/cups regularly. 2. Washing genital areas with clean water. 3. Wearing clean, comfortable underwear. 4. Proper disposal of used materials.'},
    {q:'What are the primary reproductive organs in males and females, and what are their functions?',a:'MALES: TESTES — produce sperm and testosterone. FEMALES: OVARIES — produce eggs (ova) and oestrogen/progesterone. Other essential organs include the penis and vagina for intercourse, and the uterus for carrying the developing foetus.'},
    {q:'Describe the events that occur between ovulation and the start of the next menstrual period if fertilisation does NOT occur.',a:'After ovulation, the egg travels down the fallopian tube. If it is NOT fertilised, it dissolves. The uterus lining continues to thicken under the influence of progesterone, but after about 14 days, progesterone levels drop. This triggers the uterus lining to break down and shed, resulting in MENSTRUATION.'},
    {q:'Why are adolescents advised to avoid alcohol and tobacco?',a:'Alcohol and tobacco contain harmful chemicals that can interfere with the normal development of the reproductive system, disrupt hormone balance, and reduce overall health. They can also affect sperm quality and egg health, and increase the risk of long-term fertility problems.'},
    {q:'Explain what the "fertile window" means.',a:'The "fertile window" is the days in a woman\'s cycle when pregnancy is most likely to occur. It typically spans the 5 days leading up to OVULATION and the day of ovulation itself (days 10-14 in a 28-day cycle). This is because sperm can survive inside the body for several days.'},
    {q:'How does the body know when to start menstruation?',a:'If an egg is NOT fertilised, the corpus luteum (the structure that formed from the follicle after ovulation) stops producing PROGESTERONE. The drop in progesterone signals the uterus to shed its thickened lining. This shedding is MENSTRUATION.'},
    {q:'Describe a healthy lifestyle practice that supports reproductive health.',a:'Eating a BALANCED DIET rich in vitamins and minerals supports hormone production. Regular EXERCISE helps maintain healthy circulation and reduces stress. Getting enough SLEEP is essential for hormone regulation. Avoiding harmful substances protects the reproductive organs.'},
    {q:'Why do some adolescents feel self-conscious during puberty?',a:'Puberty brings rapid changes in BODY SHAPE, height, and skin (e.g., acne). These changes, combined with new emotional feelings and a desire for social acceptance, can make adolescents feel self-conscious. It is a normal part of developing self-identity.'},
    {q:'Explain why understanding puberty is important for emotional well-being.',a:'Understanding puberty helps adolescents NORMALISE the changes they are going through, reducing anxiety and fear. It also helps them communicate openly with parents, guardians, and healthcare providers, ensuring they get the support and accurate information they need.'},
  ],
  blanks:{
    passage:'Puberty is the period when the body becomes sexually mature. In boys, the hormone [_] is responsible for the physical changes of puberty. In girls, the hormone [_] regulates the changes and the menstrual cycle. During the menstrual cycle, an egg is released from the ovary in a process called [_]. If the egg is not fertilised, the thickened lining of the [_] is shed during menstruation. During pregnancy, the [_] develops to supply the foetus with oxygen and nutrients.',
    answers:['testosterone','oestrogen','ovulation','uterus','placenta'],
    wordbank:['testosterone','oestrogen','ovulation','uterus','placenta','progesterone','fertilisation','ovary'],
  },
  sentences:[
    {prompt:'Describe the complete journey of a sperm cell from the male testes to the site of fertilisation in the female body.',keywords:['testes','epididymis','vas deferens','urethra','vagina','uterus','fallopian tube','ovum','fertilisation'],hint:'Trace the anatomical path the sperm takes through the male and female reproductive systems. Where does it finally meet the egg?'},
    {prompt:'Explain why puberty often begins at different ages for different individuals, and state whether this is a cause for concern.',keywords:['hormones','genes','inherited','individual','variation','normal','developmental','growth'],hint:'Is there a single "correct" age for puberty to start? What factors, both genetic and environmental, influence the timing of these changes?'},
    {prompt:'State three emotional or social changes that commonly occur during puberty and explain why these changes are linked to physical development.',keywords:['hormones','mood swings','self-conscious','identity','independence','brain development','puberty','feelings'],hint:'Hormones affect the brain as well as the body. How might changing hormone levels influence a teenager\'s mood, their sense of self, or their relationships with others?'},
    {prompt:'Describe the key physical changes that occur in girls and boys during puberty, and identify the hormone responsible for each.',keywords:['girls','oestrogen','breasts','hips','menstruation','boys','testosterone','voice','hair','muscle','sperm'],hint:'Name the hormone that drives puberty in males and the hormone that drives it in females. What specific changes does each hormone cause?'},
    {prompt:'Trace the pathway of an egg from the ovary through the female reproductive system, and describe where fertilisation and implantation occur.',keywords:['ovary','ovulation','fallopian tube','fertilisation','uterus','implantation','egg','sperm','zygote','embryo'],hint:'Where is the egg released? Where does it travel? Where does it meet a sperm? Where does it attach if fertilised?'},
    {prompt:'Compare the roles of the amnion, the placenta, and the umbilical cord during pregnancy.',keywords:['amnion','protection','shock','placenta','oxygen','nutrients','umbilical cord','foetus','waste','transport'],hint:'One protects the foetus from injury. One provides nutrition and removes waste. One connects the two. What specific roles does each structure play?'},
    {prompt:'Describe the menstrual cycle including the roles of oestrogen and progesterone.',keywords:['menstruation','shedding','oestrogen','lining','rebuild','ovulation','progesterone','maintain','pregnancy'],hint:'What hormone controls the rebuilding of the uterus lining? What hormone maintains the lining after ovulation? What happens when pregnancy does not occur?'},
    {prompt:'Explain why the pituitary gland is considered the "master gland" in the context of puberty.',keywords:['pituitary gland','master','hormones','testes','ovaries','stimulate','testosterone','oestrogen','puberty','trigger'],hint:'Which gland releases the hormones that "wake up" the reproductive organs? How does this gland initiate the changes of puberty?'},
    {prompt:'A girl notices her menstrual cycle is not perfectly 28 days every month. Is this a concern? Explain.',keywords:['cycle','28 days','variation','normal','stress','diet','exercise','health','hormones'],hint:'Is a perfectly consistent 28-day cycle common? What factors can cause slight variations in cycle length?'},
    {prompt:'Describe three safe and healthy habits that support reproductive health during adolescence.',keywords:['hygiene','exercise','diet','health check-ups','tobacco','alcohol','self-care','prevention'],hint:'What daily practices can help maintain physical and emotional health? What substances should adolescents avoid?'},
    {prompt:'Explain the process of ovulation and state when it typically occurs in a 28-day cycle.',keywords:['ovulation','egg','ovary','fallopian tube','day 14','follicle','released','fertile','cycle'],hint:'What is ovulation? Which day of the cycle does it usually happen? What happens to the egg after it is released?'},
    {prompt:'Why is the placenta often referred to as a "life support system" for the foetus?',keywords:['placenta','oxygen','nutrients','waste','barrier','hormones','life support','foetus','pregnancy'],hint:'What essential substances does the placenta supply to the foetus? What waste products does it remove? Does it provide any other functions?'},
    {prompt:'Discuss the emotional changes that occur during puberty and why they are considered normal.',keywords:['mood swings','hormones','emotions','brain development','self-consciousness','identity','normal','adolescence'],hint:'Hormones influence brain development. What kinds of emotional shifts might an adolescent experience? Why are these feelings a natural part of growing up?'},
    {prompt:'Explain why it is beneficial for young people to have a trusted adult to talk to about puberty.',keywords:['trusted adult','communication','support','information','emotions','concerns','normalise','guidance'],hint:'What can a trusted adult provide that peers or the internet cannot? How does open communication support emotional and physical well-being?'},
    {prompt:'State the function of the uterus and the ovaries in the female reproductive system.',keywords:['uterus','foetus','pregnancy','implant','develop','ovaries','eggs','ova','hormones','oestrogen'],hint:'One organ produces eggs and hormones. The other nurtures and protects the developing foetus. What is each organ\'s specific role?'},
    {prompt:'Explain why maintaining good personal hygiene is important during puberty.',keywords:['hygiene','sweating','acne','body odour','infections','self-care','puberty','clean','healthy'],hint:'What changes in the body during puberty increase the need for regular washing? How does hygiene affect both physical health and social confidence?'},
    {prompt:'Describe the role of the testes in the male reproductive system.',keywords:['testes','sperm','production','testosterone','hormone','puberty','male','reproductive'],hint:'What two essential things do the testes produce? What role do these products play in reproduction and development?'},
    {prompt:'Explain why fertilisation must occur in the fallopian tube and not in the uterus.',keywords:['fertilisation','fallopian tube','egg','sperm','uterus','implantation','zygote','timing','environment'],hint:'Can the egg survive until it reaches the uterus without being fertilised? How does the fallopian tube provide the right environment for fertilisation?'},
    {prompt:'Describe how an egg and a sperm meet and form a zygote.',keywords:['ovulation','sperm','fallopian tube','fertilisation','nucleus','fuse','zygote','egg','ovum'],hint:'What conditions allow the sperm and egg to meet? What exactly happens when the sperm penetrates the egg?'},
    {prompt:'What is the role of the cervix in the female reproductive system?',keywords:['cervix','uterus','vagina','birth canal','baby','labour','opening','menstrual flow'],hint:'The cervix is the narrow neck of the uterus. What important function does it serve during childbirth and during the menstrual cycle?'},
  ],
});
</script></body></html>
