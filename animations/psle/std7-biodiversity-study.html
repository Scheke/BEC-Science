{title:'Species Diversity & Habitats',content:`<h2>Life's Amazing Variety</h2><p><strong>Biodiversity</strong> = variety of species in ecosystems</p><p><strong>Three types:</strong></p><ol><li>🌍 <strong>Genetic diversity</strong> — variation WITHIN a species</li><li>🌳 <strong>Species diversity</strong> — different species in an area</li><li>🏞️ <strong>Ecosystem diversity</strong> — variety of different habitats</li></ol><p><strong>Major habitats:</strong></p><ul><li>🌧️ Rainforests (most diverse)</li><li>🏜️ Deserts, grasslands</li><li>🌊 Oceans (coral reefs are hotspots)</li><li>🏔️ Mountains, polar regions</li></ul><p><strong>Key fact:</strong> More diversity = more resilient ecosystem!</p>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><polygon points="80,140 60,200 100,200" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/><polygon points="120,130 100,200 140,200" fill="#388e3c" stroke="#1b5e20" stroke-width="2"/><circle cx="150" cy="100" r="15" fill="#ffb74d" stroke="#e65100" stroke-width="2"/><circle cx="180" cy="120" r="12" fill="#ff6b6b" stroke="#c92a2a" stroke-width="1.5"/><circle cx="210" cy="95" r="14" fill="#64b5f6" stroke="#1565c0" stroke-width="1.5"/><circle cx="240" cy="125" r="13" fill="#81c784" stroke="#2e7d32" stroke-width="1.5"/><circle cx="280" cy="105" r="11" fill="#ce93d8" stroke="#8e24aa" stroke-width="1.5"/><circle cx="310" cy="130" r="12" fill="#ffab91" stroke="#d84315" stroke-width="1.5"/><circle cx="340" cy="110" r="10" fill="#fff59d" stroke="#fbc02d" stroke-width="1.5"/><rect x="60" y="180" width="280" height="40" rx="5" fill="#8d6e63" opacity="0.4"/><text x="210" y="205" font-size="9" fill="#333" font-weight="bold" text-anchor="middle">Biodiverse Ecosystem</text></svg>`}
,{title:'Extinction & Conservation',content:`<h2>Protecting Biodiversity</h2><p><strong>Extinction</strong> = species disappears from Earth forever</p><p><strong>Endangered species:</strong> Low population, at risk of extinction</p><ul><li>⚠️ Habitat loss (deforestation, pollution)</li><li>⚠️ Overhunting or overfishing</li><li>⚠️ Climate change</li><li>⚠️ Introduction of invasive species</li></ul><p><strong>Conservation efforts:</strong></p><ul><li>🛡️ Protected areas & national parks</li><li>🤝 International agreements</li><li>🧬 Breeding programs for endangered species</li><li>♻️ Sustainable practices</li></ul><p><strong>Why it matters:</strong> Each species plays a role in the ecosystem!</p>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><circle cx="100" cy="100" r="25" fill="#ff6b6b" stroke="#c62828" stroke-width="2"/><text x="100" y="105" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Endangered</text><circle cx="100" cy="100" r="20" fill="#ffeb3b" stroke="#fbc02d" stroke-width="3" stroke-dasharray="3,3"/><circle cx="200" cy="100" r="25" fill="#ff9800" stroke="#e65100" stroke-width="2"/><text x="200" y="105" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Vulnerable</text><circle cx="300" cy="100" r="25" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/><text x="300" y="105" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Protected</text><text x="100" y="150" font-size="7" fill="#333" text-anchor="middle">Few left</text><text x="200" y="150" font-size="7" fill="#333" text-anchor="middle">At risk</text><text x="300" y="150" font-size="7" fill="#333" text-anchor="middle">Recovering</text><rect x="60" y="190" width="300" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="210" y="210" font-size="8" fill="#2e7d32" font-weight="bold" text-anchor="middle">Conservation: Protected areas, breeding programs, sus
