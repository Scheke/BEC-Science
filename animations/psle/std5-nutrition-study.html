<script>
const STEPS=[
{title:'Why Do We Need Food?',
content:`<h2>Food Gives Us Energy and Building Materials</h2>
<p>Your body needs food for three main reasons:</p>
<ul>
<li>⚡ <strong>Energy</strong> — to move, think, grow, and stay warm</li>
<li>🏗️ <strong>Growth and repair</strong> — to build new cells and fix damaged ones</li>
<li>🛡️ <strong>Protection</strong> — to fight disease and regulate body processes</li>
</ul>
<p>A <strong>balanced diet</strong> contains all the nutrients you need in the right amounts. Eating too much or too little of any nutrient causes health problems.</p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,280);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  const foods=[{n:'Rice 🍚',c:'#f4511e'},{n:'Meat 🥩',c:'#8e24aa'},{n:'Milk 🥛',c:'#1e88e5'},{n:'Vegetables 🥦',c:'#43a047'},{n:'Fruit 🍎',c:'#e53935'},{n:'Oil 🫙',c:'#ffd600'}];
  let t=0;
  p.draw=()=>{
    p.background(245);
    p.fill('#fff');p.stroke('#ccc');p.strokeWeight(2);p.ellipse(210,145,260,200);
    p.noStroke();p.fill('#333');p.textSize(14);p.text('Balanced Diet 🍽️',210,62);
    foods.forEach((f,i)=>{
      const a=p.TWO_PI*(i/6)+t*0.01;
      const x=210+100*p.cos(a),y=145+80*p.sin(a);
      p.fill(f.c);p.noStroke();p.ellipse(x,y,70,40);
      p.fill(255);p.textSize(10);p.text(f.n,x,y);
    });
    t++;
  };
}},
{title:'Carbohydrates, Proteins, and Fats',
content:`<h2>The Macronutrients</h2>
<p>These are needed in <strong>large amounts</strong> (macronutrients):</p>
<table style="width:100%;border-collapse:collapse;margin:8px 0">
<tr><th style="background:#e65100;color:#fff;padding:6px">Nutrient</th><th style="background:#e65100;color:#fff;padding:6px">Function</th><th style="background:#e65100;color:#fff;padding:6px">Food Sources</th></tr>
<tr style="background:#fbe9e7"><td style="padding:6px"><strong>Carbohydrates</strong></td><td style="padding:6px">Main energy source</td><td style="padding:6px">Rice, bread, potatoes, sugar</td></tr>
<tr><td style="padding:6px"><strong>Proteins</strong></td><td style="padding:6px">Growth and repair</td><td style="padding:6px">Meat, fish, eggs, beans, nuts</td></tr>
<tr style="background:#fbe9e7"><td style="padding:6px"><strong>Fats</strong></td><td style="padding:6px">Stored energy, insulation</td><td style="padding:6px">Oil, butter, avocado, nuts</td></tr>
</table>
<p>Carbohydrates are broken down to <strong>glucose</strong> — the fuel for all your cells during respiration.</p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,280);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  const nuts=[{n:'Carbs\n⚡ Energy',c:'#f4511e',x:100},{n:'Proteins\n🏗️ Build',c:'#8e24aa',x:210},{n:'Fats\n💾 Store',c:'#ffd600',x:320}];
  let t=0;
  p.draw=()=>{
    p.background(245);
    nuts.forEach((nt,i)=>{
      const pulse=1+0.08*p.sin(t*0.05+i*2);
      p.fill(nt.c);p.noStroke();p.ellipse(nt.x,150,100*pulse,100*pulse);
      p.fill(i===1?255:'#333');p.textSize(12);
      const lines=nt.n.split('\n');
      lines.forEach((l,li)=>p.text(l,nt.x,142+li*18));
    });
    p.fill('#333');p.textSize(11);p.noStroke();p.text('The 3 macronutrients — needed in large amounts',210,250);
    t++;
  };
}},
{title:'Vitamins and Minerals',
content:`<h2>Micronutrients</h2>
<p>Needed in <strong>small amounts</strong> but essential for health:</p>
<table style="width:100%;border-collapse:collapse;margin:8px 0">
<tr><th style="background:#e65100;color:#fff;padding:4px">Nutrient</th><th style="background:#e65100;color:#fff;padding:4px">Function</th><th style="background:#e65100;color:#fff;padding:4px">Deficiency</th></tr>
<tr style="background:#fbe9e7"><td style="padding:4px">Vitamin A</td><td style="padding:4px">Vision, immune system</td><td style="padding:4px">Night blindness</td></tr>
<tr><td style="padding:4px">Vitamin C</td><td style="padding:4px">Healthy skin and gums</td><td style="padding:4px">Scurvy</td></tr>
<tr style="background:#fbe9e7"><td style="padding:4px">Vitamin D</td><td style="padding:4px">Bone formation</td><td style="padding:4px">Rickets</td></tr>
<tr><td style="padding:4px">Iron</td><td style="padding:4px">Makes haemoglobin (red blood cells)</td><td style="padding:4px">Anaemia</td></tr>
<tr style="background:#fbe9e7"><td style="padding:4px">Calcium</td><td style="padding:4px">Bones and teeth</td><td style="padding:4px">Weak bones</td></tr>
</table>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,280);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  const vits=[{n:'Vit A\n🥕',c:'#ef6c00'},{n:'Vit C\n🍊',c:'#e53935'},{n:'Vit D\n☀️',c:'#fdd835'},{n:'Iron\n🥩',c:'#8e24aa'},{n:'Calcium\n🥛',c:'#1e88e5'}];
  let t=0,active=0;
  p.draw=()=>{
    p.background(245);
    if(t%90===0)active=(active+1)%5;
    vits.forEach((v,i)=>{
      const a=p.TWO_PI*(i/5)-p.HALF_PI;
      const x=210+120*p.cos(a),y=145+100*p.sin(a);
      const isA=active===i;
      p.fill(isA?v.c:'#ddd');p.noStroke();p.ellipse(x,y,isA?90:70,isA?60:46);
      p.fill(isA?255:'#555');p.textSize(isA?12:10);
      const ls=v.n.split('\n');ls.forEach((l,li)=>p.text(l,x,y-8+li*18));
    });
    p.fill('#333');p.noStroke();p.textSize(12);p.text('Micronutrients — small amounts, big impact!',210,262);
    t++;
  };
}},
{title:'Water and Fibre',
content:`<h2>Often Forgotten But Essential!</h2>
<p><strong>Water 💧</strong></p>
<ul>
<li>Makes up about 60-70% of your body</li>
<li>Needed for ALL body processes</li>
<li>Transports nutrients and waste in blood</li>
<li>Regulates body temperature (sweating)</li>
<li>We need about 6-8 glasses a day</li>
</ul>
<p><strong>Fibre (roughage) 🥦</strong></p>
<ul>
<li>Found in vegetables, fruits, whole grains</li>
<li>Not digested — helps MOVE food through the intestines</li>
<li>Prevents constipation</li>
<li>Reduces risk of bowel cancer</li>
</ul>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,270);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let t=0,level=0.2;
  p.draw=()=>{
    p.background(245);
    level=0.5+0.35*p.sin(t*0.03);
    // water glass
    p.fill('#e3f2fd');p.stroke('#1e88e5');p.strokeWeight(2);p.rect(60,80,100,150,0,0,10,10);
    p.fill('#42a5f5');p.noStroke();p.rect(60,80+150*(1-level),100,150*level,0,0,10,10);
    p.fill('#1565c0');p.textSize(13);p.text('Water\n💧',110,180);
    // body outline
    p.fill('#fff3e0');p.stroke('#e65100');p.strokeWeight(2);p.ellipse(310,100,70,50);
    p.rect(280,125,60,100,8);
    p.fill('#333');p.noStroke();p.textSize(11);p.text('60-70%\nwater',310,108);
    // wave
    p.stroke('#42a5f5');p.strokeWeight(2);p.noFill();p.beginShape();
    for(let x=0;x<=60;x++){const wx=250+x*1,wy=235+8*p.sin(x*0.4+t*0.1);p.vertex(wx,wy);}
    p.endShape();
    p.fill('#333');p.noStroke();p.textSize(11);p.text('Fibre keeps digestion moving!',310,260);
    t++;
  };
}},
{title:'Food Tests',
content:`<h2>How to Test Food for Nutrients</h2>
<table style="width:100%;border-collapse:collapse;margin:8px 0">
<tr><th style="background:#e65100;color:#fff;padding:6px">Nutrient</th><th style="background:#e65100;color:#fff;padding:6px">Reagent Used</th><th style="background:#e65100;color:#fff;padding:6px">Positive Result</th></tr>
<tr style="background:#fbe9e7"><td style="padding:6px"><strong>Starch</strong></td><td style="padding:6px">Iodine solution</td><td style="padding:6px">Yellow-brown → <strong>Blue-black</strong></td></tr>
<tr><td style="padding:6px"><strong>Glucose (sugar)</strong></td><td style="padding:6px">Benedict's solution + heat</td><td style="padding:6px">Blue → <strong>Brick-red/orange</strong></td></tr>
<tr style="background:#fbe9e7"><td style="padding:6px"><strong>Protein</strong></td><td style="padding:6px">Biuret solution</td><td style="padding:6px">Blue → <strong>Purple/violet</strong></td></tr>
<tr><td style="padding:6px"><strong>Fat</strong></td><td style="padding:6px">Ethanol + water</td><td style="padding:6px">Clear → <strong>Milky white</strong></td></tr>
</table>
<p>Food tests tell us which nutrients are present — but not how much.</p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,280);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  const tests=[{n:'Starch\n(Iodine)',before:'#f9a825',after:'#1a237e',bx:60},{n:'Glucose\n(Benedict\'s)',before:'#1e88e5',after:'#bf360c',bx:175},{n:'Protein\n(Biuret)',before:'#42a5f5',after:'#6a1b9a',bx:290}];
  let t=0;
  p.draw=()=>{
    p.background(245);
    tests.forEach((ts,i)=>{
      const progress=(p.sin(t*0.03+i*2)+1)/2;
      const r=p.lerp(p.red(p.color(ts.before)),p.red(p.color(ts.after)),progress);
      const g=p.lerp(p.green(p.color(ts.before)),p.green(p.color(ts.after)),progress);
      const b=p.lerp(p.blue(p.color(ts.before)),p.blue(p.color(ts.after)),progress);
      p.fill(r,g,b);p.stroke('#999');p.strokeWeight(2);
      p.rect(ts.bx-28,80,56,100,8,8,4,4);
      p.noStroke();p.fill('#333');p.textSize(10);
      ts.n.split('\n').forEach((l,li)=>p.text(l,ts.bx,210+li*14));
    });
    p.fill('#333');p.textSize(11);p.noStroke();p.text('Watch the colour change — that\'s a positive result!',210,262);
    t++;
  };
}},
{title:'The Food Groups — The Healthy Plate',
content:`<h3>A Balanced Plate Has All Food Groups</h3>
<p>Nutritionists use a <strong>healthy plate model</strong> to show how much of each food group you should eat at each meal.</p>
<ul>
<li><strong>Carbohydrates</strong> (largest portion) — rice, bread, maize, potatoes</li>
<li><strong>Vegetables</strong> — half the plate should be vegetables and fruit</li>
<li><strong>Proteins</strong> — meat, fish, eggs, beans, lentils</li>
<li><strong>Dairy</strong> — milk, yoghurt, cheese (calcium source)</li>
<li><strong>Fats/Oils</strong> — small amounts only (butter, oil)</li>
</ul>`,

{title:'The 6 Nutrients — What They Do',
content:`<h3>Six Essential Nutrients</h3>
<p>Every nutrient has a specific job in the body. All six are needed for good health:</p>
<ul>
<li><strong>Carbohydrates</strong> — primary energy fuel (broken down to glucose)</li>
<li><strong>Proteins</strong> — build and repair muscles, organs, enzymes, antibodies</li>
<li><strong>Fats</strong> — store energy, insulate body, absorb fat-soluble vitamins</li>
<li><strong>Vitamins</strong> — regulate body processes, protect cells</li>
<li><strong>Minerals</strong> — build bones and teeth, carry oxygen in blood</li>
<li><strong>Water</strong> — transport medium for all body reactions</li>
</ul>`,

{title:'Deficiency Diseases',
content:`<h3>What Happens When Nutrients Are Missing?</h3>
<p>A <strong>deficiency disease</strong> occurs when the body lacks a specific nutrient for a long time. These are common in areas where food variety is limited.</p>
<ul>
<li><strong>Iron deficiency → Anaemia</strong>: tired, pale, breathless (not enough red blood cells)</li>
<li><strong>Vitamin C deficiency → Scurvy</strong>: bleeding gums, slow wound healing</li>
<li><strong>Vitamin D deficiency → Rickets</strong>: soft/bent bones in children</li>
<li><strong>Iodine deficiency → Goitre</strong>: swollen thyroid gland in neck</li>
</ul>
<p>Prevention: eat a varied diet with plenty of fruits, vegetables, meat, fish and dairy.</p>`,

{title:'Balanced vs Unbalanced Diet Comparison',
content:`<h3>What Makes a Diet Balanced?</h3>
<p>A <strong>balanced diet</strong> contains all 6 nutrients in the right proportions. An <strong>unbalanced diet</strong> has too much of some foods and too little of others.</p>
<ul>
<li>Too much fat and sugar → obesity, heart disease, diabetes</li>
<li>Too little protein → stunted growth, poor immunity</li>
<li>Too little vitamins/minerals → deficiency diseases</li>
<li>Too little food overall → malnutrition, weakness</li>
</ul>
<p>A balanced diet + exercise + enough water = good health!</p>`,

{title:'How the Body Uses Nutrients',
content:`<h3>Every Nutrient Has a Destination</h3>
<p>After digestion, nutrients are absorbed into the bloodstream and transported to where they are needed most.</p>
<ul>
<li><strong>Carbohydrates → glucose</strong>: energy for muscles and brain</li>
<li><strong>Protein → amino acids</strong>: build and repair muscles, skin, organs</li>
<li><strong>Calcium → bones and teeth</strong>: keep them strong and hard</li>
<li><strong>Iron → blood haemoglobin</strong>: carries oxygen from lungs to all cells</li>
<li><strong>Vitamin A → eyes</strong>: needed for vision especially in dim light</li>
<li><strong>Water → every cell</strong>: all chemical reactions happen in water</li>
</ul>`,
