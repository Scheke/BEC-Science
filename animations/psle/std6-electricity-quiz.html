<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Electricity Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Electricity — Std 6 Science Quiz',
  color:'#f57f17',dark:'#bc5100',light:'#fff8e1',
    mcq:[
    {q:'In a series circuit, if one bulb blows out:',opts:['The other bulbs get brighter','Only the broken bulb goes out','All bulbs go out','Nothing changes'],ans:2,exp:'In a SERIES circuit, all components share ONE loop. If one bulb blows, the circuit is BROKEN and ALL bulbs go out. In a PARALLEL circuit, each component has its own path — one bulb breaking does not affect the others.'},
    {q:'Which material is a good conductor of electricity?',opts:['Wood','Plastic','Rubber','Copper'],ans:3,exp:'COPPER is an excellent CONDUCTOR — its outer electrons move freely, carrying electrical current. INSULATORS (wood, plastic, rubber) have electrons tightly bound and do not allow current to flow.'},
    {q:'An ammeter measures:',opts:['Voltage','Resistance','Current','Power'],ans:2,exp:'An AMMETER measures CURRENT (the flow of charge, in AMPERES). It is connected IN SERIES in a circuit. A VOLTMETER measures voltage/potential difference and is connected IN PARALLEL.'},
    {q:'What does Ohm\'s Law state?',opts:['V = I + R','V = I × R','I = V × R','R = V × I'],ans:1,exp:'OHM\'S LAW: V = I × R. Voltage (V) = Current (I) × Resistance (R). This means: more resistance = less current for the same voltage. Example: V = 12V, R = 4Ω → I = V/R = 12/4 = 3A.'},
    {q:'Why are household circuits wired in parallel and not in series?',opts:['Parallel circuits use less wire','Each appliance can be switched on/off independently','Parallel circuits are more dangerous','Series circuits are too expensive'],ans:1,exp:'PARALLEL wiring means each appliance gets the FULL mains voltage and can be switched independently. In series, all appliances share the voltage and one switch controls all — totally impractical for a home.'},
    {q:'What is the unit of electrical resistance?',opts:['Volt (V)','Ampere (A)','Ohm (Ω)','Watt (W)'],ans:2,exp:'The OHM (Ω) is the unit of RESISTANCE. 1 Ohm = 1 Volt per Ampere (V/A). Resistance is the opposition to current flow.'},
    {q:'In a parallel circuit, if one bulb is removed, what happens to the other bulbs?',opts:['They all go out','They get brighter','They continue to work normally','They get dimmer'],ans:2,exp:'In PARALLEL, each bulb has its own separate loop. If one is removed, the others still have a complete path to the battery, so they CONTINUE to work normally at the same brightness.'},
    {q:'Which of these materials is an electrical insulator?',opts:['Silver','Iron','Saltwater','Glass'],ans:3,exp:'GLASS is an INSULATOR. Silver, iron, and saltwater are conductors. Insulators do not allow electric current to flow through them; they are used to cover wires for safety.'},
    {q:'In a series circuit, adding more bulbs causes the bulbs to:',opts:['Get brighter','Stay the same','Get dimmer','Turn off completely'],ans:2,exp:'Adding more bulbs in SERIES increases the total resistance (R_total = R₁ + R₂ + ...). Since V = IR, more resistance means LESS current flows, so each bulb gets dimmer.'},
    {q:'The symbol for a battery in a circuit diagram is:',opts:['A single straight line','Two parallel lines (long and short)','A zigzag line','A circle with a cross'],ans:1,exp:'A BATTERY is shown as two parallel lines: the longer line is the POSITIVE terminal and the shorter line is the NEGATIVE terminal. Multiple pairs represent multiple cells.'},
    {q:'What is the function of a switch in a circuit?',opts:['To increase voltage','To open or close the circuit, controlling the flow of current','To measure current','To protect the circuit'],ans:1,exp:'A SWITCH controls the flow of current. When CLOSED, it completes the circuit and current flows. When OPEN, it breaks the circuit and current stops.'},
    {q:'Which component is used to measure the voltage across a bulb?',opts:['Ammeter','Fuse','Voltmeter','Switch'],ans:2,exp:'A VOLTMETER measures VOLTAGE (potential difference). It must be connected in PARALLEL across the component (like a bulb) to measure the voltage drop across it.'},
    {q:'If a 6V battery is connected to a 3Ω resistor, the current is:',opts:['18 A','2 A','0.5 A','9 A'],ans:1,exp:'Using Ohm\'s Law: I = V/R = 6V / 3Ω = 2 A. A current of 2 Amperes flows through the resistor.'},
    {q:'Why should you avoid plugging too many appliances into one socket?',opts:['It wastes electricity','It can cause too much current to flow, which may melt the wires or cause a fire','It is against the law','It slows down the electricity'],ans:1,exp:'Plugging too many appliances into one socket can OVERLOAD the circuit. The total current drawn by all appliances may be higher than the wires or fuse can safely handle, leading to overheating and fire.'},
    {q:'A voltmeter has very high resistance. Why?',opts:['To measure current','To draw very little current from the circuit so it does not affect the reading','To protect the battery','To make it cheaper'],ans:1,exp:'A voltmeter is connected IN PARALLEL. If it had low resistance, it would draw a lot of current and change the circuit behaviour. Its HIGH resistance ensures it draws negligible current and gives an accurate voltage reading.'},
    {q:'Which of these is an example of a good conductor?',opts:['Glass','Wood','Air','Silver'],ans:3,exp:'SILVER is an excellent conductor of electricity. Glass, wood, and air are insulators. Conductors have free electrons that can carry charge.'},
    {q:'What happens to the current in a circuit if the voltage is doubled and the resistance is kept constant?',opts:['It halves','It stays the same','It doubles','It quadruples'],ans:2,exp:'According to Ohm\'s Law (I = V/R), if V doubles and R is constant, the current I also DOUBLES. This is because voltage is the "push" that drives the current.'},
    {q:'In a circuit diagram, a straight line represents:',opts:['A battery','A bulb','A connecting wire','A switch'],ans:2,exp:'A straight line in a circuit diagram represents a CONNECTING WIRE. Wires are assumed to have zero resistance and act as the path for current to flow between components.'},
    {q:'Why do we use copper wires to connect appliances in a house?',opts:['Because it is the cheapest metal','Because copper is a good conductor of electricity and is ductile (can be drawn into thin wires)','Because it is a good insulator','Because it is magnetic'],ans:1,exp:'Copper is used because it is an excellent CONDUCTOR and is DUCTILE (can be stretched into thin wires). It allows current to flow with very little energy loss and is cost-effective.'},
    {q:'What is the total resistance of a series circuit with two resistors of 4Ω and 6Ω?',opts:['2Ω','10Ω','24Ω','12Ω'],ans:1,exp:'In a SERIES circuit, total resistance is the sum of the individual resistances: R_total = R₁ + R₂ = 4Ω + 6Ω = 10Ω.'},
  ],
  match:[
    {term:'Current (I)',def:'The rate of flow of electric charge; measured in Amperes (A) using an ammeter connected in series'},
    {term:'Voltage (V)',def:'The electrical "push" or potential difference; measured in Volts (V) using a voltmeter connected in parallel'},
    {term:'Resistance (R)',def:'The opposition to the flow of electric current; measured in Ohms (Ω); causes energy to be transferred as heat'},
    {term:'Series circuit',def:'A circuit where components are connected in a single continuous loop; the same current flows through all components'},
    {term:'Parallel circuit',def:'A circuit where components are connected in separate branches; each branch has the same voltage across it'},
    {term:'Fuse',def:'A safety device containing a thin wire that melts and breaks the circuit if the current exceeds a safe limit'},
    {term:'Ohm\'s Law',def:'The relationship between voltage, current, and resistance, expressed as V = I × R'},
    {term:'Conductor',def:'A material that allows electric current to flow easily because it has free electrons (e.g., copper, silver, aluminium)'},
    {term:'Insulator',def:'A material that does not allow electric current to flow because its electrons are tightly bound (e.g., rubber, plastic, wood)'},
    {term:'Ammeter',def:'A measuring device connected in series that measures the current flowing through a circuit'},
    {term:'Voltmeter',def:'A measuring device connected in parallel that measures the voltage across a component'},
    {term:'Switch',def:'A device that can open or close a circuit to stop or allow the flow of current'},
    {term:'Battery (cell)',def:'A source of electrical energy that provides the voltage (push) to drive current around a circuit'},
    {term:'Bulb (lamp)',def:'A component that converts electrical energy into light and heat energy'},
    {term:'Resistor',def:'A component designed to have a specific resistance, used to control the amount of current in a circuit'},
    {term:'Short circuit',def:'A low-resistance path that allows a dangerously high current to flow, often causing wires to overheat'},
    {term:'Circuit breaker',def:'A reusable safety device that automatically switches off the circuit if the current exceeds a safe level'},
    {term:'Open circuit',def:'A circuit that is broken or incomplete, preventing current from flowing'},
    {term:'Closed circuit',def:'A circuit that is complete and allows current to flow continuously'},
    {term:'Electric current',def:'The flow of electric charge (electrons) through a conductor; measured in Amperes (A)'},
  ],
  flashcards:[
    {q:'State three differences between series and parallel circuits.',a:'SERIES: Only one path for current to flow; same current everywhere; voltage is shared; one break stops the entire circuit; bulbs get dimmer as more are added. PARALLEL: Multiple paths for current to flow; voltage is the same across each branch; current splits across branches; one break does not affect others; bulbs stay bright as more are added.'},
    {q:'Calculate the current in a circuit with a 9V battery and a 3Ω resistor.',a:'Ohm\'s Law: I = V ÷ R = 9V ÷ 3Ω = 3 A. If resistance increases to 6Ω, the current becomes I = 9V ÷ 6Ω = 1.5 A (less current flows). If voltage increases to 18V, current becomes I = 18V ÷ 3Ω = 6 A.'},
    {q:'Why is a fuse an important safety feature in an electrical circuit?',a:'A FUSE contains a thin wire designed to MELT if the current exceeds a safe level. If too much current flows (due to a short circuit or overload), the fuse melts and BREAKS the circuit, stopping the current before the wires or appliances overheat and cause a FIRE.'},
    {q:'Name 5 electrical conductors and 5 electrical insulators.',a:'CONDUCTORS: copper, silver, aluminium, steel, graphite (carbon), saltwater. INSULATORS: rubber, plastic, glass, wood, pure water, ceramics. Conductors have FREE ELECTRONS that can carry charge; insulators have bound electrons that cannot move.'},
    {q:'Explain how a simple torch (flashlight) works in terms of a circuit.',a:'A battery provides the voltage (push). A switch controls the circuit. When the switch is CLOSED, a complete loop is made. Current flows from the battery, through the connecting wires, to the bulb, where electrical energy is converted into LIGHT and HEAT.'},
    {q:'Describe how you would connect an ammeter and a voltmeter in a circuit.',a:'An AMMETER is connected in SERIES with the component so that the current flows through it. A VOLTMETER is connected in PARALLEL across the component so it measures the potential difference between the two points.'},
    {q:'If you add more resistors in series, what happens to the total resistance?',a:'Adding resistors in SERIES increases the total resistance because the current must pass through each one. R_total = R₁ + R₂ + R₃ + ... This means less current will flow for the same voltage.'},
    {q:'What happens to the total resistance in a parallel circuit when you add more branches?',a:'Adding more branches in PARALLEL DECREASES the total resistance. This is because the total current has more paths to flow through. The total resistance is always LESS than the smallest branch resistor.'},
    {q:'Why are the wires in a house circuit made of copper but covered in plastic?',a:'The COPPER core is a good CONDUCTOR that allows current to flow. The PLASTIC covering is an INSULATOR that prevents the current from leaking or causing a short circuit, protecting people from electric shock.'},
    {q:'Explain why two bulbs in series are dimmer than a single bulb connected to the same battery.',a:'In series, the total resistance increases (R_total = R₁ + R₂). According to Ohm\'s Law, higher resistance means LESS current. Since brightness depends on current, the bulbs glow more dimly.'},
    {q:'A 12V battery is connected to a 4Ω resistor. Calculate the current.',a:'I = V ÷ R = 12V ÷ 4Ω = 3 A. The current through the resistor is 3 Amperes. This means 3 Coulombs of charge pass a point in the circuit every second.'},
    {q:'Why does a voltmeter have a very high resistance?',a:'A voltmeter must be connected in PARALLEL. If it had low resistance, it would draw a large amount of current from the circuit, which would affect the circuit and give an inaccurate reading. High resistance ensures it draws negligible current.'},
    {q:'What is the function of a switch in a household circuit?',a:'A switch is used to OPEN or CLOSE the circuit. When closed, it completes the path for current to flow, turning the appliance ON. When open, it breaks the path, stopping current and turning the appliance OFF.'},
    {q:'Explain how Ohm\'s Law is used to calculate the resistance of a resistor.',a:'Ohm\'s Law (V = IR) can be rearranged to R = V ÷ I. If you measure the voltage across a resistor with a voltmeter and the current through it with an ammeter, you can calculate its resistance.'},
    {q:'Why do we use parallel wiring in our homes instead of series wiring?',a:'Parallel wiring allows each appliance to receive the FULL mains voltage (240V) and be switched ON or OFF INDEPENDENTLY. In series, all appliances would depend on the same circuit and share the voltage, making them dim or inefficient.'},
    {q:'What is the difference between an open circuit and a closed circuit?',a:'An OPEN circuit is a broken loop where current CANNOT flow. A CLOSED circuit is a complete, unbroken loop that ALLOWS current to flow continuously from the battery through the components and back.'},
    {q:'A circuit has a voltage of 6V and a current of 2A. What is the resistance?',a:'Resistance (R) = V ÷ I = 6V ÷ 2A = 3Ω. The resistor has a resistance of 3 Ohms.'},
    {q:'Explain why the fuse rating must be slightly higher than the normal operating current of an appliance.',a:'The fuse must allow the normal operating current to flow without melting. If the rating is too low, it will melt even during normal use. If it is too high, it may not melt in time during a fault and could fail to protect the appliance.'},
    {q:'What is a short circuit and why is it dangerous?',a:'A SHORT CIRCUIT occurs when a low-resistance path (often a damaged wire) allows current to bypass the intended load. This causes a SURGE of dangerously high current, which can overheat wires, damage components, and start a fire.'},
    {q:'Why are circuit breakers preferred over fuses in modern homes?',a:'CIRCUIT BREAKERS can be RESET and reused after they trip. Fuses must be replaced each time they melt. Circuit breakers are also more sensitive and can detect smaller faults more reliably.'},
  ],
  blanks:{
    passage:'Electric current is the flow of charge and is measured in Amperes using an ammeter. Voltage is the "push" that drives the current and is measured in Volts. Ohm\'s Law describes the relationship: V = I × [_]. In a series circuit, all components share the same current; if one breaks, the entire circuit stops. In a parallel circuit, components are in separate branches and can be operated independently. A safety device that contains a thin wire which melts if the current becomes too high is called a [_].',
    answers:['R','fuse'],
    wordbank:['R','fuse','series','parallel','voltage','current','conductor','insulator'],
  },
  sentences:[
    {prompt:'Explain why homes and commercial buildings are wired in parallel rather than in series.',keywords:['independent','voltage','switched','same voltage','one branch','all appliances','off','switch'],hint:'What would happen if all appliances in a house were connected in one single series loop? What practical advantages does a parallel arrangement give to household wiring?'},
    {prompt:'A simple circuit contains a 6V battery and a bulb with a resistance of 2Ω. Calculate the current flowing through the bulb. Then, predict what would happen if you added a second identical bulb in series with the first.',keywords:['I = V/R','3A','series','total resistance','current decreases','dimmer','Ohm\'s Law'],hint:'First use Ohm\'s Law to calculate the current for one bulb. Then, think about how total resistance changes when you add a second resistor in series, and how that affects the current.'},
    {prompt:'Explain why copper wire is used as the inner core of an electrical cable, while the outer covering is made of plastic.',keywords:['conductor','insulator','current','copper','plastic','safe','shock','free electrons'],hint:'What is the role of the copper core inside the cable? What is the role of the plastic covering on the outside? Why are both materials essential for safety and function?'},
    {prompt:'A student connects two identical bulbs in parallel to a 6V battery. What happens to the brightness of the bulbs compared to a single bulb on the same battery?',keywords:['parallel','brightness','voltage','same','series','current','split','full voltage'],hint:'In a parallel circuit, what is the voltage across each branch? Does the current flowing through each bulb change?'},
    {prompt:'Describe the difference between a conductor and an insulator. Give two examples of each.',keywords:['conductor','free electrons','copper','silver','insulator','bound electrons','plastic','rubber','wood'],hint:'What allows a conductor to carry current? What prevents an insulator from carrying current?'},
    {prompt:'Why is it dangerous to overload a socket by plugging in too many appliances using a multi-plug adapter?',keywords:['overload','current','fire','heat','wire','fuse','socket','safe','power'],hint:'What happens to the total current drawn from a socket when you plug in many appliances? What happens to the wires if the current exceeds their safe limit?'},
    {prompt:'Use Ohm\'s Law to calculate the resistance of a kettle that draws 10A from a 230V mains supply.',keywords:['R=V/I','230V','10A','23Ω','Ohm\'s Law','resistance','appliance'],hint:'Rearrange Ohm\'s Law (V = I × R) to solve for R. Then plug in the given values.'},
    {prompt:'Explain the difference between the function of an ammeter and a voltmeter in a circuit.',keywords:['ammeter','series','current','voltmeter','parallel','voltage','measure','device'],hint:'What does each instrument measure? How should each be connected in the circuit?'},
    {prompt:'A student has three identical bulbs. Draw and describe a series circuit and a parallel circuit using these bulbs.',keywords:['series','parallel','bulb','diagram','circuit','current','voltage','branch','loop'],hint:'How are the bulbs connected in each type of circuit? What happens to the voltage and current in each arrangement?'},
    {prompt:'Explain how Ohm\'s Law applies to a circuit with a fixed resistor.',keywords:['Ohm\'s Law','V=IR','resistor','voltage','current','directly proportional','constant resistance','relationship'],hint:'If the voltage across a fixed resistor is doubled, what happens to the current? What does this tell you about the relationship between V and I?'},
    {prompt:'Why do manufacturers recommend using a fuse with a rating slightly higher than the normal current of an appliance?',keywords:['fuse','rating','current','melting','normal operation','safe','trip','protection'],hint:'What would happen if the fuse rating were too low? What would happen if it were too high?'},
    {prompt:'A circuit has three 2Ω resistors connected in series to a 12V battery. Calculate the total resistance and the current.',keywords:['series','total resistance','R₁+R₂+R₃','6Ω','I=V/R','2A','calculation'],hint:'First, add the resistances to find the total. Then, use Ohm\'s Law to find the current.'},
    {prompt:'Compare a series circuit and a parallel circuit in terms of how adding more bulbs affects the circuit.',keywords:['series','dimmer','parallel','brightness','current','voltage','branches','resistance'],hint:'What happens to the brightness of existing bulbs when you add a new bulb in series? What happens in parallel?'},
    {prompt:'Why are metals generally good conductors of electricity?',keywords:['metal','free electrons','conduct','current','structure','atomic','charge','flow'],hint:'What is different about the structure of a metal compared to an insulator like rubber?'},
    {prompt:'What does a circuit breaker do and why is it better than a fuse?',keywords:['circuit breaker','fuse','reset','reusable','trips','safety','current','protection'],hint:'Can a circuit breaker be used more than once? What happens to a fuse after it protects the circuit?'},
    {prompt:'Explain how you would connect a voltmeter to measure the voltage across a light bulb in a simple circuit.',keywords:['voltmeter','parallel','bulb','voltage','connect','circuit','across','terminals'],hint:'Which two points in the circuit would you connect the voltmeter to? How would you connect it relative to the bulb?'},
    {prompt:'Explain what happens to the resistance of a circuit when you add a resistor in parallel.',keywords:['parallel','resistance','decreases','more paths','current','branches','less','than smallest'],hint:'Adding a branch in parallel gives the current more paths to flow through. How does this affect the overall resistance?'},
    {prompt:'Why is saltwater able to conduct electricity, while pure water cannot?',keywords:['saltwater','ions','charge','conduct','pure water','insulator','dissolved','electrolyte'],hint:'What is dissolved in saltwater that is not present in pure water? How do these particles allow charge to flow?'},
    {prompt:'A student touches the metal prongs of a plug that is connected to a 240V supply. Explain why this is extremely dangerous.',keywords:['live wire','voltage','240V','shock','current','body','earth','fatal','heart'],hint:'What voltage is present on the metal prongs? What happens when a person touches a live voltage source with their hand?'},
    {prompt:'Draw a simple circuit diagram for a torch with a battery, a switch, and a bulb.',keywords:['circuit diagram','battery','switch','bulb','symbols','closed loop','current','components'],hint:'What symbols are used for each component? How should they be connected to form a complete circuit?'},
  ],
});
</script></body></html>
