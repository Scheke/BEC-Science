<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrition &amp; Balanced Diet — BEC Animations</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#f0f7f0;font-family:'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:0 0 40px}
    .topbar{width:100%;background:#1b5e20;padding:10px 20px;display:flex;align-items:center;gap:16px}
    .topbar .logo{color:#fff;font-weight:800;font-size:1.1rem}
    .topbar a{color:#a5d6a7;text-decoration:none;font-size:.85rem}
    .topic-header{width:100%;background:#e65100;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px}
    .topic-header .label{background:#ffcc80;color:#bf360c;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px}
    .topic-header h1{font-size:1.25rem;font-weight:700}
    #sketch{margin-top:0;width:100%;border-radius:10px;overflow:hidden;box-shadow:0 2px 20px rgba(0,0,0,.14);border:2px solid #ffe0b2}

    .controls{display:flex;justify-content:center;gap:10px;margin-top:10px}
    .btn{padding:7px 22px;border:none;border-radius:7px;font-size:.88rem;font-weight:700;cursor:pointer;transition:background .15s}
    .btn.anim{background:#e65100;color:#fff}.btn.anim:hover{background:#bf360c}
    .btn.practice{background:#f9a825;color:#fff}.btn.practice:hover{background:#f57f17}
    /* ── Mobile responsive ── */
    #sketch-wrap{width:100%;max-width:100vw;overflow:hidden;display:flex;justify-content:center;margin-top:14px}
    #sketch-wrap canvas{max-width:100%!important;height:auto!important;display:block}
    @media(max-width:900px){
      #sketch-wrap{transform-origin:top center}
      body{padding:0 0 20px}
    }
    
    @media(orientation:landscape)and(max-height:500px){
      body{flex-direction:row;flex-wrap:wrap;align-items:flex-start;height:100vh;overflow:hidden;padding:0}
      .topbar{width:100%}
      .topic-header{width:100%}
      #sketch-wrap{flex:1;margin:0;height:calc(100vh - 90px)}
      #sketch-wrap canvas{width:100%!important;height:100%!important;object-fit:contain}
      #controls{flex-direction:column;width:140px;height:calc(100vh - 90px);margin:0;padding:12px 8px;gap:8px;justify-content:center;border-left:1px solid #ddd;background:#fff}
      .btn{width:100%;padding:10px 8px;font-size:.78rem;text-align:center}
      #step-lbl{width:100%;font-size:.72rem;padding:6px 8px;text-align:center}
    }
    
    
    }
    
    }    /* ── Auto-rotate for small phones in portrait ── */
    @media(max-width:560px)and(orientation:portrait){
      html,body{overflow:hidden}
      body{
        position:fixed;
        width:100vh;
        height:100vw;
        top:calc(50% - 50vw);
        left:calc(50% - 50vh);
        transform:rotate(90deg);
        transform-origin:center;
        overflow:hidden;
      }
    }  </style>
</head>
<body>
<h2>Rotate Your Device</h2><p>Turn your phone sideways for the best animation experience.</p></div>
<div class="topbar"><span class="logo">BEC Animations</span><a href="../../index.html#primary/Standard%205">&#8592; Standard 5</a></div>
<div class="topic-header"><span class="label">PSLE · Standard 5 Science</span><h1>Nutrition &amp; Balanced Diet</h1></div>
<div id="sketch-wrap"><div id="sketch"></div></div>
<div class="controls">
  <button class="btn practice mode-btn" onclick="setMode(gameMode===1?0:1)" id="btnMode" title="Fill the Plate" aria-label="Fill the Plate"><span id="btnModeIcon">&#127918;</span> <span class="mode-lbl" id="btnModeLbl">Fill the Plate</span></button>
</div>
<script>
let gameMode=0;
function setMode(m){
  gameMode=m;
  document.getElementById('btnModeIcon').innerHTML=m===1?'&#9654;':'&#127918;';
  document.getElementById('btnModeLbl').textContent=m===1?'Back to Animation':'Fill the Plate';
  if(m===1) resetPlateGame();
}
const PLATE_FOODS=[
  {name:'Rice',emoji:'🍚',cat:'carbs'},{name:'Bread',emoji:'🍞',cat:'carbs'},
  {name:'Maize porridge',emoji:'🌽',cat:'carbs'},{name:'Egg',emoji:'🥚',cat:'protein'},
  {name:'Chicken',emoji:'🍗',cat:'protein'},{name:'Beans',emoji:'🫘',cat:'protein'},
  {name:'Spinach',emoji:'🥬',cat:'veg'},{name:'Orange',emoji:'🍊',cat:'veg'},
  {name:'Mango',emoji:'🥭',cat:'veg'},{name:'Milk',emoji:'🥛',cat:'dairy'},
  {name:'Cheese',emoji:'🧀',cat:'dairy'},{name:'Butter',emoji:'🧈',cat:'fats'},
];
let pfIdx,pfOrder,pfScore,pfCorrect,pfWrongCat,pfDone;
function resetPlateGame(){ pfOrder=[...Array(PLATE_FOODS.length)].map((_,i)=>i).sort(()=>Math.random()-0.5).slice(0,10); pfIdx=0; pfScore=0; pfCorrect=false; pfWrongCat=null; pfDone=false; }
const NUTRIENTS=[
  {id:'carbs',name:'Carbohydrates',icon:'🍞',col:[255,193,7],angle:-Math.PI/2,span:Math.PI*0.7,
   func:'Provides ENERGY for daily activities.\nMain fuel source for the body and brain.',
   food:'Rice, bread, maize, pasta, potatoes, cassava',
   defic:'Lack of energy, tiredness, difficulty concentrating',
   portion:'33%'},
  {id:'veg',name:'Fruits & Vegetables',icon:'🥦',col:[56,142,60],angle:-Math.PI/2+Math.PI*0.7,span:Math.PI*0.55,
   func:'Provides VITAMINS and MINERALS for\nbody processes and protection from disease.',
   food:'Spinach, tomatoes, oranges, mangoes, bananas',
   defic:'Scurvy (Vit C), night blindness (Vit A), anaemia (iron)',
   portion:'28%'},
  {id:'protein',name:'Proteins',icon:'🥚',col:[239,108,0],angle:-Math.PI/2+Math.PI*1.25,span:Math.PI*0.45,
   func:'BUILDS and REPAIRS body tissues.\nMakes enzymes, hormones and antibodies.',
   food:'Meat, fish, eggs, beans, lentils, milk, nuts',
   defic:'Kwashiorkor (protein deficiency in children)',
   portion:'22%'},
  {id:'dairy',name:'Dairy & Calcium',icon:'🥛',col:[100,181,246],angle:-Math.PI/2+Math.PI*1.7,span:Math.PI*0.3,
   func:'STRENGTHENS bones and teeth.\nCalcium needed for muscle contractions.',
   food:'Milk, cheese, yoghurt, fortified soya milk',
   defic:'Rickets (weak bones), osteoporosis, tooth decay',
   portion:'12%'},
  {id:'fats',name:'Fats & Oils',icon:'🫒',col:[251,140,0],angle:-Math.PI/2+Math.PI*2.0,span:Math.PI*0.2,
   func:'Stores energy, insulates body, protects organs.\nNeeded for fat-soluble vitamins A, D, E, K.',
   food:'Olive oil, avocado, nuts, butter (small amounts)',
   defic:'Deficiency of fat-soluble vitamins, poor temperature regulation',
   portion:'5%'},
];
let sel=0;
new p5(sk=>{
  const W=880,H=510;
  let tick=0;
  const hitTargets=[];

  sk.setup=()=>{sk.createCanvas(W,H).parent('sketch');sk.textFont('Arial');};

  sk.draw=()=>{
    tick+=0.04;
    if(gameMode===1){ drawPlateGame(); return; }
    hitTargets.length=0;
    sk.background(248,252,248);
    drawPlate();
    drawInfoPanel();
    drawWaterFibre();
  };


  function drawPlate(){
    let px=248,py=256,pr=190;
    // Plate shadow
    sk.fill(200,200,200,80);sk.noStroke();sk.ellipse(px+6,py+8,pr*2+30,pr*2+30);
    // White plate
    sk.fill(255,255,255,220);sk.stroke(220);sk.strokeWeight(2);sk.ellipse(px,py,pr*2+22,pr*2+22);
    // Plate rim
    sk.fill(245,245,245,180);sk.stroke(200);sk.strokeWeight(10);sk.noFill();
    sk.ellipse(px,py,pr*2+18,pr*2+18);

    // Sectors
    NUTRIENTS.forEach((n,i)=>{
      let active=sel===i;
      let r=active?pr+10:pr;
      sk.fill(n.col[0],n.col[1],n.col[2],active?230:160);
      sk.stroke(255);sk.strokeWeight(active?3:2);
      sk.arc(px,py,r*2,r*2,n.angle,n.angle+n.span,sk.PIE);

      // Icon and label on sector
      let midA=n.angle+n.span/2;
      let lr=pr*0.6+(active?10:0);
      let lx=px+Math.cos(midA)*lr,ly=py+Math.sin(midA)*lr;
      sk.textSize(22);sk.textAlign(sk.CENTER);sk.noStroke();
      sk.text(n.icon,lx,ly+4);
      sk.fill(30,30,30,active?240:180);sk.textSize(active?9.5:8.5);sk.textStyle(active?sk.BOLD:sk.NORMAL);
      sk.text(n.name,lx,ly+20);sk.textStyle(sk.NORMAL);
      sk.fill(active?30:80);sk.textSize(9);
      sk.text(n.portion,lx,ly+32);
    });

    // Center circle (water)
    sk.fill(227,242,253,220);sk.stroke(100,181,246);sk.strokeWeight(2);
    sk.ellipse(px,py,70,70);
    sk.noStroke();sk.fill(30,100,200);sk.textSize(20);sk.textAlign(sk.CENTER);
    sk.text('💧',px,py+6);
    sk.textSize(8.5);sk.text('Water',px,py+20);

    // Pulse on selected
    let pulse=Math.sin(tick*3)*5;
    let n=NUTRIENTS[sel];
    let midA=n.angle+n.span/2;
    let lx=px+Math.cos(midA)*(pr+12),ly=py+Math.sin(midA)*(pr+12);
    sk.fill(n.col[0],n.col[1],n.col[2],100+pulse*10);sk.noStroke();
    sk.ellipse(lx,ly,18+pulse,18+pulse);

    // Legend buttons on left
    NUTRIENTS.forEach((n,i)=>{
      let bx=10,by=16+i*54;
      let active=sel===i;
      sk.fill(n.col[0],n.col[1],n.col[2],active?220:80);
      sk.stroke(n.col[0],n.col[1],n.col[2]);sk.strokeWeight(active?2:1);
      sk.rect(bx,by,100,46,7);
      sk.noStroke();sk.fill(active?255:30);sk.textSize(active?10:9);sk.textStyle(active?sk.BOLD:sk.NORMAL);
      sk.textAlign(sk.LEFT);sk.text(n.icon+' '+n.name,bx+6,by+18);sk.textStyle(sk.NORMAL);
      sk.fill(active?220:80);sk.textSize(8.5);sk.text(n.portion+' of diet',bx+6,by+33);
      hitTargets.push({i,x:bx,y:by,w:100,h:46});
    });
    // Water + Fibre buttons
    let bx=10,by=16+5*54;
    sk.fill(100,181,246,120);sk.stroke(100,181,246);sk.strokeWeight(1);
    sk.rect(bx,by,100,36,7);sk.noStroke();
    sk.fill(30);sk.textSize(9.5);sk.textAlign(sk.LEFT);
    sk.text('💧 Water + Fibre',bx+6,by+22);
  }

  function drawWaterFibre(){
    // Show at bottom-left
    let bx=10,by=410;
    sk.fill(240,248,255,200);sk.stroke(100,150,220);sk.strokeWeight(1.2);
    sk.rect(bx,by,110,90,7);sk.noStroke();
    sk.fill(30,80,180);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);
    sk.text('💧 Water',bx+6,by+16);sk.textStyle(sk.NORMAL);
    sk.fill(30);sk.textSize(9);
    sk.text('6–8 glasses/day',bx+6,by+29);
    sk.text('Keeps you hydrated',bx+6,by+41);
    sk.textStyle(sk.BOLD);sk.fill(100,150,30);sk.text('🌾 Fibre (roughage)',bx+6,by+58);
    sk.textStyle(sk.NORMAL);sk.fill(30);sk.text('Aids digestion',bx+6,by+71);
    sk.text('Prevents constipation',bx+6,by+83);
  }

  function drawInfoPanel(){
    let n=NUTRIENTS[sel];
    let px=498,py=8,pw=374,ph=494;
    sk.fill(255,255,255,240);sk.stroke(n.col[0],n.col[1],n.col[2]);sk.strokeWeight(2.5);
    sk.rect(px,py,pw,ph,10);sk.noStroke();

    // Header
    sk.fill(n.col[0],n.col[1],n.col[2],210);sk.rect(px+8,py+8,pw-16,48,7);sk.noStroke();
    sk.textSize(28);sk.textAlign(sk.LEFT);sk.text(n.icon,px+16,py+44);
    sk.fill(255);sk.textSize(14);sk.textStyle(sk.BOLD);
    sk.text(n.name,px+52,py+32);
    sk.textStyle(sk.NORMAL);sk.textSize(11);sk.text('Makes up '+n.portion+' of a balanced plate',px+52,py+48);

    let sy=py+68;
    const boxes=[
      {title:'FUNCTION IN THE BODY',body:n.func,bg:[240,248,255],bc:[0,60,160]},
      {title:'FOOD SOURCES',body:n.food,bg:[240,255,240],bc:[0,100,30]},
      {title:'DEFICIENCY EFFECTS',body:n.defic,bg:[255,245,235],bc:[180,60,0]},
    ];
    boxes.forEach(b=>{
      let lines=b.body.split('\n'),bh=16+lines.length*15+10;
      sk.fill(b.bg[0],b.bg[1],b.bg[2],200);sk.stroke(b.bc[0],b.bc[1],b.bc[2],80);sk.strokeWeight(1);
      sk.rect(px+10,sy,pw-20,bh,6);sk.noStroke();
      sk.fill(b.bc[0],b.bc[1],b.bc[2]);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);
      sk.text(b.title,px+16,sy+13);sk.textStyle(sk.NORMAL);
      sk.fill(30);sk.textSize(10.5);
      lines.forEach((l,i)=>sk.text(l,px+16,sy+27+i*15));
      sy+=bh+8;
    });

    // Nutrient classification
    sy+=4;
    sk.fill(252,248,255,200);sk.stroke(120,60,180,80);sk.strokeWeight(1);
    sk.rect(px+10,sy,pw-20,130,6);sk.noStroke();
    sk.fill(80,20,140);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);
    sk.text('NUTRIENT CLASSIFICATION:',px+16,sy+14);sk.textStyle(sk.NORMAL);
    const classes=[
      ['Macronutrients','Carbohydrates, Proteins, Fats\n(needed in large amounts, provide energy)'],
      ['Micronutrients','Vitamins and Minerals\n(needed in small amounts, no energy provided)'],
      ['Water + Fibre','Not nutrients but essential\nfor health and digestion'],
    ];
    classes.forEach((c,i)=>{
      sk.fill(120,60,180,i===0?220:i===1?180:140);sk.noStroke();sk.ellipse(px+20,sy+32+i*34,9);
      sk.fill(60,20,100);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.text(c[0]+':',px+28,sy+36+i*34);
      sk.textStyle(sk.NORMAL);sk.fill(30);sk.textSize(9);
      c[1].split('\n').forEach((l,li)=>sk.text(l,px+28,sy+48+i*34+li*12));
    });

    // Fun fact
    let ffy=sy+138;
    sk.fill(255,253,231,220);sk.stroke(255,213,79);sk.strokeWeight(1.5);
    sk.rect(px+10,ffy,pw-20,ph-(ffy-py)-14,6);sk.noStroke();
    sk.fill(130,100,0);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);
    sk.text('💡 Did you know?',px+16,ffy+14);sk.textStyle(sk.NORMAL);
    sk.fill(60);sk.textSize(10);
    sk.text('A balanced diet contains the right AMOUNTS of',px+16,ffy+30);
    sk.text('each nutrient — not just the right types! Too much',px+16,ffy+44);
    sk.text('fat or sugar is also unhealthy (obesity, diabetes).',px+16,ffy+58);
  }
  function drawPlateGame(){
    sk.background(255,248,235);
    if(pfDone){
      sk.fill(27,94,32); sk.noStroke(); sk.textSize(22); sk.textStyle(sk.BOLD); sk.textAlign(sk.CENTER,sk.CENTER);
      sk.text('Game Complete!',440,160);
      sk.fill(100); sk.textSize(15); sk.textStyle(sk.NORMAL);
      sk.text('You scored '+pfScore+'/'+pfOrder.length,440,200);
      let msg=pfScore===pfOrder.length?'Perfect! You know your food groups!':pfScore>=7?'Great job! Almost there!':'Keep practising — review the plate chart!';
      sk.text(msg,440,232);
      sk.fill(249,168,37); sk.rect(320,264,240,44,10); sk.fill(255); sk.textSize(14); sk.textStyle(sk.BOLD); sk.text('↺ Play Again',440,286+4);
      return;
    }
    let food=PLATE_FOODS[pfOrder[pfIdx]];
    // Progress bar
    sk.fill(220); sk.noStroke(); sk.rect(30,14,820,10,5);
    sk.fill(249,168,37); sk.rect(30,14,820*(pfIdx/pfOrder.length),10,5);
    sk.fill(80); sk.textSize(10); sk.textStyle(sk.NORMAL); sk.textAlign(sk.LEFT,sk.TOP); sk.text('Question '+(pfIdx+1)+' of '+pfOrder.length,30,28);
    // Food card
    sk.fill(255,255,255); sk.stroke(220); sk.strokeWeight(2); sk.rect(300,50,280,180,14);
    sk.textSize(70); sk.textAlign(sk.CENTER,sk.CENTER); sk.noStroke(); sk.text(food.emoji,440,130);
    sk.fill(30); sk.textSize(16); sk.textStyle(sk.BOLD); sk.textAlign(sk.CENTER,sk.BASELINE); sk.text(food.name,440,222);
    sk.fill(100); sk.textSize(12); sk.textStyle(sk.NORMAL); sk.text('Which nutrient group does this belong to?',440,248);
    // Category buttons
    let btnW=155,btnH=50,gap=8,startX=(880-5*btnW-4*gap)/2;
    NUTRIENTS.forEach((n,i)=>{
      let bx=startX+i*(btnW+gap),by=268;
      let isWrong=pfWrongCat===n.id;
      sk.fill(isWrong?[255,180,180]:pfCorrect&&n.id===food.cat?[180,255,180]:[n.col[0],n.col[1],n.col[2],200]);
      sk.stroke(n.col[0],n.col[1],n.col[2]); sk.strokeWeight(2);
      sk.rect(bx,by,btnW,btnH,8);
      sk.noStroke(); sk.fill(255); sk.textSize(10); sk.textStyle(sk.BOLD); sk.textAlign(sk.CENTER,sk.CENTER);
      sk.text(n.icon+' '+n.name,bx+btnW/2,by+btnH/2);
    });
    // Feedback
    if(pfCorrect){
      sk.fill(0,150,0); sk.textSize(14); sk.textStyle(sk.BOLD); sk.textAlign(sk.CENTER,sk.BASELINE); sk.noStroke();
      sk.text('✓ Correct! Tap anywhere to continue.',440,350);
      sk.fill(60); sk.textSize(11); sk.textStyle(sk.NORMAL);
      let n=NUTRIENTS.find(n=>n.id===food.cat);
      sk.text(food.name+' is a '+n.name+' food. '+n.func.split('\n')[0],440,370,820,40);
    } else if(pfWrongCat){
      sk.fill(200,0,0); sk.textSize(14); sk.textStyle(sk.BOLD); sk.textAlign(sk.CENTER,sk.BASELINE); sk.noStroke();
      sk.text('✗ Not quite — tap the correct group!',440,350);
    } else {
      sk.fill(150); sk.textSize(11); sk.textStyle(sk.NORMAL); sk.textAlign(sk.CENTER,sk.BASELINE); sk.noStroke();
      sk.text('Score: '+pfScore,440,350);
    }
  }

  sk.mouseClicked=function(){
    if(gameMode===1){
      if(pfDone){ if(sk.mouseX>320&&sk.mouseX<560&&sk.mouseY>264&&sk.mouseY<308) resetPlateGame(); return; }
      if(pfCorrect){ pfCorrect=false; pfWrongCat=null; pfIdx++; if(pfIdx>=pfOrder.length) pfDone=true; return; }
      let food=PLATE_FOODS[pfOrder[pfIdx]];
      let btnW=155,btnH=50,gap=8,startX=(880-5*btnW-4*gap)/2;
      NUTRIENTS.forEach((n,i)=>{
        let bx=startX+i*(btnW+gap),by=268;
        if(sk.mouseX>bx&&sk.mouseX<bx+btnW&&sk.mouseY>by&&sk.mouseY<by+btnH){
          if(n.id===food.cat){ pfCorrect=true; pfWrongCat=null; pfScore++; }
          else { pfWrongCat=n.id; }
        }
      });
      return;
    }
    // Original animation click handler
    let px=248,py=256,pr=190;
    let dx=sk.mouseX-px,dy=sk.mouseY-py;
    if(Math.sqrt(dx*dx+dy*dy)<pr){
      let a=Math.atan2(dy,dx);
      for(let i=0;i<NUTRIENTS.length;i++){
        let n=NUTRIENTS[i];
        let normA=(a+Math.PI*3)%(Math.PI*2);
        let normS=(n.angle+Math.PI*3)%(Math.PI*2);
        let normE=normS+n.span;
        if(normA>=normS&&normA<=normE){sel=i;break;}
      }
    }
    for(let h of hitTargets){
      if(sk.mouseX>h.x&&sk.mouseX<h.x+h.w&&sk.mouseY>h.y&&sk.mouseY<h.y+h.h){sel=h.i;break;}
    }
  };
});
</script>


<script src="../mobile-anim.js"></script>
</body>
