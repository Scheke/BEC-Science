<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Human Body Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Human Body Systems — Std 6 Science Quiz',
  color:'#880e4f',dark:'#560027',light:'#fce4ec',
   mcq:[
    {q:'The digestive system breaks down food into:',opts:['Large molecules','Small soluble molecules that can be absorbed','Carbon dioxide and water','Amino acids only'],ans:1,exp:'Digestion breaks food into SMALL SOLUBLE MOLECULES that can be ABSORBED through the intestine wall into the blood. e.g. starch → glucose; protein → amino acids; fat → fatty acids and glycerol.'},
    {q:'The main function of the lungs is to:',opts:['Pump blood around the body','Exchange oxygen and carbon dioxide between air and blood','Digest food','Produce urine'],ans:1,exp:'The LUNGS exchange gases — O₂ moves from air INTO the blood; CO₂ moves from blood INTO the air to be breathed out. This happens at the ALVEOLI (tiny air sacs with thin walls and many blood vessels).'},
    {q:'Which organ filters blood and produces urine?',opts:['Liver','Heart','Kidney','Stomach'],ans:2,exp:'The KIDNEYS filter blood to remove waste products (especially UREA from protein breakdown) and excess water. These form URINE, which is stored in the bladder before being removed.'},
    {q:'The skeleton has how many main functions?',opts:['1','2','4','8'],ans:2,exp:'The skeleton has 4 main functions: 1. SUPPORT (keeps body upright). 2. PROTECTION (skull protects brain; ribs protect heart/lungs). 3. MOVEMENT (bones with muscles and joints). 4. BLOOD CELL PRODUCTION (in red bone marrow).'},
    {q:'Which part of the brain controls breathing and heart rate automatically?',opts:['Cerebrum','Cerebellum','Medulla oblongata','Spinal cord'],ans:2,exp:'The MEDULLA OBLONGATA controls AUTOMATIC (involuntary) functions like breathing, heart rate, blood pressure, and swallowing. You cannot consciously stop your heart or breathing for long.'},
    {q:'The function of the large intestine is to:',opts:['Digest proteins','Absorb water and form faeces','Produce bile','Absorb glucose'],ans:1,exp:'The LARGE INTESTINE (colon) absorbs WATER from undigested food matter. The remaining solid waste (faeces) is stored in the rectum and expelled through the anus.'},
    {q:'Which organ produces bile, a substance that helps digest fats?',opts:['Gallbladder','Pancreas','Liver','Stomach'],ans:2,exp:'BILE is produced by the LIVER. It is stored in the gallbladder and released into the small intestine, where it emulsifies fats (breaks them into tiny droplets) so lipase can digest them faster.'},
    {q:'The tiny air sacs in the lungs where gas exchange occurs are called:',opts:['Bronchi','Alveoli','Trachea','Diaphragm'],ans:1,exp:'ALVEOLI are microscopic air sacs where O₂ diffuses into the blood and CO₂ diffuses out of the blood. They are extremely thin-walled and surrounded by capillaries for efficient gas exchange.'},
    {q:'What is the main function of the circulatory system?',opts:['To produce energy','To transport oxygen, nutrients, and waste products around the body','To filter blood','To break down food'],ans:1,exp:'The CIRCULATORY system transports OXYGEN (from lungs) and NUTRIENTS (from gut) to all cells. It also removes waste products (CO₂, urea) to the lungs/kidneys for excretion.'},
    {q:'The part of the skeleton that protects the spinal cord is:',opts:['Skull','Ribcage','Vertebral column (spine)','Pelvis'],ans:2,exp:'The VERTEBRAL COLUMN (backbone) protects the delicate SPINAL CORD, which carries nerve impulses between the brain and the rest of the body.'},
    {q:'Which blood vessels carry deoxygenated blood back to the heart?',opts:['Arteries','Veins','Capillaries','Arterioles'],ans:1,exp:'VEINS carry deoxygenated blood back TO the heart. They have valves to prevent backflow because they carry blood at low pressure. Arteries carry blood AWAY from the heart.'},
    {q:'The stomach produces hydrochloric acid (HCl) to:',opts:['Digest fats','Kill bacteria in food and activate the enzyme pepsin','Absorb nutrients','Make food taste better'],ans:1,exp:'HCl in the stomach KILLS bacteria that may have been swallowed. It also provides the ACIDIC pH (around pH 2) needed for the protease enzyme PEPSIN to work effectively on proteins.'},
    {q:'The diaphragm is involved in breathing. When you inhale, it:',opts:['Contracts and flattens, increasing chest volume','Relaxes and moves upward, decreasing chest volume','Stays still','Moves to the side'],ans:0,exp:'During INHALATION, the DIAPHRAGM CONTRACTS and FLATTENS. This increases the volume of the chest cavity, lowering pressure and drawing air into the lungs.'},
    {q:'What is the function of red blood cells?',opts:['Fight infections','Carry oxygen using haemoglobin','Clot blood','Produce antibodies'],ans:1,exp:'RED BLOOD CELLS contain HAEMOGLOBIN, which binds to oxygen in the lungs and transports it around the body to respiring tissues. They have no nucleus to maximise space for haemoglobin.'},
    {q:'Which of the following is NOT a function of the skeleton?',opts:['Support and shape','Protection of organs','Production of blood cells','Digesting food'],ans:3,exp:'Digestion is done by the DIGESTIVE SYSTEM. The skeleton does NOT digest food. It supports the body, protects organs, allows movement, and produces blood cells in bone marrow.'},
    {q:'The kidneys filter out urea. Urea is produced by the:',opts:['Liver from excess amino acids','Stomach from food','Pancreas from glucose','Lungs from oxygen'],ans:0,exp:'The LIVER breaks down excess AMINO ACIDS (from proteins) in a process called deamination, producing UREA. The kidneys then filter this urea out of the blood to form urine.'},
    {q:'What is the function of the placenta in human reproduction?',opts:['To produce eggs','To protect the foetus and allow exchange of substances between mother and baby','To provide milk for the baby','To store sperm'],ans:1,exp:'The PLACENTA is an organ that develops in the uterus. It allows OXYGEN and NUTRIENTS to pass from the mother to the foetus, and waste products (CO₂, urea) to pass from the foetus to the mother to be removed.'},
    {q:'The trachea (windpipe) is kept open by:',opts:['Muscles','C-shaped rings of cartilage','Bones','Ligaments'],ans:1,exp:'The TRACHEA is reinforced by C-shaped rings of CARTILAGE. These prevent the trachea from collapsing when you breathe in, ensuring a clear airway to the lungs.'},
    {q:'A reflex action, such as pulling your hand away from a hot object, is controlled by:',opts:['The brain','The spinal cord only','Muscles','The eyes'],ans:1,exp:'A REFLEX is a rapid, automatic response. It involves the SPINAL CORD (relay neuron) bypassing the brain for speed. This reduces response time and prevents injury.'},
    {q:'Which organ system is responsible for removing waste products from the body?',opts:['Circulatory system','Excretory system','Nervous system','Skeletal system'],ans:1,exp:'The EXCRETORY system (kidneys, lungs, skin) removes metabolic wastes. The kidneys remove urea and excess water (urine), lungs remove CO₂, and skin removes water and salts as sweat.'},
  ],
  match:[
    {term:'Digestive system',def:'Breaks food down into small, soluble molecules that can be absorbed into the bloodstream'},
    {term:'Respiratory system',def:'Supplies oxygen to the blood and removes carbon dioxide through gas exchange in the lungs'},
    {term:'Circulatory system',def:'Transports oxygen, nutrients, and waste products around the body using the heart and blood vessels'},
    {term:'Excretory system',def:'Removes metabolic waste products such as urea and excess water from the body (kidneys, lungs, skin)'},
    {term:'Nervous system',def:'Coordinates rapid responses to stimuli using electrical impulses transmitted through neurons'},
    {term:'Skeletal system',def:'Supports the body, protects internal organs, allows movement, and produces blood cells'},
    {term:'Small intestine',def:'The main organ for the absorption of digested food molecules into the blood; lined with villi'},
    {term:'Alveoli',def:'Tiny, thin-walled air sacs in the lungs where oxygen and carbon dioxide are exchanged with the blood'},
    {term:'Kidney',def:'The organ that filters the blood to remove urea and excess water, producing urine'},
    {term:'Liver',def:'Produces bile (for fat digestion), stores glycogen, and breaks down excess amino acids to form urea'},
    {term:'Stomach',def:'Produces hydrochloric acid and protease (pepsin) to begin the digestion of proteins'},
    {term:'Trachea',def:'The windpipe; a tube supported by cartilage rings that carries air from the nose/mouth to the lungs'},
    {term:'Diaphragm',def:'A sheet of muscle at the base of the chest that moves to change chest volume during breathing'},
    {term:'Red blood cell',def:'A cell containing haemoglobin that transports oxygen from the lungs to the body tissues'},
    {term:'Placenta',def:'The organ that allows the exchange of oxygen, nutrients, and wastes between a mother and her developing foetus'},
    {term:'Spinal cord',def:'A bundle of nerves running down the vertebral column; coordinates reflex actions and relays information'},
    {term:'Medulla oblongata',def:'The part of the brain that controls involuntary (automatic) functions like breathing and heart rate'},
    {term:'Bile',def:'A digestive fluid produced by the liver that emulsifies fats to increase the surface area for lipase action'},
    {term:'Urea',def:'A waste product formed by the liver from excess amino acids; removed by the kidneys in urine'},
    {term:'Cartilage',def:'A tough, flexible connective tissue found in joints, the trachea, and the ear'},
  ],
  flashcards:[
    {q:'State the path food takes through the digestive system from the mouth to the anus.',a:'Mouth → Oesophagus (peristalsis) → Stomach (acid and protease) → Small intestine (bile, enzymes, absorption via villi) → Large intestine (water absorption) → Rectum → Anus (egestion of faeces).'},
    {q:'How are alveoli structurally adapted for efficient gas exchange?',a:'ALVEOLI are adapted by: 1. Having a LARGE SURFACE AREA (millions of them). 2. Walls only ONE CELL THICK (short diffusion distance for gases). 3. A MOIST LINING (gases dissolve in the moisture). 4. A RICH BLOOD SUPPLY (capillaries maintain a concentration gradient). 5. Good VENTILATION (breathing brings fresh air).'},
    {q:'Name the three types of muscle in the human body and give a location for each.',a:'1. SKELETAL MUSCLE (voluntary) — attached to bones, allows conscious movement. 2. SMOOTH MUSCLE (involuntary) — found in the walls of the digestive tract and blood vessels. 3. CARDIAC MUSCLE (involuntary) — found only in the heart wall; it never tires.'},
    {q:'Explain how the kidneys help maintain water balance (osmoregulation) in the body.',a:'The kidneys filter blood and adjust how much water is reabsorbed. When dehydrated (hot weather) → ADH hormone is released → kidneys reabsorb MORE water → small amount of CONCENTRATED urine. When well-hydrated (cold weather) → less ADH → less reabsorption → large amount of DILUTE urine.'},
    {q:'What is peristalsis and where does it occur?',a:'PERISTALSIS is the wave-like contraction of circular and longitudinal MUSCLES in the walls of the oesophagus, stomach, and intestines. It pushes food/material along the digestive tract. It is an INVOLUNTARY (automatic) process.'},
    {q:'Explain how the respiratory and circulatory systems work together to deliver oxygen to body tissues.',a:'The RESPIRATORY system brings OXYGEN into the lungs and transfers it to the blood in the alveoli. The CIRCULATORY system then transports this oxygenated blood (via the heart and arteries) to all body tissues, where it diffuses into cells for respiration.'},
    {q:'Describe the role of the stomach in digestion.',a:'The STOMACH churns food to mix it with digestive juices. It produces HYDROCHLORIC ACID (HCl), which kills bacteria and creates the acidic pH needed for the protease enzyme PEPSIN to begin breaking down proteins into smaller peptides.'},
    {q:'How does the nervous system coordinate a rapid response to a stimulus (e.g., touching a hot object)?',a:'A reflex arc bypasses the brain for speed: RECEPTOR (in skin) detects heat → SENSORY neuron carries impulse to SPINAL CORD → RELAY neuron connects to MOTOR neuron → MOTOR neuron carries impulse to EFFECTOR (muscle) to pull hand away. This occurs rapidly and automatically.'},
    {q:'State the four main functions of the human skeleton.',a:'1. SUPPORT (keeps the body upright and maintains its shape). 2. PROTECTION (skull protects brain, ribs protect heart/lungs, spine protects spinal cord). 3. MOVEMENT (bones act as levers for muscles). 4. BLOOD CELL PRODUCTION (bone marrow produces red and white blood cells).'},
    {q:'Why does a person\'s urine output increase when they drink a large amount of water?',a:'When you drink a lot of water, the blood becomes too dilute. The pituitary gland releases LESS ADH (Anti-Diuretic Hormone). The kidneys reabsorb LESS water, so a large amount of DILUTE urine is produced to restore the body\'s water balance.'},
    {q:'Explain the role of the diaphragm during inhalation.',a:'During INHALATION, the DIAPHRAGM CONTRACTS and flattens. This increases the volume of the chest cavity, which DECREASES the pressure inside the lungs. Air rushes into the lungs to equalise the pressure.'},
    {q:'What is the function of bile in digestion?',a:'BILE is produced by the liver and stored in the gallbladder. It is released into the small intestine where it EMULSIFIES fats — breaking large fat droplets into much smaller droplets. This INCREASES the surface area for the enzyme LIPASE to work on, speeding up fat digestion.'},
    {q:'Compare the functions of arteries, veins, and capillaries.',a:'ARTERIES carry blood AWAY from the heart at high pressure; they have thick walls. VEINS carry blood TOWARD the heart at low pressure; they have valves. CAPILLARIES are one cell thick and allow the exchange of gases and nutrients between blood and tissues.'},
    {q:'What is the difference between voluntary and involuntary actions? Give an example of each.',a:'VOLUNTARY actions are consciously controlled (e.g., raising your hand). INVOLUNTARY actions are automatic and not controlled by conscious thought (e.g., breathing, heartbeat, peristalsis, reflex actions).'},
    {q:'Describe the pathway of air from the outside to the alveoli.',a:'Air enters through the NOSE/MOUTH → passes through the TRACHEA (windpipe) → splits into two BRONCHI → enters the LUNGS through BRONCHIOLES → arrives at the ALVEOLI for gas exchange.'},
    {q:'Why do red blood cells lack a nucleus?',a:'Red blood cells lose their nucleus during development to MAXIMISE the space available for HAEMOGLOBIN. More haemoglobin means more oxygen can be carried. This also gives the cell a biconcave shape for a larger surface area.'},
    {q:'How does the liver contribute to the removal of nitrogenous waste?',a:'The LIVER breaks down excess AMINO ACIDS (from proteins) in a process called DEAMINATION. This produces UREA (nitrogenous waste), which is then transported in the blood to the KIDNEYS to be filtered and excreted as urine.'},
    {q:'Why is the placenta essential for the development of a foetus?',a:'The PLACENTA acts as a link between the mother and the foetus. It allows OXYGEN and NUTRIENTS to pass from the mother\'s blood into the foetus\'s blood, and removes WASTE PRODUCTS (CO₂, urea) from the foetus to be excreted by the mother.'},
    {q:'What is the function of the vertebral column (spine)?',a:'The VERTEBRAL COLUMN supports the upper body and provides attachment points for muscles. Most importantly, it protects the SPINAL CORD — the bundle of nerves that connects the brain to the rest of the body.'},
    {q:'What is the function of mucus in the respiratory and digestive systems?',a:'In the RESPIRATORY system, mucus traps dust and pathogens. In the DIGESTIVE system, mucus protects the stomach lining from the corrosive effect of hydrochloric acid and helps food slide through the gut.'},
  ],
  blanks:{
    passage:'The digestive system breaks food into small soluble molecules. The final breakdown and absorption of nutrients occurs in the [_] intestine. Gas exchange takes place in the [_] of the lungs, where oxygen diffuses into the blood and carbon dioxide diffuses out. The [_] are the organs that filter the blood to remove urea and produce urine. The skeleton supports the body, protects vital organs, and allows for [_]. The [_] of the brain controls automatic functions such as breathing and heart rate.',
    answers:['small','alveoli','kidneys','movement','medulla oblongata'],
    wordbank:['small','alveoli','kidneys','movement','medulla oblongata','large','liver','lungs'],
  },
  sentences:[
    {prompt:'Explain how the structure of the small intestine is ideally suited for absorbing large quantities of digested food into the blood.',keywords:['long','villi','microvilli','surface area','capillaries','blood supply','thin walls','short diffusion distance','absorption','glucose','amino acids'],hint:'What physical features of the small intestine greatly increase the surface area for absorption? How does the blood supply help maintain a diffusion gradient?'},
    {prompt:'Describe the mechanical process of breathing, focusing on the role of the diaphragm and intercostal muscles during inhalation.',keywords:['diaphragm','contract','flatten','intercostal','rib cage','chest volume','air pressure','inhalation','oxygen','lungs'],hint:'What happens to the diaphragm and the rib cage when you breathe in? How does this change the pressure inside the chest cavity?'},
    {prompt:'Explain why the heart is often described as a "double pump" and describe the two different circuits it maintains.',keywords:['right side','lungs','left side','body','pulmonary','systemic','circulation','oxygenated','deoxygenated','double pump'],hint:'What is the destination of the blood pumped by the right side of the heart? What is the destination of the blood pumped by the left side?'},
    {prompt:'A patient has a kidney disease and requires dialysis. Explain what the kidney normally does and why dialysis is needed.',keywords:['kidney','filter','blood','urea','excess water','urine','dialysis','artificial','waste','toxic'],hint:'What are the two main waste products that the kidneys remove from the blood? Why is it dangerous if these waste products build up in the body?'},
    {prompt:'Describe the adaptations of the alveoli that make gas exchange highly efficient.',keywords:['alveoli','surface area','thin walls','moist','blood capillaries','diffusion','oxygen','carbon dioxide'],hint:'What four structural features of the alveoli ensure that oxygen diffuses quickly into the blood and carbon dioxide diffuses quickly out?'},
    {prompt:'Explain the difference between a voluntary and an involuntary muscle, giving one example of each.',keywords:['voluntary','skeletal','conscious','involuntary','smooth','cardiac','automatic','heart','digestive tract'],hint:'Can you control the movement of a voluntary muscle? Can you control the movement of an involuntary muscle?'},
    {prompt:'Trace the path of a red blood cell carrying oxygen from the lungs to a muscle cell in the leg.',keywords:['alveoli','oxygen','diffuse','blood','pulmonary vein','left atrium','left ventricle','aorta','artery','capillary','muscle'],hint:'Which chambers of the heart does the blood pass through? Which blood vessels does it travel along?'},
    {prompt:'Describe the role of the skeleton in protecting vital organs.',keywords:['skull','brain','ribcage','heart','lungs','vertebral column','spinal cord','pelvis','protection'],hint:'What does the skull protect? What does the ribcage protect? What does the spine protect?'},
    {prompt:'Explain why a person who is dehydrated produces a very small amount of dark, concentrated urine.',keywords:['dehydration','water','ADH','hormone','kidney','reabsorb','concentrated','urine','osmoregulation'],hint:'Which hormone is released when the body is low on water? What effect does this hormone have on the kidneys?'},
    {prompt:'Compare the structure and function of a sensory neuron and a motor neuron.',keywords:['sensory','receptor','CNS','motor','CNS','effector','muscle','gland','nerve impulse','spinal cord'],hint:'One carries impulses towards the central nervous system, the other carries impulses away from it. Where do they start and end?'},
    {prompt:'Describe the functions of the cerebrum, cerebellum, and medulla oblongata.',keywords:['cerebrum','thought','conscious','memory','cerebellum','coordination','balance','medulla oblongata','heart rate','breathing'],hint:'Which part is responsible for conscious thought? Which part controls balance? Which part maintains automatic life-sustaining functions?'},
    {prompt:'Explain why a heart attack (myocardial infarction) is life-threatening.',keywords:['coronary artery','blockage','blood flow','oxygen','heart muscle','tissue','die','heart attack'],hint:'What do the coronary arteries supply to the heart muscle? What happens to the heart muscle if this supply is cut off?'},
    {prompt:'What is the function of the mucus produced in the stomach and the airways?',keywords:['mucus','stomach','lining','acid','protection','airways','trap','dust','pathogens'],hint:'How does mucus protect the stomach from its own acid? How does mucus protect the respiratory system?'},
    {prompt:'Describe the process of peristalsis and its importance in the digestive system.',keywords:['peristalsis','muscles','contractions','food','oesophagus','intestines','wave','involuntary','push'],hint:'What two types of muscle are involved in peristalsis? How do they work together to push food along the gut?'},
    {prompt:'Explain why high temperatures in the lungs can be dangerous.',keywords:['lungs','heat','enzyme','denature','respiratory system','oxygen','efficiency','damage'],hint:'Enzymes in the respiratory tissues rely on specific temperatures. What happens to proteins (enzymes) at very high temperatures?'},
    {prompt:'Describe the role of the liver in the digestive and excretory systems.',keywords:['liver','bile','fats','emulsify','urea','deamination','amino acids','excess','digestion'],hint:'What does the liver produce that helps digest fats? What waste product does the liver produce from excess proteins?'},
    {prompt:'Explain how a reflex arc works, using the example of blinking when an object comes near your eye.',keywords:['reflex arc','receptor','sensory neuron','relay neuron','motor neuron','effector','eye','blink'],hint:'Describe the pathway from detecting the stimulus to carrying out the response. Why does this happen so fast?'},
    {prompt:'Why does a person cough when food or liquid enters their trachea (windpipe) instead of their oesophagus?',keywords:['trachea','oesophagus','food','liquid','cough','reflex','airway','protect','lungs'],hint:'How does the body expel foreign objects from the airway? What is the evolutionary purpose of this reflex?'},
    {prompt:'Compare the effects of the sympathetic and parasympathetic nervous systems on heart rate.',keywords:['sympathetic','fight or flight','increase','heart rate','parasympathetic','rest and digest','decrease','homeostasis'],hint:'One system speeds the heart up in an emergency. The other slows it down when the body is relaxed. How do they work together to maintain balance?'},
    {prompt:'Explain why the heart muscle must have its own separate blood supply (coronary arteries).',keywords:['heart muscle','coronary arteries','oxygen','glucose','contract','pump','blood','supply'],hint:'Does the blood inside the heart chambers provide oxygen to the heart muscle cells? Why are coronary arteries necessary?'},
  ],
});
</script></body></html>
