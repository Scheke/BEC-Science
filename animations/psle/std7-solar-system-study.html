<script>
const STEPS=[
{title:'Our Solar System',
content:`<h2>The Sun and Its Family</h2>
<p>Our <strong>Solar System</strong> consists of the Sun and everything that orbits it — held together by <strong>gravity</strong>.</p>
<p>The 8 planets in order from the Sun:</p>
<ol>
<li>☿ <strong>Mercury</strong> — smallest, closest</li>
<li>♀ <strong>Venus</strong> — hottest (thick atmosphere)</li>
<li>🌍 <strong>Earth</strong> — only known planet with life</li>
<li>♂ <strong>Mars</strong> — the "Red Planet"</li>
<li>♃ <strong>Jupiter</strong> — largest planet</li>
<li>♄ <strong>Saturn</strong> — famous for its rings</li>
<li>⛢ <strong>Uranus</strong> — rotates on its side</li>
<li>♆ <strong>Neptune</strong> — coldest, furthest</li>
</ol>
<p>Mnemonic: <em>"My Very Energetic Mother Just Serves Us Nachos"</em></p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,280);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  const planets=[{r:8,d:30,col:'#9e9e9e',n:'Me'},{r:11,d:55,col:'#f4511e',n:'Ve'},{r:13,d:85,col:'#1e88e5',n:'Ea'},{r:10,d:115,col:'#e53935',n:'Ma'},{r:22,d:160,col:'#ef6c00',n:'Ju'},{r:18,d:210,col:'#ffd600',n:'Sa'},{r:14,d:260,col:'#80cbc4',n:'Ur'},{r:12,d:310,col:'#1565c0',n:'Ne'}];
  let t=0;
  p.draw=()=>{
    p.background(20);
    // stars
    for(let i=0;i<40;i++){p.fill(255,255,255,120);p.noStroke();p.ellipse((i*73)%420,(i*53)%280,2,2);}
    // sun
    p.fill('#ffd600');p.noStroke();p.ellipse(0,140,60,60);
    // orbits and planets
    planets.forEach((pl,i)=>{
      if(pl.d<420){
        p.stroke(255,255,255,30);p.strokeWeight(1);p.noFill();p.ellipse(0,140,pl.d*2,(pl.d*2)*0.3);
        const speed=0.005/(i+1)*3;
        const angle=t*speed;
        const x=pl.d*Math.cos(angle),y=pl.d*0.3*Math.sin(angle)+140;
        if(x>-420&&x<420){p.fill(pl.col);p.noStroke();p.ellipse(x,y,pl.r*2,pl.r*2);p.fill(255);p.textSize(8);p.text(pl.n,x,y);}
      }
    });
    t++;
  };
}},
{title:'Day, Night and the Year',
content:`<h2>Earth's Rotations and Revolutions</h2>
<p><strong>Day and Night</strong> are caused by Earth <strong>rotating on its axis</strong> once every 24 hours.</p>
<ul>
<li>The side facing the Sun = DAY</li>
<li>The side facing away = NIGHT</li>
</ul>
<p><strong>A Year</strong> is caused by Earth <strong>revolving (orbiting) around the Sun</strong> once in 365.25 days.</p>
<p>Earth's axis is tilted at <strong>23.5°</strong> — this tilt causes the SEASONS as different hemispheres tilt toward or away from the Sun at different times of year.</p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,270);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let t=0;
  p.draw=()=>{
    p.background(20);
    // sun
    p.fill('#ffd600');p.noStroke();p.ellipse(70,135,60,60);
    // Earth orbit
    p.stroke(255,255,255,40);p.strokeWeight(1);p.noFill();p.ellipse(210,135,280,180);
    // Earth position
    const ea=t*0.01;
    const ex=210+140*Math.cos(ea),ey=135+90*Math.sin(ea);
    // shadow
    p.fill(0,0,50);p.noStroke();p.arc(ex,ey,36,36,p.HALF_PI,p.HALF_PI+p.PI);
    p.fill('#1e88e5');p.arc(ex,ey,36,36,p.HALF_PI+p.PI,p.HALF_PI);
    // axis tilt
    p.stroke(255,100,100);p.strokeWeight(2);
    const tilt=0.4;
    p.line(ex-10*Math.sin(tilt)+10*Math.cos(tilt),ey-18*Math.cos(tilt)-10*Math.sin(tilt),ex+10*Math.sin(tilt)-10*Math.cos(tilt),ey+18*Math.cos(tilt)+10*Math.sin(tilt));
    p.fill(255);p.noStroke();p.textSize(10);p.text('Day',ex+8,ey);p.fill(150);p.text('Night',ex-8,ey);
    p.fill(255);p.textSize(11);p.text('Earth rotates (24h) = day/night',210,260);
    p.fill('#ffd600');p.textSize(10);p.text('Sun',70,165);
    t++;
  };
}},
{title:'Eclipses',
content:`<h2>Solar and Lunar Eclipses</h2>
<p><strong>Solar Eclipse</strong> — Moon is between Earth and Sun:</p>
<ul>
<li>Moon's shadow falls on Earth</li>
<li>Sun appears blocked (totally or partially)</li>
<li>Can only happen during a <em>new moon</em></li>
<li>Only visible from a small area of Earth</li>
</ul>
<p><strong>Lunar Eclipse</strong> — Earth is between Sun and Moon:</p>
<ul>
<li>Earth's shadow falls on the Moon</li>
<li>Moon appears dark or reddish</li>
<li>Can only happen during a <em>full moon</em></li>
<li>Visible from anywhere on the night side of Earth</li>
</ul>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,270);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let t=0,showSolar=true;
  p.draw=()=>{
    p.background(20);
    if(Math.floor(t/120)%2===0){
      // solar eclipse
      p.fill('#ffd600');p.noStroke();p.ellipse(60,135,70,70);p.fill(255);p.textSize(9);p.text('Sun',60,180);
      p.fill('#bdbdbd');p.ellipse(210,135,36,36);p.fill(255);p.textSize(8);p.text('Moon',210,162);
      p.fill('#1e88e5');p.ellipse(360,135,50,50);p.fill(255);p.textSize(9);p.text('Earth',360,175);
      // shadow
      p.fill(0,0,0,100);p.noStroke();p.triangle(228,120,228,150,380,130);
      p.fill(255);p.textSize(12);p.text('SOLAR ECLIPSE',210,235);p.textSize(10);p.text('Moon blocks sunlight from Earth',210,252);
    } else {
      // lunar eclipse
      p.fill('#ffd600');p.noStroke();p.ellipse(60,135,70,70);p.fill(255);p.textSize(9);p.text('Sun',60,180);
      p.fill('#1e88e5');p.ellipse(210,135,50,50);p.fill(255);p.textSize(9);p.text('Earth',210,175);
      p.fill('#bdbdbd');p.ellipse(360,135,36,36);p.fill(255);p.textSize(8);p.text('Moon',360,162);
      // shadow
      p.fill(0,0,0,120);p.noStroke();p.triangle(235,115,235,155,385,140);
      p.fill(255);p.textSize(12);p.text('LUNAR ECLIPSE',210,235);p.textSize(10);p.text('Earth blocks sunlight from Moon',210,252);
    }
    t++;
  };
}},
{title:'The Moon',
content:`<h2>Earth's Natural Satellite</h2>
<p>The <strong>Moon</strong> is Earth's only natural satellite. It orbits Earth every <strong>~29.5 days</strong> (one lunar month).</p>
<p><strong>Why do we always see the same side of the Moon?</strong><br>The Moon takes the same time to ROTATE on its axis as it does to ORBIT Earth. This is called <em>tidal locking</em>.</p>
<p><strong>Moon phases</strong> occur because we see different portions of the lit side as the Moon orbits Earth:</p>
<ul>
<li>🌑 New Moon → 🌒 Waxing Crescent → 🌓 First Quarter → 🌔 Waxing Gibbous → 🌕 Full Moon → 🌖 Waning Gibbous → 🌗 Last Quarter → 🌘 Waning Crescent → 🌑 New Moon</li>
</ul>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,270);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let t=0;
  p.draw=()=>{
    p.background(20);
    // Earth
    p.fill('#1e88e5');p.noStroke();p.ellipse(210,135,60,60);p.fill(255);p.textSize(10);p.text('Earth',210,135);
    // Moon orbit
    p.stroke(255,255,255,40);p.strokeWeight(1);p.noFill();p.ellipse(210,135,220,220);
    // Moon
    const ma=t*0.04;
    const mx=210+110*Math.cos(ma),my=135+110*Math.sin(ma);
    // Phase — show dark/light sides based on position
    const phase=((ma%(2*Math.PI))/(2*Math.PI));
    p.fill('#bdbdbd');p.noStroke();p.ellipse(mx,my,26,26);
    // dark overlay
    const litAngle=ma+Math.PI;
    p.fill(0,0,20,200);p.arc(mx,my,26,26,litAngle,litAngle+Math.PI);
    p.fill(255);p.textSize(8);p.text('Moon',mx,my+18);
    const phases='🌑🌒🌓🌔🌕🌖🌗🌘';
    const pi=Math.floor(phase*8)%8;
    p.fill(255);p.textSize(26);p.text(phases[pi],210,50);
    p.textSize(10);p.text('Moon phase',210,78);
    t++;
  };
}},
{title:'Stars and Galaxies',
content:`<h2>Beyond Our Solar System</h2>
<p><strong>Stars</strong> are massive balls of plasma that produce their own light and heat through <em>nuclear fusion</em> in their core.</p>
<ul>
<li>Our Sun is a <strong>medium-sized star</strong></li>
<li>Stars appear as points of light in the night sky</li>
<li>They are classified by size, colour, and temperature</li>
</ul>
<p><strong>Galaxies</strong> are enormous collections of billions of stars, gas, and dust:</p>
<ul>
<li>Our galaxy is the <strong>Milky Way</strong> — a spiral galaxy</li>
<li>Contains ~200-400 billion stars</li>
<li>About 100,000 light years across</li>
<li>Nearest star: Proxima Centauri — 4.24 light years away</li>
</ul>
<p>A <strong>light year</strong> = distance light travels in 1 year ≈ 9.46 trillion km</p>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,270);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let t=0;
  const stars=Array.from({length:100},()=>({x:Math.random()*420,y:Math.random()*270,r:Math.random()*2+0.5,twinkle:Math.random()*6}));
  p.draw=()=>{
    p.background(10);
    stars.forEach(s=>{
      const b=150+80*Math.sin(t*0.04+s.twinkle);
      p.fill(b,b,b);p.noStroke();p.ellipse(s.x,s.y,s.r,s.r);
    });
    // spiral galaxy center
    for(let a=0;a<800;a++){
      const angle=a*0.08+t*0.005;
      const r=a*0.15;
      const x=210+r*Math.cos(angle),y=135+r*0.4*Math.sin(angle);
      if(x>0&&x<420&&y>0&&y<270){p.fill(255,220,100,80);p.noStroke();p.ellipse(x,y,1.5,1.5);}
    }
    p.fill(255);p.textSize(11);p.noStroke();p.text('The Milky Way — our spiral galaxy (~400 billion stars)',210,258);
    t++;
  };
}},

{title:'Day and Night — Earth\'s Rotation',
content:`<h3>Why Do We Have Day and Night?</h3><p>Earth spins on its <strong>tilted axis</strong> once every <strong>24 hours</strong>. The side facing the Sun experiences <strong>daytime</strong>; the opposite side is in <strong>night</strong>. The Sun does not move — Earth rotates.</p>`,

{title:'The Moon\'s Phases',
content:`<h3>Why Does the Moon Change Shape?</h3><p>The Moon doesn't produce its own light — we see sunlight reflected off it. As the Moon orbits Earth over ~29.5 days, we see different portions of its lit side, creating the <strong>8 phases</strong>.</p>`,

{title:'Solar and Lunar Eclipses — Diagram',
content:`<h3>When Shadows Fall</h3><p>Eclipses happen when the Sun, Moon, and Earth line up perfectly. The key difference is <em>which body is in the middle</em>.</p>`,

  <line x1="20" y1="120" x2="400" y2="120" stroke="#006064" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- LUNAR ECLIPSE — bottom half -->
  <text x="210" y="138" text-anchor="middle" fill="#e0f7fa" font-size="11" font-weight="bold">LUNAR ECLIPSE</text>
