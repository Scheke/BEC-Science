{title:'What Is Classification?',
content:`<h2>Organising Living Things</h2>
<p><strong>Classification</strong> is the grouping of living things based on their shared features. Scientists classify living things so they can:</p>
<ul>
<li>🔍 Identify and name organisms</li>
<li>📚 Study relationships between species</li>
<li>🌍 Communicate with scientists worldwide</li>
</ul>
<p>The major kingdoms include:</p>
<ul>
<li>🌿 <strong>Plants</strong> — photosynthesise, cannot move</li>
<li>🐾 <strong>Animals</strong> — consume food, can move</li>
<li>🍄 <strong>Fungi</strong> — absorb nutrients from dead matter</li>
<li>🦠 <strong>Bacteria</strong> — single-celled prokaryotes</li>
</ul>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,300);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let t=0;
  p.draw=()=>{
    p.background(245);
    const ks=[{n:'Plants',col:'#43a047',x:105,y:100},{n:'Animals',col:'#e53935',x:315,y:100},{n:'Fungi',col:'#8e24aa',x:105,y:220},{n:'Bacteria',col:'#f4511e',x:315,y:220}];
    p.fill('#f5f5f5');p.stroke('#ccc');p.strokeWeight(2);p.rect(50,40,320,230,18);
    p.noStroke();p.fill('#555');p.textSize(13);p.text('Living World',210,62);
    ks.forEach((k,i)=>{const pulse=1+0.08*p.sin(t*0.04+i*1.5);p.fill(k.col);p.noStroke();p.ellipse(k.x,k.y,88*pulse,60*pulse);p.fill(255);p.textSize(14);p.text(k.n,k.x,k.y);});
    t++;
  };
}},

{title:'Characteristics of Living Things',
content:`<h2>MRS GREN</h2>
<p>All living things share 7 characteristics remembered as <strong>MRS GREN</strong>:</p>
<table style="width:100%;border-collapse:collapse;margin:8px 0">
<tr><td style="padding:6px;background:#e8f5e9"><strong>M</strong> — Movement</td><td style="padding:6px;background:#e8f5e9">Can move themselves or parts</td></tr>
<tr><td style="padding:6px"><strong>R</strong> — Respiration</td><td style="padding:6px">Release energy from food</td></tr>
<tr><td style="padding:6px;background:#e8f5e9"><strong>S</strong> — Sensitivity</td><td style="padding:6px;background:#e8f5e9">Respond to changes (stimuli)</td></tr>
<tr><td style="padding:6px"><strong>G</strong> — Growth</td><td style="padding:6px">Increase in size over time</td></tr>
<tr><td style="padding:6px;background:#e8f5e9"><strong>R</strong> — Reproduction</td><td style="padding:6px;background:#e8f5e9">Make offspring</td></tr>
<tr><td style="padding:6px"><strong>E</strong> — Excretion</td><td style="padding:6px">Remove waste products</td></tr>
<tr><td style="padding:6px;background:#e8f5e9"><strong>N</strong> — Nutrition</td><td style="padding:6px;background:#e8f5e9">Obtain food/energy</td></tr>
</table>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,290);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  const letters='MRSGREN'.split('');
  const clrs=['#e53935','#f4511e','#8e24aa','#1e88e5','#00897b','#43a047','#6d4c41'];
  let shown=0,frame=0;
  p.draw=()=>{
    p.background(245);
    if(frame%50===0) shown=Math.min(shown+1,7);
    letters.slice(0,shown).forEach((l,i)=>{const x=60+i*45,y=145;p.fill(clrs[i]);p.noStroke();p.rect(x-18,y-26,36,52,8);p.fill(255);p.textSize(22);p.text(l,x,y);});
    p.fill('#333');p.noStroke();p.textSize(13);p.text('MRS GREN — all 7 features of life',210,235);
    frame++;
  };
}},

{title:'Vertebrates vs Invertebrates',
content:`<h2>Animals With and Without Backbones</h2>
<p>All animals fall into two groups:</p>
<ul>
<li>🦴 <strong>Vertebrates</strong> — have a <em>backbone (spine)</em>. Only 5 classes: fish, amphibians, reptiles, birds, mammals.</li>
<li>🐛 <strong>Invertebrates</strong> — no backbone. Much more numerous! Examples: insects, spiders, worms, snails, jellyfish.</li>
</ul>
<p><strong>The 5 vertebrate classes:</strong></p>
<table style="width:100%;border-collapse:collapse;margin:8px 0;font-size:.88rem">
<tr><th style="background:#2e7d32;color:#fff;padding:4px">Class</th><th style="background:#2e7d32;color:#fff;padding:4px">Skin</th><th style="background:#2e7d32;color:#fff;padding:4px">Temp.</th><th style="background:#2e7d32;color:#fff;padding:4px">Young</th></tr>
<tr style="background:#e8f5e9"><td style="padding:4px">Fish</td><td style="padding:4px">Wet scales</td><td style="padding:4px">Cold</td><td style="padding:4px">Eggs in water</td></tr>
<tr><td style="padding:4px">Amphibians</td><td style="padding:4px">Moist, smooth</td><td style="padding:4px">Cold</td><td style="padding:4px">Eggs in water</td></tr>
<tr style="background:#e8f5e9"><td style="padding:4px">Reptiles</td><td style="padding:4px">Dry scales</td><td style="padding:4px">Cold</td><td style="padding:4px">Eggs on land</td></tr>
<tr><td style="padding:4px">Birds</td><td style="padding:4px">Feathers</td><td style="padding:4px">Warm</td><td style="padding:4px">Eggs on land</td></tr>
<tr style="background:#e8f5e9"><td style="padding:4px">Mammals</td><td style="padding:4px">Hair / fur</td><td style="padding:4px">Warm</td><td style="padding:4px">Live young (mostly)</td></tr>
</table>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,290);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  const groups=[{n:'Fish 🐟',c:'#1e88e5'},{n:'Amphibian 🐸',c:'#43a047'},{n:'Reptile 🦎',c:'#8e24aa'},{n:'Bird 🦅',c:'#f4511e'},{n:'Mammal 🦁',c:'#e53935'}];
  let t=0,active=0;
  p.draw=()=>{
    p.background(245);
    if(t%80===0) active=(active+1)%5;
    const cx=210,cy=145,r=110;
    groups.forEach((g,i)=>{
      const a=p.TWO_PI*(i/5)-p.HALF_PI;const x=cx+r*p.cos(a),y=cy+r*p.sin(a);const isA=active===i;
      p.fill(isA?g.c:'#ddd');p.noStroke();p.ellipse(x,y,isA?90:70,isA?54:42);
      p.fill(isA?255:'#666');p.textSize(isA?11:10);p.text(g.n,x,y);
      p.stroke('#aaa');p.strokeWeight(1);p.line(cx,cy,x,y);
    });
    p.fill('#333');p.noStroke();p.textSize(13);p.text('5 Vertebrate Classes',cx,cy);
    t++;
  };
}},

{title:'Warm-Blooded vs Cold-Blooded',
content:`<h2>Body Temperature Control</h2>
<p>One important difference between vertebrate classes is how they regulate body temperature:</p>
<p>🔥 <strong>Warm-blooded (endotherms)</strong> — Birds and Mammals</p>
<ul><li>Maintain a CONSTANT body temperature regardless of environment</li><li>Active even in cold conditions</li><li>Need more food for energy</li></ul>
<p>❄️ <strong>Cold-blooded (ectotherms)</strong> — Fish, Amphibians, Reptiles</p>
<ul><li>Body temperature CHANGES with surroundings</li><li>Slow/inactive when cold, must bask in sun</li><li>Need less food</li></ul>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,290);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let t=0;
  p.draw=()=>{
    p.background(245);
    const temp=18+12*p.sin(t*0.04);
    const cBody=p.map(temp,6,30,180,255,true);
    p.fill(0,0,cBody);p.noStroke();p.ellipse(105,150,80,60);p.fill(255);p.textSize(11);p.text('Lizard 🦎',105,148);p.fill('#333');p.textSize(9);p.text('Body: '+p.nf(temp,1,0)+'°C',105,175);
    p.fill(220,40,40);p.noStroke();p.ellipse(315,150,80,60);p.fill(255);p.textSize(11);p.text('Dog 🐕',315,148);p.fill('#333');p.textSize(9);p.text('Body: 37°C',315,175);
    const th=p.map(temp,6,30,180,60);
    p.fill('#eee');p.stroke('#aaa');p.rect(198,60,24,140,6);
    p.fill(p.color(p.map(temp,6,30,0,220),0,p.map(temp,6,30,200,0)));p.noStroke();p.rect(198,th,24,60+140-th,6);
    p.fill('#333');p.textSize(11);p.text('Env: '+p.nf(temp,1,0)+'°C',210,235);
    t++;
  };
}},

{title:'Plants, Fungi, and Bacteria',
content:`<h2>Other Kingdoms</h2>
<p><strong>Plants 🌿</strong></p>
<ul><li>Make food by <em>photosynthesis</em> — sunlight + CO₂ + water → glucose</li><li>Cells have <em>cell walls</em> (cellulose) and <em>chlorophyll</em></li><li>Cannot move from place to place</li></ul>
<p><strong>Fungi 🍄</strong></p>
<ul><li>CANNOT photosynthesise — no chlorophyll</li><li>Absorb nutrients from dead or living material (decomposers)</li><li>Cell walls made of <em>chitin</em></li></ul>
<p><strong>Bacteria 🦠</strong></p>
<ul><li>Single-celled, no nucleus (prokaryotes)</li><li>Only visible under a microscope</li><li>Some helpful (yoghurt, soil), some cause disease (cholera, TB)</li></ul>`,
draw(p){
  p.setup=()=>{p.createCanvas(420,280);p.textAlign(p.CENTER,p.CENTER);p.textFont('Arial')};
  let t=0;
  p.draw=()=>{
    p.background(245);
    p.fill('#43a047');p.noStroke();p.ellipse(75,110,60,80);p.stroke('#2e7d32');p.strokeWeight(3);p.line(75,150,75,220);p.noStroke();p.fill('#43a047');p.ellipse(55,180,38,24);p.ellipse(95,180,38,24);p.fill('#333');p.textSize(10);p.text('Plant 🌿',75,245);
    p.fill('#8e24aa');p.noStroke();p.ellipse(210,100,80,50);p.fill('#ba68c8');p.rect(196,100,28,80,0,0,8,8);p.fill(255);p.textSize(18);p.text('🍄',210,130);p.fill('#333');p.textSize(10);p.text('Fungi',210,245);
    for(let i=0;i<6;i++){const bx=345+30*p.cos(p.TWO_PI*i/6+t*0.03);const by=140+24*p.sin(p.TWO_PI*i/6+t*0.03);p.fill('#f4511e');p.noStroke();p.ellipse(bx,by,18,12);}
    p.fill('#333');p.textSize(10);p.text('Bacteria 🦠',345,245);
    t++;
  };
}},

{title:'The 5 Classes of Vertebrates',
content:`<h3>How to Tell Them Apart</h3>
<p>When you see an animal in an exam, use these key features to classify it quickly:</p>
<ol>
<li>Does it have <strong>feathers</strong>? → Bird</li>
<li>Does it have <strong>hair or fur</strong>? → Mammal</li>
<li>Does it have <strong>dry scales</strong> and lay eggs on land? → Reptile</li>
<li>Does it have <strong>wet scales</strong> and live in water? → Fish</li>
<li>Does it have <strong>moist smooth skin</strong> and need water for eggs? → Amphibian</li>
</ol>
<p>Memory tip: <strong>"Fat Armadillos Really Build Muscles"</strong> = Fish, Amphibians, Reptiles, Birds, Mammals</p>`,

{title:'MRS GREN — Illustrated',
content:`<h3>All 7 Life Processes in Detail</h3>
<p>The mnemonic MRS GREN helps you remember every characteristic of living things. All 7 must be present for something to be classified as alive — a car moves but is not alive because it doesn't show all 7.</p>
<p><strong>Common exam question:</strong> "A fire grows, moves, and needs fuel. Is it alive?" Answer: NO — a fire does not reproduce, excrete, or have sensitivity in a biological sense.</p>`,
visual:`<svg viewBox="0 0 420 250" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">
  <text x="210" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">MRS GREN — The 7 Characteristics of Life</text>
  <!-- 7 boxes in 2 rows: 4 top, 3 bottom -->
  <!-- M -->
  <rect x="8" y="22" width="90" height="58" rx="7" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
  <text x="53" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#e53935">M</text>
  <text x="53" y="54" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">Movement</text>
  <text x="53" y="67" text-anchor="middle" font-size="8" fill="#555">Move body or parts</text>
  <text x="53" y="76" text-anchor="middle" font-size="8" fill="#888">e.g. plant grows to light</text>
  <!-- R -->
  <rect x="106" y="22" width="90" height="58" rx="7" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="151" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">R</text>
  <text x="151" y="54" text-anchor="middle" font-size="10" font-weight="bold" fill="#bf360c">Respiration</text>
  <text x="151" y="67" text-anchor="middle" font-size="8" fill="#555">Release energy</text>
  <text x="151" y="76" text-anchor="middle" font-size="8" fill="#888">from food (all cells)</text>
  <!-- S -->
  <rect x="204" y="22" width="90" height="58" rx="7" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="249" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#8e24aa">S</text>
  <text x="249" y="54" text-anchor="middle" font-size="10" font-weight="bold" fill="#6a1b9a">Sensitivity</text>
  <text x="249" y="67" text-anchor="middle" font-size="8" fill="#555">Respond to stimuli</text>
  <text x="249" y="76" text-anchor="middle" font-size="8" fill="#888">e.g. eye blink, plant</text>
  <!-- G -->
  <rect x="302" y="22" width="110" height="58" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="357" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">G</text>
  <text x="357" y="54" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">Growth</text>
  <text x="357" y="67" text-anchor="middle" font-size="8" fill="#555">Increase in size</text>
  <text x="357" y="76" text-anchor="middle" font-size="8" fill="#888">e.g. seed → tree</text>
  <!-- R2 -->
  <rect x="8" y="90" width="120" height="58" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="68" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">R</text>
  <text x="68" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">Reproduction</text>
  <text x="68" y="135" text-anchor="middle" font-size="8" fill="#555">Make offspring</text>
  <text x="68" y="144" text-anchor="middle" font-size="8" fill="#888">sexual or asexual</text>
  <!-- E -->
  <rect x="138" y="90" width="120" height="58" rx="7" fill="#e0f7fa" stroke="#006064" stroke-width="1.5"/>
  <text x="198" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#006064">E</text>
  <text x="198" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#004d40">Excretion</text>
  <text x="198" y="135" text-anchor="middle" font-size="8" fill="#555">Remove waste</text>
  <text x="198" y="144" text-anchor="middle" font-size="8" fill="#888">e.g. urine, sweat, CO₂</text>
  <!-- N -->
  <rect x="268" y="90" width="144" height="58" rx="7" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
  <text x="340" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">N</text>
  <text x="340" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#bf360c">Nutrition</text>
  <text x="340" y="135" text-anchor="middle" font-size="8" fill="#555">Obtain food/energy</text>
  <text x="340" y="144" text-anchor="middle" font-size="8" fill="#888">plant: photosynthesis</text>
  <!-- KEY at bottom -->
  <rect x="8" y="158" width="404" height="86" rx="8" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="210" y="174" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Why This Matters in Exams</text>
  <text x="210" y="190" text-anchor="middle" font-size="9" fill="#555">Question: "Is a candle flame alive?"</text>
  <text x="210" y="203" text-anchor="middle" font-size="9" fill="#555">✗ It moves (flickers)  ✗ It grows  ✓ It "respires" (burns fuel)  ✗ But it does NOT:</text>
  <text x="210" y="216" text-anchor="middle" font-size="9" fill="#c62828">Reproduce · Excrete · Show sensitivity · Have nutrition (biological)</text>
  <text x="210" y="232" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">→ NOT alive. ALL 7 characteristics must be present.</text>
</svg>`},

{title:'Flowering vs Non-Flowering Plants',
content:`<h3>Two Major Plant Groups</h3>
<p>Plants are divided into two main groups based on whether they produce <strong>flowers and seeds</strong>:</p>
<p>🌸 <strong>Flowering plants (Angiosperms)</strong></p>
<ul><li>Produce <em>flowers</em> for reproduction</li><li>Seeds are enclosed inside a <em>fruit</em></li><li>Most common — maize, mango, roses, beans</li></ul>
<p>🌲 <strong>Non-flowering plants</strong></p>
<ul><li><em>Gymnosperms</em>: seeds in cones, NOT fruits (e.g. pine trees)</li><li><em>Ferns</em>: reproduce using spores, not seeds at all</li><li><em>Mosses</em>: very simple, no true roots or stems, reproduce by spores</li></ul>`,

{title:'Classification Key — How to Identify Animals',
content:`<h3>Using a Dichotomous Key</h3>
<p>A <strong>dichotomous key</strong> is a tool that identifies organisms by asking a series of YES/NO questions. Each question splits organisms into two groups until you reach the name of the organism.</p>
<p><strong>How to use it:</strong></p>
<ol>
<li>Look at the organism carefully</li>
<li>Answer the first YES/NO question</li>
<li>Follow the arrow to the next question</li>
<li>Repeat until you reach an identification</li>
</ol>
<p>Dichotomous keys are used by scientists, doctors (identifying diseases), and ecologists (identifying species in the field).</p>`,
visual:`<svg viewBox="0 0 420 250" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="ka" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#333"/></marker></defs>
  <text x="210" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Dichotomous Key — Classifying Animals</text>
  <!-- Root question -->
  <rect x="130" y="20" width="160" height="32" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="210" y="35" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">Does it have a backbone?</text>
  <text x="210" y="47" text-anchor="middle" font-size="9" fill="#555">(a vertebral column / spine)</text>
  <!-- YES branch left -->
  <line x1="160" y1="52" x2="100" y2="75" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ka)"/>
  <text x="118" y="67" text-anchor="middle" font-size="9" fill="#2e7d32" font-weight="bold">YES</text>
  <!-- NO branch right -->
  <line x1="260" y1="52" x2="320" y2="75" stroke="#e53935" stroke-width="1.5" marker-end="url(#ka)"/>
  <text x="303" y="67" text-anchor="middle" font-size="9" fill="#e53935" font-weight="bold">NO</text>
  <!-- YES sub-question: warm-blooded? -->
  <rect x="30" y="75" width="150" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="105" y="88" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b5e20">Is it warm-blooded?</text>
  <text x="105" y="100" text-anchor="middle" font-size="8" fill="#555">(constant body temp)</text>
  <!-- NO sub-question: insects? -->
  <rect x="248" y="75" width="150" height="30" rx="6" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
  <text x="323" y="88" text-anchor="middle" font-size="9" font-weight="bold" fill="#c62828">Does it have 6 legs?</text>
  <text x="323" y="100" text-anchor="middle" font-size="8" fill="#555">(and 3 body segments)</text>
  <!-- YES warm-blooded → Bird or Mammal -->
  <line x1="80" y1="105" x2="55" y2="130" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#ka)"/>
  <text x="55" y="122" text-anchor="middle" font-size="8" fill="#2e7d32">YES</text>
  <line x1="130" y1="105" x2="155" y2="130" stroke="#e65100" stroke-width="1.2" marker-end="url(#ka)"/>
  <text x="148" y="122" text-anchor="middle" font-size="8" fill="#e65100">NO</text>
  <!-- NO warm-blooded = Fish/Amphibian/Reptile -->
  <!-- 6-legs YES → Insect, NO → other invert -->
  <line x1="290" y1="105" x2="275" y2="130" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#ka)"/>
  <text x="270" y="122" text-anchor="middle" font-size="8" fill="#2e7d32">YES</text>
  <line x1="355" y1="105" x2="368" y2="130" stroke="#e53935" stroke-width="1.2" marker-end="url(#ka)"/>
  <text x="373" y="122" text-anchor="middle" font-size="8" fill="#e53935">NO</text>
  <!-- Has feathers? -->
  <rect x="8" y="130" width="90" height="28" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="53" y="141" text-anchor="middle" font-size="8" font-weight="bold" fill="#e65100">Has feathers?</text>
  <text x="53" y="153" text-anchor="middle" font-size="8" fill="#555">YES=Bird NO=Mammal</text>
  <!-- Cold vertebrate -->
  <rect x="108" y="130" width="90" height="28" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="153" y="141" text-anchor="middle" font-size="8" font-weight="bold" fill="#0d47a1">Cold-blooded</text>
  <text x="153" y="153" text-anchor="middle" font-size="8" fill="#555">Fish/Reptile/Amphibian</text>
  <!-- Insect result -->
  <rect x="235" y="130" width="70" height="28" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="270" y="141" text-anchor="middle" font-size="8" font-weight="bold" fill="#2e7d32">INSECT</text>
  <text x="270" y="153" text-anchor="middle" font-size="8" fill="#555">(6 legs)</text>
  <!-- Other invertebrate -->
  <rect x="318" y="130" width="92" height="28" rx="6" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.2"/>
  <text x="364" y="141" text-anchor="middle" font-size="8" font-weight="bold" fill="#6a1b9a">OTHER INVERT.</text>
  <text x="364" y="153" text-anchor="middle" font-size="8" fill="#555">Spider, Worm, etc.</text>
  <!-- Final results row -->
  <rect x="8" y="175" width="404" height="66" rx="8" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="210" y="191" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Example Identifications</text>
  <text x="55" y="208" text-anchor="middle" font-size="9" fill="#c62828">Eagle: YES backbone</text>
  <text x="55" y="220" text-anchor="middle" font-size="9" fill="#c62828">→ Warm → Feathers</text>
  <text x="55" y="232" text-anchor="middle" font-size="9" fill="#c62828">→ BIRD ✓</text>
  <text x="160" y="208" text-anchor="middle" font-size="9" fill="#1565c0">Butterfly: NO backbone</text>
  <text x="160" y="220" text-anchor="middle" font-size="9" fill="#1565c0">→ 6 legs, 3 segments</text>
  <text x="160" y="232" text-anchor="middle" font-size="9" fill="#1565c0">→ INSECT ✓</text>
  <text x="280" y="208" text-anchor="middle" font-size="9" fill="#6a1b9a">Spider: NO backbone</text>
  <text x="280" y="220" text-anchor="middle" font-size="9" fill="#6a1b9a">→ NOT 6 legs (has 8)</text>
  <text x="280" y="232" text-anchor="middle" font-size="9" fill="#6a1b9a">→ ARACHNID ✓</text>
  <text x="380" y="208" text-anchor="middle" font-size="9" fill="#2e7d32">Frog: YES backbone</text>
  <text x="380" y="220" text-anchor="middle" font-size="9" fill="#2e7d32">→ Cold-blooded</text>
  <text x="380" y="232" text-anchor="middle" font-size="9" fill="#2e7d32">→ AMPHIBIAN ✓</text>
</svg>`},

{title:'Mini-Quiz: Characteristics &amp; Groups',
