<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Solar System Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Solar System & Space — Std 7 Science Quiz',
  color:'#0d47a1',dark:'#002171',light:'#e3f2fd',
    mcq:[
    {q:'What keeps planets in orbit around the Sun?',opts:['Magnetic force','The planet\'s own engine','Gravity','Centrifugal force pushing them away'],ans:2,exp:'GRAVITY from the Sun keeps planets in their orbits. The Sun\'s enormous mass creates a gravitational pull on all the planets. The planet\'s speed creates an outward tendency, and gravity balances this to make a stable orbit.'},
    {q:'Which planet is closest to the Sun?',opts:['Venus','Earth','Mercury','Mars'],ans:2,exp:'MERCURY is the CLOSEST planet to the Sun and is the smallest planet. It has extreme temperature changes — very hot during the day and very cold at night because it has almost no atmosphere. Order: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.'},
    {q:'The Moon takes approximately how long to orbit Earth?',opts:['24 hours','7 days','27-29 days','365 days'],ans:2,exp:'The Moon orbits Earth in approximately 27.3 days (sidereal) or 29.5 days (lunar month, synodic). This is why we see the same lunar phases repeat every ~29.5 days.'},
    {q:'What causes day and night on Earth?',opts:['Earth orbiting the Sun','The Moon blocking the Sun','Earth rotating on its own axis','The Sun moving around Earth'],ans:2,exp:'DAY AND NIGHT are caused by Earth ROTATING on its own axis once every 24 hours. The side facing the Sun has DAY; the side facing away has NIGHT. Earth\'s axis is tilted at 23.5°, which also causes seasons.'},
    {q:'A light year is a measure of:',opts:['Time','Very large masses','Distance in space','Speed of stars'],ans:2,exp:'A LIGHT YEAR is the DISTANCE that light travels in one year — about 9.46 × 10¹⁵ metres (9.46 trillion km). It measures astronomical distances, not time. The nearest star (Proxima Centauri) is 4.24 light years away.'},
    {q:'The largest planet in our solar system is:',opts:['Saturn','Neptune','Jupiter','Uranus'],ans:2,exp:'JUPITER is the LARGEST planet in our solar system. It is a gas giant with a mass more than 300 times that of Earth. It is famous for its Great Red Spot, a massive storm that has lasted for centuries.'},
    {q:'Which planet is known as the "Red Planet"?',opts:['Venus','Mars','Jupiter','Saturn'],ans:1,exp:'MARS is called the "Red Planet" because its surface is rich in iron oxide (rust), giving it a reddish appearance. It is the fourth planet from the Sun and is a focus of space exploration.'},
    {q:'The Earth completes one full orbit around the Sun in approximately:',opts:['24 hours','7 days','365.25 days','12 months'],ans:2,exp:'Earth completes one full ORBIT (revolution) around the Sun in approximately 365.25 days. This period defines a YEAR. The extra 0.25 day is why we have a leap year every 4 years.'},
    {q:'The imaginary line around which the Earth rotates is called its:',opts:['Orbit','Axis','Equator','Ecliptic'],ans:1,exp:'The Earth rotates around an imaginary line running from the North Pole to the South Pole, called its AXIS. This rotation causes day and night. The axis is tilted at an angle of 23.5° to the vertical.'},
    {q:'A lunar eclipse occurs when:',opts:['The Moon passes between Earth and the Sun','The Earth passes between the Sun and the Moon','The Sun passes between Earth and the Moon','The Moon blocks out the Sun'],ans:1,exp:'A LUNAR ECLIPSE occurs when the EARTH passes directly between the SUN and the MOON. The Earth casts a shadow onto the Moon, making the Moon appear dark or reddish.'},
    {q:'Which planet has the most prominent ring system?',opts:['Jupiter','Uranus','Saturn','Neptune'],ans:2,exp:'SATURN is famous for its magnificent ring system, which is made up of billions of pieces of ice and rock, ranging from tiny grains to giant boulders. It is the most extensive and visible ring system of any planet.'},
    {q:'The Sun is a:',opts:['Planet','Star','Moon','Galaxy'],ans:1,exp:'The SUN is a STAR. It is a massive ball of hot, glowing gas that produces light and heat through nuclear fusion reactions. It is the closest star to Earth and the centre of our solar system.'},
    {q:'Venus is often described as Earth\'s "sister planet" because:',opts:['It has the same number of moons','It is the same size and mass as Earth','It has liquid water on its surface','It has a similar atmosphere'],ans:1,exp:'VENUS is called Earth\'s "sister planet" because it is very similar in SIZE and MASS to Earth. However, its atmosphere is thick with CO₂ and sulphuric acid, making it the hottest planet in the solar system.'},
    {q:'The main difference between a planet and a star is that:',opts:['A planet is bigger','A star produces its own light, while a planet reflects light','Planets are made of gas','Stars are closer to Earth'],ans:1,exp:'A STAR generates its own light and heat through nuclear fusion. A PLANET does not produce its own light; it merely REFLECTS light from its star (the Sun). Planets orbit stars.'},
    {q:'A solar eclipse occurs when:',opts:['The Earth passes between the Sun and Moon','The Moon passes between the Sun and Earth','The Sun passes between Earth and Moon','The Moon is full'],ans:1,exp:'A SOLAR ECLIPSE occurs when the MOON passes directly between the SUN and the EARTH. The Moon casts a shadow on Earth, blocking the Sun from view in certain regions.'},
    {q:'Which planet is the furthest from the Sun in our solar system?',opts:['Uranus','Neptune','Pluto','Saturn'],ans:1,exp:'NEPTUNE is the EIGHTH and furthest known planet from the Sun. It is a gas/ice giant, slightly smaller but more dense than Uranus. (Pluto is now classified as a dwarf planet).'},
    {q:'A comet is composed mostly of:',opts:['Solid rock','Ice, dust, and frozen gases','Liquid water','Plasma'],ans:1,exp:'COMETS are icy bodies made of frozen water, gases, and dust. As they approach the Sun, the Sun\'s heat causes the ice to vaporise, creating a bright, glowing tail made of gas and dust that stretches behind the comet.'},
    {q:'The force that keeps the Moon in orbit around the Earth is:',opts:['Magnetic force','Gravitational attraction','Centrifugal force','Electric force'],ans:1,exp:'GRAVITY is the force of attraction between the Earth and the Moon. This gravitational pull keeps the Moon in its orbit. Similarly, gravity from the Sun keeps the Earth in its orbit.'},
    {q:'An asteroid is:',opts:['A large ball of ice','A rocky body that orbits the Sun','A planet without moons','A type of star'],ans:1,exp:'An ASTEROID is a small, rocky body that orbits the Sun. Most asteroids are found in the ASTEROID BELT located between the orbits of Mars and Jupiter. They are remnants of the early solar system.'},
    {q:'The Milky Way galaxy is best described as:',opts:['A collection of planets','The entire universe','A vast collection of stars, gas, and dust held together by gravity','A cloud of gas in the solar system'],ans:2,exp:'The MILKY WAY is a SPIRAL GALAXY — an enormous collection of stars (200–400 billion), along with gas and dust, all held together by gravity. Our Solar System is located in one of its spiral arms.'},
  ],
  match:[
    {term:'Orbit',def:'The curved path of one celestial body around another, caused by gravitational attraction'},
    {term:'Axis',def:'An imaginary straight line through a body around which it rotates (e.g., Earth\'s axis through the poles)'},
    {term:'Eclipse',def:'An event where one celestial body passes into the shadow of another (solar or lunar)'},
    {term:'Galaxy',def:'A huge system containing billions of stars, gas, and dust held together by gravity (e.g., the Milky Way)'},
    {term:'Asteroid',def:'A small, rocky body that orbits the Sun, mostly found in the asteroid belt between Mars and Jupiter'},
    {term:'Comet',def:'An icy body that releases gas and dust to form a bright tail as it approaches the Sun'},
    {term:'Mercury',def:'The smallest planet and the closest to the Sun; has extreme temperatures and no atmosphere'},
    {term:'Venus',def:'The hottest planet; similar in size to Earth; has a thick CO₂ atmosphere; called the "evening star"'},
    {term:'Earth',def:'The third planet from the Sun; the only known planet with life; has liquid water and an oxygen-rich atmosphere'},
    {term:'Mars',def:'The "Red Planet"; fourth planet from the Sun; has the largest volcano (Olympus Mons) and the deepest canyon'},
    {term:'Jupiter',def:'The largest planet in the solar system; a gas giant with the Great Red Spot storm; has many moons'},
    {term:'Saturn',def:'The sixth planet from the Sun; known for its extensive and beautiful ring system; a gas giant'},
    {term:'Uranus',def:'The seventh planet; an ice giant with a blue-green colour due to methane; rotates on its side'},
    {term:'Neptune',def:'The eighth and furthest planet; a blue ice giant with the strongest winds in the solar system'},
    {term:'Sun',def:'The star at the centre of our solar system; a source of light, heat, and gravitational pull'},
    {term:'Moon',def:'Earth\'s only natural satellite; orbits Earth every ~29.5 days; creates tides and causes eclipses'},
    {term:'Light year',def:'The distance that light travels in one year (approx. 9.46 trillion km); a measure of distance in space'},
    {term:'Solar eclipse',def:'Occurs when the Moon passes between the Sun and Earth, casting a shadow on Earth'},
    {term:'Lunar eclipse',def:'Occurs when the Earth passes between the Sun and Moon, casting a shadow on the Moon'},
    {term:'Rotate',def:'To spin around an internal axis (Earth rotating on its axis causes day and night)'},
  ],
  flashcards:[
    {q:'Name the eight planets in order from the Sun.',a:'MERCURY, VENUS, EARTH, MARS, JUPITER, SATURN, URANUS, NEPTUNE. Mnemonic: "My Very Energetic Mother Just Served Us Nachos." The first four are ROCKY (terrestrial) planets; the last four are GAS GIANTS (Jupiter/Saturn) and ICE GIANTS (Uranus/Neptune).'},
    {q:'Explain the difference between a solar eclipse and a lunar eclipse.',a:'SOLAR ECLIPSE: The MOON is between the SUN and the EARTH. The Moon\'s shadow falls on Earth, and the Sun appears blocked. LUNAR ECLIPSE: The EARTH is between the SUN and the MOON. The Earth\'s shadow falls on the Moon, and the Moon appears dark or reddish. Solar eclipses are rarer and much shorter than lunar eclipses.'},
    {q:'What causes the seasons on Earth?',a:'SEASONS are caused by Earth\'s 23.5° AXIAL TILT as it orbits the Sun. When the Northern Hemisphere is tilted TOWARD the Sun → Summer (longer days, more direct sunlight). Six months later, tilted AWAY from the Sun → Winter. Botswana is in the Southern Hemisphere, so our summer is when the South Pole is tilted towards the Sun.'},
    {q:'State three differences between a star and a planet.',a:'STAR: Produces its own LIGHT and HEAT through nuclear fusion; massive; appears as a point of light that twinkles (due to atmosphere). PLANET: REFLECTS starlight (does not produce its own light); orbits a star; much smaller than a star; does not twinkle as much.'},
    {q:'What is the Milky Way and where is our Solar System located within it?',a:'The MILKY WAY is our galaxy — a spiral galaxy containing approximately 200-400 BILLION stars, gas, and dust. Our Solar System is located about 26,000 light years from the galactic centre, in one of the spiral arms called the Orion Arm.'},
    {q:'Explain why we always see the same side of the Moon from Earth.',a:'The Moon is TIDALLY LOCKED to Earth. This means the Moon\'s ROTATION period on its axis is exactly the SAME as its ORBITAL period around Earth (about 27.3 days). As a result, one side of the Moon always faces Earth, and we never see the far side from Earth.'},
    {q:'Describe the process of a solar eclipse.',a:'A solar eclipse occurs when the Moon passes directly between the Sun and Earth. The Moon blocks the Sun\'s light, casting a shadow on Earth. People in the path of the shadow see the Sun completely covered (total eclipse) for a few minutes.'},
    {q:'Why does Mercury have such extreme temperature fluctuations?',a:'Mercury has almost NO ATMOSPHERE. Without an atmosphere to trap and distribute heat, the side facing the Sun becomes extremely hot (up to 430°C), while the side facing away cools very quickly to -180°C.'},
    {q:'Explain the difference between rotation and revolution.',a:'ROTATION is the spinning of a body on its own AXIS (e.g., Earth spins once in 24 hours, causing day and night). REVOLUTION (or orbit) is the movement of one body around another (e.g., Earth orbits the Sun in 365.25 days, causing a year).'},
    {q:'What is a light year and why is it used instead of kilometres?',a:'A LIGHT YEAR is the DISTANCE that light travels in one year (approx. 9.46 trillion km). It is used because distances in space are too vast to be measured in kilometres. The nearest star, Proxima Centauri, is 4.24 light years away.'},
    {q:'Describe the main features of Jupiter.',a:'JUPITER is the LARGEST planet. It is a GAS GIANT made mainly of hydrogen and helium. It has the famous GREAT RED SPOT, a massive storm that has lasted for centuries. It has at least 95 known moons, and a faint ring system.'},
    {q:'Explain why Venus is the hottest planet even though it is not the closest to the Sun.',a:'VENUS has a very thick atmosphere made mostly of CARBON DIOXIDE (CO₂). This creates a massive GREENHOUSE EFFECT, trapping huge amounts of heat. Even though Mercury is closer to the Sun, Venus\'s surface temperature is hotter (around 465°C).'},
    {q:'Why is Earth the only known planet that supports life?',a:'Earth has the perfect conditions for life: 1. Liquid WATER on the surface. 2. An atmosphere with OXYGEN and protection from radiation. 3. The right DISTANCE from the Sun (habitable zone) — not too hot and not too cold. 4. A magnetic field that shields us from solar wind.'},
    {q:'What are the main features of Saturn?',a:'SATURN is the sixth planet and is a gas giant. It is famous for its EXTENSIVE RING SYSTEM, which is made of billions of pieces of ice and rock. It has a lower density than water, and is the least dense planet. It has many moons, including Titan.'},
    {q:'Explain why the Moon shows phases (e.g., new moon, full moon).',a:'Moon phases occur because the Moon orbits Earth and the portion of its lit side that faces Earth changes. When the Moon is between Earth and Sun, we see the NEW MOON (dark). When Earth is between Moon and Sun, we see the FULL MOON (fully lit).'},
    {q:'Describe the composition and orbit of a comet.',a:'A COMET is a small, icy body made of frozen gases, ice, and dust. As it approaches the Sun, the Sun\'s heat vaporises the ice, creating a glowing tail of gas and dust that points AWAY from the Sun. They orbit the Sun in highly elliptical (stretched) orbits.'},
    {q:'What is the "habitable zone" around a star?',a:'The HABITABLE ZONE (or Goldilocks zone) is the region around a star where conditions are just right for liquid water to exist on a planet\'s surface. Earth is in the Sun\'s habitable zone — not too close (too hot) and not too far (too cold).'},
    {q:'Explain why a solar eclipse does not happen every new moon.',a:'A solar eclipse requires the Sun, Moon, and Earth to be perfectly ALIGNED. The Moon\'s orbit is tilted slightly (about 5°) relative to Earth\'s orbit. Most of the time, the Moon passes slightly above or below the Sun from Earth\'s perspective.'},
    {q:'Why do the outer planets (Jupiter, Saturn, Uranus, Neptune) have no solid surface?',a:'The outer planets are GAS GIANTS and ICE GIANTS. They are composed mainly of hydrogen, helium, and ices. They do not have a solid, rocky surface like Earth; instead, the gas gradually densifies into a liquid or slushy interior.'},
    {q:'Describe the role of gravity in the solar system.',a:'GRAVITY is the force of attraction between all masses. It is the dominant force in space. It holds the Sun together, keeps planets in their orbits, and keeps moons in orbit around planets. Without gravity, planets would fly out of their orbits in straight lines.'},
  ],
  blanks:{
    passage:'The Sun is a star at the centre of our solar system. Planets orbit the Sun due to the force of [_]. Earth spins on its [_] once every 24 hours, causing day and night. It takes Earth approximately 365.25 days to complete one full [_] around the Sun. The Moon takes about 29 days to orbit Earth. A [_] year is the distance that light travels in one year, used to measure vast distances in space.',
    answers:['gravity','axis','orbit','light'],
    wordbank:['gravity','axis','orbit','light','moon','rotation','year'],
  },
  sentences:[
    {prompt:'Explain why Mercury is extremely hot during the daytime but extremely cold at night, despite being the closest planet to the Sun.',keywords:['no atmosphere','Sun','radiation','retains','heat escapes','temperature','thin atmosphere','Mercury'],hint:'What role does an atmosphere play in regulating a planet\'s temperature? Mercury has almost no atmosphere. How does this affect how heat is absorbed and lost?'},
    {prompt:'Explain why we only ever see one side of the Moon from Earth, and never the "far side".',keywords:['rotation','orbit','same period','synchronous rotation','tidal locking','face','Moon','Earth'],hint:'Compare the time it takes for the Moon to rotate once on its axis to the time it takes to orbit the Earth once. What happens when these two periods are exactly the same?'},
    {prompt:'Describe how life on Earth would be different if our planet had no axial tilt (i.e., if the axis was perfectly vertical).',keywords:['no seasons','same temperature','equator','poles','day length','year-round','axial tilt','climate','stable'],hint:'What does the 23.5° tilt cause? If the tilt were removed, what would happen to the seasons, and how would temperatures vary across the year at different latitudes?'},
    {prompt:'Describe the solar system in terms of the planets, the asteroid belt, and the Kuiper Belt.',keywords:['planets','asteroid belt','Mars','Jupiter','Kuiper Belt','Pluto','dwarf planet','comets','solar system'],hint:'Where is the asteroid belt located? What is the Kuiper Belt, and what types of objects are found there?'},
    {prompt:'Explain the difference between the rotation of the Earth and its revolution around the Sun.',keywords:['rotation','axis','day','night','revolution','orbit','year','seasons','24 hours','365 days'],hint:'What is the period of Earth\'s rotation, and what does it cause? What is the period of Earth\'s revolution, and what does it cause?'},
    {prompt:'Compare the inner rocky planets with the outer gas giants.',keywords:['inner planets','rocky','Mercury','Venus','Earth','Mars','outer planets','gas giants','Jupiter','Saturn','Uranus','Neptune','surface','atmosphere'],hint:'What are the main physical differences between the four planets closest to the Sun and the four furthest away?'},
    {prompt:'Explain why a solar eclipse does not happen every month.',keywords:['solar eclipse','new moon','alignment','Moon\'s orbit','tilt','shadow','Sun','Earth'],hint:'The Moon orbits Earth every month. Why does it not pass directly between the Sun and Earth every single month?'},
    {prompt:'Explain why the seasons in Botswana are reversed compared to those in Europe.',keywords:['seasons','axial tilt','Southern Hemisphere','Northern Hemisphere','Earth orbit','Sun','summer','winter','June','December'],hint:'How does Earth\'s tilted axis affect which hemisphere receives more direct sunlight at different times of the year?'},
    {prompt:'Discuss the importance of the Sun to life on Earth.',keywords:['Sun','light','heat','energy','photosynthesis','climate','weather','solar system','star','gravity'],hint:'What essential roles does the Sun play in supporting life, climate, and the structure of the solar system?'},
    {prompt:'Explain why astronomers use light years instead of kilometres to measure distances in space.',keywords:['light year','distance','space','km','trillion','light speed','astronomy','scale','vast'],hint:'How big is a light year in kilometres? Why is it more practical than using kilometres for space measurements?'},
    {prompt:'Describe the features of Mars that make it a candidate for human exploration.',keywords:['Mars','Red Planet','water','ice','atmosphere','CO₂','exploration','rover','habitat','soil','day length'],hint:'What is the atmosphere of Mars like? Is there any water? How long is a day on Mars compared to Earth?'},
    {prompt:'Explain why the Moon has no atmosphere or liquid water.',keywords:['Moon','atmosphere','gravity','low mass','escape','water','vacuum','moon rocks'],hint:'Why is the Moon\'s gravity too weak to hold onto an atmosphere?'},
    {prompt:'Compare a meteoroid, a meteor, and a meteorite.',keywords:['meteoroid','space','rock','meteor','shooting star','atmosphere','burn up','meteorite','impact','Earth'],hint:'What is the difference between the object in space, the streak of light, and the piece that reaches the ground?'},
    {prompt:'Describe the appearance and orbit of a comet.',keywords:['comet','ice','dust','tail','Sun','orbit','elliptical','gas','solar wind','vaporise'],hint:'What is a comet made of? What causes the tail to form, and why does the tail always point away from the Sun?'},
    {prompt:'Explain why the Sun is not a planet.',keywords:['Sun','star','fusion','light','heat','gas','planet','orbit','energy','nuclear'],hint:'What physical process does the Sun undergo that planets do not? What is the fundamental difference between a star and a planet?'},
    {prompt:'Describe the significance of the asteroid belt.',keywords:['asteroid belt','Mars','Jupiter','orbit','rocky','remnants','solar system','collision','gravity'],hint:'Where is the asteroid belt located, and what is it made of? Why might it exist there?'},
    {prompt:'Discuss how Earth\'s distance from the Sun affects its temperature.',keywords:['Earth','Sun','distance','habitable zone','temperature','water','climate','atmosphere','life'],hint:'What would happen to Earth\'s temperature if it were 10% closer to the Sun or 10% further away?'},
    {prompt:'Explain why Jupiter is classified as a gas giant.',keywords:['Jupiter','gas giant','hydrogen','helium','no solid surface','Great Red Spot','atmosphere','density','mass','magnetic field'],hint:'What is Jupiter made of? Does it have a solid surface like Earth? What are some of its prominent features?'},
    {prompt:'Describe the main differences between a lunar eclipse and a solar eclipse.',keywords:['lunar eclipse','solar eclipse','Earth','Moon','Sun','shadow','alignment','phases','red moon','blocked'],hint:'In which eclipse is the Moon in the shadow, and in which is the Sun blocked from view? Which one is more common?'},
    {prompt:'Explain why the outer planets have many moons while the inner planets have very few.',keywords:['outer planets','moons','gas giants','gravity','capture','Jupiter','Saturn','inner planets','Mars','Earth'],hint:'Why is it easier for large planets like Jupiter and Saturn to attract and hold moons in their orbits?'},
  ],
});
</script></body></html>
