{title:'Natural Selection & Adaptation',content:`<h2>How Species Change Over Time</h2><p><strong>Evolution</strong> = gradual change in species over millions of years</p><p><strong>Natural Selection (mechanism):</strong></p><ol><li>🎯 <strong>Variation</strong> — individuals in a species are different</li><li>🏆 <strong>Competition</strong> — limited resources, struggle for survival</li><li>✅ <strong>Survival of the fittest</strong> — best-adapted individuals survive & reproduce</li><li>🧬 <strong>Inheritance</strong> — useful traits pass to offspring</li><li>⏰ <strong>Accumulation</strong> — over millions of years = new species</li></ol><p><strong>Example:</strong> Peppered moths changed color during Industrial Revolution to blend with soot</p>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><circle cx="70" cy="100" r="18" fill="#d7ccc8" stroke="#8d6e63" stroke-width="2"/><text x="70" y="105" font-size="7" fill="#333" font-weight="bold" text-anchor="middle">Light</text><circle cx="100" cy="100" r="18" fill="#a1887f" stroke="#8d6e63" stroke-width="2"/><circle cx="130" cy="100" r="18" fill="#bcaaa4" stroke="#8d6e63" stroke-width="2"/><circle cx="160" cy="100" r="18" fill="#795548" stroke="#4e342e" stroke-width="2"/><circle cx="190" cy="100" r="18" fill="#3e2723" stroke="#1a1a1a" stroke-width="2"/><text x="190" y="105" font-size="7" fill="#fff" font-weight="bold" text-anchor="middle">Dark</text><text x="130" y="150" font-size="8" fill="#333" font-weight="bold" text-anchor="middle">Variation in Population</text><line x1="130" y1="120" x2="130" y2="160" stroke="#333" stroke-width="1.5"/><rect x="240" y="70" width="140" height="60" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2"/><text x="310" y="95" font-size="8" fill="#333" font-weight="bold" text-anchor="middle">Environment</text><text x="310" y="108" font-size="7" fill="#666">(Soot-covered trees)</text><circle cx="310" cy="160" r="20" fill="#4a4a4a" stroke="#1a1a1a" stroke-width="2"/><text x="310" y="165" font-size="7" fill="#fff" font-weight="bold" text-anchor="middle">Survivors</text><text x="310" y="210" font-size="7" fill="#555" text-anchor="middle">Dark moths blend better, survive</text></svg>`}
