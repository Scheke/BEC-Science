{title:'Photosynthesis Process',content:`<h2>Plants Making Food from Sunlight</h2><p><strong>Photosynthesis equation:</strong></p><p><strong>6CO₂ + 6H₂O + light energy → C₆H₁₂O₆ + 6O₂</strong></p><p><strong>What plants need:</strong></p><ul><li>☀️ <strong>Light energy</strong> — from the Sun</li><li>💧 <strong>Water</strong> — from soil</li><li>🌫️ <strong>Carbon dioxide</strong> — from air (through stomata)</li></ul><p><strong>What they produce:</strong> Glucose (food for energy) + Oxygen (we breathe!)</p><p><strong>Where:</strong> Happens in chloroplasts (the green parts) of leaf cells</p>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><circle cx="80" cy="60" r="32" fill="#ffc107" stroke="#ff9800" stroke-width="2"/><text x="80" y="65" font-size="9" fill="#333" font-weight="bold" text-anchor="middle">SUNLIGHT</text><polygon points="180,100 160,180 200,180" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/><polygon points="200,100 180,180 220,180" fill="#558b2f" stroke="#2e7d32" stroke-width="2"/><text x="190" y="155" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Leaf</text><rect x="160" y="60" width="100" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="210" y="85" font-size="8" fill="#333" font-weight="bold" text-anchor="middle">Chloroplast</text><text x="210" y="98" font-size="7" fill="#666">(Green)</text><circle cx="300" cy="100" r="18" fill="#81c784" stroke="#2e7d32" stroke-width="2"/><text x="300" y="105" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">O₂</text><circle cx="340" cy="100" r="18" fill="#fff59d" stroke="#fbc02d" stroke-width="2"/><text x="340" y="105" font-size="8" fill="#333" font-weight="bold" text-anchor="middle">Glucose</text><line x1="110" y1="60" x2="165" y2="90" stroke="#ff9800" stroke-width="2" marker-end="url(#a)"/><line x1="260" y1="90" x2="285" y2="100" stroke="#2e7d32" stroke-width="2" marker-end="url(#a)"/><line x1="260" y1="90" x2="325" y2="100" stroke="#2e7d32" stroke-width="2" marker-end="url(#a)"/><text x="100" y="210" font-size="8" fill="#555">CO₂ from air</text><text x="280" y="210" font-size="8" fill="#555">H₂O from soil</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#333"/></marker></defs></svg>`}
,{title:'Photosynthesis & Life',content:`<h2>Why Photosynthesis Matters</h2><p><strong>Without photosynthesis, there would be NO life on Earth!</strong></p><ul><li>🌱 <strong>Food production</strong> — plants make glucose they use for energy & growth</li><li>🍎 <strong>Our food</strong> — we eat plants or animals that eat plants</li><li>💨 <strong>Oxygen production</strong> — released as byproduct</li><li>⚖️ <strong>Carbon cycle</strong> — removes CO₂ from atmosphere</li></ul><p><strong>Amazing fact:</strong> Plants are called "producers" because they MAKE their own food, unlike animals who must EAT food</p>`,visual:`<svg viewBox="0 0 420 250" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="250" fill="#f5f5f5"/><polygon points="100,120 80,180 120,180" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/><text x="100" y="210" font-size="8" fill="#333" font-weight="bold" text-anchor="middle">Plant (Producer)</text><circle cx="200" cy="120" r="20" fill="#ff9800" stroke="#e65100" stroke-width="2"/><text x="200" y="125" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Herbivore</text><text x="200" y="210" font-size="8" fill="#333" text-anchor="middle">(Eats plant)</text><circle cx="300" cy="120" r="20" fill="#f44336" stroke="#c62828" stroke-width="2"/><text x="300" y="125" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Carnivore</text><text x="300" y="210" font-size="8" fill="#333" text-anchor="middle">(Eats animal)</text><line x1="120" y1="130" x2="180" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arr)"/><line x1="220" y1="130" x2="280" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arr)"/><circle cx="350" cy="80" r="12" fill="#81c784" stroke="#2e7d32" stroke-width="2"/><text x="350" y="85" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">O₂</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#333"/></marker></defs></svg>`}
