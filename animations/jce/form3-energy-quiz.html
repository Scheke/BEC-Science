<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Energy Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Energy — JCE Physics Quiz',
  color:'#f57f17',dark:'#bc5100',light:'#fff8e1',
    mcq:[
    {q:'The law of conservation of energy states that energy:',opts:['Can be created from nothing','Is destroyed when used','Cannot be created or destroyed, only transferred or transformed','Decreases with each transfer'],ans:2,exp:'CONSERVATION OF ENERGY: Energy cannot be created or destroyed — only transferred from one form to another. Total energy in a closed system stays constant.'},
    {q:'A motor receives 500 J of electrical energy and produces 350 J of kinetic energy. Its efficiency is:',opts:['30%','70%','150%','57%'],ans:1,exp:'Efficiency = (useful output / total input) × 100 = (350/500) × 100 = 70%.'},
    {q:'Which heat transfer method works through a vacuum?',opts:['Conduction','Convection','Radiation','All three'],ans:2,exp:'RADIATION travels as infrared electromagnetic waves and needs NO MEDIUM. Conduction needs physical contact between particles; convection needs fluid (liquid or gas) particles.'},
    {q:'Solar panels are painted black because black surfaces:',opts:['Reflect the most radiation','Absorb the most radiation','Conduct heat best','Produce electricity directly'],ans:1,exp:'MATT BLACK surfaces are the BEST ABSORBERS of radiation. They absorb maximum infrared radiation from sunlight → maximum heating of water or generation of electricity.'},
    {q:'Convection currents are caused by:',opts:['Hot fluid becoming denser','Conduction heating the fluid','Hot fluid becoming less dense and rising; cool fluid sinking','Radiation from the fluid surface'],ans:2,exp:'In convection, HEATING causes fluid to EXPAND → become LESS DENSE → RISE. Cooler, denser fluid sinks to replace it → CONVECTION CURRENT is established.'},
    {q:'A 2 kg book is held 3 m above the floor. What is its gravitational potential energy? (g = 10 N/kg)',opts:['6 J','60 J','600 J','30 J'],ans:1,exp:'GPE = mgh = 2 kg × 10 N/kg × 3 m = 60 J. This is the energy stored due to the book\'s height above the floor.'},
    {q:'When a pendulum swings, energy is transformed between:',opts:['Heat and light','Kinetic and gravitational potential','Chemical and electrical','Sound and kinetic'],ans:1,exp:'A pendulum continuously converts GRAVITATIONAL POTENTIAL ENERGY (at the highest point) into KINETIC ENERGY (at the lowest point) and back again. Ideally, total energy is conserved.'},
    {q:'Which of the following is a non-renewable energy source?',opts:['Solar power','Wind power','Natural gas','Hydroelectric power'],ans:2,exp:'NATURAL GAS is a FOSSIL FUEL. It is a NON-RENEWABLE energy source because it takes millions of years to form and cannot be replenished on a human timescale.'},
    {q:'A car engine is 25% efficient. This means:',opts:['75% of the fuel energy is wasted as heat and sound','The car uses 25% of the energy it receives','The car wastes 25% of the fuel','The car creates 25% more energy'],ans:0,exp:'If efficiency is 25%, then 75% of the energy input is NOT converted into useful work. It is WASTED, usually as HEAT and SOUND. Efficiency is never 100%.'},
    {q:'Energy from the Sun travels to Earth by:',opts:['Conduction','Convection','Radiation','Wind'],ans:2,exp:'The Sun\'s energy reaches Earth through the vacuum of space via RADIATION (infrared and other electromagnetic waves). No medium is required for radiation, unlike conduction and convection.'},
    {q:'The kinetic energy of an object depends on its:',opts:['Mass and height','Mass and velocity','Weight and height','Velocity and height'],ans:1,exp:'KE = ½mv². Kinetic energy depends on the object\'s MASS and the SQUARE of its VELOCITY. Doubling the velocity quadruples the kinetic energy (since v is squared).'},
    {q:'When coal is burned, the energy stored in the coal is transformed into:',opts:['Electricity and sound','Heat and light energy','Nuclear energy','Kinetic energy only'],ans:1,exp:'Burning coal is a chemical reaction that releases stored CHEMICAL ENERGY as HEAT and LIGHT energy. In a power station, this heat is used to produce steam, which drives turbines to generate electricity.'},
    {q:'Which device converts electrical energy into sound energy?',opts:['Electric heater','Loudspeaker','Light bulb','Motor'],ans:1,exp:'A LOUDSPEAKER converts ELECTRICAL energy into SOUND energy. A heater converts electrical to heat; a bulb converts electrical to light; a motor converts electrical to kinetic.'},
    {q:'A 50 kg athlete runs at 4 m/s. What is her kinetic energy?',opts:['100 J','200 J','400 J','800 J'],ans:2,exp:'KE = ½ × 50 kg × (4 m/s)² = 25 × 16 = 400 J. The athlete has 400 J of kinetic energy.'},
    {q:'Which of the following is a renewable source of energy?',opts:['Oil','Natural gas','Coal','Geothermal'],ans:3,exp:'GEOTHERMAL energy is RENEWABLE. It is heat from deep within the Earth that can be used to generate electricity or heat buildings. Oil, gas, and coal are non-renewable fossil fuels.'},
    {q:'Efficiency can be calculated using the formula:',opts:['(Useful output energy / Total input energy) × 100%','(Total input / Useful output) × 100%','(Energy wasted / Useful output) × 100%','(Energy input / Energy wasted) × 100%'],ans:0,exp:'Efficiency (%) = (Useful energy output / Total energy input) × 100%. It is always less than 100% because some energy is always wasted.'},
    {q:'A light bulb uses 100 J of electrical energy but produces only 10 J of light. The remaining 90 J is:',opts:['Stored as chemical energy','Wasted as heat energy','Converted into sound energy','Lost forever'],ans:1,exp:'The 90 J is WASTED as HEAT energy. This is why incandescent bulbs get hot. The law of conservation of energy means the energy is not destroyed — it is transformed into less useful forms.'},
    {q:'In a hydroelectric power station, the main energy conversion is:',opts:['Electrical → Kinetic','Gravitational potential → Kinetic → Electrical','Chemical → Kinetic','Nuclear → Electrical'],ans:1,exp:'Water stored behind a dam has GRAVITATIONAL POTENTIAL ENERGY. As it flows down, this becomes KINETIC ENERGY, which spins turbines to generate ELECTRICAL energy.'},
    {q:'A 1200 kg car has a kinetic energy of 240,000 J. What is its speed?',opts:['10 m/s','20 m/s','40 m/s','5 m/s'],ans:1,exp:'KE = ½mv² → 240,000 = ½ × 1200 × v² → 240,000 = 600 × v² → v² = 400 → v = 20 m/s.'},
    {q:'The main disadvantage of using renewable energy sources is:',opts:['They produce more pollution than fossil fuels','They are often intermittent (e.g., no sun/wind at certain times)','They are unlimited in supply','They produce no waste'],ans:1,exp:'Many renewable sources are INTERMITTENT. Solar power only works during the day and is less effective on cloudy days. Wind power requires a minimum wind speed. This makes them less reliable for base-load electricity without energy storage.'},
  ],
  match:[
    {term:'Kinetic energy',def:'The energy an object possesses due to its motion; calculated using KE = ½mv²'},
    {term:'Gravitational potential energy',def:'The energy stored in an object due to its height in a gravitational field; GPE = mgh'},
    {term:'Law of conservation of energy',def:'Energy cannot be created or destroyed; it can only be transferred or transformed from one form to another'},
    {term:'Efficiency',def:'A measure of how much useful energy is obtained compared to the total energy input; calculated as (useful output / total input) × 100%'},
    {term:'Conduction',def:'Heat transfer through solids by the vibration and collision of particles'},
    {term:'Convection',def:'Heat transfer in fluids (liquids and gases) by the movement of less dense, warm fluid rising and denser, cool fluid sinking'},
    {term:'Radiation',def:'Heat transfer by infrared electromagnetic waves; can travel through a vacuum and does not require a medium'},
    {term:'Renewable energy',def:'Energy sources that are naturally replenished on a human timescale, such as solar, wind, and hydroelectric power'},
    {term:'Non-renewable energy',def:'Energy sources that are finite and will eventually run out, such as coal, oil, and natural gas'},
    {term:'Fossil fuels',def:'Non-renewable energy sources formed from the remains of ancient organisms; include coal, oil, and natural gas'},
    {term:'Solar power',def:'Energy harnessed from sunlight, using solar panels to convert light into electricity or heat'},
    {term:'Wind power',def:'Energy harnessed from the movement of air using wind turbines to generate electricity'},
    {term:'Hydroelectric power',def:'Energy generated by harnessing the gravitational potential energy of water stored at a height, turning turbines'},
    {term:'Geothermal energy',def:'Renewable energy derived from the natural heat stored deep within the Earth'},
    {term:'Greenhouse effect',def:'The trapping of infrared radiation by greenhouse gases (like CO₂) in the atmosphere, leading to global warming'},
    {term:'Global warming',def:'The gradual increase in the Earth\'s average temperature, largely caused by the increased emission of greenhouse gases'},
    {term:'Thermal conductivity',def:'A measure of how well a material conducts heat; metals have high thermal conductivity'},
    {term:'Useful energy',def:'The portion of energy that is successfully converted into the desired form for a specific purpose'},
    {term:'Wasted energy',def:'Energy that is not converted into useful work and is usually lost to the surroundings as heat or sound'},
    {term:'Insulator',def:'A material that does not conduct heat well, such as wood, plastic, or air'},
  ],
  flashcards:[
    {q:'State the formula for gravitational potential energy and provide an example calculation.',a:'GPE = mgh. Where m = mass (kg), g = gravitational field strength (10 N/kg on Earth), h = height (m). Example: A 2 kg book raised 3 m: GPE = 2 × 10 × 3 = 60 J.'},
    {q:'Name 4 renewable and 3 non-renewable energy sources.',a:'RENEWABLE: Solar, wind, hydroelectric, geothermal, tidal, biomass, wave. NON-RENEWABLE: Coal, oil, natural gas (fossil fuels), and nuclear. Non-renewables are finite and will eventually run out; renewables are naturally replenished.'},
    {q:'Why is energy always wasted in real-world systems?',a:'All real energy transfers lose some energy as HEAT due to friction, air resistance, and electrical resistance. No system is 100% efficient. The "wasted" energy dissipates into the surroundings, becoming less useful (often as low-grade heat).'},
    {q:'Calculate the kinetic energy of a 1000 kg car travelling at 20 m/s.',a:'KE = ½mv² = 0.5 × 1000 kg × (20 m/s)² = 500 × 400 = 200,000 J = 200 kJ. This is the energy of the car due to its motion.'},
    {q:'Explain how a vacuum flask (Thermos) reduces all three types of heat transfer.',a:'CONDUCTION: The double-walled construction has a VACUUM between the walls; no particles means no conduction. CONVECTION: The vacuum also prevents convection as there is no fluid. RADIATION: The silvered (shiny) walls REFLECT infrared radiation back into the flask, minimising heat loss.'},
    {q:'Describe the energy changes that take place when a ball is thrown upwards.',a:'When thrown, the ball has KINETIC ENERGY (KE). As it rises, KE is converted into GRAVITATIONAL POTENTIAL ENERGY (GPE). At the highest point, GPE is maximum and KE is zero. On the way down, GPE is converted back into KE. Just before landing, KE is maximum.'},
    {q:'Calculate the efficiency of a machine that receives 800 J of input energy and does 600 J of useful work.',a:'Efficiency = (Useful output / Total input) × 100% = (600 J / 800 J) × 100% = 75%. The machine is 75% efficient; 25% of the energy is wasted.'},
    {q:'Explain why solar panels are mounted facing the equator in Botswana.',a:'Botswana is in the Southern Hemisphere. Solar panels are tilted facing NORTH to capture the maximum amount of sunlight throughout the day. They are also angled to collect more light during winter months when the sun is lower in the sky.'},
    {q:'What are the advantages and disadvantages of using wind power?',a:'ADVANTAGES: Renewable, no CO₂ emissions, low running costs once installed. DISADVANTAGES: Intermittent (doesn\'t blow all the time), noisy, visually polluting, requires large land areas, and can harm birds/bats.'},
    {q:'Explain the difference between energy and power.',a:'ENERGY (measured in Joules, J) is the capacity to do work. POWER (measured in Watts, W) is the RATE at which energy is transferred or work is done. Power = Energy / Time.'},
    {q:'Why do incandescent bulbs have a low efficiency?',a:'Incandescent bulbs are very inefficient because most of the electrical energy is converted into HEAT rather than light. Typically, less than 10% of the electrical input is converted into visible light, while over 90% is wasted as heat.'},
    {q:'Calculate the gravitational potential energy of a 75 kg person standing on a 4 m high diving board. (g = 10 N/kg)',a:'GPE = mgh = 75 kg × 10 N/kg × 4 m = 3000 J. The person has 3000 J of gravitational potential energy relative to the water below.'},
    {q:'Explain how the greenhouse effect leads to global warming.',a:'Greenhouse gases (CO₂, methane) in the atmosphere act like a greenhouse. They allow short-wave solar radiation to enter but ABSORB the long-wave INFRARED radiation emitted by the Earth\'s surface. This trapped heat increases the Earth\'s average temperature, leading to global warming.'},
    {q:'A car travels at 20 m/s and has a kinetic energy of 300,000 J. What is the mass of the car?',a:'KE = ½mv² → 300,000 = ½ × m × 20² → 300,000 = 200 × m → m = 1500 kg.'},
    {q:'State two ways to improve the efficiency of an electric motor.',a:'1. Reduce friction in moving parts by using lubricants/oil. 2. Reduce electrical resistance in the coils by using thicker, lower-resistance wires. 3. Use magnets with a higher magnetic field strength.'},
    {q:'A 5 kg object falls from a height of 10 m. Assuming no air resistance, calculate its kinetic energy just before it hits the ground.',a:'GPE = mgh = 5 × 10 × 10 = 500 J. By conservation of energy, the GPE at the top is converted entirely into KE just before impact. So KE = 500 J.'},
    {q:'Explain why energy is described as "conserved" but not "saved".',a:'Energy is CONSERVED because it cannot be created or destroyed; the total amount in a closed system remains constant. However, it is not "saved" in the sense of remaining useful, because it often dissipates into the environment as less useful heat.'},
    {q:'What is the main advantage of hydroelectric power over fossil fuels?',a:'Hydroelectric power is a RENEWABLE energy source, meaning it does not run out. It also does not emit CO₂ or other pollutants into the atmosphere, unlike burning fossil fuels, which contributes to global warming.'},
    {q:'Define "work" in physics and state its unit.',a:'WORK is done when a force causes an object to move in the direction of the force. Work = Force × distance (W = Fd). The unit is the JOULE (J). 1 Joule = 1 Newton × 1 metre.'},
    {q:'A 100 W light bulb is left on for 1 hour (3600 seconds). How much energy does it use?',a:'Energy = Power × Time = 100 W × 3600 s = 360,000 J = 360 kJ. This is the total electrical energy converted into light and heat by the bulb.'},
  ],
  blanks:{
    passage:'The law of conservation of energy states that energy cannot be created or [_]. Heat transfer through solids by particle vibration is called [_]. Heat transfer that requires no medium and travels as infrared waves is called [_]. The efficiency of a machine is calculated as the useful energy [_] divided by the total energy input, multiplied by 100. Energy sources like solar and wind are considered [_] because they will not run out.',
    answers:['destroyed','Conduction','Radiation','output','Renewable'],
    wordbank:['destroyed','Conduction','Radiation','output','Renewable','convection','input','fossil'],
  },
  sentences:[
    {prompt:'Explain how a greenhouse traps heat energy from the Sun and why this contributes to global warming when greenhouse gases increase.',keywords:['short-wave','infrared','glass','transmit','absorb','re-radiate','greenhouse effect','global warming'],hint:'What type of solar radiation passes through the glass? What type of radiation is emitted by the warm surfaces inside, and why can\'t it escape?'},
    {prompt:'A ball is dropped from a height of 5 m. Assuming no air resistance, calculate its velocity just before it hits the ground.',keywords:['GPE = KE','mgh = ½mv²','10 m/s','conservation of energy','velocity','g=10 N/kg'],hint:'Set the gravitational potential energy at the top equal to the kinetic energy at the bottom. Solve for velocity (v). The mass will cancel out.'},
    {prompt:'Explain why the burning of fossil fuels for energy is a major concern for the environment and the global climate.',keywords:['CO₂','greenhouse effect','non-renewable','global warming','finite','climate change','pollution'],hint:'What gas is released when fossil fuels are burned? What effect does this gas have on the Earth\'s temperature? Why is the supply of fossil fuels a problem?'},
    {prompt:'A 60 kg person climbs a flight of stairs to a height of 5 m. Calculate the gravitational potential energy gained.',keywords:['GPE','mgh','60 kg','5 m','10 N/kg','3000 J','calculation'],hint:'Use the formula GPE = mgh.'},
    {prompt:'Explain why a solar water heater is painted black, and why it is often covered with a glass panel.',keywords:['black','absorbs','infrared','radiation','glass','trap','heat','greenhouse effect'],hint:'Which surface absorbs the most radiation? How does the glass panel reduce heat loss?'},
    {prompt:'A car engine is 30% efficient. If 1000 J of energy is released from burning fuel, how much energy is wasted as heat and sound?',keywords:['efficiency','useful output','wasted energy','heat','sound','30%','700 J'],hint:'If 30% is useful, what percentage is wasted? Calculate the wasted energy as a fraction of the 1000 J input.'},
    {prompt:'Describe the energy transformations that occur when a pendulum swings from the highest point to the lowest point.',keywords:['GPE','KE','transformation','conservation','swing','highest point','lowest point'],hint:'What type of energy is maximum at the highest point? What type of energy is maximum at the lowest point?'},
    {prompt:'Compare the advantages of using renewable energy sources like solar and wind with the disadvantages.',keywords:['renewable','solar','wind','clean','intermittent','reliable','storage','cost'],hint:'What are the environmental benefits? What is the main challenge with their reliability?'},
    {prompt:'Calculate the efficiency of a light bulb that consumes 150 J of electrical energy and produces 30 J of light energy.',keywords:['efficiency','useful output','30 J','total input','150 J','20%','calculation'],hint:'Use the formula: Efficiency = (Useful output energy / Total input energy) × 100%.'},
    {prompt:'A 500 kg car travels at a speed of 10 m/s. Calculate its kinetic energy.',keywords:['KE','½mv²','500 kg','10 m/s','25,000 J','calculation'],hint:'Use the formula KE = ½mv².'},
    {prompt:'Explain why a kettle heating water is less than 100% efficient.',keywords:['kettle','efficiency','heat loss','wasted energy','electricity','thermal energy'],hint:'Where does the energy go that does not heat the water? Think about the kettle itself, the surroundings, and steam.'},
    {prompt:'Describe how a hydroelectric power station converts energy from water to electricity.',keywords:['hydroelectric','GPE','kinetic','turbine','generator','electricity','reservoir','gravity'],hint:'What type of energy does water stored in a dam have? What happens to this energy as the water flows down?'},
    {prompt:'State the law of conservation of energy and use it to explain why a ball dropped from a height of 2 m cannot bounce back to a height of 2 m.',keywords:['conservation of energy','bounce','height','lost','heat','sound','energy transfer'],hint:'If energy is conserved, why is the bounce lower? Where does the "missing" energy go when the ball hits the ground?'},
    {prompt:'A person lifts a 10 kg box onto a shelf 2 m high. How much work is done?',keywords:['work','force','distance','F=mg','10 kg','2 m','200 J','g=10 N/kg'],hint:'Work = Force × distance. The force is the weight of the box (mass × g).'},
    {prompt:'Explain how a photovoltaic (solar) cell converts sunlight into electricity.',keywords:['photovoltaic','solar cell','light energy','electrical energy','semiconductor','electrons','photons'],hint:'What type of energy does the solar cell absorb? What happens to the electrons in the semiconductor material when they absorb light energy?'},
    {prompt:'Why are metal cooking pots often made with handles made of wood or plastic?',keywords:['metal','conductor','handle','wood','plastic','insulator','heat transfer','conduction'],hint:'Which material conducts heat well? Which material is a poor conductor?'},
    {prompt:'Calculate the kinetic energy of a 1500 kg car moving at 30 m/s.',keywords:['KE','½mv²','1500 kg','30 m/s','675,000 J','calculation'],hint:'Use the formula KE = ½mv². Remember to square the velocity first.'},
    {prompt:'Explain what is meant by the term "energy dissipation" and give an example.',keywords:['dissipation','wasted energy','heat','spread out','friction','environment','useful'],hint:'What happens to energy that is not converted into useful work? How does it spread out in the environment?'},
    {prompt:'Describe the energy changes that occur when a car is driven up a hill.',keywords:['chemical','fuel','heat','kinetic','GPE','wasted','transformation'],hint:'What is the initial energy source? What useful energy forms does it convert into? What energy is wasted?'},
    {prompt:'A 100 W electric motor runs for 2 seconds. How much energy does it use?',keywords:['energy','power','time','100 W','2 s','200 J','calculation'],hint:'Energy = Power × Time.'},
  ],
});
</script></body></html>
