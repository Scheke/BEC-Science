<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Circulatory System — BEC Study</title>
<style>*,*::before,*::after{box-sizing:border-box}</style>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="../study-engine.js"></script>
<script>
function bg(sk,c){sk.background(...(c||[18,8,8]))}

const STEPS=[
  {
    title:'The Heart — Structure & Function',
    body:`The <strong>heart</strong> is a muscular pump that circulates blood around the body.
    <br><br>
    Four chambers:
    <ul style="margin:6px 0 0 18px;line-height:2.2">
      <li><strong>Right atrium</strong> — receives deoxygenated blood from body (via vena cava)</li>
      <li><strong>Right ventricle</strong> — pumps blood to the lungs (via pulmonary artery)</li>
      <li><strong>Left atrium</strong> — receives oxygenated blood from lungs (via pulmonary vein)</li>
      <li><strong>Left ventricle</strong> — pumps oxygenated blood to the body (via aorta); thickest wall</li>
    </ul>
    <strong>Valves</strong> (bicuspid, tricuspid, semi-lunar) prevent backflow of blood.`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      const beat=Math.sin(t*3)*0.1+0.95;
      // Heart outline
      sk.fill(180,30,30,180);sk.noStroke();
      sk.arc(W*0.38,H*0.38,W*0.22*beat,H*0.3*beat,sk.PI,0);
      sk.arc(W*0.52,H*0.38,W*0.22*beat,H*0.3*beat,sk.PI,0);
      sk.triangle(W*0.27*beat+W*(1-beat)*0.27,H*0.38,W*0.63*beat+W*(1-beat)*0.63,H*0.38,W*0.45,H*0.72*beat+H*(1-beat)*0.72);
      // Right / Left sides divider
      sk.stroke(100,0,0,200);sk.strokeWeight(1.5);sk.noFill();
      sk.line(W*0.45,H*0.3,W*0.45,H*0.7);
      // Chambers
      sk.fill(255);sk.textSize(8.5);sk.textStyle(sk.NORMAL);sk.textAlign(sk.CENTER,sk.CENTER);
      sk.text('RA',W*0.35,H*0.35);
      sk.text('LA',W*0.55,H*0.35);
      sk.text('RV',W*0.36,H*0.56);
      sk.text('LV',W*0.54,H*0.56);
      // Vessels
      // Vena cava → RA
      sk.stroke(52,100,200,200);sk.strokeWeight(5);sk.noFill();
      sk.line(W*0.22,H*0.35,W*0.32,H*0.35);
      sk.fill(52,100,200);sk.textSize(7.5);sk.textAlign(sk.RIGHT);sk.text('Vena\ncava',W*0.2,H*0.35);
      // Pulmonary artery → lungs
      sk.stroke(52,100,200,200);sk.strokeWeight(4);
      sk.line(W*0.36,H*0.28,W*0.24,H*0.18);
      sk.fill(52,100,200);sk.textSize(7.5);sk.textAlign(sk.LEFT);sk.text('Pulm.\nartery',W*0.13,H*0.16);
      // Pulmonary vein → LA
      sk.stroke(220,50,50,200);sk.strokeWeight(4);
      sk.line(W*0.76,H*0.18,W*0.6,H*0.28);
      sk.fill(220,50,50);sk.textAlign(sk.RIGHT);sk.text('Pulm.\nvein',W*0.88,H*0.16);
      // Aorta
      sk.stroke(220,50,50,200);sk.strokeWeight(5);
      sk.line(W*0.54,H*0.28,W*0.7,H*0.28);
      sk.fill(220,50,50);sk.textAlign(sk.LEFT);sk.text('Aorta',W*0.72,H*0.28);
      // Animated blood drops
      const bloodT=(t*0.4)%1;
      sk.fill(220,50,50,200);sk.noStroke();sk.circle(W*0.64+bloodT*W*0.08,H*0.28,8);
      sk.fill(52,100,200,200);sk.circle(W*0.22+bloodT*W*0.1,H*0.35,8);
    }
  },
  {
    title:'Blood Vessels',
    body:`Three types of blood vessels:
    <br><br>
    <table style="width:100%;border-collapse:collapse;font-size:.78rem;margin-top:4px">
      <thead><tr style="background:#880000;color:#fff"><th style="padding:5px 8px;border:1px solid #444">Vessel</th><th style="padding:5px 8px;border:1px solid #444">Direction</th><th style="padding:5px 8px;border:1px solid #444">Wall</th><th style="padding:5px 8px;border:1px solid #444">Other features</th></tr></thead>
      <tbody>
        <tr><td style="padding:4px 8px;border:1px solid #ddd;font-weight:700">Artery</td><td style="padding:4px 8px;border:1px solid #ddd">Away from heart</td><td style="padding:4px 8px;border:1px solid #ddd">Thick, muscular, elastic</td><td style="padding:4px 8px;border:1px solid #ddd">High pressure, no valves</td></tr>
        <tr style="background:#1a0a0a"><td style="padding:4px 8px;border:1px solid #ddd;font-weight:700">Vein</td><td style="padding:4px 8px;border:1px solid #ddd">Toward heart</td><td style="padding:4px 8px;border:1px solid #ddd">Thin, less muscle</td><td style="padding:4px 8px;border:1px solid #ddd">Low pressure, HAS valves, wide lumen</td></tr>
        <tr><td style="padding:4px 8px;border:1px solid #ddd;font-weight:700">Capillary</td><td style="padding:4px 8px;border:1px solid #ddd">Between artery/vein</td><td style="padding:4px 8px;border:1px solid #ddd">One cell thick</td><td style="padding:4px 8px;border:1px solid #ddd">Exchange of O₂, CO₂, glucose, waste</td></tr>
      </tbody>
    </table>`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      const vessels=[
        {n:'ARTERY',c:[220,50,50],x:0.2,wall:18,lumen:16,desc:'Thick walls\nHigh pressure\nNo valves'},
        {n:'VEIN',c:[52,100,200],x:0.5,wall:8,lumen:22,desc:'Thin walls\nLow pressure\nHas valves'},
        {n:'CAPILLARY',c:[200,150,150],x:0.8,wall:1,lumen:6,desc:'1 cell thick\nExchange\nsite'},
      ];
      vessels.forEach((v,i)=>{
        const cx=v.x*W,cy=H*0.5;
        const pulse=v.n==='ARTERY'?1+Math.sin(t*3)*0.08:1;
        // Outer wall
        sk.fill(...v.c,80);sk.noStroke();sk.circle(cx,cy,(v.lumen+v.wall*2)*pulse);
        // Lumen
        sk.fill(180,0,0,160);sk.circle(cx,cy,v.lumen*pulse);
        // Animated blood cell
        const bAngle=t*2+i*2;
        const bx=cx+Math.cos(bAngle)*v.lumen*0.3*pulse;
        const by=cy+Math.sin(bAngle)*v.lumen*0.3*pulse;
        sk.fill(255,100,100,220);sk.circle(bx,by,v.lumen*0.35*pulse);
        // Label
        sk.fill(255);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
        sk.text(v.n,cx,H*0.15);
        sk.textSize(8);sk.textStyle(sk.NORMAL);sk.text(v.desc,cx,H*0.76);
      });
    }
  },
  {
    title:'Blood — Components & Functions',
    body:`Blood has four main components:
    <br><br>
    <ol style="margin:6px 0 0 18px;line-height:2.3">
      <li><strong>Red blood cells (RBCs)</strong> — biconcave, no nucleus; carry haemoglobin (Hb) to transport O₂ and some CO₂</li>
      <li><strong>White blood cells (WBCs)</strong> — larger, have nucleus; defend against infection by phagocytosis or producing antibodies</li>
      <li><strong>Platelets</strong> — tiny cell fragments; clotting to prevent blood loss</li>
      <li><strong>Plasma</strong> — liquid portion (~55% of blood); transports dissolved substances (glucose, hormones, CO₂, urea, ions, antibodies)</li>
    </ol>`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Plasma
      sk.fill(255,220,100,30);sk.noStroke();sk.rect(W*0.08,H*0.18,W*0.84,H*0.65,8);
      sk.fill(255,220,100,100);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('Plasma (55%)',W*0.5,H*0.12);
      // RBCs
      for(let i=0;i<12;i++){
        const x=W*0.12+i%6*(W*0.13),y=H*0.3+Math.floor(i/6)*H*0.12;
        const pulse=1+Math.sin(t+i*0.5)*0.07;
        sk.fill(220,60,60,200);sk.noStroke();sk.ellipse(x,y,24*pulse,16*pulse);
        sk.fill(220,60,60,40);sk.ellipse(x,y,10*pulse,8*pulse);
      }
      sk.fill(220,60,60);sk.textSize(8.5);sk.textAlign(sk.CENTER);sk.text('RBCs (O₂ transport)',W*0.42,H*0.52);
      // WBCs
      for(let i=0;i<3;i++){
        const x=W*0.66+i*W*0.1,y=H*0.36+Math.sin(t+i)*8;
        const pulse=1+Math.sin(t*1.2+i)*0.08;
        sk.fill(200,230,200,200);sk.noStroke();sk.circle(x,y,28*pulse);
        // Lobed nucleus
        sk.fill(100,160,100,200);sk.circle(x-5,y-3,14*pulse);
        sk.circle(x+5,y+3,12*pulse);
      }
      sk.fill(200,230,200);sk.textSize(8.5);sk.textAlign(sk.CENTER);sk.text('WBCs (defence)',W*0.75,H*0.52);
      // Platelets
      for(let i=0;i<6;i++){
        const x=W*0.12+i*W*0.13,y=H*0.65+Math.sin(t*2+i)*6;
        sk.fill(255,200,100,200);sk.noStroke();sk.circle(x,y,8);
      }
      sk.fill(255,200,100);sk.textSize(8.5);sk.textAlign(sk.CENTER);sk.text('Platelets (clotting)',W*0.5,H*0.78);
    }
  },
  {
    title:'The Heart — 4 Chambers Labeled',
    content:`<h3 style="color:#2e7d32;margin:0 0 6px">Heart Cross-Section: 4 Chambers</h3><p style="margin:0;font-size:.85rem">The heart has two sides separated by the septum. The <strong>right side</strong> handles deoxygenated blood (shown in blue); the <strong>left side</strong> handles oxygenated blood (shown in red). Valves prevent backflow at every exit.</p>`,
    visual:`<svg viewBox="0 0 420 240" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#c62828"/>
    </marker>
    <marker id="arr-b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#1565c0"/>
    </marker>
  </defs>
  <!-- Heart outline -->
  <ellipse cx="210" cy="125" rx="110" ry="100" fill="#b71c1c" opacity="0.18" stroke="#b71c1c" stroke-width="2"/>
  <!-- Septum -->
  <line x1="210" y1="48" x2="210" y2="210" stroke="#7f0000" stroke-width="3"/>
  <!-- RIGHT side (blue deoxygenated) -->
  <rect x="105" y="60" width="100" height="55" rx="10" fill="#1565c0" opacity="0.75"/>
  <text x="155" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">RIGHT ATRIUM</text>
  <text x="155" y="95" text-anchor="middle" font-size="8" fill="#bbdefb">Receives deoxy blood</text>
  <text x="155" y="106" text-anchor="middle" font-size="8" fill="#bbdefb">from vena cava</text>
  <rect x="105" y="128" width="100" height="70" rx="10" fill="#1e88e5" opacity="0.75"/>
  <text x="155" y="152" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">RIGHT VENTRICLE</text>
  <text x="155" y="165" text-anchor="middle" font-size="8" fill="#bbdefb">Pumps to lungs via</text>
  <text x="155" y="176" text-anchor="middle" font-size="8" fill="#bbdefb">pulmonary artery</text>
  <text x="155" y="187" text-anchor="middle" font-size="8" fill="#e3f2fd">(thin walls)</text>
  <!-- LEFT side (red oxygenated) -->
  <rect x="215" y="60" width="100" height="55" rx="10" fill="#c62828" opacity="0.75"/>
  <text x="265" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">LEFT ATRIUM</text>
  <text x="265" y="95" text-anchor="middle" font-size="8" fill="#ffcdd2">Receives oxy blood</text>
  <text x="265" y="106" text-anchor="middle" font-size="8" fill="#ffcdd2">from pulm. veins</text>
  <rect x="215" y="128" width="100" height="70" rx="10" fill="#e53935" opacity="0.75"/>
  <text x="265" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">LEFT VENTRICLE</text>
  <text x="265" y="163" text-anchor="middle" font-size="8" fill="#ffcdd2">Pumps to whole body</text>
  <text x="265" y="174" text-anchor="middle" font-size="8" fill="#ffcdd2">via aorta</text>
  <text x="265" y="185" text-anchor="middle" font-size="8" fill="#ffebee">(THICKEST walls)</text>
  <!-- Tricuspid valve label -->
  <line x1="210" y1="117" x2="175" y2="130" stroke="#ffd54f" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="130" y="124" font-size="7.5" fill="#ffd54f">Tricuspid</text>
  <!-- Bicuspid valve label -->
  <line x1="210" y1="117" x2="245" y2="130" stroke="#ffd54f" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="248" y="124" font-size="7.5" fill="#ffd54f">Bicuspid/Mitral</text>
  <!-- Vessels labels -->
  <text x="50" y="45" font-size="8" fill="#90caf9" text-anchor="middle">Vena Cava</text>
  <line x1="50" y1="48" x2="105" y2="75" stroke="#1565c0" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="155" y="25" font-size="8" fill="#90caf9" text-anchor="middle">Pulmonary Artery</text>
  <line x1="145" y1="28" x2="135" y2="58" stroke="#1565c0" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="265" y="25" font-size="8" fill="#ef9a9a" text-anchor="middle">Pulmonary Veins</text>
  <line x1="265" y1="28" x2="265" y2="58" stroke="#c62828" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="370" y="45" font-size="8" fill="#ef9a9a" text-anchor="middle">Aorta</text>
  <line x1="355" y1="48" x2="315" y2="75" stroke="#c62828" stroke-width="2" marker-end="url(#arr-r)"/>
  <!-- Semilunar valve note -->
  <text x="210" y="230" text-anchor="middle" font-size="8" fill="#a5d6a7">Semilunar valves at exits to pulmonary artery &amp; aorta prevent backflow</text>
</svg>`
  },
  {
    title:'Double Circulation — Pulmonary and Systemic',
    content:`<h3 style="color:#2e7d32;margin:0 0 6px">Double Circulation: Figure-8 Pattern</h3><p style="margin:0;font-size:.85rem">Blood passes through the heart <strong>twice</strong> per complete circuit. This maintains high pressure when delivering blood to all body organs. Blue = deoxygenated; Red = oxygenated.</p>`,
    visual:`<svg viewBox="0 0 420 250" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#c62828"/>
    </marker>
    <marker id="arr-blue2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#1565c0"/>
    </marker>
  </defs>
  <!-- HEART centre -->
  <rect x="160" y="98" width="100" height="54" rx="14" fill="#7f0000" stroke="#c62828" stroke-width="2"/>
  <text x="210" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">HEART</text>
  <text x="210" y="133" text-anchor="middle" font-size="8.5" fill="#ffcdd2">Right side | Left side</text>
  <line x1="210" y1="98" x2="210" y2="152" stroke="#ffcdd2" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- LUNGS top -->
  <rect x="145" y="15" width="130" height="44" rx="12" fill="#1565c0" opacity="0.7"/>
  <text x="210" y="34" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">LUNGS</text>
  <text x="210" y="47" text-anchor="middle" font-size="8" fill="#bbdefb">Picks up O&#x2082;, drops CO&#x2082;</text>
  <!-- BODY bottom -->
  <rect x="145" y="191" width="130" height="44" rx="12" fill="#2e7d32" opacity="0.7"/>
  <text x="210" y="210" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">BODY ORGANS</text>
  <text x="210" y="224" text-anchor="middle" font-size="8" fill="#a5d6a7">Drops O&#x2082;, picks up CO&#x2082;</text>
  <!-- PULMONARY LOOP arrows -->
  <!-- Right heart → Lungs (deoxygenated, blue, left path) -->
  <path d="M178 98 Q120 80 158 59" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arr-blue2)"/>
  <text x="118" y="73" font-size="8" fill="#90caf9" text-anchor="middle">Pulmonary</text>
  <text x="118" y="83" font-size="8" fill="#90caf9" text-anchor="middle">Artery</text>
  <!-- Lungs → Left heart (oxygenated, red, right path) -->
  <path d="M263 59 Q300 80 242 98" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="303" y="73" font-size="8" fill="#ef9a9a" text-anchor="middle">Pulmonary</text>
  <text x="303" y="83" font-size="8" fill="#ef9a9a" text-anchor="middle">Vein</text>
  <!-- SYSTEMIC LOOP arrows -->
  <!-- Left heart → Body (oxygenated, red, right path) -->
  <path d="M242 152 Q300 168 263 191" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="304" y="167" font-size="8" fill="#ef9a9a" text-anchor="middle">Aorta</text>
  <!-- Body → Right heart (deoxygenated, blue, left path) -->
  <path d="M158 191 Q120 168 178 152" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arr-blue2)"/>
  <text x="115" y="167" font-size="8" fill="#90caf9" text-anchor="middle">Vena Cava</text>
  <!-- Labels -->
  <rect x="2" y="48" width="95" height="28" rx="6" fill="#0d47a1" opacity="0.5"/>
  <text x="49" y="60" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#e3f2fd">PULMONARY</text>
  <text x="49" y="72" text-anchor="middle" font-size="8" fill="#bbdefb">CIRCULATION</text>
  <rect x="323" y="158" width="95" height="28" rx="6" fill="#1b5e20" opacity="0.5"/>
  <text x="370" y="170" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#e8f5e9">SYSTEMIC</text>
  <text x="370" y="182" text-anchor="middle" font-size="8" fill="#a5d6a7">CIRCULATION</text>
  <text x="210" y="244" text-anchor="middle" font-size="7.5" fill="#aaa">Blood visits heart TWICE per complete circuit — maintains pressure for efficient delivery</text>
</svg>`
  },
  {
    title:'Blood Vessels — Artery, Vein, Capillary',
    content:`<h3 style="color:#2e7d32;margin:0 0 6px">Three Types of Blood Vessel — Cross Sections</h3><p style="margin:0;font-size:.85rem">Each vessel is adapted to its function. Arteries withstand high pressure; veins return blood against gravity; capillaries are the actual exchange sites.</p>`,
    visual:`<svg viewBox="0 0 420 240" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- ARTERY -->
  <text x="70" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">ARTERY</text>
  <!-- Outer wall thick -->
  <circle cx="70" cy="100" r="52" fill="#ef9a9a" opacity="0.5" stroke="#c62828" stroke-width="2"/>
  <!-- Muscle layer -->
  <circle cx="70" cy="100" r="44" fill="#e57373" opacity="0.5"/>
  <!-- Lumen small -->
  <circle cx="70" cy="100" r="22" fill="#c62828"/>
  <!-- Blood inside -->
  <circle cx="70" cy="100" r="18" fill="#b71c1c"/>
  <!-- Labels -->
  <text x="70" y="29" text-anchor="middle" font-size="8" fill="#ef9a9a">Thick elastic wall</text>
  <line x1="90" y1="80" x2="108" y2="64" stroke="#ef9a9a" stroke-width="1"/>
  <text x="115" y="62" font-size="7.5" fill="#ef9a9a">Muscle layer</text>
  <text x="70" y="168" text-anchor="middle" font-size="7.5" fill="#ffcdd2">Small lumen</text>
  <text x="70" y="180" text-anchor="middle" font-size="7.5" fill="#ffcdd2">HIGH PRESSURE</text>
  <text x="70" y="192" text-anchor="middle" font-size="7.5" fill="#ffcdd2">Carries blood AWAY</text>
  <text x="70" y="203" text-anchor="middle" font-size="7.5" fill="#ffcdd2">from heart</text>
  <!-- VEIN -->
  <text x="210" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">VEIN</text>
  <!-- Outer wall thin -->
  <circle cx="210" cy="100" r="52" fill="#90caf9" opacity="0.4" stroke="#1565c0" stroke-width="1.5"/>
  <circle cx="210" cy="100" r="46" fill="#64b5f6" opacity="0.25"/>
  <!-- Wide lumen -->
  <circle cx="210" cy="100" r="36" fill="#1565c0"/>
  <circle cx="210" cy="100" r="30" fill="#1e88e5"/>
  <!-- Valve flaps -->
  <path d="M195 90 Q205 100 195 110" fill="none" stroke="#fff" stroke-width="2"/>
  <path d="M225 90 Q215 100 225 110" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="210" y="168" text-anchor="middle" font-size="7.5" fill="#bbdefb">Wide lumen</text>
  <text x="210" y="180" text-anchor="middle" font-size="7.5" fill="#bbdefb">LOW PRESSURE</text>
  <text x="210" y="192" text-anchor="middle" font-size="7.5" fill="#bbdefb">Has VALVES (shown)</text>
  <text x="210" y="203" text-anchor="middle" font-size="7.5" fill="#bbdefb">Carries blood TO heart</text>
  <!-- CAPILLARY -->
  <text x="350" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">CAPILLARY</text>
  <!-- Very thin wall -->
  <circle cx="350" cy="100" r="16" fill="#ef9a9a" opacity="0.8" stroke="#2e7d32" stroke-width="1"/>

      {q:'Which blood vessels carry blood AWAY from the heart?',opts:['Veins','Capillaries','Arteries','Lacteals'],ans:2,exp:'ARTERIES carry blood AWAY from the heart. They have thick, elastic, muscular walls to withstand the high pressure generated by the heart. The main artery from the left ventricle is the AORTA.'},
      {q:'What is the function of white blood cells?',opts:['Carry oxygen using haemoglobin','Transport glucose to cells','Defend the body against infection and disease','Help blood to clot'],ans:2,exp:'WHITE BLOOD CELLS (leucocytes) defend against infection by: (1) PHAGOCYTOSIS — engulfing and destroying pathogens, and (2) producing ANTIBODIES that target specific pathogens. They have a nucleus (unlike RBCs).'},

  {
    title:'Double Circulation',
    body:`Humans have <strong>double circulation</strong> — blood passes through the heart TWICE for every complete circuit of the body.
    <br><br>
    <strong>Circuit 1 — Pulmonary circulation</strong>: Right side of heart → Lungs (to pick up O₂ and lose CO₂) → Left side of heart
    <br><br>
    <strong>Circuit 2 — Systemic circulation</strong>: Left side of heart → Body (delivers O₂, picks up CO₂) → Right side of heart
    <br><br>
    Advantage: Blood re-pressurised by the heart before going to body → maintains high pressure for efficient delivery to all organs.`,
    draw:(sk)=>{
      bg(sk,[8,10,18]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Heart centre
      sk.fill(180,30,30,200);sk.noStroke();sk.ellipse(W*0.5,H*0.5,60,60);
      sk.fill(255);sk.textSize(9);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('Heart',W*0.5,H*0.5);
      // Lungs (top)
      sk.fill(100,180,255,140);sk.noStroke();sk.ellipse(W*0.5,H*0.15,80,44);
      sk.fill(255);sk.textSize(9);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('Lungs',W*0.5,H*0.15);
      // Body (bottom)
      sk.fill(100,200,100,100);sk.noStroke();sk.ellipse(W*0.5,H*0.85,80,44);
      sk.fill(255);sk.text('Body',W*0.5,H*0.85);
      // Pulmonary circuit arrows (left side)
      const pProg=(t*0.25)%1;
      // Heart → Lungs (right side / blue arrow)
      sk.stroke(52,100,200,200);sk.strokeWeight(2.5);sk.noFill();
      // Going UP (deoxygenated, right side)
      const upP=sk.createVector(W*0.38,H*0.47);
      const upE=sk.createVector(W*0.38,H*0.18);
      sk.line(upP.x,upP.y,upE.x,upE.y);
      sk.fill(52,100,200,200);sk.noStroke();
      sk.circle(upP.x,upP.y+(upE.y-upP.y)*pProg,8);
      sk.fill(52,100,200);sk.textSize(7.5);sk.textAlign(sk.RIGHT);
      sk.text('Deoxyg.\nblood',W*0.34,H*0.32);
      // Lungs → Heart (oxygenated, right side)
      sk.stroke(220,50,50,200);sk.strokeWeight(2.5);sk.noFill();
      sk.line(W*0.58,H*0.18,W*0.58,H*0.47);
      sk.fill(220,50,50,200);sk.noStroke();
      sk.circle(W*0.58,H*0.18+(H*0.29)*pProg,8);
      sk.fill(220,50,50);sk.textSize(7.5);sk.textAlign(sk.LEFT);
      sk.text('Oxyg.\nblood',W*0.6,H*0.32);
      // Systemic circuit
      const sProg=(t*0.25+0.5)%1;
      sk.stroke(220,50,50,200);sk.strokeWeight(2.5);sk.noFill();
      sk.line(W*0.62,H*0.53,W*0.62,H*0.82);
      sk.fill(220,50,50,200);sk.noStroke();
      sk.circle(W*0.62,H*0.53+(H*0.29)*sProg,8);
      sk.stroke(52,100,200,200);sk.strokeWeight(2.5);sk.noFill();
      sk.line(W*0.38,H*0.82,W*0.38,H*0.53);
      sk.fill(52,100,200,200);sk.noStroke();
      sk.circle(W*0.38,H*0.82-(H*0.29)*sProg,8);
      // Labels
      sk.fill(255,220,50);sk.textSize(8.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      sk.text('Pulmonary\n(to lungs)',W*0.2,H*0.3);
      sk.text('Systemic\n(to body)',W*0.8,H*0.68);
    }
  },
  {
    title:'Health & Heart Disease',
    body:`A healthy heart is essential for life. Common problems:
    <br><br>
    <strong>Coronary heart disease (CHD)</strong>: Arteries supplying the heart muscle become narrowed by <strong>atherosclerosis</strong> (fatty plaque build-up, especially cholesterol).
    <ul style="margin:4px 0 0 18px;line-height:1.9">
      <li>Reduces blood flow to heart muscle → chest pain (angina)</li>
      <li>Complete blockage → heart attack (myocardial infarction)</li>
    </ul>
    <br>
    Risk factors: <strong>high blood pressure, smoking, high cholesterol, poor diet (high saturated fat), lack of exercise, obesity, diabetes, stress</strong>.
    <br><br>
    Prevention: healthy diet (less saturated fat), regular exercise, not smoking, maintaining healthy weight.`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Healthy artery (left)
      sk.fill(255);sk.textSize(9);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      sk.text('Healthy Artery',W*0.25,H*0.12);
      sk.fill(220,60,60,80);sk.noStroke();sk.circle(W*0.25,H*0.45,70);
      sk.fill(220,60,60,200);sk.circle(W*0.25,H*0.45,50);
      // RBCs inside
      for(let i=0;i<4;i++){
        const ang=t*2+i*sk.HALF_PI;
        const rx=W*0.25+Math.cos(ang)*16,ry=H*0.45+Math.sin(ang)*16;
        sk.fill(255,100,100,200);sk.noStroke();sk.ellipse(rx,ry,12,8);
      }
      sk.fill(46,204,113);sk.textSize(8.5);sk.textStyle(sk.NORMAL);sk.textAlign(sk.CENTER);
      sk.text('Wide lumen\nGood blood flow',W*0.25,H*0.75);
      // Blocked artery (right)
      sk.fill(255);sk.textSize(9);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      sk.text('Blocked Artery (CHD)',W*0.72,H*0.12);
      sk.fill(220,60,60,80);sk.noStroke();sk.circle(W*0.72,H*0.45,70);
      // Plaque
      const pAngle=t*0.3;
      sk.fill(255,200,50,180);sk.noStroke();sk.arc(W*0.72,H*0.45,60,60,pAngle,pAngle+sk.PI*1.6);
      sk.fill(220,180,30,220);sk.arc(W*0.72,H*0.45,55,55,pAngle,pAngle+sk.PI*1.6);
      // Narrow lumen
      sk.fill(220,60,60,200);sk.noStroke();sk.circle(W*0.72,H*0.45,22);
      for(let i=0;i<2;i++){
        const ang=t*2+i*sk.PI;
        const rx=W*0.72+Math.cos(ang)*6,ry=H*0.45+Math.sin(ang)*6;
        sk.fill(255,100,100,200);sk.noStroke();sk.ellipse(rx,ry,8,5);
      }
      sk.fill(231,76,60);sk.textSize(8.5);sk.textStyle(sk.NORMAL);sk.textAlign(sk.CENTER);
      sk.text('Plaque build-up!\nNarrow lumen',W*0.72,H*0.75);
    }
  },
  {

    draw:null,
    game:{type:'mcq',questions:[
      {q:'What is the advantage of double circulation over single circulation?',opts:['The heart only needs to pump once','Blood is re-pressurised before being sent to the body, maintaining high pressure','It uses less blood','Blood never reaches the lungs'],ans:1,exp:'In DOUBLE CIRCULATION, blood passes through the heart TWICE per circuit. The right side pumps blood to the lungs (low pressure journey), and the left side REPRESSURISES it before sending it around the entire body — ensuring efficient, high-pressure delivery.'},
      {q:'What is atherosclerosis?',opts:['Thinning of artery walls','Build-up of fatty plaques (especially cholesterol) inside artery walls','Blood clotting in veins','Inflammation of the heart valves'],ans:1,exp:'ATHEROSCLEROSIS is the build-up of FATTY PLAQUES (mainly cholesterol) inside artery walls. This narrows the lumen, reduces blood flow, increases blood pressure, and can lead to blood clots, angina, or heart attack.'},
      {q:'Why do veins have valves?',opts:['To increase blood pressure','To prevent backflow of blood as it travels back to the heart against gravity','To help with gas exchange','To increase speed of blood flow'],ans:1,exp:'Veins carry blood back to the heart at LOW pressure — often against gravity. VALVES prevent blood from flowing BACKWARDS. When muscles contract, they squeeze blood upward in the vein; valves stop it from falling back down.'},
      {q:'Which of these is a lifestyle risk factor for coronary heart disease?',opts:['Being tall','Having type A blood','Smoking and eating a diet high in saturated fat','Being young'],ans:2,exp:'MODIFIABLE (lifestyle) risk factors for CHD include: SMOKING, HIGH SATURATED FAT diet, lack of exercise, obesity, high stress. These can be controlled. Non-modifiable risks include age, genetics, and sex.'},
    ]}
