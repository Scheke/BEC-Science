<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Chemistry Intro Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Introduction to Chemistry — JCE Quiz',
  color:'#e65100',dark:'#bf360c',light:'#fbe9e7',
    mcq:[
    {q:'Which of these is a chemical change?',opts:['Melting ice','Dissolving sugar','Burning wood','Cutting paper'],ans:2,exp:'Burning wood produces NEW substances (ash, CO₂, H₂O) with completely different properties — CHEMICAL change. The others are physical changes (same substance, reversible).'},
    {q:'An element is:',opts:['A mixture of substances','A compound of two atoms','A pure substance made of only one type of atom','Any substance that can be dissolved'],ans:2,exp:'An ELEMENT is a pure substance made of ONE TYPE of atom. It cannot be broken down into simpler substances by chemical means. Examples: O, Fe, C, Na.'},
    {q:'In the gas state, particles:',opts:['Are packed in a fixed regular pattern','Can slide past each other','Move freely and fast in all directions','Are stationary'],ans:2,exp:'In the GAS state, particles have high kinetic energy, move freely and randomly in all directions, are spread far apart, and fill any container they occupy.'},
    {q:'Which group in the periodic table contains very unreactive elements?',opts:['Group 1 (alkali metals)','Group 7 (halogens)','Group 18 (noble gases)','Group 2 (alkaline earth metals)'],ans:2,exp:'GROUP 18 (Noble gases) are almost completely unreactive because they have FULL OUTER ELECTRON SHELLS. They have no tendency to gain or lose electrons.'},
    {q:'The number of protons in an atom equals its:',opts:['Mass number','Neutron number','Atomic number','Number of electrons in the nucleus'],ans:2,exp:'The ATOMIC NUMBER = number of PROTONS. In a neutral atom, protons = electrons. Atomic number identifies the element in the periodic table.'},
    {q:'Which of the following is a mixture?',opts:['Pure water (H₂O)','Table salt (NaCl)','Air','Carbon dioxide (CO₂)'],ans:2,exp:'AIR is a MIXTURE of gases (oxygen, nitrogen, carbon dioxide, water vapour) that are physically combined. Pure water, salt, and CO₂ are compounds (chemically bonded elements).'},
    {q:'The smallest particle of an element that can exist is called:',opts:['A molecule','An atom','A compound','An ion'],ans:1,exp:'An ATOM is the smallest unit of an element that retains its chemical properties. Molecules are made of atoms. Compounds are made of molecules of different elements.'},
    {q:'In a solid, the particles:',opts:['Move freely in all directions','Vibrate in fixed positions','Slide over each other','Have no energy'],ans:1,exp:'In a SOLID, particles are tightly packed in a regular pattern. They do not move from their positions; they only VIBRATE about their fixed points. This gives solids a fixed shape and volume.'},
    {q:'When a liquid evaporates, the particles:',opts:['Lose energy and become solid','Gain enough energy to escape into the air','Become packed tighter','Stop moving'],ans:1,exp:'EVAPORATION occurs when particles at the surface of a liquid GAIN enough kinetic energy to overcome the intermolecular forces holding them in the liquid and escape into the air as a gas.'},
    {q:'Which of the following is a compound?',opts:['Oxygen gas (O₂)','Gold (Au)','Water (H₂O)','Air'],ans:2,exp:'WATER (H₂O) is a COMPOUND: two elements (hydrogen and oxygen) chemically combined in a fixed ratio. Oxygen and gold are elements. Air is a mixture.'},
    {q:'Elements in the same group of the periodic table have:',opts:['The same number of electron shells','The same number of outer electrons','The same atomic mass','The same state of matter'],ans:1,exp:'Elements in the same VERTICAL COLUMN (GROUP) have the SAME NUMBER of OUTER (valence) ELECTRONS. This gives them similar chemical properties and reactivity.'},
    {q:'A chemical symbol is:',opts:['The full name of the element','A one- or two-letter abbreviation for an element','The number of protons','The formula of a compound'],ans:1,exp:'A CHEMICAL SYMBOL is a shorthand notation (one capital letter, or a capital + lowercase letter) representing an element. Examples: H = hydrogen, Na = sodium, Fe = iron.'},
    {q:'The process of changing a gas directly into a solid (without becoming a liquid) is called:',opts:['Melting','Evaporation','Deposition (Desublimation)','Condensation'],ans:2,exp:'DEPOSITION is the phase change where a gas turns directly into a solid (e.g., frost forming on a cold window from water vapour). Sublimation is solid to gas. Condensation is gas to liquid.'},
    {q:'Which of the following is NOT a chemical property?',opts:['Flammability','Melting point','Reactivity with acid','Ability to rust'],ans:1,exp:'MELTING POINT is a PHYSICAL property. Flammability, reactivity with acid, and rusting are CHEMICAL properties because they describe how a substance reacts to form new substances.'},
    {q:'During a chemical reaction, the total mass of the reactants:',opts:['Increases','Decreases','Stays the same','Doubles'],ans:2,exp:'The LAW OF CONSERVATION OF MASS states that mass is neither created nor destroyed in a chemical reaction. The total mass of the products equals the total mass of the reactants.'},
    {q:'Which physical method would you use to separate salt from salt water?',opts:['Distillation','Evaporation and condensation (or simple heating)','Magnetic separation','Filtration'],ans:1,exp:'To separate salt from salt water, EVAPORATION (or boiling) is used. The water evaporates, leaving the solid salt behind. If you want pure water as well, you would use DISTILLATION.'},
    {q:'In the periodic table, the horizontal rows are called:',opts:['Groups','Periods','Families','Blocks'],ans:1,exp:'Horizontal rows in the periodic table are called PERIODS. Elements in the same period have the SAME NUMBER of electron shells. There are 7 periods in the main table.'},
    {q:'Which of the following best describes oxygen gas (O₂)?',opts:['An element (a molecule of two oxygen atoms)','A compound','A mixture','A solution'],ans:0,exp:'OXYGEN gas (O₂) is an ELEMENT. It is made of molecules containing TWO atoms of oxygen chemically bonded together. It is not a compound because it contains only one type of atom.'},
    {q:'The main difference between a physical change and a chemical change is that:',opts:['Physical changes are always faster','Physical changes produce new substances; chemical changes do not','Chemical changes produce new substances; physical changes do not','Physical changes only happen to solids'],ans:2,exp:'A CHEMICAL change produces NEW substances with different properties (e.g., burning, rusting). A PHYSICAL change does NOT produce new substances; the material is still the same (e.g., melting, boiling).'},
    {q:'A pure substance that cannot be broken down into simpler substances by chemical reactions is called:',opts:['A mixture','A compound','An element','A solution'],ans:2,exp:'An ELEMENT is a pure substance that cannot be broken down into simpler substances by chemical reactions. Gold, oxygen, and carbon are examples of elements.'},
  ],
  match:[
    {term:'Element',def:'A pure substance made of only one type of atom (e.g., Oxygen, Iron, Gold)'},
    {term:'Compound',def:'A substance formed when two or more different elements are chemically bonded in a fixed ratio (e.g., Water, Salt)'},
    {term:'Mixture',def:'A substance made of two or more different substances that are physically combined but NOT chemically bonded (e.g., Air, Salt water)'},
    {term:'Physical change',def:'A change where the substance remains chemically identical; it is often reversible (e.g., Melting, Boiling, Dissolving)'},
    {term:'Chemical change',def:'A change where new substances with new chemical properties are formed; usually irreversible (e.g., Burning, Rusting)'},
    {term:'Atomic number',def:'The number of protons in the nucleus of an atom; determines the identity of the element'},
    {term:'Mass number',def:'The total number of protons and neutrons in the nucleus of an atom'},
    {term:'Group',def:'A vertical column in the periodic table containing elements with the same number of outer electrons and similar chemical properties'},
    {term:'Period',def:'A horizontal row in the periodic table containing elements with the same number of electron shells'},
    {term:'Molecule',def:'A group of two or more atoms chemically bonded together (e.g., O₂, H₂O)'},
    {term:'Atom',def:'The smallest particle of an element that can exist and retain its chemical properties'},
    {term:'Kinetic theory',def:'The theory that explains the states of matter based on the movement and energy of particles'},
    {term:'Diffusion',def:'The movement of particles from a region of high concentration to a region of low concentration'},
    {term:'Evaporation',def:'The change of state from liquid to gas at the surface of a liquid, occurring below the boiling point'},
    {term:'Condensation',def:'The change of state from gas to liquid'},
    {term:'Sublimation',def:'The change of state from solid directly to gas (e.g., dry ice, iodine)'},
    {term:'Deposition',def:'The change of state from gas directly to solid (e.g., frost formation)'},
    {term:'Conservation of mass',def:'The principle that mass is neither created nor destroyed during a chemical reaction'},
    {term:'Noble gases',def:'The very unreactive elements in Group 18 of the periodic table (e.g., Helium, Neon, Argon)'},
    {term:'Halogens',def:'The highly reactive non-metals in Group 7 of the periodic table (e.g., Fluorine, Chlorine)'},
  ],
  flashcards:[
    {q:'What is the difference between a compound and a mixture?',a:'COMPOUND: Elements are chemically BONDED in fixed ratios, giving new properties. It is hard to separate by physical means. MIXTURE: Substances are physically combined without bonding. They retain their original properties and can be easily separated using physical methods like filtration or distillation.'},
    {q:'Describe the three states of matter in terms of particle arrangement and movement.',a:'SOLID: Particles are tightly packed in a regular lattice; they VIBRATE in fixed positions. LIQUID: Particles are close but not in a fixed pattern; they SLIDE past each other. GAS: Particles are far apart, moving FREELY and RAPIDLY in all directions, filling the container.'},
    {q:'What are the main features of the periodic table?',a:'Elements are arranged by increasing ATOMIC NUMBER. Horizontal rows = PERIODS (same number of electron shells). Vertical columns = GROUPS (same number of outer electrons, leading to similar chemical properties). The table is divided into metals, non-metals, and metalloids.'},
    {q:'State two differences between physical and chemical changes.',a:'PHYSICAL changes: Generally reversible, no new substance is formed, and the chemical formula remains the same. CHEMICAL changes: Usually irreversible, a new substance is formed with a new chemical formula, and energy is often released or absorbed.'},
    {q:'What are signs that a chemical change has occurred?',a:'Indicators of a chemical change include: 1. A permanent COLOUR CHANGE. 2. Evolution of a GAS (bubbles/fizzing). 3. Formation of a PRECIPITATE (a solid from two liquids). 4. A significant TEMPERATURE CHANGE (exothermic/endothermic). 5. Emission of LIGHT. 6. The change is IRREVERSIBLE.'},
    {q:'Explain the difference between an element and a compound.',a:'An ELEMENT is a pure substance consisting of only one type of atom (e.g., Fe, O₂). A COMPOUND is a pure substance made of two or more different elements CHEMICALLY combined in a fixed ratio (e.g., H₂O, NaCl).'},
    {q:'Describe the process of diffusion, giving an example.',a:'DIFFUSION is the natural spreading out of particles from an area of HIGH concentration to an area of LOW concentration. Example: The smell of perfume spreading across a room or ink spreading in water. It is faster in gases than liquids.'},
    {q:'What is the kinetic theory of matter?',a:'The KINETIC THEORY states that all matter is made of tiny particles (atoms, molecules, or ions) that are in constant, random motion. The amount of energy they have determines the state of matter (solid, liquid, or gas).'},
    {q:'How do you separate a mixture of sand and salt?',a:'1. Add WATER to dissolve the salt. 2. FILTER the mixture (sand remains on the filter paper). 3. EVAPORATE or DISTILL the salt water to recover the salt.'},
    {q:'Why are elements in the same group chemically similar?',a:'Elements in the same group have the SAME NUMBER OF OUTER (valence) ELECTRONS. Since chemical reactions depend on how atoms gain, lose, or share outer electrons, having the same configuration makes their chemical properties very similar.'},
    {q:'What is the difference between boiling and evaporation?',a:'BOILING: Occurs throughout the liquid at a specific temperature (boiling point), with bubbles forming. EVAPORATION: Occurs only at the surface of the liquid, at temperatures below the boiling point.'},
    {q:'Define the "Law of Conservation of Mass".',a:'The Law of Conservation of Mass states that during a chemical reaction, the total mass of the reactants is EXACTLY EQUAL to the total mass of the products. Mass is neither created nor destroyed; it is just rearranged into new substances.'},
    {q:'Describe a method to separate a mixture of two liquids with different boiling points.',a:'Use DISTILLATION. Heat the mixture. The liquid with the LOWER boiling point evaporates first. The vapour passes through a condenser, where it is cooled back into a pure liquid and collected. This is called fractional distillation for multiple liquids.'},
    {q:'How are the elements arranged in the periodic table?',a:'Elements are arranged in order of increasing ATOMIC NUMBER (number of protons). The table is organised into rows called PERIODS and columns called GROUPS. Metals are on the left, non-metals on the right.'},
    {q:'Why is air considered a mixture and not a compound?',a:'Air is a mixture because the gases in it (N₂, O₂, Ar, CO₂) are physically combined but NOT chemically bonded. They retain their individual properties and can be separated by fractional distillation.'},
    {q:'What is the difference between a physical property and a chemical property?',a:'PHYSICAL properties are observed without changing the identity of the substance (e.g., melting point, boiling point, density, colour). CHEMICAL properties describe how a substance reacts to form new substances (e.g., flammability, reactivity with acid).'},
    {q:'Explain what happens to a liquid when it is cooled to its freezing point.',a:'As the liquid cools, particles lose kinetic energy. The intermolecular forces become stronger, pulling the particles closer together. At the freezing point, the particles settle into a fixed, regular arrangement (a solid lattice) and only vibrate.'},
    {q:'What is the difference between a molecule and an atom?',a:'An ATOM is the smallest particle of an element that has the properties of that element (e.g., one oxygen atom). A MOLECULE is a group of two or more atoms chemically bonded together (e.g., O₂ is a molecule of oxygen).'},
    {q:'Why does a substance\'s volume increase when it is heated?',a:'Heating a substance adds energy to the particles, causing them to vibrate or move FASTER. This increases the distance between the particles, causing the substance to EXPAND in volume (thermal expansion).'},
    {q:'Give an example of a physical change and a chemical change involving water.',a:'PHYSICAL: Water boiling into steam (it is still H₂O). CHEMICAL: Water undergoing electrolysis to form hydrogen and oxygen gases (H₂O breaks down into new substances).'},
  ],
  blanks:{
    passage:'An element is a pure substance made of only one type of [_]. When two or more elements are chemically combined in a fixed ratio, a [_] is formed. A [_] contains two or more substances that are physically combined, such as salt water. In a [_] change, new substances with different properties are formed. The number that identifies an element in the periodic table is its [_] number.',
    answers:['atom','compound','mixture','chemical','atomic'],
    wordbank:['atom','compound','mixture','chemical','atomic','physical','molecule','proton'],
  },
  sentences:[
    {prompt:'Explain the difference between an element, a compound, and a mixture, using specific examples for each.',keywords:['element','oxygen','compound','water','mixture','air','combined','physically','chemically'],hint:'Think about whether the components are chemically bonded or just physically mixed together. Give one example of each type and describe their differences.'},
    {prompt:'Describe what happens to the particles of a solid when it is heated until it melts into a liquid.',keywords:['solid','liquid','energy','vibrate','arrangement','spacing','slide','kinetic'],hint:'How does adding thermal energy affect the movement and spacing of the particles? How does the structure change from fixed to mobile?'},
    {prompt:'Explain why elements in the same vertical group of the periodic table tend to have similar chemical properties.',keywords:['group','vertical','outer electrons','valence electrons','reactivity','chemical properties','same number'],hint:'What part of the atom determines its chemical behaviour? What do elements in the same group have in common regarding this?'},
    {prompt:'Describe a simple experiment to separate a mixture of salt and sand, and explain the scientific principles behind each step.',keywords:['sand','salt','water','dissolve','filter','evaporate','distillation','separation'],hint:'How would you remove the sand first? How would you then extract the salt from the remaining liquid?'},
    {prompt:'Compare the properties of solids, liquids, and gases in terms of shape, volume, and particle movement.',keywords:['solid','fixed shape','vibrate','liquid','slide','gas','move freely','fill container'],hint:'Does a solid have its own shape? Does a gas have a fixed volume? How do the particles move in each state?'},
    {prompt:'Explain how you would determine if a change is physical or chemical, using an example of each.',keywords:['physical','reversible','no new substance','melting','chemical','irreversible','new substance','burning'],hint:'What tells you that a new substance has been formed? Is the change easy to reverse?'},
    {prompt:'State two differences between a compound and a mixture.',keywords:['compound','chemically bonded','fixed ratio','mixture','physically combined','variable ratio','separation'],hint:'Are the components bonded? Is the ratio fixed or variable? How can they be separated?'},
    {prompt:'Describe the process of evaporation and state how it is used in daily life.',keywords:['evaporation','liquid','surface','particles','energy','gas','drying','water cycle'],hint:'Where does evaporation occur on a liquid? What happens to the particles? Give a real-world example of where this happens.'},
    {prompt:'Define the terms "atom" and "molecule" and give an example of each.',keywords:['atom','smallest','element','oxygen','molecule','group','bonded','O₂','H₂O'],hint:'Which one is the smallest unit of an element? Which one is a combination of atoms?'},
    {prompt:'What is the significance of the "Law of Conservation of Mass" in chemical reactions?',keywords:['conservation','mass','reactants','products','equal','atoms','rearranged','destroyed'],hint:'Does the mass change during a chemical reaction? Why must chemical equations be balanced?'},
    {prompt:'Describe what happens to the particles of a gas when it is cooled down to become a liquid.',keywords:['gas','cool','kinetic energy','slow down','attract','condense','liquid','intermolecular forces'],hint:'What happens to the speed and spacing of the particles as temperature drops? How do they begin to interact?'},
    {prompt:'Why do the noble gases (Group 18) have very low reactivity?',keywords:['noble gases','Group 18','outer shell','full','stable','unreactive','valence electrons'],hint:'What condition makes an atom chemically stable? Do noble gases achieve this condition naturally?'},
    {prompt:'Explain how the periodic table is organized, identifying what the rows (periods) and columns (groups) represent.',keywords:['periodic table','periods','rows','shells','groups','columns','outer electrons','similar properties'],hint:'What does the row number tell you about the atom? What do elements in the same column have in common?'},
    {prompt:'Describe a method to separate a mixture of ethanol and water (both liquids with different boiling points).',keywords:['ethanol','water','mixture','boiling point','distillation','fractional','condensation','separate'],hint:'What apparatus would you use to separate liquids based on their boiling points? How does the condensation process work?'},
    {prompt:'Explain why dissolving sugar in water is a physical change, not a chemical change.',keywords:['dissolve','sugar','water','physical','reversible','evaporate','sugar crystals','state'],hint:'What happens to the sugar molecules? Can you get the sugar back? Is a new substance formed?'},
    {prompt:'State and explain two physical methods used to separate mixtures.',keywords:['filtration','sand','water','residue','distillation','boiling point','components','separate'],hint:'Name a method that separates solids from liquids, and one that separates liquids from liquids based on boiling points.'},
    {prompt:'Describe the kinetic theory of matter and how it explains the existence of the three states.',keywords:['kinetic theory','particles','motion','energy','solid','liquid','gas','states'],hint:'How does the energy of the particles determine whether matter is a solid, a liquid, or a gas?'},
    {prompt:'What are the characteristics of a mixture? Give two examples.',keywords:['mixture','variable composition','components','retain properties','physically combined','air','salt water'],hint:'Do the components in a mixture retain their individual properties? Is the composition of a mixture fixed or variable?'},
    {prompt:'Explain why water is a compound, while air is a mixture.',keywords:['water','H₂O','compound','fixed ratio','chemically bonded','air','mixture','physically combined','components'],hint:'Are the components of water and air combined by chemical bonds? Is the ratio of components fixed in each?'},
    {prompt:'Compare the boiling points of substances in different states. How does boiling point relate to the strength of intermolecular forces?',keywords:['boiling point','intermolecular forces','liquid','gas','energy','attraction','particles'],hint:'Does a substance with strong forces between its particles have a high or low boiling point? Why?'},
  ],
});
</script></body></html>
