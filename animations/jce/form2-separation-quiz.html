<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Separation Techniques Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Separation Techniques — JCE Chemistry Quiz',
  color:'#006064',dark:'#00363a',light:'#e0f7fa',
    mcq:[
    {q:'Filtration separates:',opts:['Two miscible liquids','A soluble solid from a solvent','An insoluble solid from a liquid','Two gases'],ans:2,exp:'FILTRATION separates an INSOLUBLE SOLID from a LIQUID using filter paper. The liquid (filtrate) passes through; the solid (residue) remains on the paper.'},
    {q:'Distillation separates:',opts:['Coloured dyes from a mixture','An insoluble solid from liquid','A soluble solid from liquid by evaporation and condensation','A mixture of metals'],ans:2,exp:'SIMPLE DISTILLATION separates a SOLUBLE SOLID from a liquid (e.g. salt from water) by boiling off the liquid and condensing the vapour. FRACTIONAL DISTILLATION separates miscible liquids with different boiling points.'},
    {q:'The Rf value in chromatography =',opts:['Speed of the solvent','Distance of spot / distance of solvent front','Concentration of the substance','Number of colours separated'],ans:1,exp:'Rf = distance travelled by substance ÷ distance travelled by solvent front. It is always between 0 and 1. Different substances have characteristic Rf values under fixed conditions.'},
    {q:'Which technique separates iron filings from sulfur powder?',opts:['Filtration','Distillation','Magnetic separation','Chromatography'],ans:2,exp:'MAGNETIC SEPARATION: iron is magnetic, sulfur is not. A magnet attracts iron filings away from the sulfur. Simple, fast, and leaves both materials unchanged.'},
    {q:'Crystallisation differs from evaporation to dryness because crystallisation:',opts:['Uses filtration to collect crystals','Involves dissolving then slow cooling to grow large pure crystals','Requires very high temperature','Produces smaller crystals'],ans:1,exp:'CRYSTALLISATION: dissolve solid in hot solvent → cool slowly → large pure crystals form. Evaporation to dryness gives small, impure crystals. Crystallisation gives better quality product.'},
    {q:'Which method would you use to separate a mixture of ethanol (boiling point 78°C) and water (boiling point 100°C)?',opts:['Filtration','Simple distillation','Fractional distillation','Magnetic separation'],ans:2,exp:'FRACTIONAL DISTILLATION is used to separate MIXTURES OF LIQUIDS with CLOSE boiling points. The fractionating column allows the ethanol vapour (lower bp) to condense and be collected first, leaving the water behind.'},
    {q:'The liquid that passes through the filter paper in filtration is called the:',opts:['Residue','Filtrate','Solution','Solvent'],ans:1,exp:'The FILTRATE is the liquid that passes through the filter paper. It contains dissolved substances. The RESIDUE is the insoluble solid trapped in the filter paper.'},
    {q:'What is the purpose of a condenser in distillation?',opts:['To heat the liquid','To cool and condense the vapour back into a liquid','To filter out impurities','To separate colours'],ans:1,exp:'A CONDENSER is a glass tube surrounded by cold running water. Its purpose is to COOL the hot vapour so that it CONDENSES back into a pure liquid, which is then collected in a flask.'},
    {q:'Which separation technique is best for separating a mixture of salt and water?',opts:['Filtration','Magnetic separation','Distillation','Chromatography'],ans:2,exp:'Salt is SOLUBLE in water, so filtration will not work. DISTILLATION (or evaporation) is used to separate a soluble solid from a liquid by boiling off the water and condensing it.'},
    {q:'In chromatography, the stationary phase is:',opts:['The solvent','The paper or thin layer plate','The dye mixture','The beaker'],ans:1,exp:'In PAPER CHROMATOGRAPHY, the STATIONARY PHASE is the paper (a polar adsorbent). The MOBILE PHASE is the solvent that moves up the paper, carrying the dissolved substances with it.'},
    {q:'Why is crystallisation preferred over evaporation to dryness when preparing pure crystals of a soluble salt?',opts:['It is faster','It produces larger, purer crystals with fewer impurities','It requires no heat','It uses less water'],ans:1,exp:'CRYSTALLISATION produces LARGE, PURE crystals because the slow cooling process allows the salt to form well-defined, ordered lattices, leaving impurities in the mother liquor. Evaporation to dryness traps impurities within the crystals.'},
    {q:'Fractional distillation separates liquids based on:',opts:['Colour','Density','Boiling point','Solubility'],ans:2,exp:'FRACTIONAL DISTILLATION separates liquids with different BOILING POINTS. The liquid with the lowest boiling point evaporates first, rises to the top of the column, and is collected first.'},
    {q:'Which of the following is NOT a separation technique?',opts:['Filtration','Distillation','Combustion','Chromatography'],ans:2,exp:'COMBUSTION is a CHEMICAL REACTION that changes substances into new products. Filtration, distillation, and chromatography are PHYSICAL SEPARATION methods that do not change the chemical composition of the substances.'},
    {q:'A mixture of sand, salt, and iron filings is given. Which separation techniques are used, and in what order?',opts:['Filtration → Magnetic separation → Distillation','Magnetic separation → Filtration → Evaporation','Distillation → Filtration → Magnetic','Chromatography → Filtration → Evaporation'],ans:1,exp:'1. MAGNETIC SEPARATION removes iron filings. 2. FILTRATION removes sand (insoluble). 3. EVAPORATION of the filtrate leaves salt behind.'},
    {q:'In paper chromatography, the solvent front is:',opts:['The position of the start line','The highest point reached by the solvent','The lowest point reached by the solvent','The middle of the paper'],ans:1,exp:'The SOLVENT FRONT is the furthest point reached by the solvent as it moves up the paper. All Rf values are measured relative to this line (distance from baseline to solvent front).'},
    {q:'If a substance has an Rf value of 0.6, this means:',opts:['It did not move at all','It moved 60% of the distance the solvent moved','It moved faster than the solvent','It is insoluble in the solvent'],ans:1,exp:'Rf = distance moved by spot / distance moved by solvent front. An Rf of 0.6 means the substance moved 60% as far as the solvent did. It is always ≤ 1.'},
    {q:'Simple distillation is suitable for separating a mixture of:',opts:['Two liquids with very different boiling points (e.g., water and ethanol)','Two miscible liquids with close boiling points','A solid and a liquid where the solid is insoluble','Coloured substances in ink'],ans:0,exp:'SIMPLE distillation works well when the boiling points of the liquids are VERY DIFFERENT (e.g., water at 100°C and ethanol at 78°C). If the boiling points are close, FRACTIONAL distillation is required.'},
    {q:'Why does the ink spot in chromatography separate into different colours?',opts:['The colours react with the paper','Different dyes have different solubilities in the solvent and travel at different speeds','The heat from the solvent causes separation','The dyes are repelled by the paper'],ans:1,exp:'The different dyes in ink have DIFFERENT SOLUBILITIES in the solvent. The more soluble a dye is, the faster it moves with the solvent. The less soluble it is, the more it "sticks" to the paper and stays closer to the baseline.'},
    {q:'To obtain pure water from a solution of salt water, you would use:',opts:['Filtration','Evaporation to dryness','Distillation','Magnetic separation'],ans:2,exp:'DISTILLATION is used to obtain PURE WATER from salt water. The water is boiled off, condensed, and collected as pure distilled water, leaving the salt behind in the distillation flask.'},
    {q:'Which separation method relies on particle size to separate mixtures?',opts:['Distillation','Filtration','Chromatography','Crystallisation'],ans:1,exp:'FILTRATION relies on particle size. The filter paper has tiny pores that allow liquid particles and small dissolved molecules to pass through, but trap larger insoluble solid particles.'},
  ],
  match:[
    {term:'Filtration',def:'A method used to separate an insoluble solid from a liquid using a porous filter (e.g., sand from water)'},
    {term:'Distillation',def:'A method that separates a soluble solid from a liquid, or two liquids with different boiling points, through evaporation and condensation'},
    {term:'Chromatography',def:'A technique that separates dissolved substances based on their differing solubilities and rates of movement in a solvent'},
    {term:'Crystallisation',def:'A method of obtaining large, pure crystals of a soluble solid by dissolving it in a hot solvent and allowing it to cool slowly'},
    {term:'Magnetic separation',def:'A technique using a magnet to separate magnetic materials (e.g., iron) from non-magnetic materials (e.g., sulfur)'},
    {term:'Residue',def:'The insoluble solid left behind on the filter paper after filtration'},
    {term:'Filtrate',def:'The liquid that passes through the filter paper in filtration, containing dissolved substances'},
    {term:'Solvent front',def:'The furthest point reached by the solvent as it travels up the paper in chromatography'},
    {term:'Rf value',def:'The retention factor; calculated as the distance moved by the spot divided by the distance moved by the solvent front'},
    {term:'Condenser',def:'A piece of apparatus used in distillation to cool and condense hot vapour back into a liquid'},
    {term:'Fractional distillation',def:'A technique used to separate a mixture of two or more miscible liquids with different, close boiling points'},
    {term:'Fractionating column',def:'A long column packed with glass beads used in fractional distillation to repeatedly condense and evaporate vapours'},
    {term:'Evaporation to dryness',def:'Heating a solution until all the solvent has evaporated, leaving behind solid; often yields impure crystals'},
    {term:'Simple distillation',def:'A single evaporation-condensation cycle used to separate liquids with very different boiling points'},
    {term:'Capillary action',def:'The process by which the solvent moves up the paper in chromatography, pulling the dissolved substances with it'},
    {term:'Stationary phase',def:'The fixed medium (e.g., paper in paper chromatography) that does not move; interacts with the substances'},
    {term:'Mobile phase',def:'The moving solvent (e.g., water or ethanol) that carries the substances through the stationary phase'},
    {term:'Pure substance',def:'A substance made of only one component (element or compound) with a fixed melting/boiling point'},
    {term:'Mixture',def:'A combination of two or more substances that are not chemically bonded and can be separated by physical methods'},
    {term:'Miscible',def:'Liquids that can mix together to form a single, uniform solution (e.g., water and ethanol)'},
  ],
  flashcards:[
    {q:'How do you choose the correct separation technique for a mixture?',a:'FILTRATION: If you have an INSOLUBLE solid in a liquid. DISTILLATION: If you have a SOLUBLE solid in a liquid OR two miscible liquids with different boiling points. CHROMATOGRAPHY: For separating dissolved dyes or pigments. MAGNETIC SEPARATION: For separating magnetic from non-magnetic materials.'},
    {q:'Describe how paper chromatography works.',a:'1. A spot of the mixture is placed on a baseline on chromatography paper. 2. The paper is placed in a solvent, with the baseline just above the liquid. 3. The solvent rises by CAPILLARY ACTION, carrying the components. 4. Components with HIGHER SOLUBILITY in the solvent travel further. 5. The separated spots are identified by calculating Rf values.'},
    {q:'What is the difference between filtrate and residue?',a:'FILTRATE: The liquid that PASSES THROUGH the filter paper. It contains dissolved substances that are small enough to pass through the pores. RESIDUE: The INSOLUBLE SOLID that remains on the filter paper because its particles are too large to pass through the pores.'},
    {q:'How is fractional distillation used to separate crude oil?',a:'Crude oil is heated in a furnace. The vapours enter a tall FRACTIONATING COLUMN. Components with the LOWEST boiling points evaporate and rise to the top. As the column gets cooler towards the top, fractions with higher boiling points condense and are collected at different levels.'},
    {q:'When would you use crystallisation instead of evaporation to dryness?',a:'Use CRYSTALLISATION when you want LARGE, PURE crystals. It involves dissolving the solid in a hot solvent and allowing it to cool slowly. Evaporation to dryness yields small, impure crystals and can decompose heat-sensitive compounds. Crystallisation is preferred for pharmaceuticals.'},
    {q:'Explain the process of simple distillation.',a:'1. A solution (e.g., salt water) is heated in a distillation flask. 2. The liquid with the lower boiling point (water) EVAPORATES. 3. The vapour passes into a CONDENSER, which is surrounded by cold water. 4. The vapour cools and CONDENSES back into a pure liquid, which is collected in a receiving flask.'},
    {q:'What is the purpose of a condenser in distillation?',a:'The CONDENSER is a glass tube with a jacket of cold running water. Its purpose is to COOL the hot vapour that enters it, causing it to CONDENSE back into a liquid so that it can be collected as the pure distillate. Without a condenser, the vapour would escape.'},
    {q:'In chromatography, how do you identify an unknown substance?',a:'You run a chromatography experiment with both the UNKNOWN sample and a known REFERENCE sample on the same paper. Compare their Rf values. If the Rf values match, the unknown is the same substance.'},
    {q:'Describe how you would separate a mixture of salt and sand.',a:'1. Add WATER to the mixture and stir to dissolve the salt. 2. FILTER the mixture. The sand (insoluble) remains on the filter paper. 3. EVAPORATE the filtrate to obtain pure salt crystals, or use distillation.'},
    {q:'What is the Rf value and what does it tell you?',a:'Rf (Retention factor) = Distance moved by spot ÷ Distance moved by solvent front. It is a fixed value for a specific substance in a specific solvent system. It is always between 0 and 1 and is used to identify substances in chromatography.'},
    {q:'Compare simple distillation and fractional distillation.',a:'Simple distillation separates liquids with VERY DIFFERENT boiling points (e.g., water at 100°C and ethanol at 78°C). Fractional distillation separates liquids with CLOSE boiling points using a fractionating column to repeatedly condense and re-evaporate the mixture for better separation.'},
    {q:'How would you separate iron filings from a mixture of iron and copper?',opts:['Use a magnet to attract the iron filings. Copper is non-magnetic, so it will be left behind. This works because iron is ferromagnetic and copper is not.'],hint:'Which physical property of iron differs from copper?'},
    {q:'Explain why crystallisation produces pure crystals.',a:'In crystallisation, the solution is cooled SLOWLY. The solute molecules arrange themselves into an ordered crystal lattice, which tends to exclude impurities. The impurities stay dissolved in the mother liquor, leaving the crystals pure.'},
    {q:'What is the function of the filter paper in filtration?',a:'The filter paper has tiny pores that act as a sieve. It allows the small LIQUID molecules and dissolved solutes to pass through (filtrate) while trapping the larger INSOLUBLE SOLID particles (residue) on the surface.'},
    {q:'A plant pigment mixture is separated using paper chromatography. How would you identify the individual pigments?',a:'Calculate the Rf value for each separated spot. Then, compare these Rf values to known standards for plant pigments run under the same conditions. The pigment with the highest Rf moved the furthest.'},
    {q:'Explain why fractional distillation uses a column with glass beads.',a:'The GLASS BEADS in a fractionating column provide a large surface area for the rising vapours to repeatedly CONDENSE and EVAPORATE. This allows for multiple distillations within the same column, resulting in a much more efficient separation of liquids with close boiling points.'},
    {q:'Why is distillation not suitable for separating coloured dyes in ink?',opts:['Because dyes have the same boiling point','Because dyes are soluble and would evaporate with the liquid','Because distillation separates by boiling point, and dyes are non-volatile (they don\'t evaporate easily), so they would decompose before boiling'],hint:'Ink dyes are usually dissolved in a liquid. What happens to a dissolved solid when the liquid evaporates?'},
    {q:'Describe how you would separate a mixture of ethanol (bp 78°C) and water (bp 100°C) in the laboratory.',keywords:['fractional distillation','fractionating column','ethanol first','condenser','boiling point','separation'],hint:'Which apparatus is needed to separate two miscible liquids with close boiling points? Which liquid will be collected first?'},
    {q:'What is the difference between a pure substance and a mixture?',a:'A PURE substance consists of only one type of element or compound and has a fixed boiling/melting point (e.g., pure water). A MIXTURE consists of two or more substances that are physically combined and can be separated by physical methods.'},
    {q:'In chromatography, what would happen if the starting line was submerged in the solvent?',opts:['The solvent would carry the spot up the paper','The spot would dissolve into the solvent and be mixed, ruining the separation','The substance would separate better','The paper would be stained evenly'],hint:'Chromatography relies on the solvent moving UP the paper from the bottom. What happens to the spot if the solvent washes over it before it can start moving up?'},
  ],
  blanks:{
    passage:'Filtration is used to separate an [_] solid from a liquid. The liquid that passes through the filter paper is called the [_]. Paper chromatography is used to separate substances dissolved in a liquid, and the value calculated to identify them is the [_] value. Crystallisation is preferred over evaporation when large, pure [_] are required. Fractional [_] separates liquids with different boiling points.',
    answers:['insoluble','filtrate','Rf','crystals','distillation'],
    wordbank:['insoluble','filtrate','Rf','crystals','distillation','residue','evaporation','magnetic'],
  },
  sentences:[
    {prompt:'Describe the steps you would take to obtain pure salt crystals from a mixture of salt and sand.',keywords:['dissolve','water','filtration','sand','residue','filtrate','evaporation','crystallisation','salt'],hint:'You need two physical separation steps. How do you remove the sand first? How do you then obtain the salt from the remaining liquid?'},
    {prompt:'Explain how paper chromatography can be used to identify an unknown dye in a black ink sample.',keywords:['chromatography','spot','solvent','Rf value','distance','reference','identify'],hint:'What specific value do you calculate for each spot? What do you compare this value against to identify the dye?'},
    {prompt:'Explain why distillation can successfully separate salt from salt water, but filtration cannot.',keywords:['distillation','dissolved','salt','boiling point','evaporate','condense','filtration','filter paper'],hint:'Do salt particles dissolve in water? Can filter paper stop particles that are dissolved (too small to see)? What happens to salt when water boils off?'},
    {prompt:'A mixture contains salt, sand, and water. Describe how you would separate all three components and recover each one in as pure a form as possible.',keywords:['filtration','sand','distillation','water','salt','evaporation','crystals','separate'],hint:'In what order would you perform the separations? How would you recover the water and the salt?'},
    {prompt:'Explain the difference between simple distillation and fractional distillation, giving an example of when each is used.',keywords:['simple','liquids','very different boiling','fractional','close boiling','column','ethanol','water'],hint:'When would a simple condensation cycle be enough? When would you need a tall column to improve separation?'},
    {prompt:'A student separates the pigments in a leaf using paper chromatography. One pigment travels 6 cm and the solvent travels 10 cm. Calculate its Rf value.',keywords:['Rf','distance spot','6 cm','distance solvent','10 cm','0.6','calculation'],hint:'Use the formula Rf = distance moved by spot ÷ distance moved by solvent front.'},
    {prompt:'Why is crystallisation a better method than evaporation to dryness for obtaining pure potassium nitrate crystals from a solution?',keywords:['crystallisation','slow cooling','pure','large','crystals','impurities','evaporation','small'],hint:'What is the difference in the size and purity of the crystals produced by each method?'},
    {prompt:'Describe how you would separate iron filings from a mixture of iron powder and copper powder.',keywords:['magnetic','iron','copper','attract','separate','non-magnetic','magnet'],hint:'What physical property differs between iron and copper?'},
    {prompt:'Explain the roles of the stationary phase and the mobile phase in paper chromatography.',keywords:['stationary','paper','mobile','solvent','carry','components','separate','adsorption'],hint:'Which part stays still and interacts with the substances? Which part moves and carries the substances with it?'},
    {prompt:'What is the purpose of a condenser in a distillation apparatus?',keywords:['condenser','vapour','cold water','cool','condense','liquid','collect'],hint:'Why do you need to cool the vapour after it has evaporated? What would happen if you didn\'t use a condenser?'},
    {prompt:'Describe how you would separate a mixture of ethanol (bp 78°C) and water (bp 100°C).',keywords:['fractional distillation','fractionating column','ethanol first','condenser','boiling point','separation'],hint:'Which apparatus is needed to separate two miscible liquids with close boiling points? Which liquid will be collected first?'},
    {prompt:'Explain how fractional distillation is used to separate crude oil into its fractions, such as petrol and diesel.',keywords:['crude oil','heated','vapours','column','boiling point','condense','fractions','petrol'],hint:'What happens to the crude oil when it is heated? Why do different fractions condense at different heights in the column?'},
    {prompt:'In filtration, what is the difference between the filtrate and the residue?',keywords:['filtration','filtrate','liquid','pass through','residue','solid','left behind','filter paper'],hint:'One is the liquid that comes out of the filter; the other is the solid that stays on top of the filter. Which is which?'},
    {prompt:'Why is salt water not able to be separated by filtration?',keywords:['salt water','filtration','dissolved','filter paper','pores','solute','solvent','soluble'],hint:'Does salt dissolve in water? If a substance is dissolved, can it be caught by a filter paper?'},
    {prompt:'A mixture of ethanol (bp 78°C) and water (bp 100°C) can be separated by fractional distillation. Explain why simple distillation is less effective for this mixture.',keywords:['simple distillation','fractional distillation','boiling point','separate','close','ethanol','water','effective'],hint:'What happens when two liquids with similar boiling points are heated? Why does a fractionating column help?'},
    {prompt:'Describe how to test the purity of a substance using its melting point.',keywords:['melting point','pure substance','sharp melting point','impure','lower','range','identify'],hint:'What happens to the melting point if a substance is pure? What happens to the melting point range if it is impure?'},
    {prompt:'How would you separate a mixture of sand, salt, and iron filings?',keywords:['iron filings','magnet','sand','water','filter','salt','evaporation','distillation'],hint:'What physical property does iron have that the others do not? What steps would you take after removing the iron to separate the sand from the salt?'},
    {prompt:'Explain why the Rf value of a substance in chromatography is always between 0 and 1.',keywords:['Rf','distance spot','solvent front','0','1','solubility','adsorption'],hint:'If the spot travels zero distance, what is the Rf? If the spot travels the same distance as the solvent, what is the Rf? Can a spot travel further than the solvent?'},
    {prompt:'Describe the apparatus used in simple distillation and the function of each piece.',keywords:['distillation flask','thermometer','condenser','cold water','collecting flask','heat','vapour'],hint:'What does each piece of glassware do? How does the apparatus ensure the pure liquid is collected?'},
    {prompt:'State two advantages of crystallisation over evaporation to dryness for obtaining a soluble salt.',keywords:['crystallisation','purity','large crystals','impurities','slow cooling','evaporation','decomposition'],hint:'Think about the quality of the crystals formed and what happens to impurities. Also consider substances that cannot withstand high heat.'},
  ],
});
</script></body></html>
