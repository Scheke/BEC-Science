<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Introduction to Chemistry — BEC Study</title>
<style>*,*::before,*::after{box-sizing:border-box}</style>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="../study-engine.js"></script>
<script>
function bg(sk,c){sk.background(...(c||[12,12,20]))}

const STEPS=[
  {
    title:'Matter, Elements & Compounds',
    body:`<strong>Chemistry</strong> is the study of matter — what it is made of and how it changes.
    <br><br>
    <ul style="margin:6px 0 0 18px;line-height:2.2">
      <li><strong>Element</strong> — pure substance made of ONE type of atom (e.g. oxygen O, carbon C)</li>
      <li><strong>Compound</strong> — two or more elements CHEMICALLY combined in a fixed ratio (e.g. water H₂O)</li>
      <li><strong>Mixture</strong> — two or more substances PHYSICALLY combined, not chemically (e.g. salt water)</li>
    </ul>
    <br>Key difference: compounds have NEW properties different from their elements; mixtures keep the properties of their components.`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      const labels=[
        {n:'ELEMENT',sub:'One type\nof atom',c:[231,76,60],x:0.17,y:0.48,atoms:[{x:0,y:0}]},
        {n:'COMPOUND',sub:'Two+ elements\nchemically joined',c:[52,152,219],x:0.5,y:0.48,atoms:[{x:-14,y:0},{x:14,y:0}]},
        {n:'MIXTURE',sub:'Mixed, NOT\nchemically joined',c:[46,204,113],x:0.83,y:0.48,atoms:[{x:-18,y:-10,c:[231,76,60]},{x:8,y:12,c:[52,152,219]},{x:20,y:-14,c:[241,196,15]}]},
      ];
      labels.forEach((lv,i)=>{
        const cx=lv.x*W,cy=lv.y*H;
        // Box
        sk.fill(...lv.c,20);sk.stroke(...lv.c,120);sk.strokeWeight(1.5);
        sk.rect(cx-65,cy-70,130,140,10);
        // Atoms
        lv.atoms.forEach(a=>{
          const ac=a.c||lv.c;
          const pulse=1+Math.sin(t*1.4+i*1.2)*0.1;
          sk.fill(...ac,200);sk.noStroke();sk.circle(cx+(a.x||0),cy-10+(a.y||0),22*pulse);
          if(lv.atoms.length>1&&!a.c){
            // Bond
            sk.stroke(...lv.c,140);sk.strokeWeight(2);
            sk.line(cx-6,cy-10,cx+6,cy-10);
          }
        });
        if(lv.atoms.length===3){
          // Mixture — no bonds
        }else if(lv.atoms.length===2){
          sk.stroke(...lv.c,160);sk.strokeWeight(2);sk.noFill();
          sk.line(cx-4,cy-10,cx+4,cy-10);
        }
        sk.fill(255);sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
        sk.text(lv.n,cx,cy+30);
        sk.textSize(8);sk.textStyle(sk.NORMAL);sk.text(lv.sub,cx,cy+50);
      });
    }
  },
  {
    title:'Physical & Chemical Changes',
    body:`<strong>Physical change</strong>: No new substance is formed. The change is reversible.
    <ul style="margin:4px 0 0 18px;line-height:1.9">
      <li>Melting ice → water (still H₂O)</li>
      <li>Dissolving sugar in water</li>
      <li>Cutting paper</li>
    </ul>
    <br>
    <strong>Chemical change</strong>: A NEW substance is formed with different properties. Usually irreversible.
    <ul style="margin:4px 0 0 18px;line-height:1.9">
      <li>Burning wood → ash + gases</li>
      <li>Iron rusting (Fe + O₂ → Fe₂O₃)</li>
      <li>Cooking an egg</li>
    </ul>
    Signs of a chemical change: colour change, gas produced, precipitate formed, temperature change, light produced.`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Physical change side (left) — ice melting
      const melt=0.5+0.5*Math.sin(t*0.5);
      sk.fill(150,220,255,200);sk.noStroke();
      // Ice block fading into water
      const iA=220*(1-melt*0.6);
      sk.fill(150,220,255,iA);
      sk.rect(W*0.08,H*0.35,80,70,6);
      sk.fill(100,180,255,melt*120);
      sk.ellipse(W*0.18,H*0.75,90,28);
      sk.fill(255);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('Physical Change',W*0.2,H*0.15);
      sk.textSize(8);sk.text('(Ice → Water)',W*0.2,H*0.88);
      sk.fill(200,240,255,160);sk.textSize(8);sk.text('Same substance\n(H₂O)',W*0.2,H*0.27);
      // Chemical change (right) — burning
      const flames=t*2;
      for(let i=0;i<8;i++){
        const fx=W*0.68+Math.sin(flames*1.2+i*0.9)*14+(i%4)*16,fy=H*0.65-i*20;
        const h=14+Math.sin(flames+i)*8;
        sk.fill(255,100+i*20,0,180-i*14);sk.noStroke();sk.ellipse(fx,fy,h,h*2);
      }
      sk.fill(80,60,40,200);sk.noStroke();sk.rect(W*0.62,H*0.65,90,18,3);
      sk.fill(255);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('Chemical Change',W*0.75,H*0.15);
      sk.textSize(8);sk.text('(Wood → Ash)',W*0.75,H*0.88);
      sk.fill(255,180,100,160);sk.textSize(8);sk.text('New substance\nformed!',W*0.75,H*0.27);
      // Divider
      sk.stroke(255,255,255,40);sk.strokeWeight(1);sk.line(W/2,H*0.1,W/2,H*0.92);
    }
  },
  {
    title:'States of Matter',
    body:`All matter exists in one of <strong>three states</strong>:
    <br><br>
    <table style="width:100%;border-collapse:collapse;font-size:.79rem;margin-top:4px">
      <thead><tr style="background:#1a237e;color:#fff"><th style="padding:6px 8px;border:1px solid #333">State</th><th style="padding:6px 8px;border:1px solid #333">Shape</th><th style="padding:6px 8px;border:1px solid #333">Volume</th><th style="padding:6px 8px;border:1px solid #333">Particle motion</th></tr></thead>
      <tbody>
        <tr><td style="padding:5px 8px;border:1px solid #333;font-weight:700">Solid</td><td style="padding:5px 8px;border:1px solid #333">Fixed</td><td style="padding:5px 8px;border:1px solid #333">Fixed</td><td style="padding:5px 8px;border:1px solid #333">Vibrate in place</td></tr>
        <tr style="background:#1a1a30"><td style="padding:5px 8px;border:1px solid #333;font-weight:700">Liquid</td><td style="padding:5px 8px;border:1px solid #333">Variable</td><td style="padding:5px 8px;border:1px solid #333">Fixed</td><td style="padding:5px 8px;border:1px solid #333">Slide past each other</td></tr>
        <tr><td style="padding:5px 8px;border:1px solid #333;font-weight:700">Gas</td><td style="padding:5px 8px;border:1px solid #333">Variable</td><td style="padding:5px 8px;border:1px solid #333">Variable</td><td style="padding:5px 8px;border:1px solid #333">Move freely, fast</td></tr>
      </tbody>
    </table>
    <br>Changes: <strong>melting</strong> (solid→liquid), <strong>boiling/evaporation</strong> (liquid→gas), <strong>condensation</strong> (gas→liquid), <strong>freezing</strong> (liquid→solid), <strong>sublimation</strong> (solid→gas).`,
    vars:{solidP:null,liquidP:null,gasP:null},
    setup:(sk,state)=>{
      const W=sk.width,H=sk.height;
      state.solidP=Array.from({length:9},(_,i)=>({x:W*0.1+(i%3)*18,y:H*0.55+(Math.floor(i/3))*18,vx:(Math.random()-0.5)*0.2,vy:(Math.random()-0.5)*0.2}));
      state.liquidP=Array.from({length:9},(_,i)=>({x:W*0.43+Math.random()*60,y:H*0.42+Math.random()*60,vx:(Math.random()-0.5)*1.2,vy:(Math.random()-0.5)*1.2}));
      state.gasP=Array.from({length:9},(_,i)=>({x:W*0.72+Math.random()*80,y:H*0.3+Math.random()*80,vx:(Math.random()-0.5)*2.5,vy:(Math.random()-0.5)*2.5}));
    },
    draw:(sk,state)=>{
      bg(sk);
      const W=sk.width,H=sk.height;
      // Labels
      const cols=[[231,76,60],[52,152,219],[46,204,113]];
      ['SOLID','LIQUID','GAS'].forEach((n,i)=>{
        sk.fill(...cols[i]);sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
        sk.text(n,[W*0.15,W*0.5,W*0.8][i],H*0.18);
      });
      // Solid particles (tight grid, vibrate)
      if(state.solidP)state.solidP.forEach(p=>{
        p.x+=p.vx;p.vy*=-1;p.vx*=-1;
        sk.fill(231,76,60,200);sk.noStroke();sk.circle(p.x,p.y,16);
      });
      // Box for solid
      sk.stroke(231,76,60,80);sk.strokeWeight(1.5);sk.noFill();
      sk.rect(W*0.05,H*0.44,90,70,4);
      // Liquid
      if(state.liquidP)state.liquidP.forEach(p=>{
        p.x+=p.vx;p.y+=p.vy;
        const bx=W*0.38,by=H*0.38;
        if(p.x<bx||p.x>bx+70){p.vx*=-1;p.x=sk.constrain(p.x,bx,bx+70);}
        if(p.y<by||p.y>by+70){p.vy*=-1;p.y=sk.constrain(p.y,by,by+70);}
        sk.fill(52,152,219,200);sk.noStroke();sk.circle(p.x,p.y,16);
      });
      sk.stroke(52,152,219,80);sk.strokeWeight(1.5);sk.noFill();
      sk.rect(W*0.38,H*0.38,70,70,4);
      // Gas
      if(state.gasP)state.gasP.forEach(p=>{
        p.x+=p.vx;p.y+=p.vy;
        const bx=W*0.66,by=H*0.25;
        if(p.x<bx||p.x>bx+90){p.vx*=-1;p.x=sk.constrain(p.x,bx,bx+90);}
        if(p.y<by||p.y>by+90){p.vy*=-1;p.y=sk.constrain(p.y,by,by+90);}
        sk.fill(46,204,113,200);sk.noStroke();sk.circle(p.x,p.y,16);
      });
      sk.stroke(46,204,113,80);sk.strokeWeight(1.5);sk.noFill();
      sk.rect(W*0.66,H*0.25,90,90,4);
    }
  },

  {
    title:'Physical vs Chemical Changes — Comparison',
    content:`<h3>How to Tell Physical from Chemical</h3><p>Physical changes are usually reversible — no new substance forms. Chemical changes form new substances with different properties and are usually irreversible.</p>`,
    visual:`<svg viewBox="0 0 420 250" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect width="420" height="250" fill="#fff3e0" rx="8"/>
  <text x="210" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">Physical vs Chemical Changes</text>
  <!-- PHYSICAL column -->
  <rect x="6" y="22" width="196" height="196" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="6"/>
  <text x="104" y="38" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">PHYSICAL CHANGE</text>
  <text x="104" y="50" text-anchor="middle" font-size="8" fill="#0288d1">Reversible ↔ No new substance</text>
  <!-- Physical examples -->
  <text x="20" y="68" font-size="8.5" fill="#333">↔  Melting ice (ice → water → ice)</text>
  <text x="20" y="84" font-size="8.5" fill="#333">↔  Dissolving sugar in water</text>
  <text x="20" y="100" font-size="8.5" fill="#333">↔  Tearing paper</text>
  <text x="20" y="116" font-size="8.5" fill="#333">↔  Boiling water</text>
  <text x="20" y="132" font-size="8.5" fill="#333">↔  Bending a wire</text>
  <!-- Physical clue box -->
  <rect x="14" y="146" width="180" height="64" fill="#bbdefb" stroke="#1565c0" stroke-width="1" rx="4"/>
  <text x="104" y="160" text-anchor="middle" font-size="8" font-weight="bold" fill="#1565c0">KEY CLUES (Physical):</text>
  <text x="104" y="172" text-anchor="middle" font-size="7.5" fill="#333">Same substance, different form</text>
  <text x="104" y="183" text-anchor="middle" font-size="7.5" fill="#333">Can be reversed</text>
  <text x="104" y="194" text-anchor="middle" font-size="7.5" fill="#333">No energy change (usually)</text>
  <text x="104" y="205" text-anchor="middle" font-size="7.5" fill="#333">No colour change / gas / precipitate</text>

  <text x="316" y="38" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">CHEMICAL CHANGE</text>

  {
    title:'Atoms, Molecules & Ions',
    body:`<strong>Atom</strong> — the smallest particle of an element that retains its chemical properties.
    <br><br>
    <strong>Molecule</strong> — two or more atoms bonded together (can be same or different elements).
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>H₂ — two hydrogen atoms (element molecule)</li>
      <li>H₂O — hydrogen + oxygen (compound molecule)</li>
      <li>CO₂ — carbon + oxygen (compound molecule)</li>
    </ul>
    <br>
    <strong>Ion</strong> — an atom or group of atoms that has gained or lost electrons, giving it a charge.
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>Na⁺ — sodium loses 1 electron → positive ion (cation)</li>
      <li>Cl⁻ — chlorine gains 1 electron → negative ion (anion)</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
