<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Respiration Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Respiration — JCE Biology Quiz',
  color:'#2e7d32',dark:'#1b5e20',light:'#e8f5e9',
    mcq:[
    {q:'Respiration occurs in:',opts:['Only animal cells','Only plant cells','All living cells','Only muscle cells'],ans:2,exp:'RESPIRATION occurs in ALL LIVING CELLS — both plant and animal, at all times. It releases energy from glucose in the mitochondria.'},
    {q:'The products of aerobic respiration are:',opts:['Glucose and oxygen','Lactic acid','Carbon dioxide, water and ATP','Ethanol and CO₂'],ans:2,exp:'Aerobic respiration: Glucose + O₂ → CO₂ + H₂O + ATP (energy). Complete oxidation of glucose releases maximum energy (~38 ATP).'},
    {q:'During intense exercise, anaerobic respiration produces which waste product in muscles?',opts:['Ethanol','CO₂ and water','Lactic acid','Glucose'],ans:2,exp:'During INTENSE EXERCISE, muscles respire anaerobically (without enough O₂) producing LACTIC ACID. This causes the burning sensation and muscle fatigue.'},
    {q:'Yeast produces ethanol during fermentation. This is used in:',opts:['Making plastics','Bread making and beer brewing','Producing insulin','Manufacturing steel'],ans:1,exp:'Yeast fermentation (Glucose → Ethanol + CO₂) is used in: BREAD MAKING (CO₂ makes dough rise) and BREWING beer/wine (ethanol is the alcohol produced).'},
    {q:'What is ATP?',opts:['A type of glucose','The molecule that stores and transfers energy in cells','A hormone','A type of enzyme'],ans:1,exp:'ATP (Adenosine triphosphate) is the universal energy currency of cells. Energy from respiration is stored in ATP bonds and released when needed for cell processes (muscle contraction, protein synthesis, active transport, etc.).'},
    {q:'The organelle where aerobic respiration takes place is the:',opts:['Nucleus','Ribosome','Mitochondria','Chloroplast'],ans:2,exp:'AEROBIC respiration occurs in the MITOCHONDRIA. This organelle is often called the "powerhouse of the cell" because it produces the majority of the ATP (energy) needed for cell activities.'},
    {q:'What is the main difference between aerobic and anaerobic respiration?',opts:['Aerobic requires oxygen; anaerobic does not','Aerobic occurs in plants; anaerobic in animals','Aerobic produces lactic acid; anaerobic produces ethanol','Aerobic is faster than anaerobic'],ans:0,exp:'The key difference is that AEROBIC respiration requires OXYGEN and completely oxidises glucose, while ANAEROBIC respiration does NOT use oxygen and only partially breaks down glucose.'},
    {q:'The waste product of anaerobic respiration in yeast is:',opts:['Lactic acid','Carbon dioxide only','Ethanol and carbon dioxide','Water'],ans:2,exp:'In YEAST, anaerobic respiration (fermentation) produces ETHANOL (alcohol) and CARBON DIOXIDE (CO₂). This is used in the brewing and baking industries.'},
    {q:'Which process releases the most energy per glucose molecule?',opts:['Anaerobic respiration','Aerobic respiration','Fermentation','Photosynthesis'],ans:1,exp:'AEROBIC respiration releases the maximum amount of energy from a glucose molecule (about 38 ATP). Anaerobic and fermentation release only 2 ATP per glucose molecule because they are incomplete oxidations.'},
    {q:'In the equation for aerobic respiration, the products are:',opts:['O₂ and CO₂','C₆H₁₂O₆ and O₂','CO₂ and H₂O and ATP','Ethanol and CO₂'],ans:2,exp:'The products of aerobic respiration are CARBON DIOXIDE (CO₂), WATER (H₂O), and ENERGY (in the form of ATP). Glucose and oxygen are the reactants.'},
    {q:'The oxygen debt is the:',opts:['Amount of oxygen consumed during exercise','Extra oxygen required after exercise to remove lactic acid','Oxygen stored in the muscles','Oxygen used to make glucose'],ans:1,exp:'The OXYGEN DEBT is the extra oxygen that must be breathed in AFTER exercise to oxidise the accumulated LACTIC ACID into carbon dioxide and water. This is why you continue to breathe heavily after stopping.'},
    {q:'Anaerobic respiration in muscles results in the accumulation of:',opts:['Ethanol','Carbon dioxide','Lactic acid','Oxygen'],ans:2,exp:'In muscles during intense exercise, anaerobic respiration converts glucose into LACTIC ACID. This build-up of lactic acid causes muscle fatigue, pain, and a "burning" sensation.'},
    {q:'Which process is used to make alcoholic beverages?',opts:['Aerobic respiration','Anaerobic respiration in yeast (fermentation)','Photosynthesis','Anaerobic respiration in muscles'],ans:1,exp:'FERMENTATION is the anaerobic respiration of YEAST. It converts glucose into ETHANOL (alcohol) and CO₂. This process is the basis of brewing beer and making wine.'},
    {q:'Why does bread dough rise when yeast is added?',opts:['The yeast produces alcohol','The yeast produces carbon dioxide gas bubbles','The yeast multiplies and expands','The yeast releases heat'],ans:1,exp:'When yeast is added to dough, it respires anaerobically (fermentation), producing CARBON DIOXIDE gas. The CO₂ becomes trapped in the dough, forming bubbles that cause the dough to RISE and become light and fluffy.'},
    {q:'How many ATP molecules are produced from one glucose molecule during anaerobic respiration?',opts:['2','38','8','20'],ans:0,exp:'Anaerobic respiration produces only 2 ATP per glucose molecule. This is because the breakdown of glucose is incomplete. Aerobic respiration produces about 38 ATP per glucose molecule.'},
    {q:'What happens to lactic acid after it has been produced during exercise?',opts:['It is stored in the muscles forever','It is converted back to glucose in the liver or oxidised to CO₂ and H₂O using extra oxygen','It is excreted in urine','It turns into ethanol'],ans:1,exp:'After exercise, the lactic acid is transported to the LIVER where it is converted back into GLUCOSE (via the Cori cycle). Some is also oxidised to CO₂ and H₂O using the extra oxygen consumed during the oxygen debt phase.'},
    {q:'The chemical equation for anaerobic respiration in mammalian muscle is:',opts:['C₆H₁₂O₆ → 2C₃H₆O₃ + 2ATP','C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O','C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂ + 2ATP','C₆H₁₂O₆ → 6CO₂ + 6H₂O'],ans:0,exp:'In mammalian muscle, one glucose molecule is broken down into two LACTIC ACID molecules (C₃H₆O₃) and a net gain of 2 ATP. No oxygen is required.'},
    {q:'The word equation for fermentation in yeast is:',opts:['Glucose → Lactic acid + Energy','Glucose → Ethanol + Carbon dioxide + Energy','Glucose + Oxygen → Carbon dioxide + Water + Energy','Glucose → Carbon dioxide + Water + Energy'],ans:1,exp:'FERMENTATION in yeast: Glucose → Ethanol + Carbon dioxide + Energy (2 ATP). This process is anaerobic and does not use oxygen.'},
    {q:'Respiration is a chemical reaction that:',opts:['Uses energy to build larger molecules','Breaks down glucose to release energy for cell processes','Occurs only during the day','Occurs only in animals'],ans:1,exp:'Respiration is a CATABOLIC chemical reaction that breaks down GLUCOSE to release ENERGY (in the form of ATP). This energy is used by the cell for all life processes (growth, movement, repair).'},
    {q:'The first stage of respiration, which occurs in the cytoplasm and does not require oxygen, is called:',opts:['The Krebs cycle','Glycolysis','The electron transport chain','Fermentation'],ans:1,exp:'GLYCOLYSIS is the first stage of respiration. It occurs in the CYTOPLASM and splits glucose into two pyruvate molecules. It does not require oxygen and produces a net gain of 2 ATP.'},
  ],
  match:[
    {term:'Aerobic respiration',def:'The breakdown of glucose with oxygen to release large amounts of energy (ATP), producing CO₂ and H₂O'},
    {term:'Anaerobic respiration (mammals)',def:'The breakdown of glucose without oxygen, producing lactic acid and a small amount of ATP (2 ATP)'},
    {term:'Fermentation (yeast)',def:'Anaerobic respiration in yeast, producing ethanol (alcohol), carbon dioxide, and 2 ATP'},
    {term:'Mitochondria',def:'The organelle where the later stages of aerobic respiration occur and ATP is produced'},
    {term:'Oxygen debt',def:'The extra oxygen consumed after exercise to oxidise accumulated lactic acid into CO₂ and H₂O'},
    {term:'ATP',def:'Adenosine triphosphate; the molecule that stores and transfers energy within the cell'},
    {term:'Glycolysis',def:'The first stage of respiration, occurring in the cytoplasm, which splits glucose into pyruvate and produces 2 ATP'},
    {term:'Lactic acid',def:'The end product of anaerobic respiration in muscle cells; causes muscle fatigue'},
    {term:'Ethanol',def:'The alcohol produced by yeast during fermentation'},
    {term:'Cori cycle',def:'The process by which lactic acid produced in muscles is transported to the liver and converted back into glucose'},
    {term:'Exothermic',def:'A reaction that releases energy (heat), such as respiration'},
    {term:'Cytoplasm',def:'The jelly-like fluid in cells where the first stage of respiration (glycolysis) takes place'},
    {term:'Pyruvate',def:'The 3-carbon compound produced by glycolysis, which enters the mitochondria for aerobic respiration'},
    {term:'Muscle fatigue',def:'A condition caused by the accumulation of lactic acid during intense anaerobic exercise'},
    {term:'Respirometer',def:'An apparatus used to measure the rate of respiration by measuring oxygen consumption or CO₂ production'},
    {term:'Homeostasis',def:'The maintenance of a constant internal environment; respiration helps maintain this by releasing heat'},
    {term:'Active transport',def:'A process requiring ATP that moves substances against a concentration gradient'},
    {term:'Breathing',def:'The physical process of ventilating the lungs (inhaling and exhaling), often confused with respiration'},
    {term:'Limiting factor',def:'A factor that slows down the rate of respiration if it is in short supply (e.g., O₂ or glucose)'},
    {term:'Enzyme',def:'A biological catalyst that speeds up the chemical reactions of respiration'},
  ],
  flashcards:[
    {q:'Write the word equation for aerobic respiration.',a:'Glucose + Oxygen → Carbon dioxide + Water + Energy (ATP). This reaction is exothermic, meaning it releases energy.'},
    {q:'Write the symbol equation for aerobic respiration.',a:'C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + Energy (approx. 38 ATP). This shows that one glucose molecule and six oxygen molecules are converted into six carbon dioxide and six water molecules.'},
    {q:'What is the oxygen debt and how is it repaid?',a:'During intense exercise, lactic acid accumulates due to anaerobic respiration. After exercise, extra O₂ is breathed in (you continue breathing heavily) to OXIDISE the lactic acid into CO₂ and H₂O. This extra O₂ consumption is the oxygen debt.'},
    {q:'Compare aerobic and anaerobic respiration.',a:'AEROBIC: requires oxygen, produces 38 ATP, complete oxidation of glucose, produces CO₂ and H₂O. ANAEROBIC: does not use oxygen, produces 2 ATP, partial oxidation, produces lactic acid (mammals) or ethanol + CO₂ (yeast).'},
    {q:'Why does the rate of breathing increase during exercise?',a:'During exercise, muscles consume more O₂ and produce more CO₂. The rising CO₂ level in the blood is detected by the brain (medulla). The brain sends signals to increase the breathing RATE and DEPTH to bring in more O₂ and expel more CO₂.'},
    {q:'Describe the three stages of aerobic respiration.',a:'1. GLYCOLYSIS (cytoplasm): Glucose → 2 Pyruvate + 2 ATP. 2. KREBS CYCLE (mitochondrial matrix): Pyruvate → CO₂ + 2 ATP + NADH. 3. ELECTRON TRANSPORT CHAIN (inner mitochondrial membrane): NADH → H₂O + 34 ATP (using oxygen).'},
    {q:'What happens to the products of anaerobic respiration in muscles after exercise?',a:'The lactic acid is transported via the blood to the LIVER. In the liver, it is CONVERTED BACK INTO GLUCOSE (the Cori cycle). Some lactic acid is also oxidised to CO₂ and H₂O using the extra oxygen consumed during the oxygen debt.'},
    {q:'Why does bread dough rise when yeast is added?',a:'The yeast uses the sugar in the dough and respires ANAEROBICALLY (fermentation). This produces CARBON DIOXIDE gas and ethanol. The CO₂ becomes trapped as tiny bubbles within the dough, causing it to RISE and become light and fluffy.'},
    {q:'Explain why muscles cramp during intense physical activity.',a:'When muscles work anaerobically, they produce LACTIC ACID. The build-up of lactic acid lowers the pH within the muscle tissues, which can interfere with muscle contraction and cause the sensation of pain or cramping.'},
    {q:'Why do plants respire during the night?',a:'Plants respire 24 hours a day because they are living organisms. At night, however, they CANNOT photosynthesise (no sunlight), so they only absorb O₂ from the air and release CO₂ through respiration.'},
    {q:'What is the role of the mitochondria in respiration?',a:'The mitochondria are the site of the KREBS CYCLE and the ELECTRON TRANSPORT CHAIN. They are the main site of ATP production during aerobic respiration. Cells with high energy demands (e.g., muscle cells) contain many mitochondria.'},
    {q:'Calculate the energy produced from one molecule of glucose in aerobic versus anaerobic respiration.',a:'Aerobic respiration releases about 38 ATP molecules per glucose. Anaerobic respiration releases only 2 ATP per glucose. This is why aerobic respiration is vastly more efficient for energy production.'},
    {q:'Why is anaerobic respiration considered less efficient than aerobic respiration?',a:'Anaerobic respiration only partially breaks down glucose. The end products (lactic acid or ethanol) still contain a large amount of chemical energy that remains trapped and unavailable. As a result, it only produces 2 ATP compared to 38 ATP in aerobic respiration.'},
    {q:'Explain how the oxygen debt helps muscles recover after exercise.',a:'The oxygen debt ensures that the lactic acid accumulated in muscles is OXIDISED to CO₂ and H₂O, removing the harmful by-product. It provides the extra energy needed to restore muscle pH and replenish ATP supplies used during the intense activity.'},
    {q:'What is the role of ATP in muscle contraction?',a:'ATP is essential for muscle contraction. It provides the chemical energy to power the sliding of actin and myosin filaments within the muscle fibres. Without ATP, muscles cannot contract or relax (rigor mortis occurs after death when ATP runs out).'},
    {q:'Compare the anaerobic respiration in yeast and in animal cells.',a:'In YEAST: Glucose → Ethanol + CO₂ + 2 ATP. In ANIMAL CELLS (muscle): Glucose → Lactic acid + 2 ATP. The key difference is the end product: ethanol in yeast, lactic acid in animals.'},
    {q:'Why do you exhale more carbon dioxide after vigorous exercise?',a:'During vigorous exercise, your muscles use a lot of glucose through AEROBIC RESPIRATION. This produces large amounts of CO₂ as a waste product. The body must exhale this excess CO₂ to prevent it from building up in the blood.'},
    {q:'What is the difference between breathing and respiration?',a:'BREATHING is the physical process of moving air in and out of the lungs (ventilation). RESPIRATION is the CHEMICAL reaction occurring inside cells that breaks down glucose to release energy (ATP).'},
    {q:'Explain how a respirometer is used to measure the rate of respiration in germinating seeds.',a:'A respirometer measures the OXYGEN CONSUMPTION of the seeds. As the seeds respire aerobically, they use up O₂, which causes a drop in pressure. This moves a coloured liquid in a capillary tube. The rate of movement indicates the rate of respiration.'},
    {q:'State two factors that can affect the rate of respiration in a living organism.',a:'1. TEMPERATURE: Respiration is catalysed by enzymes, so it increases with temperature (up to an optimum point). 2. OXYGEN CONCENTRATION: The rate of aerobic respiration increases with O₂ availability. 3. GLUCOSE AVAILABILITY.'},
  ],

    {prompt:'Explain the difference between breathing and cellular respiration.',keywords:['lungs','ventilation','chemical','cells','ATP','physical','oxygen','glucose','carbon dioxide'],hint:'Breathing involves the movement of air into and out of the lungs. Respiration is a chemical process that occurs inside cells to release energy from glucose.'},
    {prompt:'Explain why a long-distance runner continues to breathe heavily for several minutes after finishing a race.',keywords:['oxygen debt','lactic acid','oxidise','CO₂','water','recovery','anaerobic'],hint:'What chemical product accumulates in the muscles during intense exercise? What happens to this product after exercise, and what does the body need to do it?'},
    {prompt:'Explain why fermentation by yeast is useful in the process of making bread.',keywords:['yeast','fermentation','CO₂','glucose','dough','rises','bubbles','bread','ethanol'],hint:'Which product of fermentation (gas) is essential for making the dough rise? What happens to this gas in the dough?'},
    {prompt:'Write a word equation for aerobic respiration and a word equation for anaerobic respiration in human muscle.',keywords:['aerobic','glucose','oxygen','carbon dioxide','water','energy','anaerobic','lactic acid','muscle','ATP'],hint:'Write the reactants and products for both types of respiration. Remember that anaerobic respiration in muscles does not use oxygen and produces a different waste product.'},
    {prompt:'During a 100-metre sprint, a runner uses mainly anaerobic respiration. Explain why.',keywords:['sprint','oxygen','anaerobic','lactic acid','muscle','demand','supply','energy'],hint:'Why does the body not have enough oxygen for aerobic respiration during such intense, short bursts of activity? What happens when oxygen is in short supply?'},
    {prompt:'Compare the energy output (in terms of ATP) of aerobic respiration and anaerobic respiration.',keywords:['aerobic','38 ATP','anaerobic','2 ATP','efficient','glucose','energy','ATP'],hint:'Which process releases more energy per glucose molecule? Why is there such a large difference?'},
    {prompt:'Explain the role of yeast in the brewing industry.',keywords:['yeast','fermentation','ethanol','alcohol','beer','brewing','glucose','CO₂','anaerobic'],hint:'What type of respiration does yeast perform? What is the product that gives beer its alcohol content?'},
    {prompt:'Explain why muscles ache after heavy weightlifting.',keywords:['muscles','weightlifting','anaerobic','lactic acid','pain','ATP','oxygen debt'],hint:'What waste product accumulates in the muscles during heavy exercise? How does this cause pain?'},
    {prompt:'Describe the oxygen debt mechanism.',keywords:['oxygen debt','lactic acid','exercise','oxidised','CO₂','water','recovery','respiration'],hint:'Explain what happens during exercise to create a debt, and how the body repays it after the exercise stops.'},
    {prompt:'A snail in a sealed tube uses up oxygen and produces carbon dioxide. What process is this?',keywords:['snail','respire','oxygen','CO₂','aerobic','anaerobic','living','ATP'],hint:'What chemical process uses oxygen and produces carbon dioxide in a living organism?'},
    {prompt:'Explain why germinating seeds consume oxygen but dry seeds do not.',keywords:['germinating','seeds','respiration','growth','oxygen','energy','ATP','embryo'],hint:'What does a seed need energy for when it begins to germinate? How does it get this energy?'},
    {prompt:'Describe the three stages of aerobic respiration and where they occur.',keywords:['glycolysis','cytoplasm','Krebs cycle','mitochondrial matrix','electron transport chain','inner membrane','ATP','oxygen'],hint:'Name the three stages. Where does each stage occur? Which stage requires oxygen?'},
    {prompt:'How is ATP used in the cell?',keywords:['ATP','energy','muscle contraction','active transport','protein synthesis','cell division','DNA replication'],hint:'Name three cellular processes that require energy from ATP.'},
    {prompt:'Explain why a swimmer who holds their breath for a long time under water may feel lightheaded.',keywords:['breath','holding','CO₂','brain','oxygen','respiration','lightheaded'],hint:'What builds up in the blood when you hold your breath? How does this affect the brain?'},
    {prompt:'Describe what happens to the oxygen and carbon dioxide levels in a sealed jar containing a live mouse over several hours.',keywords:['mouse','sealed','oxygen','decrease','carbon dioxide','increase','respiration','air'],hint:'What gas does the mouse consume? What gas does it produce? What will happen to the levels of these gases over time?'},
    {prompt:'Explain the role of enzymes in cellular respiration.',keywords:['enzymes','catalyst','speed up','respiration','glucose','ATP','denaturation','temperature'],hint:'What do enzymes do to the rate of respiration? What happens to the rate if the temperature is too high?'},
    {prompt:'Why do cells need oxygen for aerobic respiration?',keywords:['oxygen','final electron acceptor','electron transport chain','ATP','mitochondria','aerobic'],hint:'What role does oxygen play in the electron transport chain? Why is the chain stopped without oxygen?'},
    {prompt:'Explain why aerobic respiration is described as a "complete oxidation" of glucose.',keywords:['complete oxidation','glucose','carbon dioxide','water','energy','ATP','oxygen'],hint:'What are the end products of aerobic respiration? What does "complete oxidation" mean in terms of the breakdown of glucose?'},
    {prompt:'A baker adds yeast to dough and leaves it in a warm place. Explain why the dough rises.',keywords:['yeast','dough','warm','CO₂','fermentation','respiration','rise','glucose'],hint:'What does the yeast do to the sugars in the dough? What gas is produced, and how does it affect the dough?'},
    {prompt:'Explain the difference between the word equation for respiration in humans and for fermentation in yeast.',keywords:['aerobic','glucose','oxygen','CO₂','water','yeast','fermentation','ethanol','alcohol','anaerobic'],hint:'One uses oxygen and produces water. The other does not use oxygen and produces alcohol. Write both equations to compare them.'},
  ],
