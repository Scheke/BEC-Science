<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cells Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Cells — JCE Biology Quiz',
  color:'#2e7d32',dark:'#1b5e20',light:'#e8f5e9',
    mcq:[
    {q:'Which organelle is called the "powerhouse" of the cell?',opts:['Nucleus','Ribosome','Mitochondria','Chloroplast'],ans:2,exp:'MITOCHONDRIA produce ATP through aerobic respiration — providing energy for all cell activities. Hence "powerhouse."'},
    {q:'Which structure is found in plant cells but NOT animal cells?',opts:['Nucleus','Cell membrane','Cell wall','Mitochondria'],ans:2,exp:'The CELL WALL (made of cellulose) is found ONLY in plant cells. It provides structural support. Animal cells have a cell membrane but no cell wall.'},
    {q:'The nucleus controls the cell because it contains:',opts:['Glucose','DNA (genetic information)','ATP','Chlorophyll'],ans:1,exp:'The NUCLEUS contains DNA — the instructions (genes) for making all proteins and controlling all cell activities including growth, reproduction, and metabolism.'},
    {q:'Red blood cells have no nucleus so they can:',opts:['Divide faster','Carry more haemoglobin to transport oxygen','Produce more ATP','Photosynthesise'],ans:1,exp:'No nucleus = more space for HAEMOGLOBIN (the oxygen-carrying protein). This adaptation makes RBCs more efficient at their main job: transporting oxygen.'},
    {q:'Protein synthesis occurs at:',opts:['Mitochondria','Chloroplasts','Ribosomes','Cell wall'],ans:2,exp:'RIBOSOMES are the sites of PROTEIN SYNTHESIS. They read mRNA instructions and join amino acids together to make proteins.'},
    {q:'Which of the following is NOT a function of the cell membrane?',opts:['Controls what enters and leaves','Acts as a selectively permeable barrier','Site of aerobic respiration','Protects the cell'],ans:2,exp:'The CELL MEMBRANE controls entry/exit and is a selectively permeable barrier. Aerobic respiration occurs in the MITOCHONDRIA, not at the cell membrane.'},
    {q:'The permanent vacuole in a plant cell is important for:',opts:['Photosynthesis','Storing cell sap and maintaining turgor pressure','Protein synthesis','Producing ATP'],ans:1,exp:'The large permanent VACUOLE stores cell sap (sugars, salts, pigments). When full of water, it exerts TURGOR PRESSURE against the cell wall, keeping the plant firm and upright.'},
    {q:'Chloroplasts are found in which part of the plant?',opts:['Roots','Flowers only','Leaves and green stems','Seeds'],ans:2,exp:'CHLOROPLASTS contain chlorophyll and are found in the LEAVES and green stems (where photosynthesis occurs). They are absent from non-green parts like roots and seeds.'},
    {q:'During cell differentiation, a stem cell becomes:',opts:['A dead cell','A specialised cell with a specific function','Larger in size','A chloroplast'],ans:1,exp:'DIFFERENTIATION is the process where unspecialised (stem) cells develop specific structures to carry out a particular job, e.g., a muscle cell, nerve cell, or root hair cell.'},
    {q:'A group of similar cells working together is called a:',opts:['Organ','Organ system','Tissue','Organism'],ans:2,exp:'TISSUE = a group of similar cells performing the same function (e.g., muscle tissue, nervous tissue). Organs are made of multiple tissues working together.'},
    {q:'Which organelle contains chlorophyll?',opts:['Mitochondria','Chloroplast','Nucleus','Ribosome'],ans:1,exp:'CHLOROPLASTS contain the green pigment CHLOROPHYLL, which absorbs light energy for photosynthesis. This is why plants are green.'},
    {q:'A cell that has a large number of mitochondria is most likely a:',opts:['Fat storage cell','Muscle cell (high energy demand)','Skin cell','Red blood cell'],ans:1,exp:'Muscle cells require large amounts of ENERGY for contraction. Therefore, they have MANY MITOCHONDRIA to produce ATP via aerobic respiration.'},
    {q:'The main difference between a plant cell and an animal cell is that plant cells:',opts:['Have no mitochondria','Do not contain DNA','Have a cell wall, chloroplasts, and a permanent vacuole','Have no nucleus'],ans:2,exp:'Plant cells are distinguished by three structures: a rigid CELL WALL (cellulose), CHLOROPLASTS for photosynthesis, and a large permanent VACUOLE containing cell sap.'},
    {q:'Sperm cells have many mitochondria to:',opts:['Produce hormones','Swim faster (provide energy for flagellum movement)','Fertilise the egg','Produce DNA'],ans:1,exp:'The sperm cell uses its flagellum to swim to the egg. This requires large amounts of ENERGY. Many mitochondria provide the ATP to power this movement.'},
    {q:'Which structure is responsible for storage of genetic material?',opts:['Ribosome','Cell membrane','Nucleus','Cytoplasm'],ans:2,exp:'The NUCLEUS stores the cell\'s genetic material (DNA) arranged into chromosomes. It controls the cell\'s activities by regulating gene expression.'},
    {q:'The cytoplasm is best described as:',opts:['A solid structure','A jelly-like fluid where chemical reactions occur','The outer boundary of the cell','The site of photosynthesis'],ans:1,exp:'CYTOPLASM is a jelly-like substance containing dissolved nutrients and enzymes. Most cellular chemical reactions, including the first stages of respiration (glycolysis), occur in the cytoplasm.'},
    {q:'Which of the following is an example of a tissue?',opts:['Heart','Xylem','Muscle cell','Leaf'],ans:1,exp:'XYLEM is a tissue made of hollow, dead cells that transports water and mineral ions from roots to leaves. The heart and leaf are ORGANS. A muscle cell is a single cell.'},
    {q:'In a cell, the site of anaerobic respiration is:',opts:['Nucleus','Cytoplasm','Mitochondria','Vacuole'],ans:1,exp:'Anaerobic respiration occurs in the CYTOPLASM. Aerobic respiration starts in the cytoplasm and finishes in the mitochondria. Anaerobic respiration does not use mitochondria.'},
    {q:'Root hair cells have a large surface area to:',opts:['Carry out photosynthesis','Absorb more water and minerals from the soil','Store more starch','Produce more ATP'],ans:1,exp:'Root hair cells are specialised for ABSORPTION. Their long, thin extensions increase the surface area, allowing them to absorb more WATER and dissolved MINERAL IONS from the soil.'},
    {q:'Which of the following contains the correct order of biological organisation?',opts:['Cell → Organ → Tissue → Organ system → Organism','Tissue → Cell → Organ → Organ system → Organism','Cell → Tissue → Organ → Organ system → Organism','Organ → Tissue → Cell → Organ system → Organism'],ans:2,exp:'The correct hierarchy is: CELL (basic unit) → TISSUE (similar cells) → ORGAN (multiple tissues) → ORGAN SYSTEM (multiple organs) → ORGANISM (whole living thing).'},
  ],
  match:[
    {term:'Cell membrane',def:'Controls the movement of substances into and out of the cell (selectively permeable barrier)'},
    {term:'Nucleus',def:'Contains the genetic material (DNA); controls all cellular activities'},
    {term:'Mitochondria',def:'The site of aerobic respiration; produces ATP (energy) for the cell'},
    {term:'Chloroplast',def:'The site of photosynthesis; contains chlorophyll (found in plant cells only)'},
    {term:'Cell wall',def:'A rigid, outer layer made of cellulose; provides structural support (plant cells only)'},
    {term:'Vacuole',def:'A large, fluid-filled sac in plant cells that stores cell sap and helps maintain turgor pressure'},
    {term:'Cytoplasm',def:'A jelly-like fluid where many metabolic chemical reactions take place'},
    {term:'Ribosome',def:'The small organelle where protein synthesis occurs'},
    {term:'Tissue',def:'A group of similar cells that work together to perform a specific function'},
    {term:'Organ',def:'A group of different tissues working together to perform a specific function'},
    {term:'Organ system',def:'A group of organs working together to carry out a major life function'},
    {term:'Differentiation',def:'The process by which a cell becomes specialised to perform a specific function'},
    {term:'Specialised cell',def:'A cell with specific structural adaptations that allow it to carry out a particular job efficiently'},
    {term:'Haemoglobin',def:'The red, iron-containing protein in red blood cells that binds to oxygen for transport'},
    {term:'Turgor pressure',def:'The outward pressure exerted by the vacuole against the cell wall in plant cells'},
    {term:'Selectively permeable',def:'A membrane property that allows only certain molecules to pass through'},
    {term:'DNA',def:'Deoxyribonucleic acid; the molecule carrying the genetic instructions for life'},
    {term:'Cellulose',def:'The complex carbohydrate that makes up the rigid plant cell wall'},
    {term:'Flagellum',def:'A tail-like structure on sperm cells that provides motility (movement)'},
    {term:'ATP',def:'Adenosine triphosphate; the main energy-carrying molecule in cells'},
  ],
  flashcards:[
    {q:'Name 3 structures found in both plant and animal cells.',a:'Both plant and animal cells have a CELL MEMBRANE, NUCLEUS, CYTOPLASM, MITOCHONDRIA, and RIBOSOMES. These 5 structures are common to both types of eukaryotic cells.'},
    {q:'Name 3 structures found ONLY in plant cells.',a:'1. CELL WALL (made of cellulose, provides rigid support). 2. CHLOROPLASTS (contain chlorophyll, site of photosynthesis). 3. A LARGE PERMANENT VACUOLE (stores cell sap and maintains turgor).'},
    {q:'What is cell differentiation?',a:'DIFFERENTIATION is the biological process where an unspecialised (stem) cell develops special features or structures to become adapted for a specific job. For example, a muscle cell develops contractile filaments, and a nerve cell grows long axons.'},
    {q:'What is the correct order of biological organisation from the simplest to the most complex?',a:'The hierarchy is: CELL (basic unit of life) → TISSUE (group of similar cells) → ORGAN (group of different tissues) → ORGAN SYSTEM (group of organs working together) → ORGANISM (complete living entity).'},
    {q:'Why do muscle cells contain a large number of mitochondria?',a:'Muscle cells are responsible for CONTRACTION, which requires a continuous supply of ENERGY (ATP). Mitochondria are the site of aerobic respiration, producing ATP. Therefore, muscle cells have many mitochondria to meet this high energy demand.'},
    {q:'Why are root hair cells adapted with a large surface area?',a:'Root hair cells have long, thin, finger-like extensions that significantly increase their SURFACE AREA. This allows them to absorb WATER and dissolved MINERAL IONS from the soil much more efficiently through osmosis and active transport.'},
    {q:'Describe how a red blood cell is adapted to its function.',a:'Red blood cells have: 1) A BICONCAVE SHAPE (increases surface area for O₂ uptake). 2) NO NUCLEUS (more space for haemoglobin). 3) Contains HAEMOGLOBIN (a protein that binds reversibly with oxygen for transport).'},
    {q:'What is the primary function of the cell membrane?',a:'The cell membrane is a SELECTIVELY PERMEABLE barrier. Its function is to CONTROL the movement of substances into and out of the cell. It allows essential nutrients (like glucose and amino acids) in and removes waste products (like CO₂ and urea).'},
    {q:'How do sperm cells differ from egg cells in terms of structure?',a:'SPERM cells are small, have a FLAGELLUM for swimming, and have many MITOCHONDRIA to supply energy. EGG cells are large, contain a store of nutrients (yolk) for the developing embryo, and are non-motile.'},
    {q:'State the function of the chloroplast.',a:'CHLOROPLASTS are organelles found ONLY in plant cells. They contain CHLOROPHYLL, the green pigment that captures light energy. This energy is used to drive the process of PHOTOSYNTHESIS, converting carbon dioxide and water into glucose and oxygen.'},
    {q:'What is the difference between a tissue and an organ?',a:'A TISSUE is a group of similar cells working together to perform a specific function (e.g., muscle tissue, xylem tissue). An ORGAN is a group of DIFFERENT tissues working together to carry out a particular job (e.g., the heart is an organ made of muscle, nervous, and epithelial tissue).'},
    {q:'Explain why root hair cells are adapted with a large number of mitochondria.',a:'Root hair cells absorb mineral ions (like nitrates) from the soil via ACTIVE TRANSPORT. Active transport requires a large amount of ATP (energy). Therefore, root hair cells need many MITOCHONDRIA to produce the ATP required to pump ions against their concentration gradient.'},
    {q:'What is the main structural difference between plant and animal cells regarding their outer layer?',a:'Plant cells have a rigid CELLULOSE CELL WALL outside the cell membrane, which provides shape and support. Animal cells only have a CELL MEMBRANE, which is flexible and lacks a rigid outer wall.'},
    {q:'What is the function of haemoglobin in red blood cells?',a:'HAEMOGLOBIN is a red, iron-containing protein. Its function is to bind with OXYGEN in the lungs to form oxyhaemoglobin. It transports the oxygen to the body tissues, where it is released for cellular respiration.'},
    {q:'What is the significance of the cell wall being fully permeable?',a:'The fully permeable nature of the cellulose cell wall allows WATER and dissolved minerals to pass through freely to reach the cell membrane. It also allows the vacuole to push against the wall to create TURGOR pressure, which keeps the plant rigid.'},
    {q:'How does a palisade mesophyll cell differ from a root hair cell?',a:'PALISADE cells are specialised for PHOTOSYNTHESIS. They contain many CHLOROPLASTS and are packed with chlorophyll. ROOT HAIR cells are specialised for ABSORPTION of water and minerals. They have a long extension (large surface area) and many MITOCHONDRIA for active transport.'},
    {q:'Why do nerve cells (neurons) have a long, fibrous structure?',a:'Nerve cells have long AXONS that allow them to carry electrical IMPULSES over long distances. The fibres are insulated by a myelin sheath, allowing rapid transmission of signals between the central nervous system and the body.'},
    {q:'Explain why animal cells do not have a cell wall.',a:'Animal cells do not need structural support from a rigid cell wall because animals move and rely on internal skeletons (or hydrostatic skeletons) for support. A cell wall would limit flexibility and movement. Plant cells are static and require the wall for upright growth.'},
    {q:'Which organ in the human body is an example of an organ system?',a:'The DIGESTIVE SYSTEM is an organ system. It is made up of multiple organs including the mouth, stomach, small intestine, large intestine, liver, pancreas, and rectum, all working together to break down food and absorb nutrients.'},
    {q:'Describe the structure of a typical animal cell.',a:'A typical animal cell consists of: a CELL MEMBRANE (outer boundary), CYTOPLASM (jelly-like fluid where reactions occur), a NUCLEUS (containing DNA), and MITOCHONDRIA (energy producers). It also contains RIBOSOMES for protein synthesis.'},
  ],
  blanks:{
    passage:'The organelle that contains the cell\'s DNA and controls all activities is the [_]. The jelly-like fluid where chemical reactions occur is called the [_]. Energy is produced by the [_] through aerobic respiration. Plant cells are distinguished by having a rigid [_] made of cellulose, and they contain [_] for photosynthesis.',
    answers:['nucleus','cytoplasm','mitochondria','cell wall','chloroplasts'],
    wordbank:['nucleus','cytoplasm','mitochondria','cell wall','chloroplasts','vacuole','membrane','ribosomes'],
  },
  sentences:[
    {prompt:'Describe three structural adaptations of a red blood cell that make it highly efficient for transporting oxygen.',keywords:['biconcave','haemoglobin','no nucleus','surface area','oxygen','transport'],hint:'Think about its shape, the protein it contains, and what it lacks to make room for more of that protein.'},
    {prompt:'Compare the structure of a typical plant cell with a typical animal cell, listing the similarities and differences.',keywords:['cell wall','chloroplast','vacuole','nucleus','mitochondria','membrane','differences'],hint:'What structures do they both share? What structures does the plant cell have that the animal cell lacks?'},
    {prompt:'Explain why specialised cells are essential for the efficient functioning of a complex multicellular organism.',keywords:['differentiation','function','tissue','efficient','adapted','specialised','organ'],hint:'Why is it more efficient to have different cells performing specific jobs rather than all cells being identical and doing everything?'},
    {prompt:'Why do muscle cells in the human heart contain many mitochondria?',keywords:['heart','muscle','contraction','energy','ATP','mitochondria','aerobic respiration'],hint:'Does the heart ever rest? What does it require constantly to keep beating?'},
    {prompt:'Describe the function of the cell membrane and explain why it is described as "selectively permeable".',keywords:['cell membrane','selectively permeable','controls','entry','exit','substances','barrier'],hint:'What decides which molecules can enter or leave the cell? Why is this control vital for the cell?'},
    {prompt:'Explain how root hair cells are adapted to absorb water and mineral ions from the soil.',keywords:['root hair','extension','surface area','water','osmosis','minerals','active transport','mitochondria'],hint:'What physical feature allows them to absorb more efficiently? Why do they need a large number of mitochondria?'},
    {prompt:'List the levels of organisation in a multicellular organism from the simplest to the most complex.',keywords:['cell','tissue','organ','organ system','organism','hierarchy'],hint:'Start with the basic unit of life and work up to the whole living thing.'},
    {prompt:'Why do mature red blood cells in mammals lack a nucleus, mitochondria, and other organelles?',keywords:['red blood cell','no nucleus','haemoglobin','space','oxygen','transport','efficiency'],hint:'Does a mature red blood cell need to divide? Does it need energy? What does it need maximum space for?'},
    {prompt:'State the functions of chloroplasts and mitochondria in a plant cell.',keywords:['chloroplast','photosynthesis','glucose','oxygen','mitochondria','respiration','ATP','energy'],hint:'One uses light to make food; the other breaks down food to release usable energy.'},
    {prompt:'A group of similar cells forms a tissue. Give two examples of tissues and their functions in plants.',keywords:['tissue','xylem','transport','water','phloem','sugars','palisade','photosynthesis'],hint:'Name two types of plant tissues and state what they do.'},
    {prompt:'Explain why a plant cell maintains its rigidity (turgidity) when placed in pure water, but an animal cell may burst.',keywords:['osmosis','water','turgor','cell wall','membrane','burst','rigid'],hint:'What structural difference between plant and animal cells allows the plant to survive the influx of water?'},
    {prompt:'Describe the structure and function of a sperm cell.',keywords:['sperm','flagellum','tail','mitochondria','energy','nucleus','DNA','fertilisation'],hint:'What does the sperm cell use to swim? How does it get the energy for this movement?'},
    {prompt:'Discuss why the nucleus is considered the "control centre" of the cell.',keywords:['nucleus','DNA','genes','genetic code','proteins','control','instructions'],hint:'What molecule is stored in the nucleus? What does that molecule dictate the cell to do?'},
    {prompt:'Explain the significance of the vacuole in a plant cell for the health of the plant.',keywords:['vacuole','cell sap','turgor pressure','support','store','nutrients','waste'],hint:'What happens to the plant if the vacuole loses its water (due to lack of watering)? What is its role in structure?'},
    {prompt:'Compare the function of a palisade mesophyll cell and a root hair cell.',keywords:['palisade','photosynthesis','chloroplast','root hair','absorption','water','minerals','adaptation'],hint:'One cell is specialised for making food; the other is specialised for taking in resources. How is each structurally adapted?'},
    {prompt:'Differentiate between a tissue and an organ, giving one example of each from the human body.',keywords:['tissue','group','similar','muscle','organ','different','stomach','heart'],hint:'What is the difference between "similar cells" working together versus "different tissues" working together?'},
    {prompt:'Why do nerve cells (neurons) have a unique elongated structure?',keywords:['nerve cell','neuron','axon','dendrite','impulse','signal','transmission'],hint:'What happens to the size of a nerve cell to allow it to send signals from the brain all the way to the toes?'},
    {prompt:'Explain why a plant wilts if it is not watered for several days.',keywords:['wilting','water','osmosis','vacuole','turgor','support','plasmolysis'],hint:'What happens to the water content and volume of the vacuole when water is unavailable? How does this affect the plant\'s support system?'},
    {prompt:'Define the term "specialised cell" and give one example.',keywords:['specialised cell','differentiation','function','adapted','xylem','muscle','ciliated','cell'],hint:'What does it mean for a cell to be specialised, and what example shows this well?'},
    {prompt:'Why do small organisms (like amoeba) not require specialised cells and organ systems like large organisms do?',keywords:['small','surface area','volume','diffusion','specialised','distance','efficient'],hint:'How does the size of a simple organism affect its ability to transport substances in and out of the cell without specialised systems?'},
  ],
});
</script></body></html>
