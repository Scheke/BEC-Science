<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sound Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Sound — JCE Physics Quiz',
  color:'#00695c',dark:'#003d33',light:'#e0f2f1',
    mcq:[
    {q:'Sound waves are:',opts:['Transverse electromagnetic waves','Longitudinal mechanical waves','Transverse mechanical waves','Electromagnetic waves that need no medium'],ans:1,exp:'Sound waves are LONGITUDINAL MECHANICAL waves — particle oscillations are PARALLEL to the direction of travel, and they need a MEDIUM (cannot travel through vacuum).'},
    {q:'A sound wave has frequency 680 Hz and speed 340 m/s. Its wavelength is:',opts:['0.25 m','0.5 m','2000 m','1020 m'],ans:1,exp:'v = f × λ → λ = v/f = 340/680 = 0.5 m.'},
    {q:'Sound travels FASTEST through:',opts:['Air','Water','Vacuum','Steel'],ans:3,exp:'Sound travels fastest through STEEL (solids) — about 5000 m/s. The tightly packed, strongly bonded particles pass vibrations very quickly. Air ≈ 340 m/s; Water ≈ 1500 m/s; Vacuum = 0 (cannot travel).'},
    {q:'A higher pitch sound has:',opts:['Lower frequency','Higher amplitude','Higher frequency','Longer wavelength'],ans:2,exp:'PITCH = FREQUENCY. Higher pitch = HIGHER FREQUENCY = shorter wavelength. Human hearing: 20 Hz to 20,000 Hz.'},
    {q:'Ultrasound is used in medical imaging because:',opts:['It is louder than normal sound','It can create images of internal structures without ionising radiation','It travels faster than X-rays','It is visible to the naked eye'],ans:1,exp:'Ultrasound is used for medical IMAGING (e.g. foetal scans) because it is NON-IONISING (doesn\'t damage DNA like X-rays), reflects off internal boundaries to create images.'},
    {q:'The speed of sound in air is approximately:',opts:['300,000 km/s','340 m/s','1500 m/s','5000 m/s'],ans:1,exp:'The speed of sound in air at room temperature is approximately 340 m/s (about 1230 km/h). Light travels much faster (300,000 km/s).'},
    {q:'An increase in the amplitude of a sound wave causes:',opts:['A higher pitch','A louder sound','A lower pitch','A softer sound'],ans:1,exp:'AMPLITUDE determines LOUDNESS (volume). A larger amplitude means more energy is transferred by the wave, resulting in a LOUDER sound. Frequency determines pitch.'},
    {q:'Human beings can hear sounds with frequencies in the range of approximately:',opts:['20 Hz to 20,000 Hz','10 Hz to 1000 Hz','100 Hz to 50,000 Hz','1 Hz to 10,000 Hz'],ans:0,exp:'The average human hearing range is 20 Hz to 20,000 Hz (20 kHz). Sounds below 20 Hz are infrasound; sounds above 20,000 Hz are ultrasound.'},
    {q:'Which of the following is an example of a longitudinal wave?',opts:['Light waves','Radio waves','Sound waves','Water waves'],ans:2,exp:'SOUND waves are longitudinal. Light, radio, and water waves are transverse. In a longitudinal wave, particles oscillate parallel to the direction of energy transfer.'},
    {q:'The loudness of a sound depends on its:',opts:['Frequency','Speed','Amplitude','Wavelength'],ans:2,exp:'LOUDNESS depends on the AMPLITUDE of the sound wave. A larger amplitude means the wave carries more energy, making the sound louder to the ear.'},
    {q:'The human ear converts sound waves into:',opts:['Electrical impulses','Light waves','Radio signals','Mechanical energy'],ans:0,exp:'The ear converts sound waves (mechanical vibrations) into ELECTRICAL IMPULSES (nerve signals). These impulses travel along the auditory nerve to the brain, where they are interpreted as sound.'},
    {q:'What is the order of the parts of the ear that sound waves pass through?',opts:['Eardrum → Cochlea → Ossicles','Ossicles → Eardrum → Cochlea','Eardrum → Ossicles → Cochlea','Cochlea → Ossicles → Eardrum'],ans:2,exp:'Sound travels: EARDRUM (vibrates) → OSSICLES (amplify) → COCHLEA (converts to nerve impulses).'},
    {q:'An echo is the:',opts:['Absorption of sound','Refraction of sound','Reflection of sound','Diffraction of sound'],ans:2,exp:'An ECHO is a reflected sound wave. It occurs when sound hits a hard, reflective surface and bounces back to the listener. The time delay between the original sound and the echo is used to measure distances.'},
    {q:'If the speed of sound in air is 340 m/s, how long does it take for sound to travel 1700 metres?',opts:['5 seconds','2 seconds','0.5 seconds','10 seconds'],ans:0,exp:'Time = Distance / Speed = 1700 m / 340 m/s = 5 seconds. This is the time it takes for the sound to travel that distance.'},
    {q:'Ultrasound waves have frequencies:',opts:['Below 20 Hz','Between 20 Hz and 20,000 Hz','Above 20,000 Hz','Exactly 1000 Hz'],ans:2,exp:'ULTRASOUND refers to sound waves with frequencies ABOVE 20,000 Hz (the upper limit of human hearing). They are used in medical imaging and industrial testing.'},
    {q:'What is the function of the cochlea in the ear?',opts:['To collect sound waves','To amplify vibrations','To convert vibrations into electrical impulses','To equalise pressure'],ans:2,exp:'The COCHLEA is a fluid-filled, spiral-shaped structure in the inner ear. Its hair cells convert mechanical vibrations into ELECTRICAL IMPULSES that are sent to the brain.'},
    {q:'Sound travels faster in solids than in gases because:',opts:['Solids are denser and particles are closely packed, allowing vibrations to transmit faster','Solids are less dense','Gases have more particles','Solids have no particles'],ans:0,exp:'In solids, particles are tightly packed and have strong intermolecular bonds. This allows vibrations to be passed on much more quickly. In gases, particles are far apart, so sound travels slower.'},
    {q:'A student shouts at a cliff and hears an echo after 2 seconds. If the speed of sound is 340 m/s, how far is the cliff?',opts:['680 m','340 m','170 m','1360 m'],ans:1,exp:'Distance = (v × t) / 2 = (340 m/s × 2 s) / 2 = 340 m. The sound travels to the cliff and back; divide the total distance by 2 to find the one-way distance.'},
    {q:'An explosion creates sound waves that travel in all directions. Which property of sound causes the loudness to decrease as you move farther away?',opts:['Frequency','Wavelength','Amplitude (and energy spread)','Speed'],ans:2,exp:'As sound waves spread out from a source, the energy is distributed over a larger area. This means the AMPLITUDE of the wave decreases, so the sound becomes QUIETER.'},
    {q:'The three ossicles in the ear are the:',opts:['Hammer, Anvil, Stirrup (Malleus, Incus, Stapes)','Drum, Stirrup, Cochlea','Hammer, Tympanum, Stapes','Anvil, Cochlea, Drum'],ans:0,exp:'The three tiny bones in the middle ear are the MALLEUS (hammer), INCUS (anvil), and STAPES (stirrup). They amplify the vibrations from the eardrum and transmit them to the cochlea.'},
  ],
  match:[
    {term:'Frequency',def:'The number of complete vibrations (waves) per second; determines the pitch of a sound; measured in Hertz (Hz)'},
    {term:'Amplitude',def:'The maximum displacement of particles from their rest position; determines the loudness of a sound'},
    {term:'Wavelength',def:'The distance between two successive compressions or rarefactions in a longitudinal wave'},
    {term:'Echo',def:'The reflection of a sound wave from a hard surface, heard after the original sound'},
    {term:'Ultrasound',def:'Sound waves with frequencies above 20,000 Hz, which are inaudible to humans and used in medical imaging'},
    {term:'Compression',def:'A region of high particle density (high pressure) in a longitudinal wave, where particles are pushed together'},
    {term:'Rarefaction',def:'A region of low particle density (low pressure) in a longitudinal wave, where particles are spread apart'},
    {term:'Longitudinal wave',def:'A wave where the particles oscillate parallel to the direction of energy transfer (e.g., sound waves)'},
    {term:'Transverse wave',def:'A wave where the particles oscillate perpendicular to the direction of energy transfer (e.g., light waves)'},
    {term:'Pitch',def:'The quality of a sound determined by its frequency; high frequency = high pitch'},
    {term:'Loudness',def:'The quality of a sound determined by its amplitude; large amplitude = loud sound'},
    {term:'Ossicles',def:'The three tiny bones in the middle ear: malleus (hammer), incus (anvil), and stapes (stirrup)'},
    {term:'Eardrum (tympanum)',def:'A thin membrane that vibrates when struck by sound waves, passing the vibrations to the ossicles'},
    {term:'Cochlea',def:'A fluid-filled, spiral structure in the inner ear that converts mechanical vibrations into electrical nerve impulses'},
    {term:'Auditory nerve',def:'The nerve that carries electrical impulses from the cochlea to the brain'},
    {term:'SONAR',def:'A technique that uses ultrasound pulses to detect objects and measure distances underwater'},
    {term:'Infrasound',def:'Sound waves with frequencies below 20 Hz, which are inaudible to humans'},
    {term:'Medium',def:'The material (solid, liquid, or gas) through which a mechanical wave travels'},
    {term:'Vacuum',def:'A space containing no particles; sound cannot travel through a vacuum'},
    {term:'Doppler effect',def:'The apparent change in frequency (or pitch) of a sound when the source and/or observer is moving relative to each other'},
  ],
  flashcards:[
    {q:'What is the difference between a transverse wave and a longitudinal wave?',a:'TRANSVERSE: The oscillations (vibrations) are PERPENDICULAR (at 90°) to the direction of energy travel (e.g., light waves, water waves). LONGITUDINAL: The oscillations are PARALLEL to the direction of energy travel (e.g., sound waves).'},
    {q:'How does an echo work, and how do you calculate the distance to a reflective surface (like a cliff or wall)?',a:'An ECHO occurs when sound waves hit a hard surface and REFLECT back to the listener. To find distance: Distance = (Speed of sound × Total time) ÷ 2. (You divide by 2 because the sound travels to the surface AND back.)'},
    {q:'Why can sound not travel through a vacuum (space)?',a:'Sound is a MECHANICAL wave. It requires particles to vibrate and pass the energy along. In a vacuum, there are NO PARTICLES to vibrate. Therefore, sound cannot travel through a vacuum. Electromagnetic waves (like light) can, as they do not need a medium.'},
    {q:'State 3 uses of ultrasound in medicine, industry, or navigation.',a:'1. MEDICAL IMAGING: Used for scanning foetuses and organs (echoes are used to build images). 2. SONAR: Used by ships to measure depth and detect submarines. 3. LITHOTRIPSY: Used to break up kidney stones without surgery. 4. CLEANING: Used to clean delicate instruments. 5. CRACK DETECTION: Used to find flaws in metal structures.'},
    {q:'Describe how the ear converts sound waves into nerve impulses that the brain can interpret.',a:'1. Sound waves hit the EARDRUM, causing it to VIBRATE. 2. The three OSSICLES (malleus, incus, stapes) AMPLIFY these vibrations. 3. Vibrations pass to the COCHLEA, a fluid-filled spiral tube. 4. Hair cells inside the cochlea CONVERT vibrations into ELECTRICAL IMPULSES. 5. The AUDITORY NERVE carries these impulses to the brain.'},
    {q:'Explain why sound travels faster in solids than in gases.',a:'In solids, particles are tightly packed and strongly bonded together. When one particle vibrates, it quickly passes the vibration to its neighbours. In gases, particles are widely spaced and weakly bonded, so the transfer of vibrations is much slower.'},
    {q:'A ship sends a sonar pulse down to the ocean floor and receives an echo after 2 seconds. If the speed of sound in seawater is 1500 m/s, how deep is the ocean at that point?',a:'Distance = (Speed × Time) / 2 = (1500 m/s × 2 s) / 2 = 1500 m. The sound takes 1 second to reach the seafloor and 1 second to return, so the depth is 1500 metres.'},
    {q:'What is the relationship between frequency, wavelength, and speed for sound waves?',a:'They are linked by the wave equation: SPEED = FREQUENCY × WAVELENGTH (v = f × λ). This means if the speed is constant (e.g., in air at 340 m/s), higher frequency waves have shorter wavelengths.'},
    {q:'Why is ultrasound used in medical imaging instead of X-rays for scanning babies?',a:'Ultrasound is NON-IONISING radiation, meaning it does not damage cells or DNA. X-rays are ionising and can cause mutations or cancer. Ultrasound is safe for the developing foetus.'},
    {q:'A person shouts at a cliff and hears the echo 0.8 seconds later. If the speed of sound is 340 m/s, how far away is the cliff?',a:'Distance = (Speed × Time) / 2 = (340 m/s × 0.8 s) / 2 = 272 m / 2 = 136 m. The cliff is 136 metres away.'},
    {q:'How does the Doppler effect apply to sound waves?',a:'The Doppler effect is the apparent change in FREQUENCY (and therefore PITCH) when the source of the sound and the observer are moving relative to each other. When a source moves towards you, the waves bunch up, giving a HIGHER PITCH. When it moves away, the waves spread out, giving a LOWER PITCH.'},
    {q:'Explain the difference between the cochlea and the auditory nerve.',a:'The COCHLEA is the fluid-filled, spiral organ that CONVERTS mechanical vibrations into electrical impulses. The AUDITORY NERVE is the nerve pathway that carries those electrical impulses from the cochlea to the brain for interpretation.'},
    {q:'What are the three parts of the ear, and what is the function of each?',a:'OUTER EAR: Collects sound waves. MIDDLE EAR: Amplifies vibrations (eardrum + ossicles). INNER EAR: Converts vibrations to nerve impulses (cochlea).'},
    {q:'A student in a school hall claps her hands and hears an echo after 0.1 seconds. The hall is 17 metres long. Does this confirm the speed of sound is approximately 340 m/s?',a:'Distance = 17 m (one way). Total distance for echo = 34 m. Speed = Distance / Time = 34 m / 0.1 s = 340 m/s. Yes, this confirms the accepted speed of sound in air.'},
    {q:'Explain the terms "compression" and "rarefaction" in a longitudinal wave.',a:'COMPRESSION is a region where particles are PUSHED CLOSER TOGETHER (high pressure). RAREFACTION is a region where particles are SPREAD FURTHER APART (low pressure). A longitudinal wave is a series of alternating compressions and rarefactions.'},
    {q:'Why does the pitch of a siren change as an ambulance drives past you?',a:'This is the DOPPLER EFFECT. As the ambulance approaches, the sound waves are compressed, resulting in a HIGHER FREQUENCY (higher pitch). As it moves away, the waves are stretched, resulting in a LOWER FREQUENCY (lower pitch).'},
    {q:'How does the ear amplify sound before it reaches the cochlea?',a:'The EARDRUM captures sound waves and causes the three OSSICLES (malleus, incus, stapes) to vibrate. The ossicles act as a lever system that amplifies the force of the vibration before transmitting it to the fluid-filled cochlea.'},
    {q:'Describe how SONAR is used to map the ocean floor.',a:'SONAR (Sound Navigation and Ranging) uses a ship to send OUT ultrasound pulses to the ocean floor. These pulses REFLECT off the seabed and return as echoes to the ship. By measuring the time taken for the echo to return, the depth can be calculated, building a map of the ocean floor.'},
    {q:'What determines the speed of sound in a medium?',a:'The speed depends on the ELASTICITY and DENSITY of the medium. Sound travels fastest in solids (high elasticity, tightly packed particles). It travels slower in liquids and slowest in gases (low elasticity, widely spaced particles).'},
    {q:'Can sound travel through a vacuum? Explain your answer.',a:'NO. Sound is a mechanical wave, which requires a medium to propagate. A vacuum contains no particles. Therefore, sound cannot travel through a vacuum. (This is why astronauts cannot hear each other directly in space.)'},
  ],
  blanks:{
    passage:'Sound waves are longitudinal [_] waves that require a material medium to travel through. The frequency of a sound wave determines its [_]. High-frequency sound waves above 20,000 Hz are called [_] and have medical applications such as imaging. When sound bounces off a hard surface and returns to the listener, it is called an [_]. To calculate the distance to a reflecting surface using an echo, the equation is: distance = speed × time ÷ [_].',
    answers:['mechanical','pitch','ultrasound','echo','2'],
    wordbank:['mechanical','pitch','ultrasound','echo','2','frequency','amplitude','transverse'],
  },
  sentences:[
    {prompt:'Explain why astronauts in space cannot hear explosions occurring nearby outside their spacecraft.',keywords:['vacuum','medium','particles','space','sound','longitudinal','mechanical','travel'],hint:'What physical requirement does sound need to travel? What is the environment in outer space like?'},
    {prompt:'A ship sends a SONAR pulse towards the seabed and receives the echo after 2 seconds. If the speed of sound in seawater is 1500 m/s, calculate the depth of the seabed.',keywords:['SONAR','echo','speed','1500 m/s','time','2 seconds','depth','v×t/2'],hint:'The echo takes 2 seconds to travel to the seabed and back. How do you calculate the one-way distance to the seabed?'},
    {prompt:'Explain how changing the frequency of a musical note changes the way it sounds to a human ear.',keywords:['frequency','pitch','high frequency','low frequency','sound waves','vibrations','hertz'],hint:'What property of the sound wave does frequency directly affect? How does a high-frequency sound compare to a low-frequency sound in terms of how we hear it?'},
    {prompt:'A student fires a starting pistol and hears the echo from a tall building after 1.5 seconds. If the speed of sound is 340 m/s, how far is the student from the building?',keywords:['echo','speed','340 m/s','time','1.5 s','distance','v×t/2','calculation'],hint:'Use the echo distance formula: Distance = (Speed × Time) / 2.'},
    {prompt:'Compare the speed of sound in air, water, and steel, and explain the differences.',keywords:['air','340 m/s','water','1500 m/s','steel','5000 m/s','solid','liquid','gas','particles'],hint:'In which state of matter does sound travel fastest? Why does the speed differ between gases, liquids, and solids?'},
    {prompt:'Explain why the loudness of a sound decreases as you move further away from the source.',keywords:['loudness','amplitude','decrease','distance','energy','spread out','area'],hint:'What happens to the energy of a sound wave as it spreads out over a larger area? How does this affect the amplitude?'},
    {prompt:'Describe how an ultrasound scan is used to create an image of a developing foetus.',keywords:['ultrasound','transducer','reflection','echo','foetus','image','non-ionising','safe'],hint:'What waves are sent into the body? What happens when they hit different tissues? How is the image formed?'},
    {prompt:'A sound wave has a frequency of 440 Hz and a wavelength of 0.77 m. Calculate the speed of the sound.',keywords:['frequency','440 Hz','wavelength','0.77 m','speed','v=f×λ','338.8 m/s','calculation'],hint:'Use the wave equation: speed = frequency × wavelength.'},
    {prompt:'Explain the sequence of events that occurs in the human ear when a sound wave enters the outer ear.',keywords:['outer ear','eardrum','ossicles','amplify','cochlea','nerve impulse','auditory nerve','brain'],hint:'Trace the path of sound from the air outside all the way to the electrical signal sent to the brain.'},
    {prompt:'Why does sound travel faster at higher temperatures?',keywords:['temperature','speed','particles','kinetic energy','collide','vibrate','faster'],hint:'What happens to the kinetic energy of air particles at higher temperatures? How does this affect the speed of sound?'},
    {prompt:'A tuning fork produces a sound with a frequency of 256 Hz. If the speed of sound is 340 m/s, what is its wavelength?',keywords:['frequency','256 Hz','speed','340 m/s','wavelength','λ=v/f','1.33 m','calculation'],hint:'Use the wave equation rearranged: wavelength = speed / frequency.'},
    {prompt:'Explain why a siren sounds higher pitched as an ambulance approaches you and lower pitched as it moves away.',keywords:['Doppler effect','frequency','pitch','ambulance','approach','move away','compression','stretch'],hint:'How does the movement of the ambulance affect the sound waves in front of it and behind it?'},
    {prompt:'Name the three small bones in the middle ear and explain their function.',keywords:['malleus','hammer','incus','anvil','stapes','stirrup','ossicles','amplify','vibrations','middle ear'],hint:'What are the three ossicles called? What is their role in hearing?'},
    {prompt:'Describe the difference between ultrasound and infrasound.',keywords:['ultrasound','high frequency','above 20,000 Hz','infrasound','low frequency','below 20 Hz','human hearing','animals'],hint:'What is the frequency range of each? Can humans hear either of them?'},
    {prompt:'Why is it important for a doctor to use a non-ionising technique like ultrasound to scan a foetus?',keywords:['ultrasound','non-ionising','safe','foetus','X-rays','ionising','DNA damage','risk'],hint:'What is the difference between ionising and non-ionising radiation in terms of their effects on living tissue?'},
    {prompt:'A ship uses SONAR to detect a submarine. The pulse returns after 0.3 seconds. If the speed of sound in water is 1500 m/s, how far away is the submarine?',keywords:['SONAR','echo','time','0.3 s','speed','1500 m/s','distance','v×t/2'],hint:'The pulse travels to the submarine and back. Use the echo formula to find the one-way distance.'},
    {prompt:'Explain how the ear drum and the ossicles work together to transmit sound.',keywords:['eardrum','tympanum','vibrate','ossicles','malleus','incus','stapes','amplify','middle ear'],hint:'What does the eardrum do when sound hits it? What do the ossicles do to the vibrations?'},
    {prompt:'What property of a sound wave determines its pitch?',keywords:['pitch','frequency','high pitch','low pitch','Hertz','Hz','sound wave','vibrations'],hint:'Does a high-pitched sound have a high or low frequency? How is this related to the number of vibrations per second?'},
    {prompt:'Explain the term "wavelength" in the context of a longitudinal sound wave.',keywords:['wavelength','compression','rarefaction','longitudinal','distance','consecutive','sound','medium'],hint:'What is the distance measured between in a longitudinal wave? What two points are used to define it?'},
    {prompt:'A student stands 170 m from a wall and claps her hands. She hears the echo 1 second later. What is the speed of sound in air based on her experiment?',keywords:['distance','170 m','time','1 s','echo','speed','v=2d/t','340 m/s','calculation'],hint:'For an echo, the total distance travelled is twice the distance to the wall. Use Speed = Total Distance / Time.'},
  ],
});
</script></body></html>
