<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SI Units Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'SI Units & Measurement — JCE Physics Quiz',
  color:'#0d47a1',dark:'#002171',light:'#e3f2fd',
    mcq:[
    {q:'The SI unit of mass is:',opts:['Gram (g)','Kilogram (kg)','Newton (N)','Pound (lb)'],ans:1,exp:'The SI unit of mass is the KILOGRAM (kg). The gram is a smaller unit (1 kg = 1000 g). The Newton is force/weight, not mass.'},
    {q:'1 kilometre = ?',opts:['10 m','100 m','1000 m','10 000 m'],ans:2,exp:'"Kilo" = 1000. So 1 km = 1000 m. Similarly, 1 kilogram = 1000 grams.'},
    {q:'Which instrument measures volume of a liquid most accurately?',opts:['Beaker','Conical flask','Measuring cylinder','Test tube'],ans:2,exp:'A MEASURING CYLINDER has markings that allow accurate reading of liquid volume. Always read from the BOTTOM of the meniscus (curved water surface) at eye level.'},
    {q:'A systematic error is:',opts:['Random measurement errors','An error that always shifts readings in the same direction','An error due to reaction time','An error in writing down results'],ans:1,exp:'SYSTEMATIC ERROR: always shifts measurements in the same direction by the same amount (e.g. a balance that always reads 0.5g too high). It affects ACCURACY. Reduce by calibrating instruments.'},
    {q:'Precision refers to:',opts:['How close a measurement is to the true value','How repeatable/consistent measurements are','How large the measurement is','The number of decimal places used'],ans:1,exp:'PRECISION = how repeatable measurements are (close to each other). ACCURACY = how close measurements are to the TRUE value. You can be precise but inaccurate (consistently wrong by the same amount).'},
    {q:'The SI unit of time is:',opts:['Hour (h)','Minute (min)','Second (s)','Day (d)'],ans:2,exp:'The SI unit of time is the SECOND (s). Hours, minutes, and days are derived units. 1 minute = 60 s; 1 hour = 3600 s.'},
    {q:'1 centimetre is equal to:',opts:['0.01 m','0.1 m','10 m','100 m'],ans:0,exp:'"Centi" = 1/100. So 1 cm = 0.01 m (1/100 of a metre). This is useful for measuring small lengths.'},
    {q:'Which of the following is NOT a base SI unit?',opts:['Metre (m)','Kilogram (kg)','Newton (N)','Second (s)'],ans:2,exp:'The NEWTON (N) is a DERIVED unit (kg·m/s²). The base SI units for mechanics are metre (m), kilogram (kg), and second (s). Ampere (A) is also base for electric current.'},
    {q:'The meniscus in a measuring cylinder should be read at:',opts:['The top of the curve','The bottom of the curve','The middle of the curve','Any point on the curve'],ans:1,exp:'For water and most liquids, read the BOTTOM of the meniscus (the lowest point of the curved surface). This ensures consistency and accuracy. Read at EYE LEVEL to avoid parallax error.'},
    {q:'0.0056 km converted to metres is:',opts:['0.56 m','5.6 m','56 m','560 m'],ans:1,exp:'1 km = 1000 m. To convert km to m, multiply by 1000. 0.0056 × 1000 = 5.6 m. Alternatively, move the decimal point 3 places to the right.'},
    {q:'A random error can be reduced by:',opts:['Calibrating the instrument','Taking the average of repeated measurements','Using a different unit','Ignoring outliers'],ans:1,exp:'RANDOM errors are due to unpredictable variations (e.g., reading slightly differently each time). Taking MANY measurements and finding the MEAN (average) reduces the impact of random errors.'},
    {q:'The prefix "milli" means:',opts:['1000','100','0.1','0.001'],ans:3,exp:'"Milli" = 1/1000 = 0.001. Examples: 1 millimetre (mm) = 0.001 m; 1 milligram (mg) = 0.001 g; 1 millilitre (mL) = 0.001 L.'},
    {q:'Scientific notation for 0.00045 is:',opts:['4.5 × 10⁻⁴','4.5 × 10⁴','45 × 10⁻⁵','0.45 × 10⁻³'],ans:0,exp:'Move the decimal point 4 places to the right to get 4.5. Since you moved right, the exponent is negative: 4.5 × 10⁻⁴. This is standard scientific notation.'},
    {q:'The volume of a regular solid (e.g., a cube) is calculated using:',opts:['Length × Width','Length × Width × Height','Mass × Density','Force ÷ Area'],ans:1,exp:'Volume of a rectangular solid = Length × Width × Height. Units are m³ or cm³. 1 m³ = 1,000,000 cm³. For irregular solids, use displacement (Eureka can).'},
    {q:'A measurement that is close to the true value is considered:',opts:['Precise','Accurate','Both precise and accurate','Neither'],ans:1,exp:'ACCURACY is how close a measurement is to the TRUE (accepted) value. PRECISION is how repeatable measurements are. A measurement can be precise (consistent) but inaccurate (wrong).'},
    {q:'Which of the following is a reason for using SI units globally?',opts:['They are easier to calculate','They allow scientists around the world to communicate and compare results easily','They are based on the human body','They are the only units allowed by law'],ans:1,exp:'SI units provide a UNIVERSAL STANDARD. This ensures that scientists, engineers, and researchers worldwide can share and understand measurements without confusion caused by different local systems.'},
    {q:'The prefix "centi" represents:',opts:['10','100','0.1','0.01'],ans:3,exp:'"Centi" = 1/100 = 0.01. Examples: 1 centimetre (cm) = 0.01 m; 1 centilitre (cL) = 0.01 L.'},
    {q:'When measuring the volume of a liquid using a measuring cylinder, you should:',opts:['Look from above','Look from the side','Read at eye level','Tilt the cylinder'],ans:2,exp:'Reading at EYE LEVEL eliminates PARALLAX ERROR (the apparent shift in reading due to the angle of viewing). This ensures accurate measurements.'},
    {q:'Which of these is an example of a systematic error?',opts:['A balance reading 0.2g too high every time','A student misreading the scale once','Temperature fluctuations affecting the experiment','Slight variations in measuring a length by hand'],ans:0,exp:'A systematic error affects ALL readings in a consistent direction. A balance that is not zeroed (tared) will consistently overestimate or underestimate mass. This can be fixed by calibration.'},
    {q:'To reduce parallax error when reading a scale:',opts:['Use a magnifying glass','Ensure your eye is directly aligned with the measurement point','Close one eye','Use a digital scale instead'],ans:1,exp:'Parallax error occurs when you read a scale from an angle. To avoid this, position your eye directly level with the marking you are reading. This ensures the line you read aligns perfectly with the measurement.'},
  ],
  match:[
    {term:'Metre (m)',def:'The SI base unit for length (distance)'},
    {term:'Kilogram (kg)',def:'The SI base unit for mass'},
    {term:'Second (s)',def:'The SI base unit for time'},
    {term:'Kelvin (K)',def:'The SI base unit for thermodynamic temperature'},
    {term:'Ampere (A)',def:'The SI base unit for electric current'},
    {term:'Accuracy',def:'How close a measured value is to the true or accepted value'},
    {term:'Precision',def:'How repeatable or consistent a set of measurements is (how close readings are to each other)'},
    {term:'Meniscus',def:'The curved upper surface of a liquid in a tube, caused by surface tension'},
    {term:'Parallax error',def:'An error caused by reading a scale from an angle rather than directly from the front'},
    {term:'Systematic error',def:'An error that consistently shifts measurements in one direction (e.g., faulty calibration)'},
    {term:'Random error',def:'An unpredictable error caused by human or environmental variations; reduced by averaging'},
    {term:'Scientific notation',def:'A way of writing very large or small numbers as a × 10ⁿ (where 1 ≤ a < 10)'},
    {term:'Volume',def:'The amount of space an object or substance occupies; measured in m³ or cm³'},
    {term:'Mass',def:'The amount of matter in an object; a scalar quantity measured in kg'},
    {term:'Weight',def:'The gravitational force acting on a mass; measured in Newtons (N)'},
    {term:'Density',def:'Mass per unit volume (ρ = m/V); measured in kg/m³ or g/cm³'},
    {term:'Calibration',def:'The process of adjusting an instrument to ensure accurate readings (e.g., zeroing a balance)'},
    {term:'Mean (average)',def:'The sum of a set of values divided by the number of values; used to reduce random errors'},
    {term:'Mega (M)',def:'A prefix meaning one million (1,000,000); e.g., 1 Megawatt (MW) = 1,000,000 W'},
    {term:'Micro (μ)',def:'A prefix meaning one millionth (0.000001); e.g., 1 micrometre (μm) = 10⁻⁶ m'},
  ],
  flashcards:[
    {q:'State the 5 main SI base units you need to know for physics.',a:'Length: metre (m)\nMass: kilogram (kg)\nTime: second (s)\nTemperature: kelvin (K) \nElectric current: ampere (A).\n\n(Note: In many JCE/BGCSE syllabi, °C is also used for temperature, but the SI unit is Kelvin.)'},
    {q:'Convert the following: 3.5 km to metres; 250 cm to metres; 4500 mm to metres.',a:'3.5 km = 3500 m (multiply by 1000).\n250 cm = 2.5 m (divide by 100).\n4500 mm = 4.5 m (divide by 1000).'},
    {q:'What is scientific notation? Give an example of a large and a small number.',a:'Scientific notation expresses numbers in the form a × 10ⁿ, where 1 ≤ a < 10. Examples: 3,000,000 (3 × 10⁶) and 0.000045 (4.5 × 10⁻⁵). It simplifies working with very large or very small values.'},
    {q:'How do you reduce random errors in an experiment?',a:'1. Repeat the measurement several times and calculate the MEAN (average). 2. Take more readings to increase reliability. 3. Use more precise instruments. 4. Control environmental conditions. 5. Have multiple observers take the reading.'},
    {q:'What is the Rf value in chromatography?',a:'Rf (Retention factor) = distance moved by the spot / distance moved by the solvent front. It is always between 0 and 1. Each pure substance has a characteristic Rf value under fixed conditions, used to identify unknown components in a mixture.'},
    {q:'Explain the difference between accuracy and precision.',a:'ACCURACY: how close a measurement is to the TRUE (accepted) value. PRECISION: how close multiple measurements are to EACH OTHER (repeatability). A set of readings can be precise (consistent) but inaccurate (all wrong by the same amount).'},
    {q:'What is parallax error and how is it prevented?',a:'Parallax error occurs when you read a scale from an angle, making the reading appear shifted compared to when viewed straight-on. It is prevented by reading the scale at EYE LEVEL, ensuring your line of sight is perpendicular to the scale.'},
    {q:'State the SI unit and symbol for the following quantities: length, mass, time, and temperature.',a:'Length: metre (m). Mass: kilogram (kg). Time: second (s). Temperature: kelvin (K) (or Celsius, °C, in many JCE contexts).'},
    {q:'Describe how you would measure the volume of an irregularly shaped stone.',a:'Use the DISPLACEMENT method (Eureka can). Fill a displacement can with water until it overflows. Submerge the stone. Collect the displaced water in a measuring cylinder. The volume of displaced water equals the volume of the stone.'},
    {q:'Convert 0.000 008 m to scientific notation and state the prefix.',a:'0.000 008 m = 8.0 × 10⁻⁶ m. This corresponds to the prefix MICRO (μ). So, 8.0 μm (micrometres). 1 micrometre = 10⁻⁶ m.'},
    {q:'Why do scientists use SI units instead of local or traditional measurements?',a:'SI units provide a UNIVERSAL, STANDARDISED system. This allows scientists from different countries to share, compare, and verify results easily. It reduces confusion and errors caused by varying local units, ensuring global collaboration.'},
    {q:'Define mass and weight, and state their SI units.',a:'MASS is the amount of matter in an object (kg). It is a scalar and constant. WEIGHT is the gravitational force acting on an object (N). Weight depends on the gravitational field strength (W = mg). On Earth, g ≈ 9.8 N/kg (often taken as 10 N/kg).'},
    {q:'What is the density equation and its units?',a:'Density (ρ) = Mass (m) / Volume (V). Units: kg/m³ or g/cm³. 1 g/cm³ = 1000 kg/m³. Density is a characteristic property of a material.'},
    {q:'Explain the difference between systematic and random errors.',a:'SYSTEMATIC errors cause readings to be consistently too high or too low (e.g., a miscalibrated scale). They affect ACCURACY. RANDOM errors cause unpredictable variations in readings (e.g., human reaction time). They affect PRECISION.'},
    {q:'How do you convert from km/h to m/s?',a:'To convert km/h to m/s, divide by 3.6. (Since 1 km = 1000 m and 1 hour = 3600 s; 1000/3600 = 1/3.6). Example: 72 km/h ÷ 3.6 = 20 m/s.'},
    {q:'What is the meniscus and why is it important to read it correctly?',a:'The meniscus is the curved upper surface of a liquid in a container, caused by surface tension. For water, it curves downwards. To measure volume accurately, you must read the BOTTOM of the meniscus at eye level.'},
    {q:'Explain the concept of calibration.',a:'CALIBRATION is the process of comparing an instrument\'s readings against a known standard and adjusting it to eliminate systematic error. For example, zeroing a top-pan balance before use ensures accurate mass readings.'},
    {q:'What are derived units? Give an example.',a:'Derived units are formed by combining base SI units. Examples: Area (m²), Volume (m³), Speed (m/s), Force (kg·m/s² = Newton, N), and Energy (kg·m²/s² = Joule, J).'},
    {q:'State the prefix and value for kilo, centi, milli, and micro.',a:'Kilo (k) = 1000. Centi (c) = 1/100 = 0.01. Milli (m) = 1/1000 = 0.001. Micro (μ) = 1/1,000,000 = 0.000001.'},
    {q:'How do you determine the volume of a liquid accurately using a measuring cylinder?',a:'Pour the liquid into the cylinder. Place the cylinder on a flat, level surface. Read the volume by looking at the BOTTOM of the meniscus at EYE LEVEL to avoid parallax error. Record the value using the smallest division increments.'},
  ],
  blanks:{
    passage:'The SI unit of length is the [_] and the unit of mass is the [_]. The prefix kilo means [_] (e.g., 1 km = 1000 m). When reading a measuring cylinder, always read the [_] of the meniscus at eye level. An error that consistently shifts readings in one direction is called a [_] error, while repeating measurements and taking the [_] helps reduce random errors.',
    answers:['metre','kilogram','1000','bottom','Systematic','mean'],
    wordbank:['metre','kilogram','1000','bottom','Systematic','mean','accuracy','precision','top'],
  },
  sentences:[
    {prompt:'Explain the difference between accuracy and precision using the analogy of a dartboard.',keywords:['bullseye','true value','grouped','consistent','accurate','precise','target'],hint:'Think about where the darts land. What does hitting near the centre (bullseye) mean? What does it mean if the darts are grouped very close together?'},
    {prompt:'Convert 0.000 008 metres to scientific notation and state what metric prefix this value corresponds to.',keywords:['8 × 10⁻⁶','micro','μm','micrometre','scientific notation','prefix'],hint:'Move the decimal point until you have a number between 1 and 10. Count how many places you moved it. What prefix represents 10⁻⁶?'},
    {prompt:'Explain why scientists and engineers around the world use the International System of Units (SI) instead of local or traditional units.',keywords:['universal','standard','communicate','compare','worldwide','collaboration','confusion'],hint:'What problems would arise if scientists in different countries used completely different units to report their data?'},
    {prompt:'Describe how you would measure the volume of an irregularly shaped stone using the displacement method.',keywords:['Eureka can','displacement','water','overflow','measuring cylinder','volume','stone'],hint:'What apparatus do you use to collect the water displaced by the stone? How does the volume of displaced water relate to the volume of the stone?'},
    {prompt:'A student measures the length of a table three times: 1.52 m, 1.54 m, and 1.51 m. The true length is 1.80 m. Comment on the accuracy and precision of these measurements.',keywords:['accurate','precise','mean','repeatable','true value','consistent','wrong'],hint:'Are the readings close to the true value (accurate)? Are the readings close to each other (precise)?'},
    {prompt:'Define the terms mass, weight, and density, and state their SI units.',keywords:['mass','kg','weight','Newton','N','density','kg/m³','g/cm³','scalar','vector'],hint:'Which one is a measure of matter, which is a force, and which is a ratio of mass to volume?'},
    {prompt:'Convert 72 km/h into m/s.',keywords:['72','km/h','m/s','divide','3.6','20 m/s','conversion'],hint:'What is the conversion factor between km/h and m/s? (Remember: 1 km = 1000 m, 1 hour = 3600 s).'},
    {prompt:'Explain the difference between systematic error and random error, giving an example of each.',keywords:['systematic','consistent','calibration','random','unpredictable','average','mean'],hint:'One type affects all readings in the same way; the other causes readings to vary unpredictably.'},
    {prompt:'Why is the meniscus read at eye level when using a measuring cylinder?',keywords:['meniscus','parallax error','eye level','accuracy','curved surface','angle'],hint:'What happens to your reading if you look at the cylinder from above or below instead of straight on?'},
    {prompt:'Calculate the density of a block of metal with a mass of 540 g and a volume of 200 cm³.',keywords:['density','mass','volume','540 g','200 cm³','2.7 g/cm³','calculation'],hint:'Use the formula density = mass / volume. What are the units for density given the units used?'},
    {prompt:'Explain why using SI units is particularly important for international trade and engineering.',keywords:['trade','engineering','standards','specifications','interchangeability','safety','global'],hint:'If a car part manufactured in one country must fit a car assembled in another, why is a standard unit system essential?'},
    {prompt:'Convert 2500 millilitres (mL) into litres (L) and into cubic metres (m³).',keywords:['mL','L','m³','divide','1000','0.001','conversion','volume'],hint:'How many millilitres are in 1 litre? How many litres are in 1 cubic metre?'},
    {prompt:'Describe the difference between the volume of a liquid and the volume of a regular solid.',keywords:['liquid','measuring cylinder','solid','length','width','height','formula','displacement'],hint:'What instrument is used to measure liquid volume? What mathematical formula is used for a rectangular solid?'},
    {prompt:'Give two examples of derived SI units and state the base units they are derived from.',keywords:['derived','Newton','N','kg m/s²','Joule','J','kg m²/s²','Pascal','Pa','N/m²'],hint:'Think about force, energy, and pressure. What combinations of kg, m, and s make up these units?'},
    {prompt:'What is a systematic error, and how can it be identified and corrected?',keywords:['systematic','error','consistent','calibration','zero','offset','instrument'],hint:'What do you do to fix an instrument that always reads too high?'},
    {prompt:'Explain the difference between a vector quantity and a scalar quantity, giving two examples of each.',keywords:['vector','direction','force','velocity','scalar','magnitude','mass','speed'],hint:'One type has only magnitude; the other has both magnitude and direction.'},
    {prompt:'Calculate the mean of the following measurements: 12.4 cm, 12.6 cm, 12.3 cm, 12.5 cm.',keywords:['mean','average','sum','divide','12.45 cm','statistics','repeatability'],hint:'Add all the values together and divide by the number of measurements.'},
    {prompt:'State the SI base unit for temperature and explain why Kelvin is used instead of Celsius in scientific work.',keywords:['Kelvin','K','Celsius','absolute','thermodynamic','scientific','zero'],hint:'What makes 0 K (absolute zero) physically significant compared to 0 °C?'},
    {prompt:'Explain how a parallax error can affect experimental results and describe how to avoid it.',keywords:['parallax','angle','reading','eye level','scale','instrument','accurate'],hint:'What simple action can you take with your eyes to ensure you are reading the scale correctly?'},
    {prompt:'A researcher takes five measurements of the melting point of a substance. The values are 122.1°C, 122.0°C, 122.2°C, 122.1°C, and 122.0°C. The accepted value is 122.0°C. Comment on the accuracy and precision of the researcher\'s work.',keywords:['accurate','precise','repeatable','true value','mean','consistent'],hint:'Are the readings close to the accepted value? Are the readings close to each other?'},
  ],
});
</script></body></html>
