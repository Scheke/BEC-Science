<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SI Units & Measurement — BEC Study</title>
<style>*,*::before,*::after{box-sizing:border-box}</style>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="../study-engine.js"></script>
<script>
function bg(sk,c){sk.background(...(c||[12,14,22]))}

const STEPS=[
  {
    title:'Why SI Units?',
    body:`Scientists across the world need to communicate measurements clearly. <strong>SI units</strong> (Système International d'Unités) provide a universal standard so that everyone means the same thing.
    <br><br>
    Without standard units, confusion arises: "10 units of force" means nothing if different countries define force differently!
    <br><br>
    SI units are based on <strong>7 base units</strong> from which all other units are derived. In BGCSE science you mainly use:
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li>Length → <strong>metre (m)</strong></li>
      <li>Mass → <strong>kilogram (kg)</strong></li>
      <li>Time → <strong>second (s)</strong></li>
      <li>Temperature → <strong>kelvin (K)</strong> or °C</li>
      <li>Electric current → <strong>ampere (A)</strong></li>
    </ul>`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      const units=[
        {n:'metre',sym:'m',q:'Length',c:[231,76,60],x:0.15,y:0.35},
        {n:'kilogram',sym:'kg',q:'Mass',c:[52,152,219],x:0.4,y:0.35},
        {n:'second',sym:'s',q:'Time',c:[46,204,113],x:0.65,y:0.35},
        {n:'kelvin',sym:'K',q:'Temp',c:[241,196,15],x:0.87,y:0.35},
        {n:'ampere',sym:'A',q:'Current',c:[155,89,182],x:0.27,y:0.72},
        {n:'mole',sym:'mol',q:'Amount',c:[52,73,94],x:0.52,y:0.72},
        {n:'candela',sym:'cd',q:'Light',c:[230,126,34],x:0.77,y:0.72},
      ];
      units.forEach((u,i)=>{
        const cx=u.x*W,cy=u.y*H;
        const pulse=1+Math.sin(t*1.3+i*0.8)*0.08;
        sk.fill(...u.c,40);sk.noStroke();sk.circle(cx,cy,70*pulse);
        sk.fill(...u.c,200);sk.circle(cx,cy,44*pulse);
        sk.fill(255);sk.textSize(13);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER,sk.CENTER);sk.text(u.sym,cx,cy);
        sk.textSize(8);sk.textStyle(sk.NORMAL);sk.textAlign(sk.CENTER);sk.text(u.q,cx,cy+32);
        sk.textSize(7.5);sk.fill(200,200,200);sk.text(u.n,cx,cy+42);
      });
      sk.fill(255);sk.textSize(12);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      sk.text('7 SI Base Units',W/2,H*0.1);
    }
  },
  {
    title:'SI Prefixes & Unit Conversions',
    body:`Prefixes multiply the base unit by a power of 10:
    <table style="width:100%;border-collapse:collapse;font-size:.78rem;margin-top:8px">
      <thead><tr style="background:#0d47a1;color:#fff"><th style="padding:5px 8px;border:1px solid #333">Prefix</th><th style="padding:5px 8px;border:1px solid #333">Symbol</th><th style="padding:5px 8px;border:1px solid #333">Multiplier</th><th style="padding:5px 8px;border:1px solid #333">Example</th></tr></thead>
      <tbody>
        <tr><td style="padding:4px 8px;border:1px solid #ddd">kilo</td><td style="padding:4px 8px;border:1px solid #ddd;font-weight:700">k</td><td style="padding:4px 8px;border:1px solid #ddd">× 1000 (10³)</td><td style="padding:4px 8px;border:1px solid #ddd">1 km = 1000 m</td></tr>
        <tr style="background:#fafafa"><td style="padding:4px 8px;border:1px solid #ddd">centi</td><td style="padding:4px 8px;border:1px solid #ddd;font-weight:700">c</td><td style="padding:4px 8px;border:1px solid #ddd">× 0.01 (10⁻²)</td><td style="padding:4px 8px;border:1px solid #ddd">1 cm = 0.01 m</td></tr>
        <tr><td style="padding:4px 8px;border:1px solid #ddd">milli</td><td style="padding:4px 8px;border:1px solid #ddd;font-weight:700">m</td><td style="padding:4px 8px;border:1px solid #ddd">× 0.001 (10⁻³)</td><td style="padding:4px 8px;border:1px solid #ddd">1 mm = 0.001 m</td></tr>
        <tr style="background:#fafafa"><td style="padding:4px 8px;border:1px solid #ddd">micro</td><td style="padding:4px 8px;border:1px solid #ddd;font-weight:700">μ</td><td style="padding:4px 8px;border:1px solid #ddd">× 10⁻⁶</td><td style="padding:4px 8px;border:1px solid #ddd">1 μm = 10⁻⁶ m</td></tr>
        <tr><td style="padding:4px 8px;border:1px solid #ddd">nano</td><td style="padding:4px 8px;border:1px solid #ddd;font-weight:700">n</td><td style="padding:4px 8px;border:1px solid #ddd">× 10⁻⁹</td><td style="padding:4px 8px;border:1px solid #ddd">1 nm = 10⁻⁹ m</td></tr>
      </tbody>
    </table>
    <br><strong>Convert:</strong> 5.6 km → m = 5.6 × 1000 = <strong>5600 m</strong>&nbsp;&nbsp;&nbsp; 230 cm → m = 230 ÷ 100 = <strong>2.3 m</strong>`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Number line from nano to kilo
      sk.stroke(255,255,255,80);sk.strokeWeight(2);sk.noFill();
      sk.line(W*0.05,H*0.5,W*0.95,H*0.5);
      const prefs=[
        {n:'nano\n(n)',exp:-9,c:[155,89,182]},
        {n:'micro\n(μ)',exp:-6,c:[52,152,219]},
        {n:'milli\n(m)',exp:-3,c:[46,204,113]},
        {n:'BASE\nunit',exp:0,c:[241,196,15]},
        {n:'kilo\n(k)',exp:3,c:[231,76,60]},
      ];
      prefs.forEach((p,i)=>{
        const cx=W*(0.12+i*0.19),cy=H*0.5;
        const pulse=1+Math.sin(t*1.2+i*0.7)*0.09;
        sk.fill(...p.c,180);sk.noStroke();sk.circle(cx,cy,p.exp===0?40*pulse:30*pulse);
        sk.fill(255);sk.textSize(p.exp===0?10:8.5);sk.textStyle(p.exp===0?sk.BOLD:sk.NORMAL);
        sk.textAlign(sk.CENTER,sk.CENTER);sk.text(p.n,cx,cy);
        sk.textSize(8.5);sk.fill(200,200,200);sk.textStyle(sk.NORMAL);
        sk.textAlign(sk.CENTER);sk.text('10'+(['⁻⁹','⁻⁶','⁻³','⁰','³'][i]),cx,H*0.3);
        // Arrow between
        if(i<prefs.length-1){
          sk.stroke(255,255,255,40);sk.strokeWeight(1);
          sk.line(cx+16,H*0.5,W*(0.12+(i+1)*0.19)-16,H*0.5);
          const arrowX=cx+W*0.19*((t*0.25+i*0.2)%1);
          sk.fill(255,220,50,200);sk.noStroke();sk.circle(arrowX,H*0.5,7);
        }
      });
      sk.fill(255);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      sk.text('SI Prefix Scale',W/2,H*0.12);
    }
  },
  {
    title:'Measuring Length, Mass & Time',
    body:`<strong>Length</strong>: Use a ruler or metre rule. Avoid parallax error — read the scale with your eye DIRECTLY in front of the mark.
    <br><br>
    <strong>Mass</strong>: Use a balance (electronic or beam balance). Mass is measured in kg. Weight is a force (N) — different from mass!
    <br><br>
    <strong>Time</strong>: Use a stopwatch or pendulum clock. Measure several oscillations and divide to reduce error.
    <br><br>
    <strong>Volume</strong> (liquid): Use a measuring cylinder. Read from the BOTTOM of the meniscus (curved surface).
    <br><br>
    Always record measurements with the correct <strong>significant figures</strong> and include the unit.`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Ruler
      sk.fill(220,180,100,200);sk.noStroke();sk.rect(W*0.04,H*0.25,W*0.4,24,3);
      for(let i=0;i<=10;i++){
        const x=W*0.04+i*(W*0.04);
        sk.stroke(0,0,0,180);sk.strokeWeight(1);
        sk.line(x,H*0.25,x,H*0.25+(i%5===0?18:10));
        if(i%5===0){sk.fill(0);sk.textSize(7.5);sk.textAlign(sk.CENTER);sk.text(i,x,H*0.25+22);}
      }
      sk.fill(255);sk.textSize(8.5);sk.textAlign(sk.CENTER);sk.text('Ruler (measure length)',W*0.24,H*0.15);
      // Measuring cylinder
      sk.stroke(150,220,255,160);sk.strokeWeight(2);sk.noFill();
      sk.rect(W*0.6,H*0.22,34,H*0.52,3);
      const waterH=H*0.4;
      sk.fill(100,180,255,80);sk.noStroke();
      sk.rect(W*0.6,H*0.22+H*0.52-waterH,34,waterH,0,0,3,3);
      // Meniscus curve
      sk.stroke(100,180,255,200);sk.strokeWeight(2);sk.noFill();
      sk.arc(W*0.617,H*0.22+H*0.52-waterH,34,12,0,sk.PI);
      // Eye level arrow
      const eyeY=H*0.22+H*0.52-waterH+6;
      sk.stroke(255,220,50,200);sk.strokeWeight(1.5);
      sk.line(W*0.54,eyeY,W*0.6,eyeY);
      sk.fill(255,220,50,200);sk.noFill();
      sk.fill(255);sk.textSize(7.5);sk.textAlign(sk.RIGHT);sk.text('Eye level',W*0.54,eyeY+3);
      // Scale marks
      for(let i=0;i<5;i++){
        const y=H*0.22+H*0.52-waterH*0.2*(i+1);
        sk.stroke(255,255,255,80);sk.strokeWeight(1);
        sk.line(W*0.6-6,y,W*0.6,y);
        sk.fill(200);sk.textSize(7);sk.textAlign(sk.RIGHT);sk.text((i+1)*20,W*0.6-8,y+3);
      }
      sk.fill(255);sk.textSize(8.5);sk.textAlign(sk.CENTER);sk.text('Measuring cylinder',W*0.67,H*0.15);
      sk.textSize(7.5);sk.fill(255,220,50);sk.text('Read bottom of meniscus',W*0.67,H*0.82);
    }
  },
  {
    title:'🎮 Check — SI Units & Measurement',
    body:'Test your knowledge of SI units, prefixes, and measuring techniques.',
    draw:null,
    game:{type:'mcq',questions:[
      {q:'What is the SI unit of mass?',opts:['Gram (g)','Newton (N)','Kilogram (kg)','Pound (lb)'],ans:2,exp:'The SI unit of mass is the KILOGRAM (kg). The gram is a smaller unit (1 kg = 1000 g). The newton is a unit of force (weight), not mass.'},
      {q:'1 kilometre (km) equals how many metres?',opts:['10 m','100 m','1000 m','10 000 m'],ans:2,exp:'The prefix "kilo" means 1000, so 1 kilometre = 1000 metres. Similarly, 1 kilogram = 1000 grams.'},
      {q:'When reading the volume in a measuring cylinder, you should read from...',opts:['The top of the meniscus','The middle of the meniscus','The bottom of the meniscus','The side of the cylinder'],ans:2,exp:'Always read from the BOTTOM of the meniscus (the curved water surface) when using a measuring cylinder. The meniscus curves downward for water, so the bottom is the correct reading point.'},
      {q:'Why do scientists use SI units?',opts:['They are easier to spell','They provide a universal standard for communication','They are the oldest units in history','They are only used in physics'],ans:1,exp:'SI units provide a UNIVERSAL STANDARD — scientists worldwide use the same definitions, so measurements can be compared and communicated without confusion across countries and languages.'},
    ]}
  },
  {
    q:'SI Base Units Table',
    content:`<h3>SI Base Units Table</h3><p>The International System of Units (SI) defines 7 base units used worldwide by scientists. Every other measurement unit is derived from these 7.</p><ul><li>The metre (m), kilogram (kg), and second (s) are the most commonly used base units in JCE science</li><li>The kelvin (K) measures temperature — 0 K is absolute zero, the coldest possible temperature</li><li>All measurements in science must include a unit; a number alone is meaningless</li></ul>`,

  <!-- Header row -->

  <rect x="10" y="188" width="400" height="24" fill="#fff" rx="2"/>
  <rect x="10" y="214" width="400" height="24" fill="#c8e6c9" rx="2"/>
  <!-- Row text -->
  <text x="70" y="74" text-anchor="middle" font-size="11" fill="#333">Length</text><text x="182" y="74" text-anchor="middle" font-size="11" fill="#333">metre</text><text x="274" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">m</text><text x="363" y="74" text-anchor="middle" font-size="10" fill="#333">rulers, distances</text>

  <text x="70" y="126" text-anchor="middle" font-size="11" fill="#333">Time</text><text x="182" y="126" text-anchor="middle" font-size="11" fill="#333">second</text><text x="274" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">s</text><text x="363" y="126" text-anchor="middle" font-size="10" fill="#333">stopwatch, clocks</text>
  <text x="70" y="152" text-anchor="middle" font-size="11" fill="#333">Temperature</text><text x="182" y="152" text-anchor="middle" font-size="11" fill="#333">kelvin</text><text x="274" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">K</text><text x="363" y="152" text-anchor="middle" font-size="10" fill="#333">thermometers</text>
  <text x="70" y="178" text-anchor="middle" font-size="11" fill="#333">Elect. current</text><text x="182" y="178" text-anchor="middle" font-size="11" fill="#333">ampere</text><text x="274" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">A</text><text x="363" y="178" text-anchor="middle" font-size="10" fill="#333">ammeters, circuits</text>
  <text x="70" y="204" text-anchor="middle" font-size="11" fill="#333">Amount of substance</text><text x="182" y="204" text-anchor="middle" font-size="11" fill="#333">mole</text><text x="274" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">mol</text><text x="363" y="204" text-anchor="middle" font-size="10" fill="#333">chemistry moles</text>
  <text x="70" y="230" text-anchor="middle" font-size="11" fill="#333">Luminous intensity</text><text x="182" y="230" text-anchor="middle" font-size="11" fill="#333">candela</text><text x="274" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">cd</text><text x="363" y="230" text-anchor="middle" font-size="10" fill="#333">light brightness</text>
  <!-- border lines -->
  <line x1="130" y1="30" x2="130" y2="238" stroke="#2e7d32" stroke-width="1"/>
  <line x1="232" y1="30" x2="232" y2="238" stroke="#2e7d32" stroke-width="1"/>
  <line x1="314" y1="30" x2="314" y2="238" stroke="#2e7d32" stroke-width="1"/>
  <rect x="10" y="30" width="400" height="208" fill="none" stroke="#2e7d32" stroke-width="2" rx="3"/>
</svg>`
  },
  {
    q:'Metric Prefixes Chart',
    content:`<h3>Metric Prefixes Chart</h3><p>Metric prefixes are multipliers added to SI base units to express very large or very small quantities conveniently. They are based on powers of 10, making conversions straightforward.</p><ul><li>kilo (k) = 10³ = 1000 — e.g. 1 km = 1000 m</li><li>centi (c) = 10⁻² = 0.01 — e.g. 1 cm = 0.01 m</li><li>milli (m) = 10⁻³ = 0.001 — e.g. 1 mm = 0.001 m</li></ul>`,
    visual:`<svg viewBox="0 0 420 240" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2e7d32"/></marker></defs>
  <rect width="420" height="240" fill="#e8f5e9" rx="8"/>
  <text x="210" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">Metric Prefixes — Powers of 10</text>

  <line x1="30" y1="90" x2="390" y2="90" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr)"/>

  <circle cx="60" cy="90" r="22" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2"/>
  <text x="60" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">μ</text>
  <text x="60" y="99" text-anchor="middle" font-size="8" fill="#333">micro</text>

  <text x="140" y="122" text-anchor="middle" font-size="10" fill="#333">10⁻³</text>

  },
  {
    q:'Length Measurement Tools',
    content:`<h3>Length Measurement Tools</h3><p>Different tools are used to measure length, volume, and mass with appropriate precision. Choosing the right tool and reading it correctly reduces measurement error.</p><ul><li>A ruler or metre rule measures length to ±0.5 mm — always place the ruler alongside the object, not on top</li><li>A measuring cylinder measures liquid volume in cm³ — read from the bottom of the meniscus at eye level to avoid parallax error</li><li>A beam balance measures mass in grams — more precise than a spring balance, which measures weight (force)</li></ul>`,

  {
    q:'Density Triangle: D = M ÷ V',
    content:`<h3>Density Triangle: D = M ÷ V</h3><p>The density triangle is a memory aid for rearranging the density formula. Cover the quantity you want to find and the triangle shows the formula to use.</p><ul><li>Density (D) = Mass (M) ÷ Volume (V) — the SI unit is kg/m³, but g/cm³ is common in lab work</li><li>Mass (M) = Density (D) × Volume (V) — use this when you know density and volume</li><li>Volume (V) = Mass (M) ÷ Density (D) — use this when you know density and mass; denser objects sink in less dense liquids</li></ul>`,

  {
    title:'Accuracy, Precision & Errors',
    body:`<strong>Accuracy</strong>: How close a measurement is to the TRUE value.
    <br><br>
    <strong>Precision</strong>: How close repeated measurements are to EACH OTHER (consistency, not necessarily correct).
    <br><br>
    You can be precise but not accurate (consistently wrong)!
    <br><br>
    Types of errors:
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li><strong>Systematic error</strong> — always in the same direction (e.g. zero error on a balance). Reduces accuracy.</li>
      <li><strong>Random error</strong> — varies unpredictably (e.g. reaction time). Reduces precision.</li>
    </ul>
    <br>To reduce random error: <strong>repeat measurements</strong> and take the mean.`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;

      targets.forEach((tg,ti)=>{
        const cy=H*0.5;

          sk.fill(ri===0?[30,40,30]:ri===1?[40,50,40]:[60,80,60]);
          sk.stroke(255,255,255,40);sk.strokeWeight(1);
          sk.circle(tg.cx,cy,r*2);
        });
        // Dots
        tg.dots.forEach((d,i)=>{
          const dx=(d[0]||0)+(tg.off?0:0),dy=(d[1]||0)+(tg.off?0:0);
          const pulse=1+Math.sin(t*1.5+ti*2+i)*0.15;
          sk.fill(231,76,60,220);sk.noStroke();sk.circle(tg.cx+d[0],cy+d[1],8*pulse);
        });
        sk.fill(255);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
        sk.text(tg.n,tg.cx,H*0.18);

      sk.fill(255);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      sk.text('Accuracy vs Precision',W/2,H*0.09);

  {
    title:'Derived Units & Scientific Notation',
    body:`<strong>Derived units</strong> are combinations of base SI units:
    <ul style="margin:6px 0 0 18px;line-height:2.2">
      <li><strong>Speed</strong> = distance ÷ time → m/s (ms⁻¹)</li>
      <li><strong>Force</strong> = mass × acceleration → kg·m/s² = <strong>newton (N)</strong></li>
      <li><strong>Energy</strong> = force × distance → N·m = <strong>joule (J)</strong></li>
      <li><strong>Pressure</strong> = force ÷ area → N/m² = <strong>pascal (Pa)</strong></li>
    </ul>
    <br>
    <strong>Scientific notation</strong>: Express very large or small numbers using powers of 10.
    <ul style="margin:4px 0 0 18px;line-height:1.9">
      <li>Speed of light: 300,000,000 m/s = <strong>3.0 × 10⁸ m/s</strong></li>
      <li>Size of a cell: 0.000 01 m = <strong>1 × 10⁻⁵ m</strong></li>
    </ul>`,
    draw:(sk)=>{
