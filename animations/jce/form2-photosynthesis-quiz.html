<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Photosynthesis Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Photosynthesis — JCE Biology Quiz',
  color:'#2e7d32',dark:'#1b5e20',light:'#e8f5e9',
    mcq:[
    {q:'The raw materials for photosynthesis are:',opts:['Glucose and oxygen','Carbon dioxide and water','Light and chlorophyll','Oxygen and glucose'],ans:1,exp:'Photosynthesis uses CARBON DIOXIDE (from air) and WATER (from soil) as RAW MATERIALS. Light energy and chlorophyll are needed but are not consumed as raw materials in the same sense.'},
    {q:'Where in the leaf does most photosynthesis occur?',opts:['Lower epidermis','Spongy mesophyll','Palisade mesophyll','Stomata'],ans:2,exp:'The PALISADE MESOPHYLL (upper layer) has tightly packed cells with MANY CHLOROPLASTS positioned closest to incoming light — making it the main photosynthesis site.'},
    {q:'Iodine solution turns blue-black in the presence of:',opts:['Glucose','Protein','Starch','Fat'],ans:2,exp:'IODINE SOLUTION is the test for STARCH. Blue-black colour = starch PRESENT. (Orange/brown = starch ABSENT). Used to test leaves for products of photosynthesis.'},
    {q:'Which factor can limit the rate of photosynthesis even on a bright, hot day?',opts:['Temperature','Light intensity','CO₂ concentration','Chlorophyll'],ans:2,exp:'CO₂ makes up only ~0.04% of air. Even with plenty of light and warm temperature, LOW CO₂ CONCENTRATION can be the limiting factor preventing faster photosynthesis.'},
    {q:'Stomata are found mainly on which surface of a leaf?',opts:['Upper surface','Lower surface','Midrib only','Palisade cells'],ans:1,exp:'STOMATA are mainly on the LOWER surface of leaves. They allow CO₂ in and O₂ out (gas exchange) and are controlled by GUARD CELLS.'},
    {q:'The green pigment that absorbs light energy for photosynthesis is:',opts:['Chlorophyll','Carotene','Xanthophyll','Starch'],ans:0,exp:'CHLOROPHYLL is the green pigment found in chloroplasts. It absorbs light energy (mostly red and blue-violet wavelengths) to drive the light-dependent reactions of photosynthesis.'},
    {q:'Plants store excess glucose as:',opts:['Cellulose','Starch','Sucrose','Glycogen'],ans:1,exp:'Plants store excess glucose as STARCH (insoluble) in roots, stems, and leaves. Animals store glucose as glycogen. Starch is insoluble so it does not affect the water balance of cells.'},
    {q:'A plant kept in a dark room for 24 hours and then tested for starch will show:',opts:['Blue-black in all leaves','Brown/orange (no starch)','Blue-black in green parts only','Blue-black in the roots'],ans:1,exp:'Without light, photosynthesis cannot occur. The plant will use up its stored starch for respiration. After 24 hours in the dark, the leaf will have NO starch. Iodine stays brown/orange.'},
    {q:'The main product of photosynthesis that plants use for growth is:',opts:['Oxygen','Water','Glucose','Carbon dioxide'],ans:2,exp:'GLUCOSE is the primary sugar product. It is used for RESPIRATION (energy) and CONVERTED into cellulose (cell walls), starch (storage), amino acids (with nitrates), and oils (in seeds).'},
    {q:'During photosynthesis, the gas released is:',opts:['Carbon dioxide','Nitrogen','Oxygen','Water vapour'],ans:2,exp:'OXYGEN is released as a waste product of the light-dependent reactions, where water molecules are split (photolysis) to produce protons, electrons, and oxygen gas (O₂).'},
    {q:'Guard cells control the opening and closing of:',opts:['Chloroplasts','Stomata','Root hairs','Xylem vessels'],ans:1,exp:'GUARD CELLS are specialised pairs of cells that surround the STOMATA (pores). When guard cells take in water, they become turgid and bend, opening the stomata for gas exchange.'},
    {q:'Which factor is NOT required for photosynthesis?',opts:['Carbon dioxide','Water','Light energy','Nitrogen'],ans:3,exp:'Nitrogen is NOT a raw material for photosynthesis. Plants absorb nitrates from the soil to make AMINO ACIDS and PROTEINS, but this is a separate process from photosynthesis.'},
    {q:'In the chemical equation for photosynthesis, the products are:',opts:['CO₂ and H₂O','C₆H₁₂O₆ and O₂','O₂ and H₂O','Glucose and CO₂'],ans:1,exp:'The products of photosynthesis are GLUCOSE (C₆H₁₂O₆) and OXYGEN (O₂). Carbon dioxide and water are the REACTANTS.'},
    {q:'If a variegated leaf (green and white parts) is tested for starch after being in the light, where will starch be present?',opts:['Only in the white parts','Only in the green parts','Throughout the whole leaf','Nowhere'],ans:1,exp:'In a variegated leaf, starch will ONLY be found in the GREEN parts (where chlorophyll is present). The white parts lack chlorophyll and cannot photosynthesize, so they will show a negative starch test.'},
    {q:'The rate of photosynthesis increases as temperature increases up to approximately:',opts:['0°C','25°C - 35°C','60°C','100°C'],ans:1,exp:'Photosynthesis is driven by enzymes. The rate increases with temperature up to an optimum of about 25°C–35°C. Above this, the enzymes DENATURE and the rate drops rapidly.'},
    {q:'Light intensity is a limiting factor. This means:',opts:['Light is the only factor affecting photosynthesis','Increasing light will increase rate, but only until another factor becomes limiting','Light has no effect on photosynthesis','Photosynthesis stops at night'],ans:1,exp:'A LIMITING FACTOR is anything that is in short supply. Increasing light will increase photosynthesis until another factor (e.g., CO₂ or temperature) becomes the limiting one.'},
    {q:'The function of the xylem in photosynthesis is to:',opts:['Transport glucose to the roots','Transport water to the leaves for the process','Carry carbon dioxide into the leaf','Store starch'],ans:1,exp:'XYLEM vessels transport WATER and dissolved minerals from the roots up to the leaves. Water is one of the raw materials for photosynthesis and is also needed to keep the plant turgid.'},
    {q:'Why are leaves broad and flat?',opts:['To reduce water loss','To catch more light and have a large surface area for gas exchange','To store more starch','To prevent predators from eating them'],ans:1,exp:'The broad, flat shape of a leaf MAXIMISES the SURFACE AREA exposed to sunlight for photosynthesis. It also provides a large area for CO₂ to diffuse into the leaf through the stomata.'},
    {q:'When a leaf is boiled in ethanol during the starch test, the purpose is:',opts:['To kill the cells','To remove the chlorophyll so the iodine colour change is visible','To soften the leaf','To add moisture'],ans:1,exp:'Boiling the leaf in ETHANOL removes the green CHLOROPHYLL (decolourises it). If the chlorophyll is left in, the green colour would mask the blue-black colour of the iodine-starch reaction.'},
    {q:'The waste product of photosynthesis for the plant is:',opts:['Glucose','Starch','Oxygen','Carbon dioxide'],ans:2,exp:'OXYGEN is a waste product of photosynthesis for the plant. It is released into the atmosphere through the stomata. However, oxygen is vital for animals and other organisms to respire.'},
  ],
  match:[
    {term:'Chlorophyll',def:'Green pigment found in chloroplasts that absorbs light energy for photosynthesis'},
    {term:'Stomata',def:'Tiny pores on the leaf surface (mostly lower epidermis) for gas exchange, controlled by guard cells'},
    {term:'Palisade mesophyll',def:'Layer of elongated cells in the upper part of a leaf containing many chloroplasts; main site of photosynthesis'},
    {term:'Limiting factor',def:'A factor (e.g., light, CO₂, temperature) in shortest supply that restricts the rate of photosynthesis'},
    {term:'Glucose',def:'The primary sugar product of photosynthesis; used for energy, cellulose, starch, and converted to proteins with nitrates'},
    {term:'Chloroplast',def:'The organelle found in plant cells where photosynthesis takes place, containing chlorophyll'},
    {term:'Guard cells',def:'Specialised cells that control the opening and closing of the stomata by changing turgor pressure'},
    {term:'Xylem',def:'Vascular tissue that transports water and dissolved minerals from the roots to the leaves'},
    {term:'Phloem',def:'Vascular tissue that transports the products of photosynthesis (sucrose/glucose) around the plant'},
    {term:'Starch',def:'The insoluble storage form of glucose in plants; tested for using iodine'},
    {term:'Variegated leaf',def:'A leaf containing both green (chlorophyll) and white (no chlorophyll) regions'},
    {term:'Light intensity',def:'A limiting factor for photosynthesis; affects the rate of the light-dependent reactions'},
    {term:'Carbon dioxide',def:'A gas absorbed from the atmosphere through stomata; a raw material for photosynthesis'},
    {term:'Water',def:'A raw material for photosynthesis; absorbed from the soil by roots and transported via xylem'},
    {term:'Oxygen',def:'A waste product of photosynthesis, released into the atmosphere through stomata'},
    {term:'Cellulose',def:'A structural carbohydrate made from glucose; forms the plant cell wall'},
    {term:'Sucrose',def:'A transport sugar produced from glucose; moved through the phloem to different plant parts'},
    {term:'Photolysis',def:'The splitting of water molecules using light energy during photosynthesis, releasing oxygen'},
    {term:'Transpiration',def:'The loss of water vapour from the leaves through the stomata; creates a pull for water in the xylem'},
    {term:'Iodine solution',def:'A chemical reagent used to test for the presence of starch (turns blue-black)'},
  ],
  flashcards:[
    {q:'Write the word equation for photosynthesis.',a:'Carbon dioxide + Water → Glucose + Oxygen\n(Energy from light and chlorophyll are required for the reaction).'},
    {q:'Write the symbol equation for photosynthesis.',a:'6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂.\n6 molecules of carbon dioxide and 6 molecules of water produce 1 molecule of glucose and 6 molecules of oxygen.'},
    {q:'State 4 uses of the glucose produced during photosynthesis.',a:'1. RESPIRATION: Broken down to release energy (ATP). 2. CELLULOSE: Used to build strong cell walls. 3. STARCH: Stored as an insoluble carbohydrate in roots, stems, and leaves. 4. SUCROSE: Transported in the phloem to other parts of the plant. 5. AMINO ACIDS: Combined with nitrate ions to make proteins.'},
    {q:'Describe the steps of the starch test on a leaf.',a:'1. Boil the leaf in water to kill cells and stop enzyme reactions. 2. Dip the leaf in boiling ETHANOL to remove chlorophyll (decolourise). 3. Wash the leaf with water to soften it. 4. Add IODINE SOLUTION. A blue-black colour means starch is present; orange/brown means starch is absent.'},
    {q:'List 4 structural adaptations of a leaf for efficient photosynthesis.',a:'1. BROAD AND FLAT SHAPE: Maximises surface area for light absorption. 2. THIN: Short diffusion distance for CO₂ to reach cells. 3. CHLOROPLASTS: Found in palisade cells near the top surface. 4. STOMATA: Pores on the lower surface allowing gas exchange. 5. XYLEM/PHLOEM: Transport water away and glucose to the plant.'},
    {q:'Explain what a limiting factor is in photosynthesis.',a:'A LIMITING FACTOR is a condition that slows down the rate of photosynthesis when it is in short supply. The common limiting factors are LIGHT INTENSITY, CARBON DIOXIDE CONCENTRATION, and TEMPERATURE. According to the law of limiting factors, increasing the factor in shortest supply will increase the rate until another factor becomes limiting.'},
    {q:'Describe the role of guard cells in gas exchange.',a:'GUARD CELLS are pairs of specialised cells surrounding stomata. When they absorb water, they become TURGID and bend, causing the stoma to OPEN. This allows CO₂ to enter for photosynthesis. When water is scarce, they lose water, become FLACCID, and the stoma CLOSES to prevent water loss.'},
    {q:'Why is water essential for photosynthesis?',a:'Water is a RAW MATERIAL for photosynthesis. It provides the electrons needed to replace those lost by chlorophyll during light absorption. It is also split (photolysis) to release O₂ gas. Additionally, water is crucial for maintaining turgidity in plant cells.'},
    {q:'Explain how the structure of a palisade mesophyll cell is adapted for photosynthesis.',a:'Palisade cells are ELONGATED and packed with CHLOROPLASTS. They are positioned near the upper surface of the leaf where light intensity is highest. Their cell walls are thin to allow rapid diffusion of CO₂. Many chloroplasts absorb the maximum possible light energy.'},
    {q:'What is the function of the stomata?',a:'STOMATA are microscopic pores on the leaf surface (mostly the lower epidermis). They allow CARBON DIOXIDE to enter the leaf for photosynthesis and allow OXYGEN (a waste product) to escape. They also allow water vapour to diffuse out during transpiration.'},
    {q:'Why do plants store glucose as starch and not as sugar?',a:'Starch is INSOLUBLE in water. If plants stored glucose (soluble), it would dissolve in the cell sap and alter the water potential, causing water to move into cells. This could disrupt osmosis and cell function. Starch is stored as insoluble granules without affecting water balance.'},
    {q:'Describe how you would test a leaf for starch after a 24-hour dark period.',a:'Place the plant in a dark cupboard for 24 hours to destarch it. Then, test the leaf using the starch test: boil in water, decolourise in ethanol, wash, and add iodine. The iodine will stay orange/brown, confirming that no starch is present (photosynthesis did not occur).'},
    {q:'What is the role of the xylem in photosynthesis?',a:'The XYLEM transports WATER and dissolved MINERAL ions from the roots up to the leaves. Water is a raw material for photosynthesis and is also used in transpiration to keep the plant cool.'},
    {q:'What happens to the rate of photosynthesis if CO₂ concentration is increased from 0.04% to 0.1%?',a:'Increasing CO₂ concentration generally INCREASES the rate of photosynthesis, because CO₂ is a raw material. However, this only happens up to a point, after which temperature or light intensity becomes the limiting factor (the rate levels off).'},
    {q:'Explain why a leaf appears green.',a:'A leaf appears green because the CHLOROPHYLL in chloroplasts absorbs RED and BLUE-VIOLET light most efficiently for photosynthesis. It REFLECTS and transmits GREEN light, which is why we see it as green.'},
    {q:'What is the ultimate source of energy for all food chains?',a:'The SUN is the ultimate source of energy. Plants convert this light energy into chemical energy (glucose) during photosynthesis. When animals eat plants, they obtain this stored chemical energy, passing it along the food chain.'},
    {q:'Describe the light-independent stage (Calvin cycle) of photosynthesis.',a:'The Calvin cycle uses the ATP and NADPH produced in the light-dependent stage to convert CARBON DIOXIDE into GLUCOSE. It does not require light directly and occurs in the stroma of the chloroplast. It builds sugar molecules using the carbon from CO₂.'},
    {q:'How do plants use glucose to produce proteins?',a:'Plants combine glucose with NITRATE IONS absorbed from the soil to produce AMINO ACIDS. These amino acids are then joined together to form PROTEINS. This is why plants need nitrogen-rich fertilisers for growth.'},
    {q:'What is the effect of low light intensity on the rate of photosynthesis?',a:'Low light intensity is a LIMITING FACTOR. The rate of photosynthesis will be slow because the light-dependent reactions cannot produce enough ATP and NADPH to drive the Calvin cycle. Increasing light intensity will increase the rate up to an optimum point.'},
    {q:'Explain how the carbon dioxide concentration in the atmosphere affects plant growth.',a:'Increasing atmospheric CO₂ can increase the rate of photosynthesis, leading to more glucose production and more growth. This is why greenhouse growers sometimes enrich the air with CO₂ to increase crop yields.'},
  ],
  blanks:{
    passage:'During the process of photosynthesis, plants use carbon dioxide and [_] to produce glucose and [_]. This reaction takes place in the organelle called the [_], which contains the green pigment [_]. Gas exchange occurs through tiny pores on the leaf called [_], which are controlled by guard cells. An increase in [_] concentration can increase the rate of photosynthesis, but only up to a certain point before another factor becomes limiting.',
    answers:['water','oxygen','chloroplast','chlorophyll','stomata','CO₂'],
    wordbank:['water','oxygen','chloroplast','chlorophyll','stomata','CO₂','nitrogen','light'],
  },
  sentences:[
    {prompt:'Explain why the rate of photosynthesis does not keep increasing indefinitely as light intensity increases. What other factors might become limiting?',keywords:['limiting factor','CO₂','temperature','plateau','maximum rate','light saturation','photosynthesis'],hint:'What else do plants need to photosynthesize besides light? What happens if light is abundant but the temperature is too hot or too cold?'},
    {prompt:'Explain how the structure of a leaf is adapted to carry out photosynthesis efficiently.',keywords:['surface area','light','diffusion','CO₂','thin','stomata','palisade','chloroplast','xylem'],hint:'Think about maximising light absorption, minimising the distance for gases to diffuse, and having a transport system.'},
    {prompt:'Describe the steps involved in testing a leaf for starch, and state what a positive and a negative result would look like.',keywords:['iodine','blue-black','ethanol','boil','decolourise','starch','leaf','photosynthesis'],hint:'Why do you need to boil the leaf in water and ethanol before adding iodine? What colour changes do you look for?'},
    {prompt:'A plant is kept in a dark cupboard for 48 hours. A leaf is then tested for starch using iodine. Predict and explain the result.',keywords:['dark','starch','photosynthesis','respiration','iodine','orange','no starch','destarched'],hint:'Can photosynthesis occur without light? What will the plant do with its existing starch reserves over 48 hours?'},
    {prompt:'Explain the role of stomata in the process of photosynthesis.',keywords:['stomata','guard cells','CO₂','oxygen','gas exchange','pores','photosynthesis'],hint:'What gas needs to enter the leaf for photosynthesis? What waste gas is released?'},
    {prompt:'Describe how the glucose produced during photosynthesis is used by the plant.',keywords:['glucose','respiration','energy','cellulose','cell wall','starch','storage','sucrose','transport'],hint:'List at least four different ways a plant uses the glucose it makes.'},
    {prompt:'Explain the relationship between light intensity and the rate of photosynthesis.',keywords:['light intensity','rate','limiting factor','increase','plateau','maximum','saturation point'],hint:'What happens to the rate when you turn the light on? What happens when you keep increasing the brightness beyond a certain point?'},
    {prompt:'A variegated leaf has green and white parts. When tested for starch after photosynthesis, only the green parts turn blue-black. Explain why.',keywords:['variegated','chlorophyll','green','photosynthesis','starch','iodine','white','no chlorophyll'],hint:'What is missing in the white parts of the leaf? Is photosynthesis possible without chlorophyll?'},
    {prompt:'Why do plants need water for photosynthesis?',keywords:['water','raw material','photosynthesis','glucose','oxygen','photolysis','xylem'],hint:'What role does water play in the chemical equation? What happens to water molecules during the light-dependent stage?'},
    {prompt:'Explain how the temperature can act as a limiting factor for photosynthesis.',keywords:['temperature','enzyme','optimum','rate','denature','limiting factor','photosynthesis'],hint:'What happens to enzymes at very high temperatures? What happens at very low temperatures?'},
    {prompt:'Compare the roles of the xylem and the phloem in the transport of materials used in photosynthesis.',keywords:['xylem','water','minerals','roots','leaves','phloem','glucose','sucrose','transport','photosynthesis'],hint:'Which tissue brings water to the leaf? Which tissue takes the sugar products away to the rest of the plant?'},
    {prompt:'What is a limiting factor in photosynthesis? Give three examples.',keywords:['limiting factor','short supply','light intensity','carbon dioxide','temperature','photosynthesis'],hint:'What three environmental conditions most commonly limit the rate of photosynthesis in a plant?'},
    {prompt:'Describe an experiment you could do to show that light is essential for photosynthesis.',keywords:['destarch','light','leaf','starch test','iodine','control','chlorophyll'],hint:'How would you set up a plant so that only part of a leaf receives light? How would you test for the product of photosynthesis?'},
    {prompt:'Explain why plants that grow in the shade often have thinner leaves with fewer palisade layers.',keywords:['shade','light','palisade','chlorophyll','leaf','adaptation','photosynthesis'],hint:'How do shade-adapted plants maximise their use of the limited light available to them?'},
    {prompt:'Give the word and chemical equations for photosynthesis.',keywords:['word equation','carbon dioxide','water','glucose','oxygen','symbol equation','6CO₂','6H₂O','C₆H₁₂O₆'],hint:'Write the equation showing the reactants on the left and the products on the right.'},
    {prompt:'Explain why the rate of photosynthesis is higher on a sunny day than on a cloudy day.',keywords:['sunny','light intensity','photosynthesis','chlorophyll','cloudy','rate','limiting factor'],hint:'What does a cloudy day provide less of that is essential for photosynthesis?'},
    {prompt:'How do farmers in greenhouses increase the rate of photosynthesis in their crops?',keywords:['greenhouse','CO₂ enrichment','light','temperature','crop yield','photosynthesis','fertilisers'],hint:'What factors can farmers artificially increase or control to speed up plant growth?'},
    {prompt:'Describe the role of guard cells in regulating gas exchange and water loss.',keywords:['guard cells','stomata','turgid','flaccid','open','close','gas exchange','water loss','transpiration'],hint:'What happens to the guard cells when they take in water? What happens when they lose water? How does this affect the stoma?'},
    {prompt:'Explain what happens to a plant if it is kept in a sealed container with no CO₂ but plenty of light and water.',keywords:['CO₂','photosynthesis','no glucose','starch','respiration','death','limiting factor'],hint:'Can photosynthesis occur without carbon dioxide? How long would a plant survive in these conditions?'},
    {prompt:'Plants excrete oxygen as a by-product of photosynthesis. Why is this oxygen essential for life on Earth?',keywords:['oxygen','waste','photosynthesis','respiration','animals','glucose','atmosphere','life'],hint:'What do animals and other organisms use oxygen for? Would they survive without the oxygen produced by plants?'},
  ],
});
</script></body></html>
