<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Circulatory System Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Circulatory System — JCE Biology Quiz',
  color:'#b71c1c',dark:'#7f0000',light:'#ffebee',
   mcq:[
    {q:'The left ventricle pumps blood to:',opts:['The lungs','The right atrium','The whole body via the aorta','The liver only'],ans:2,exp:'The LEFT VENTRICLE pumps oxygenated blood to the ENTIRE BODY through the AORTA (the body\'s main artery). It has the thickest wall because it must create the highest pressure.'},
    {q:'Which blood vessels carry blood TOWARD the heart?',opts:['Arteries','Capillaries','Veins','Arterioles'],ans:2,exp:'VEINS carry blood TOWARD the heart. They have thin walls, a wide lumen, and VALVES to prevent backflow. Arteries carry blood AWAY from the heart.'},
    {q:'What protein in red blood cells carries oxygen?',opts:['Fibrinogen','Plasma','Haemoglobin','Insulin'],ans:2,exp:'HAEMOGLOBIN in red blood cells combines with O₂ in the lungs to form oxyhaemoglobin, then releases O₂ in respiring tissues.'},
    {q:'White blood cells defend the body by:',opts:['Carrying oxygen','Clotting blood','Phagocytosis and producing antibodies','Transporting glucose'],ans:2,exp:'White blood cells (leucocytes) defend against disease by: PHAGOCYTOSIS (engulfing pathogens) and producing ANTIBODIES (immune response).'},
    {q:'The advantage of double circulation is:',opts:['Uses less blood','Requires only one side of the heart','Blood is repressurised before going to the body','Blood goes directly to all organs at once'],ans:2,exp:'DOUBLE CIRCULATION: blood passes through the heart TWICE per circuit. After the low-pressure pulmonary circuit (lungs), the heart REPRESSURISES blood before the high-pressure systemic circuit (body) — ensuring efficient delivery to all organs.'},
    {q:'The aorta is a large artery that carries:',opts:['Deoxygenated blood to the lungs','Deoxygenated blood to the heart','Oxygenated blood from the heart to the body','Oxygenated blood from the lungs to the heart'],ans:2,exp:'The AORTA is the largest artery in the body. It carries OXYGENATED blood from the LEFT VENTRICLE to all parts of the body (systemic circulation).'},
    {q:'Which type of blood vessel has valves to prevent backflow?',opts:['Arteries','Capillaries','Veins','Arterioles'],ans:2,exp:'VEINS contain VALVES to prevent blood from flowing backwards due to the very low pressure in the veins. The valves ensure one-way flow back to the heart, especially against gravity from the legs.'},
    {q:'Where does gas exchange occur between blood and body tissues?',opts:['Arteries','Veins','Capillaries','The heart'],ans:2,exp:'GAS EXCHANGE occurs at the CAPILLARIES. Their walls are ONE CELL THICK, providing a short diffusion distance for O₂ to move into tissues and CO₂ to move into the blood.'},
    {q:'Which chamber of the heart receives deoxygenated blood from the body?',opts:['Right ventricle','Left atrium','Right atrium','Left ventricle'],ans:2,exp:'The RIGHT ATRIUM receives DEOXYGENATED blood from the body through the VENA CAVA. It then passes this blood to the right ventricle, which pumps it to the lungs.'},
    {q:'The function of platelets is:',opts:['Carry oxygen','Fight infections','Clot blood to prevent bleeding','Transport hormones'],ans:2,exp:'PLATELETS are tiny cell fragments that are essential for BLOOD CLOTTING. They gather at wounds and release chemicals that trigger a cascade of reactions to form a fibrin mesh, sealing the cut.'},
    {q:'Plasma is responsible for:',opts:['Clotting blood','Transporting dissolved substances like glucose, urea, and hormones','Carrying oxygen','Producing antibodies'],ans:1,exp:'PLASMA is the liquid component of blood. It transports dissolved substances including GLUCOSE, AMINO ACIDS, UREA, HORMONES, and CARBON DIOXIDE around the body.'},
    {q:'When blood flows through the lungs, it:',opts:['Gains oxygen and releases carbon dioxide','Gains carbon dioxide and releases oxygen','Gains glucose','Loses water'],ans:0,exp:'In the lungs, deoxygenated blood GAINS OXYGEN from the alveoli and RELEASES CARBON DIOXIDE into the alveoli to be exhaled. The blood becomes oxygenated.'},
    {q:'The main function of the right ventricle is to:',opts:['Pump blood to the body','Pump blood to the lungs','Receive blood from the lungs','Receive blood from the body'],ans:1,exp:'The RIGHT VENTRICLE pumps DEOXYGENATED blood to the LUNGS through the pulmonary artery. This is the pulmonary circulation.'},
    {q:'What is the approximate blood pressure in the aorta compared to the vena cava?',opts:['Higher in the aorta','Higher in the vena cava','Equal in both','There is no blood pressure'],ans:0,exp:'Blood pressure is HIGHEST in the AORTA (arteries leaving the heart) and falls progressively as blood flows through the capillaries. It is LOWEST in the VENA CAVA (veins returning to the heart).'},
    {q:'Which of the following is a lifestyle factor that contributes to coronary heart disease?',opts:['Eating a balanced diet','Regular exercise','Smoking cigarettes','Having a low cholesterol level'],ans:2,exp:'SMOKING is a major risk factor for coronary heart disease. The chemicals in tobacco smoke damage the lining of the arteries, increasing the risk of atherosclerosis (fatty plaque build-up).'},
    {q:'The pulmonary vein carries:',opts:['Oxygenated blood from the lungs to the heart','Deoxygenated blood from the heart to the lungs','Deoxygenated blood from the body to the heart','Oxygenated blood from the heart to the body'],ans:0,exp:'The PULMONARY VEIN is the only vein that carries OXYGENATED blood. It carries oxygenated blood from the LUNGS to the LEFT ATRIUM of the heart.'},
    {q:'In the heart, the septum separates:',opts:['The atria from the ventricles','The left side from the right side','The aorta from the pulmonary artery','The arteries from the veins'],ans:1,exp:'The SEPTUM is a thick wall of muscle that completely separates the LEFT and RIGHT sides of the heart. This prevents oxygenated and deoxygenated blood from mixing.'},
    {q:'When you exercise, your heart rate increases. This is because:',opts:['Your blood volume increases','Your muscles need more oxygen and glucose for aerobic respiration','Your blood pressure drops','You lose more water'],ans:1,exp:'During exercise, muscles require more ENERGY (ATP) from aerobic respiration, which requires OXYGEN and GLUCOSE. The heart pumps faster to deliver more oxygenated blood to the muscles and remove CO₂.'},
    {q:'What is the main function of the circulatory system?',opts:['To produce hormones','To transport oxygen, nutrients, and waste products around the body','To digest food','To breathe'],ans:1,exp:'The main function of the circulatory system is to TRANSPORT substances: OXYGEN from lungs to cells, NUTRIENTS from gut to cells, and WASTE PRODUCTS like CO₂ and urea to the lungs and kidneys for removal.'},
    {q:'In coronary heart disease, the coronary arteries:',opts:['Are blocked by fatty deposits (atheroma), reducing blood flow to the heart muscle','Widen to allow more blood flow','Burst and cause internal bleeding','Carry blood to the lungs'],ans:0,exp:'In CHD, the CORONARY ARTERIES (which supply the heart muscle itself) become NARROWED due to the build-up of fatty deposits (atheroma). This restricts the flow of oxygenated blood to the heart muscle, which can lead to angina or a heart attack.'},
  ],
  match:[
    {term:'Right atrium',def:'Receives deoxygenated blood from the body via the vena cava'},
    {term:'Left ventricle',def:'Pumps oxygenated blood to the whole body via the aorta; has the thickest muscular wall'},
    {term:'Artery',def:'Thick-walled, muscular blood vessel carrying blood away from the heart at high pressure'},
    {term:'Vein',def:'Thin-walled blood vessel with valves carrying blood towards the heart at low pressure'},
    {term:'Capillary',def:'A microscopic blood vessel with walls one cell thick; site of gas and nutrient exchange with tissues'},
    {term:'Haemoglobin',def:'The red, oxygen-carrying protein found inside red blood cells'},
    {term:'Plasma',def:'The pale yellow liquid component of blood that transports dissolved substances'},
    {term:'Platelet',def:'A small cell fragment involved in blood clotting to prevent bleeding'},
    {term:'White blood cell',def:'A cell of the immune system that defends the body by phagocytosis and producing antibodies'},
    {term:'Red blood cell',def:'A cell that contains haemoglobin and transports oxygen; has no nucleus and a biconcave shape'},
    {term:'Pulmonary circulation',def:'The part of the circulatory system that carries blood between the heart and the lungs'},
    {term:'Systemic circulation',def:'The part of the circulatory system that carries blood between the heart and the rest of the body'},
    {term:'Aorta',def:'The largest artery in the body; carries oxygenated blood from the left ventricle to the body'},
    {term:'Vena cava',def:'The largest vein in the body; carries deoxygenated blood from the body to the right atrium'},
    {term:'Pulmonary artery',def:'The only artery carrying deoxygenated blood; carries blood from the right ventricle to the lungs'},
    {term:'Pulmonary vein',def:'The only vein carrying oxygenated blood; carries blood from the lungs to the left atrium'},
    {term:'Coronary arteries',def:'Arteries that supply the heart muscle itself with oxygenated blood'},
    {term:'Atherosclerosis',def:'The build-up of fatty deposits (plaque) inside arteries, narrowing them'},
    {term:'Valve',def:'A structure in veins and the heart that prevents the backflow of blood'},
    {term:'Double circulation',def:'A system where blood passes through the heart twice for every complete circuit of the body'},
  ],
  flashcards:[
    {q:'Trace the path of a drop of blood from the body, through the lungs, and back to the body.',a:'Body tissues → Vena cava → Right atrium → Right ventricle → Pulmonary artery → Lungs (gas exchange) → Pulmonary vein → Left atrium → Left ventricle → Aorta → Body tissues. This is the double circulation pathway.'},
    {q:'Compare arteries and veins in terms of structure and function.',a:'ARTERIES: Thick, elastic/muscular walls; narrow lumen; no valves; carry blood AWAY from the heart at HIGH pressure. VEINS: Thin walls; wide lumen; contain VALVES; carry blood TOWARDS the heart at LOW pressure.'},
    {q:'What are the 4 main components of blood and their functions?',a:'1. RED BLOOD CELLS: carry oxygen using haemoglobin. 2. WHITE BLOOD CELLS: immunity via phagocytosis and antibody production. 3. PLATELETS: fragments involved in blood clotting. 4. PLASMA: liquid that transports dissolved substances (glucose, CO₂, hormones, urea).'},
    {q:'State TWO major risk factors for coronary heart disease (CHD).',a:'1. SMOKING: damages artery linings. 2. HIGH SATURATED FAT DIET: increases blood cholesterol and atheroma build-up. 3. HIGH BLOOD PRESSURE: stresses artery walls. 4. LACK OF EXERCISE: leads to obesity and poor circulation. 5. OBESITY. These factors lead to ATHEROSCLEROSIS.'},
    {q:'Why does the left ventricle have a thicker muscular wall than the right ventricle?',a:'The LEFT VENTRICLE pumps blood to the ENTIRE BODY (systemic circulation), which requires a much HIGHER PRESSURE to overcome the resistance of the long network of vessels. The right ventricle only pumps blood to the nearby LUNGS (pulmonary circulation), requiring much lower pressure.'},
    {q:'Explain why the circulatory system is called a "double circulation" system.',a:'It is called DOUBLE circulation because blood passes through the heart TWICE for each complete circuit of the body. It goes to the lungs (pulmonary circuit) and returns to the heart, then goes to the body (systemic circuit) and returns to the heart.'},
    {q:'Describe how capillaries are structurally adapted for efficient exchange.',a:'CAPILLARIES have walls that are only ONE CELL THICK (endothelium). This provides a very SHORT DIFFUSION DISTANCE for gases and nutrients to move between the blood and tissues. Their vast network also provides a LARGE SURFACE AREA for exchange.'},
    {q:'What is the difference between the pulmonary artery and the pulmonary vein?',a:'The PULMONARY ARTERY carries DEOXYGENATED blood from the right ventricle to the lungs. The PULMONARY VEIN carries OXYGENATED blood from the lungs back to the left atrium. The pulmonary artery is the only artery that carries deoxygenated blood.'},
    {q:'Explain why red blood cells do not have a nucleus.',a:'Red blood cells lose their nucleus during development to MAXIMISE the space available for HAEMOGLOBIN. More haemoglobin means more oxygen can be carried. Also, without a nucleus, the cell has a biconcave shape, increasing surface area for oxygen uptake.'},
    {q:'How does a blood clot form at the site of an injury?',a:'When a blood vessel is damaged, PLATELETS are attracted to the site. They release chemicals that trigger a cascade of reactions. This converts soluble fibrinogen into insoluble FIBRIN strands, which form a mesh trapping red blood cells and sealing the wound.'},
    {q:'Describe the function of the valves in the veins.',a:'VALVES in veins are one-way flaps that PREVENT BACKFLOW of blood. Because blood in veins is at very LOW PRESSURE (and often has to flow upwards against gravity), these valves ensure blood moves in only one direction — toward the heart.'},
    {q:'What is the role of plasma in the transport of carbon dioxide?',a:'Most carbon dioxide (about 85%) is transported DISSOLVED IN PLASMA as HYDROGEN CARBONATE ions (HCO₃⁻). Some CO₂ also binds to haemoglobin (carbaminohaemoglobin). The plasma carries this CO₂ from tissues to the lungs for exhalation.'},
    {q:'Explain why athletes often have lower resting heart rates.',a:'Athletes have stronger, more efficient heart muscles (due to regular cardiovascular exercise). Their stroke volume (volume of blood pumped per beat) is higher, so their heart does not need to beat as often to deliver the same amount of oxygen to the body.'},
    {q:'What is the function of the coronary arteries?',a:'The CORONARY ARTERIES are the blood vessels that supply the heart muscle itself with OXYGENATED blood and nutrients. They are vital because the heart muscle needs a constant supply of oxygen to contract continuously.'},
    {q:'Describe how atherosclerosis leads to a heart attack.',a:'Atherosclerosis is the build-up of fatty deposits (atheroma) in the coronary arteries. This NARROWS the artery and can reduce blood flow. If a clot forms, it can completely BLOCK the artery. This prevents oxygen from reaching the heart muscle, causing cells to die (heart attack).'},
    {q:'Why do arteries have thick, elastic walls?',a:'Arteries carry blood AWAY from the heart at HIGH PRESSURE. The thick, elastic walls allow them to STRETCH and RECOIL with each heartbeat, which helps to maintain blood pressure and smooth out the flow of blood.'},
    {q:'Explain why white blood cells are larger than red blood cells and have a nucleus.',a:'White blood cells need a NUCLEUS because they must produce proteins (like antibodies and enzymes) to carry out their immune functions. They are larger because they are capable of changing shape to engulf pathogens (phagocytosis).'},
    {q:'What is the advantage of double circulation over a single circulation system?',a:'Double circulation ensures a HIGHER BLOOD PRESSURE for the systemic circuit (body) because blood is repressurised after passing through the lungs. This allows efficient delivery of oxygen and nutrients to all tissues, even those far from the heart.'},
    {q:'Describe how the heart rate is controlled.',a:'The heart rate is controlled by a group of cells in the right atrium called the PACEMAKER (sinoatrial node). It sends electrical impulses that cause the heart muscles to contract. The rate can be modified by hormones (e.g., adrenaline) and the nervous system.'},
    {q:'Why is it dangerous for fatty plaque to build up in the arteries?',a:'Fatty plaque (atheroma) builds up inside the artery wall, narrowing the lumen. This restricts blood flow. If a plaque ruptures, it can trigger a blood clot that blocks the artery, leading to a heart attack (if in coronary arteries) or a stroke (if in brain arteries).'},
  ],
  blanks:{
    passage:'The right ventricle pumps deoxygenated blood to the lungs via the pulmonary [_]. Oxygenated blood returns to the heart through the pulmonary [_] and enters the left atrium. The left ventricle then pumps blood to the entire body through the [_]. Blood vessels that carry blood away from the heart are called [_]; those that return blood to the heart are called [_]. At the capillaries, oxygen diffuses out of the blood into the [_] cells to be used for respiration.',
    answers:['artery','vein','aorta','arteries','veins','body'],
    wordbank:['artery','vein','aorta','arteries','veins','body','ventricle','atrium'],
  },
  sentences:[
    {prompt:'Explain how the structure of a capillary is perfectly adapted for its function of exchanging substances with tissues.',keywords:['one cell thick','diffusion','distance','surface area','blood supply','thin wall','exchange'],hint:'What structural features of capillaries make diffusion of oxygen and nutrients fast and efficient?'},
    {prompt:'Explain how the build-up of fatty deposits (atheroma) in the coronary arteries can lead to a heart attack.',keywords:['plaque','coronary artery','narrow','blood flow','oxygen','heart muscle','blockage','atherosclerosis'],hint:'What happens to the artery wall? How does this restrict blood flow? What happens to the heart muscle cells when they are starved of oxygen?'},
    {prompt:'Compare how red blood cells and white blood cells are structurally adapted to their respective functions.',keywords:['haemoglobin','no nucleus','biconcave','surface area','phagocytosis','antibodies','nucleus','shape','defence'],hint:'What specific physical features allow red blood cells to carry maximum oxygen? What features allow white blood cells to fight pathogens?'},
    {prompt:'A patient has a blood clot in their leg. Explain how this could travel to the lungs and cause a pulmonary embolism.',keywords:['blood clot','leg','vein','heart','lungs','blockage','embolism','travel'],hint:'How does blood travel from the leg back to the heart? Where would a clot in the leg eventually end up if it breaks loose?'},
    {prompt:'Describe the pathway of a red blood cell as it travels from the left ventricle to the big toe and back to the heart.',keywords:['left ventricle','aorta','artery','capillary','toe','vein','vena cava','right atrium'],hint:'Trace the blood through the systemic circulation: out of the heart, through the body, and back to the heart again.'},
    {prompt:'Explain why the walls of the left ventricle are thicker than the walls of the right ventricle.',keywords:['left ventricle','pump','body','high pressure','right ventricle','lungs','distance','resistance'],hint:'Which ventricle pumps blood to the lungs, and which pumps it to the whole body? Which circuit requires more pressure?'},
    {prompt:'What is the role of haemoglobin in the transport of oxygen?',keywords:['haemoglobin','oxygen','lungs','oxyhaemoglobin','respiring tissues','release','combine'],hint:'What happens to haemoglobin in the lungs? What happens to it in tissues where oxygen concentration is low?'},
    {prompt:'Describe the function of the heart valves.',keywords:['valves','heart','atria','ventricles','prevent','backflow','one way','blood flow'],hint:'What structure prevents blood from flowing backwards from the ventricles into the atria? What prevents blood from flowing back from the arteries into the ventricles?'},
    {prompt:'A person with atherosclerosis has a high risk of stroke. Explain why.',keywords:['atherosclerosis','plaque','artery','brain','blockage','stroke','blood flow','oxygen'],hint:'What happens if the arteries supplying the brain become narrowed or blocked by a blood clot?'},
    {prompt:'Explain the role of the lungs in the circulatory system.',keywords:['lungs','gas exchange','oxygen','carbon dioxide','alveoli','pulmonary circulation','blood'],hint:'How do the lungs re-oxygenate the blood? How do they remove carbon dioxide from the blood?'},
    {prompt:'Compare the structure and function of arteries and veins.',keywords:['arteries','away','thick','high pressure','veins','towards','thin','valves','low pressure'],hint:'List at least three differences between arteries and veins in terms of wall thickness, lumen size, valves, and pressure.'},
    {prompt:'Why does an increase in blood cholesterol increase the risk of heart disease?',keywords:['cholesterol','fat','atheroma','plaque','artery','narrow','block','heart disease'],hint:'What does cholesterol contribute to the build-up inside artery walls?'},
    {prompt:'Describe the process of blood clotting and the role of platelets.',keywords:['platelets','clotting','fibrin','wound','mesh','bleeding','prevent','fibrinogen'],hint:'What cells are involved? How do they prevent blood loss from a cut?'},
    {prompt:'Explain why the heart is considered a double pump.',keywords:['double pump','right side','lungs','left side','body','circuits','pulmonary','systemic'],hint:'The heart has two sides. What does the right side pump to, and what does the left side pump to? How does this make it a "double pump"?'},
    {prompt:'Why does the blood in the veins have a lower pressure than the blood in the arteries?',keywords:['veins','low pressure','arteries','high pressure','heart','pump','distance'],hint:'By the time blood reaches the veins, it has passed through the high-resistance capillary beds. What happens to the pressure?'},
    {prompt:'Explain how the respiratory system and the circulatory system work together to deliver oxygen to muscles during exercise.',keywords:['lungs','heart','oxygen','blood','muscles','respiration','exercise','delivery'],hint:'How does oxygen get from the air into the blood? How does the blood get the oxygen to the muscles?'},
    {prompt:'Describe the role of white blood cells in the immune response.',keywords:['white blood cells','pathogens','phagocytosis','engulf','antibodies','immunity','infection'],hint:'What are the two main ways white blood cells protect the body against disease?'},
    {prompt:'What is the function of the septum in the heart?',keywords:['septum','heart','left','right','oxygenated','deoxygenated','separation','mix'],hint:'Why is it important that the left and right sides of the heart are completely separated?'},
    {prompt:'Explain how a heart attack is caused by a blockage in the coronary arteries.',keywords:['coronary artery','blockage','oxygen','heart muscle','tissue death','heart attack','atheroma'],hint:'What do the coronary arteries supply? What happens if they are blocked?'},
    {prompt:'State two lifestyle changes a person could make to reduce their risk of cardiovascular disease.',keywords:['lifestyle','diet','exercise','smoking','alcohol','blood pressure','cholesterol','risk','prevention'],hint:'What changes to diet, physical activity, or habits would improve heart health?'},
  ],
});
</script></body></html>
