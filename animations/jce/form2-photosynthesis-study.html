<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Photosynthesis — BEC Study</title>
<style>*,*::before,*::after{box-sizing:border-box}</style>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="../study-engine.js"></script>
<script>
function bg(sk,c){sk.background(...(c||[10,18,10]))}

const STEPS=[
  {
    title:'What is Photosynthesis?',
    body:`<strong>Photosynthesis</strong> is the process by which green plants (and some other organisms) use sunlight to convert carbon dioxide and water into glucose and oxygen.
    <br><br>
    <strong>Word equation:</strong><br>
    <div style="background:#1b5e20;border-radius:8px;padding:10px 14px;margin:10px 0;font-family:monospace;font-size:.88rem;color:#a5d6a7">
      Carbon dioxide + Water → Glucose + Oxygen
    </div>
    <strong>Symbol equation:</strong><br>
    <div style="background:#1b5e20;border-radius:8px;padding:10px 14px;font-family:monospace;font-size:.88rem;color:#a5d6a7">
      6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂
    </div>
    <br>This reaction requires <strong>light energy</strong> and the green pigment <strong>chlorophyll</strong>.`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Sun
      for(let i=0;i<8;i++){
        const ang=sk.TWO_PI/8*i+t*0.5;
        sk.stroke(255,220,50,160);sk.strokeWeight(2.5);sk.noFill();
        sk.line(W*0.5+Math.cos(ang)*38,H*0.15+Math.sin(ang)*38,W*0.5+Math.cos(ang)*52,H*0.15+Math.sin(ang)*52);
      }
      sk.fill(255,220,50,240);sk.noStroke();sk.circle(W*0.5,H*0.15,50);
      // Light rays downward
      for(let i=0;i<3;i++){
        const x=W*(0.35+i*0.15);
        const alpha=180+60*Math.sin(t*1.5+i);
        sk.stroke(255,220,50,alpha);sk.strokeWeight(1.5);
        for(let j=0;j<8;j++){
          sk.line(x,H*0.22+j*8,x,H*0.22+(j+1)*8-2);
        }
      }
      // Leaf
      sk.fill(34,139,34,200);sk.noStroke();
      sk.ellipse(W*0.5,H*0.56,W*0.45,H*0.36);
      sk.stroke(0,100,0,180);sk.strokeWeight(1.5);sk.noFill();
      sk.line(W*0.29,H*0.55,W*0.71,H*0.55);
      for(let i=1;i<=4;i++){
        sk.line(W*0.29+i*(W*0.42/5),H*0.55,W*0.29+i*(W*0.42/5)+(i<3?-14:14),H*0.55+20);
      }
      // CO2 arrows in
      sk.fill(100,180,255);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('CO₂ + H₂O',W*0.18,H*0.44);
      sk.stroke(100,180,255,160);sk.strokeWeight(1.5);
      sk.line(W*0.18,H*0.47,W*0.28,H*0.52);
      // O2 + glucose arrows out
      sk.fill(200,255,200);sk.textSize(9);
      sk.text('O₂ + Glucose',W*0.78,H*0.44);
      sk.stroke(200,255,200,160);sk.strokeWeight(1.5);
      sk.line(W*0.72,H*0.52,W*0.78,H*0.47);
      // Chlorophyll label
      sk.fill(255,220,50);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('Chlorophyll',W*0.5,H*0.85);
      sk.text('(captures light)',W*0.5,H*0.91);
    }
  },
  {
    title:'Conditions Needed for Photosynthesis',
    body:`For photosynthesis to occur, three things are needed:
    <br><br>
    <ol style="margin:6px 0 0 18px;line-height:2.3">
      <li><strong>Light</strong> — the energy source (usually sunlight). More light = faster rate.</li>
      <li><strong>Carbon dioxide (CO₂)</strong> — enters through tiny pores called <strong>stomata</strong> on the leaf surface.</li>
      <li><strong>Water (H₂O)</strong> — absorbed by roots, travels up the xylem to leaves.</li>
      <li><strong>Chlorophyll</strong> — the green pigment in chloroplasts that absorbs light energy.</li>
    </ol>
    <br>Limiting factors that slow photosynthesis: low light intensity, low CO₂ concentration, low temperature (enzymes slow down).`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      const factors=[
        {n:'Light',icon:'☀',c:[255,220,50],x:0.5,y:0.2},
        {n:'CO₂',icon:'💨',c:[100,200,255],x:0.2,y:0.55},
        {n:'H₂O',icon:'💧',c:[52,152,219],x:0.8,y:0.55},
        {n:'Chlorophyll',icon:'🌿',c:[46,204,113],x:0.5,y:0.85},
      ];
      // Centre leaf
      sk.fill(34,139,34,80);sk.noStroke();sk.ellipse(W*0.5,H*0.55,90,70);
      sk.stroke(46,204,113,140);sk.strokeWeight(1.5);sk.noFill();sk.ellipse(W*0.5,H*0.55,90,70);
      factors.forEach((f,i)=>{
        const cx=f.x*W,cy=f.y*H,pulse=1+Math.sin(t*1.4+i*0.9)*0.09;
        sk.fill(...f.c,40);sk.noStroke();sk.circle(cx,cy,52*pulse);
        sk.fill(...f.c,180);sk.circle(cx,cy,36*pulse);
        sk.fill(255);sk.textSize(11);sk.textAlign(sk.CENTER,sk.CENTER);sk.text(f.icon,cx,cy);
        sk.fill(255);sk.textSize(9.5);sk.textAlign(sk.CENTER);sk.text(f.n,cx,cy+26);
        // Arrow to centre
        sk.stroke(...f.c,80);sk.strokeWeight(1);sk.noFill();
        const dx=W*0.5-cx,dy=H*0.55-cy;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist>50){
          const nx=dx/dist,ny=dy/dist;
          const progress=(t*0.5+i*0.25)%1;
          const px=cx+nx*dist*progress,py=cy+ny*dist*progress;
          sk.fill(...f.c,200);sk.noStroke();sk.circle(px,py,7);
        }
      });
    }
  },
  {
    title:'The Leaf as a Photosynthesis Factory',
    body:`The <strong>leaf</strong> is specially adapted for photosynthesis:
    <ul style="margin:6px 0 0 18px;line-height:2.2">
      <li><strong>Large, flat surface</strong> — maximum light absorption</li>
      <li><strong>Thin</strong> — CO₂ diffuses quickly to all cells</li>
      <li><strong>Chloroplasts</strong> in palisade mesophyll (upper layer) — most photosynthesis here</li>
      <li><strong>Stomata</strong> — tiny pores (mainly on underside) for CO₂ in and O₂ out; controlled by guard cells</li>
      <li><strong>Vascular bundles (veins)</strong> — xylem brings water; phloem carries glucose away</li>
      <li><strong>Spongy mesophyll</strong> — air spaces for gas diffusion between cells</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk,[12,20,12]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Cross-section of leaf (simplified)
      // Cuticle + upper epidermis
      sk.fill(180,220,140,200);sk.noStroke();sk.rect(W*0.06,H*0.22,W*0.88,16,3,3,0,0);
      // Palisade cells
      for(let i=0;i<11;i++){
        const x=W*0.06+i*(W*0.88/11);
        const pulse=1+Math.sin(t*1.2+i*0.4)*0.06;
        sk.fill(0,160,0,180);sk.noStroke();sk.rect(x+2,H*0.22+16,W*0.88/11-4,46);
        sk.fill(0,200,50,60);sk.circle(x+W*0.88/22,H*0.22+34,10*pulse);
      }
      // Spongy mesophyll
      for(let i=0;i<20;i++){
        const x=W*0.06+(i%10)*(W*0.88/10)+Math.random()*8,y=H*0.22+70+Math.floor(i/10)*22;
        sk.fill(100,200,100,140);sk.noStroke();sk.ellipse(x+W*0.088/2,y,20,14);
      }
      // Lower epidermis
      sk.fill(160,200,120,200);sk.noStroke();sk.rect(W*0.06,H*0.22+108,W*0.88,12,0,0,3,3);
      // Stomata
      for(let i=0;i<4;i++){
        const x=W*0.15+i*W*0.2;
        sk.fill(30,60,30,200);sk.noStroke();sk.ellipse(x,H*0.22+120,18,8);
        sk.fill(100,160,100,160);sk.ellipse(x-6,H*0.22+120,8,10);
        sk.ellipse(x+6,H*0.22+120,8,10);
      }
      // Labels
      sk.fill(255);sk.textSize(8.5);sk.textAlign(sk.LEFT);
      sk.text('Palisade cells (chloroplasts)',W*0.06+W*0.88+6,H*0.22+38);
      sk.text('Spongy mesophyll (air spaces)',W*0.06+W*0.88+6,H*0.22+82);
      sk.text('Stomata + guard cells',W*0.06+W*0.88+6,H*0.22+122);
    }
  },
  {
    title:'Leaf Cross-Section — Where Photosynthesis Happens',
    content:`<h3>Leaf Cross-Section</h3><p>A cross-section of a leaf shows the layers where photosynthesis occurs. Light enters from the top, CO₂ enters through stomata on the lower surface. The palisade mesophyll contains most chloroplasts.</p>`,
    visual:`<svg viewBox="0 0 420 240" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555"/></marker></defs>
  <!-- Light arrows from top -->
  <line x1="60" y1="5" x2="60" y2="30" stroke="#f9a825" stroke-width="2" marker-end="url(#a)"/>
  <line x1="100" y1="5" x2="100" y2="30" stroke="#f9a825" stroke-width="2" marker-end="url(#a)"/>
  <line x1="140" y1="5" x2="140" y2="30" stroke="#f9a825" stroke-width="2" marker-end="url(#a)"/>
  <text x="100" y="14" font-size="9" fill="#f9a825" text-anchor="middle">Light energy</text>
  <!-- Upper epidermis -->
  <rect x="30" y="32" width="260" height="14" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="300" y="43" font-size="9" fill="#1b5e20">Upper epidermis (transparent)</text>
  <!-- Palisade mesophyll -->
  <rect x="30" y="46" width="260" height="52" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1"/>
  <!-- Palisade cells -->
  <rect x="34" y="48" width="20" height="48" fill="#66bb6a" stroke="#388e3c" stroke-width="0.8" rx="2"/>
  <rect x="58" y="48" width="20" height="48" fill="#66bb6a" stroke="#388e3c" stroke-width="0.8" rx="2"/>
  <rect x="82" y="48" width="20" height="48" fill="#66bb6a" stroke="#388e3c" stroke-width="0.8" rx="2"/>
  <rect x="106" y="48" width="20" height="48" fill="#66bb6a" stroke="#388e3c" stroke-width="0.8" rx="2"/>
  <rect x="130" y="48" width="20" height="48" fill="#66bb6a" stroke="#388e3c" stroke-width="0.8" rx="2"/>
  <rect x="154" y="48" width="20" height="48" fill="#66bb6a" stroke="#388e3c" stroke-width="0.8" rx="2"/>
  <rect x="178" y="48" width="20" height="48" fill="#66bb6a" stroke="#388e3c" stroke-width="0.8" rx="2"/>
  <rect x="202" y="48" width="20" height="48" fill="#66bb6a" stroke="#388e3c" stroke-width="0.8" rx="2"/>
  <rect x="226" y="48" width="20" height="48" fill="#66bb6a" stroke="#388e3c" stroke-width="0.8" rx="2"/>
  <rect x="250" y="48" width="20" height="48" fill="#66bb6a" stroke="#388e3c" stroke-width="0.8" rx="2"/>
  <!-- Chloroplast dots in palisade -->
  <circle cx="44" cy="64" r="3" fill="#1b5e20"/><circle cx="44" cy="76" r="3" fill="#1b5e20"/>
  <circle cx="68" cy="60" r="3" fill="#1b5e20"/><circle cx="68" cy="72" r="3" fill="#1b5e20"/>
  <circle cx="92" cy="64" r="3" fill="#1b5e20"/><circle cx="92" cy="78" r="3" fill="#1b5e20"/>
  <text x="300" y="65" font-size="9" fill="#1b5e20">Palisade mesophyll</text>
  <text x="300" y="77" font-size="9" fill="#1b5e20">(most photosynthesis)</text>
  <!-- Spongy mesophyll -->
  <rect x="30" y="98" width="260" height="44" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <ellipse cx="55" cy="112" rx="13" ry="9" fill="#a5d6a7" stroke="#388e3c" stroke-width="0.8"/>
  <ellipse cx="90" cy="118" rx="14" ry="8" fill="#a5d6a7" stroke="#388e3c" stroke-width="0.8"/>
  <ellipse cx="125" cy="110" rx="12" ry="9" fill="#a5d6a7" stroke="#388e3c" stroke-width="0.8"/>
  <ellipse cx="158" cy="117" rx="13" ry="8" fill="#a5d6a7" stroke="#388e3c" stroke-width="0.8"/>
  <ellipse cx="195" cy="112" rx="12" ry="9" fill="#a5d6a7" stroke="#388e3c" stroke-width="0.8"/>
  <ellipse cx="228" cy="118" rx="13" ry="8" fill="#a5d6a7" stroke="#388e3c" stroke-width="0.8"/>
  <text x="300" y="116" font-size="9" fill="#1b5e20">Spongy mesophyll</text>
  <text x="300" y="128" font-size="9" fill="#1b5e20">(air spaces — gas diffusion)</text>
  <!-- Vascular bundle -->
  <ellipse cx="160" cy="120" rx="12" ry="8" fill="#1565c0" stroke="#0d47a1" stroke-width="1"/>
  <text x="160" y="124" font-size="7" fill="white" text-anchor="middle">VB</text>
  <text x="300" y="140" font-size="9" fill="#1565c0">Vascular bundle (xylem+phloem)</text>
  <!-- Lower epidermis -->
  <rect x="30" y="142" width="260" height="13" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="300" y="152" font-size="9" fill="#1b5e20">Lower epidermis</text>
  <!-- Stomata -->
  <ellipse cx="80" cy="162" rx="10" ry="5" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
  <ellipse cx="75" cy="162" rx="5" ry="7" fill="#4caf50"/>
  <ellipse cx="85" cy="162" rx="5" ry="7" fill="#4caf50"/>
  <ellipse cx="170" cy="162" rx="10" ry="5" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
  <ellipse cx="165" cy="162" rx="5" ry="7" fill="#4caf50"/>
  <ellipse cx="175" cy="162" rx="5" ry="7" fill="#4caf50"/>
  <text x="300" y="166" font-size="9" fill="#2e7d32">Stomata + guard cells</text>
  <!-- CO2 arrows entering stomata -->
  <line x1="80" y1="195" x2="80" y2="172" stroke="#1565c0" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="80" y="208" font-size="8" fill="#1565c0" text-anchor="middle">CO₂ in</text>
  <line x1="170" y1="195" x2="170" y2="172" stroke="#1565c0" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="170" y="208" font-size="8" fill="#1565c0" text-anchor="middle">CO₂ in</text>
  <!-- O2 out arrow -->
  <line x1="230" y1="172" x2="230" y2="195" stroke="#43a047" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="230" y="208" font-size="8" fill="#43a047" text-anchor="middle">O₂ out</text>
</svg>`
  },
  {
    title:'Photosynthesis — Inputs and Outputs',
    content:`<h3>Inputs and Outputs of Photosynthesis</h3><p>Photosynthesis takes in three things (inputs) and produces two things (outputs). The chemical equation summarises the whole reaction.</p>`,
    visual:`<svg viewBox="0 0 420 250" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e7d32"/></marker><marker id="b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1565c0"/></marker></defs>
  <!-- Central leaf/chloroplast -->
  <ellipse cx="210" cy="118" rx="52" ry="38" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <text x="210" y="112" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">Chloroplast</text>
  <text x="210" y="125" font-size="9" fill="#e8f5e9" text-anchor="middle">+ light energy</text>
  <!-- INPUTS label -->
  <text x="70" y="28" font-size="11" fill="#1b5e20" text-anchor="middle" font-weight="bold">INPUTS</text>
  <!-- CO2 input -->
  <rect x="10" y="40" width="90" height="32" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="55" y="55" font-size="9" fill="#1b5e20" text-anchor="middle">CO₂ from air</text>
  <text x="55" y="67" font-size="8" fill="#388e3c" text-anchor="middle">through stomata</text>
  <line x1="100" y1="56" x2="155" y2="100" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Water input -->
  <rect x="10" y="100" width="90" height="32" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="55" y="115" font-size="9" fill="#1b5e20" text-anchor="middle">Water (H₂O)</text>
  <text x="55" y="127" font-size="8" fill="#388e3c" text-anchor="middle">from soil via xylem</text>
  <line x1="100" y1="116" x2="155" y2="116" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Light input -->
  <rect x="10" y="160" width="90" height="32" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="55" y="175" font-size="9" fill="#1b5e20" text-anchor="middle">Light energy</text>
  <text x="55" y="187" font-size="8" fill="#388e3c" text-anchor="middle">from sun</text>
  <line x1="100" y1="176" x2="155" y2="132" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- OUTPUTS label -->
  <text x="348" y="28" font-size="11" fill="#1565c0" text-anchor="middle" font-weight="bold">OUTPUTS</text>
  <!-- Glucose output -->
  <rect x="320" y="40" width="90" height="32" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="365" y="55" font-size="9" fill="#1565c0" text-anchor="middle">Glucose</text>
  <text x="365" y="67" font-size="8" fill="#1976d2" text-anchor="middle">stored as starch</text>
  <line x1="265" y1="100" x2="318" y2="56" stroke="#1565c0" stroke-width="1.5" marker-end="url(#b)"/>
  <!-- Oxygen output -->
  <rect x="320" y="100" width="90" height="32" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="365" y="115" font-size="9" fill="#1565c0" text-anchor="middle">Oxygen (O₂)</text>
  <text x="365" y="127" font-size="8" fill="#1976d2" text-anchor="middle">released via stomata</text>
  <line x1="265" y1="116" x2="318" y2="116" stroke="#1565c0" stroke-width="1.5" marker-end="url(#b)"/>
  <!-- Chemical equation -->
  <rect x="30" y="210" width="360" height="32" rx="6" fill="#1b5e20"/>
  <text x="210" y="222" font-size="9" fill="#a5d6a7" text-anchor="middle">6CO₂ + 6H₂O + light energy</text>
  <text x="210" y="236" font-size="9" fill="#a5d6a7" text-anchor="middle">&#8594; C₆H₁₂O₆ + 6O₂</text>
</svg>`
  },
  {
    title:'Xylem vs Phloem — Transport Tissues',
    content:`<h3>Xylem and Phloem</h3><p>Plants have two transport tissues. Xylem carries water upward from roots; phloem carries dissolved sugars in both directions. Together they form vascular bundles (leaf veins).</p>`,
    visual:`<svg viewBox="0 0 420 250" width="100%" font-family="system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- XYLEM column (left, blue) -->
  <rect x="15" y="30" width="180" height="200" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="105" y="50" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="bold">XYLEM</text>
  <!-- Xylem tubes (hollow, thick walls) -->
  <rect x="40" y="60" width="28" height="140" rx="3" fill="white" stroke="#1565c0" stroke-width="3"/>
  <rect x="80" y="60" width="28" height="140" rx="3" fill="white" stroke="#1565c0" stroke-width="3"/>
  <rect x="120" y="60" width="28" height="140" rx="3" fill="white" stroke="#1565c0" stroke-width="3"/>
  <rect x="160" y="60" width="28" height="140" rx="3" fill="white" stroke="#1565c0" stroke-width="3"/>
  <!-- Water flow arrows (up) -->
  <line x1="54" y1="175" x2="54" y2="75" stroke="#42a5f5" stroke-width="2" marker-end="url(#aw)"/>
  <line x1="94" y1="175" x2="94" y2="75" stroke="#42a5f5" stroke-width="2" marker-end="url(#aw)"/>
  <line x1="134" y1="175" x2="134" y2="75" stroke="#42a5f5" stroke-width="2" marker-end="url(#aw)"/>
  <!-- Labels -->
  <text x="105" y="215" font-size="8" fill="#1565c0" text-anchor="middle">Water + minerals UP</text>
  <text x="105" y="226" font-size="8" fill="#1565c0" text-anchor="middle">Dead cells, no cytoplasm</text>
  <text x="105" y="237" font-size="8" fill="#1565c0" text-anchor="middle">Lignin walls (waterproof)</text>
  <defs>
    <marker id="aw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#42a5f5"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e7d32"/></marker>
    <marker id="agd" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#43a047"/></marker>
  </defs>

    title:'🎮 Check — Photosynthesis Basics',
    body:'Test your understanding of the photosynthesis process and conditions.',
    draw:null,
    game:{type:'mcq',questions:[
      {q:'What are the PRODUCTS of photosynthesis?',opts:['Carbon dioxide and water','Glucose and oxygen','Light and chlorophyll','Glucose and carbon dioxide'],ans:1,exp:'Photosynthesis PRODUCES glucose (food/energy store) and oxygen. It USES CO₂ and water. Remember: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂'},
      {q:'Where in the leaf does most photosynthesis occur?',opts:['Lower epidermis','Spongy mesophyll','Palisade mesophyll','Guard cells'],ans:2,exp:'The PALISADE MESOPHYLL (upper layer) contains tightly packed cells with many chloroplasts, positioned closest to the light source. This is where most photosynthesis takes place.'},
      {q:'Through which structures does CO₂ enter a leaf?',opts:['Xylem vessels','Root hair cells','Chloroplasts','Stomata'],ans:3,exp:'CO₂ diffuses into the leaf through STOMATA — tiny pores on the leaf surface (mainly the underside). Guard cells open and close the stomata to control gas exchange and water loss.'},
      {q:'What is the role of chlorophyll in photosynthesis?',opts:['It produces carbon dioxide','It absorbs light energy','It transports water','It stores glucose'],ans:1,exp:'Chlorophyll is the GREEN PIGMENT in chloroplasts that ABSORBS light energy (mainly red and blue light). This energy is then used to drive the chemical reactions of photosynthesis.'},

  {
    title:'Rate of Photosynthesis',
    body:`The <strong>rate of photosynthesis</strong> can be increased by increasing:
    <ul style="margin:6px 0 0 18px;line-height:2.2">
      <li><strong>Light intensity</strong> — more photons to drive the reactions</li>
      <li><strong>CO₂ concentration</strong> — more raw material available</li>
      <li><strong>Temperature</strong> — faster enzyme activity (up to ~40°C; above this enzymes denature)</li>
    </ul>
    <br>
    <strong>Limiting factor</strong>: When one factor is in short supply, it limits the rate even if others are plentiful.
    <br><br>
    Example: On a bright, warm day the <em>rate may still be slow</em> if CO₂ concentration is too low — CO₂ is then the limiting factor.`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Animated graph: rate vs light intensity
      sk.fill(255);sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      sk.text('Rate of Photosynthesis vs Light Intensity',W/2,H*0.1);
      // Axes
      sk.stroke(255,255,255,140);sk.strokeWeight(1.5);sk.noFill();
      sk.line(W*0.1,H*0.82,W*0.9,H*0.82); // x
      sk.line(W*0.1,H*0.82,W*0.1,H*0.18); // y
      sk.fill(200);sk.textSize(8);sk.textAlign(sk.CENTER);
      sk.text('Light Intensity →',W*0.5,H*0.9);
      sk.push();sk.translate(W*0.06,H*0.5);sk.rotate(-sk.HALF_PI);
      sk.text('Rate →',0,0);sk.pop();
      // Three curves (different CO2/temp)
      const cols=[[46,204,113],[52,152,219],[231,76,60]];
      const labels=['High CO₂','Medium CO₂','Low CO₂'];
      const limits=[0.8,0.55,0.35];
      cols.forEach((c,ci)=>{
        sk.stroke(...c,200);sk.strokeWeight(2.5);sk.noFill();
        sk.beginShape();
        for(let x=0;x<=W*0.8;x+=2){
          const nx=x/(W*0.8);
          const rate=limits[ci]*(1-Math.exp(-nx*3));
          const sx=W*0.1+x,sy=H*0.82-rate*(H*0.6);
          sk.vertex(sx,sy);
        }
        sk.endShape();
        sk.fill(...c);sk.textSize(8);sk.textAlign(sk.LEFT);
        sk.text(labels[ci],W*0.86+ci*2,H*0.82-limits[ci]*H*0.6);
      });
      // Animated moving point
      const animX=(t*0.18)%1;
      const rate=limits[0]*(1-Math.exp(-animX*3));
      const px=W*0.1+animX*W*0.8,py=H*0.82-rate*H*0.6;
      sk.fill(255,220,50,220);sk.noStroke();sk.circle(px,py,10);
    }
  },
  {
    title:'Using Glucose from Photosynthesis',
    body:`The glucose produced is used for many purposes:
    <ul style="margin:8px 0 0 18px;line-height:2.3">
      <li><strong>Respiration</strong> — releases energy for cell processes (C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy)</li>
      <li><strong>Cellulose</strong> — glucose→cellulose for cell walls (strength)</li>
      <li><strong>Starch</strong> — glucose→starch for storage (in roots, seeds)</li>
      <li><strong>Sucrose</strong> — glucose converted to sucrose for transport in phloem</li>
      <li><strong>Amino acids</strong> — glucose + nitrate ions → amino acids → proteins</li>
      <li><strong>Oils/fats</strong> — stored in seeds</li>
    </ul>
    Testing for starch in a leaf: boil leaf → soak in ethanol → wash with water → add <strong>iodine solution</strong> (turns blue-black if starch present).`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Glucose at centre
      sk.fill(46,204,113,50);sk.noStroke();sk.circle(W*0.5,H*0.5,80);
      sk.fill(46,204,113,200);sk.circle(W*0.5,H*0.5,56);
      sk.fill(255);sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER,sk.CENTER);
      sk.text('Glucose\n(C₆H₁₂O₆)',W*0.5,H*0.5);
      const uses=[
        {n:'Respiration',c:[231,76,60],x:0.5,y:0.12},
        {n:'Starch\n(storage)',c:[241,196,15],x:0.85,y:0.3},
        {n:'Cellulose\n(cell walls)',c:[52,152,219],x:0.85,y:0.68},
        {n:'Proteins\n(amino acids)',c:[155,89,182],x:0.5,y:0.88},
        {n:'Oils & Fats\n(seeds)',c:[230,126,34],x:0.15,y:0.68},
        {n:'Sucrose\n(transport)',c:[26,188,156],x:0.15,y:0.3},
      ];
      uses.forEach((u,i)=>{
        const cx=u.x*W,cy=u.y*H,pulse=1+Math.sin(t*1.3+i*0.9)*0.08;
        sk.fill(...u.c,40);sk.noStroke();sk.circle(cx,cy,62*pulse);
        sk.fill(...u.c,180);sk.circle(cx,cy,42*pulse);
        sk.fill(255);sk.textSize(8.5);sk.textStyle(sk.NORMAL);sk.textAlign(sk.CENTER,sk.CENTER);sk.text(u.n,cx,cy);
        // Animated particle from glucose to use
        const dx=cx-W*0.5,dy=cy-H*0.5;
        const dist=Math.sqrt(dx*dx+dy*dy);
        const nx=dx/dist,ny=dy/dist;
        const prog=((t*0.3+i*0.17)%1);
        const px=W*0.5+nx*28+nx*(dist-56)*prog;
        const py=H*0.5+ny*28+ny*(dist-56)*prog;
        sk.fill(...u.c,200);sk.noStroke();sk.circle(px,py,8);
      });
    }
  },
