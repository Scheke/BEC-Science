initQuiz({
  title:'Digestion — JCE Biology Quiz',
  color:'#880e4f',dark:'#560027',light:'#fce4ec',
    mcq:[
    {q:'Amylase digests:',opts:['Proteins into amino acids','Fats into fatty acids','Starch into maltose','Maltose into glucose'],ans:2,exp:'AMYLASE is a carbohydrase enzyme that breaks STARCH into MALTOSE. Produced in the salivary glands and pancreas.'},
    {q:'Where does most digestion and absorption occur?',opts:['Stomach','Large intestine','Small intestine','Oesophagus'],ans:2,exp:'The SMALL INTESTINE is the main site of both DIGESTION (enzymes complete breakdown) and ABSORPTION (through villi into blood).'},
    {q:'Bile is produced by the:',opts:['Pancreas','Stomach','Liver','Small intestine'],ans:2,exp:'BILE is produced by the LIVER, stored in the gallbladder, and released into the small intestine. It emulsifies fats (breaks fat globules into tiny droplets) — increasing surface area for lipase.'},
    {q:'Villi in the small intestine increase the rate of:',opts:['Digestion of proteins','Absorption of digested food','Production of bile','Peristalsis'],ans:1,exp:'VILLI are finger-like projections lining the small intestine. They MASSIVELY INCREASE SURFACE AREA for absorption of glucose, amino acids, fatty acids, and glycerol into the blood.'},
    {q:'Peristalsis refers to:',opts:['Breakdown of food by enzymes','Wave-like muscular contractions that move food along the gut','Absorption of nutrients into blood','Secretion of digestive juices'],ans:1,exp:'PERISTALSIS: wave-like contractions of circular and longitudinal muscles in the gut wall that push food along the alimentary canal.'},
    {q:'Protease enzymes break down:',opts:['Starch into glucose','Proteins into amino acids','Fats into fatty acids','Maltose into glucose'],ans:1,exp:'PROTEASE enzymes (e.g., pepsin in the stomach, trypsin in the small intestine) break down PROTEINS into AMINO ACIDS. They work best in acidic (pepsin) or neutral/alkaline (trypsin) conditions.'},
    {q:'The final products of fat digestion are:',opts:['Glucose and amino acids','Fatty acids and glycerol','Starch and maltose','Water and carbon dioxide'],ans:1,exp:'LIPASE enzymes break down fats (lipids) into FATTY ACIDS and GLYCEROL. This process is aided by bile, which emulsifies the fats first.'},
    {q:'The function of the oesophagus is to:',opts:['Absorb nutrients','Move food from the mouth to the stomach via peristalsis','Produce digestive enzymes','Store bile'],ans:1,exp:'The OESOPHAGUS (gullet) is a muscular tube that connects the mouth to the stomach. It uses PERISTALSIS to push food bolus downwards.'},
    {q:'Where is the enzyme amylase produced?',opts:['Small intestine only','Salivary glands and pancreas','Liver only','Stomach'],ans:1,exp:'AMYLASE is produced by the SALIVARY GLANDS (saliva) and the PANCREAS (pancreatic juice). It breaks starch down into maltose at both sites.'},
    {q:'The small intestine is adapted for absorption because it has:',opts:['A short length and thick walls','Villi and a large surface area','An acidic environment','No blood supply'],ans:1,exp:'The small intestine has a VERY LARGE SURFACE AREA due to its length, folds, and the presence of VILLI and MICROVILLI. This maximizes the absorption of nutrients into the bloodstream.'},
    {q:'The main function of the large intestine is:',opts:['Digestion of proteins','Absorption of water and formation of faeces','Absorption of glucose','Production of bile'],ans:1,exp:'The LARGE INTESTINE (colon) absorbs WATER from the undigested food material. It also absorbs some minerals. The remaining solid waste (faeces) is stored in the rectum before being excreted.'},
    {q:'Where does digestion of starch begin in the human body?',opts:['Stomach','Small intestine','Mouth','Large intestine'],ans:2,exp:'Digestion of starch begins in the MOUTH. Salivary AMYLASE breaks starch down into maltose while the food is being chewed. This is the first step of carbohydrate digestion.'},
    {q:'Pepsin is a protease that works best in:',opts:['Neutral conditions (pH 7)','Alkaline conditions (pH 8-9)','Acidic conditions (pH 1.5-2)','Very hot temperatures'],ans:2,exp:'PEPSIN is a protease in the stomach that works best in ACIDIC conditions (pH 1.5-2). Hydrochloric acid (HCl) in the stomach provides this optimum pH for pepsin to break down proteins.'},
    {q:'What is the role of the gallbladder?',opts:['Produces bile','Stores and releases bile into the small intestine','Produces digestive enzymes','Absorbs nutrients'],ans:1,exp:'The GALLBLADDER is a small sac that STORES BILE produced by the liver. When fat enters the small intestine, the gallbladder releases bile into the duodenum to help digest the fats.'},
    {q:'Which of the following is NOT a function of hydrochloric acid (HCl) in the stomach?',opts:['Kills bacteria in food','Provides the optimum pH for pepsin','Denatures plant cell walls','Digests fats'],ans:3,exp:'HCl does NOT digest fats. Fats are digested by LIPASE in the small intestine. HCl creates an acidic pH for pepsin, kills bacteria, and helps denature proteins/cell walls.'},
    {q:'What is the lock and key theory of enzyme action?',opts:['Enzymes change shape after every reaction','The enzyme is the lock, and the substrate is the key','The enzyme is the key, and the substrate is the lock','Enzymes bind to all types of substrates'],ans:1,exp:'The LOCK AND KEY theory states that the enzyme\'s ACTIVE SITE (lock) has a specific shape that is complementary to the SUBSTRATE (key). Only the correct substrate can fit and bind to the active site.'},
    {q:'Which organ produces trypsin and lipase?',opts:['Liver','Gallbladder','Stomach','Pancreas'],ans:3,exp:'The PANCREAS produces pancreatic juice containing TRYPSIN (protease), LIPASE (fat-digesting enzyme), and AMYLASE (starch-digesting enzyme). These are released into the small intestine.'},
    {q:'Digested food molecules are absorbed into the blood via:',opts:['The stomach lining','The villi in the small intestine','The oesophagus','The large intestine'],ans:1,exp:'Absorption of nutrients (glucose, amino acids, fatty acids, glycerol) occurs primarily through the VILLI in the SMALL INTESTINE. These projections transfer the food into the blood or lymph.'},
    {q:'The human digestive system is an example of:',opts:['An organ','An organ system','A tissue','A cell'],ans:1,exp:'The digestive system is an ORGAN SYSTEM. It consists of multiple ORGANS (mouth, oesophagus, stomach, small intestine, large intestine, liver, pancreas) working together to break down food and absorb nutrients.'},
    {q:'What happens to excess glucose after absorption?',opts:['It is excreted in the faeces','It is stored as glycogen in the liver and muscles','It is converted into proteins','It is destroyed in the stomach'],ans:1,exp:'Excess glucose absorbed into the blood is stored as GLYCOGEN (a polysaccharide) in the LIVER and MUSCLES. This storage is controlled by the hormone insulin. When blood glucose is low, glycogen is broken back down into glucose.'},
  ],
  match:[
    {term:'Amylase',def:'Carbohydrase enzyme that breaks starch down into maltose (produced in salivary glands and pancreas)'},
    {term:'Protease',def:'Enzyme that breaks proteins down into amino acids (e.g., pepsin in stomach, trypsin in small intestine)'},
    {term:'Lipase',def:'Enzyme that breaks lipids (fats) down into fatty acids and glycerol (produced in the pancreas)'},
    {term:'Bile',def:'A digestive fluid produced by the liver that emulsifies fats to increase surface area for lipase'},
    {term:'Villi',def:'Finger-like projections in the small intestine that greatly increase the surface area for absorption'},
    {term:'Peristalsis',def:'Wave-like muscular contractions in the gut wall that push food along the alimentary canal'},
    {term:'Mouth',def:'The start of the digestive system; contains salivary glands that produce amylase to begin starch digestion'},
    {term:'Stomach',def:'A muscular sac that churns food; produces pepsin (protease) and hydrochloric acid (HCl) to break down proteins and kill bacteria'},
    {term:'Small intestine',def:'The main site of chemical digestion (enzymes) and absorption (villi) of nutrients'},
    {term:'Large intestine',def:'Absorbs water from undigested food, forming and storing faeces before excretion'},
    {term:'Liver',def:'Produces bile and stores glycogen; does not produce digestive enzymes directly'},
    {term:'Gallbladder',def:'Stores and concentrates bile produced by the liver, releasing it into the small intestine'},
    {term:'Pancreas',def:'Produces pancreatic juice containing amylase, trypsin (protease), and lipase'},
    {term:'Oesophagus',def:'Muscular tube connecting the mouth to the stomach; moves food via peristalsis'},
    {term:'Rectum',def:'The final section of the large intestine where faeces are stored before being excreted'},
    {term:'Anus',def:'The opening at the end of the digestive tract through which faeces are excreted'},
    {term:'Microvilli',def:'Tiny hair-like projections on the surface of villi that further increase surface area for absorption'},
    {term:'Lacteal',def:'A lymphatic vessel in the centre of a villus that absorbs fatty acids and glycerol'},
    {term:'Glycogen',def:'A storage form of glucose stored in the liver and muscles'},
    {term:'Chyme',def:'A semi-liquid mixture of partially digested food and digestive juices in the stomach and small intestine'},
  ],
  flashcards:[
    {q:'State the function of each of the main digestive enzymes: amylase, protease, and lipase.',a:'AMYLASE: breaks starch into maltose (maltase then breaks maltose to glucose). PROTEASE (e.g., pepsin, trypsin): breaks proteins into amino acids. LIPASE: breaks lipids (fats) into fatty acids and glycerol.'},
    {q:'Why must large food molecules be digested before they can be absorbed?',a:'Food molecules like starch, proteins, and fats are too LARGE and INSOLUBLE to cross the gut wall. Digestion breaks them down into small, SOLUBLE molecules (glucose, amino acids, fatty acids, glycerol) that can be absorbed into the bloodstream or lymph.'},
    {q:'Describe the structure of a villus and explain how it is adapted for absorption.',a:'A villus is a finger-like projection with: 1. A THIN WALL (one cell thick) — short diffusion distance. 2. A RICH CAPILLARY NETWORK — maintains a steep concentration gradient for quick uptake. 3. MICROVILLI — further increase surface area. 4. A LACTEAL (lymph vessel) — absorbs fatty acids and glycerol.'},
    {q:'What is the role of the large intestine?',a:'The LARGE INTESTINE (colon) absorbs WATER and some minerals from the undigested food material. It also FERMENTS some fibre via gut bacteria. The remaining solid waste (faeces) is stored in the rectum and excreted through the anus.'},
    {q:'What is the role of hydrochloric acid (HCl) in the stomach?',a:'HCl in the stomach has three main functions: 1. Creates an ACIDIC pH (pH 1.5-2) optimal for pepsin (protease) to work. 2. KILLS HARMFUL BACTERIA swallowed with food. 3. DENATURES proteins and breaks down plant cell walls to release nutrients.'},
    {q:'Describe the path that food takes through the digestive system in order.',a:'Mouth → Oesophagus (via peristalsis) → Stomach → Small intestine (duodenum, jejunum, ileum) → Large intestine (colon) → Rectum → Anus. Digestion starts in the mouth and is completed in the small intestine.'},
    {q:'Why is bile important for the digestion of fats, even though it is not an enzyme?',a:'Bile acts as an EMULSIFIER. It breaks large fat globules into tiny droplets, which INCREASES THE SURFACE AREA for the enzyme LIPASE to work on. This makes fat digestion much faster and more efficient.'},
    {q:'What is the "lock and key" hypothesis of enzyme action?',a:'The enzyme has an ACTIVE SITE with a specific 3D shape (the lock). The SUBSTRATE (the key) has a complementary shape. When the substrate binds to the active site, an enzyme-substrate complex is formed, allowing the reaction to occur.'},
    {q:'Where are the three main sites where amylase acts in the digestive system?',a:'1. MOUTH: Salivary amylase breaks starch into maltose. 2. PANCREAS: Pancreatic amylase is released into the small intestine to continue starch digestion. 3. SMALL INTESTINE: Brush border enzymes (maltase) complete the breakdown of maltose to glucose.'},
    {q:'Describe how the small intestine is adapted for both digestion and absorption.',a:'For DIGESTION: The pancreas and liver secrete digestive enzymes and bile into the small intestine. For ABSORPTION: The inner wall has VILLI with MICROVILLI, a thin epithelium (1 cell thick), a dense capillary network, and lacteals to efficiently absorb nutrients.'},
    {q:'Why do different enzymes work at different optimum pH levels?',a:'Enzymes have charged amino acids in their active sites. The pH affects the charge of these amino acids. If the pH is not optimal, the shape of the active site changes (denaturation), preventing the substrate from binding.'},
    {q:'Explain what happens to a protein molecule as it passes through the digestive system.',a:'In the STOMACH: Pepsin (protease) breaks proteins into smaller peptides. In the SMALL INTESTINE: Trypsin (protease) and other peptidases break the peptides down into individual AMINO ACIDS. These amino acids are then absorbed into the blood via the villi.'},
    {q:'What is the role of the pancreas in digestion?',a:'The PANCREAS produces PANCREATIC JUICE. This contains: 1. AMYLASE (starch digestion). 2. TRYPSIN (protein digestion). 3. LIPASE (fat digestion). These enzymes are released into the SMALL INTESTINE to complete the digestion of food.'},
    {q:'Explain why the stomach does not digest itself despite containing protease and HCl.',a:'The stomach lining is protected by a thick layer of MUCUS. This mucus prevents HCl and pepsin from damaging the stomach cells. Additionally, pepsin is secreted as an inactive form (pepsinogen) which is only activated by HCl.'},
    {q:'What are the main products of digestion of carbohydrates, proteins, and fats?',a:'Carbohydrates (e.g., starch) → GLUCOSE (and other monosaccharides). Proteins → AMINO ACIDS. Fats (lipids) → FATTY ACIDS and GLYCEROL. These are small, soluble molecules that can be absorbed through the villi.'},
    {q:'How does peristalsis ensure food moves in the correct direction?',a:'Peristalsis involves the contraction of muscles BEHIND the food bolus and relaxation of muscles AHEAD of it. This creates a wave-like motion that pushes food in one direction — from the oesophagus towards the anus.'},
    {q:'Why does chewing food thoroughly improve digestion?',a:'Chewing breaks food into smaller pieces, which INCREASES THE SURFACE AREA for enzymes to work on. It also mixes the food with SALIVA, containing AMYLASE, which begins starch digestion immediately.'},
    {q:'What is the difference between mechanical digestion and chemical digestion?',a:'MECHANICAL digestion is the physical breakdown of food (e.g., chewing in the mouth, churning in the stomach). CHEMICAL digestion is the breakdown of food by ENZYMES into smaller, absorbable molecules.'},
    {q:'Explain how the lacteal in a villus helps absorb fatty acids.',a:'The LACTEAL is a lymph vessel at the centre of the villus. Fatty acids and glycerol are absorbed into the lacteal rather than directly into blood capillaries. This is because fats are hydrophobic and do not dissolve easily in water-based blood plasma. They enter the lymph system and eventually the blood.'},
    {q:'Why does the rate of enzyme reaction decrease if the temperature is too high?',s:'High temperatures break the HYDROGEN BONDS holding the enzyme\'s 3D structure together. This changes the shape of the ACTIVE SITE permanently. The enzyme is DENATURED and the substrate can no longer bind, stopping the reaction.'},
  ],

  sentences:[
    {prompt:'Explain how the structure of a villus is perfectly adapted for its function of absorbing digested food.',keywords:['surface area','thin wall','capillaries','concentration gradient','microvilli','lacteal'],hint:'List the structural features of a villus and explain how each specific feature increases the speed and efficiency of absorption.'},

    {prompt:'Describe the journey of a protein molecule (e.g., from meat) as it is digested from the mouth to the small intestine.',keywords:['mouth','chewing','stomach','pepsin','acid','protein','amino acids','small intestine','protease'],hint:'Follow the protein through the main organs. Where is the first place it is chemically digested? What are the final products it is broken into?'},
    {prompt:'A student chews bread for a long time and notices it tastes sweeter. Explain this observation.',keywords:['amylase','starch','maltose','saliva','sweet','mouth','digestion'],hint:'What enzyme is present in saliva? What does it do to the starch in bread? What is the product of this digestion?'},
    {prompt:'Explain why enzymes are specific to their substrates, using the "lock and key" model.',keywords:['enzyme','substrate','active site','specific','shape','lock and key','complementary'],hint:'What happens if the substrate does not have the exact shape that fits into the enzyme\'s active site?'},

    {prompt:'Why is the small intestine considered the most important organ for digestion and absorption?',keywords:['small intestine','enzymes','villi','absorption','digestion','pancreas','bile'],hint:'What enzymes and secretions enter the small intestine? What structures are in the small intestine that help it take in nutrients?'},
    {prompt:'Explain the function of the lacteal in a villus.',keywords:['lacteal','villus','lymph','fatty acids','glycerol','absorption','fat'],hint:'Do fats dissolve in water? Why do fats enter the lymphatic system instead of the blood capillaries directly?'},
    {prompt:'Describe how peristalsis works to move food through the oesophagus.',keywords:['peristalsis','oesophagus','muscle','wave','contract','relax','bolus'],hint:'How do the circular and longitudinal muscles in the gut wall coordinate to push food downwards?'},
    {prompt:'What would happen to fat digestion if a person had their gallbladder removed?',keywords:['gallbladder','bile','fat','digestion','lipase','surface area','absorb'],hint:'The gallbladder stores bile. Without it, bile is released constantly but in smaller amounts. How would this affect the emulsification of fats?'},
    {prompt:'Explain the difference between mechanical digestion and chemical digestion, providing an example of each.',keywords:['mechanical','chewing','churning','chemical','enzymes','amylase','pepsin'],hint:'One is physical breakdown; the other is molecular breakdown.'},

    {prompt:'Explain what happens to the excess glucose that is absorbed into the blood after a meal.',keywords:['glucose','insulin','liver','glycogen','storage','blood sugar','homeostasis'],hint:'How does the body prevent blood sugar from getting too high? Where is the glucose stored?'},
    {prompt:'Why do athletes often eat carbohydrate-rich meals before a long race?',keywords:['carbohydrates','starch','glucose','glycogen','energy','muscles','respiration'],hint:'How does the body store carbohydrates, and how does this energy source help during prolonged exercise?'},
    {prompt:'Describe the three adaptations of the small intestine that make it efficient for absorption.',keywords:['villi','microvilli','surface area','thin wall','capillaries','blood supply','concentration gradient'],hint:'Think about the structure of the inner wall, the thickness of the cells, and the blood system.'},
    {prompt:'Explain why a high-fat meal stimulates the release of bile.',keywords:['bile','fat','gallbladder','small intestine','emulsification','lipase','digestion'],hint:'What triggers the gallbladder to contract and release bile? Why does the body need bile specifically for fats?'},
    {prompt:'State the product of digestion for carbohydrates, proteins, and fats, and explain why these products are needed by the body.',keywords:['glucose','energy','amino acids','proteins','fatty acids','glycerol','cell membranes','respiration'],hint:'What does the body use glucose for? What are amino acids used to build? What are fats used for?'},
