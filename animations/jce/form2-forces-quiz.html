<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Forces Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Forces & Motion — JCE Physics Quiz',
  color:'#1565c0',dark:'#003c8f',light:'#e3f2fd',
    mcq:[
    {q:'A force of 30 N acts on a 5 kg object. What is the acceleration?',opts:['150 m/s²','6 m/s²','25 m/s²','0.17 m/s²'],ans:1,exp:'a = F/m = 30/5 = 6 m/s²  (Newton\'s Second Law: F = ma).'},
    {q:'A car\'s velocity increases from 5 m/s to 25 m/s in 10 s. What is its acceleration?',opts:['2.5 m/s²','3 m/s²','2 m/s²','5 m/s²'],ans:2,exp:'a = (v-u)/t = (25-5)/10 = 20/10 = 2 m/s².'},
    {q:'Pressure = ?',opts:['Force × Area','Force / Area','Mass × Acceleration','Volume / Force'],ans:1,exp:'P = F/A. Pressure = Force ÷ Area. Unit: Pascal (Pa) = N/m². Same force over smaller area → greater pressure.'},
    {q:'Friction is USEFUL in which example?',opts:['A car engine','An oiled bicycle chain','Car brakes stopping a vehicle','A ball rolling on the ground for 10 km'],ans:2,exp:'FRICTION is useful in CAR BRAKES — friction between brake pads and disc converts kinetic energy to heat, slowing the car. Without friction, brakes wouldn\'t work.'},
    {q:'Terminal velocity occurs when:',opts:['The object stops moving','Weight equals air resistance (net force = 0)','Speed is maximum possible','Acceleration is maximum'],ans:1,exp:'TERMINAL VELOCITY: when WEIGHT (down) = AIR RESISTANCE/DRAG (up). Net force = 0, so acceleration = 0. The object falls at constant (maximum) speed.'},
    {q:'Which of the following is a scalar quantity?',opts:['Force','Velocity','Speed','Momentum'],ans:2,exp:'SPEED is a SCALAR quantity (magnitude only). Force, velocity, and momentum are VECTORS (they have both magnitude and direction).'},
    {q:'If the resultant force on an object is zero, the object:',opts:['Must be stationary','Must be moving at constant velocity','Is either stationary or moving at constant velocity','Must be accelerating'],ans:2,exp:'Newton\'s First Law: if the resultant (net) force is zero, the object will either stay at REST or continue moving at a CONSTANT VELOCITY. It cannot accelerate.'},
    {q:'What is the weight of a 50 kg person on Earth? (g = 10 N/kg)',opts:['5 N','50 N','500 N','5000 N'],ans:2,exp:'Weight = mass × gravitational field strength = 50 × 10 = 500 N. Weight is a force, measured in Newtons.'},
    {q:'A car travels 240 km in 3 hours. What is its average speed?',opts:['80 km/h','120 km/h','60 km/h','720 km/h'],ans:0,exp:'Average speed = distance / time = 240 km / 3 h = 80 km/h.'},
    {q:'What happens to the pressure if the force is doubled and the area is halved?',opts:['Pressure stays the same','Pressure doubles','Pressure quadruples (×4)','Pressure halves'],ans:2,exp:'Pressure = Force / Area. If F doubles (×2) and A halves (÷2), then P = (2F) / (0.5A) = 4 × (F/A). The pressure increases by a factor of 4.'},
    {q:'When a car is moving, the force that opposes its motion is:',opts:['Gravity','Air resistance and friction','Normal force','Centripetal force'],ans:1,exp:'AIR RESISTANCE (drag) and friction between the tyres and the road oppose the forward motion of the car. The engine must provide a force to overcome these to maintain speed.'},
    {q:'A cyclist accelerates from 2 m/s to 8 m/s in 3 seconds. What is their acceleration?',opts:['6 m/s²','3 m/s²','2 m/s²','0.5 m/s²'],ans:2,exp:'Acceleration = (v-u)/t = (8-2)/3 = 6/3 = 2 m/s².'},
    {q:'Which of the following is NOT a unit of pressure?',opts:['Pascal (Pa)','N/m²','Atmosphere (atm)','Newton (N)'],ans:3,exp:'The NEWTON (N) is the unit of FORCE. Pressure is force per unit area, measured in Pascals (Pa), N/m², or atmospheres (atm).'},
    {q:'Why do broad tyres on a tractor reduce the risk of sinking into soft soil?',opts:['They increase the weight of the tractor','They increase the surface area, reducing pressure on the soil','They decrease the friction','They decrease the force exerted'],ans:1,exp:'Broad tyres have a LARGER SURFACE AREA in contact with the soil. Since P = F/A, a larger area results in LOWER PRESSURE, preventing the tractor from sinking into soft mud.'},
    {q:'What is the acceleration of an object if it starts from rest and reaches 20 m/s in 4 seconds?',opts:['5 m/s²','80 m/s²','0.2 m/s²','10 m/s²'],ans:0,exp:'a = (v-u)/t = (20-0)/4 = 20/4 = 5 m/s².'},
    {q:'Friction is harmful in which of the following situations?',opts:['Shoes gripping the floor','Brakes stopping a car','A moving car engine generating unwanted heat','A pencil writing on paper'],ans:2,exp:'Friction in a car engine is HARMFUL because it causes wear on moving parts and generates excessive HEAT, which wastes energy. Engine oil is used to reduce this friction.'},
    {q:'The weight of an object on the Moon (g=1.6 N/kg) is 40 N. What is its mass?',opts:['25 kg','4 kg','64 kg','40 kg'],ans:0,exp:'Mass = Weight / g = 40 N / 1.6 N/kg = 25 kg. Mass is constant everywhere. On Earth, its weight would be 250 N (25 × 10).'},
    {q:'A 1000 kg car has a resultant force of 4000 N. What is its acceleration?',opts:['4 m/s²','0.25 m/s²','40 m/s²','2 m/s²'],ans:0,exp:'a = F/m = 4000/1000 = 4 m/s². This means the car increases its speed by 4 m/s every second.'},
    {q:'If an object is in equilibrium, which statement is true?',opts:['It is moving with constant acceleration','The net force acting on it is zero','It must be stationary','There are no forces acting on it'],ans:1,exp:'EQUILIBRIUM means the resultant (net) force is zero. The object is either at REST or moving at CONSTANT VELOCITY. It does NOT mean no forces act; it means the forces are balanced.'},
    {q:'When a skydiver opens their parachute, they:',opts:['Immediately stop falling','Decrease in acceleration and reach a new, lower terminal velocity','Fall faster','Experience zero gravity'],ans:1,exp:'Opening the parachute DRAMATICALLY increases air resistance (drag). The upward drag force becomes much greater than weight, causing a DECELERATION (negative acceleration) until a new, much lower terminal velocity is reached for a safe landing.'},
  ],
  match:[
    {term:'Newton\'s 1st Law',def:'An object remains at rest or moves at constant velocity unless acted upon by a resultant (net) force'},
    {term:'Newton\'s 2nd Law',def:'The resultant force on an object equals its mass times its acceleration (F = ma)'},
    {term:'Newton\'s 3rd Law',def:'For every action force, there is an equal and opposite reaction force acting on a different object'},
    {term:'Terminal velocity',def:'The constant maximum velocity reached when the upward drag force equals the downward weight force (net force = 0)'},
    {term:'Pressure',def:'The force exerted per unit area (P = F/A); measured in Pascals (Pa) or N/m²'},
    {term:'Friction',def:'A resistive force that opposes the relative motion between two surfaces in contact'},
    {term:'Speed',def:'The rate of change of distance; a scalar quantity (magnitude only)'},
    {term:'Velocity',def:'Speed in a given direction; a vector quantity (magnitude and direction)'},
    {term:'Acceleration',def:'The rate of change of velocity (a = Δv/t); measured in m/s²'},
    {term:'Weight',def:'The gravitational force acting on a mass (W = mg); measured in Newtons (N)'},
    {term:'Mass',def:'The amount of matter in an object; a scalar measured in kilograms (kg)'},
    {term:'Air resistance',def:'A drag force that opposes the motion of an object through the air'},
    {term:'Resultant force',def:'The single force that has the same effect as all the individual forces acting on an object'},
    {term:'Equilibrium',def:'A state where the resultant force on an object is zero; the object is stationary or moving at constant velocity'},
    {term:'Vector quantity',def:'A physical quantity that has both magnitude and direction (e.g., force, velocity, momentum)'},
    {term:'Scalar quantity',def:'A physical quantity that has only magnitude (e.g., speed, mass, distance, time)'},
    {term:'Average speed',def:'Total distance travelled divided by total time taken (s = d/t)'},
    {term:'Inertia',def:'The tendency of an object to resist any change in its state of motion'},
    {term:'Parachute',def:'A device that increases surface area to create high air resistance, reducing terminal velocity'},
    {term:'Normal force',def:'The force exerted by a surface perpendicular to the surface, supporting an object'},
  ],
  flashcards:[
    {q:'What is the difference between mass and weight?',a:'MASS is the amount of matter in an object (kg). It is a scalar and is CONSTANT everywhere in the universe. WEIGHT is the gravitational force acting on an object (N). It is a vector and varies with gravitational field strength (W = mg). On Earth g = 10 N/kg; on the Moon g = 1.6 N/kg.'},
    {q:'State the formula for speed and the formula for acceleration.',a:'SPEED = distance / time (s = d/t). Units are m/s or km/h.\nACCELERATION = change in velocity / time taken = (v - u) / t. Units are m/s².'},
    {q:'Explain what a distance-time graph shows.',a:'The GRADIENT (slope) of a distance-time graph represents SPEED. A horizontal line = stationary (zero speed). A straight line sloping upwards = constant speed. A curve getting steeper = accelerating. A curve getting flatter = decelerating.'},
    {q:'Calculate the pressure exerted by a 600 N person standing on one foot (area = 0.03 m²).',a:'P = F/A = 600 N / 0.03 m² = 20,000 Pa (20 kPa). This is a much higher pressure than standing on two feet.'},
    {q:'Explain why high-heeled shoes can dent wooden floors.',a:'A HIGH HEEL has a VERY SMALL surface area. Using P = F/A, the same force (weight of the person) divided by a tiny area results in an EXTREMELY HIGH PRESSURE. This high pressure is enough to permanently dent hardwood flooring.'},
    {q:'Describe the motion of a skydiver from jumping out of a plane to landing.',a:'1. Jumps: accelerates downwards (weight > air resistance). 2. Speed increases: air resistance increases until it equals weight → terminal velocity reached. 3. Parachute opens: air resistance increases drastically → decelerates. 4. New terminal velocity reached: much slower constant speed for safe landing.'},
    {q:'Explain why a car accelerates when the driver presses the accelerator pedal harder.',a:'Pressing the accelerator increases the forward force produced by the engine. Since F = ma, a larger force acting on a constant mass results in a GREATER ACCELERATION (assuming friction/drag remain relatively constant).'},
    {q:'What is the difference between speed and velocity?',a:'SPEED is a SCALAR: how fast an object moves, with only magnitude (e.g., 60 km/h). VELOCITY is a VECTOR: speed in a specified direction (e.g., 60 km/h due North). Velocity is required to describe motion fully.'},
    {q:'Why do tractor tyres have wide treads?',a:'Wide treads on tractor tyres have a LARGE SURFACE AREA. This reduces the PRESSURE exerted on the soft soil (P = F/A), preventing the tractor from sinking into the mud while working in fields.'},
    {q:'Calculate the force required to give a 1200 kg car an acceleration of 3 m/s².',a:'F = ma = 1200 kg × 3 m/s² = 3600 N. A force of 3600 Newtons is needed to produce this acceleration.'},
    {q:'Explain why a falling object reaches a terminal velocity.',a:'As the object falls, its speed increases, which causes AIR RESISTANCE (drag) to increase. Eventually, the upward drag force becomes EQUAL to the downward weight force. At this point, the net force is zero, so acceleration is zero, and the object falls at a constant (terminal) speed.'},
    {q:'Define inertia and give an example.',a:'INERTIA is the tendency of an object to resist any change in its state of motion. Example: When a bus suddenly stops, passengers lurch forward because their bodies have inertia and tend to keep moving forward.'},
    {q:'State Newton\'s Third Law of Motion and give an example.',a:'Newton\'s 3rd Law states: For every ACTION, there is an EQUAL and OPPOSITE REACTION. Example: A rocket pushes hot gases DOWN (action), and the gases push the rocket UP (reaction).'},
    {q:'What is the relationship between acceleration, force, and mass?',a:'Acceleration is directly proportional to the resultant force and inversely proportional to mass (a = F/m). A larger force gives greater acceleration; a larger mass reduces acceleration for the same force.'},
    {q:'Why is friction considered both useful and harmful?',a:'Friction is USEFUL (e.g., brakes stopping a car, shoes gripping the floor, writing on paper). It is HARMFUL (e.g., causes wear on engine parts, generates unwanted heat, reduces efficiency of machines).'},
    {q:'How does a parachute help a skydiver land safely?',a:'A parachute greatly INCREASES AIR RESISTANCE (drag) because of its large surface area. This increases the upward drag force, causing the skydiver to DECELERATE until a much slower, safe terminal velocity is reached.'},
    {q:'Calculate the acceleration of a 6 kg object acted upon by a resultant force of 24 N.',a:'a = F/m = 24 N / 6 kg = 4 m/s². The object will increase its velocity by 4 m/s every second.'},
    {q:'What is the difference between a balanced and an unbalanced force?',a:'BALANCED forces result in a net force of zero (equilibrium). The object is stationary or moving at constant velocity. UNBALANCED forces have a non-zero net force, causing the object to accelerate.'},
    {q:'Explain what happens to an object\'s acceleration if its mass is doubled while the force remains constant.',a:'According to a = F/m, if mass doubles (×2), the acceleration will HALVE (÷2) because mass and acceleration are inversely proportional. F = ma must remain balanced.'},
    {q:'Why does a high-speed car have to overcome significant air resistance?',a:'Air resistance (drag) increases with speed. At high speeds, the drag force becomes very large. The engine must provide a massive forward force to overcome this drag and maintain (or increase) speed.'},
  ],
  blanks:{
    passage:'Newton\'s second law states that force is equal to mass multiplied by [_] (F = ma). If the resultant net force on an object is [_], it will move at a constant velocity or remain at rest. Pressure is defined as force divided by [_], measured in Pascals. When a falling object reaches a constant maximum speed because air resistance equals weight, it is called [_] velocity. The resistive force that opposes sliding motion between surfaces is called [_].',
    answers:['acceleration','zero','area','terminal','friction'],
    wordbank:['acceleration','zero','area','terminal','friction','weight','momentum','volume'],
  },
  sentences:[
    {prompt:'Explain why a person wearing snowshoes can walk across deep, soft snow without sinking, whereas someone wearing normal shoes sinks into the snow.',keywords:['pressure','area','force','snowshoes','same weight','distributed','P=F/A'],hint:'How does the large surface area of snowshoes affect the pressure exerted on the snow compared to the small area of normal shoes?'},
    {prompt:'Describe the motion of a skydiver from the moment they jump out of a plane until they land safely on the ground, focusing on the forces and changes in velocity.',keywords:['accelerate','air resistance','drag','weight','terminal velocity','parachute','slow','land'],hint:'What forces act on the skydiver? How do they change as speed increases? What happens when the parachute is opened?'},
    {prompt:'State Newton\'s Third Law of Motion and use it to explain how a rocket is propelled upwards during launch.',keywords:['action','reaction','equal','opposite','gas','pushes','rocket','forward','exhaust'],hint:'What does the rocket engine push downwards (the action)? What pushes the rocket upwards (the reaction)? Do these forces act on the same object?'},
    {prompt:'Calculate the acceleration of a 1200 kg car if the engine provides a resultant forward force of 3600 N.',keywords:['F=ma','a=F/m','1200 kg','3600 N','3 m/s²','calculation'],hint:'Rearrange Newton\'s Second Law (F = ma) to solve for acceleration (a = F/m).'},
    {prompt:'Explain the difference between a scalar quantity and a vector quantity, giving two examples of each.',keywords:['scalar','magnitude','speed','distance','mass','time','vector','direction','force','velocity','momentum'],hint:'A scalar has only a number. A vector has a number AND a direction. List examples of each from your physics lessons.'},
    {prompt:'A car increases its speed from 10 m/s to 30 m/s in 5 seconds. Calculate its acceleration.',keywords:['v-u','30-10','20 m/s','5 s','a=20/5','4 m/s²','uniform acceleration'],hint:'Use the formula: Acceleration = (Final velocity - Initial velocity) / Time.'},
    {prompt:'Describe the purpose of a parachute in terms of forces and motion.',keywords:['parachute','air resistance','drag','surface area','slow down','terminal velocity','land safely'],hint:'How does the parachute change the forces acting on the skydiver? Why does it increase air resistance?'},
    {prompt:'A 70 kg person stands on the ground. Calculate their weight and the force the ground exerts on them. (g = 10 N/kg)',keywords:['weight','mass','70 kg','10 N/kg','700 N','Newton\'s 3rd Law','reaction force'],hint:'Weight = mass × g. According to Newton\'s 3rd Law, what force does the ground exert on the person?'},
    {prompt:'Explain how an airbag in a car helps reduce injury during a collision.',keywords:['airbag','force','time','impact','decelerate','cushion','injury'],hint:'How does an airbag increase the time taken for the driver to come to a stop? How does increasing this time affect the force experienced by the driver?'},
    {prompt:'State Newton\'s First Law of Motion and explain why a passenger lurches forwards when a bus suddenly stops.',keywords:['Newton\'s 1st Law','inertia','constant velocity','resist','change','lurch','forwards','stop'],hint:'What is the tendency of an object in motion? How does the passenger\'s body react when the bus stops abruptly?'},
    {prompt:'Explain why pressure increases when a force is applied over a smaller area.',keywords:['pressure','force','area','increases','smaller','P=F/A','inverse'],hint:'Look at the formula P = F/A. If the denominator (A) becomes smaller, what happens to the result of the division?'},
    {prompt:'Calculate the average speed of a cyclist who travels 45 km in 1.5 hours.',keywords:['average speed','distance','time','45 km','1.5 h','30 km/h','s=d/t'],hint:'Use the formula: Average speed = Total distance / Total time.'},
    {prompt:'Describe how an object reaches terminal velocity when falling through air.',keywords:['weight','drag','air resistance','acceleration','velocity','balance','terminal'],hint:'What happens to the drag force as the object\'s speed increases? When do the upward and downward forces become equal?'},
    {prompt:'Explain why friction is essential for walking.',keywords:['friction','walking','force','push','ground','forward','grip','slip'],hint:'What would happen to your feet if there were no friction between your shoes and the ground?'},
    {prompt:'A force of 15 N acts on a 3 kg object. What is its acceleration?',keywords:['F=ma','a=F/m','15 N','3 kg','5 m/s²','calculation'],hint:'Rearrange F = ma to solve for a.'},
    {prompt:'Explain the term "net force" or "resultant force".',keywords:['net force','resultant','vector sum','forces','add','direction','acceleration'],hint:'What do you get when you add all the forces acting on an object, taking their directions into account?'},
    {prompt:'Compare the terminal velocity of a feather and a stone falling from the same height.',keywords:['terminal velocity','feather','stone','air resistance','mass','weight','surface area'],hint:'Which object has more air resistance? Which object has a higher terminal velocity, and why?'},
    {prompt:'Explain why it is easier to cut with a sharp knife than with a blunt knife.',keywords:['pressure','force','area','sharp blade','blunt knife','P=F/A','cut'],hint:'How does the sharp edge affect the area over which the force is applied? How does this affect the pressure?'},
    {prompt:'Calculate the force required to accelerate a 1500 kg car at 2 m/s².',keywords:['F=ma','1500 kg','2 m/s²','3000 N','force','acceleration'],hint:'Use Newton\'s Second Law: F = m × a.'},
    {prompt:'State two ways to reduce friction in moving parts of a machine.',keywords:['friction','reduce','lubricants','oil','smooth surfaces','bearings','ball bearings','less wear'],hint:'What physical substances can be added between moving parts? What can be done to the surfaces themselves?'},
  ],
});
</script></body></html>
