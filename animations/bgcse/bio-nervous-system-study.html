</head><body>

<script>
function bg(sk,c){sk.background(...(c||[18,22,35]))}

const STEPS=[
  {
    title:'Neuron Structure',
    body:`A <strong>neuron (nerve cell)</strong> is specialised to carry electrical impulses.
    <br><br>Key parts:
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li><strong>Cell body</strong> — contains nucleus, controls the cell</li>
      <li><strong>Dendrites</strong> — short branches that receive impulses</li>
      <li><strong>Axon</strong> — long fibre that carries impulses away</li>
      <li><strong>Myelin sheath</strong> — fatty insulation that speeds up conduction</li>
      <li><strong>Node of Ranvier</strong> — gaps in myelin, impulse jumps between them</li>
      <li><strong>Synaptic knob</strong> — releases neurotransmitter at the end</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height;
      const cx=W/2,cy=H/2;
      // Axon line
      sk.stroke(100,180,255);sk.strokeWeight(3);sk.noFill();
      sk.line(cx-W*0.35,cy,cx+W*0.35,cy);
      // Myelin segments
      const n=7;
      for(let i=0;i<n;i++){
        const x=cx-W*0.35+(i/n)*W*0.7+W*0.7/n*0.1;
        const w=W*0.7/n*0.7;
        sk.fill(255,220,100,160);sk.noStroke();
        sk.rect(x,cy-12,w,24,4);
      }
      // Nodes (gaps)
      for(let i=1;i<n;i++){
        const x=cx-W*0.35+(i/n)*W*0.7-2;
        sk.fill(18,22,35);sk.noStroke();sk.rect(x,cy-10,4,20);
        sk.fill(255,255,255,80);sk.textSize(7);sk.textAlign(sk.CENTER);
        sk.text('Node',x+2,cy+22);
      }
      // Cell body
      sk.fill(100,180,255,200);sk.noStroke();
      sk.circle(cx-W*0.38,cy,36);
      sk.fill(255);sk.textSize(9);sk.textAlign(sk.CENTER,sk.CENTER);
      sk.text('Cell\nbody',cx-W*0.38,cy);
      // Dendrites
      sk.stroke(100,180,255,180);sk.strokeWeight(1.5);
      for(let i=-2;i<=2;i++){
        sk.line(cx-W*0.38,cy,cx-W*0.38-20,cy+i*18);
      }
      // Synaptic knob
      sk.fill(231,76,60,200);sk.noStroke();
      sk.circle(cx+W*0.37,cy,22);
      sk.fill(255);sk.textSize(8);sk.textAlign(sk.CENTER,sk.CENTER);
      sk.text('Knob',cx+W*0.37,cy);
      // Labels
      sk.fill(255,220,100);sk.textSize(10);sk.textAlign(sk.CENTER);
      sk.text('Myelin Sheath',cx,cy-28);
      sk.fill(100,180,255);sk.text('Axon',cx,cy+38);
    }
  },
  {
    q:'Neuron Labeled Diagram',
    content:`<h3>Motor Neuron Labeled Diagram</h3><p>Study this diagram carefully. A neuron (nerve cell) is specialised to carry electrical impulses rapidly. The motor neuron shown here carries impulses away from the central nervous system to effectors such as muscles. You need to know the names and functions of all labeled structures for BGCSE.</p><ul><li><strong>Dendrites</strong> — short branches that receive incoming impulses from other neurons and pass them to the cell body</li><li><strong>Cell body (with nucleus)</strong> — contains the nucleus and controls the cell's metabolism</li><li><strong>Axon</strong> — the long fibre that carries the impulse away from the cell body towards the synaptic knob</li><li><strong>Myelin sheath</strong> — fatty insulating layers that speed up conduction; gaps between segments are called Nodes of Ranvier, where the impulse jumps (saltatory conduction)</li><li><strong>Synaptic knob</strong> — contains vesicles of neurotransmitter that are released into the synapse</li></ul>`,
    visual:`<svg viewBox="0 0 420 230" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c62828"/></marker></defs>
  <rect width="420" height="230" fill="#ffebee" rx="8"/>
  <text x="210" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">Motor Neuron — Labeled Diagram</text>
  <!-- Dendrites -->
  <line x1="30" y1="95" x2="62" y2="110" stroke="#c62828" stroke-width="2"/>
  <line x1="30" y1="115" x2="62" y2="115" stroke="#c62828" stroke-width="2"/>
  <line x1="30" y1="135" x2="62" y2="120" stroke="#c62828" stroke-width="2"/>
  <!-- Cell body -->
  <ellipse cx="80" cy="115" rx="22" ry="26" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/>
  <circle cx="80" cy="112" r="8" fill="#c62828"/>
  <text x="80" y="115" text-anchor="middle" font-size="7" fill="#fff">N</text>
  <!-- Axon hillock -->
  <path d="M 100 115 L 116 115" stroke="#c62828" stroke-width="4" fill="none"/>
  <!-- Myelin segments -->
  <rect x="116" y="107" width="24" height="16" rx="4" fill="#ffe082" stroke="#f9a825" stroke-width="1"/>
  <rect x="148" y="107" width="24" height="16" rx="4" fill="#ffe082" stroke="#f9a825" stroke-width="1"/>
  <rect x="180" y="107" width="24" height="16" rx="4" fill="#ffe082" stroke="#f9a825" stroke-width="1"/>
  <rect x="212" y="107" width="24" height="16" rx="4" fill="#ffe082" stroke="#f9a825" stroke-width="1"/>
  <rect x="244" y="107" width="24" height="16" rx="4" fill="#ffe082" stroke="#f9a825" stroke-width="1"/>
  <rect x="276" y="107" width="24" height="16" rx="4" fill="#ffe082" stroke="#f9a825" stroke-width="1"/>
  <!-- Axon in gaps -->
  <line x1="140" y1="115" x2="148" y2="115" stroke="#c62828" stroke-width="3"/>
  <line x1="172" y1="115" x2="180" y2="115" stroke="#c62828" stroke-width="3"/>
  <line x1="204" y1="115" x2="212" y2="115" stroke="#c62828" stroke-width="3"/>
  <line x1="236" y1="115" x2="244" y2="115" stroke="#c62828" stroke-width="3"/>
  <line x1="268" y1="115" x2="276" y2="115" stroke="#c62828" stroke-width="3"/>
  <line x1="300" y1="115" x2="310" y2="115" stroke="#c62828" stroke-width="3"/>
  <!-- Synaptic knob -->
  <circle cx="325" cy="115" r="15" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/>
  <!-- Labels -->
  <text x="22" y="80" text-anchor="middle" font-size="9" fill="#c62828" font-weight="bold">Dendrites</text>
  <line x1="30" y1="84" x2="30" y2="93" stroke="#c62828" stroke-width="1" marker-end="url(#arr)"/>
  <text x="80" y="152" text-anchor="middle" font-size="9" fill="#c62828" font-weight="bold">Cell body</text>
  <text x="80" y="163" text-anchor="middle" font-size="8" fill="#555">(nucleus inside)</text>
  <text x="200" y="90" text-anchor="middle" font-size="9" fill="#f9a825" font-weight="bold">Myelin sheath</text>
  <text x="142" y="100" text-anchor="middle" font-size="8" fill="#333">Node of Ranvier</text>
  <line x1="142" y1="103" x2="142" y2="108" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>
  <text x="325" y="142" text-anchor="middle" font-size="9" fill="#c62828" font-weight="bold">Synaptic</text>
  <text x="325" y="153" text-anchor="middle" font-size="9" fill="#c62828" font-weight="bold">knob</text>
  <!-- Direction arrow -->
  <line x1="340" y1="115" x2="395" y2="115" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="370" y="108" text-anchor="middle" font-size="9" fill="#333">Impulse</text>
  <!-- Axon label -->
  <text x="200" y="200" text-anchor="middle" font-size="9" fill="#c62828">Axon (carries impulse AWAY from cell body)</text>
  <line x1="200" y1="195" x2="200" y2="122" stroke="#c62828" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>
</svg>`
  },
  {
    q:'Reflex Arc Diagram',
    content:`<h3>Reflex Arc Diagram</h3><p>Study this diagram carefully. A reflex arc is the pathway of a reflex action — an automatic, rapid response to a stimulus that does NOT require conscious thought. The spinal cord coordinates the response directly, allowing it to happen before the brain is even aware of the stimulus. This is why you pull your hand away from something hot before you consciously feel pain.</p><ul><li><strong>Step 1 — Stimulus and receptor:</strong> a pain or heat stimulus is detected by a receptor in the skin</li><li><strong>Step 2 — Sensory neuron:</strong> carries the impulse from the receptor to the spinal cord (CNS)</li><li><strong>Step 3 — Relay neuron:</strong> in the spinal cord, connects the sensory and motor pathways</li><li><strong>Step 4 — Motor neuron:</strong> carries the impulse from the spinal cord to the effector</li><li><strong>Step 5 — Effector (muscle):</strong> contracts to produce the protective response; the brain is informed via a separate pathway after the action has already occurred</li></ul>`,
    visual:`<svg viewBox="0 0 420 270" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c62828"/></marker></defs>
  <rect width="420" height="270" fill="#ffebee" rx="8"/>
  <text x="210" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">Reflex Arc — Pathway of a Reflex</text>
  <!-- Spinal cord in centre -->
  <ellipse cx="210" cy="135" rx="28" ry="50" fill="#ce93d8" stroke="#6a1b9a" stroke-width="2"/>
  <text x="210" y="130" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">Spinal</text>
  <text x="210" y="143" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">cord</text>
  <text x="210" y="156" text-anchor="middle" font-size="8" fill="#e1bee7">(relay)</text>
  <!-- Receptor -->
  <rect x="15" y="90" width="80" height="38" rx="6" fill="#fff" stroke="#c62828" stroke-width="1.5"/>
  <text x="55" y="106" text-anchor="middle" font-size="10" fill="#c62828" font-weight="bold">RECEPTOR</text>
  <text x="55" y="120" text-anchor="middle" font-size="9" fill="#555">e.g. skin/pain</text>
  <!-- Effector -->
  <rect x="15" y="170" width="80" height="38" rx="6" fill="#fff" stroke="#c62828" stroke-width="1.5"/>
  <text x="55" y="186" text-anchor="middle" font-size="10" fill="#c62828" font-weight="bold">EFFECTOR</text>
  <text x="55" y="200" text-anchor="middle" font-size="9" fill="#555">e.g. muscle</text>
  <!-- Brain -->
  <ellipse cx="340" cy="100" rx="55" ry="35" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="340" y="96" text-anchor="middle" font-size="10" fill="#f9a825" font-weight="bold">BRAIN</text>
  <text x="340" y="110" text-anchor="middle" font-size="8" fill="#555">(conscious awareness</text>
  <text x="340" y="121" text-anchor="middle" font-size="8" fill="#555">— informed after!)</text>
  <!-- Sensory neuron path -->
  <path d="M 95 100 Q 150 80 182 100" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="138" y="78" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="bold">Sensory neuron</text>
  <!-- Motor neuron path -->
  <path d="M 182 165 Q 150 178 95 188" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr)"/>
  <text x="138" y="193" text-anchor="middle" font-size="9" fill="#2e7d32" font-weight="bold">Motor neuron</text>
  <!-- Brain connection -->
  <line x1="238" y1="107" x2="284" y2="100" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="260" y="94" text-anchor="middle" font-size="8" fill="#f9a825">impulse to brain</text>
  <!-- Stimulus -->
  <text x="55" y="73" text-anchor="middle" font-size="10" fill="#e53935" font-weight="bold">STIMULUS</text>
  <text x="55" y="87" text-anchor="middle" font-size="9" fill="#555">(e.g. heat/pain)</text>
  <!-- Flame icon -->
  <text x="20" y="58" font-size="18">🔥</text>
  <line x1="35" y1="60" x2="45" y2="75" stroke="#e53935" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Step numbers -->
  <circle cx="95" cy="85" r="9" fill="#c62828"/>
  <text x="95" y="89" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">1</text>
  <circle cx="183" cy="105" r="9" fill="#c62828"/>
  <text x="183" y="109" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">2</text>
  <circle cx="210" cy="135" r="9" fill="#c62828"/>
  <text x="210" y="139" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">3</text>
  <circle cx="183" cy="162" r="9" fill="#c62828"/>
  <text x="183" y="166" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">4</text>
  <circle cx="95" cy="175" r="9" fill="#c62828"/>
  <text x="95" y="179" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">5</text>
  <!-- Bottom note -->
  <text x="210" y="252" text-anchor="middle" font-size="10" fill="#333" font-style="italic">Response occurs BEFORE brain is aware — very fast!</text>
</svg>`
  },
  {
    title:'Types of Neurons',
    body:`There are three main types of neurons:
    <br><br>
    <strong>1. Sensory neuron</strong> — carries impulses FROM receptors (sense organs) TO the spinal cord/brain.
    <br><br>
    <strong>2. Relay neuron (interneuron)</strong> — found in the brain and spinal cord; connects sensory to motor neurons.
    <br><br>
    <strong>3. Motor neuron</strong> — carries impulses FROM the brain/spinal cord TO effectors (muscles/glands).
    <br><br>
    Memory tip: <em>Sensory → Relay → Motor → Effector</em>`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height;
      const types=[
        {label:'Receptor\n(skin/eye)',x:0.1,y:0.5,c:[241,196,15]},
        {label:'Sensory\nNeuron',x:0.3,y:0.5,c:[52,152,219]},
        {label:'Relay\nNeuron',x:0.5,y:0.5,c:[155,89,182]},
        {label:'Motor\nNeuron',x:0.7,y:0.5,c:[46,204,113]},
        {label:'Effector\n(muscle)',x:0.9,y:0.5,c:[231,76,60]},
      ];
      const t=sk.frameCount*0.02;
      // Draw arrows between nodes
      types.forEach((n,i)=>{
        if(i<types.length-1){
          const next=types[i+1];
          sk.stroke(255,255,255,60);sk.strokeWeight(2);sk.noFill();
          sk.line(n.x*W+28,n.y*H,next.x*W-28,next.y*H);
          // Moving pulse
          const p=(t*0.5+i*0.2)%1;
          sk.fill(255,255,100,200);sk.noStroke();
          sk.circle(sk.lerp(n.x*W+28,next.x*W-28,p),n.y*H,8);
        }
        const pulse=1+Math.sin(t*2+i)*0.06;
        sk.fill(...n.c,50);sk.noStroke();sk.ellipse(n.x*W,n.y*H,70*pulse,50*pulse);
        sk.fill(...n.c);sk.ellipse(n.x*W,n.y*H,56,42);
        sk.fill(255);sk.textSize(9);sk.textAlign(sk.CENTER,sk.CENTER);sk.text(n.label,n.x*W,n.y*H);
      });
    }
  },
  {
    title:'The Synapse — Passing the Message',
    body:`A <strong>synapse</strong> is a tiny gap between two neurons. Electrical impulses <em>cannot</em> jump across — instead:
    <ol style="margin:8px 0 0 18px;line-height:2">
      <li>Impulse reaches synaptic knob</li>
      <li>Vesicles release <strong>neurotransmitter</strong> (e.g. acetylcholine) into the gap</li>
      <li>Neurotransmitter diffuses across and binds to receptors on the next neuron</li>
      <li>New impulse is triggered in the next neuron</li>
      <li>Neurotransmitter is broken down by enzymes (prevents continuous firing)</li>
    </ol>`,
    draw:(sk)=>{
      bg(sk,[15,20,30]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.03;
      const gx=W/2;
      // Pre-synaptic
      sk.fill(52,152,219,180);sk.noStroke();sk.rect(0,H*0.2,gx-20,H*0.6,0,0,0,0);
      // Post-synaptic
      sk.fill(46,204,113,180);sk.rect(gx+20,H*0.2,W-gx-20,H*0.6,0,0,0,0);
      // Gap
      sk.fill(18,22,35);sk.rect(gx-20,0,40,H);
      sk.fill(255,255,255,30);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('Synaptic\ngap',gx,H*0.5);
      // Vesicles
      for(let i=0;i<5;i++){
        const ang=t+i*sk.TWO_PI/5;
        const vx=gx-40+Math.cos(ang)*25;
        const vy=H*0.5+Math.sin(ang)*30;
        sk.fill(241,196,15,200);sk.noStroke();sk.circle(vx,vy,12);
      }
      // Neurotransmitter molecules crossing
      for(let i=0;i<4;i++){
        const prog=((t*0.5+i*0.25)%1);
        const mx=sk.lerp(gx-18,gx+18,prog);
        sk.fill(255,200,50,220);sk.noStroke();sk.circle(mx,H*0.35+i*H*0.08,8);
      }
      // Labels
      sk.fill(52,152,219);sk.textSize(10);sk.textAlign(sk.LEFT);sk.text('Pre-synaptic\nneuron',8,H*0.88);
      sk.fill(46,204,113);sk.textAlign(sk.RIGHT);sk.text('Post-synaptic\nneuron',W-8,H*0.88);
      sk.fill(241,196,15);sk.textSize(9);sk.textAlign(sk.CENTER);sk.text('Neurotransmitter',gx,H*0.12);
    }
  },
  {
    q:'Synapse Diagram — Vesicles & Receptors',
    content:`<h3>The Synapse Diagram</h3><p>Study this diagram carefully. A synapse is a tiny gap (about 20 nm wide) between two neurons. Electrical impulses cannot jump across this gap — instead, the signal is transmitted chemically by neurotransmitter molecules. Understanding this diagram is essential for explaining how nerve signals travel between neurons.</p><ul><li><strong>Synaptic vesicles:</strong> membrane-bound sacs in the pre-synaptic neuron that contain neurotransmitter molecules (e.g. acetylcholine)</li><li><strong>Synaptic cleft:</strong> the 20 nm gap between the two neurons across which neurotransmitters diffuse</li><li><strong>Receptor proteins:</strong> on the post-synaptic membrane; neurotransmitter binds here to trigger a new electrical impulse in the next neuron</li><li><strong>After the signal:</strong> enzymes in the synaptic cleft break down the neurotransmitter to prevent continuous stimulation; the products are reabsorbed into the pre-synaptic neuron for recycling</li></ul>`,
    visual:`<svg viewBox="0 0 420 280" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c62828"/></marker></defs>
  <rect width="420" height="280" fill="#ffebee" rx="8"/>
  <text x="210" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">The Synapse</text>
  <!-- Pre-synaptic terminal -->
  <rect x="20" y="40" width="160" height="130" rx="8" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="100" y="60" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="bold">Pre-synaptic neuron</text>
  <!-- Vesicles -->
  <circle cx="65" cy="100" r="16" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="65" y="104" text-anchor="middle" font-size="8" fill="#333">vesicle</text>
  <circle cx="105" cy="110" r="16" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="105" y="114" text-anchor="middle" font-size="8" fill="#333">vesicle</text>
  <circle cx="85" cy="80" r="12" fill="#fff9c4" stroke="#f9a825" stroke-width="1.2"/>
  <circle cx="135" cy="90" r="14" fill="#fff9c4" stroke="#f9a825" stroke-width="1.2"/>
  <!-- Fusing vesicle releasing NT -->
  <circle cx="155" cy="130" r="10" fill="#ffe082" stroke="#f9a825" stroke-width="1.5"/>
  <text x="155" y="133" text-anchor="middle" font-size="7" fill="#333">NT</text>
  <!-- Synaptic cleft -->
  <rect x="180" y="40" width="60" height="200" fill="#ffebee" stroke="none"/>
  <text x="210" y="150" text-anchor="middle" font-size="9" fill="#c62828" font-weight="bold">Synaptic</text>
  <text x="210" y="163" text-anchor="middle" font-size="9" fill="#c62828" font-weight="bold">cleft</text>
  <text x="210" y="176" text-anchor="middle" font-size="8" fill="#555">(20 nm gap)</text>
  <line x1="180" y1="40" x2="180" y2="240" stroke="#c62828" stroke-width="1.5"/>
  <line x1="240" y1="40" x2="240" y2="240" stroke="#c62828" stroke-width="1.5"/>
  <!-- Neurotransmitter molecules in cleft -->
  <circle cx="196" cy="100" r="6" fill="#c62828"/>
  <circle cx="214" cy="130" r="6" fill="#c62828"/>
  <circle cx="203" cy="160" r="6" fill="#c62828"/>
  <circle cx="220" cy="90" r="6" fill="#c62828"/>
  <!-- Post-synaptic neuron -->
  <rect x="240" y="40" width="160" height="200" rx="8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="320" y="60" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="bold">Post-synaptic neuron</text>
  <!-- Receptor proteins -->
  <rect x="244" y="85" width="22" height="30" rx="4" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="255" y="104" text-anchor="middle" font-size="7" fill="#333">R</text>
  <rect x="244" y="125" width="22" height="30" rx="4" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="255" y="144" text-anchor="middle" font-size="7" fill="#333">R</text>
  <rect x="244" y="165" width="22" height="30" rx="4" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="255" y="184" text-anchor="middle" font-size="7" fill="#333">R</text>
  <!-- NT binding to receptor -->
  <circle cx="251" cy="157" r="6" fill="#c62828"/>
  <!-- Labels -->

  {
    title:'The Reflex Arc — Fast & Automatic',
    body:`A <strong>reflex</strong> is an automatic, rapid response to a stimulus that does NOT require conscious thought.
    <br><br>
    The reflex arc pathway: <strong>Receptor → Sensory → Relay → Motor → Effector</strong>
    <br><br>
    The spinal cord coordinates the response — the brain is informed <em>after</em> the action. This is why you pull your hand away from heat before you feel pain.
    <br><br>
    Reflexes protect the body from harm and are vital for survival.`,
    draw:(sk)=>{
      bg(sk,[15,15,25]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.04;
      // Spinal cord
      sk.fill(155,89,182,180);sk.noStroke();sk.rect(W/2-15,0,30,H);
      sk.fill(255);sk.textSize(9);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('Spinal\nCord',W/2,H/2);

      sk.fill(231,76,60);sk.noStroke();sk.textSize(24);sk.textAlign(sk.CENTER);sk.text('🔥',W*0.12,H*0.6);
      // Hand
      sk.textSize(22);sk.text('✋',W*0.12,H*0.38);
      // Arrows for reflex arc
      const pulse=(t*0.4)%1;
      const path=[
        {x:W*0.18,y:H*0.5},{x:W/2-15,y:H*0.4},{x:W/2+15,y:H*0.45},{x:W*0.82,y:H*0.5},
      ];
      for(let i=0;i<path.length-1;i++){
        sk.stroke(255,200,50,100);sk.strokeWeight(1.5);sk.noFill();
        sk.line(path[i].x,path[i].y,path[i+1].x,path[i+1].y);
      }
      // Moving pulse
      const seg=Math.floor(pulse*(path.length-1));
      const frac=pulse*(path.length-1)-seg;
      if(seg<path.length-1){
        const px=sk.lerp(path[seg].x,path[seg+1].x,frac);
        const py=sk.lerp(path[seg].y,path[seg+1].y,frac);
        sk.fill(255,200,50,220);sk.noStroke();sk.circle(px,py,10);
      }
      // Labels
      sk.fill(255,200,50);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('→ Sensory',W*0.3,H*0.32);
      sk.text('Motor →',W*0.68,H*0.38);

      sk.fill(255);sk.textSize(8);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('Muscle',W*0.85,H*0.5);
    }
