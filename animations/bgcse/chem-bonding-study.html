<script>
function bg(sk,c){sk.background(...(c||[12,14,22]))}

const STEPS=[
  {
    title:'Why Atoms Form Bonds',
    body:`Atoms bond to achieve a <strong>full outer shell</strong> — the stable noble gas configuration.
    <br><br>
    There are three main types of chemical bonding:
    <ol style="margin:8px 0 0 18px;line-height:2.2">
      <li><strong>Ionic bonding</strong> — transfer of electrons (metal + non-metal)</li>
      <li><strong>Covalent bonding</strong> — sharing of electrons (non-metal + non-metal)</li>
      <li><strong>Metallic bonding</strong> — sea of delocalised electrons (metal + metal)</li>
    </ol>
    The type of bond formed depends on the <em>electronegativity difference</em> between the atoms.`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      const types=[
        {n:'Ionic',c:[231,76,60],icon:'Na⁺Cl⁻',x:0.2},
        {n:'Covalent',c:[52,152,219],icon:'H:H',x:0.5},
        {n:'Metallic',c:[241,196,15],icon:'e⁻ sea',x:0.8},
      ];
      types.forEach((tp,i)=>{
        const pulse=1+Math.sin(t*1.5+i*1.3)*0.07;
        const cx=tp.x*W,cy=H*0.5;
        sk.fill(...tp.c,40);sk.noStroke();sk.ellipse(cx,cy,120*pulse,90*pulse);
        sk.fill(...tp.c);sk.ellipse(cx,cy,100,76);
        sk.fill(255);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER,sk.CENTER);
        sk.text(tp.n,cx,cy-14);sk.textStyle(sk.NORMAL);
        sk.fill(255,255,255,180);sk.textSize(13);sk.text(tp.icon,cx,cy+8);
        // Bond type tag
        const tags=['Metal+Non-metal','Non-metal+Non-metal','Metal+Metal'];
        sk.fill(255,255,255,70);sk.textSize(8);sk.text(tags[i],cx,cy+28);
      });
    }
  },
  {
    title:'Ionic Bonding — Electron Transfer',
    body:`<strong>Ionic bonds</strong> form when a metal <em>transfers</em> electrons to a non-metal.
    <br><br>
    Example — Sodium chloride (NaCl):
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li>Na (2,8,1) <strong>loses</strong> 1 electron → becomes Na⁺ (2,8)</li>
      <li>Cl (2,8,7) <strong>gains</strong> 1 electron → becomes Cl⁻ (2,8,8)</li>
      <li>Opposite charges attract — forming the ionic bond</li>
    </ul>
    Ionic compounds form a <strong>giant ionic lattice</strong> — regular arrangement of alternating + and − ions.
    <br><br>
    Properties: high melting point, conducts electricity when dissolved or melted.`,
    draw:(sk)=>{
      bg(sk,[15,12,22]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      const cx=W/2,cy=H*0.42;
      // Na atom - losing electron
      sk.fill(231,76,60,180);sk.noStroke();sk.circle(W*0.22,cy,52);
      sk.fill(255);sk.textSize(11);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('Na',W*0.22,cy-5);
      // Valence electron moving
      const eProgress=Math.min(1,(Math.sin(t)+1)/2);
      const ex=sk.lerp(W*0.22+30,W*0.78-30,eProgress);
      sk.fill(255,220,50,200);sk.noStroke();sk.circle(ex,cy-20,10);
      sk.fill(255,220,50);sk.textSize(8);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('e⁻',ex,cy-20);
      // Cl atom - gaining electron
      sk.fill(52,152,219,180);sk.noStroke();sk.circle(W*0.78,cy,52);
      sk.fill(255);sk.textSize(11);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('Cl',W*0.78,cy-5);
      // Result ions
      const done=Math.sin(t)>0;
      if(done){
        sk.fill(255,220,50);sk.textSize(10);sk.textAlign(sk.CENTER);
        sk.text('Na⁺',W*0.22,cy+38);sk.text('Cl⁻',W*0.78,cy+38);
        sk.fill(231,76,60,120);sk.noStroke();
        for(let dx=-2;dx<=2;dx++)for(let dy=-1;dy<=1;dy++){
          const ix=W*0.3+dx*32,iy=H*0.82+dy*22;
          sk.fill(dx%2===dy%2?[231,76,60,160]:[52,152,219,160]);
          sk.circle(ix,iy,18);
        }
        sk.fill(255);sk.textSize(8);sk.textAlign(sk.CENTER);sk.text('Giant ionic lattice',W*0.3,H*0.97);
      }
      // Labels
      sk.fill(231,76,60);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('2,8,1 → 2,8 (Na⁺)',W*0.22,H*0.66);
      sk.fill(52,152,219);sk.text('2,8,7 → 2,8,8 (Cl⁻)',W*0.78,H*0.66);
    }
  },
  {
    q:'Ionic Bond Formation — Na→Na⁺ and Cl→Cl⁻',
    content:`<h3>Ionic Bond Formation — NaCl</h3><p>Ionic bonds form when a metal atom transfers one or more electrons to a non-metal atom. In sodium chloride, sodium loses its single outer electron to chlorine, and the resulting oppositely charged ions attract each other strongly.</p><ul><li>Na (2,8,1) loses 1 electron → Na⁺ (2,8) — achieves full outer shell</li><li>Cl (2,8,7) gains 1 electron → Cl⁻ (2,8,8) — achieves full outer shell</li><li>The Na⁺ and Cl⁻ ions pack together in a giant ionic lattice held by strong electrostatic forces — explaining the high melting point of NaCl</li></ul>`,
    visual:`<svg viewBox="0 0 420 290" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">

  <circle cx="340" cy="110" r="10" fill="#1565c0"/>

  <!-- Cl electrons: Shell 1(2), Shell 2(8), Shell 3(7) -->
  <circle cx="340" cy="99" r="4" fill="#1565c0"/><circle cx="340" cy="121" r="4" fill="#1565c0"/>
  <circle cx="340" cy="84" r="4" fill="#1565c0"/><circle cx="340" cy="136" r="4" fill="#1565c0"/>
  <circle cx="325" cy="91" r="4" fill="#1565c0"/><circle cx="355" cy="91" r="4" fill="#1565c0"/>
  <circle cx="325" cy="129" r="4" fill="#1565c0"/><circle cx="355" cy="129" r="4" fill="#1565c0"/>
  <circle cx="314" cy="110" r="4" fill="#1565c0"/><circle cx="366" cy="110" r="4" fill="#1565c0"/>
  <!-- Cl shell 3: 7 electrons -->
  <circle cx="340" cy="68" r="4" fill="#1565c0"/>
  <circle cx="318" cy="76" r="4" fill="#1565c0"/>
  <circle cx="362" cy="76" r="4" fill="#1565c0"/>
  <circle cx="305" cy="97" r="4" fill="#1565c0"/>
  <circle cx="375" cy="97" r="4" fill="#1565c0"/>
  <circle cx="305" cy="123" r="4" fill="#1565c0"/>
  <circle cx="375" cy="123" r="4" fill="#1565c0"/>
  <text x="340" y="163" text-anchor="middle" fill="#1565c0" font-size="11" font-weight="bold">Cl (2,8,7)</text>

  <rect x="10" y="180" width="185" height="55" rx="6" fill="#fff" stroke="#e65100" stroke-width="2"/>

  <text x="103" y="218" text-anchor="middle" fill="#333" font-size="10">Loses 1e⁻ → 2,8</text>
  <text x="103" y="230" text-anchor="middle" fill="#333" font-size="10">Full outer shell ✓</text>
  <rect x="225" y="180" width="185" height="55" rx="6" fill="#fff" stroke="#1565c0" stroke-width="2"/>
  <text x="317" y="200" text-anchor="middle" fill="#1565c0" font-size="12" font-weight="bold">Cl⁻</text>
  <text x="317" y="218" text-anchor="middle" fill="#333" font-size="10">Gains 1e⁻ → 2,8,8</text>
  <text x="317" y="230" text-anchor="middle" fill="#333" font-size="10">Full outer shell ✓</text>
  <text x="210" y="255" text-anchor="middle" fill="#333" font-size="11">Na⁺ and Cl⁻ attract each other →</text>
  <text x="210" y="272" text-anchor="middle" fill="#e65100" font-size="12" font-weight="bold">Giant Ionic Lattice (NaCl)</text>
</svg>`
  },
  {
    q:'Covalent Bond — H₂O Dot-Cross Diagram',
    content:`<h3>H₂O Covalent Dot-Cross Diagram</h3><p>In a covalent bond, two atoms each contribute one electron to form a shared pair. The dot-cross diagram for water shows oxygen sharing one electron pair with each of the two hydrogen atoms to complete all outer shells.</p><ul><li>Oxygen (2,6) needs 2 more electrons — it forms 2 covalent bonds, one with each hydrogen atom</li><li>Each hydrogen (1) needs 1 more electron — sharing with oxygen completes its shell of 2</li><li>Oxygen also has 2 lone pairs (non-bonding electron pairs) that give water its bent shape and bond angle of ~104.5°</li></ul>`,

  {
    q:'Metallic Bonding — Sea of Delocalised Electrons',
    content:`<h3>Metallic Bonding — Sea of Electrons</h3><p>In metallic bonding, metal atoms release their outer electrons into a shared "sea" of delocalised electrons. The resulting positive metal ions are held in a regular lattice by electrostatic attraction to this electron sea.</p><ul><li>Electrical conductivity: the delocalised electrons are free to move and carry electric charge through the solid metal</li><li>Malleability and ductility: layers of positive ions can slide past each other without breaking bonds, because the electron sea re-bonds them in any new position</li><li>High melting points: the strong attraction between many positive ions and the electron sea requires a large amount of energy to overcome</li></ul>`,
    visual:`<svg viewBox="0 0 420 255" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e65100"/></marker></defs>
  <rect width="420" height="255" fill="#fff8e1" rx="8"/>
  <text x="210" y="20" text-anchor="middle" fill="#e65100" font-size="13" font-weight="bold">Metallic Bonding — Sea of Electrons</text>
  <!-- Metal ion lattice 4x5 grid -->
  <circle cx="65" cy="65" r="22" fill="#ffd54f" stroke="#e65100" stroke-width="1.5"/><text x="65" y="70" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">M⁺</text>
  <circle cx="147" cy="65" r="22" fill="#ffd54f" stroke="#e65100" stroke-width="1.5"/><text x="147" y="70" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">M⁺</text>
  <circle cx="229" cy="65" r="22" fill="#ffd54f" stroke="#e65100" stroke-width="1.5"/><text x="229" y="70" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">M⁺</text>
  <circle cx="311" cy="65" r="22" fill="#ffd54f" stroke="#e65100" stroke-width="1.5"/><text x="311" y="70" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">M⁺</text>
  <circle cx="393" cy="65" r="22" fill="#ffd54f" stroke="#e65100" stroke-width="1.5"/><text x="393" y="70" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">M⁺</text>
  <circle cx="65" cy="140" r="22" fill="#ffd54f" stroke="#e65100" stroke-width="1.5"/><text x="65" y="145" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">M⁺</text>
  <circle cx="147" cy="140" r="22" fill="#ffd54f" stroke="#e65100" stroke-width="1.5"/><text x="147" y="145" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">M⁺</text>
  <circle cx="229" cy="140" r="22" fill="#ffd54f" stroke="#e65100" stroke-width="1.5"/><text x="229" y="145" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">M⁺</text>
  <circle cx="311" cy="140" r="22" fill="#ffd54f" stroke="#e65100" stroke-width="1.5"/><text x="311" y="145" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">M⁺</text>
  <circle cx="393" cy="140" r="22" fill="#ffd54f" stroke="#e65100" stroke-width="1.5"/><text x="393" y="145" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">M⁺</text>
  <!-- Delocalised electrons scattered between ions -->
  <circle cx="106" cy="55" r="6" fill="#1565c0" opacity="0.8"/><text x="106" y="59" text-anchor="middle" fill="#fff" font-size="8">e⁻</text>
  <circle cx="188" cy="88" r="6" fill="#1565c0" opacity="0.8"/><text x="188" y="92" text-anchor="middle" fill="#fff" font-size="8">e⁻</text>
  <circle cx="270" cy="52" r="6" fill="#1565c0" opacity="0.8"/><text x="270" y="56" text-anchor="middle" fill="#fff" font-size="8">e⁻</text>
  <circle cx="352" cy="97" r="6" fill="#1565c0" opacity="0.8"/><text x="352" y="101" text-anchor="middle" fill="#fff" font-size="8">e⁻</text>
  <circle cx="106" cy="115" r="6" fill="#1565c0" opacity="0.8"/><text x="106" y="119" text-anchor="middle" fill="#fff" font-size="8">e⁻</text>
  <circle cx="188" cy="165" r="6" fill="#1565c0" opacity="0.8"/><text x="188" y="169" text-anchor="middle" fill="#fff" font-size="8">e⁻</text>
  <circle cx="270" cy="110" r="6" fill="#1565c0" opacity="0.8"/><text x="270" y="114" text-anchor="middle" fill="#fff" font-size="8">e⁻</text>

  <circle cx="40" cy="103" r="6" fill="#1565c0" opacity="0.8"/><text x="40" y="107" text-anchor="middle" fill="#fff" font-size="8">e⁻</text>
  <!-- Properties list -->

</svg>`
  },
  {
    q:'Bond Types Comparison — Ionic, Covalent, Metallic',
    content:`<h3>Bond Types — Property Comparison</h3><p>The three main bond types produce very different physical properties because of the different ways particles are held together. Comparing these properties is a common exam focus.</p><ul><li>Ionic (e.g. NaCl): high melting point, conducts only when molten or dissolved (ions must be free to move), brittle — a force shatters the lattice by aligning like charges</li><li>Covalent simple molecular (e.g. H₂O, CO₂): low melting point — only weak forces between molecules need breaking, does not conduct electricity</li><li>Metallic (e.g. Fe, Cu): high melting point, conducts in solid and liquid state (free electrons), malleable and ductile</li></ul>`,
    visual:`<svg viewBox="0 0 420 275" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">
  <rect width="420" height="275" fill="#fff8e1" rx="8"/>
  <text x="210" y="20" text-anchor="middle" fill="#e65100" font-size="13" font-weight="bold">Bond Types — Property Comparison</text>
  <!-- Header row -->
  <rect x="8" y="28" width="404" height="18" rx="3" fill="#e65100" opacity="0.85"/>
  <text x="60" y="41" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Property</text>
  <text x="165" y="41" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Ionic</text>
  <text x="258" y="41" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Covalent</text>
  <text x="370" y="41" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Metallic</text>
  <!-- Row 1 -->
  <text x="15" y="60" fill="#333" font-size="10" font-weight="bold">Bonding</text>
  <text x="165" y="60" text-anchor="middle" fill="#333" font-size="10">e⁻ transfer</text>
  <text x="258" y="60" text-anchor="middle" fill="#333" font-size="10">e⁻ sharing</text>
  <text x="370" y="60" text-anchor="middle" fill="#333" font-size="10">e⁻ sea</text>
  <!-- Row 2 -->
  <rect x="8" y="65" width="404" height="18" fill="#e65100" opacity="0.07"/>

  {
    title:'Covalent Bonding — Electron Sharing',
    body:`<strong>Covalent bonds</strong> form when non-metal atoms <em>share</em> pairs of electrons.
    <br><br>
    Examples:
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li><strong>H₂</strong> — H shares 1 electron with H (single bond)</li>
      <li><strong>O₂</strong> — O shares 2 electrons with O (double bond)</li>
      <li><strong>N₂</strong> — N shares 3 electrons with N (triple bond)</li>
      <li><strong>H₂O</strong> — O forms 2 bonds with 2 H atoms</li>
    </ul>
    Molecules can be <strong>simple molecular</strong> (low mp, no conductivity) or <strong>giant covalent structures</strong> (diamond, silicon dioxide — very high mp, hard).`,

        sk.fill(255);sk.textSize(12);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('H',p[0],p[1]);

      // Shared electrons
      sk.fill(255,220,50,200);sk.noStroke();

  {
    title:'Metallic Bonding & Properties',
    body:`<strong>Metallic bonding</strong> — metal atoms lose their outer electrons into a "sea" of delocalised electrons that holds the positive metal ions together.
    <br><br>
    This structure explains all metallic properties:
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li><strong>Good conductors of electricity</strong> — free electrons carry charge</li>
      <li><strong>Good conductors of heat</strong> — free electrons transfer kinetic energy</li>
      <li><strong>Malleable and ductile</strong> — layers of ions can slide without breaking bonds</li>
      <li><strong>High melting points</strong> — strong forces throughout structure (except mercury)</li>
      <li><strong>Shiny (lustre)</strong> — free electrons absorb and re-emit light</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk,[10,12,20]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Metal ion lattice
      const rows=4,cols=6;
      const gx=W/(cols+1),gy=H/(rows+1);
      for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
        const x=(c+1)*gx,y=(r+1)*gy;
        sk.fill(241,196,15,200);sk.noStroke();sk.circle(x,y,24);
        sk.fill(50,40,10);sk.textSize(9);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('M⁺',x,y);
      }
      // Delocalised electrons moving
      for(let i=0;i<18;i++){
        const angle=(t*0.5+i*0.35)%(sk.TWO_PI);
        const ex=W*(0.1+((t*0.2+i*0.18)%(0.8)));
        const ey=H*(0.15+0.7*((Math.sin(t+i*0.7)+1)/2));
        sk.fill(100,200,255,200);sk.noStroke();sk.circle(ex,ey,7);
      }
      sk.fill(100,200,255);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('Sea of delocalised electrons (e⁻)',W/2,H*0.06);
      sk.fill(241,196,15);sk.text('Positive metal ions (M⁺)',W/2,H*0.94);
    }
