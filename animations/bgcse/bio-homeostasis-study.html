<script>
function bg(sk,c){sk.background(c||[18,22,30])}
function lbl(sk,t,x,y,sz,col){sk.noStroke();sk.fill(col||255);sk.textSize(sz||12);sk.textAlign(sk.CENTER,sk.CENTER);sk.text(t,x,y)}

const STEPS=[
  {
    title:'What is Homeostasis?',
    body:`<strong>Homeostasis</strong> is the maintenance of a <em>constant internal environment</em> in the body, despite changes in the external environment.
    <br><br>The body must keep these within narrow limits:
    <ul style="margin:8px 0 0 18px;line-height:2">
      <li><strong>Body temperature</strong> — 37°C</li>
      <li><strong>Blood glucose concentration</strong> — ~90 mg per 100 cm³</li>
      <li><strong>Blood water potential (osmoregulation)</strong></li>
      <li><strong>Blood CO₂ and pH levels</strong></li>
    </ul>`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.02;
      // Show stable line despite fluctuating input
      sk.stroke(255,255,255,40);sk.strokeWeight(1);sk.noFill();
      sk.line(0,H/2,W,H/2);
      // Noisy input signal (external changes)
      sk.stroke(231,76,60,180);sk.strokeWeight(2);
      sk.beginShape();
      for(let x=0;x<W;x+=4){
        const y=H*0.25+Math.sin(x*0.04+t)*40+Math.sin(x*0.1+t*0.7)*15;
        sk.vertex(x,y);
      }sk.endShape();
      // Stable internal signal
      sk.stroke(46,204,113,220);sk.strokeWeight(2.5);
      sk.beginShape();
      for(let x=0;x<W;x+=4){
        const y=H*0.68+Math.sin(x*0.02+t)*5;
        sk.vertex(x,y);
      }sk.endShape();
      // Labels
      sk.noStroke();sk.fill(231,76,60);sk.textSize(11);sk.textAlign(sk.LEFT);
      sk.text('External environment (variable)',12,H*0.18);
      sk.fill(46,204,113);sk.text('Internal environment (stable)',12,H*0.78);
      sk.fill(255,255,255,120);sk.textSize(10);sk.textAlign(sk.CENTER);
      sk.text('HOMEOSTASIS keeps this line flat',W/2,H*0.58);
    }
  },
  {
    title:'Negative Feedback — The Control System',
    body:`The body uses <strong>negative feedback</strong> to keep conditions stable.
    <br><br>
    <strong>How it works:</strong>
    <ol style="margin:8px 0 0 18px;line-height:2">
      <li>A <strong>receptor</strong> detects a change from the set point</li>
      <li>A signal goes to a <strong>control centre</strong> (usually the brain/hypothalamus)</li>
      <li>An <strong>effector</strong> (muscle/gland) produces a corrective response</li>
      <li>The change is reversed — bringing the level back to normal</li>
    </ol>
    The response <em>opposes</em> the original change — hence "negative" feedback.`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      const cx=W/2,cy=H/2;
      const nodes=[
        {label:'Receptor\n(detects change)',x:cx,y:cy-H*0.3,c:[52,152,219]},
        {label:'Control Centre\n(Hypothalamus)',x:cx+W*0.3,y:cy,c:[155,89,182]},
        {label:'Effector\n(gland/muscle)',x:cx,y:cy+H*0.3,c:[231,76,60]},
        {label:'Stimulus\n(change detected)',x:cx-W*0.3,y:cy,c:[241,196,15]},
      ];
      // Draw arrows
      const arrows=[[0,1],[1,2],[2,3],[3,0]];
      arrows.forEach(([a,b])=>{
        sk.stroke(255,255,255,60);sk.strokeWeight(1.5);sk.noFill();
        const dx=nodes[b].x-nodes[a].x,dy=nodes[b].y-nodes[a].y;
        const ang=Math.atan2(dy,dx);
        const r=42;
        const sx=nodes[a].x+Math.cos(ang)*r,sy=nodes[a].y+Math.sin(ang)*r;
        const ex=nodes[b].x-Math.cos(ang)*r,ey=nodes[b].y-Math.sin(ang)*r;
        sk.line(sx,sy,ex,ey);
        sk.fill(255,255,255,60);sk.noStroke();
        sk.push();sk.translate(ex,ey);sk.rotate(ang);
        sk.triangle(0,0,-10,-4,-10,4);sk.pop();
      });
      // Pulse on active node
      const active=Math.floor(t/1.5)%4;
      nodes.forEach((n,i)=>{
        const pulse=i===active?1+Math.sin(t*4)*0.12:1;
        sk.noStroke();sk.fill(...n.c,40);sk.ellipse(n.x,n.y,90*pulse,60*pulse);
        sk.fill(...n.c);sk.ellipse(n.x,n.y,70,48);
        sk.fill(255);sk.textSize(9.5);sk.textAlign(sk.CENTER,sk.CENTER);sk.text(n.label,n.x,n.y);
      });
      sk.fill(255,255,255,80);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('↺ Negative Feedback Loop',cx,H-18);
    }
  },
  {
    q:'Negative Feedback Loop Diagram',
    content:`<h3>Negative Feedback Loop Diagram</h3><p>Study this diagram carefully. Negative feedback is the control mechanism the body uses to maintain a stable internal environment. When a stimulus causes a change, the receptor detects it and signals the control centre, which instructs an effector to produce a corrective response that reverses the original change.</p><ul><li><strong>Receptor</strong> — detects the deviation from the set point (e.g. thermoreceptors in the skin and hypothalamus)</li><li><strong>Control centre</strong> — the hypothalamus or relevant brain region that coordinates the response</li><li><strong>Effector</strong> — a muscle or gland that carries out the corrective action</li><li>The response <em>opposes</em> the original change — hence the name "negative" feedback</li></ul>`,
    visual:`<svg viewBox="0 0 420 260" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">

  <rect width="420" height="260" fill="#ffebee" rx="8"/>

  <!-- Stimulus box -->
  <rect x="160" y="35" width="100" height="40" rx="6" fill="#fff" stroke="#c62828" stroke-width="1.5"/>
  <text x="210" y="51" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">STIMULUS</text>
  <text x="210" y="67" text-anchor="middle" font-size="10" fill="#555">(Change detected)</text>
  <!-- Receptor box -->
  <rect x="295" y="105" width="105" height="40" rx="6" fill="#fff" stroke="#c62828" stroke-width="1.5"/>
  <text x="347" y="121" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">RECEPTOR</text>
  <text x="347" y="137" text-anchor="middle" font-size="10" fill="#555">Detects change</text>
  <!-- Control Centre box -->
  <rect x="160" y="175" width="100" height="40" rx="6" fill="#c62828"/>
  <text x="210" y="191" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">CONTROL</text>
  <text x="210" y="207" text-anchor="middle" font-size="10" fill="#ffcdd2">CENTRE</text>
  <!-- Effector box -->
  <rect x="20" y="105" width="105" height="40" rx="6" fill="#fff" stroke="#c62828" stroke-width="1.5"/>
  <text x="72" y="121" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">EFFECTOR</text>
  <text x="72" y="137" text-anchor="middle" font-size="10" fill="#555">Muscle / Gland</text>
  <!-- Arrows -->
  <line x1="260" y1="55" x2="320" y2="110" stroke="#c62828" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="347" y1="145" x2="280" y2="180" stroke="#c62828" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="160" y1="195" x2="130" y2="145" stroke="#c62828" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="72" y1="105" x2="160" y2="60" stroke="#c62828" stroke-width="1.8" marker-end="url(#arr)"/>
  <!-- Labels on arrows -->
  <text x="305" y="85" text-anchor="middle" font-size="9" fill="#c62828">sends signal</text>
  <text x="318" y="168" text-anchor="middle" font-size="9" fill="#c62828">coordinates</text>
  <text x="130" y="175" text-anchor="middle" font-size="9" fill="#c62828">response</text>
  <text x="105" y="76" text-anchor="middle" font-size="9" fill="#c62828">reverses change</text>
  <!-- Centre note -->
  <text x="210" y="248" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Response OPPOSES the original change</text>
</svg>`
  },
  {
    q:'Thermoregulation — Too Hot / Too Cold Responses',
    content:`<h3>Thermoregulation Diagram</h3><p>Study this diagram carefully. The hypothalamus acts as the body's thermostat, maintaining a set point of 37°C. It detects changes in blood temperature and coordinates opposing responses on both sides — cooling responses when the body is too hot, and warming responses when the body is too cold.</p><ul><li><strong>Too hot:</strong> sweating (evaporation removes heat), vasodilation (blood vessels widen to lose heat at skin surface), hairs lie flat (reduces insulating air layer)</li><li><strong>Too cold:</strong> shivering (muscle contractions generate heat), vasoconstriction (blood vessels narrow to retain heat), hairs stand up (traps air for insulation)</li><li>Both sets of responses are examples of negative feedback — they reverse the temperature change and restore the 37°C set point</li></ul>`,
    visual:`<svg viewBox="0 0 420 300" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c62828"/></marker></defs>
  <rect width="420" height="300" fill="#ffebee" rx="8"/>
  <text x="210" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">Thermoregulation — Hypothalamus at 37°C</text>
  <!-- Central box -->
  <rect x="155" y="95" width="110" height="45" rx="8" fill="#c62828"/>
  <text x="210" y="114" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">HYPOTHALAMUS</text>
  <text x="210" y="130" text-anchor="middle" font-size="10" fill="#ffcdd2">Set point: 37°C</text>
  <!-- TOO HOT column -->
  <text x="70" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#e53935">TOO HOT</text>
  <rect x="20" y="55" width="100" height="28" rx="5" fill="#ffcdd2" stroke="#e53935" stroke-width="1"/>
  <text x="70" y="74" text-anchor="middle" font-size="10" fill="#333">Body temp rises</text>
  <!-- Hot responses -->
  <rect x="20" y="165" width="100" height="28" rx="5" fill="#fff" stroke="#c62828" stroke-width="1.2"/>
  <text x="70" y="182" text-anchor="middle" font-size="10" fill="#333">Sweating increases</text>
  <rect x="20" y="200" width="100" height="28" rx="5" fill="#fff" stroke="#c62828" stroke-width="1.2"/>
  <text x="70" y="217" text-anchor="middle" font-size="10" fill="#333">Vasodilation</text>
  <rect x="20" y="235" width="100" height="28" rx="5" fill="#fff" stroke="#c62828" stroke-width="1.2"/>
  <text x="70" y="252" text-anchor="middle" font-size="10" fill="#333">Hairs lie flat</text>
  <!-- TOO COLD column -->
  <text x="350" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">TOO COLD</text>
  <rect x="300" y="55" width="100" height="28" rx="5" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>

  <!-- Cold responses -->
  <rect x="300" y="165" width="100" height="28" rx="5" fill="#fff" stroke="#c62828" stroke-width="1.2"/>
  <text x="350" y="182" text-anchor="middle" font-size="10" fill="#333">Shivering begins</text>
  <rect x="300" y="200" width="100" height="28" rx="5" fill="#fff" stroke="#c62828" stroke-width="1.2"/>
  <text x="350" y="217" text-anchor="middle" font-size="10" fill="#333">Vasoconstriction</text>
  <rect x="300" y="235" width="100" height="28" rx="5" fill="#fff" stroke="#c62828" stroke-width="1.2"/>
  <text x="350" y="252" text-anchor="middle" font-size="10" fill="#333">Hairs stand up</text>
  <!-- Arrows from stimuli to hypothalamus -->
  <line x1="120" y1="75" x2="155" y2="108" stroke="#e53935" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="300" y1="75" x2="265" y2="108" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Arrows from hypothalamus to responses -->
  <line x1="155" y1="130" x2="120" y2="162" stroke="#c62828" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="265" y1="130" x2="300" y2="162" stroke="#c62828" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="210" y="290" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Negative feedback restores 37°C</text>
</svg>`
  },
  {
    title:'Temperature Regulation',
    body:`The <strong>hypothalamus</strong> in the brain acts as the body's thermostat, maintaining 37°C.
    <br><br>
    <strong>Too hot → cooling responses:</strong>
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>Sweating — evaporation removes heat</li>
      <li>Vasodilation — blood vessels widen, more heat lost at skin</li>
      <li>Hairs lie flat — reduces insulation</li>
    </ul>
    <strong>Too cold → warming responses:</strong>
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>Shivering — muscle contractions generate heat</li>
      <li>Vasoconstriction — blood vessels narrow, less heat lost</li>
      <li>Hairs stand up — traps air, insulates</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk,[15,20,35]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.03;
      // Body outline
      sk.noFill();sk.stroke(100,180,255,80);sk.strokeWeight(1.5);
      sk.ellipse(W/2,H/2,W*0.45,H*0.65);
      // Thermometer
      const therm=H*0.5+Math.sin(t)*H*0.12;
      sk.fill(231,76,60);sk.noStroke();
      sk.rect(W*0.08,H*0.2,10,therm-H*0.2,5);
      sk.circle(W*0.08+5,H*0.7,20);
      sk.fill(255);sk.textSize(10);sk.textAlign(sk.LEFT);
      sk.text(Math.sin(t)>0?'↑ TOO HOT':'↓ TOO COLD',W*0.15,therm);
      // Response arrows
      if(Math.sin(t)>0){
        // sweating
        sk.fill(100,180,255,180);
        for(let i=0;i<4;i++){
          const drop=((t*40+i*30)%80);
          sk.ellipse(W/2-30+i*20,H*0.15+drop,5,8);
        }
        sk.fill(100,180,255);sk.textSize(9);sk.textAlign(sk.CENTER);sk.text('Sweating',W/2,H*0.12);
      }else{
        // shivering lines
        sk.stroke(255,230,50,180);sk.strokeWeight(2);
        for(let i=0;i<5;i++){
          const yy=H*0.3+i*H*0.08;
          const shiv=Math.sin(t*10+i)*6;
          sk.line(W/2-60+shiv,yy,W/2+60-shiv,yy);
        }
        sk.noStroke();sk.fill(255,230,50);sk.textSize(9);sk.textAlign(sk.CENTER);
        sk.text('Shivering',W/2,H*0.88);
      }
    }
  },
  {
    title:'🎮 Check — Homeostasis & Temperature',

      {q:'What is homeostasis?',opts:['Increasing body temperature','Maintaining a stable internal environment','Breaking down glucose','Producing hormones'],ans:1,exp:'Homeostasis is the maintenance of a constant internal environment despite external changes.'},

      {q:'In negative feedback, the corrective response:',opts:['Amplifies the original change','Opposes the original change','Has no effect on the change','Stops all hormones'],ans:1,exp:'Negative feedback opposes (reverses) the change — bringing the variable back to its set point.'},
    ]}
  },
  {
    title:'Blood Glucose Regulation',
    body:`Blood glucose is regulated by two hormones from the <strong>pancreas</strong>:
    <br><br>
    <strong>↑ Blood glucose (after a meal):</strong>
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>Beta (β) cells release <strong>insulin</strong></li>
      <li>Liver and muscles convert glucose → glycogen (storage)</li>
      <li>Blood glucose falls back to normal</li>
    </ul>
    <strong>↓ Blood glucose (fasting/exercise):</strong>
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>Alpha (α) cells release <strong>glucagon</strong></li>
      <li>Liver converts glycogen → glucose (glycogenolysis)</li>
      <li>Blood glucose rises back to normal</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.02;
      // Blood glucose wave
      sk.noFill();sk.stroke(46,204,113,200);sk.strokeWeight(2.5);
      sk.beginShape();
      for(let x=0;x<W;x+=3){
        const meal=x/W>0.25&&x/W<0.4?40:0;
        const exercise=x/W>0.6&&x/W<0.7?-30:0;
        const base=H/2;
        const wave=Math.sin(x*0.08+t)*6+meal*(1-Math.exp(-(x/W-0.25)*20))*Math.exp(-(x/W-0.4)*25)+exercise;
        sk.vertex(x,base-wave);
      }sk.endShape();
      // Set point line
      sk.stroke(255,255,255,40);sk.strokeWeight(1);
      sk.line(0,H/2,W,H/2);
      sk.noStroke();sk.fill(255,255,255,60);sk.textSize(9);sk.textAlign(sk.RIGHT);
      sk.text('Normal level (90mg/100cm³)',W-8,H/2-6);
      // Labels
      sk.fill(241,196,15);sk.textSize(11);sk.textAlign(sk.CENTER);
      sk.text('↑ After meal → Insulin released',W*0.32,H*0.22);
      sk.fill(255,140,50);
      sk.text('↓ Exercise → Glucagon released',W*0.65,H*0.78);
      // Pancreas icon
      sk.fill(200,100,180,180);sk.noStroke();
      sk.ellipse(W*0.5,H*0.88,100,22);
      sk.fill(255);sk.textSize(10);sk.textAlign(sk.CENTER,sk.CENTER);
      sk.text('PANCREAS (β + α cells)',W*0.5,H*0.88);
    }
  },
  {
    q:'Blood Glucose Regulation — Insulin & Glucagon',
    content:`<h3>Blood Glucose Regulation Diagram</h3><p>Study this diagram carefully. The pancreas contains two types of cells that work antagonistically to keep blood glucose at approximately 90 mg per 100 cm³. This is another example of negative feedback — both insulin and glucagon oppose the change that triggered their release.</p><ul><li><strong>High blood glucose (after a meal):</strong> beta (β) cells in the pancreas release insulin → liver and muscles convert glucose to glycogen for storage → blood glucose falls back to normal</li><li><strong>Low blood glucose (during fasting or exercise):</strong> alpha (α) cells release glucagon → liver converts glycogen back to glucose (glycogenolysis) → blood glucose rises back to normal</li><li>Failure of this system leads to diabetes: Type 1 (no insulin produced) or Type 2 (cells resistant to insulin)</li></ul>`,

  <!-- Liver responses -->
  <rect x="30" y="200" width="165" height="40" rx="5" fill="#fff" stroke="#c62828" stroke-width="1.2"/>
  <text x="112" y="217" text-anchor="middle" font-size="10" fill="#333">Liver: glucose → glycogen</text>
  <text x="112" y="232" text-anchor="middle" font-size="10" fill="#c62828">(stored) — glucose FALLS</text>

    q:'Kidney Nephron — Labeled Diagram',
    content:`<h3>Kidney Nephron Diagram</h3><p>Study this diagram carefully. The nephron is the functional unit of the kidney. Each kidney contains about one million nephrons. The nephron produces urine through two key processes: ultrafiltration (forcing fluid out of the blood) and selective reabsorption (taking back useful substances).</p><ul><li><strong>Bowman's capsule and glomerulus:</strong> the afferent arteriole brings blood at high pressure; small molecules (water, glucose, urea, ions) are forced out into the capsule — this is ultrafiltration</li><li><strong>Proximal convoluted tubule:</strong> glucose, water, and useful ions are actively reabsorbed back into the blood</li><li><strong>Loop of Henle:</strong> creates a concentration gradient in the medulla, allowing water reabsorption</li><li><strong>Collecting duct:</strong> water reabsorption is controlled by ADH — the more ADH, the more water is reabsorbed, producing concentrated urine</li></ul>`,

    q:'Water Balance — ADH Mechanism',
    content:`<h3>ADH and Water Balance (Osmoregulation) Diagram</h3><p>Study this diagram carefully. Osmoregulation — controlling the water content of the blood — is carried out by the kidneys under the control of ADH (anti-diuretic hormone). The hypothalamus detects the water potential of the blood and signals the pituitary gland to release more or less ADH accordingly.</p><ul><li><strong>Dehydrated (blood too concentrated):</strong> hypothalamus detects low water potential → pituitary releases MORE ADH → collecting duct becomes more permeable to water → more water reabsorbed → small volume of concentrated urine produced</li><li><strong>Well hydrated (blood too dilute):</strong> hypothalamus detects high water potential → pituitary releases LESS ADH → collecting duct less permeable → less water reabsorbed → large volume of dilute urine produced</li><li>This is another negative feedback loop — each response restores blood water potential to its set point</li></ul>`,
