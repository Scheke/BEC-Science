<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Chemical Bonding Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Chemical Bonding — BGCSE Chemistry Quiz',
  color:'#4a148c',dark:'#12005e',light:'#f3e5f5',
  mcq:[
    {q:'Ionic bonding occurs between:',opts:['Two non-metals','A metal and a non-metal','Two metals','Carbon and hydrogen'],ans:1,exp:'IONIC BONDING forms between a METAL and a NON-METAL. The metal loses electrons (becomes a cation) and the non-metal gains them (becomes an anion). The opposite charges attract.'},
    {q:'Covalent bonding involves:',opts:['Transfer of electrons','Sharing of electron pairs','Attraction between ions','Delocalised electrons'],ans:1,exp:'COVALENT BONDING = SHARING of electron pairs between non-metal atoms. Each atom contributes one electron per shared pair. The shared electrons hold both atoms together.'},
    {q:'Which has the highest melting point?',opts:['NaCl (ionic)','H₂O (simple molecular)','Methane CH₄','Cl₂'],ans:0,exp:'IONIC compounds like NaCl have VERY HIGH melting points because strong electrostatic forces between ions in the giant ionic lattice require lots of energy to break. Simple molecules (H₂O, CH₄, Cl₂) have weak intermolecular forces and low melting points.'},
    {q:'Metals conduct electricity because:',opts:['They have ionic bonds','They have delocalised (free) electrons','They react with water','Ions move through the metal'],ans:1,exp:'METALLIC BONDING: positive metal ions are surrounded by a "sea" of DELOCALISED (free) ELECTRONS. These electrons can flow through the lattice, carrying electrical charge — explaining why metals conduct electricity.'},
    {q:'A molecule of water (H₂O) has:',opts:['Ionic bonds','2 covalent bonds and a straight shape','2 covalent bonds and a bent shape due to lone pairs','1 double covalent bond'],ans:2,exp:'H₂O has 2 COVALENT O-H bonds AND 2 lone pairs on oxygen. The lone pairs repel the bonding pairs, creating a BENT (V-shaped) molecule with a bond angle of ~104.5°.'},
    {q:'Diamond has a very high melting point because:',opts:['It has ionic bonds','It has metallic bonds','Each carbon forms 4 strong covalent bonds in a giant covalent lattice','It has weak Van der Waals forces'],ans:2,exp:'DIAMOND has a GIANT COVALENT STRUCTURE — each carbon is bonded to 4 others in a tetrahedral lattice. All bonds are strong C-C covalent bonds. An enormous amount of energy is needed to break them → very high melting point.'},
    {q:'Which compound is most likely to be a gas at room temperature?',opts:['Sodium chloride (NaCl)','Carbon dioxide (CO₂)','Iron (Fe)','Magnesium oxide (MgO)'],ans:1,exp:'CO₂ is a SIMPLE MOLECULAR compound. It has strong covalent bonds within the molecule but only weak intermolecular forces between molecules. These weak forces are easily overcome, giving it a very low boiling point (-78°C).'},
    {q:'Why do ionic compounds shatter when struck?',opts:['The covalent bonds break','The ions are repelled and the lattice shifts','The delocalised electrons break','The intermolecular forces snap'],ans:1,exp:'In a giant ionic lattice, ions are held in a rigid alternating pattern. When struck, the layers shift so that like-charged ions line up next to each other. The REPULSION forces cause the crystal to shatter along the fault line.'},
    {q:'In a covalent bond, the shared electrons are attracted to:',opts:['The nucleus of the first atom only','The nuclei of both atoms','The nucleus of the second atom only','The electron cloud of a different molecule'],ans:1,exp:'The shared pair of electrons is attracted to the positive NUCLEI OF BOTH ATOMS simultaneously. This attraction between the shared electrons and the two positive nuclei is what holds the atoms together.'},
    {q:'Which of the following is a giant covalent structure?',opts:['Water (H₂O)','Carbon dioxide (CO₂)','Silicon dioxide (SiO₂)','Oxygen gas (O₂)'],ans:2,exp:'SILICON DIOXIDE (SiO₂) is a giant covalent structure (like diamond). Each silicon is bonded to 4 oxygens in a giant 3D network, resulting in a very hard material with a high melting point.'},
    {q:'A "sea of delocalised electrons" is found in:',opts:['Ionic compounds','Simple molecular compounds','Metals','Giant covalent networks'],ans:2,exp:'In METALLIC bonding, the outer valence electrons are not attached to any specific atom. They are free to move throughout the entire metallic lattice, forming a "sea of delocalised electrons" that holds the positive metal ions together.'},
    {q:'Sodium (2,8,1) forms an ionic bond with chlorine (2,8,7). Sodium:',opts:['Gains 1 electron','Loses 1 electron','Shares 1 electron','Loses 7 electrons'],ans:1,exp:'To achieve a full outer shell (octet), Sodium (Group 1) LOSES its single valence electron to become a Na⁺ cation. Chlorine gains this electron to become a Cl⁻ anion. The oppositely charged ions attract.'},
    {q:'In a dot-and-cross diagram for a single covalent bond (e.g., H₂), the shared pair of electrons is usually represented as:',opts:['One dot and one cross in the overlapping region','Two dots in the overlapping region','Two crosses in the overlapping region','A circle around the nuclei'],ans:0,exp:'To show that each atom contributes one electron to the bond, the shared pair is drawn as ONE DOT (from atom A) and ONE CROSS (from atom B) in the overlapping region between the two atoms.'},
    {q:'Which property is NOT typical of ionic compounds?',opts:['High melting point','Conducts electricity when molten','Brittle and shatters','Conducts electricity as a solid'],ans:3,exp:'Ionic compounds DO NOT conduct electricity in their SOLID state because the ions are held tightly in a fixed lattice and cannot move. They only conduct when molten or dissolved (when ions are free to move).'},
    {q:'The intermolecular forces between simple covalent molecules are known as:',opts:['Ionic bonds','Metallic bonds','Van der Waals forces (or hydrogen bonds)','Covalent bonds'],ans:2,exp:'Simple covalent molecules are held together by weak INTERMOLECULAR forces, primarily Van der Waals forces (and Hydrogen bonds in specific cases like H₂O). These are much weaker than the intramolecular covalent bonds.'},
    {q:'Which of the following molecules contains a double covalent bond?',opts:['H₂','O₂','N₂','Cl₂'],ans:1,exp:'OXYGEN (O₂) forms a DOUBLE covalent bond. Each oxygen atom has 6 valence electrons. To achieve an octet, they share TWO pairs of electrons (represented as O=O). Nitrogen (N₂) forms a TRIPLE bond (N≡N).'},
    {q:'Carbon dioxide (CO₂) is a linear molecule because:',opts:['It has two lone pairs on carbon','It has double bonds that repel equally on both sides','It has ionic bonds','It has a giant covalent structure'],ans:1,exp:'CO₂ has the structure O=C=O. The two C=O double bonds repel each other equally on opposite sides of the carbon atom, resulting in a perfectly LINEAR (180°) molecular shape.'},
    {q:'Why is graphite used as a lubricant in machinery?',ops:['It is a giant covalent structure','The layers are held by weak forces and can slide over each other','It has delocalised electrons','It is hard like diamond'],ans:1,exp:'Graphite consists of flat layers of hexagonal carbon rings. The atoms within the layers are held by strong covalent bonds, but the LAYERS are held together by WEAK Van der Waals forces. This allows the layers to SLIDE easily over each other, making it a good dry lubricant.'},
    {q:'Magnesium oxide (MgO) has a higher melting point than sodium chloride (NaCl) because:',opts:['Mg and O are smaller atoms','Mg²⁺ and O²⁻ have higher charges, creating stronger electrostatic forces','MgO is a covalent compound','MgO has a different lattice shape'],ans:1,exp:'Both are ionic, but Mg²⁺ has a 2+ charge and O²⁻ has a 2- charge (compared to Na⁺ 1+ and Cl⁻ 1-). The higher the charges on the ions, the STRONGER the electrostatic attraction, requiring more energy to break the lattice.'},
    {q:'Ammonia (NH₃) has a pyramidal shape because:',opts:['It has 1 lone pair repelling the 3 bonding pairs','It has no lone pairs','It has ionic bonds','Nitrogen only has 3 electrons'],ans:0,exp:'Nitrogen in NH₃ has 3 bonded hydrogens and ONE LONE PAIR. The lone pair repels the bonding pairs more strongly than the bonding pairs repel each other. This pushes the hydrogens downwards, creating a TRIGONAL PYRAMIDAL shape.'},
  ],
  match:[
    {term:'Ionic bond',def:'Electrostatic attraction between oppositely charged ions (metal + non-metal)'},
    {term:'Covalent bond',def:'Shared pair of electrons between non-metal atoms'},
    {term:'Metallic bond',def:'Attraction between positive metal ions and a sea of delocalised electrons'},
    {term:'Giant ionic lattice',def:'3D repeating structure of alternating positive and negative ions'},
    {term:'Giant covalent structure',def:'Network of atoms joined by many strong covalent bonds (e.g., diamond, SiO₂)'},
    {term:'Lone pair',def:'Pair of valence electrons not involved in bonding'},
    {term:'Intermolecular force',def:'Weak force of attraction between separate molecules (Van der Waals / Hydrogen bonds)'},
    {term:'Delocalised electron',def:'Electron free to move within a metallic lattice or across layers of graphite'},
    {term:'Cation',def:'Positively charged ion formed by losing electrons'},
    {term:'Anion',def:'Negatively charged ion formed by gaining electrons'},
    {term:'Valence electron',def:'Electron in the outermost shell, involved in bond formation'},
    {term:'Octet rule',def:'Atoms tend to gain, lose, or share electrons to achieve a full outer shell of 8 electrons'},
    {term:'Dative covalent bond',def:'Covalent bond where both shared electrons come from one atom (e.g., in NH₄⁺)'},
    {term:'Electrostatic attraction',def:'Force of attraction between opposite electrical charges; holds ionic lattices together'},
    {term:'Alloy',def:'Mixture of a metal with other elements to improve properties (strength, hardness)'},
    {term:'Simple molecular',def:'Structure consisting of small molecules held together by weak intermolecular forces'},
    {term:'Double bond',def:'Covalent bond formed by sharing TWO pairs of electrons (e.g., O=O)'},
    {term:'Triple bond',def:'Covalent bond formed by sharing THREE pairs of electrons (e.g., N≡N)'},
    {term:'Graphite',def:'Giant covalent carbon structure with layered sheets and delocalised electrons'},
    {term:'Diamond',def:'Giant covalent carbon structure where each carbon bonds to 4 others; extremely hard'},
  ],
  flashcards:[
    {q:'What is ionic bonding?',a:'Ionic bonding is the electrostatic attraction between OPPOSITELY CHARGED IONS. Metal atoms LOSE electrons → cations (+). Non-metal atoms GAIN electrons → anions (-). The strong attraction between ions forms a giant ionic lattice.'},
    {q:'Why do ionic compounds conduct electricity when dissolved or molten?',a:'In solution or in the molten state, the IONS are FREE TO MOVE and carry electrical charge. In the solid state, ions are held tightly in fixed lattice positions and cannot move, so they are poor conductors.'},
    {q:'Compare diamond and graphite (both allotropes of carbon).',a:'DIAMOND: each carbon atom is bonded to 4 others in a tetrahedral giant covalent lattice → very hard, does not conduct electricity. GRAPHITE: each carbon is bonded to 3 others in flat sheets; layers are held by weak forces → slippery (lubricant), and delocalised electrons between layers allow it to conduct electricity.'},
    {q:'What is a dative (coordinate) covalent bond?',a:'A DATIVE BOND is a covalent bond where BOTH electrons in the shared pair come from ONE atom (the donor). Example: In the ammonium ion (NH₄⁺), the lone pair on the nitrogen atom is donated to a hydrogen ion (H⁺).'},
    {q:'Explain why simple molecular substances have low melting points.',a:'Simple molecules (e.g., H₂O, CO₂, Cl₂) have STRONG covalent bonds WITHIN the molecule but only WEAK intermolecular forces BETWEEN molecules. Very little energy is needed to overcome these weak forces, resulting in low melting and boiling points.'},
    {q:'Draw the dot-and-cross diagram for a Cl₂ molecule.',a:'Each Chlorine atom has 7 outer electrons. They SHARE 1 pair of electrons, forming a single covalent bond. Each Chlorine also has 3 lone pairs remaining. The bond is represented as Cl:Cl, with each atom ending up with 8 outer electrons (a full shell).'},
    {q:'Explain why magnesium oxide (MgO) has a higher melting point than sodium chloride (NaCl).',a:'MgO is made of Mg²⁺ and O²⁻ ions. NaCl is made of Na⁺ and Cl⁻ ions. The STRONGER electrostatic forces of attraction between the 2+ and 2- ions in MgO require much more energy to break than the forces between the 1+ and 1- ions in NaCl.'},
    {q:'Describe the structure and bonding of a metal.',a:'Metals consist of a GIANT METALLIC LATTICE of positive metal ions packed together. Their outermost valence electrons are DELOCALISED (free to move) and form a "sea" of electrons that holds the ions together via strong electrostatic attraction.'},
    {q:'Why is graphite used as an electrode in electrolysis?',a:'Graphite is a good conductor of electricity because of its DELOCALISED ELECTRONS that are free to move between the carbon layers. It also has a very high melting point, making it suitable for use in high-temperature electrolysis cells.'},
    {q:'What is the difference between a single, double, and triple covalent bond?',a:'A SINGLE bond involves sharing 1 pair of electrons (e.g., H-H). A DOUBLE bond involves sharing 2 pairs of electrons (e.g., O=O). A TRIPLE bond involves sharing 3 pairs of electrons (e.g., N≡N). As the number of shared pairs increases, the bond becomes stronger and shorter.'},
    {q:'Explain why ionic compounds are brittle.',a:'Ionic compounds form a rigid lattice of alternating positive and negative ions. When a force is applied and the layers shift, ions of the same charge are brought next to each other. The resultant REPULSION causes the crystal lattice to shatter.'},
    {q:'What are Van der Waals forces?',a:'Van der Waals forces are WEAK intermolecular forces that exist between simple covalent molecules. They arise from temporary fluctuations in electron distribution, creating instantaneous dipoles. They are much weaker than ionic or covalent bonds.'},
    {q:'Explain how the electron arrangement of sodium (2,8,1) and chlorine (2,8,7) leads to ionic bonding.',a:'Sodium needs to lose 1 electron to achieve a stable noble gas configuration (2,8). Chlorine needs to gain 1 electron to achieve a stable octet (2,8,8). Sodium transfers its single valence electron to chlorine, forming Na⁺ and Cl⁻, which attract via ionic bonding.'},
    {q:'What is the "octet rule" in chemical bonding?',a:'The octet rule states that atoms of elements tend to gain, lose, or share electrons in order to achieve a stable electron configuration with a FULL OUTER SHELL of 8 electrons (like the noble gases).'},
    {q:'Describe the bonding in carbon dioxide (CO₂).',a:'CO₂ is a simple molecular compound. Carbon forms TWO double covalent bonds with two oxygen atoms (O=C=O). The double bonds repel equally, resulting in a LINEAR molecule with a bond angle of 180°.'},
    {q:'Why do simple covalent molecules have low boiling points?',a:'The intramolecular covalent bonds are very strong, but the INTERMOLECULAR forces between separate molecules are weak. When heated, only the weak intermolecular forces need to be broken for the substance to boil. These weak forces require very little energy.'},
    {q:'Why are metals malleable and ductile?',a:'Metals are malleable (can be hammered into shapes) and ductile (can be drawn into wires) because the layers of positive ions in the metallic lattice can SLIDE over each other. The delocalised electrons move with the ions, maintaining the metallic bond throughout the deformation.'},
    {q:'Draw and explain the shape of a water (H₂O) molecule.',a:'Water has two O-H covalent bonds and TWO LONE PAIRS on the central oxygen atom. The lone pairs repel the bonding pairs more strongly, causing the molecule to adopt a BENT (V-shaped) geometry with a bond angle of approximately 104.5°.'},
    {q:'Why is diamond one of the hardest naturally occurring substances?',a:'Diamond has a GIANT COVALENT NETWORK structure. Each carbon atom forms FOUR strong, directional covalent bonds with adjacent carbon atoms in a tetrahedral arrangement. This rigid 3D network is extremely difficult to break, making diamond exceptionally hard.'},
    {q:'How do the properties of alloys differ from pure metals?',a:'Alloys are mixtures of a metal with other elements. The different sized atoms disrupt the regular metallic lattice, preventing the layers of ions from sliding easily. This makes the alloy generally HARDER and STRONGER than the pure metal (e.g., steel vs pure iron).'},
  ],
  blanks:{
    passage:'Ionic bonding forms between a metal and a non-metal through the transfer of [_]. Covalent bonding forms when non-metals [_] electron pairs. In metallic bonding, a sea of [_] electrons allows metals to conduct electricity. Ionic compounds have [_] melting points due to strong electrostatic forces in a giant lattice, whereas simple molecular compounds have [_] melting points because of weak intermolecular forces.',
    answers:['electrons','share','delocalised','high','low'],
    wordbank:['electrons','share','delocalised','high','low','transfer','protons','mid'],
  },
  sentences:[
    {prompt:'Explain why sodium chloride (NaCl) has a very high melting point and conducts electricity only when dissolved or molten.',keywords:['ionic','electrostatic','lattice','ions','move','molten','conductor'],hint:'What type of bond holds NaCl together? How strong are these forces, and when are the ions free to move?'},
    {prompt:'Explain why graphite conducts electricity but diamond does not, despite both being made of pure carbon.',keywords:['delocalised','electrons','layers','covalent','bonded','conduct','diamond'],hint:'Compare how carbon atoms are arranged and bonded in both structures. Are free electrons present?'},
    {prompt:'Describe the bonding and shape of a water molecule (H₂O).',keywords:['covalent','shared','lone pairs','bent','hydrogen','oxygen','repulsion'],hint:'What type of bonds form between oxygen and hydrogen? What shape does the molecule adopt and why?'},
    {prompt:'Compare the structure and properties of simple molecular substances with giant covalent structures.',keywords:['simple','molecular','weak','intermolecular','giant','covalent','strong','melting'],hint:'Think about the bonds holding the atoms together versus the forces holding the molecules together.'},
    {prompt:'Explain why metals are good conductors of electricity and heat.',keywords:['metallic','delocalised','electrons','flow','conduct','heat','lattice'],hint:'What subatomic particles are free to move within a metallic lattice, and how do they carry energy?'},
    {prompt:'Describe the formation of an ionic bond between magnesium and oxygen.',keywords:['magnesium','lose','2 electrons','Mg²⁺','oxygen','gain','O²⁻','attraction'],hint:'What happens to the electron configuration of Mg (2,8,2) and O (2,6) to form a stable octet?'},
    {prompt:'Explain why diamond has an extremely high melting point and is very hard.',keywords:['diamond','carbon','4 bonds','giant','covalent','network','hard','melting'],hint:'What type of structure does diamond form, and what bonds hold its atoms together?'},
    {prompt:'What is the difference between ionic bonding and covalent bonding in terms of electron behaviour?',keywords:['ionic','transfer','electrons','covalent','share','pairs','bonds'],hint:'One involves a complete movement of electrons; the other involves mutual possession of electrons.'},
    {prompt:'Explain why ice (solid water) has a low melting point compared to sodium chloride.',keywords:['ice','covalent','molecular','intermolecular','weak','NaCl','ionic','lattice','strong'],hint:'Compare the forces that must be overcome to melt ice versus the forces that must be overcome to melt NaCl.'},
    {prompt:'Describe the structure of a metal and explain why it is malleable.',keywords:['metallic','lattice','delocalised','layers','slide','malleable','bend'],hint:'How are the metal ions arranged, and why does the lattice not break when the metal is hammered?'},
    {prompt:'Explain why carbon dioxide is a gas at room temperature while silicon dioxide is a solid with a high melting point.',keywords:['CO₂','simple','molecular','weak','forces','SiO₂','giant','covalent','network'],hint:'Both contain covalent bonds, but one is simple molecular while the other is a giant structure.'},
    {prompt:'Draw a dot-and-cross diagram to show the bonding in a chlorine molecule (Cl₂).',keywords:['Cl₂','chlorine','covalent','shared','pair','lone','pairs','dot','cross'],hint:'How many outer electrons does each Cl atom have? How many do they share?'},
    {prompt:'Describe the shape of the ammonia molecule (NH₃) and explain why it has this shape.',keywords:['ammonia','pyramidal','lone','pair','repulsion','bonding','hydrogen','nitrogen'],hint:'Count the bonded atoms and the lone pairs on Nitrogen. How does the lone pair affect the geometry?'},
    {prompt:'Explain why alloys are generally harder and stronger than pure metals.',keywords:['alloy','different','sizes','atoms','distort','layers','slide','prevent'],hint:'How does adding different-sized atoms change the ability of the metal layers to slide over each other?'},
    {prompt:'Why do ionic compounds not conduct electricity in the solid state?',keywords:['solid','ions','fixed','lattice','static','conduct','movement','charge'],hint:'What is required for a material to conduct electricity, and why can\'t ions do that in a solid?'},
    {prompt:'Explain the term "dative covalent bond" and give an example.',keywords:['dative','coordinate','both','electrons','donor','acceptor','NH₄⁺'],hint:'What is the key difference between a normal covalent bond and a dative bond regarding the source of the shared electrons?'},
    {prompt:'Compare the melting points of simple molecular substances and giant ionic compounds.',keywords:['simple','molecular','weak','intermolecular','low','ionic','strong','electrostatic','high'],hint:'Which structure requires more energy to break apart, and why?'},
    {prompt:'Explain why graphite is a good conductor of electricity despite having covalent bonds.',keywords:['graphite','carbon','layers','delocalised','electrons','conduct','electricity'],hint:'Are there any free electrons that can move along the layers of the graphite structure?'},
    {prompt:'Why does water have a boiling point that is higher than many other simple molecules of similar molecular mass (e.g., CH₄)?',keywords:['water','hydrogen bonding','intermolecular','stronger','boiling','force','dipole'],hint:'What specific, strong type of intermolecular force exists between water molecules that does not exist between methane molecules?'},
    {prompt:'Describe the physical properties of ionic compounds, including state, melting point, electrical conductivity, and brittleness.',keywords:['solid','high','melting','conduct','molten','brittle','lattice','ions'],hint:'Think about the structure (giant lattice), the bonds (strong electrostatic), and the ability of ions to move.'},
  ],
});
</script></body></html>
