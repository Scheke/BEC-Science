<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Waves Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Waves — BGCSE Physics Quiz',
  color:'#00695c',dark:'#003d33',light:'#e0f2f1',
    mcq:[
    {q:'Transverse waves have oscillations that are:',opts:['Parallel to the direction of travel','Perpendicular to the direction of travel','Spiral shaped','In all directions at once'],ans:1,exp:'In TRANSVERSE waves, particles oscillate PERPENDICULAR (at 90°) to the direction of wave travel. Examples: light, water waves, seismic S-waves.'},
    {q:'The wave equation is:',opts:['v = f/λ','v = f × λ','f = v × λ','λ = f/v'],ans:1,exp:'Wave speed v = frequency f × wavelength λ. (v in m/s, f in Hz, λ in m). If f = 500 Hz and λ = 0.68m, then v = 500 × 0.68 = 340 m/s.'},
    {q:'Which electromagnetic wave has the highest frequency?',opts:['Radio waves','Visible light','X-rays','Gamma rays'],ans:3,exp:'The EM spectrum from lowest to highest frequency: Radio < Microwave < Infrared < Visible < UV < X-rays < GAMMA RAYS. Higher frequency = shorter wavelength = more energy per photon.'},
    {q:'Total internal reflection occurs when:',opts:['Light goes from dense to less dense medium at less than the critical angle','Light hits a mirror','Light hits at exactly the critical angle or greater going from dense to less dense','Light refracts at a boundary'],ans:2,exp:'TOTAL INTERNAL REFLECTION: occurs when light travels from a DENSER to a LESS DENSE medium and the ANGLE OF INCIDENCE ≥ CRITICAL ANGLE. The light is entirely reflected back into the denser medium. Used in optical fibres.'},
    {q:'An earthquake produces P-waves and S-waves. P-waves can travel through:',opts:['Solids only','Liquids only','Solids and liquids','Nothing — they are absorbed'],ans:2,exp:'P-waves (primary, longitudinal) can travel through SOLIDS AND LIQUIDS (and gases). S-waves (secondary, transverse) can travel through SOLIDS ONLY. This is how we know Earth has a liquid outer core — S-waves don\'t pass through it.'},
    {q:'Diffraction is most noticeable when:',opts:['Wavelength is much smaller than the gap','Wavelength equals or is similar to the size of the gap','Frequency is very high','The wave travels in a vacuum'],ans:1,exp:'DIFFRACTION is most pronounced when the WAVELENGTH ≈ size of the GAP or obstacle. If the wavelength is much smaller than the gap, little diffraction occurs. Radio waves diffract around buildings because their wavelength (~cm–m) is comparable to building sizes.'},
    {q:'If a wave has a frequency of 50 Hz and a wavelength of 2 m, what is its speed?',opts:['25 m/s','100 m/s','0.04 m/s','50 m/s'],ans:1,exp:'v = f × λ = 50 Hz × 2 m = 100 m/s. This uses the fundamental wave equation.'},
    {q:'Which property changes when a wave enters a different medium (refraction)?',opts:['Frequency','Wavelength and speed','Amplitude','Intensity'],ans:1,exp:'When a wave refracts, it changes medium, so its SPEED and WAVELENGTH change. The FREQUENCY remains CONSTANT because it is determined by the source of the wave.'},
    {q:'The critical angle for glass is approximately 42°. What happens if light in glass hits the glass-air boundary at 50°?',opts:['It refracts out','It undergoes total internal reflection','It is absorbed by the glass','It slows down and stops'],ans:1,exp:'Since the angle of incidence (50°) is GREATER than the critical angle (42°), TOTAL INTERNAL REFLECTION occurs. The light is completely reflected back into the glass, obeying the law of reflection.'},
    {q:'The electromagnetic wave with the longest wavelength is:',opts:['Gamma rays','Ultraviolet','Radio waves','Visible light'],ans:2,exp:'RADIO waves have the LONGEST wavelength (and lowest frequency) in the EM spectrum. They range from meters to kilometres. Gamma rays have the shortest wavelengths (femtometres).'},
    {q:'A sound wave is an example of a:',opts:['Transverse wave','Longitudinal wave','Standing wave','Surface wave'],ans:1,exp:'Sound waves are LONGITUDINAL waves. The particles of the medium oscillate PARALLEL to the direction of wave propagation, creating regions of compression (high pressure) and rarefaction (low pressure).'},
    {q:'Refraction of light is caused by:',opts:['A change in light intensity','A change in wave speed at the boundary between two media','A change in frequency','Absorption of light'],ans:1,exp:'Refraction occurs because the speed of light changes when it moves from one medium to another (e.g., from air to glass). This change in speed causes the wave to change direction unless it hits the boundary along the normal.'},
    {q:'Which EM wave is used for sterilising medical equipment?',opts:['Infrared','Ultraviolet','Gamma rays','Radio waves'],ans:2,exp:'GAMMA RAYS have very high energy and can kill bacteria and viruses. They are used to sterilise medical equipment, food, and surgical instruments without the need for high temperatures.'},
    {q:'In a longitudinal wave, the distance between two adjacent compressions is the:',opts:['Amplitude','Frequency','Wavelength','Period'],ans:2,exp:'In longitudinal waves, the WAVELENGTH is the distance between two consecutive COMPRESSIONS (or two consecutive RAREFACTIONS). This is analogous to the distance between two crests in a transverse wave.'},
    {q:'When light travels from glass (denser) to air (less dense), it:',opts:['Bends toward the normal','Bends away from the normal','Does not bend at all','Speeds up and bends towards the normal'],ans:1,exp:'When moving from a DENSER to a LESS DENSE medium (glass to air), light SPEEDS UP. According to Snell\'s Law, this causes the light ray to bend AWAY from the normal.'},
    {q:'The amplitude of a wave is:',opts:['The distance from crest to crest','The distance from the equilibrium position to the crest','The speed of the wave','The number of waves per second'],ans:1,exp:'AMPLITUDE is the maximum displacement of a particle from its equilibrium (rest) position. It relates to the energy and intensity of the wave. A larger amplitude = more energy.'},
    {q:'Which of the following is NOT a property of a wave?',opts:['Frequency','Wavelength','Speed','Mass'],ans:3,exp:'Waves transfer energy and information without transferring MASS. They have frequency, wavelength, speed, and amplitude. They do not have mass.'},
    {q:'X-rays are used in medicine to:',opts:['Destroy cancerous tumours','Image bones and teeth','Sterilise equipment','Heat tissues'],ans:1,exp:'X-rays are used for IMAGING because they can pass through soft tissues but are absorbed by denser materials like bone. They create an image of the skeleton or teeth on photographic film or a digital detector.'},
    {q:'The period (T) of a wave is related to frequency (f) by:',opts:['T = f²','T = 1/f','T = f × λ','T = f + λ'],ans:1,exp:'Period (T) is the time taken for one complete wave cycle. Frequency (f) is the number of cycles per second. They are inversely related: T = 1/f (seconds) and f = 1/T (Hertz).'},
    {q:'For a wave to undergo significant diffraction, the gap must be:',opts:['Very large compared to the wavelength','Very small compared to the wavelength','Approximately the same size as the wavelength','Exactly half the wavelength'],ans:2,exp:'Diffraction is most pronounced when the gap size or obstacle size is COMPARABLE to (similar to) the wavelength of the wave. If the gap is much smaller, you get almost spherical diffraction. If much larger, you get very little bending.'},
  ],
  match:[
    {term:'Transverse wave',def:'Oscillations are perpendicular to the direction of wave travel (e.g., light, water waves)'},
    {term:'Longitudinal wave',def:'Oscillations are parallel to the direction of wave travel (e.g., sound, P-waves)'},
    {term:'Wavelength (λ)',def:'The distance from one crest to the next (transverse) or compression to next compression (longitudinal)'},
    {term:'Frequency (f)',def:'The number of complete waves passing a point per second; measured in Hertz (Hz)'},
    {term:'Refraction',def:'The change in direction of a wave when it changes speed as it crosses a boundary between two media'},
    {term:'Total internal reflection (TIR)',def:'The complete reflection of a wave back into a denser medium when the angle of incidence exceeds the critical angle'},
    {term:'Diffraction',def:'The spreading out of waves when they pass through a gap or around an obstacle'},
    {term:'Amplitude',def:'The maximum displacement of a particle from its equilibrium position; related to wave energy'},
    {term:'Period (T)',def:'The time taken for one complete wave cycle; T = 1/f; measured in seconds'},
    {term:'Speed (v)',def:'The distance travelled by a wave per unit time; v = f × λ; measured in m/s'},
    {term:'Critical angle (c)',def:'The minimum angle of incidence in a denser medium that causes total internal reflection'},
    {term:'Normal',def:'An imaginary line drawn perpendicular to the surface at the point of incidence'},
    {term:'Electromagnetic spectrum',def:'The continuous range of electromagnetic waves, ordered by frequency/wavelength'},
    {term:'Gamma rays',def:'EM waves with the highest frequency, shortest wavelength, and most energy'},
    {term:'Radio waves',def:'EM waves with the lowest frequency, longest wavelength, and least energy'},
    {term:'Compression',def:'A region of high pressure/density in a longitudinal wave'},
    {term:'Rarefaction',def:'A region of low pressure/density in a longitudinal wave'},
    {term:'Optical fibre',def:'A thin glass/plastic fibre that transmits data using total internal reflection'},
    {term:'Ultrasound',def:'Sound waves with frequencies above the human hearing range (>20,000 Hz)'},
    {term:'Seismic waves',def:'Waves produced by earthquakes; includes P-waves (longitudinal) and S-waves (transverse)'},
  ],
  flashcards:[
    {q:'State the electromagnetic spectrum in order of increasing frequency.',a:'Radio → Microwave → Infrared → Visible light (ROYGBIV) → Ultraviolet → X-rays → Gamma rays.\n\nAll EM waves travel at the speed of light (3 × 10⁸ m/s) in a vacuum. Higher frequency = shorter wavelength = more energy per photon.'},
    {q:'Explain refraction of light at a boundary.',a:'Refraction occurs when light CHANGES SPEED as it crosses the boundary between two transparent media. When entering a DENSER medium (e.g., air to glass), it slows down and bends TOWARD the normal. When entering a LESS dense medium (e.g., glass to air), it speeds up and bends AWAY from the normal. Snell\'s Law relates the angles: n = sin i / sin r.'},
    {q:'What are the uses of ultrasound in medicine and industry?',a:'1. Medical imaging (foetal scans, organ imaging) — reflected pulses create images. 2. Breaking kidney stones (lithotripsy) using focused high-frequency sound. 3. SONAR (Sound Navigation and Ranging) for depth finding and submarine detection. 4. Industrial crack detection in metal structures.'},
    {q:'What is the difference between P-waves and S-waves?',a:'P-waves (Primary): LONGITUDINAL waves, travel through SOLIDS AND LIQUIDS, faster speed. S-waves (Secondary): TRANSVERSE waves, travel through SOLIDS ONLY, slower speed. Because S-waves do not pass through the Earth\'s core, scientists concluded the outer core is LIQUID.'},
    {q:'How do optical fibres use total internal reflection to transmit signals?',a:'Light enters the fibre and travels along the core. At the boundary between the glass core and the cladding (less dense medium), the angle of incidence is GREATER than the critical angle. This causes TOTAL INTERNAL REFLECTION, so the light bounces back into the core. It zigzags down the fibre, carrying data over long distances with minimal loss.'},
    {q:'Calculate the speed of a wave with frequency 200 Hz and wavelength 1.5 m.',a:'v = f × λ = 200 Hz × 1.5 m = 300 m/s. This is the speed at which the wave propagates through the medium.'},
    {q:'Explain why AM radio waves can diffract around hills but X-rays cannot.',a:'Diffraction occurs significantly when the wavelength is COMPARABLE to the size of the obstacle/gap. AM radio waves have very LONG wavelengths (hundreds of metres), similar to the size of a hill, so they diffract easily. X-rays have extremely SHORT wavelengths (atomic scale), far smaller than a hill, so they show negligible diffraction.'},
    {q:'Describe the difference between transverse and longitudinal waves with examples.',a:'TRANSVERSE: Oscillations are perpendicular to the direction of wave travel (e.g., water waves, EM waves, S-waves). LONGITUDINAL: Oscillations are parallel to the direction of wave travel (e.g., sound waves, P-waves).'},
    {q:'What is the relationship between the speed, frequency, and wavelength of a wave?',a:'Wave speed (v) = frequency (f) × wavelength (λ). This is the wave equation. Speed is measured in m/s, frequency in Hz, and wavelength in metres. If the speed is constant (e.g., light in a vacuum), frequency and wavelength are inversely proportional.'},
    {q:'Calculate the wavelength of a sound wave with frequency 440 Hz, travelling at 340 m/s.',a:'λ = v/f = 340 m/s / 440 Hz = 0.77 m. This means the distance between two adjacent compressions is 0.77 metres.'},
    {q:'Explain the conditions required for total internal reflection to occur.',a:'TIR requires THREE conditions: 1) Light must travel from a DENSER medium to a LESS DENSE medium. 2) The angle of incidence must be GREATER THAN the critical angle. 3) The critical angle must be defined for that specific pair of media.'},
    {q:'What are the main uses of the different regions of the electromagnetic spectrum?',a:'Radio: broadcasting. Microwave: cooking, satellite. Infrared: heaters, thermal cameras. Visible: sight. UV: sunbeds, sterilisation. X-ray: medical imaging. Gamma: cancer radiotherapy, sterilisation.'},
    {q:'Why is the frequency of a wave unchanged when it refracts?',a:'The frequency of a wave is determined by the SOURCE (e.g., the vibrating object or electron transition). When it enters a new medium, its speed changes, which alters the wavelength, but the frequency remains constant because it is an intrinsic property of the wave source.'},
    {q:'What is the critical angle of a medium?',a:'The critical angle (c) is the specific angle of incidence in the denser medium that results in an angle of refraction of EXACTLY 90° in the less dense medium. Any angle of incidence greater than the critical angle results in total internal reflection.'},
    {q:'How is ultrasound used to generate images of a developing foetus?',a:'A transducer emits high-frequency pulses into the body. The pulses are partially REFLECTED at boundaries between different tissues (e.g., fluid vs bone). By measuring the time taken for the echoes to return, a computer builds up a 2D or 3D image of the foetus.'},
    {q:'Compare the properties of radio waves and gamma rays.',a:'RADIO: longest wavelength, lowest frequency, lowest energy, used for communication. GAMMA: shortest wavelength, highest frequency, highest energy, used for sterilisation/cancer treatment. Both are EM waves and travel at 3×10⁸ m/s in a vacuum.'},
    {q:'Define the amplitude of a wave and state what it affects.',a:'Amplitude is the MAXIMUM DISPLACEMENT of a point on the wave from its equilibrium position. It affects the ENERGY and INTENSITY of the wave. A larger amplitude means more energy is being transferred (e.g., a louder sound or brighter light).'},
    {q:'A wave completes 20 cycles in 2 seconds. Calculate its frequency and period.',a:'Frequency (f) = number of cycles / time = 20/2 = 10 Hz. Period (T) = 1/f = 1/10 = 0.1 seconds. This means each cycle takes 0.1 seconds.'},
    {q:'Explain why the speed of sound is different in solids, liquids, and gases.',a:'Sound travels fastest in SOLIDS because particles are tightly packed and strongly bonded, allowing vibrations to pass on quickly. It is slower in LIQUIDS (particles further apart), and slowest in GASES (particles very far apart). Speed increases with rigidity and density.'},
    {q:'Why are gamma rays used to treat cancer (radiotherapy) despite being dangerous?',a:'Gamma rays are highly PENETRATING and carry large amounts of energy. They can be focused on a deep tumour. The high energy damages and destroys the DNA of cancer cells, preventing them from dividing. The beam is rotated or shielded to minimise damage to surrounding healthy tissue.'},
  ],
  blanks:{
    passage:'In a transverse wave, the oscillations are [_] to the direction of energy transfer. In a longitudinal wave, the oscillations are [_] to the direction of energy transfer. The wave equation is speed = frequency × [_]. The EM wave with the highest frequency is [_] radiation. When light slows down and bends towards the normal at a boundary, the process is called [_]. When light hits a glass-air boundary at an angle greater than the critical angle, it undergoes [_].',
    answers:['perpendicular','parallel','wavelength','gamma','refraction','total internal reflection'],
    wordbank:['perpendicular','parallel','wavelength','gamma','refraction','total internal reflection','diffraction','transverse'],
  },
  sentences:[
    {prompt:'Explain how optical fibres use total internal reflection to transmit digital data across the world.',keywords:['critical angle','denser glass','cladding','boundary','reflected','signal','data'],hint:'At what angle must the light hit the internal glass boundary? What happens to the signal as it travels down the fibre?'},
    {prompt:'Explain why long-wave AM radio signals can diffract around large hills and buildings, but short-wave X-rays cannot.',keywords:['wavelength','gap','diffraction','comparable','frequency','AM','X-rays','obstacle'],hint:'Compare the wavelength of AM radio waves to the size of a hill. How does the relationship between wavelength and gap size affect the amount of diffraction?'},
    {prompt:'A wave has a frequency of 400 Hz and travels at a speed of 320 m/s. Calculate its wavelength and explain what this value represents.',keywords:['v = fλ','λ = v/f','0.8 m','wavelength','320','400'],hint:'Rearrange the wave equation (v = f × λ) to solve for wavelength (λ = v / f). What physical distance does this value represent in the wave?'},
    {prompt:'Describe the differences between the three types of seismic waves: P-waves, S-waves, and surface waves.',keywords:['P-waves','longitudinal','liquids','solids','fast','S-waves','transverse','solids only','surface waves','damage'],hint:'Think about the direction of oscillation, the materials they can travel through, and their relative speeds.'},
    {prompt:'A light ray travels from water (denser) into air (less dense) at an angle of 50° to the normal. If the critical angle of water is 48.6°, describe and explain what happens to the light ray.',keywords:['critical angle','50°','greater','TIR','total internal reflection','water','air','denser','less dense'],hint:'Compare the angle of incidence to the critical angle. What condition must be met for total internal reflection to occur?'},
    {prompt:'Explain why a swimming pool appears shallower than it actually is when viewed from above.',keywords:['refraction','water','air','denser','less dense','away from normal','apparent depth'],hint:'How does light behave when it travels from water into air? How does this affect the position of the image seen by the eye?'},
    {prompt:'Calculate the frequency of a microwave with a wavelength of 0.12 m. (Speed of light = 3.0 × 10⁸ m/s)',keywords:['f = v/λ','3.0×10⁸','0.12','2.5×10⁹ Hz','frequency','microwave'],hint:'Use the wave equation rearranged for frequency: f = v / λ.'},
    {prompt:'Explain the role of the core and the cladding in an optical fibre.',keywords:['core','cladding','denser','less dense','TIR','total internal reflection','light','signal'],hint:'Which part carries the light? Which part surrounds it? How do their refractive indices differ to ensure total internal reflection?'},
    {prompt:'A student measures a wave and finds that 5 complete crests pass a point in 2 seconds. Calculate the frequency and period of the wave.',keywords:['5 crests','2 seconds','frequency','2.5 Hz','period','0.4 s'],hint:'Frequency is the number of complete cycles per second. Period is the time for one complete cycle (T = 1/f).'},
    {prompt:'Explain how an ultrasound scanner uses wave reflection to produce an image of an organ.',keywords:['ultrasound','transducer','reflect','echo','time','boundary','image'],hint:'What happens to the ultrasound pulse when it hits a boundary between different tissues? How is this used to build a picture?'},
    {prompt:'A sound wave travels through air at 340 m/s. If the frequency of the sound is 680 Hz, calculate its wavelength.',keywords:['340 m/s','680 Hz','λ = v/f','0.5 m','wavelength','sound wave'],hint:'Use the wave equation rearranged for wavelength.'},
    {prompt:'Explain why a prism splits white light into a spectrum of colours.',keywords:['prism','white light','dispersion','refraction','different wavelengths','angles','spectrum'],hint:'How does the speed of light in glass depend on its colour (wavelength)? How does this affect refraction?'},
    {prompt:'Compare the penetration power and uses of X-rays and gamma rays.',keywords:['X-rays','bone imaging','gamma','cancer treatment','penetrating','ionising','shielding'],hint:'Which is used for imaging and which for destroying cells? Why is lead shielding important for both?'},
    {prompt:'Explain how the Earth\'s internal structure has been mapped using seismic waves.',keywords:['seismic waves','P-waves','liquids','solids','S-waves','shadow zone','outer core','liquid'],hint:'Why do S-waves not pass through the centre of the Earth? What does this tell us about the state of the outer core?'},
    {prompt:'A wave has a speed of 12 m/s and a wavelength of 3 m. What is its frequency?',keywords:['v=12','λ=3','f=v/λ','4 Hz','frequency','wave'],hint:'Rearrange v = fλ to solve for f.'},
    {prompt:'Describe how you would measure the speed of sound in air using an echo method.',keywords:['echo','sound','distance','time','speed','2d/t','measuring tape','stopwatch'],hint:'How can you measure the time for a sound to travel to a wall and back? What measurements are needed to calculate speed?'},
    {prompt:'A star emits light. How does the redshift of the light help scientists determine the star\'s movement?',keywords:['redshift','wavelength','increase','moving away','Doppler effect','frequency','universe expanding'],hint:'What happens to the wavelength of light from an object moving away from the observer?'},
    {prompt:'Explain the difference between a mechanical wave and an electromagnetic wave.',keywords:['mechanical','medium','sound','water','electromagnetic','vacuum','light','radio'],hint:'One requires a material medium to travel; the other can travel through a vacuum.'},
    {prompt:'Why is the speed of light constant in a vacuum but not in a medium like glass?',keywords:['vacuum','constant','medium','glass','interact','electrons','slows down','refractive index'],hint:'What happens to the photons when they interact with the atoms in a transparent material?'},
    {prompt:'Calculate the period of a wave with a frequency of 250 Hz.',keywords:['T=1/f','250 Hz','0.004 s','period','inverse','frequency'],hint:'Use the relationship T = 1/f.'},
  ],
});
</script></body></html>
