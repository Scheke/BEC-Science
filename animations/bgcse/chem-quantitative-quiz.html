<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quantitative Chemistry Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Quantitative Chemistry — BGCSE Chemistry Quiz',
  color:'#006064',dark:'#00363a',light:'#e0f7fa',
    mcq:[
    {q:'The molar mass of H₂O (H=1, O=16) is:',opts:['17 g/mol','18 g/mol','16 g/mol','34 g/mol'],ans:1,exp:'Molar mass of H₂O = (2×1) + 16 = 2 + 16 = 18 g/mol. One mole of water has a mass of 18 grams.'},
    {q:'How many moles are in 44g of CO₂ (C=12, O=16)?',opts:['2 mol','0.5 mol','1 mol','44 mol'],ans:2,exp:'Molar mass of CO₂ = 12 + (2×16) = 44 g/mol. Moles = mass/molar mass = 44/44 = 1 mol.'},
    {q:'The law of conservation of mass states:',opts:['Mass increases in chemical reactions','Total mass of reactants equals total mass of products','Mass is lost as energy','Atoms are created during reactions'],ans:1,exp:'LAW OF CONSERVATION OF MASS: atoms are neither created nor destroyed in a chemical reaction. Total mass of REACTANTS = total mass of PRODUCTS. This is why balanced equations have equal numbers of each atom on both sides.'},
    {q:'What is the percentage by mass of oxygen in CO₂?',opts:['36%','72.7%','27.3%','50%'],ans:1,exp:'% O in CO₂ = (mass of O / molar mass) × 100 = (32/44) × 100 = 72.7%.'},
    {q:'A solution has concentration 2 mol/dm³ and volume 0.5 dm³. How many moles of solute?',opts:['4 mol','0.25 mol','2.5 mol','1 mol'],ans:3,exp:'Moles = concentration × volume = 2 mol/dm³ × 0.5 dm³ = 1 mol.'},
    {q:'In the reaction 2H₂ + O₂ → 2H₂O, how many moles of water form from 4 moles of H₂?',opts:['2 mol','4 mol','8 mol','1 mol'],ans:1,exp:'From the equation: 2 mol H₂ → 2 mol H₂O (1:1 ratio). So 4 mol H₂ → 4 mol H₂O.'},
    {q:'What is the mass of 0.1 moles of calcium carbonate, CaCO₃ (Ca=40, C=12, O=16)?',opts:['10 g','100 g','1 g','20 g'],ans:0,exp:'Molar mass of CaCO₃ = 40 + 12 + (3×16) = 100 g/mol. Mass = moles × molar mass = 0.1 × 100 = 10 g.'},
    {q:'The empirical formula of a compound is CH₂. If its molar mass is 56 g/mol (C=12, H=1), what is its molecular formula?',opts:['CH₂','C₂H₄','C₄H₈','C₃H₆'],ans:2,exp:'Mass of empirical formula (CH₂) = 12 + 2 = 14 g/mol. Molecular mass / Empirical mass = 56 / 14 = 4. Multiply empirical formula by 4: (CH₂)₄ = C₄H₈.'},
    {q:'What volume does 0.5 moles of oxygen gas occupy at Room Temperature and Pressure (RTP, 24 dm³/mol)?',opts:['12 dm³','24 dm³','6 dm³','48 dm³'],ans:0,exp:'Volume = moles × 24 dm³ = 0.5 × 24 = 12 dm³ (12,000 cm³). At RTP, 1 mole of any gas occupies 24 dm³.'},
    {q:'A student collected 4.5g of product in an experiment. The theoretical yield was 6.0g. What is the percentage yield?',opts:['75%','133%','66%','25%'],ans:0,exp:'% Yield = (actual yield / theoretical yield) × 100 = (4.5 / 6.0) × 100 = 75%.'},
    {q:'How many moles of sodium hydroxide (NaOH) are in 250 cm³ of a 0.1 mol/dm³ solution?',opts:['0.25 mol','0.025 mol','2.5 mol','0.1 mol'],ans:1,exp:'Volume = 250 cm³ = 0.25 dm³. Moles = concentration × volume = 0.1 × 0.25 = 0.025 mol.'},
    {q:'A compound has the percentage composition: 40% Carbon, 6.7% Hydrogen, 53.3% Oxygen. What is its empirical formula? (C=12, H=1, O=16)',opts:['CH₂O','C₃H₆O','CHO₂','C₂H₆O'],ans:0,exp:'Moles: C = 40/12 = 3.33; H = 6.7/1 = 6.7; O = 53.3/16 = 3.33. Divide by smallest: C = 1, H = 2, O = 1. Empirical formula = CH₂O.'},
    {q:'In the reaction N₂ + 3H₂ → 2NH₃, how many moles of hydrogen are needed to produce 4 moles of ammonia?',opts:['4 mol','6 mol','8 mol','2 mol'],ans:1,exp:'Equation ratio: 3 mol H₂ → 2 mol NH₃. So 6 mol H₂ → 4 mol NH₃ (multiply both sides by 2).'},
    {q:'Avogadro\'s number is:',opts:['6.02 × 10²³','6.02 × 10²²','6.02 × 10²⁴','1.2 × 10²³'],ans:0,exp:'Avogadro\'s constant = 6.02 × 10²³ mol⁻¹. It is the number of atoms, molecules, or ions in exactly ONE MOLE of a substance.'},
    {q:'What is the molar mass of hydrated copper(II) sulfate, CuSO₄·5H₂O? (Cu=64, S=32, O=16, H=1)',opts:['160 g/mol','250 g/mol','240 g/mol','230 g/mol'],ans:1,exp:'CuSO₄ = 64 + 32 + (4×16) = 160. 5H₂O = 5 × 18 = 90. Total = 160 + 90 = 250 g/mol.'},
    {q:'How many moles of atoms are present in 20 g of calcium (Ca=40)?',opts:['2 mol','0.5 mol','1 mol','4 mol'],ans:1,exp:'Moles = mass / molar mass = 20 / 40 = 0.5 mol of calcium atoms.'},
    {q:'Why is the percentage yield rarely 100% in a laboratory experiment?',opts:['The law of conservation of mass is wrong','Side reactions occur and product is lost during transfers','The chemical equation is unbalanced','The molar mass is calculated incorrectly'],ans:1,exp:'In real experiments, some product is lost when filtering, washing, or transferring liquids. Additionally, side reactions may occur, or the reaction may not go to completion. These reasons prevent 100% yield.'},
    {q:'The concentration of a solution is 0.5 mol/dm³. How many grams of NaOH (Na=23, O=16, H=1) are in 2 dm³ of this solution?',opts:['40 g','20 g','60 g','80 g'],ans:0,exp:'Moles = 0.5 × 2 = 1 mol. Molar mass of NaOH = 23 + 16 + 1 = 40 g/mol. Mass = 1 × 40 = 40 g.'},
    {q:'Which of the following contains the largest number of particles?',opts:['1 mole of O₂','1 mole of H₂O','1 mole of NaCl','All contain the same number of particles'],ans:3,exp:'One MOLE of ANY substance always contains the SAME number of particles (Avogadro\'s constant, 6.02×10²³), regardless of what the substance is. Only the mass differs.'},
    {q:'If 10g of calcium carbonate (CaCO₃) is heated to form 5.6g of calcium oxide (CaO), what is the percentage yield? (Ca=40, C=12, O=16)',opts:['100%','56%','80%','50%'],ans:0,exp:'CaCO₃ → CaO + CO₂. Molar mass CaCO₃ = 100. Molar mass CaO = 56. 10g CaCO₃ = 0.1 mol. Theoretical yield of CaO = 0.1 × 56 = 5.6g. Actual yield = 5.6g. % Yield = (5.6/5.6) × 100 = 100%.'},
  ],
  match:[
    {term:'Mole',def:'The SI unit for amount of substance; contains 6.02×10²³ particles (Avogadro\'s number)'},
    {term:'Molar mass',def:'The mass of one mole of a substance in grams per mole (g/mol); numerically equal to relative formula mass'},
    {term:'Concentration',def:'The amount of solute dissolved in a given volume of solution, expressed in mol/dm³'},
    {term:'Empirical formula',def:'The simplest whole-number ratio of atoms of each element in a compound'},
    {term:'Molecular formula',def:'The actual number of atoms of each element in one molecule of a compound'},
    {term:'Yield',def:'The amount of product actually obtained from a chemical reaction'},
    {term:'Theoretical yield',def:'The maximum mass of product calculated from the balanced equation using molar ratios'},
    {term:'Percentage yield',def:'(Actual yield / Theoretical yield) × 100; measures the efficiency of a reaction'},
    {term:'Avogadro\'s constant',def:'6.02 × 10²³ mol⁻¹; the number of particles in one mole of any substance'},
    {term:'Molar volume',def:'The volume occupied by one mole of a gas; 24 dm³ at RTP'},
    {term:'Stoichiometry',def:'The molar relationship between the quantities of reactants and products in a chemical reaction'},
    {term:'Limiting reagent',def:'The reactant that is completely used up first; determines the maximum amount of product formed'},
    {term:'Excess reagent',def:'A reactant that is present in a greater quantity than needed; some remains after the reaction'},
    {term:'Hydrated salt',def:'A salt that contains water molecules within its crystal structure (e.g., CuSO₄·5H₂O)'},
    {term:'Anhydrous salt',def:'A salt that has had its water of crystallisation removed by heating'},
    {term:'Balanced equation',def:'A chemical equation where the number of atoms of each element is the same on both sides'},
    {term:'Molar ratio',def:'The ratio in which substances react, given by the coefficients in the balanced equation'},
    {term:'Gas volume',def:'Volume of gas calculated using moles × molar volume (24 dm³ at RTP)'},
    {term:'Solute',def:'The substance that is dissolved in a solvent to make a solution'},
    {term:'Solution',def:'A homogenous mixture of a solute dissolved in a solvent'},
  ],
  flashcards:[
    {q:'State the formula triangle for moles, mass, and molar mass.',a:'Moles = mass ÷ molar mass\nMass = moles × molar mass\nMolar mass = mass ÷ moles\n\n(Triangle: Mass on top, Moles × Molar Mass at bottom).'},
    {q:'What is Avogadro\'s number and what does it represent?',a:'Avogadro\'s constant = 6.02 × 10²³ mol⁻¹. It is the number of particles (atoms, molecules, or ions) in ONE MOLE of any substance. Example: 1 mol of H₂O contains 6.02×10²³ water molecules.'},
    {q:'How do you find the empirical formula from percentage composition?',a:'1. Assume 100g sample, so % becomes mass in grams.\n2. Divide each mass by its molar mass to find moles.\n3. Divide all mole values by the smallest mole value.\n4. Round to the nearest whole number ratio → empirical formula.'},
    {q:'What is the difference between empirical and molecular formula?',a:'EMPIRICAL formula = simplest whole-number ratio (e.g., CH₂O for glucose). MOLECULAR formula = actual number of atoms in a molecule (C₆H₁₂O₆ for glucose). Molecular formula is a whole-number multiple of the empirical formula.'},
    {q:'How do you calculate theoretical yield and percentage yield?',a:'Theoretical yield: Use molar ratios from the balanced equation to calculate the maximum possible mass of product. % Yield = (Actual yield ÷ Theoretical yield) × 100%. Yield is less than 100% due to incomplete reactions, side reactions, or product loss during separation.'},
    {q:'What volume does 1 mole of gas occupy at RTP (room temperature and pressure)?',a:'At RTP, 1 mole of any gas occupies 24 dm³ (24,000 cm³). Therefore, Volume of gas (dm³) = moles × 24 dm³.'},
    {q:'Explain the relationship between moles, concentration, and volume.',a:'The equation is: Moles = Concentration (mol/dm³) × Volume (dm³). This is used to calculate the amount of solute in a solution or to find unknown concentrations during titrations.'},
    {q:'Describe how to calculate the mass of 3 moles of sodium carbonate (Na₂CO₃).',a:'First calculate molar mass: Na₂CO₃ = (23×2) + 12 + (16×3) = 46 + 12 + 48 = 106 g/mol. Then, Mass = moles × molar mass = 3 × 106 = 318g.'},
    {q:'What is the difference between a hydrated and an anhydrous salt?',a:'HYDRATED salt contains water molecules within its crystal lattice (e.g., CuSO₄·5H₂O is blue). ANHYDROUS salt has had the water of crystallisation removed by heating (e.g., CuSO₄ is white).'},
    {q:'Why does a balanced equation need to be used for mole calculations?',a:'A balanced equation gives the STOICHIOMETRIC ratios (molar ratios) between reactants and products. It tells us exactly how many moles of one substance react with or produce another. Using incorrect ratios leads to wrong calculations.'},
    {q:'How do you calculate the number of moles of sodium chloride in 117 grams? (Na=23, Cl=35.5)',a:'Molar mass NaCl = 23 + 35.5 = 58.5 g/mol. Moles = mass / molar mass = 117 / 58.5 = 2 mol.'},
    {q:'Explain what is meant by the "limiting reagent" in a reaction.',a:'The LIMITING REAGENT is the reactant that is completely used up first. Once it is gone, the reaction stops. It determines the MAXIMUM amount of product that can be formed. The other reactant is said to be "in excess".'},
    {q:'What does the formula "V = n × 24" represent in gas calculations at RTP?',a:'It is the formula for calculating the volume of a gas at Room Temperature and Pressure (RTP). V = volume in dm³, n = number of moles of gas, 24 = molar volume in dm³/mol at RTP.'},
    {q:'Describe the steps to find the molecular formula of a compound given its empirical formula and molar mass.',a:'1. Calculate the mass of the empirical formula.\n2. Divide the given molar mass by the empirical mass (find the multiplier n).\n3. Multiply the empirical formula by n to get the molecular formula.'},
    {q:'Why does 1 dm³ of water have a mass of 1000g?',a:'The density of water is 1 g/cm³. Since 1 dm³ = 1000 cm³, the mass of 1 dm³ of water = 1000 cm³ × 1 g/cm³ = 1000g. This is why 1 cm³ of water is 1g.'},
    {q:'How is the percentage yield useful in industrial chemistry?',a:'Percentage yield allows chemists to measure the EFFICIENCY of an industrial process. A high percentage yield indicates high efficiency and low waste, which is economically important. It helps in evaluating catalysts and reaction conditions.'},
    {q:'Convert 150 cm³ of solution into dm³.',a:'Since 1 dm³ = 1000 cm³, divide the volume in cm³ by 1000. 150 cm³ ÷ 1000 = 0.15 dm³.'},
    {q:'Explain why the molar mass in g/mol is numerically equal to the relative formula mass (Mr).',a:'Relative formula mass is the mass of one formula unit compared to 1/12th of a carbon-12 atom. Since one mole contains Avogadro\'s number of particles, the mass in grams of one mole (molar mass) is exactly the same number as the relative formula mass.'},
    {q:'Calculate the percentage of nitrogen in ammonium nitrate, NH₄NO₃. (N=14, H=1, O=16)',a:'Molar mass NH₄NO₃ = 14 + (4×1) + 14 + (3×16) = 80 g/mol. Total mass of Nitrogen = 14 + 14 = 28 g/mol. %N = (28/80) × 100 = 35%.'},
    {q:'What information is required to calculate the mass of a product in a reaction?',a:'You need: 1. A balanced equation (molar ratios). 2. The mass or moles of the limiting reagent. 3. The molar mass of the product. Using these, you can calculate the theoretical yield.'},
  ],
  blanks:{
    passage:'The unit for amount of substance is the [_]. One mole contains 6.02×10²³ particles, which is called [_] constant. To calculate moles, divide the mass by the [_] mass. A compound\'s [_] formula shows the simplest whole-number ratio of atoms, whereas the [_] formula shows the actual number of atoms in a molecule.',
    answers:['mole','Avogadro\'s','molar','empirical','molecular'],
    wordbank:['mole','Avogadro\'s','molar','empirical','molecular','relative','stoichiometric','percentage'],
  },
  sentences:[
    {prompt:'Calculate the mass of 2.5 moles of sodium chloride, NaCl (Na=23, Cl=35.5).',keywords:['molar mass','58.5 g/mol','2.5','146.25 g','mass','moles'],hint:'First find the molar mass of NaCl by adding the atomic masses, then multiply the molar mass by the number of moles.'},
    {prompt:'Explain why the percentage yield of a reaction in a laboratory is rarely 100%.',keywords:['incomplete','side reactions','loss','actual','theoretical','transfer','filtration'],hint:'Think about what practical issues can occur during the experiment that prevent you from collecting the entire product.'},
    {prompt:'Explain what a balanced chemical equation tells us about the amounts of reactants and products.',keywords:['molar ratios','stoichiometry','conservation of mass','atoms','moles','coefficients'],hint:'What do the numbers in front of the chemical formulas (coefficients) represent in terms of moles and atoms?'},
    {prompt:'Calculate the number of moles in 22g of carbon dioxide, CO₂ (C=12, O=16).',keywords:['moles','mass','molar mass','44 g/mol','22g','0.5 mol'],hint:'First calculate the molar mass of CO₂. Then use the formula: Moles = mass ÷ molar mass.'},
    {prompt:'Describe the steps to calculate the empirical formula of a compound from its percentage composition.',keywords:['percentage','mass','moles','divide','smallest','ratio','empirical'],hint:'Assume 100g, convert percentages to grams, divide by atomic mass, find the smallest mole ratio, and round to whole numbers.'},
    {prompt:'A solution has a concentration of 0.2 mol/dm³ and a volume of 0.5 dm³. Calculate the moles of solute.',keywords:['concentration','volume','moles','0.2','0.5','0.1 mol'],hint:'Use the formula: Moles = Concentration × Volume.'},
    {prompt:'Explain the difference between empirical formula and molecular formula using water and glucose as examples.',keywords:['empirical','simplest ratio','molecular','actual number','H₂O','CH₂O','C₆H₁₂O₆'],hint:'One gives the simplest ratio, the other gives the exact actual number of atoms in the molecule.'},
    {prompt:'Calculate the percentage yield if the actual yield is 8g and the theoretical yield is 10g.',keywords:['percentage yield','actual','theoretical','8g','10g','80%'],hint:'Use the formula: (Actual yield / Theoretical yield) × 100.'},
    {prompt:'A student reacts 4g of sodium hydroxide with excess acid. The expected yield of salt is 5.85g. The student collects 5g. Calculate the percentage yield.',keywords:['5.85g','theoretical','5g','actual','percentage yield','85.5%'],hint:'Plug the actual and theoretical yields into the percentage yield formula.'},
    {prompt:'Describe how to convert a volume of 250 cm³ into dm³.',keywords:['250 cm³','divide','1000','0.25 dm³','conversion','volume'],hint:'Remember that 1 dm³ = 1000 cm³.'},
    {prompt:'Explain the role of the limiting reagent in a chemical reaction.',keywords:['limiting reagent','product','maximum','stopped','excess','determines'],hint:'What happens to the reaction when the limiting reagent is completely used up? What does it determine?'},
    {prompt:'Calculate the molar mass of magnesium nitrate, Mg(NO₃)₂. (Mg=24, N=14, O=16)',keywords:['Mg','24','N','14','O','16','148 g/mol'],hint:'Add the masses: Mg + (2 × N) + (6 × O).'},
    {prompt:'Explain why the mole is considered the "bridge" between the microscopic and macroscopic worlds.',keywords:['mole','Avogadro','particles','grams','atoms','molecules','scale'],hint:'The mole allows chemists to convert between the tiny atomic scale (number of particles) and the real-world laboratory scale (mass in grams).'},
    {prompt:'Calculate the volume occupied by 0.25 moles of nitrogen gas at RTP (1 mole = 24 dm³).',keywords:['moles','0.25','24 dm³','volume','6 dm³','RTP'],hint:'Use the formula: Volume = moles × 24 dm³.'},
    {prompt:'Explain why we use the molar volume of a gas (24 dm³ at RTP) instead of its molar mass in gas calculations.',keywords:['gas','volume','moles','RTP','24 dm³','temperature','pressure'],hint:'For gases, volume is easier to measure than mass. At the same temperature and pressure, equal volumes of gases contain equal numbers of moles (Avogadro\'s law).'},
    {prompt:'How many grams of oxygen are there in 0.1 moles of O₂ (O=16)?',keywords:['moles','0.1','O₂','32 g/mol','mass','3.2g'],hint:'Molar mass of O₂ is 32 g/mol. Mass = moles × molar mass.'},
    {prompt:'Explain why the reactants in an experiment might not have a 1:1 molar ratio according to the balanced equation.',keywords:['balanced equation','coefficients','stoichiometry','ratio','moles','atoms'],hint:'The coefficients in the balanced equation dictate the exact molar ratios in which substances react.'},
    {prompt:'A sample contains 60g of carbon and 10g of hydrogen. Calculate the empirical formula (C=12, H=1).',keywords:['60g','carbon','10g','hydrogen','moles','ratio','CH₂','empirical'],hint:'Convert masses to moles, then divide by the smallest value to find the simplest ratio.'},
    {prompt:'Why is it important to use a balanced chemical equation when calculating the mass of a product formed?',keywords:['balanced','atom count','conservation of mass','molar ratios','stoichiometry','product'],hint:'If the equation is not balanced, what does it incorrectly tell you about the relationship between reactants and products?'},
    {prompt:'Describe the difference between a 1 mol/dm³ solution and a 0.5 mol/dm³ solution.',keywords:['concentration','mol/dm³','1 mol','0.5 mol','solute','litre'],hint:'One is twice as concentrated as the other. Compare the number of moles of solute in each 1 dm³ of solution.'},
  ],
});
</script></body></html>
