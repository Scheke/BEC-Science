<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cell Transport Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Cell Transport — BGCSE Biology Quiz',
  color:'#1b5e20',dark:'#0a3d12',light:'#e8f5e9',
    mcq:[
    {q:'Which process moves substances from HIGH to LOW concentration without energy?',opts:['Active transport','Osmosis','Diffusion','Filtration'],ans:2,exp:'Diffusion is the passive movement of particles from a high concentration to a low concentration region — down the concentration gradient. No energy (ATP) is needed.'},
    {q:'Osmosis is the movement of:',opts:['Solutes through a membrane','Water molecules through a partially permeable membrane','Glucose by carrier proteins','Ions against a gradient'],ans:1,exp:'Osmosis is specifically the movement of WATER molecules from an area of high water concentration (dilute solution) to low water concentration (concentrated solution) through a partially permeable membrane.'},
    {q:'Active transport differs from diffusion because it:',opts:['Moves particles down a gradient','Requires ATP energy and carrier proteins','Occurs only in animal cells','Does not need a membrane'],ans:1,exp:'Active transport moves particles AGAINST a concentration gradient (low to high). It requires ATP energy AND specific carrier proteins. Example: root hair cells absorbing nitrate ions from soil.'},
    {q:'A plant cell placed in a very concentrated salt solution will:',opts:['Burst (lyse)','Become turgid','Become plasmolysed (shrink)','Stay the same'],ans:2,exp:'In a concentrated (hypertonic) solution, water leaves the plant cell by osmosis. The vacuole shrinks and the cell membrane pulls away from the cell wall — this is PLASMOLYSIS.'},
    {q:'Which organelle provides ATP for active transport?',opts:['Ribosome','Chloroplast','Mitochondrion','Nucleus'],ans:2,exp:'Mitochondria carry out aerobic respiration and produce ATP. Active transport uses this ATP to power carrier proteins that move ions/molecules against their concentration gradient.'},
    {q:'Root hair cells absorb nitrate ions against a concentration gradient. This is:',opts:['Diffusion','Osmosis','Active transport','Facilitated diffusion'],ans:2,exp:'Soil water usually has LOWER nitrate concentration than root cells, so nitrate must be absorbed AGAINST the gradient. This requires ATP and carrier proteins — it is ACTIVE TRANSPORT.'},
    {q:'A red blood cell placed in a hypotonic (dilute) solution will:',opts:['Shrink and shrivel','Burst (lyse)','Stay unchanged','Become crenated'],ans:1,exp:'In a hypotonic solution (more water outside), water moves INTO the red blood cell by osmosis. Because animal cells lack a cell wall, they swell up and can eventually BURST (lyse).'},
    {q:'Which factor does NOT affect the rate of diffusion?',opts:['Temperature','Surface area','Distance','Colour of the substance'],ans:3,exp:'Colour has no effect on diffusion rate. However, HIGHER temperature, LARGER surface area, and SHORTER distance all increase the rate of diffusion.'},
    {q:'In active transport, carrier proteins are required. What do they do?',opts:['They make the membrane thicker','They pump molecules against the gradient using ATP','They let water pass through','They dissolve the cell wall'],ans:1,exp:'Carrier proteins are specific binding sites on the membrane. They bind to the molecule/ion, change shape, and pump it across the membrane against the concentration gradient using energy from ATP.'},
    {q:'Which of the following requires NO metabolic energy?',opts:['Active transport','Diffusion','Phagocytosis','Exocytosis'],ans:1,exp:'DIFFUSION is a passive process. It occurs due to the natural random motion of particles. Active transport, phagocytosis, and exocytosis all require ATP energy.'},
    {q:'A plant cell that is turgid has:',opts:['Lost water and shrunk','Taken in water and is swollen','Plasmolysed','Died completely'],ans:1,exp:'TURGID means a plant cell has taken in water by osmosis. The water pushes against the cell wall, making the cell firm and rigid. This is essential for keeping plant stems and leaves upright.'},
    {q:'What is the primary difference between diffusion and active transport?',opts:['Diffusion is faster','Active transport requires a membrane','Diffusion goes down the gradient; active transport goes against it','Active transport happens in plants only'],ans:2,exp:'The core difference is direction: DIFFUSION moves particles DOWN their concentration gradient (high to low) naturally. ACTIVE TRANSPORT moves particles UP/AGAINST their concentration gradient (low to high) using energy.'},
    {q:'When a plant wilts, it is because:',opts:['It has burst','It has become flaccid due to water loss','It has eaten too much','It has grown too tall'],ans:1,exp:'Wilting occurs because plant cells have lost water by osmosis and become FLACCID (the vacuoles shrink, pressure decreases). The cell wall is no longer pushed outwards, so the plant loses rigidity.'},
    {q:'The concentration gradient for diffusion refers to:',opts:['The pressure of water','The difference in concentration between two areas','The size of the molecule','The amount of ATP available'],ans:1,exp:'The CONCENTRATION GRADIENT is simply the difference in the number of particles (concentration) between one area and another. The steeper the gradient, the faster the rate of diffusion.'},
    {q:'Glucose moves into a red blood cell through facilitated diffusion. This means:',opts:['It uses ATP','It moves against the gradient','It uses carrier proteins but no ATP','It happens only in plants'],ans:2,exp:'FACILITATED DIFFUSION is a type of passive transport. It uses carrier proteins/channels to help glucose cross the membrane, but it DOES NOT use ATP because it moves glucose down its concentration gradient.'},
    {q:'The cell membrane is described as "partially permeable" because:',opts:['It is made of solid plastic','It allows some molecules through but not others','It lets everything through','It does not let water through'],ans:1,exp:'A partially permeable membrane allows small molecules (like water, oxygen, CO₂) to pass through freely via diffusion/osmosis, but prevents larger molecules (like proteins, starch, sucrose) from passing.'},
    {q:'Which of these substances moves OUT of a leaf cell by diffusion?',opts:['Carbon dioxide','Glucose','Oxygen','Nitrates'],ans:2,exp:'During photosynthesis, the leaf cell produces OXYGEN. Because oxygen concentration is higher inside the leaf than outside, oxygen diffuses OUT of the leaf into the atmosphere.'},
    {q:'What happens to the rate of diffusion if the temperature drops significantly?',opts:['It increases','It decreases','It stays the same','It reverses direction'],ans:1,exp:'Decreasing temperature slows down the kinetic energy of molecules. They move slower, so the rate of DIFFUSION DECREASES.'},
    {q:'Active transport is essential in the human kidneys because:',opts:['It allows water to enter the bladder','It reabsorbs glucose back into the blood against a gradient','It helps filter blood mechanically','It dissolves waste products'],ans:1,exp:'In the kidneys, all glucose is filtered out. The body cannot afford to lose it, so kidney cells use ACTIVE TRANSPORT to pump glucose from the urine back INTO the blood, even when blood glucose is already higher.'},
    {q:'The similarity between diffusion and active transport is that both:',opts:['Require ATP','Move particles across a membrane','Only occur in living organisms','Require carrier proteins'],ans:1,exp:'The ONLY universal similarity is that both processes involve moving particles across the cell membrane. Diffusion requires no ATP, while active transport does. Diffusion does not require carrier proteins (facilitated does, but simple diffusion doesn\'t).'},
  ],
  match:[
    {term:'Diffusion',def:'Passive movement from high to low concentration'},
    {term:'Osmosis',def:'Water movement through a partially permeable membrane'},
    {term:'Active transport',def:'Movement against a gradient using ATP energy'},
    {term:'Plasmolysis',def:'Shrinkage of plant cell in concentrated (hypertonic) solution'},
    {term:'Turgid',def:'Plant cell swollen due to water uptake by osmosis'},
    {term:'Flaccid',def:'Plant cell that has lost water and lost rigidity (wilting)'},
    {term:'Concentration gradient',def:'Difference in particle concentration between two regions'},
    {term:'Partially permeable membrane',def:'Membrane that allows only certain molecules to pass through'},
    {term:'Carrier protein',def:'Transmembrane protein that pumps molecules using ATP'},
    {term:'Hypotonic',def:'Solution with a lower solute concentration (more water) than another'},
    {term:'Hypertonic',def:'Solution with a higher solute concentration (less water) than another'},
    {term:'Isotonic',def:'Solution with the same solute concentration as another'},
    {term:'Lysis',def:'The bursting of an animal cell due to excess water influx'},
    {term:'Crenation',def:'The shrivelling of an animal cell due to water loss'},
    {term:'Facilitated diffusion',def:'Passive movement using channel/carrier proteins but NO ATP'},
    {term:'Kinetic energy',def:'The energy of movement; drives diffusion at higher temperatures'},
    {term:'ATP',def:'The energy currency of the cell, produced by mitochondria'},
    {term:'Root hair cell',def:'Plant cell adapted to absorb water (osmosis) and ions (active transport)'},
    {term:'Water potential',def:'The tendency of water to move; pure water has the highest'},
    {term:'Solute',def:'Substance dissolved in a solvent (e.g., salt in water)'},
  ],
  flashcards:[
    {q:'Define diffusion',a:'The net movement of particles from a region of HIGH concentration to a region of LOW concentration, down the concentration gradient. No energy is required.'},
    {q:'Define osmosis',a:'The movement of water molecules from a dilute solution (high water conc) to a concentrated solution (low water conc) through a partially permeable membrane, down the water potential gradient.'},
    {q:'What is active transport?',a:'The movement of molecules or ions AGAINST a concentration gradient (low to high) using ATP energy and specific carrier proteins in the cell membrane.'},
    {q:'What happens to a red blood cell placed in pure water?',a:'Water enters by osmosis (pure water has higher water potential). The cell swells up and may burst (lyse), because animal cells lack a rigid cell wall.'},
    {q:'What happens to a red blood cell placed in a highly salty solution?',a:'Water leaves the cell by osmosis (moves to the salty solution outside). The cell shrinks, shrivels, and becomes crenated.'},
    {q:'Name 4 factors that affect the rate of diffusion',a:'1. Concentration gradient (steeper = faster) \n2. Temperature (higher = faster) \n3. Surface area (larger = faster) \n4. Diffusion distance (shorter = faster).'},
    {q:'What is the role of carrier proteins in active transport?',a:'Carrier proteins span the cell membrane. They bind to specific ions/molecules and use ATP energy to change shape, "pumping" the molecules across against their concentration gradient.'},
    {q:'What is the difference between a turgid and a flaccid plant cell?',a:'A TURGID cell has taken in water by osmosis, pushing against the cell wall (firm). A FLACCID cell has lost water, the vacuole has shrunk, and the cell lacks rigidity (wilted).'},
    {q:'Why are root hair cells adapted for absorption?',a:'They have a LARGE SURFACE AREA (increased diffusion/osmosis rate), a THIN CELL WALL (short diffusion distance), and many MITOCHONDRIA (providing ATP for active transport of nitrate ions).'},
    {q:'Explain why active transport is vital in the human gut.',a:'When you eat food, glucose is often in a higher concentration inside the blood than in the intestine. Active transport allows the intestine cells to pump glucose AGAINST this gradient into the blood, ensuring you absorb all the sugar.'},
    {q:'What is a partially permeable membrane?',a:'It is a membrane (like the cell membrane) that allows small molecules (water, oxygen) to pass through freely via osmosis/diffusion, but prevents larger molecules (proteins, starch) from passing through.'},
    {q:'Explain the importance of mitochondria for diffusion.',a:'Mitochondria are NOT directly involved in diffusion (which is passive). However, they provide ATP for ACTIVE TRANSPORT. In cells that rely on active transport (like root hairs and kidney tubules), there are many mitochondria.'},
    {q:'How does temperature affect the rate of osmosis and diffusion?',a:'Higher temperatures increase the kinetic energy of molecules, making them move faster. Therefore, as temperature increases, the rate of both diffusion and osmosis INCREASES.'},
    {q:'What does "down a concentration gradient" mean?',a:'It means moving from a region where there are many particles (high concentration) to a region where there are fewer particles (low concentration). This happens naturally without energy.'},
    {q:'What is plasmolysis?',a:'Plasmolysis is a specific process that happens to a plant cell when it is placed in a hypertonic solution. Water leaves the cell by osmosis. The cell vacuole shrinks, and the protoplast (plasma membrane) pulls away from the rigid cell wall.'},
    {q:'Give an example of diffusion in the human body.',a:'Gas exchange in the lungs: Oxygen (O₂) diffuses from the alveoli (high concentration) into the blood (low concentration). Carbon dioxide (CO₂) diffuses from the blood into the alveoli to be breathed out.'},
    {q:'Why do plant cells require a cell wall to function during osmosis?',a:'The cell wall is fully permeable and rigid. When water enters the plant cell by osmosis, the cell wall prevents the cell from bursting (unlike animal cells). Instead, the water pressure pushes against the wall, making the plant turgid and upright.'},
    {q:'What is the difference between simple diffusion and facilitated diffusion?',a:'Simple diffusion moves small non-polar molecules (O₂, CO₂) straight through the lipid bilayer. Facilitated diffusion moves larger molecules (glucose) through specific carrier/channel proteins. Both are passive and do NOT use ATP.'},
    {q:'Why is ATP required for active transport but not for diffusion?',a:'Diffusion uses the natural kinetic energy of particles moving randomly down the gradient. Active transport moves particles AGAINST the gradient. To go "uphill," the cell must spend energy in the form of ATP.'},
    {q:'Define the term "solute".',a:'A solute is a substance that is dissolved in a solvent to make a solution. For example, in saltwater, salt is the solute and water is the solvent. Solutes affect the direction of osmosis (water moves towards the higher solute concentration).'},
  ],
  blanks:{
    passage:'In cell transport, [_] is the passive movement of particles down their concentration gradient without energy. [_] is a specific type of diffusion involving water crossing a partially permeable membrane. To move substances against a concentration gradient, cells use [_] transport, which requires energy in the form of [_] produced by [_]. When a plant cell loses water in a concentrated solution, the membrane pulls away from the wall, a process called [_].',
    answers:['Diffusion','Osmosis','active','ATP','mitochondria','plasmolysis'],
    wordbank:['Diffusion','Osmosis','active','ATP','mitochondria','plasmolysis','passive','turgid','flaccid','carbohydrates'],
  },
  sentences:[
    {prompt:'Explain why diffusion is described as a passive process.',keywords:['concentration gradient','down','energy','ATP','random motion'],hint:'Think about what "passive" means — does the process require an energy input from the cell?'},
    {prompt:'Describe what happens to a plant cell placed in a hypotonic (dilute) solution.',keywords:['water','osmosis','vacuole','swell','turgid','cell wall'],hint:'Which direction does water move? What does the cell look like physically?'},
    {prompt:'Explain why root hair cells require a large number of mitochondria to absorb nitrate ions.',keywords:['active transport','mitochondria','ATP','against gradient','nitrate','carrier proteins'],hint:'Compare nitrate concentration in soil vs. inside the root cell. Which transport process is involved?'},
    {prompt:'Describe the movement of oxygen gas from the lungs into the blood.',keywords:['alveoli','high concentration','blood','low concentration','diffuse','passive'],hint:'Does oxygen require energy to enter the blood? Where is oxygen more concentrated?'},
    {prompt:'What is the difference between a hypertonic and a hypotonic solution?',keywords:['hypertonic','high solute','hypotonic','low solute','water moves','concentration'],hint:'Consider which direction water would move via osmosis when a cell is placed in each.'},
    {prompt:'Explain why a red blood cell bursts in pure water, but a plant cell only becomes turgid.',keywords:['osmosis','cell wall','rigid','burst','turgid','membrane'],hint:'What physical structure does a plant cell have that an animal cell does not?'},
    {prompt:'Describe how active transport helps the human kidney reabsorb glucose.',keywords:['kidney','glucose','against gradient','carrier proteins','ATP','blood'],hint:'What happens to glucose if the kidney does not reabsorb it, and how is it moved back into the blood?'},
    {prompt:'Explain how temperature affects the rate of diffusion across a membrane.',keywords:['temperature','kinetic energy','faster','rate','increase','motion'],hint:'What happens to molecules when they are heated up physically?'},
    {prompt:'Define a concentration gradient and explain its role in diffusion.',keywords:['gradient','difference','high to low','driving force','steeper','faster'],hint:'What drives the particles to move without energy?'},
    {prompt:'Why are root hair cells adapted with a large surface area and thin walls?',keywords:['surface area','diffusion','osmosis','efficiency','short distance','absorption'],hint:'How does surface area and distance affect the rate of movement?'},
    {prompt:'What is the role of a carrier protein in facilitated diffusion?',keywords:['carrier protein','channel','membrane','passive','down gradient','glucose'],hint:'Does a carrier protein require energy in facilitated diffusion, or just help the substance cross?'},
    {prompt:'Explain the process of plasmolysis in a plant cell.',keywords:['plasmolysis','hypertonic','water loss','vacuole','membrane','cell wall'],hint:'In which type of solution does this happen, and what visibly happens to the membrane?'},
    {prompt:'Compare the movement of particles in diffusion versus active transport.',keywords:['diffusion','down gradient','passive','active transport','against gradient','ATP'],hint:'Think about the direction of movement and the energy requirements.'},
    {prompt:'Explain why water is described as moving down the "water potential gradient" during osmosis.',keywords:['water potential','dilute','pure water','concentrated','solute','moves'],hint:'Water always moves from where it is most pure to where it is mixed with solutes.'},
    {prompt:'What is the importance of ATP in the process of active transport?',keywords:['ATP','energy','pump','carrier protein','against gradient','active'],hint:'Where does the energy to push molecules "uphill" come from?'},
    {prompt:'Explain what happens to the rate of diffusion if the concentration gradient is reduced.',keywords:['concentration gradient','reduce','rate','slow down','less difference','drive'],hint:'If the difference in concentration is very small, does diffusion happen fast or slow?'},
    {prompt:'Describe the role of mitochondria in the absorption of mineral ions by plants.',keywords:['mineral ions','active transport','mitochondria','ATP','respiration','root'],hint:'Which transport process is used to absorb minerals against a gradient, and where does its energy come from?'},
    {prompt:'Give a practical example of diffusion in daily life.',keywords:['perfume','spray','room','smell','high concentration','spread'],hint:'Imagine spraying a scent in a room. How does the scent reach your nose without a fan?'},
    {prompt:'Explain why a sea water fish drinks water but a freshwater fish does not.',keywords:['osmosis','water loss','salt concentration','drink','hypertonic','freshwater'],hint:'Think about the concentration of salt inside the fish compared to the water outside it.'},
    {prompt:'Describe the difference between facilitated diffusion and active transport in terms of membrane proteins and energy.',keywords:['facilitated diffusion','down gradient','carrier','NO ATP','active transport','against gradient','USES ATP'],hint:'Both use proteins. What is the key difference in how they move substances?'},
  ],
});
</script></body></html>
