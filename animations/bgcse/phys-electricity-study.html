<script>
function bg(sk,c){sk.background(...(c||[10,12,24]))}

const STEPS=[
  {
    title:'Electric Current, Voltage & Resistance',
    body:`<strong>Current (I)</strong> — flow of charge (electrons). Measured in Amperes (A).
    <br><br>
    <strong>Voltage/Potential difference (V)</strong> — energy transferred per unit charge ("push" that drives current). Measured in Volts (V).
    <br><br>
    <strong>Resistance (R)</strong> — opposition to current flow. Measured in Ohms (Ω).
    <br><br>
    <strong>Ohm's Law: V = IR</strong>
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li>V = voltage (V)</li>
      <li>I = current (A)</li>
      <li>R = resistance (Ω)</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // V=IR triangle
      const cx=W/2,cy=H*0.45;
      const ts=80;
      sk.fill(52,152,219,160);sk.noStroke();
      sk.triangle(cx,cy-ts,cx-ts,cy+ts*0.6,cx+ts,cy+ts*0.6);
      sk.fill(255);sk.textSize(14);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER,sk.CENTER);
      sk.text('V',cx,cy-ts*0.3);
      sk.text('I',cx-ts*0.55,cy+ts*0.3);
      sk.text('R',cx+ts*0.55,cy+ts*0.3);
      sk.stroke(52,152,219);sk.strokeWeight(1.5);sk.noFill();
      sk.line(cx-ts,cy+ts*0.05,cx+ts,cy+ts*0.05);
      sk.textStyle(sk.NORMAL);
      // Flowing electrons
      const eq=Math.floor(t*5)%10;
      for(let i=0;i<8;i++){
        const ex=((t*80+i*50)%(W+20))-10;
        sk.fill(255,220,50,200);sk.noStroke();sk.circle(ex,H*0.82,9);
        sk.fill(30);sk.textSize(7);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('e⁻',ex,H*0.82);
      }
      sk.stroke(255,255,255,40);sk.strokeWeight(1.5);sk.noFill();
      sk.line(0,H*0.82,W,H*0.82);
      sk.fill(255,220,50);sk.noStroke();sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('Current = flow of electrons →',W/2,H*0.9);
      sk.fill(255,220,50);sk.textSize(12);sk.textStyle(sk.BOLD);
      sk.text('V = IR',W/2,H*0.14);sk.textStyle(sk.NORMAL);
    }
  },
  {
    title:'Series & Parallel Circuits',
    body:`<strong>Series circuit</strong>: components connected in a single loop.
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>Current is the SAME everywhere: I₁ = I₂ = I</li>
      <li>Voltage divides: V = V₁ + V₂ + ...</li>
      <li>Total resistance: R = R₁ + R₂ + ...</li>
    </ul>
    <strong>Parallel circuit</strong>: components connect between the same two points.
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>Voltage is the SAME across each branch: V₁ = V₂ = V</li>
      <li>Current divides: I = I₁ + I₂ + ...</li>
      <li>Total resistance: 1/R = 1/R₁ + 1/R₂ + ... (R decreases)</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk,[12,14,26]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Series circuit (left)
      sk.stroke(52,152,219,180);sk.strokeWeight(2);sk.noFill();
      const s={x:W*0.06,y:H*0.26,w:W*0.36,h:H*0.42};
      sk.rect(s.x,s.y,s.w,s.h,4);
      // Components
      [[s.x+s.w*0.25,s.y,'R₁'],[s.x+s.w*0.65,s.y,'R₂']].forEach(([x,y,l])=>{
        sk.fill(231,76,60,180);sk.noStroke();sk.rect(x-18,y-10,36,20,4);
        sk.fill(255);sk.textSize(9);sk.textAlign(sk.CENTER,sk.CENTER);sk.text(l,x,y);
      });
      // Electron pulse
      const sep=((t*50)%((s.w*2+s.h*2)));
      const perim=s.w*2+s.h*2;
      let ex=s.x,ey=s.y;
      const sp=sep;
      if(sp<s.w){ex=s.x+sp;ey=s.y;}
      else if(sp<s.w+s.h){ex=s.x+s.w;ey=s.y+(sp-s.w);}
      else if(sp<s.w*2+s.h){ex=s.x+s.w-(sp-s.w-s.h);ey=s.y+s.h;}
      else{ex=s.x;ey=s.y+s.h-(sp-s.w*2-s.h);}
      sk.fill(255,220,50,200);sk.noStroke();sk.circle(ex,ey,10);
      sk.fill(52,152,219);sk.textSize(9);sk.textAlign(sk.CENTER);sk.text('SERIES',s.x+s.w/2,H*0.78);
      sk.text('Same current everywhere',s.x+s.w/2,H*0.85);
      // Parallel circuit (right)
      sk.stroke(46,204,113,180);sk.strokeWeight(2);sk.noFill();
      const p={x:W*0.55,y:H*0.22,w:W*0.38,h:H*0.5};
      sk.line(p.x,p.y,p.x+p.w,p.y);sk.line(p.x,p.y+p.h,p.x+p.w,p.y+p.h);
      sk.line(p.x,p.y,p.x,p.y+p.h);sk.line(p.x+p.w,p.y,p.x+p.w,p.y+p.h);
      // Two branches
      const bmx=p.x+p.w*0.5;
      sk.line(bmx,p.y,bmx,p.y+p.h);
      [[p.x+p.w*0.25,'R₁',46,204,113],[bmx+p.w*0.25,'R₂',241,196,15]].forEach(([x,l,...c])=>{
        sk.fill(...c,180);sk.noStroke();sk.rect(x-15,p.y+p.h*0.4,30,20,4);
        sk.fill(255);sk.textSize(9);sk.textAlign(sk.CENTER,sk.CENTER);sk.text(l,x,p.y+p.h*0.5);
      });
      sk.fill(46,204,113);sk.textSize(9);sk.textAlign(sk.CENTER);sk.text('PARALLEL',p.x+p.w/2,H*0.84);
      sk.text('Same voltage across branches',p.x+p.w/2,H*0.91);
    }
  },
  {
    title:'Electrical Power & Energy',
    body:`<strong>Power (P)</strong> — rate of energy transfer. Measured in Watts (W).
    <br><br>
    Formulae:
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li><strong>P = IV</strong> (power = current × voltage)</li>
      <li><strong>P = I²R</strong> (substituting V = IR)</li>
      <li><strong>P = V²/R</strong></li>
    </ul>
    <strong>Energy transferred:</strong> E = Pt = IVt
    <br><br>
    <strong>Kilowatt-hour (kWh)</strong> — unit used by electricity companies.
    <br>1 kWh = energy used by a 1 kW device for 1 hour
    <br><br>
    Cost = power (kW) × time (h) × cost per unit`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Power meter
      const P=Math.abs(Math.sin(t*0.5))*2400+100;
      sk.fill(30,30,30,220);sk.noStroke();sk.rect(W*0.28,H*0.18,W*0.44,H*0.5,10);
      // Gauge arc
      sk.noFill();sk.stroke(255,255,255,40);sk.strokeWeight(3);
      sk.arc(W*0.5,H*0.45,H*0.28*2,H*0.28*2,sk.PI,sk.TWO_PI);
      const angle=sk.PI+sk.PI*(P/2500);
      sk.stroke(255,220,50,220);sk.strokeWeight(3);
      sk.arc(W*0.5,H*0.45,H*0.28*2,H*0.28*2,sk.PI,angle);
      // Needle
      const nx=W*0.5+H*0.22*Math.cos(angle),ny=H*0.45+H*0.22*Math.sin(angle);
      sk.stroke(231,76,60,220);sk.strokeWeight(2);
      sk.line(W*0.5,H*0.45,nx,ny);
      sk.fill(231,76,60);sk.noStroke();sk.circle(W*0.5,H*0.45,10);
      // Value
      sk.fill(255,220,50);sk.textSize(12);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER,sk.CENTER);
      sk.text(Math.round(P)+' W',W*0.5,H*0.52);sk.textStyle(sk.NORMAL);
      // Labels
      sk.fill(255,255,255,80);sk.textSize(8.5);sk.textAlign(sk.CENTER);
      sk.text('0',W*0.3,H*0.48);sk.text('2500',W*0.7,H*0.48);
      // Formulae
      sk.fill(255,220,50);sk.textSize(10);sk.textStyle(sk.BOLD);
      sk.text('P = IV  |  P = I²R  |  P = V²/R',W/2,H*0.82);
      sk.textStyle(sk.NORMAL);sk.fill(255,255,255,80);sk.textSize(9);
      sk.text('E = Pt = IVt',W/2,H*0.9);
    }
  },
  {
    title:'🎮 Check — Circuits & Power',
    body:'Test your understanding of Ohm\'s Law, circuits, and electrical power.',
    draw:null,
    game:{type:'mcq',questions:[
      {q:'A bulb has resistance 10 Ω and a current of 0.5 A flows through it. What is the voltage across it?',opts:['20 V','5 V','0.05 V','2 V'],ans:1,exp:'V = IR = 0.5 × 10 = 5 V.'},
      {q:'In a PARALLEL circuit, which quantity is the same across all branches?',opts:['Current','Resistance','Voltage','Power'],ans:2,exp:'In a parallel circuit, each branch is connected directly across the same two points — so voltage is the SAME across all branches.'},
      {q:'Three 6 Ω resistors are connected in parallel. The total resistance is:',opts:['18 Ω','6 Ω','2 Ω','3 Ω'],ans:2,exp:'For n identical resistors in parallel: R = R₁/n = 6/3 = 2 Ω. (Or: 1/R = 1/6+1/6+1/6 = 3/6 → R = 2 Ω)'},
      {q:'A 2 kW kettle runs for 0.5 hours. How many kWh does it use?',opts:['4 kWh','1 kWh','0.25 kWh','2.5 kWh'],ans:1,exp:'E = P × t = 2 × 0.5 = 1 kWh. This is what electricity companies charge you for.'},
    ]}
  },
  {
    title:'Magnets & Electromagnetic Induction',
    body:`A <strong>current-carrying conductor</strong> in a magnetic field experiences a force (the motor effect).
    <br><br>
    <strong>Fleming's Left-Hand Rule</strong> (motor effect):
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>thuMb → Motion (force)</li>
      <li>First finger → Field</li>
      <li>seCond finger → Current</li>
    </ul>
    <strong>Electromagnetic induction</strong>: Moving a conductor through a magnetic field induces a voltage (generator effect).
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>Used in generators, dynamos</li>
      <li>Faster movement or stronger magnet → bigger induced voltage</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk,[12,14,28]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Magnet poles
      sk.fill(231,76,60,180);sk.noStroke();sk.rect(W*0.08,H*0.3,W*0.18,H*0.4,4);
      sk.fill(52,152,219,180);sk.rect(W*0.74,H*0.3,W*0.18,H*0.4,4);
      sk.fill(255);sk.textSize(14);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER,sk.CENTER);
      sk.text('N',W*0.17,H*0.5);sk.text('S',W*0.83,H*0.5);sk.textStyle(sk.NORMAL);
      // Field lines (curved between poles)
      for(let i=-2;i<=2;i++){
        const fy=H*0.5+i*H*0.07;
        sk.stroke(241,196,15,100);sk.strokeWeight(1.5);sk.noFill();
        sk.beginShape();
        sk.vertex(W*0.26,fy);
        sk.bezierVertex(W*0.4,fy-i*10,W*0.6,fy-i*10,W*0.74,fy);
        sk.endShape();
        // Arrow on line
        const px=W*0.5+Math.cos(t+i)*W*0.1;
        const py=fy-i*(10*Math.abs(Math.sin(t)));
        sk.fill(241,196,15,200);sk.noStroke();sk.circle(px,py,6);
      }
      // Wire
      const wireY=H*0.5+Math.sin(t)*H*0.15;
      sk.fill(200,150,50,220);sk.noStroke();sk.circle(W*0.5,wireY,14);
      sk.stroke(200,150,50,200);sk.strokeWeight(2);
      sk.line(W*0.5,wireY,W*0.5,wireY-H*0.18);
      // Force arrow
      sk.stroke(46,204,113,200);sk.strokeWeight(2.5);sk.noFill();
      sk.line(W*0.5+20,wireY,W*0.5+60,wireY);
      sk.fill(46,204,113,200);sk.noStroke();
      sk.triangle(W*0.5+60,wireY,W*0.5+50,wireY-5,W*0.5+50,wireY+5);
      sk.fill(46,204,113);sk.textSize(9);sk.textAlign(sk.LEFT);
      sk.text('Force (motor)',W*0.5+64,wireY+4);
    }
  },
  {
    title:'Safety & Domestic Electricity',
    body:`UK/Botswana mains: <strong>230 V AC, 50 Hz</strong>
    <br><br>
    <strong>Three-pin plug wiring:</strong>
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li><strong>Brown — Live (L)</strong>: carries the alternating current</li>
      <li><strong>Blue — Neutral (N)</strong>: completes the circuit</li>
      <li><strong>Green/Yellow — Earth (E)</strong>: safety wire, prevents electrocution</li>
    </ul>
    <strong>Fuse</strong>: thin wire that melts and breaks the circuit if current is too high, preventing fire.
    <br><br>
    <strong>Circuit breaker / RCD</strong>: modern alternative to fuse — can be reset after tripping.`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Plug outline
      sk.fill(60,60,70,200);sk.noStroke();
      sk.beginShape();
      sk.vertex(W*0.2,H*0.15);sk.vertex(W*0.8,H*0.15);
      sk.vertex(W*0.85,H*0.7);sk.vertex(W*0.5,H*0.88);sk.vertex(W*0.15,H*0.7);
      sk.endShape(sk.CLOSE);
      // Three pins
      const pins=[
        {x:W*0.35,y:H*0.28,col:[100,180,100],label:'E'},
        {x:W*0.5,y:H*0.45,col:[52,120,52],label:'E'},
        {x:W*0.35,y:H*0.6,col:[52,100,200],label:'N'},
        {x:W*0.65,y:H*0.6,col:[200,80,50],label:'L'},
      ];
      // Earth pin (top)
      sk.fill(100,200,100,200);sk.noStroke();sk.rect(W*0.46,H*0.22,W*0.08,H*0.16,3);
      sk.fill(255);sk.textSize(10);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('E',W*0.5,H*0.3);
      // Neutral pin
      sk.fill(52,152,219,200);sk.noStroke();sk.rect(W*0.26,H*0.5,W*0.08,H*0.16,3);
      sk.fill(255);sk.text('N',W*0.3,H*0.58);
      // Live pin
      sk.fill(220,60,60,200);sk.noStroke();sk.rect(W*0.66,H*0.5,W*0.08,H*0.16,3);
      sk.fill(255);sk.text('L',W*0.7,H*0.58);
      // Wire colours
      sk.fill(100,200,100);sk.noStroke();sk.textSize(9);sk.textAlign(sk.LEFT);
      sk.text('■ Green/Yellow — Earth (safety)',W*0.04,H*0.22);
      sk.fill(52,152,219);sk.text('■ Blue — Neutral',W*0.04,H*0.32);
      sk.fill(220,60,60);sk.text('■ Brown — Live',W*0.04,H*0.42);
    }
  },
  {
    q:'Series vs Parallel Circuits — Circuit Diagrams',
    content:`<h3>Series vs Parallel Circuits</h3><p>Understanding the difference between series and parallel circuits is fundamental to electricity. The two configurations behave very differently with respect to current, voltage, and resistance — and this determines how components are wired in real-world devices such as household lighting and electronics.</p><ul><li><strong>Series:</strong> current is the same throughout; voltage divides; total resistance = R₁ + R₂; one break stops all components.</li><li><strong>Parallel:</strong> voltage is the same across all branches; current divides; total resistance decreases; each component operates independently.</li><li>Household circuits are wired in parallel so each appliance receives full mains voltage and can be switched independently.</li></ul>`,
    visual:`<svg viewBox="0 0 420 270" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">

</svg>`
  },
  {
    q:'Ohm\'s Law Triangle — V = IR',
    content:`<h3>Ohm's Law Triangle — V = IR</h3><p>Ohm's Law states that the voltage across a conductor is directly proportional to the current through it, provided temperature remains constant. The triangle is a memory tool that allows quick rearrangement of the formula to find any one of the three quantities.</p><ul><li>Cover V to get V = I × R; cover I to get I = V ÷ R; cover R to get R = V ÷ I.</li><li>Voltage is measured in Volts (V), current in Amperes (A), and resistance in Ohms (Ω).</li><li>A component that obeys Ohm's Law (e.g. a resistor at constant temperature) is called an ohmic conductor.</li></ul>`,

</svg>`

  {
    q:'Electric Field Lines Between Charges',
    content:`<h3>Electric Field Lines Between Charges</h3><p>Electric field lines show the direction and relative strength of an electric field. A positive test charge placed in the field would move in the direction the field lines point. The pattern of field lines reveals whether charges attract or repel each other.</p><ul><li>Field lines always point FROM positive TO negative charge (the direction a positive test charge would move).</li><li>Closer field lines indicate a stronger electric field; lines never cross each other.</li><li>Opposite charges produce curved field lines between them (attraction); like charges produce lines that curve away from each other (repulsion).</li></ul>`,

    q:'Power Formula Relationships — P = IV = I²R = V²/R',
    content:`<h3>Electrical Power — Formula Web</h3><p>Electrical power is the rate at which energy is transferred by a circuit. Three equivalent formulae can be derived by combining P = IV with Ohm's Law (V = IR), allowing power to be calculated from any two known electrical quantities.</p><ul><li><strong>P = IV</strong> — the fundamental definition: power equals current times voltage.</li><li><strong>P = I²R</strong> — useful when current and resistance are known (substitute V = IR).</li><li><strong>P = V²/R</strong> — useful when voltage and resistance are known (substitute I = V/R).</li></ul>`,
