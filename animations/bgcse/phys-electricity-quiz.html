<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Electricity Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Electricity — BGCSE Physics Quiz',
  color:'#1a237e',dark:'#000051',light:'#e8eaf6',
    mcq:[
    {q:'Ohm\'s Law states that (at constant temperature):',opts:['V = I/R','I = V × R','V = I × R','R = V × I'],ans:2,exp:'OHM\'S LAW: V = I × R (Voltage = Current × Resistance). V in Volts, I in Amperes, R in Ohms. This holds at CONSTANT TEMPERATURE — resistance of a metal increases with temperature.'},
    {q:'In a series circuit, the current:',opts:['Is different at each component','Is the same throughout','Adds up at junctions','Is zero everywhere'],ans:1,exp:'In a SERIES circuit, current is the SAME at every point. There is only one path for charge to flow. Voltage splits across components proportionally to their resistance.'},
    {q:'Power is calculated as:',opts:['P = V/I','P = I²R OR P = IV','P = V²/R only','P = R/V'],ans:1,exp:'Electrical power P = I × V = I²R = V²/R. All three are equivalent using Ohm\'s law. Power is measured in Watts (W).'},
    {q:'Which component is used to protect circuits from excessive current?',opts:['Voltmeter','Ammeter','Fuse','Capacitor'],ans:2,exp:'A FUSE contains a thin wire that MELTS if current exceeds the rated value, breaking the circuit and protecting it. Modern circuits use circuit breakers (RCDs) which can be reset.'},
    {q:'In a parallel circuit, the voltage across each branch:',opts:['Adds up to the supply voltage','Is the same as the supply voltage','Is zero','Depends on the resistance of the entire circuit'],ans:1,exp:'In a PARALLEL circuit, the VOLTAGE across each branch is the SAME (equal to the supply voltage). Current splits between branches — more current in lower resistance branches.'},
    {q:'A 60W bulb connected to 240V draws how much current?',opts:['14,400 A','4 A','0.25 A','120 A'],ans:2,exp:'I = P/V = 60/240 = 0.25 A. The correct fuse would be a 1A or 3A fuse (just above operating current).'},
    {q:'Which of the following would cause an ammeter to display the highest reading in a simple circuit?',opts:['Decreasing the voltage','Increasing the resistance','Decreasing the resistance','Removing the battery'],ans:2,exp:'Ohm\'s Law: I = V/R. If voltage is constant, DECREASING resistance will INCREASE current. Lower resistance allows more charge to flow per second.'},
    {q:'If two resistors of 4Ω and 6Ω are connected in series, the total resistance is:',opts:['2Ω','10Ω','24Ω','12Ω'],ans:1,exp:'In SERIES: R_total = R₁ + R₂. 4Ω + 6Ω = 10Ω. In parallel, total resistance would be 1/R = 1/4 + 1/6 = 2.4Ω (less than the smallest resistor).'},
    {q:'In a parallel circuit, if one bulb blows (breaks the circuit), the other bulbs:',opts:['All go out','Stay lit because they are on separate branches','Get brighter','Stop working but remain on'],ans:1,exp:'In PARALLEL, each branch is independent. If one bulb blows, the other branches still have a complete circuit path, so the remaining bulbs STAY LIT. This is why homes are wired in parallel.'},
    {q:'The unit of electrical charge is:',opts:['Ampere','Volt','Coulomb','Watt'],ans:2,exp:'Charge is measured in COULOMBS (C). Current (I) is the rate of flow of charge: I = Q/t (Ampere = Coulomb/second). Voltage (V) is energy per unit charge (Joules/Coulomb).'},
    {q:'A voltmeter must be connected:',opts:['In series with the component','In parallel across the component','In series with the battery','Anywhere in the circuit'],ans:1,exp:'A VOLTMETER measures the potential difference across a component. It must be connected IN PARALLEL across the component. It has very high internal resistance to draw negligible current.'},
    {q:'An ammeter must be connected:',opts:['In parallel with the component','In series with the component','Across the battery','In place of the battery'],ans:1,exp:'An AMMETER measures current flowing THROUGH a component. It must be connected IN SERIES. It has very low internal resistance so it does not restrict the current flow.'},
    {q:'Which formula correctly calculates the total power of an appliance?',opts:['P = V/I','P = I²R','P = V²R','P = IR'],ans:1,exp:'Electrical power (Watts) can be calculated using: P = I × V (most common), P = I²R, or P = V²/R. These are all derived from Ohm\'s Law.'},
    {q:'A 12V battery is connected to a 3Ω resistor. What is the current?',opts:['36 A','4 A','0.25 A','15 A'],ans:1,exp:'Using Ohm\'s Law: I = V/R = 12V / 3Ω = 4 A. This assumes the battery is ideal and the resistor obeys Ohm\'s Law.'},
    {q:'What is the function of a live wire in a domestic plug?',opts:['Carries current to the appliance (at 240V)','Returns current to the supply','Provides a safety path for current','Neutralizes the earth wire'],ans:0,exp:'The LIVE wire carries the high-voltage alternating current from the mains to the appliance. It is dangerous and covered in brown insulation. The NEUTRAL wire completes the circuit (blue).'},
    {q:'The specific heat capacity equation is related to electricity because:',opts:['It measures voltage','Electrical energy (E = Pt) converts to heat (ΔQ = mcΔθ)','It measures current','It measures resistance'],ans:1,exp:'Electrical energy supplied (E = P × t = VIt) can be used to heat a substance. The temperature rise is related by ΔQ = mcΔθ. This allows us to measure the specific heat capacity of a liquid using an immersion heater.'},
    {q:'If a wire has a current of 2A and a voltage of 10V across it, its resistance is:',opts:['20Ω','5Ω','0.2Ω','12Ω'],ans:1,exp:'Resistance R = V/I = 10V / 2A = 5Ω. This is a basic application of Ohm\'s Law.'},
    {q:'Which of these is NOT a standard component of a three-pin plug circuit in Botswana?',opts:['Live wire (Brown)','Neutral wire (Blue)','Earth wire (Green/Yellow)','Capacitor wire'],ans:3,exp:'Standard plugs have THREE wires: LIVE (Brown), NEUTRAL (Blue), and EARTH (Green/Yellow with stripes). A CAPACITOR is a separate electronic component, not part of a standard mains plug.'},
    {q:'Why does the national grid transmit electricity at very high voltages?',opts:['To increase the current','To reduce energy loss as heat (P = I²R) in the transmission lines','To make the wires thicker','To increase the frequency'],ans:1,exp:'Transmitting at HIGH voltage (using step-up transformers) REDUCES the current for the same power (P = IV). Since heat loss in the cables is P = I²R, reducing the current drastically reduces energy wasted as heat in the transmission lines.'},
    {q:'A current of 0.5A flows for 2 minutes. How much charge flows past a point?',opts:['1 C','60 C','120 C','0.5 C'],ans:1,exp:'Charge (Q) = Current (I) × Time (t). Time must be in seconds: 2 minutes = 120 seconds. Q = 0.5 A × 120 s = 60 Coulombs.'},
  ],
  match:[
    {term:'Current (I)',def:'The rate of flow of electric charge; measured in Amperes (A)'},
    {term:'Voltage (V)',def:'The energy transferred per unit charge (Potential Difference); measured in Volts (V)'},
    {term:'Resistance (R)',def:'The opposition to the flow of current; measured in Ohms (Ω)'},
    {term:'Series circuit',def:'A circuit where components are connected in a single continuous loop; the current is the same throughout'},
    {term:'Parallel circuit',def:'A circuit where components are connected in separate branches; the voltage is the same across each branch'},
    {term:'Power (P)',def:'The rate of energy transfer (energy per second); measured in Watts (W); P = IV'},
    {term:'Ohm\'s Law',def:'V = IR; at constant temperature, current through a metal conductor is proportional to voltage'},
    {term:'Fuse',def:'A safety component containing a thin wire that melts and breaks the circuit if the current is too high'},
    {term:'Live wire',def:'The wire that carries the high voltage supply from the mains; colour-coded brown'},
    {term:'Neutral wire',def:'The wire that completes the circuit back to the supply; colour-coded blue'},
    {term:'Earth wire',def:'A safety wire that directs current to the ground if a fault occurs; colour-coded green and yellow'},
    {term:'Ammeter',def:'A device used to measure current, connected in series; has very low resistance'},
    {term:'Voltmeter',def:'A device used to measure voltage, connected in parallel; has very high resistance'},
    {term:'Coulomb (C)',def:'The SI unit of electric charge; 1 Coulomb = 1 Ampere × 1 Second'},
    {term:'Transformer',def:'A device that changes the voltage of an AC supply using electromagnetic induction'},
    {term:'Primary coil',def:'The input coil of a transformer connected to the AC supply'},
    {term:'Secondary coil',def:'The output coil of a transformer where the induced voltage is produced'},
    {term:'Step-up transformer',def:'A transformer that increases voltage (more turns on secondary coil)'},
    {term:'Step-down transformer',def:'A transformer that decreases voltage (more turns on primary coil)'},
    {term:'National Grid',def:'The network of cables and transformers used to transmit electricity across a country'},
  ],
  flashcards:[
    {q:'State and explain Ohm\'s Law.',a:'Ohm\'s Law states that V = IR (Voltage = Current × Resistance). At a constant temperature, the current through a metal conductor is directly proportional to the voltage across it. A graph of V against I for an ohmic conductor is a straight line passing through the origin.'},
    {q:'What is the difference between series and parallel circuits?',a:'SERIES: The same current flows through all components; voltages add up; total resistance is the sum of individual resistances (R_total = R₁+R₂+...). PARALLEL: The same voltage is across each branch; currents add up; total resistance is LESS than the smallest branch resistor (1/R_total = 1/R₁ + 1/R₂ + ...).'},
    {q:'How does a diode work?',a:'A diode is a semiconductor component that allows current to flow in ONE DIRECTION ONLY (forward bias). In reverse bias, it blocks current completely. Diodes are used in rectification — converting alternating current (AC) into direct current (DC). A Light-Emitting Diode (LED) emits light when current flows through it.'},
    {q:'What is the difference between AC and DC?',a:'DC (Direct Current) is current that flows in one direction only. It is produced by batteries and cells. AC (Alternating Current) is current that repeatedly reverses direction. It is produced by mains electricity (e.g., 240V, 50Hz in Botswana). AC can be stepped up or down using transformers; DC cannot.'},
    {q:'How do you calculate the total resistance in a series circuit?',a:'R_total = R₁ + R₂ + R₃ + ... You simply add all the individual resistances together. In a parallel circuit, you calculate using 1/R_total = 1/R₁ + 1/R₂ + ... The total resistance in parallel is always LESS than the smallest individual resistance.'},
    {q:'What is the function of a transformer?',a:'A transformer changes (steps up or steps down) the voltage of an AC supply using electromagnetic induction. The ratio of voltages equals the ratio of turns on the coils: Vp/Vs = Np/Ns. Transformers are used to transmit electricity at high voltage (low current) across the national grid to reduce energy loss, then step it down for home use.'},
    {q:'Describe the relationship between power, current, and voltage.',a:'Power (P) is the rate at which electrical energy is transferred. The relationship is: P = V × I (Watts = Volts × Amperes). From Ohm\'s Law, alternative equations are: P = I²R and P = V²/R.'},
    {q:'Why are components connected in parallel in household circuits?',a:'Household appliances are wired in PARALLEL so that they all receive the SAME mains voltage (240V) and operate independently. If one appliance is switched off, the others continue to work. If they were in series, adding an appliance would increase the total resistance and reduce the voltage across each one.'},
    {q:'Explain the function of an earth wire in a domestic plug.',a:'The EARTH wire (green and yellow) is a safety feature. If a fault occurs and the live wire touches the metal casing of an appliance, the earth wire provides a low-resistance path for current to flow safely to the ground. This triggers the fuse to blow, cutting off the supply and preventing electric shock.'},
    {q:'What is the effect of increasing the temperature of a metal wire on its resistance?',a:'As temperature increases, the metal ions in the lattice vibrate more vigorously. This increases the frequency of collisions between the flowing electrons and the ions, which impedes the flow of charge. Therefore, the RESISTANCE of a metal INCREASES with temperature.'},
    {q:'How does a circuit breaker differ from a fuse?',a:'A FUSE contains a thin wire that melts and permanently breaks the circuit when current exceeds the limit. A CIRCUIT BREAKER (RCD) uses an electromagnetic switch that "trips" when the current is too high. It can be RESET (switched back on) manually, making it reusable.'},
    {q:'Why is the national grid transmitted at 132,000V rather than 240V?',a:'Power = V × I. For a fixed amount of power, transmitting at a very HIGH voltage drastically reduces the CURRENT. Since heat loss (energy wasted) in the transmission cables is proportional to I²R (P_loss = I²R), a lower current means much LESS energy is wasted as heat over long distances.'},
    {q:'What is the total resistance of three resistors: 2Ω, 3Ω, and 5Ω connected in series?',a:'In series: R_total = 2Ω + 3Ω + 5Ω = 10Ω. The total resistance in a series circuit is simply the sum of the individual resistances.'},
    {q:'Calculate the charge that flows when a current of 3A flows for 10 seconds.',a:'Charge = Current × Time. Q = 3 A × 10 s = 30 Coulombs. This means 30 Coulombs of charge pass a point in the circuit.'},
    {q:'Explain why a voltmeter must have a very high resistance.',a:'A voltmeter is connected in PARALLEL with a component. To measure voltage accurately without drawing significant current, it must have a VERY HIGH internal resistance. If it had low resistance, it would draw a large current and alter the circuit\'s behaviour.'},
    {q:'Calculate the power dissipated by a 12Ω resistor carrying a current of 2A.',a:'Power can be calculated using P = I²R. P = (2A)² × 12Ω = 4 × 12 = 48 Watts. Alternatively, using P = V×I: V = IR = 24V, so P = 24V × 2A = 48W.'},
    {q:'What is the difference between an ohmic conductor and a non-ohmic conductor?',a:'An OHMIC conductor (e.g., a fixed metal resistor at constant temperature) has a resistance that remains constant, so current is proportional to voltage. A NON-OHMIC conductor (e.g., a filament lamp or diode) has a changing resistance, so the V-I graph is not a straight line.'},
    {q:'Define "potential difference" and state its unit.',a:'Potential Difference (Voltage) is the ENERGY transferred per unit of electric charge passing between two points in a circuit. It is measured in VOLTS (V). 1 Volt = 1 Joule per Coulomb (J/C).'},
    {q:'How does a diode regulate current in a circuit?',a:'A diode allows current to flow only when it is FORWARD BIASED (the positive terminal of the supply connects to the anode). It provides high resistance in REVERSE BIAS, blocking current. This allows it to act as a one-way valve for current in a circuit.'},
    {q:'Why is the live wire the most dangerous wire in a domestic plug?',a:'The LIVE wire has a very high voltage (240V) relative to the earth/ground. If you touch the live wire, your body provides a path for the current to flow through you to the ground, which can lead to severe electric shock or electrocution.'},
  ],
  blanks:{
    passage:'Ohm\'s Law states that V = I × [_]. In a series circuit, the [_] is the same at every point in the loop. In a parallel circuit, the [_] across every branch is identical to the supply voltage. The electrical power transferred is given by P = [_] × V. A device that contains a thin wire that melts to protect a circuit from excessive current is called a [_]. The SI unit of resistance is the [_].',
    answers:['R','current','voltage','I','fuse','Ohm'],
    wordbank:['R','current','voltage','I','fuse','Ohm','charge','power','Watt'],
  },
  sentences:[
    {prompt:'A fixed resistor has a resistance of 30Ω and a current of 2A flows through it. Calculate the voltage across it and the electrical power dissipated by it.',keywords:['V=IR','60V','P=IV','120W','P=I²R','energy transfer'],hint:'First apply Ohm\'s Law (V=IR) to find the voltage. Then use the power equation (P=IV) to find the power dissipated as heat.'},
    {prompt:'Explain why household appliances in a home are connected in parallel rather than in series with each other.',keywords:['parallel','same voltage','independent','series','add voltage','switch off','brightness'],hint:'What happens to the voltage available to a bulb if you connect several appliances in series? What happens to the other bulbs if one bulb blows in each type of circuit?'},
    {prompt:'Explain why electricity is transmitted at high voltage (e.g., 132,000V) across the national grid instead of at the household voltage of 240V.',keywords:['high voltage','low current','P=VI','heat loss','P=I²R','transformer','efficiency'],hint:'How does high voltage affect the current for a given power (P=VI)? How does current affect the heat lost in the transmission wires (P=I²R)?'},
    {prompt:'Describe how an ammeter and a voltmeter should be correctly connected in a circuit.',keywords:['ammeter','series','low resistance','voltmeter','parallel','high resistance','measure'],hint:'One measures current flowing THROUGH a component; the other measures voltage ACROSS a component. What determines their placement and internal resistance?'},
    {prompt:'Calculate the total resistance of a 4Ω and a 6Ω resistor connected (a) in series, and (b) in parallel.',keywords:['series','add','R_total','10Ω','parallel','reciprocal','less than','2.4Ω'],hint:'In series, simply add them. In parallel, use the reciprocal formula: 1/R_total = 1/R₁ + 1/R₂.'},
    {prompt:'Explain the role of the three wires (Live, Neutral, Earth) in a UK/Botswana three-pin mains plug.',keywords:['live','brown','240V','neutral','blue','return','earth','green/yellow','safety'],hint:'Which wire is dangerous to touch? Which completes the circuit? Which wire provides protection in case of a fault?'},
    {prompt:'A 12V car battery is connected to a 3Ω headlight resistor. Calculate the current and power drawn by the headlight.',keywords:['Ohm\'s Law','I= V/R','4A','Power','P=IV','48W'],hint:'Use Ohm\'s Law first to find current, then use the power equation.'},
    {prompt:'Describe the difference between an ohmic conductor and a non-ohmic conductor, giving an example of each.',keywords:['ohmic','V vs I','straight line','constant R','non-ohmic','filament lamp','diode'],hint:'An ohmic conductor obeys Ohm\'s Law; a non-ohmic conductor does not. Think about how resistance changes with temperature or current direction.'},
    {prompt:'Calculate the charge flowing through a circuit when a current of 0.5A flows for 2 minutes.',keywords:['current','time','charge','Q=It','0.5A','120s','60C'],hint:'Remember to convert time into seconds before applying the formula Q = I × t.'},
    {prompt:'Explain how the national grid uses step-up and step-down transformers.',keywords:['step-up','increase voltage','power station','transmission','reduce loss','step-down','homes','240V'],hint:'One type is used at the power station to prepare electricity for travel; the other is used at the destination to make it safe for appliances.'},
    {prompt:'A resistor has a resistance of 20Ω. What is the potential difference required to produce a current of 0.5A through it?',keywords:['V=IR','20Ω','0.5A','10V','Ohm\'s Law','potential difference'],hint:'Use Ohm\'s Law: V = I × R.'},
    {prompt:'Why is a fuse placed on the live wire rather than the neutral wire in a domestic plug?',keywords:['fuse','live wire','cut off','high voltage','neutral','safety','shock'],hint:'If the fuse is on the neutral and a fault occurs, is the appliance still potentially live?'},
    {prompt:'Compare the advantages and disadvantages of connecting bulbs in series versus parallel.',keywords:['series','same current','dimming','parallel','same voltage','independent','brightness'],hint:'How does adding another bulb affect the brightness of the others in series versus parallel?'},
    {prompt:'Explain why the resistance of a metal conductor increases as its temperature increases.',keywords:['metal','temperature','ions','vibrate','collisions','electrons','resistance'],hint:'What happens to the crystal lattice structure of the metal ions at higher temperatures? How does this affect the flow of electrons?'},
    {prompt:'A 240V appliance draws a current of 5A. Calculate the power rating of the appliance and the resistance of its heating element.',keywords:['P=IV','1200W','R=V/I','48Ω','power','resistance'],hint:'Use P=IV to find power. Then use Ohm\'s Law (R=V/I) to find resistance.'},
    {prompt:'Describe how an electric bell works using electromagnetism.',keywords:['electromagnet','soft iron','core','contact','armature','switch','hammer'],hint:'How does the flow of current create a magnetic field, and how does this magnetic field cause the bell to ring repeatedly?'},
    {prompt:'What is the difference between an LED and a standard filament lamp?',keywords:['LED','light emitting diode','efficiency','current','resistance','heat','filament'],hint:'One is a semiconductor that emits light; the other uses a heated wire. Which one is more energy-efficient, and why?'},
    {prompt:'Explain the function of a circuit breaker (RCD) compared to a fuse.',keywords:['circuit breaker','reusable','reset','fuse','melts','replace','safety'],hint:'Which one permanently breaks the circuit, and which one can be easily switched back on?'},
    {prompt:'Using the equations P = I²R and P = V²/R, explain why transmission wires should have low resistance.',keywords:['P=I²R','heat loss','low resistance','wasted energy','thin wire','thick wire'],hint:'If P = I²R, reducing R reduces wasted heat. If P = V²/R, reducing R means more power reaches the destination.'},
    {prompt:'Describe the relationship between volts, joules, and coulombs.',keywords:['volt','joule','coulomb','energy','charge','V=J/C','potential difference'],hint:'How many joules of energy are transferred per coulomb of charge to give a potential difference of 1 Volt?'},
  ],
});
</script></body></html>
