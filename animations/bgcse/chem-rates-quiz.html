<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Rates of Reaction Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Rates of Reaction — BGCSE Chemistry Quiz',
  color:'#bf360c',dark:'#870000',light:'#fbe9e7',
    mcq:[
    {q:'Increasing temperature increases rate of reaction because:',opts:['Particles are bigger','Particles have more energy and collide more frequently and with sufficient energy','Particles dissolve faster','Concentration increases'],ans:1,exp:'Higher temperature → particles have MORE kinetic energy → collide MORE FREQUENTLY and with GREATER ENERGY → more collisions exceed the activation energy → faster rate.'},
    {q:'A catalyst works by:',opts:['Increasing the activation energy','Providing an alternative reaction pathway with LOWER activation energy','Increasing the concentration of reactants','Increasing temperature of the reaction'],ans:1,exp:'A CATALYST provides an ALTERNATIVE REACTION PATHWAY with a LOWER ACTIVATION ENERGY. More collisions now have sufficient energy → faster reaction. The catalyst is not consumed — it is the same at the end.'},
    {q:'Increasing concentration of a solution increases rate because:',opts:['Temperature increases','Molecules become larger','More particles per unit volume → more frequent collisions','Activation energy decreases'],ans:2,exp:'Higher concentration = more particles per unit volume = more frequent COLLISIONS between reactant particles = more successful collisions per second = faster rate.'},
    {q:'A powdered solid reacts faster than a lump of the same mass because:',opts:['The powder is lighter','Powder has greater surface area → more collisions possible','The powder has more particles','Temperature is higher'],ans:1,exp:'Smaller particles → GREATER SURFACE AREA exposed to the other reactant → more COLLISION SITES available → faster reaction rate.'},
    {q:'Which increases the rate of reaction?',opts:['Decreasing temperature','Using larger particle size','Adding a catalyst','Decreasing concentration'],ans:2,exp:'A CATALYST increases the rate by lowering activation energy. Decreasing temperature, using larger particles, and decreasing concentration all DECREASE the rate.'},
    {q:'The activation energy is:',opts:['Energy released in a reaction','Minimum energy needed for a collision to result in a reaction','Energy of the products','Heat content of the reactants'],ans:1,exp:'ACTIVATION ENERGY (Ea) is the MINIMUM ENERGY that colliding particles must have for a reaction to occur. Reactions with low Ea happen easily at room temperature; high Ea reactions need more energy (heat/catalyst).'},
    {q:'Collision theory explains that for a reaction to occur, particles must:',opts:['Collide with each other and have energy equal to or greater than the activation energy','Move in a straight line','Be in the liquid state','Have the same mass'],ans:0,exp:'Collision theory states two conditions: 1) Particles must COLLIDE with each other. 2) The collision must have energy ≥ ACTIVATION ENERGY. Only successful collisions lead to reaction.'},
    {q:'Increasing the pressure of a gas reaction increases the rate because:',opts:['The gas molecules get larger','The volume decreases, increasing the concentration of gas particles','The gas molecules split into smaller ones','The activation energy decreases'],ans:1,exp:'Increasing pressure DECREASES the volume of the gas. This means gas particles are PACKED CLOSER together, increasing their concentration (particles per unit volume), leading to more frequent collisions.'},
    {q:'Why does a catalyst not increase the yield of a reaction?',opts:['It consumes some reactants','It only speeds up the rate; it does not change the equilibrium position or amount of product formed','It increases the activation energy','It makes products less stable'],ans:1,exp:'A catalyst speeds up BOTH the forward and reverse reactions equally. It lowers the activation energy but does NOT alter the starting amount of reactants or the final amount of products (yield).'},
    {q:'When measuring reaction rate by collecting gas, the initial rate is:',opts:['The fastest rate due to highest concentration of reactants','The slowest rate','Constant throughout the reaction','Zero'],ans:0,exp:'At the START of the reaction, the CONCENTRATION of reactants is at its HIGHEST. Therefore, the frequency of successful collisions is maximal, and the rate of reaction is FASTEST. As reactants are used up, the rate decreases.'},
    {q:'Which of the following would NOT increase the rate of reaction between dilute hydrochloric acid and magnesium?',opts:['Increasing the temperature','Using a higher concentration of acid','Using magnesium powder instead of ribbon','Using magnesium ribbon instead of powder'],ans:3,exp:'Using magnesium RIBBON (a larger particle size) has a SMALLER surface area compared to powder. This reduces the number of collisions per second, thereby DECREASING the rate of reaction.'},
    {q:'A graph showing the volume of gas produced over time for a reaction will:',opts:['Start at zero and rise steeply before flattening out','Start high and fall to zero','Be a straight horizontal line','Rise steeply and then continue rising indefinitely'],ans:0,exp:'A typical gas volume vs time graph: starts at 0. Rises steeply (fast initial rate). Gradually flattens (as reactants are used up). The curve becomes horizontal when the reaction stops (limiting reagent used up).'},
    {q:'Enzymes are biological catalysts. Which factor denatures (permanently destroys) enzymes?',opts:['Lowering temperature to 0°C','Very high temperatures (e.g., above 60°C)','Adding a little more substrate','Changing the pH slightly'],ans:1,exp:'Enzymes are proteins. HIGH TEMPERATURES (usually above 50-60°C) break the weak hydrogen bonds holding the protein structure together. The active site changes shape permanently (denaturation), and the enzyme ceases to function.'},
    {q:'In a reaction where temperature is increased from 20°C to 30°C, the rate of reaction roughly:',opts:['Stays the same','Halves','Doubles','Triples'],ans:2,exp:'As a general rule (for many chemical reactions), increasing the temperature by 10°C roughly DOUBLES the rate of reaction. This is because the kinetic energy of particles increases significantly, leading to more successful collisions.'},
    {q:'What is the function of a "collision" in collision theory?',opts:['To mix the chemicals','To provide the necessary energy for bond breaking','To allow particles to pass through each other','To lower the activation energy'],ans:1,exp:'A collision is the physical impact between reactant particles. If the collision is energetic enough (≥ Ea), it causes existing bonds to break and new bonds to form, leading to the formation of products.'},
    {q:'Why does a reaction stop before all reactants are used up?',opts:['The temperature drops too low','The limiting reagent is completely consumed','The catalyst stops working','The products are too hot'],ans:1,exp:'The reaction stops when one of the reactants (the LIMITING REAGENT) is completely used up. Even if other reactants remain in excess, there is nothing left for them to react with, so no more product can be formed.'},
    {q:'How does grinding a solid into a fine powder affect the rate of reaction?',opts:['It decreases the rate','It has no effect','It increases the rate by increasing surface area','It stops the reaction'],ans:2,exp:'Grinding a solid into a fine powder increases the total SURFACE AREA exposed to the other reactant. More surface area means more particles are exposed, leading to more frequent collisions and a FASTER reaction rate.'},
    {q:'Activation energy is required in chemical reactions to:',opts:['Slow down the reaction','Start the reaction by breaking existing bonds in reactants','Prevent the reaction from happening','Increase the mass of the products'],ans:1,exp:'To start a reaction, the initial bonds in the reactant molecules must be broken. This requires a certain amount of energy input — the ACTIVATION ENERGY. Once bonds are broken, new bonds can form to make products.'},
    {q:'A student adds a catalyst to a reaction mixture. Which graph measurement will change?',opts:['The total mass of product formed','The time taken to reach the end of the reaction','The colour of the product','The final temperature of the mixture'],ans:1,exp:'A catalyst speeds up the reaction by lowering activation energy. This means the reaction will reach completion in a SHORTER TIME. However, the total mass/volume of product formed (the yield) remains EXACTLY the same.'},
    {q:'Light is a factor that can affect the rate of some reactions. Which process is an example of this?',opts:['Rusting of iron','Photosynthesis','Digestion of food','Fermentation of glucose'],ans:1,exp:'PHOTOSYNTHESIS requires LIGHT energy to drive the reaction (6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂). Increasing the light intensity (up to a point) increases the rate of photosynthesis.'},
  ],
  match:[
    {term:'Catalyst',def:'A substance that increases the rate of a reaction without being chemically changed or consumed'},
    {term:'Activation energy',def:'The minimum amount of energy colliding particles must possess in order for a reaction to occur'},
    {term:'Concentration',def:'The amount of solute dissolved in a given volume of solution; higher concentration leads to more frequent collisions'},
    {term:'Surface area',def:'The total exposed area of a solid reactant; increasing surface area (by grinding) increases the reaction rate'},
    {term:'Collision theory',def:'The theory that chemical reactions occur only when particles collide with sufficient energy (≥ activation energy)'},
    {term:'Frequency of collisions',def:'The number of collisions occurring per unit time; increased by higher temperature, concentration, or surface area'},
    {term:'Temperature',def:'A measure of the average kinetic energy of particles; increasing temperature increases both collision frequency and energy'},
    {term:'Pressure',def:'A factor affecting gas reactions; increasing pressure decreases volume and increases concentration, leading to more frequent collisions'},
    {term:'Rate of reaction',def:'The speed at which reactants are converted into products; measured as change in concentration, mass, or volume per unit time'},
    {term:'Success rate',def:'The proportion of collisions that have sufficient energy (≥ activation energy) to lead to a reaction'},
    {term:'Enzyme',def:'A biological catalyst, made of protein, which has a specific active site for a specific substrate'},
    {term:'Active site',def:'The specific region on an enzyme where the substrate binds; denatured if the enzyme is heated too much'},
    {term:'Denaturation',def:'The permanent change in the three-dimensional structure of a protein (enzyme) due to extreme temperatures or pH, causing loss of function'},
    {term:'Limiting reagent',def:'The reactant that is completely consumed first in a chemical reaction, determining when the reaction stops'},
    {term:'Exothermic',def:'A chemical reaction that releases energy (often as heat) to the surroundings'},
    {term:'Endothermic',def:'A chemical reaction that absorbs energy from the surroundings'},
    {term:'Gas syringe',def:'A piece of apparatus used to measure the volume of gas produced in a reaction over time'},
    {term:'Equilibrium',def:'A state in a reversible reaction where the rate of the forward reaction equals the rate of the reverse reaction'},
    {term:'Initial rate',def:'The rate of reaction at the very beginning, when reactant concentrations are at their highest'},
    {term:'Graph gradient',def:'The slope of a line on a graph; steep gradient = fast rate, flat gradient = slow/no rate'},
  ],
  flashcards:[
    {q:'State 4 factors that affect the rate of reaction.',a:'1. Temperature (higher = faster rate). 2. Concentration (higher = faster rate). 3. Surface area (larger = faster rate). 4. Catalyst (lowers activation energy = faster rate). 5. Pressure (for gases — higher = faster rate).'},
    {q:'Explain collision theory.',a:'For a reaction to occur, particles must: (1) COLLIDE with each other, and (2) have energy equal to or greater than the ACTIVATION ENERGY. Any factor that increases the frequency of collisions OR the proportion of collisions with sufficient energy will increase the reaction rate.'},
    {q:'How is the rate of reaction measured experimentally?',a:'Common methods: 1. Collecting gas and measuring the volume produced over time using a gas syringe. 2. Measuring the mass loss as a gas escapes (using a balance). 3. Measuring colour change using a colorimeter. 4. Timing how long it takes for a precipitate to form (disappearing cross experiment).'},
    {q:'What is an enzyme and how does it work?',a:'Enzymes are BIOLOGICAL CATALYSTS made of proteins. They have an ACTIVE SITE with a specific shape that is complementary to a specific substrate (lock-and-key model). They lower the activation energy of metabolic reactions and work optimally at specific pH and temperature (e.g., 37°C in the human body).'},
    {q:'Describe how a reaction rate graph changes with time.',a:'The rate is FASTEST at the START of the reaction (when the concentration of reactants is highest). As reactants are used up, the concentration drops, so the rate DECREASES. Eventually, the rate becomes ZERO when the limiting reagent is completely used up, and the graph flattens to a horizontal line.'},
    {q:'How does pressure affect the rate of reaction for gases?',a:'Increasing the pressure on a GAS reaction decreases the volume of the gas. This forces the gas particles to be much CLOSER together, effectively increasing the concentration of the gas. More particles per unit volume leads to more frequent collisions and a FASTER reaction rate.'},
    {q:'Explain the effect of increasing temperature on reaction rate in terms of particles.',a:'Increasing temperature increases the kinetic energy of particles. This has a dual effect: 1) Particles move faster, leading to MORE FREQUENT collisions. 2) A greater proportion of particles now possess energy GREATER THAN THE ACTIVATION ENERGY. Both effects combine to significantly increase the rate.'},
    {q:'Why is a catalyst not consumed in a reaction?',a:'A catalyst provides an alternative reaction pathway with a lower activation energy. It participates in the reaction by forming temporary bonds with reactants, but is released EXACTLY AS IT WAS at the end of the reaction. Therefore, it can be used repeatedly without being used up.'},
    {q:'Explain how the surface area of a solid affects its reaction rate.',a:'Only particles on the SURFACE of a solid can collide with reactant particles. Grinding a solid into a powder greatly increases the exposed surface area. This provides far more collision sites for the other reactant, leading to a FASTER reaction rate.'},
    {q:'What is the difference between a "successful" and an "unsuccessful" collision?',a:'A SUCCESSFUL collision occurs when particles collide and possess energy EQUAL TO OR GREATER THAN the activation energy. This results in the breaking of bonds and the formation of products. An UNSUCCESSFUL collision occurs when particles collide but do not have enough energy (less than the activation energy); they simply bounce off each other.'},
    {q:'Why does a catalyst not affect the yield of a reaction?',a:'A catalyst speeds up BOTH the forward and reverse reactions equally. It lowers the activation energy for both directions. Therefore, although the system reaches equilibrium (or completion) FASTER, the final amount of product (yield) produced from the given amount of reactants remains unchanged.'},
    {q:'Describe the "disappearing cross" method for measuring reaction rate.',a:'This is used for reactions that produce a precipitate (e.g., sodium thiosulfate + acid → sulfur precipitate). A cross is drawn on a paper placed under the flask. As the precipitate forms, the cross becomes invisible. The time taken for the cross to disappear is measured. Shorter time = faster rate.'},
    {q:'How do catalysts benefit industrial processes?',a:'Catalysts allow reactions to proceed at lower temperatures and pressures, which SAVES ENERGY. This reduces fuel consumption and lowers operational costs. Additionally, they reduce the emission of greenhouse gases by making the process more energy-efficient.'},
    {q:'Explain why fresh fruit decomposes faster in a hot kitchen than in a cold refrigerator.',keywords:['kinetic energy','collisions','enzyme activity','microorganisms','temperature'],hint:'How does temperature affect the rate of enzyme-driven biological reactions and bacterial growth?'},
    {q:'Why does increasing the concentration of a reactant increase the rate of reaction?',a:'In a more concentrated solution, there are MORE particles of the reactant per unit volume. This increases the likelihood of particles colliding with each other, leading to a higher FREQUENCY of successful collisions per second, and therefore a FASTER rate.'},
    {q:'What is the role of "activation energy" in the shape of a Maxwell-Boltzmann distribution curve?',a:'On a Maxwell-Boltzmann curve (molecular energy distribution), activation energy (Ea) is a specific threshold value on the x-axis. The area under the curve to the RIGHT of the Ea line represents the proportion of particles with sufficient energy to react. Increasing temperature shifts the curve to the right, increasing this area and thus the reaction rate.'},
    {q:'Why does the rate of a reaction decrease as the reaction progresses?',a:'As the reaction proceeds, the REACTANTS are being used up. This decreases their concentration. With fewer particles available to collide, the FREQUENCY of collisions drops steadily. Therefore, the reaction rate slows down over time until it eventually stops.'},
    {q:'Explain how a catalyst, surface area, and temperature all operate based on collision theory.',a:'1. TEMPERATURE increases both collision frequency and energy. 2. SURFACE AREA increases the number of exposed particles, increasing collision frequency. 3. CATALYST lowers the activation energy, increasing the proportion of collisions that are successful. All three increase the reaction rate via collision theory.'},
    {q:'What is a "reversible reaction" and how does a catalyst affect its equilibrium?',a:'A REVERSIBLE reaction is one where products can react to reform the reactants (e.g., N₂ + 3H₂ ⇌ 2NH₃). Adding a catalyst speeds up BOTH the forward and reverse reactions equally. It does NOT change the equilibrium position (ratio of products to reactants at equilibrium); it only helps the system reach equilibrium FASTER.'},
    {q:'A student measures the rate of a reaction by collecting gas in a syringe. Why does the rate always start out fast and then slow down?',a:'At the start, there is the MAXIMUM concentration of reactants available. This gives the maximum number of collisions per second (fastest initial rate). As reactants are used up, their concentration falls, reducing the frequency of collisions and slowing the rate down.'},
  ],
  blanks:{
    passage:'A substance that speeds up a chemical reaction without being used up is called a [_]. It works by providing an alternative reaction pathway with a lower [_] energy. When the temperature is increased, the particles gain more [_] energy and collide more frequently. A solid ground into a powder has a larger [_] area, which also increases the rate of reaction because there are more collision sites. According to [_] theory, particles must collide with sufficient energy to react.',
    answers:['catalyst','activation','kinetic','surface','Collision'],
    wordbank:['catalyst','activation','kinetic','surface','Collision','potential','concentration','frequency'],
  },
  sentences:[
    {prompt:'Explain why food decomposes faster at room temperature than in a refrigerator.',keywords:['temperature','kinetic energy','collisions','enzyme activity','rate','microorganisms'],hint:'How does temperature affect the rate of biological and chemical reactions, specifically those driven by enzymes in bacteria?'},
    {prompt:'Explain how a catalyst increases the rate of reaction without being used up during the process.',keywords:['activation energy','alternative pathway','lower','unchanged','regenerated','catalyst'],hint:'What does a catalyst do to the energy barrier of a reaction, and what happens to the catalyst at the end?'},
    {prompt:'Explain why marble chips (calcium carbonate) react faster with dilute hydrochloric acid than a single large block of marble of the same total mass.',keywords:['surface area','collision','frequency','particles','powder','solid'],hint:'Think about how many acid particles can physically reach and touch the marble at any given moment in the two different forms.'},
    {prompt:'Using collision theory, explain why increasing the concentration of a solution increases the rate of reaction.',keywords:['particles','volume','frequency','collision','successful','concentration'],hint:'What happens to the number of particles in a specific volume when concentration increases? How does this affect collisions?'},
    {prompt:'Describe the shape of a typical gas-volume-versus-time graph for a chemical reaction and explain its shape.',keywords:['graph','steep','flatten','reactant','concentration','limiting','reagent'],hint:'Why does the graph rise quickly at the start, and why does it eventually become a horizontal line?'},
    {prompt:'Explain why increasing the pressure of a gas reaction mixture speeds up the reaction.',keywords:['pressure','volume','gas','particles','closer','collisions','rate'],hint:'What physical change happens to the gas particles when the volume is decreased by high pressure?'},
    {prompt:'Discuss the role of a catalyst in an industrial process like the Haber process (making ammonia).',keywords:['catalyst','iron','rate','energy','cost','efficiency','temperature','pressure'],hint:'How does the catalyst help the industrial production of ammonia economically and energetically?'},
    {prompt:'Explain why grinding a solid reactant into a fine powder increases the reaction rate.',keywords:['surface area','powder','exposed','collisions','rate','large lump'],hint:'Only particles on the surface can react. What happens to the surface when a solid is crushed into tiny pieces?'},
    {prompt:'Why does the rate of reaction decrease over time in a closed system?',keywords:['reactants','used up','concentration','collisions','rate','decrease'],hint:'What happens to the amount of reactants as time passes? How does this affect the likelihood of collisions?'},
    {prompt:'Using the concept of activation energy, explain why a collision must have sufficient energy to result in a chemical reaction.',keywords:['activation energy','minimum','collision','bond breaking','products','successful'],hint:'What must happen to the existing bonds in the reactants for new bonds to form?'},
    {prompt:'Explain what is meant by the term "successful collision" in collision theory.',keywords:['successful','collision','activation energy','products','reaction','energy'],hint:'What two conditions must be met for a collision to result in a chemical change?'},
    {prompt:'Describe how you would measure the rate of a reaction that produces a coloured precipitate.',keywords:['precipitate','disappearing cross','time','rate','colour','turbidity'],hint:'What experimental method uses a drawn mark and a flask to measure how fast a solid is formed?'},
    {prompt:'Explain how a change in temperature affects the rate of reaction for a typical chemical reaction.',keywords:['temperature','kinetic energy','activation energy','collisions','rate','doubles'],hint:'What happens to the speed and energy of particles when they are heated? How does this affect the proportion of collisions above the activation energy?'},
    {prompt:'Why does increasing the concentration of a solution speed up the rate of reaction?',keywords:['concentration','particles','volume','collisions','frequency','successful'],hint:'If you add more solute to a fixed volume of solvent, what happens to the spacing between particles?'},
    {prompt:'Explain the difference between a catalyst and a reactant.',keywords:['catalyst','speeds up','unchanged','reactant','consumed','product'],hint:'One is used up in the reaction; the other is regenerated at the end. Which is which?'},
    {prompt:'Discuss the effect of surface area on the rate of reaction between zinc and hydrochloric acid.',keywords:['zinc','powder','ribbon','surface area','collisions','rate','hydrogen'],hint:'If you drop powdered zinc into acid versus a solid zinc strip, which produces hydrogen gas faster and why?'},
    {prompt:'Explain how enzymes, as biological catalysts, function in the human body.',keywords:['enzyme','active site','substrate','lock and key','catalyst','denaturation'],hint:'What is the specific part of the enzyme that fits the reactant, and what happens if the enzyme is heated too much?'},
    {prompt:'Describe how you could use a gas syringe to experimentally determine the effect of temperature on reaction rate.',keywords:['gas syringe','volume','temperature','time','rate','graph','water bath'],hint:'What apparatus would you use to control the temperature, and what measurement would you record to compare the rates?'},
    {prompt:'Explain why a reaction stops before all the starting materials have been converted into products.',keywords:['limiting reagent','excess','consumed','stop','reaction','reactant'],hint:'What happens when one of the reactants is completely used up?'},
    {prompt:'Explain the role of activation energy in chemical reactions.',keywords:['activation energy','bond breaking','minimum','energy','collision','reactants'],hint:'What does this specific energy value represent in terms of the chemical bonds in the reactants?'},
  ],
});
</script></body></html>
