<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nervous System Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Nervous System — BGCSE Biology Quiz',
  color:'#4527a0',dark:'#1a0077',light:'#ede7f6',
  mcq:[
    {q:'The nervous system has two main divisions:',opts:['Brain and spinal cord','CNS and PNS','Sensory and motor','Somatic and autonomic'],ans:1,exp:'The nervous system is divided into the CNS (Central Nervous System: brain + spinal cord) and PNS (Peripheral Nervous System: all other nerves connecting CNS to rest of body).'},
    {q:'Sensory neurons carry impulses:',opts:['From CNS to effectors','From receptors to the CNS','Between neurons in the CNS','From muscle to gland'],ans:1,exp:'Sensory (afferent) neurons carry impulses FROM sense organs/receptors TO the CNS. Motor neurons carry impulses FROM the CNS TO effectors (muscles/glands).'},
    {q:'A reflex arc involves which sequence?',opts:['Brain → Receptor → Effector','Receptor → Sensory → Relay → Motor → Effector','Effector → Motor → CNS','Receptor → Motor → Relay → Sensory → Effector'],ans:1,exp:'A reflex arc: Receptor (detects stimulus) → Sensory neuron → Relay neuron (in CNS) → Motor neuron → Effector (muscle/gland). Reflexes bypass the brain for speed.'},
    {q:'The synapse is:',opts:['A type of receptor','A gap between neurons where neurotransmitters are released','The myelin sheath','The cell body of a neuron'],ans:1,exp:'A synapse is the tiny gap (synaptic cleft) between two neurons. Neurotransmitters are released from the pre-synaptic neuron, diffuse across the gap, and bind to receptors on the post-synaptic neuron.'},
    {q:'Myelin sheaths around axons function to:',opts:['Produce neurotransmitters','Speed up nerve impulse transmission','Store glucose for neurons','Insulate the dendrites'],ans:1,exp:'The myelin sheath (made of Schwann cells) insulates the axon and causes impulses to jump from node to node (saltatory conduction) — greatly SPEEDING UP nerve impulse transmission.'},
    {q:'Which part of the brain controls balance and coordination?',opts:['Cerebrum','Medulla oblongata','Cerebellum','Hypothalamus'],ans:2,exp:'The CEREBELLUM coordinates balance, posture, and fine motor movements. The cerebrum handles conscious thought; the medulla controls breathing/heart rate; the hypothalamus controls homeostasis.'},
    {q:'The gaps in the myelin sheath along an axon are called:',opts:['Synapses','Nodes of Ranvier','Dendrites','Schwann cells'],ans:1,exp:'The NODES OF RANVIER are the small unmyelinated gaps between Schwann cells along the axon. The impulse "jumps" from node to node, which speeds up transmission.'},
    {q:'The effector in a reflex arc is always:',opts:['A receptor','A muscle or a gland','A sensory neuron','The brain'],ans:1,exp:'The EFFECTOR is the organ that carries out the response. It is always a MUSCLE (which contracts) or a GLAND (which secretes a chemical/hormone).'},
    {q:'Which part of the brain controls heart rate and breathing?',opts:['Cerebrum','Cerebellum','Medulla oblongata','Hypothalamus'],ans:2,exp:'The MEDULLA OBLONGATA (brain stem) controls autonomic, involuntary functions essential for life, including heart rate, breathing rate, and blood pressure.'},
    {q:'Voluntary actions are controlled by:',opts:['The autonomic nervous system','The somatic nervous system','The spinal cord only','Reflex arcs'],ans:1,exp:'The SOMATIC nervous system controls voluntary movements by sending motor impulses from the CNS to skeletal muscles. The autonomic system controls involuntary actions (heart, digestion).'},
    {q:'When an impulse reaches the end of a neuron, it triggers the release of:',opts:['Electrical signals','Neurotransmitters','Hormones','Myelin'],ans:1,exp:'At the pre-synaptic knob, the electrical impulse triggers the release of NEUROTRANSMITTERS from vesicles into the synaptic cleft to carry the signal to the next neuron.'},
    {q:'The human brain contains approximately how many neurons?',opts:['100 thousand','1 million','86 billion','10 trillion'],ans:2,exp:'The human brain contains an estimated 86 BILLION neurons. These are highly interconnected, forming complex circuits responsible for thought, memory, and body control.'},
    {q:'A receptor is defined as:',opts:['A muscle that contracts','A cell or organ that detects a stimulus','A gap between neurons','A gland that secretes hormones'],ans:1,exp:'A RECEPTOR is a specialized cell or sensory organ that detects changes in the environment (stimuli) such as light, sound, touch, temperature, or chemicals.'},
    {q:'In a reflex arc, the relay neuron is located in the:',opts:['Brain','Spinal cord','Peripheral nerves','Muscle'],ans:1,exp:'The RELAY NEURON is located within the CENTRAL NERVOUS SYSTEM — specifically in the grey matter of the spinal cord (or brain stem for cranial reflexes). It connects sensory and motor neurons.'},
    {q:'Which of the following is NOT a function of the cerebrum?',opts:['Language and speech','Memory and learning','Breathing and heart rate','Conscious thought'],ans:2,exp:'Breathing and heart rate are controlled by the MEDULLA OBLONGATA. The CEREBRUM is responsible for higher-order functions like conscious thought, memory, language, and voluntary movement.'},
    {q:'The autonomic nervous system controls:',opts:['Skeletal muscle movement','Involuntary functions like heart rate and digestion','Conscious decision making','Reflex actions involving the limbs'],ans:1,exp:'The AUTONOMIC nervous system regulates involuntary body functions (homeostasis) such as heartbeat, breathing, digestion, and sweating. It operates without conscious control.'},
    {q:'Neurotransmitters are stored in:',opts:['The cell body','The synaptic cleft','Synaptic vesicles in the pre-synaptic neuron','The post-synaptic membrane'],ans:2,exp:'NEUROTRANSMITTERS are stored in SYNAPTIC VESICLES inside the pre-synaptic knob. When an impulse arrives, these vesicles fuse with the membrane and release their contents into the synaptic cleft.'},
    {q:'The function of the central nervous system is to:',opts:['Carry signals from receptors','Process and coordinate information','Respond to stimuli automatically','Store energy for muscles'],ans:1,exp:'The CNS (brain and spinal cord) acts as the processing centre. It interprets incoming sensory information, makes decisions, and coordinates responses by sending out motor impulses.'},
    {q:'An example of a voluntary action is:',opts:['Breathing while sleeping','Pulling your hand from a hot object','Tying your shoelaces','The heartbeat'],ans:2,exp:'TYING YOUR SHOELACES is a voluntary action. It requires conscious thought and is controlled by the somatic nervous system. Breathing, heart rate, and reflexes are involuntary/automatic.'},
    {q:'If the myelin sheath is damaged (as in Multiple Sclerosis), what happens?',opts:['Nerve impulses speed up','Nerve impulses slow down or are blocked','The brain stops working','Neurotransmitters stop being produced'],ans:1,exp:'When the myelin sheath is damaged, the electrical insulation is lost. The impulse can no longer jump quickly between nodes. As a result, nerve impulses SLOW DOWN significantly or are blocked entirely.'},
  ],
  match:[
    {term:'CNS',def:'Central Nervous System; consists of the brain and spinal cord'},
    {term:'PNS',def:'Peripheral Nervous System; all nerves outside the CNS'},
    {term:'Sensory neuron',def:'Carries impulses from receptors to the CNS'},
    {term:'Motor neuron',def:'Carries impulses from the CNS to effectors (muscles/glands)'},
    {term:'Relay neuron',def:'Connects sensory and motor neurons within the CNS'},
    {term:'Synapse',def:'Gap between two neurons where neurotransmitters carry the signal'},
    {term:'Reflex arc',def:'Rapid involuntary response pathway that bypasses the conscious brain'},
    {term:'Myelin sheath',def:'Fatty insulating layer that speeds up nerve impulse transmission'},
    {term:'Node of Ranvier',def:'Unmyelinated gap along the axon where impulses jump during saltatory conduction'},
    {term:'Effector',def:'A muscle or gland that carries out the response to a stimulus'},
    {term:'Receptor',def:'A specialized cell or organ that detects stimuli (changes in the environment)'},
    {term:'Neurotransmitter',def:'Chemical messenger released at synapses to carry signals between neurons'},
    {term:'Cerebrum',def:'Largest part of the brain; controls conscious thought, memory, and language'},
    {term:'Cerebellum',def:'Part of the brain responsible for balance, posture, and coordination'},
    {term:'Medulla oblongata',def:'Brain stem region that controls autonomic functions like heart rate and breathing'},
    {term:'Hypothalamus',def:'Brain region that regulates homeostasis (temperature, thirst, hunger) and controls the pituitary gland'},
    {term:'Somatic nervous system',def:'Division of the PNS that controls voluntary movements of skeletal muscles'},
    {term:'Autonomic nervous system',def:'Division of the PNS that controls involuntary internal functions (heart, digestion, glands)'},
    {term:'Stimulus',def:'A change in the environment that is detected by a receptor'},
    {term:'Synaptic cleft',def:'The tiny physical gap between the pre-synaptic and post-synaptic neurons'},
  ],
  flashcards:[
    {q:'What is a reflex arc?',a:'The pathway of a reflex action: Receptor → Sensory neuron → Relay neuron (in CNS) → Motor neuron → Effector. It bypasses the conscious brain for rapid, automatic responses to stimuli.'},
    {q:'How does transmission across a synapse occur?',a:'1. Impulse arrives at pre-synaptic knob\n2. Synaptic vesicles fuse with membrane\n3. Neurotransmitters are released into the synaptic cleft\n4. They diffuse across and bind to receptors on the post-synaptic membrane\n5. A new impulse is generated in the next neuron.'},
    {q:'What are the divisions of the nervous system?',a:'The CNS (brain + spinal cord) and the PNS (peripheral nerves). The PNS further divides into the somatic (voluntary) and autonomic (involuntary — heart, digestion, glands).'},
    {q:'What is the function of the hypothalamus?',a:'The hypothalamus acts as the body\'s control centre for homeostasis — regulating body temperature, hunger, thirst, and controlling the pituitary gland\'s hormone secretion.'},
    {q:'State TWO differences between nervous and hormonal coordination.',a:'1. Nervous responses are fast (milliseconds) and short-lived; hormonal responses are slow (seconds/minutes) and long-lasting.\n2. Nervous uses electrical impulses; hormonal uses chemical messengers in the blood.\n3. Nervous acts on specific effectors; hormonal has a wide, widespread effect.'},
    {q:'Name the three main regions of the brain and a function of each.',a:'1. CEREBRUM: conscious thought, memory, language, voluntary movement.\n2. CEREBELLUM: balance, posture, coordination.\n3. MEDULLA OBLONGATA: controls breathing rate, heart rate, blood pressure (autonomic).'},
    {q:'Explain the role of the myelin sheath in nerve impulse transmission.',a:'The myelin sheath is a fatty insulating layer around the axon. It prevents the electrical signal from leaking. It allows the impulse to "jump" from node to node (saltatory conduction), which GREATLY increases the speed of transmission.'},
    {q:'What is the difference between sensory, motor, and relay neurons?',a:'SENSORY neurons carry impulses from receptors to the CNS. MOTOR neurons carry impulses from the CNS to effectors. RELAY neurons connect sensory and motor neurons inside the CNS (brain and spinal cord).'},
    {q:'Why do reflex actions not involve the brain?',a:'Reflex actions bypass the brain to be as FAST as possible. If the impulse had to travel to the brain, be processed, and then sent back to the muscle, it would take too long. The relay neuron in the spinal cord processes it immediately.'},
    {q:'What is an effector? Give two examples.',a:'An EFFECTOR is the organ that brings about the response to a stimulus. Examples: 1. A SKELETAL MUSCLE (contracts to move a limb). 2. A GLAND (secretes a hormone or chemical, e.g., sweat glands).'},
    {q:'Describe the function of the cerebrum.',a:'The CEREBRUM is the largest, outermost part of the brain. It is responsible for all higher-order conscious functions, including: reasoning, memory, language processing, speech, voluntary muscle movements, and sensory perception.'},
    {q:'What is the role of the autonomic nervous system?',a:'The AUTONOMIC nervous system (part of the PNS) controls involuntary, automatic bodily functions that are essential for life and homeostasis. This includes controlling the heart rate, digestion, blood pressure, and sweating.'},
    {q:'Explain how the "all-or-nothing" principle applies to nerve impulses.',a:'A nerve impulse (action potential) either happens fully or does not happen at all. If a stimulus reaches the neuron\'s threshold, it fires with a constant maximum strength. Increasing the strength of the stimulus increases the FREQUENCY of impulses, not the strength.'},
    {q:'What is the difference between a stimulus and a response?',a:'A STIMULUS is a change in the environment that is detected by a receptor (e.g., the pain of touching a hot plate). A RESPONSE is the action taken by the effector to react to the stimulus (e.g., pulling your hand away).'},
    {q:'Why are nerves described as "two-way" pathways despite impulses going one way?',a:'A nerve is a bundle of many individual neurons. While a SINGLE neuron transmits impulses in only one direction, a nerve contains BOTH sensory neurons (carrying impulses TO the CNS) and motor neurons (carrying impulses FROM the CNS).'},
    {q:'What is the function of synaptic vesicles?',a:'Synaptic vesicles are small sacs located at the pre-synaptic knob. They store NEUROTRANSMITTERS. When an action potential arrives, the vesicles move to the membrane, fuse with it, and release the neurotransmitters into the synaptic cleft.'},
    {q:'How does the nervous system coordinate an emergency response?',a:'In an emergency (e.g., seeing a predator), the nervous system quickly activates the SYMPATHETIC nervous system. It increases heart rate, breathing, and blood flow to muscles (the "fight or flight" response) to prepare the body for immediate action.'},
    {q:'What is the difference between a nerve and a neuron?',a:'A NEURON is a single nerve cell (the basic structural unit). A NERVE is a bundle of many thousands of individual neurons (axons) wrapped together in connective tissue, carrying impulses between the CNS and the rest of the body.'},
    {q:'Why does the autonomic nervous system work without conscious thought?',a:'The autonomic nervous system regulates vital processes (heartbeat, digestion) that must happen continuously to keep the body alive. If we had to consciously control these, we would not be able to sleep or focus on other tasks.'},
    {q:'Describe the role of the medulla oblongata in the regulation of breathing.',a:'The MEDULLA OBLONGATA contains the respiratory center. It continuously monitors the level of carbon dioxide (CO₂) in the blood. When CO₂ rises, it sends impulses to the diaphragm and intercostal muscles to increase the breathing rate.'},
  ],
  blanks:{
    passage:'Nerve cells called [_] carry information from receptors to the central nervous system. Inside the spinal cord, [_] neurons connect these to motor neurons. The [_] neurons then carry impulses outwards to muscles or glands called [_]. At the junction between neurons, called a [_], chemical messengers called [_] carry the signal across the gap.',
    answers:['sensory','relay','motor','effectors','synapse','neurotransmitters'],
    wordbank:['sensory','relay','motor','effectors','synapse','neurotransmitters','hormones','dendrites','myelin'],
  },
  sentences:[
    {prompt:'Explain why a reflex action is faster than a voluntary response.',keywords:['relay neuron','spinal cord','brain','bypass','pathway','fast'],hint:'What part of the nervous system does a reflex "skip" compared to a voluntary action?'},
    {prompt:'Describe how an impulse crosses a synapse from one neuron to the next.',keywords:['neurotransmitter','diffuse','receptor','vesicle','synaptic cleft','post-synaptic'],hint:'Think about what happens at the pre-synaptic membrane, the gap, and the post-synaptic membrane.'},
    {prompt:'Explain the role of myelin sheaths in nerve impulse transmission.',keywords:['saltatory','speed','insulate','axon','node of Ranvier','jump'],hint:'How does myelin change how the electrical impulse moves along the axon physically?'},
    {prompt:'Describe the pathway of a simple reflex action when you step on a sharp object.',keywords:['receptor','sensory neuron','spinal cord','relay neuron','motor neuron','effector'],hint:'Trace the impulse from your foot all the way to the muscle that pulls your leg back.'},
    {prompt:'Explain the difference between the central nervous system and the peripheral nervous system.',keywords:['CNS','brain','spinal cord','PNS','nerves','connect'],hint:'One is the central control hub; the other is the network that connects it to the body.'},
    {prompt:'Describe how the cerebrum and cerebellum differ in their functions.',keywords:['cerebrum','conscious','memory','cerebellum','balance','coordination'],hint:'One deals with your active thoughts; the other deals with your physical stability and movement.'},
    {prompt:'Explain why damage to the medulla oblongata is often fatal.',keywords:['medulla','heart rate','breathing','autonomic','vital','death'],hint:'What essential, unconscious processes does the medulla control?'},
    {prompt:'Outline how a receptor detects a stimulus and converts it into a nerve impulse.',keywords:['receptor','stimulus','detect','transducer','impulse','signal'],hint:'A receptor converts one form of energy (like heat or light) into an electrical signal.'},
    {prompt:'Explain the role of the hypothalamus in linking the nervous and endocrine systems.',keywords:['hypothalamus','homeostasis','pituitary','hormones','brain','control'],hint:'The hypothalamus monitors the body and tells the pituitary gland what hormones to release.'},
    {prompt:'Compare the speed and duration of nervous responses versus hormonal responses.',keywords:['nervous','fast','milliseconds','short','hormonal','slow','long-lasting'],hint:'Does a hormone work as quickly as a nerve impulse? Does it last as long?'},
    {prompt:'Describe what happens to the chemical signal after a neurotransmitter binds to the post-synaptic receptor.',keywords:['neurotransmitter','receptor','bind','diffuse','reuptake','breakdown'],hint:'To stop the signal, how does the body clear the neurotransmitter from the synapse?'},
    {prompt:'Explain how the somatic nervous system allows you to lift a heavy box.',keywords:['somatic','voluntary','motor neuron','skeletal muscle','conscious','brain'],hint:'Is this voluntary or involuntary? Which division controls skeletal muscles?'},
    {prompt:'Why are reflex arcs considered an evolutionary advantage?',keywords:['reflex','fast','danger','survival','protection','injury'],hint:'If you touch a fire, why is it better to react instantly rather than thinking about it first?'},
    {prompt:'Explain the function of the Nodes of Ranvier.',keywords:['node of Ranvier','myelin','gap','saltatory','speed','axon'],hint:'What happens to the electrical impulse when it reaches an unmyelinated gap?'},
    {prompt:'Describe the difference between an afferent and an efferent neuron.',keywords:['afferent','towards','CNS','sensory','efferent','away','CNS','motor'],hint:'Afferent carries toward the CNS. Efferent carries away from the CNS.'},
    {prompt:'Explain why multiple sclerosis (demyelination) causes coordination problems.',keywords:['myelin','sheath','damage','impulse','slow','muscle','coordination'],hint:'If signals to muscles travel slowly or get blocked, what happens to movement and balance?'},
    {prompt:'Outline what happens inside a neuron when an action potential is generated.',keywords:['action potential','depolarization','sodium','potassium','charge','membrane'],hint:'Think about the reversal of electrical charges across the membrane due to ion movement.'},
    {prompt:'Explain how the brain coordinates the "fight or flight" response via the autonomic system.',keywords:['autonomic','sympathetic','adrenaline','heart rate','oxygen','muscles'],hint:'What part of the nervous system takes over in a stressful situation, and what does it signal the body to do?'},
    {prompt:'Describe how a drug that blocks neurotransmitter receptors would affect a person.',keywords:['drug','neurotransmitter','receptor','block','synapse','impulse','stop'],hint:'If the neurotransmitter cannot bind to the next neuron, what happens to the signal transmission?'},
    {prompt:'Explain why the PNS is necessary for the CNS to function effectively.',keywords:['PNS','CNS','connect','peripheral','receptors','effectors','communication'],hint:'How would the brain know what is happening in the outside world without the PNS?'},
  ],
});
</script></body></html>
