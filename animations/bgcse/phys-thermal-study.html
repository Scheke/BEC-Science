<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Thermal Physics — BEC Study</title>
<style>*,*::before,*::after{box-sizing:border-box}</style>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="../study-engine.js"></script>
<script>
function bg(sk,c){sk.background(...(c||[12,14,22]))}

const STEPS=[
  {
    title:'Heat Transfer — Three Methods',
    body:`Heat (thermal energy) can move in three ways:
    <br><br>
    <strong>1. Conduction</strong> — through solids; particles vibrate and pass energy along. Metals are best conductors.
    <br><br>
    <strong>2. Convection</strong> — through liquids and gases; warm fluid rises (less dense), cool fluid sinks — creates convection currents.
    <br><br>
    <strong>3. Radiation</strong> — through vacuum/space; electromagnetic waves (infrared). No particles needed — this is how the Sun's heat reaches Earth.`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      const methods=[
        {n:'Conduction',icon:'🔩',desc:'Solids / metals',c:[231,76,60],x:0.18},
        {n:'Convection',icon:'💧',desc:'Liquids & gases',c:[52,152,219],x:0.5},
        {n:'Radiation',icon:'☀️',desc:'Vacuum / space',c:[241,196,15],x:0.82},
      ];
      methods.forEach((m,i)=>{
        const cx=m.x*W,cy=H*0.46;
        const pulse=1+Math.sin(t*1.5+i)*0.07;
        sk.fill(...m.c,40);sk.noStroke();sk.ellipse(cx,cy,120*pulse,86*pulse);
        sk.fill(...m.c);sk.ellipse(cx,cy,100,72);
        sk.fill(255);sk.textSize(18);sk.textAlign(sk.CENTER,sk.CENTER);sk.text(m.icon,cx,cy-10);
        sk.fill(255);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.text(m.n,cx,cy+10);
        sk.textStyle(sk.NORMAL);sk.fill(255,255,255,160);sk.textSize(8.5);sk.text(m.desc,cx,cy+23);
        // Animation
        if(i===0){// Conduction - vibrating particles
          for(let j=0;j<5;j++){
            const px=cx-55+j*22,py=cy-40;
            const vibr=Math.sin(t*3+j)*4;
            sk.fill(231,76,60,200);sk.noStroke();sk.circle(px+vibr,py,12);
            if(j<4){sk.stroke(231,76,60,100);sk.strokeWeight(2);sk.line(px+vibr+6,py,px+22-6,py);}
          }
        }else if(i===1){// Convection - rising arrow
          const ry=H*0.26-((t*30)%60);
          sk.stroke(52,152,219,180);sk.strokeWeight(2);sk.noFill();
          sk.line(cx,H*0.26,cx,H*0.2);
          sk.fill(52,152,219,180);sk.noStroke();
          sk.triangle(cx,H*0.19,cx-5,H*0.23,cx+5,H*0.23);
          sk.fill(231,76,60,200);sk.noStroke();sk.circle(cx,ry,10);
        }else{// Radiation - waves
          for(let r=1;r<=3;r++){
            const rad=((t*40+r*20)%120);
            sk.stroke(241,196,15,180-rad);sk.strokeWeight(1.5);sk.noFill();
            sk.circle(cx,H*0.22,rad*1.5);
          }
        }
      });
    }
  },
  {
    title:'Specific Heat Capacity',
    body:`<strong>Specific heat capacity (c)</strong> is the energy needed to raise 1 kg of a substance by 1°C.
    <br><br>
    Formula: <strong>Q = mcΔT</strong>
    <ul style="margin:8px 0 0 18px;line-height:2">
      <li>Q = heat energy (J)</li>
      <li>m = mass (kg)</li>
      <li>c = specific heat capacity (J/kg°C)</li>
      <li>ΔT = temperature change (°C)</li>
    </ul>
    Water has a very high SHC: <strong>c = 4200 J/kg°C</strong>
    <br><br>
    This makes water excellent for cooling and central heating systems.`,
    draw:(sk)=>{
      bg(sk,[12,18,28]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Beaker heating
      sk.fill(100,180,255,60);sk.noStroke();sk.rect(W*0.22,H*0.2,W*0.56,H*0.55,0,0,8,8);
      sk.stroke(100,180,255,120);sk.strokeWeight(1.5);sk.noFill();sk.rect(W*0.22,H*0.2,W*0.56,H*0.55,0,0,8,8);
      // Water level
      const tempProg=(Math.sin(t)+1)/2;
      sk.fill(52,152,219,140);sk.noStroke();
      sk.rect(W*0.22,H*0.55,W*0.56,H*0.2,0,0,8,8);
      // Bubbles as temperature rises
      for(let i=0;i<Math.floor(tempProg*5);i++){
        const bx=W*0.3+Math.random()*W*0.4;
        const by=H*0.55-((t*20+i*15)%70);
        if(by>H*0.2)sk.circle(bx,by,5);
      }
      // Temperature gauge
      const T=20+tempProg*80;
      sk.fill(255,220,50);sk.textSize(12);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      sk.text(Math.floor(T)+'°C',W*0.5,H*0.38);sk.textStyle(sk.NORMAL);
      // Flame
      sk.textSize(22);sk.textAlign(sk.CENTER);sk.text('🔥',W*0.5,H*0.82);
      // Formula
      sk.fill(255,220,50);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      sk.text('Q = mcΔT',W/2,H*0.12);
      sk.textStyle(sk.NORMAL);sk.fill(255,255,255,80);sk.textSize(9);
      sk.text('Water: c = 4200 J/kg°C',W/2,H*0.94);
    }
  },
  {
    title:'Latent Heat',
    body:`<strong>Latent heat</strong> is the energy needed to change the <em>state</em> of a substance WITHOUT changing its temperature.
    <br><br>
    During a state change, energy breaks/forms intermolecular bonds — temperature stays constant.
    <br><br>
    Formula: <strong>Q = mL</strong>
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li>L = specific latent heat (J/kg)</li>
      <li>Latent heat of <strong>fusion</strong> (melting) — for water: 334,000 J/kg</li>
      <li>Latent heat of <strong>vaporisation</strong> (boiling) — for water: 2,260,000 J/kg</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk,[10,14,22]);
      const W=sk.width,H=sk.height;
      // Heating curve
      const ax=W*0.1,ay=H*0.86,gw=W*0.82,gh=H*0.72;
      sk.stroke(255,255,255,40);sk.strokeWeight(1);sk.noFill();
      sk.line(ax,ay-gh,ax,ay);sk.line(ax,ay,ax+gw,ay);
      // Curve segments
      sk.stroke(231,76,60,220);sk.strokeWeight(3);sk.noFill();
      // Solid heating
      sk.line(ax,ay,ax+gw*0.2,ay-gh*0.3);
      // Melting (flat)
      sk.stroke(255,220,50,220);sk.line(ax+gw*0.2,ay-gh*0.3,ax+gw*0.45,ay-gh*0.3);
      // Liquid heating
      sk.stroke(231,76,60,220);sk.line(ax+gw*0.45,ay-gh*0.3,ax+gw*0.65,ay-gh*0.72);
      // Boiling (flat)
      sk.stroke(255,220,50,220);sk.line(ax+gw*0.65,ay-gh*0.72,ax+gw,ay-gh*0.72);
      // Labels
      sk.noStroke();sk.fill(255,255,255,80);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('Solid',ax+gw*0.1,ay-gh*0.1);
      sk.text('Melting\n0°C',ax+gw*0.33,ay-gh*0.38);
      sk.text('Liquid',ax+gw*0.56,ay-gh*0.52);
      sk.text('Boiling\n100°C',ax+gw*0.82,ay-gh*0.8);
      // Latent heat arrows
      sk.fill(255,220,50);sk.textSize(8.5);
      sk.text('← Latent heat of fusion →',ax+gw*0.33,ay-gh*0.22);
      sk.text('← Latent heat of vaporisation →',ax+gw*0.83,ay-gh*0.58);
      // Axes
      sk.fill(255,255,255,80);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('Time / Energy supplied →',ax+gw/2,ay+14);
      sk.push();sk.translate(ax-14,ay-gh/2);sk.rotate(-sk.HALF_PI);sk.text('Temperature (°C)',0,0);sk.pop();
    }
  },
  {
    title:'🎮 Check — Heat Transfer & Latent Heat',
    body:'Answer these questions on the three types of heat transfer and latent heat.',
    draw:null,
    game:{type:'mcq',questions:[
      {q:'How does heat travel from the Sun to Earth?',opts:['Conduction through space','Convection through space','Radiation (infrared waves)','All three equally'],ans:2,exp:'Space is a vacuum — there are no particles. Only RADIATION (infrared electromagnetic waves) can travel through a vacuum. This is how the Sun heats the Earth.'},
      {q:'Water has a specific heat capacity of 4200 J/kg°C. How much energy heats 2 kg of water by 5°C?',opts:['420 J','4200 J','42000 J','21000 J'],ans:2,exp:'Q = mcΔT = 2 × 4200 × 5 = 42,000 J. Note the large SHC of water — it stores a lot of energy.'},
      {q:'During melting of ice, what happens to temperature?',opts:['It rises steadily','It falls','It stays constant','It fluctuates'],ans:2,exp:'During melting, energy is used to BREAK bonds between molecules (latent heat of fusion) — not to raise temperature. So temperature stays constant at 0°C until all ice melts.'},
      {q:'Which surfaces absorb radiation most effectively?',opts:['Shiny white surfaces','Dull black surfaces','Metallic silver surfaces','Smooth light-coloured surfaces'],ans:1,exp:'Dull, black surfaces are the BEST absorbers AND emitters of infrared radiation. Shiny, light-coloured surfaces reflect most radiation and absorb little.'},
    ]}
  },
  {
    title:'Gas Laws',
    body:`For a fixed amount of gas:
    <br><br>
    <strong>Boyle's Law</strong>: P ∝ 1/V (at constant temperature)
    <br>Pressure × Volume = constant &emsp; → &emsp; P₁V₁ = P₂V₂
    <br><br>
    <strong>Charles's Law</strong>: V ∝ T (at constant pressure)
    <br>Volume / Temperature = constant
    <br><br>
    <strong>Pressure Law</strong>: P ∝ T (at constant volume)
    <br><br>
    <strong>Combined (Ideal Gas Law):</strong>
    <br>PV/T = constant &emsp; → &emsp; P₁V₁/T₁ = P₂V₂/T₂
    <br><br>
    <em>Temperature must always be in Kelvin (K = °C + 273)</em>`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Piston compressing gas
      const vol=0.5+Math.sin(t)*0.3;
      const boxH=H*0.5*vol;
      const boxW=W*0.5;
      const bx=W*0.25,by=H*0.7;
      sk.fill(100,180,255,50);sk.noStroke();sk.rect(bx,by-boxH,boxW,boxH,4,4,0,0);
      sk.stroke(100,180,255,120);sk.strokeWeight(1.5);sk.noFill();sk.rect(bx,by-boxH,boxW,boxH,4,4,0,0);
      // Piston
      sk.fill(150,150,150,200);sk.noStroke();sk.rect(bx,by-boxH-10,boxW,12,4);
      // Gas particles
      for(let i=0;i<12;i++){
        const px=bx+Math.random()*boxW;
        const py=by-Math.random()*boxH;
        if(sk.frameCount%2===0){
          sk.fill(255,220,50,200);sk.noStroke();sk.circle(px,py,7);
        }
      }
      // Pressure indicator
      const P=Math.round(100/vol);
      sk.fill(231,76,60);sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      sk.text('P = '+P+' kPa',W*0.5,H*0.82);
      sk.text('V = '+Math.round(vol*100)+'%',W*0.5,H*0.90);
      sk.textStyle(sk.NORMAL);
      sk.fill(255,220,50);sk.textSize(11);sk.textStyle(sk.BOLD);
      sk.text("P₁V₁ = P₂V₂",W*0.5,H*0.1);
      sk.textStyle(sk.NORMAL);
    }
  },
  {
    title:'Thermal Expansion & Applications',
    body:`Most solids, liquids, and gases <strong>expand when heated</strong> — particles gain energy and move further apart.
    <br><br>
    Applications of thermal expansion:
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li><strong>Bimetallic strip</strong> — two metals with different expansion rates; bends when heated — used in thermostats and fire alarms</li>
      <li><strong>Gaps in railway tracks and bridges</strong> — leave room for expansion in summer</li>
      <li><strong>Liquid-in-glass thermometer</strong> — liquid expands and rises up the tube</li>
      <li><strong>Car engine cooling system</strong> — water absorbs heat, expands into overflow tank</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk,[12,18,25]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Bimetallic strip bending
      const temp=(Math.sin(t)+1)/2;
      const bend=temp*40;
      const cx=W/2,cy=H*0.5;
      // Metal 1 (top, larger expansion)
      sk.stroke(231,76,60,200);sk.strokeWeight(6);sk.noFill();
      sk.beginShape();
      for(let i=0;i<20;i++){
        const x=cx-W*0.3+i*(W*0.6/19);
        const y=cy-8+bend*(i/19)*(i/19);
        sk.curveVertex(x,y);
      }sk.endShape();
      // Metal 2 (bottom, smaller expansion)
      sk.stroke(52,152,219,200);sk.strokeWeight(6);sk.noFill();
      sk.beginShape();
      for(let i=0;i<20;i++){
        const x=cx-W*0.3+i*(W*0.6/19);
        const y=cy+8+bend*(i/19)*(i/19)*0.6;
        sk.curveVertex(x,y);
      }sk.endShape();
      // Labels
      sk.fill(231,76,60);sk.noStroke();sk.textSize(9);sk.textAlign(sk.LEFT);
      sk.text('Metal A (expands more)',W*0.05,cy-24);
      sk.fill(52,152,219);sk.text('Metal B (expands less)',W*0.05,cy+32);
      // Temperature label
      sk.fill(255,220,50);sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      sk.text(temp>0.5?'HOT → strip bends ↓':'COOL → strip is flat',W/2,H*0.14);sk.textStyle(sk.NORMAL);
      // Thermometer analogy
      sk.fill(255,255,255,80);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('Bimetallic strip in thermostats and fire alarms',W/2,H*0.9);
    }
  },
  {
    q:'Thermometer — Labeled Diagram',
    content:`<h3>Liquid-in-Glass Thermometer</h3><p>A liquid-in-glass thermometer measures temperature by exploiting the thermal expansion of a liquid (mercury or alcohol). As temperature rises, the liquid expands and rises up the narrow capillary tube, giving a reading on the calibrated scale.</p><ul><li>The <strong>bulb</strong> has thin glass walls to ensure rapid heat transfer to the liquid inside.</li><li>The <strong>capillary tube</strong> (narrow bore) amplifies small volume changes into a measurable length change.</li><li>The scale is marked at fixed points: 0°C (melting ice) and 100°C (boiling water).</li></ul>`,
    visual:`<svg viewBox="0 0 420 260" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#283593"/></marker></defs>
  <rect width="420" height="260" fill="#e8eaf6" rx="8"/>
  <text x="210" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#283593">Liquid-in-Glass Thermometer</text>
  <!-- Thermometer outline -->
  <rect x="185" y="38" width="22" height="165" rx="11" fill="#fff" stroke="#283593" stroke-width="2"/>
  <!-- Bulb -->
  <ellipse cx="196" cy="215" rx="18" ry="20" fill="#ef5350" stroke="#283593" stroke-width="2"/>
  <!-- Liquid column (mercury/alcohol) -->
  <rect x="190" y="90" width="12" height="125" rx="4" fill="#ef5350"/>
  <!-- Scale lines -->
  <line x1="207" y1="50" x2="215" y2="50" stroke="#283593" stroke-width="1.5"/>
  <line x1="207" y1="75" x2="215" y2="75" stroke="#283593" stroke-width="1.5"/>
  <line x1="207" y1="100" x2="218" y2="100" stroke="#283593" stroke-width="2"/>
  <line x1="207" y1="125" x2="215" y2="125" stroke="#283593" stroke-width="1.5"/>
  <line x1="207" y1="150" x2="215" y2="150" stroke="#283593" stroke-width="1.5"/>
  <line x1="207" y1="175" x2="218" y2="175" stroke="#283593" stroke-width="2"/>
  <line x1="207" y1="200" x2="215" y2="200" stroke="#283593" stroke-width="1.5"/>
  <!-- Scale labels -->
  <text x="220" y="103" font-size="10" fill="#283593">100°C (boiling)</text>
  <text x="220" y="178" font-size="10" fill="#283593">0°C (melting)</text>
  <!-- Labels with arrows -->
  <!-- Capillary tube -->
  <line x1="183" y1="80" x2="140" y2="65" stroke="#283593" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="40" y="62" font-size="10" fill="#283593" font-weight="bold">Capillary tube</text>
  <text x="40" y="74" font-size="9" fill="#333">(narrow bore)</text>
  <!-- Liquid column -->
  <line x1="189" y1="110" x2="148" y2="100" stroke="#c62828" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="50" y="97" font-size="10" fill="#c62828" font-weight="bold">Liquid column</text>
  <text x="50" y="109" font-size="9" fill="#333">(expands with heat)</text>
  <!-- Bulb label -->
  <line x1="178" y1="218" x2="140" y2="230" stroke="#283593" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="30" y="228" font-size="10" fill="#283593" font-weight="bold">Bulb</text>
  <text x="30" y="240" font-size="9" fill="#333">(thin glass, sensitive)</text>
  <!-- Glass walls -->
  <line x1="210" y1="45" x2="310" y2="45" stroke="#283593" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="312" y="49" font-size="10" fill="#283593" font-weight="bold">Glass walls</text>
  <!-- Scale label -->
  <line x1="220" y1="135" x2="315" y2="135" stroke="#283593" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="317" y="139" font-size="10" fill="#283593" font-weight="bold">Temperature scale</text>
  <text x="317" y="151" font-size="9" fill="#333">(°C or K)</text>
  <!-- Principle note -->
  <rect x="18" y="238" width="384" height="17" rx="4" fill="#c5cae9" stroke="#283593" stroke-width="1"/>
  <text x="210" y="250" text-anchor="middle" font-size="9.5" fill="#283593">Principle: Liquid expands when heated → rises up capillary tube → read off scale.</text>
</svg>`
  },
  {
    q:'Heat Transfer Methods — Three Diagrams',
    content:`<h3>Three Methods of Heat Transfer</h3><p>Heat energy can move from one place to another by three distinct mechanisms. Understanding which mechanism applies depends on the medium (solid, fluid, or vacuum) through which the heat travels.</p><ul><li><strong>Conduction:</strong> particles vibrate and pass energy to neighbours; best in metals; no particle flow.</li><li><strong>Convection:</strong> hot fluid rises (less dense) and cool fluid sinks, creating a convection current; only in liquids and gases.</li><li><strong>Radiation:</strong> infrared electromagnetic waves carry energy through a vacuum; no particles required — this is how the Sun heats the Earth.</li></ul>`,
    visual:`<svg viewBox="0 0 420 270" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#283593"/></marker>
  <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c62828"/></marker>
  <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e65100"/></marker></defs>
  <rect width="420" height="270" fill="#e8eaf6" rx="8"/>
  <text x="210" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#283593">Three Methods of Heat Transfer</text>
  <!-- Conduction panel -->
  <rect x="10" y="30" width="125" height="175" rx="6" fill="#fff" stroke="#283593" stroke-width="1.5"/>
  <text x="72" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">Conduction</text>
  <!-- Metal rod -->
  <rect x="22" y="100" width="102" height="18" rx="4" fill="#90a4ae" stroke="#283593" stroke-width="1.5"/>
  <!-- Particles vibrating -->
  <circle cx="36" cy="109" r="7" fill="#ef5350" stroke="#c62828" stroke-width="1"/>
  <circle cx="55" cy="109" r="7" fill="#ef9a9a" stroke="#c62828" stroke-width="1"/>
  <circle cx="74" cy="109" r="7" fill="#ef9a9a" stroke="#c62828" stroke-width="1"/>
  <circle cx="93" cy="109" r="7" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <circle cx="112" cy="109" r="6" fill="#fff9c4" stroke="#c62828" stroke-width="1"/>
  <!-- Heat source -->
  <rect x="10" y="90" width="18" height="38" rx="3" fill="#ef5350"/>
  <text x="19" y="114" text-anchor="middle" font-size="8" fill="#fff">🔥</text>
  <!-- Arrow right -->
  <line x1="22" y1="135" x2="118" y2="135" stroke="#c62828" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="70" y="148" text-anchor="middle" font-size="9" fill="#c62828">Energy travels</text>
  <text x="70" y="160" text-anchor="middle" font-size="9" fill="#c62828">particle to particle</text>
  <text x="72" y="175" text-anchor="middle" font-size="9" fill="#333">Solids / metals</text>
  <text x="72" y="188" text-anchor="middle" font-size="9" fill="#555">No particle flow</text>
  <!-- Convection panel -->
  <rect x="148" y="30" width="125" height="175" rx="6" fill="#fff" stroke="#283593" stroke-width="1.5"/>
  <text x="210" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">Convection</text>
  <!-- Container -->
  <rect x="160" y="58" width="102" height="110" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <!-- Arrows showing convection current -->
  <line x1="180" y1="155" x2="180" y2="80" stroke="#c62828" stroke-width="2" marker-end="url(#arrR)"/>

  {
    q:'Specific Heat Capacity — Water vs Metal',
    content:`<h3>Specific Heat Capacity (SHC)</h3><p>Specific heat capacity (c) is the amount of energy needed to raise the temperature of 1 kg of a substance by 1°C. The formula Q = mcΔT links heat energy, mass, SHC, and temperature change and is one of the most important equations in thermal physics.</p><ul><li>Water has a very high SHC (4200 J/kg°C) — it heats and cools slowly, making it ideal for central heating and cooling systems.</li><li>Metals like copper have a low SHC (385 J/kg°C) — they heat and cool quickly.</li><li>The same amount of energy raises the temperature of copper far more than the same mass of water.</li></ul>`,
