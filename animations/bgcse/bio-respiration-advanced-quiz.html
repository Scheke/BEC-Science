<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Respiration Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Respiration (Advanced) — BGCSE Biology Quiz',
  color:'#880e4f',dark:'#560027',light:'#fce4ec',
  mcq:[
    {q:'The equation for aerobic respiration is:',opts:['C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + Energy','C₆H₁₂O₆ → 2C₃H₆O₃ + Energy','6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂','C₆H₁₂O₆ + O₂ → CO₂ + H₂O + ATP'],ans:0,exp:'Aerobic respiration: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + ~38ATP. This is the COMPLETE oxidation of glucose, releasing maximum energy.'},
    {q:'Anaerobic respiration in mammals produces:',opts:['Ethanol and CO₂','Lactic acid','Water and CO₂','Glucose and ATP'],ans:1,exp:'In MAMMALS (including humans), anaerobic respiration produces LACTIC ACID from glucose. Only 2 ATP are produced (vs ~38 in aerobic). Lactic acid causes muscle fatigue.'},
    {q:'Aerobic respiration occurs mainly in the:',opts:['Nucleus','Cell membrane','Ribosome','Mitochondria'],ans:3,exp:'Aerobic respiration occurs in the MITOCHONDRIA — specifically the matrix (Krebs cycle) and inner membrane (oxidative phosphorylation/electron transport chain). More mitochondria = more aerobic respiration capacity.'},
    {q:'The "oxygen debt" after exercise refers to:',opts:['Lack of oxygen in the lungs','Extra oxygen needed to oxidise accumulated lactic acid','Decrease in lung capacity','Oxygen stored in muscles'],ans:1,exp:'OXYGEN DEBT: after intense exercise, extra O₂ must be breathed in to oxidise accumulated LACTIC ACID back to CO₂ and water. This is why we continue to breathe heavily after stopping exercise.'},
    {q:'Yeast fermentation produces:',opts:['Lactic acid and CO₂','Ethanol and CO₂','ATP and water','Only CO₂'],ans:1,exp:'Yeast fermentation (anaerobic): Glucose → Ethanol + CO₂ + 2ATP. Used in brewing (alcohol production) and baking (CO₂ makes dough rise).'},
    {q:'RQ (respiratory quotient) = CO₂ produced / O₂ consumed. For glucose, RQ =',opts:['0.7','0.85','1.0','1.4'],ans:2,exp:'For GLUCOSE: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O. RQ = 6CO₂/6O₂ = 1.0. For fats, RQ ≈ 0.7 (more O₂ needed). For proteins, RQ ≈ 0.9. RQ tells us which substrate is being respired.'},
    {q:'The first stage of aerobic respiration occurs in the cytoplasm and is called:',opts:['Krebs cycle','Oxidative phosphorylation','Glycolysis','Fermentation'],ans:2,exp:'GLYCOLYSIS is the first stage. It occurs in the cytoplasm and breaks one glucose molecule (6C) into two pyruvate molecules (3C), producing a net gain of 2 ATP.'},
    {q:'Which of the following is NOT a product of anaerobic respiration in yeast?',opts:['Carbon dioxide','Ethanol','Energy (ATP)','Lactic acid'],ans:3,exp:'Yeast anaerobic respiration (fermentation) produces ETHANOL, CO₂, and a small amount of ATP. LACTIC ACID is the product of anaerobic respiration in mammals, not yeast.'},
    {q:'During strenuous exercise, muscles switch to anaerobic respiration because:',opts:['Oxygen is present in excess','Oxygen supply cannot meet the demand','Glucose is depleted','The muscles have no mitochondria'],ans:1,exp:'During intense exercise, the cardiovascular system cannot deliver O₂ fast enough. Muscles switch to anaerobic respiration to produce ATP quickly, even though it is inefficient and produces lactic acid.'},
    {q:'In the electron transport chain (aerobic respiration), what acts as the final electron acceptor?',opts:['Glucose','Carbon dioxide','Oxygen','Water'],ans:2,exp:'In the ETC, OXYGEN acts as the final electron acceptor. It combines with protons (H⁺) and electrons to form WATER. Without O₂, the chain stops, and ATP production halts.'},
    {q:'Lactic acid produced during anaerobic respiration is converted back to glucose in the:',opts:['Muscles','Kidney','Liver','Pancreas'],ans:2,exp:'The LIVER performs the Cori cycle: lactic acid is transported from muscles to the liver via the blood, where it is converted back into glucose (gluconeogenesis). This glucose is then released back into the blood for muscles to use again.'},
    {q:'ATP is often called the "energy currency" of the cell because:',opts:['It stores energy for years','It is a stable protein','It transfers energy between different cellular reactions','It only exists in muscle cells'],ans:2,exp:'ATP is the universal short-term energy carrier. The energy released from breaking the terminal phosphate bond is used to drive endergonic reactions (e.g., active transport, protein synthesis, muscle contraction).'},
    {q:'Which statement about the oxygen debt is FALSE?',opts:['It involves extra O₂ consumption after exercise','It is used to oxidise lactic acid','It only applies to anaerobic respiration in plants','It explains heavy breathing after a sprint'],ans:2,exp:'The oxygen debt applies specifically to animals/mammals that produce lactic acid. Plants and yeast do not incur an oxygen debt; their anaerobic products (ethanol/CO₂) are removed differently.'},
    {q:'The final products of aerobic respiration are:',opts:['Ethanol and CO₂','Lactic acid and water','CO₂ and H₂O','Glucose and O₂'],ans:2,exp:'Aerobic respiration completely oxidises glucose. The waste products are CARBON DIOXIDE (released via lungs) and WATER (used in metabolic reactions or excreted).'},
    {q:'The main substrate for cellular respiration in most cells is:',opts:['Protein','Lipid (fat)','Glucose','DNA'],ans:2,exp:'GLUCOSE is the primary respiratory substrate. It is easily broken down via glycolysis. However, cells can also respire fatty acids and amino acids if glucose is unavailable (e.g., during starvation).'},
    {q:'In anaerobic respiration, the electron transport chain is NOT used because:',opts:['Glucose is not broken down at all','Oxygen is absent, so the chain stops','The enzymes are denatured','ATP is not needed'],ans:1,exp:'The ETC requires OXYGEN as the final electron acceptor. Without O₂, the chain cannot function. Therefore, anaerobic cells rely solely on glycolysis (producing 2 net ATP) and convert pyruvate to lactic acid/ethanol to regenerate NAD⁺.'},
    {q:'Yeast fermentation is essential in the baking industry because:',opts:['Ethanol makes the bread tasty','CO₂ gas bubbles cause the dough to rise','The yeast adds protein to the bread','Yeast kills bacteria in the dough'],ans:1,exp:'In baking, yeast respires anaerobically, releasing CARBON DIOXIDE gas. These gas bubbles get trapped in the dough, causing it to expand and rise, resulting in a light, fluffy texture.'},
    {q:'The main advantage of aerobic respiration over anaerobic is:',opts:['It produces ethanol','It produces more ATP per glucose molecule','It does not require glucose','It produces water'],ans:1,exp:'Aerobic respiration produces ~38 ATP per glucose, while anaerobic produces only 2 ATP. Aerobic is vastly more efficient, providing the energy needed for complex life processes.'},
    {q:'During the Krebs cycle (aerobic), what is removed from the substrate and released as a waste product?',opts:['Oxygen','Carbon dioxide','Water','ATP'],ans:1,exp:'In the Krebs cycle, the pyruvate molecules are broken down, and CARBON DIOXIDE is released as a waste product. The electrons and protons are carried to the electron transport chain via carrier molecules.'},
    {q:'When a person performs gentle, steady-state exercise (e.g., jogging), they primarily use:',opts:['Anaerobic respiration only','Aerobic respiration','Fermentation','No respiration at all'],ans:1,exp:'During gentle, steady exercise, the cardiovascular system can supply enough oxygen to meet demand. The muscles rely on AEROBIC respiration, which provides a continuous, efficient supply of ATP.'},
  ],
  match:[
    {term:'Aerobic respiration',def:'Complete oxidation of glucose using oxygen, releasing ~38 ATP'},
    {term:'Anaerobic respiration',def:'Partial breakdown of glucose without oxygen, releasing 2 ATP'},
    {term:'Lactic acid',def:'End product of anaerobic respiration in mammalian muscle cells'},
    {term:'Ethanol',def:'End product of anaerobic respiration (fermentation) in yeast and plants'},
    {term:'Oxygen debt',def:'Extra O₂ required after exercise to oxidise accumulated lactic acid'},
    {term:'Mitochondria',def:'Organelle where aerobic respiration occurs and the majority of ATP is produced'},
    {term:'Glycolysis',def:'First stage of respiration occurring in the cytoplasm, splitting glucose into pyruvate'},
    {term:'Krebs cycle',def:'Second stage of aerobic respiration occurring in the mitochondrial matrix'},
    {term:'Electron transport chain',def:'Final stage of aerobic respiration on the inner mitochondrial membrane, producing water'},
    {term:'ATP',def:'Adenosine triphosphate; the universal energy currency of the cell'},
    {term:'Respirometer',def:'Laboratory apparatus used to measure the rate of respiration'},
    {term:'RQ',def:'Respiratory Quotient; the ratio of CO₂ produced to O₂ consumed'},
    {term:'Fermentation',def:'Anaerobic respiration in microorganisms (yeast) producing ethanol and CO₂'},
    {term:'Cori cycle',def:'The metabolic pathway where lactic acid is transported to the liver and converted back to glucose'},
    {term:'Pyruvate',def:'The 3-carbon molecule produced by glycolysis, which enters the mitochondria for aerobic respiration'},
    {term:'Exothermic',def:'Reaction that releases energy (heat) — respiration is an exothermic process'},
    {term:'NAD',def:'Electron carrier molecule that transports H⁺ and electrons to the electron transport chain'},
    {term:'Oxidative phosphorylation',def:'The production of ATP using the energy released from the electron transport chain'},
    {term:'Muscle fatigue',def:'Condition caused by the accumulation of lactic acid during anaerobic respiration'},
    {term:'Substrate',def:'The molecule being broken down during respiration (e.g., glucose)'},
  ],
  flashcards:[
    {q:'Compare aerobic and anaerobic respiration.',a:'Aerobic: uses O₂, complete glucose breakdown, ~38 ATP, products = CO₂ + H₂O. Anaerobic: no O₂, partial breakdown, 2 ATP, products = lactic acid (mammals) or ethanol + CO₂ (yeast/plants).'},
    {q:'Why is aerobic respiration more efficient than anaerobic?',a:'Aerobic respiration completely oxidises glucose, breaking all C-H bonds and releasing ~38 ATP. Anaerobic only partially breaks glucose down (lactic acid/ethanol still contain chemical energy), releasing only 2 ATP per glucose.'},
    {q:'How is lactic acid removed from the body after exercise?',a:'1. Oxidised to CO₂ and water using the extra O₂ consumed during the oxygen debt. 2. Converted back to glucose in the liver via the Cori cycle. 3. A small amount is excreted in sweat and urine.'},
    {q:'What is a respirometer used for?',a:'A respirometer measures the RATE OF RESPIRATION by measuring O₂ consumption. A coloured liquid indicator moves as O₂ is absorbed by the respiring organisms. It can measure how temperature, substrate, or organism type affects respiration rate.'},
    {q:'State TWO uses of ATP in living cells.',a:'1. Muscle contraction (sliding filament theory). 2. Active transport of ions/molecules across cell membranes. 3. Protein synthesis. 4. Cell division. 5. Nerve impulse transmission.'},
    {q:'What factors increase the rate of aerobic respiration?',a:'1. Higher temperature (faster enzyme activity up to ~40°C). 2. Increased glucose substrate availability. 3. Increased O₂ availability. 4. More mitochondria present (e.g., in trained athletes). 5. Increased concentration of respiratory enzymes.'},
    {q:'Describe the three main stages of aerobic respiration.',a:'1. GLYCOLYSIS (cytoplasm): Glucose → 2 Pyruvate + 2 net ATP. 2. KREBS CYCLE (matrix): Pyruvate → CO₂ + NADH/FADH₂ + 2 ATP. 3. OXIDATIVE PHOSPHORYLATION (inner membrane): NADH/FADH₂ donate electrons → ETC → O₂ acts as final acceptor → 34 ATP produced + H₂O.'},
    {q:'Explain why yeast is used in both the brewing and baking industries.',a:'In BREWING, yeast ferments glucose to ETHANOL (alcohol) for drinks and CO₂. In BAKING, the yeast respires anaerobically producing CO₂ gas, which gets trapped in the dough, causing it to expand and rise.'},
    {q:'What is the oxygen debt and how does it affect breathing?',a:'The OXYGEN DEBT is the extra oxygen required after exercise to oxidise accumulated lactic acid. It causes an increased heart rate and a higher breathing rate even after the exercise stops, as the body tries to repay the oxygen deficit.'},
    {q:'How does the body avoid muscle fatigue during intense exercise?',a:'The body cannot prevent lactic acid build-up fully during intense exercise. To avoid severe fatigue, the muscles alternate between aerobic and anaerobic respiration. Long-term, athletes train to increase their mitochondria count and oxygen delivery efficiency.'},
    {q:'What is the role of pyruvate in respiration?',a:'PYRUVATE is the 3-carbon product of glycolysis. If oxygen is present, pyruvate enters the mitochondria and is broken down in the Krebs cycle (aerobic). If oxygen is absent, pyruvate is converted to lactic acid (mammals) or ethanol (yeast).'},
    {q:'Explain the term "Respiratory Quotient" (RQ).',a:'RQ = volume of CO₂ produced / volume of O₂ consumed. RQ = 1.0 for carbohydrates (glucose). RQ = 0.7 for fats (lipids). RQ = 0.9 for proteins. It is used experimentally to determine which substrate an organism is respiring.'},
    {q:'Why is water produced at the end of the electron transport chain?',a:'At the end of the electron transport chain, OXYGEN accepts the final electrons and protons (H⁺) to form WATER (H₂O). This is the final step of aerobic respiration and prevents the chain from becoming blocked.'},
    {q:'Compare the ATP yield of a single glucose molecule in anaerobic vs aerobic respiration.',a:'Anaerobic respiration yields only 2 ATP per glucose (via glycolysis). Aerobic respiration yields approximately 38 ATP per glucose (2 from glycolysis, 2 from the Krebs cycle, and 34 from oxidative phosphorylation).'},
    {q:'What happens to the electrons during aerobic respiration?',a:'Electrons are removed from glucose during glycolysis and the Krebs cycle. They are carried by NADH and FADH₂ to the electron transport chain, where they pass through a series of carriers, releasing energy used to pump protons and generate ATP.'},
    {q:'Why does vigorous exercise cause a burning sensation in the muscles?',a:'The burning sensation is caused by the accumulation of LACTIC ACID. When muscles respire anaerobically, lactic acid builds up and lowers the pH inside the muscle tissue, stimulating pain receptors and interfering with muscle contraction.'},
    {q:'How do plants respire during the night?',a:'Plants respire 24 hours a day (both day and night). However, at night, plants CANNOT photosynthesise because there is no sunlight. They still perform aerobic respiration, using stored glucose and absorbing O₂ from the air, releasing CO₂.'},
    {q:'Define the Cori cycle.',a:'The CORI CYCLE is the metabolic pathway where lactic acid produced by muscles during anaerobic respiration is transported via the blood to the LIVER. In the liver, it is converted back into glucose (gluconeogenesis), which is then released back into the blood to be used again.'},
    {q:'Why do athletes train to increase their VO₂ max?',a:'VO₂ max is the maximum rate of oxygen consumption during exercise. A higher VO₂ max means the athlete can deliver more O₂ to muscles, allowing them to rely on AEROBIC respiration for longer and delay the onset of lactic acid build-up and fatigue.'},
    {q:'Explain the role of oxygen in the electron transport chain.',a:'OXYGEN acts as the FINAL ELECTRON ACCEPTOR in the electron transport chain. It accepts the electrons after they have passed through the carriers, combining with protons (H⁺) to form WATER. Without O₂, the electron transport chain stops, and no ATP is produced via oxidative phosphorylation.'},
  ],
  blanks:{
    passage:'Aerobic respiration occurs in the [_] of the cell and produces approximately 38 [_] molecules per glucose. Without oxygen, [_] respiration in mammalian muscles produces [_], which causes fatigue. After strenuous exercise, extra oxygen is needed to remove this waste product, a state called the [_] debt. In yeast, anaerobic respiration produces [_] and CO₂, a process known as fermentation.',
    answers:['mitochondria','ATP','anaerobic','lactic acid','oxygen','ethanol'],
    wordbank:['mitochondria','ATP','anaerobic','lactic acid','oxygen','ethanol','glucose','aerobic','pyruvate'],
  },
  sentences:[
    {prompt:'Explain why anaerobic respiration is less efficient than aerobic respiration in terms of ATP yield.',keywords:['ATP','yield','aerobic','38','anaerobic','2','partial','oxidation'],hint:'Compare how completely glucose is broken down and the resulting energy output.'},
    {prompt:'Describe how the body responds during and after intense sprinting.',keywords:['anaerobic','lactic acid','oxygen debt','heavy breathing','recover','oxidise'],hint:'What happens inside the muscles during the race? Why do you continue to breathe hard even after you have stopped running?'},
    {prompt:'Explain why bread dough rises when yeast is added to it.',keywords:['fermentation','CO₂','glucose','ethanol','bubbles','expand','baking'],hint:'What gas does yeast produce during anaerobic respiration, and how does this physically affect the dough?'},
    {prompt:'Outline the main stages of aerobic respiration and where they occur in the cell.',keywords:['glycolysis','cytoplasm','Krebs cycle','matrix','oxidative phosphorylation','inner membrane'],hint:'Trace the journey of glucose from the cytoplasm through the mitochondria.'},
    {prompt:'Explain how a respirometer is used to measure the rate of respiration in germinating seeds.',keywords:['respirometer','oxygen','consumption','rate','seed','movement'],hint:'What gas is being used up by the seeds, and how does that affect the liquid in the capillary tube?'},
    {prompt:'Describe the role of mitochondria in providing energy for an active muscle cell.',keywords:['mitochondria','ATP','muscle','contraction','aerobic','energy'],hint:'Which organelle produces most of the ATP, and what does the muscle use the ATP for?'},
    {prompt:'Compare the products of anaerobic respiration in yeast and in human muscle cells.',keywords:['yeast','ethanol','CO₂','muscle','lactic acid','fermentation'],hint:'One produces alcohol; the other produces a substance that causes fatigue.'},
    {prompt:'Explain the concept of "oxygen debt" and why it causes a high heart rate after exercise.',keywords:['oxygen debt','lactic acid','oxidise','heart rate','recovery','breathing'],hint:'Why does the body need extra oxygen, and what organ functions must increase to deliver it?'},
    {prompt:'Why do liver cells contain high numbers of mitochondria?',keywords:['liver','mitochondria','ATP','Cori cycle','gluconeogenesis','active'],hint:'The liver performs many energy-demanding biochemical reactions. How does it get that energy?'},
    {prompt:'Explain how the electron transport chain generates water as a byproduct of aerobic respiration.',keywords:['ETC','oxygen','final acceptor','electrons','protons','H₂O'],hint:'What happens when the last electron carrier passes its electrons to oxygen?'},
    {prompt:'Describe the effects of a lack of oxygen on cellular respiration in humans.',keywords:['oxygen','deprivation','anaerobic','lactic acid','ATP','fatigue'],hint:'What pathway does the cell switch to, and what are the consequences for the muscles?'},
    {prompt:'Explain why a high-fat diet (fat RQ=0.7) results in a lower RQ value compared to a high-carbohydrate diet.',keywords:['RQ','CO₂','O₂','fat','0.7','glucose','1.0'],hint:'Look at the chemical formulas. Do fats or carbohydrates require more oxygen to break down completely?'},
    {prompt:'How does yeast fermentation differ from aerobic respiration in terms of energy release and products?',keywords:['yeast','fermentation','ethanol','CO₂','aerobic','ATP','efficient'],hint:'Compare how much ATP is made and what the waste products are.'},
    {prompt:'Explain why ATP is considered the universal energy currency of the cell.',keywords:['ATP','energy','currency','phosphate','coupling','reactions'],hint:'How does the cell use ATP to power different processes? What happens when ATP is broken down?'},
    {prompt:'Describe how the accumulation of lactic acid in muscles leads to the sensation of pain.',keywords:['lactic acid','pH','burning','pain','fatigue','muscle'],hint:'What happens to the chemical environment inside the muscle when lactic acid builds up?'},
    {prompt:'Explain the role of glycolysis as a universal stage of respiration.',keywords:['glycolysis','cytoplasm','glucose','pyruvate','anaerobic','aerobic'],hint:'Does glycolysis happen in all types of respiration? Where does it occur?'},
    {prompt:'Why do cyanide poisons interfere with cellular respiration?',keywords:['cyanide','ETC','oxygen','block','ATP','death'],hint:'Cyanide acts on the electron transport chain. What does it prevent from happening, and why is that fatal?'},
    {prompt:'Describe the relationship between the blood pH and lactic acid levels after intense exercise.',keywords:['lactic acid','blood','pH','decrease','acidic','buffers'],hint:'Lactic acid is an acid. How does its release affect the acidity of the blood?'},
    {prompt:'Explain why germinating seeds have a higher rate of respiration than dry seeds.',keywords:['germinating','respirate','higher','growth','ATP','dry','dormant'],hint:'What process requires a lot of energy to start the growth of a new plant?'},
    {prompt:'Outline why athletes use "interval training" to improve their anaerobic threshold.',keywords:['interval','anaerobic','threshold','lactic acid','tolerance','performance'],hint:'What happens to the muscles\' ability to handle lactic acid when they are trained to work under oxygen-deficit conditions?'},
  ],
});
</script></body></html>
