<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nuclear Physics — BEC Study</title>
<style>*,*::before,*::after{box-sizing:border-box}</style>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="../study-engine.js"></script>
<script>
function bg(sk,c){sk.background(...(c||[8,10,20]))}

const STEPS=[
  {
    title:'The Nucleus — Protons & Neutrons',
    body:`The nucleus is made of <strong>protons</strong> (positive) and <strong>neutrons</strong> (no charge).
    <br><br>
    <strong>Atomic number (Z)</strong> = number of protons (defines the element)
    <br><br>
    <strong>Mass number (A)</strong> = protons + neutrons
    <br><br>
    An atom is written as: <strong>ᴬ_Z X</strong>
    <br>Example: ²⁷₁₃Al has 13 protons, 14 neutrons
    <br><br>
    <strong>Radioactivity</strong> is when an <em>unstable</em> nucleus spontaneously emits radiation to become more stable. It is random and unaffected by temperature, pressure, or chemical state.`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.03;
      const cx=W/2,cy=H*0.46;
      // Nucleus with protons and neutrons
      const n=12;
      for(let i=0;i<n;i++){
        const ang=t*0.3+(i/n)*sk.TWO_PI;
        const r=i%2===0?H*0.12:H*0.07;
        const jitter=Math.sin(t*2+i)*3;
        const px=cx+Math.cos(ang)*r+jitter;
        const py=cy+Math.sin(ang)*r+jitter;
        const isProton=i<6;
        sk.fill(isProton?[231,76,60]:[150,150,170]);
        sk.noStroke();sk.circle(px,py,16);
        sk.fill(255);sk.textSize(7.5);sk.textAlign(sk.CENTER,sk.CENTER);
        sk.text(isProton?'p⁺':'n⁰',px,py);
      }
      // Electrons orbiting
      const shells=[2,8];
      [[H*0.22,shells[0]],[H*0.34,shells[1]]].forEach(([r,ne])=>{
        sk.noFill();sk.stroke(100,180,255,30);sk.strokeWeight(1);sk.circle(cx,cy,r*2);
        for(let i=0;i<ne;i++){
          const ang=t*(r<H*0.25?1:-0.7)+(i/ne)*sk.TWO_PI;
          sk.fill(100,180,255,200);sk.noStroke();
          sk.circle(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r,8);
        }
      });
      // Labels
      sk.fill(231,76,60);sk.noStroke();sk.textSize(9);sk.textAlign(sk.LEFT);
      sk.text('■ Proton (p⁺)',W*0.04,H*0.12);
      sk.fill(150,150,170);sk.text('■ Neutron (n⁰)',W*0.04,H*0.22);
      sk.fill(100,180,255);sk.text('● Electron (e⁻)',W*0.04,H*0.32);
      sk.fill(255,255,255,80);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('¹³⁶C — 6 protons, 7 neutrons',W/2,H*0.9);
    }
  },
  {
    title:'Types of Radiation — α, β, γ',
    body:`Three types of nuclear radiation:
    <br><br>
    <strong>Alpha (α)</strong>:
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>2 protons + 2 neutrons (helium nucleus)</li>
      <li>Stopped by paper or a few cm of air</li>
      <li>Highly ionising</li>
    </ul>
    <strong>Beta (β)</strong>:
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>High-speed electron emitted when neutron → proton</li>
      <li>Stopped by aluminium or a few mm</li>
      <li>Moderately ionising</li>
    </ul>
    <strong>Gamma (γ)</strong>:
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>High-energy electromagnetic wave (no mass, no charge)</li>
      <li>Needs thick lead or metres of concrete to stop</li>
      <li>Least ionising, most penetrating</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk,[10,12,24]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      const source={x:W*0.1,y:H*0.5};
      // Alpha
      const aX=Math.min(source.x+((t*30)%120),source.x+80);
      sk.fill(231,76,60,220);sk.noStroke();sk.circle(aX,H*0.3,16);
      sk.fill(255);sk.textSize(7.5);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('α',aX,H*0.3);
      // Paper barrier
      sk.fill(220,200,150,180);sk.noStroke();sk.rect(source.x+82,H*0.15,8,H*0.7,2);
      sk.fill(255,255,255,80);sk.textSize(8);sk.textAlign(sk.LEFT);
      sk.text('Paper',source.x+94,H*0.17);
      // Beta
      const bX=Math.min(source.x+((t*40)%220),source.x+180);
      sk.fill(52,152,219,200);sk.noStroke();sk.circle(bX,H*0.5,10);
      sk.fill(255);sk.textSize(7.5);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('β',bX,H*0.5);
      // Al barrier
      sk.fill(200,200,210,180);sk.noStroke();sk.rect(source.x+182,H*0.15,10,H*0.7,2);
      sk.fill(255,255,255,80);sk.textSize(8);sk.textAlign(sk.LEFT);sk.text('Al',source.x+196,H*0.3);
      // Gamma ray (wiggly)
      sk.stroke(241,196,15,200);sk.strokeWeight(2);sk.noFill();
      sk.beginShape();
      for(let x=source.x;x<W*0.92;x+=3){
        sk.vertex(x,H*0.72+Math.sin(x*0.3)*12);
      }sk.endShape();
      sk.fill(241,196,15);sk.noStroke();sk.textSize(8.5);sk.textAlign(sk.RIGHT);
      sk.text('γ',W*0.92,H*0.7);
      // Thick concrete needed for gamma
      sk.fill(100,80,60,60);sk.noStroke();sk.rect(W*0.84,H*0.15,W*0.1,H*0.7);
      sk.fill(255,255,255,60);sk.textSize(7.5);sk.textAlign(sk.CENTER);
      sk.text('Lead/\nConcrete',W*0.89,H*0.28);
      // Source
      sk.fill(255,165,50,200);sk.noStroke();sk.circle(source.x,source.y,22);
      sk.fill(255);sk.textSize(9);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('☢',source.x,source.y);
    }
  },
  {
    title:'Nuclear Equations',
    body:`Nuclear equations must balance: <strong>mass numbers</strong> and <strong>atomic numbers</strong> must be equal on both sides.
    <br><br>
    <strong>Alpha decay</strong> (loses ⁴₂He):
    <br>²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂He
    <br>Mass: 238 = 234 + 4 ✓ &emsp; Atomic: 92 = 90 + 2 ✓
    <br><br>
    <strong>Beta decay</strong> (neutron → proton + electron):
    <br>¹⁴₆C → ¹⁴₇N + ⁰₋₁e
    <br>Mass: 14 = 14 + 0 ✓ &emsp; Atomic: 6 = 7 + (−1) ✓
    <br><br>
    Gamma decay does NOT change mass or atomic number — only releases energy.`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Alpha decay animation
      const decayT=(t*0.5)%sk.TWO_PI;
      const phase=decayT<sk.PI?'before':'after';
      if(phase==='before'){
        // Uranium nucleus
        sk.fill(100,50,150,200);sk.noStroke();sk.circle(W*0.5,H*0.42,60);
        sk.fill(255);sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER,sk.CENTER);
        sk.text('²³⁸U',W*0.5,H*0.42);sk.textStyle(sk.NORMAL);
      }else{
        const sep=((decayT-sk.PI)/sk.PI)*W*0.3;
        // Thorium
        sk.fill(70,120,200,200);sk.noStroke();sk.circle(W*0.4-sep,H*0.42,52);
        sk.fill(255);sk.textSize(9);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER,sk.CENTER);
        sk.text('²³⁴Th',W*0.4-sep,H*0.42);
        // Alpha particle
        sk.fill(231,76,60,220);sk.noStroke();sk.circle(W*0.6+sep,H*0.38,24);
        sk.fill(255);sk.textSize(9);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER,sk.CENTER);
        sk.text('⁴He\n(α)',W*0.6+sep,H*0.38);sk.textStyle(sk.NORMAL);
      }
      sk.fill(255,220,50);sk.noStroke();sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      sk.text('Alpha decay:',W/2,H*0.15);sk.textStyle(sk.NORMAL);
      sk.fill(255,255,255,80);sk.textSize(9);sk.text('²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂He',W/2,H*0.22);
      // Balance check
      sk.fill(46,204,113);sk.textSize(9);
      sk.text('Mass: 238 = 234 + 4 ✓',W/2,H*0.72);
      sk.text('Atomic: 92 = 90 + 2 ✓',W/2,H*0.8);
    }
  },
  {
    title:'🎮 Check — Radiation Types',
    body:'Test your knowledge of alpha, beta and gamma radiation.',
    draw:null,
    game:{type:'mcq',questions:[
      {q:'Which type of radiation has the greatest penetrating power?',opts:['Alpha','Beta','Gamma','All the same'],ans:2,exp:'Gamma rays are the MOST penetrating — they need thick lead or metres of concrete to stop them. Alpha is the least penetrating (stopped by paper).'},
      {q:'In beta decay, which particle is emitted?',opts:['A helium nucleus','A high-speed electron','A gamma ray photon','A proton'],ans:1,exp:'In beta decay, a neutron in the nucleus converts to a proton and emits a high-speed electron (beta particle). The atomic number increases by 1.'},
      {q:'Which type of radiation is deflected by both electric and magnetic fields?',opts:['Gamma only','Alpha and beta','Gamma and alpha','All three'],ans:1,exp:'Alpha (charged +2) and beta (charged −1) are deflected by electric and magnetic fields. Gamma has no charge so is NOT deflected.'},
      {q:'Radon-222 emits an alpha particle. What is the new atomic number? (Rn: Z=86)',opts:['84','88','87','82'],ans:0,exp:'Alpha decay removes 2 protons. New Z = 86 − 2 = 84. The element with Z=84 is Polonium (Po).'},
    ]}
  },
  {
    title:'Half-Life',
    body:`<strong>Half-life</strong> is the time taken for <em>half</em> the radioactive nuclei in a sample to decay.
    <br><br>
    Half-life is <strong>constant</strong> for a given isotope — unaffected by temperature or pressure.
    <br><br>
    After n half-lives, the fraction remaining = (½)ⁿ:
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li>After 1 half-life → ½ remaining</li>
      <li>After 2 half-lives → ¼ remaining</li>
      <li>After 3 half-lives → ⅛ remaining</li>
    </ul>
    Uses of half-life:
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>Carbon-14 dating (t½ = 5730 years)</li>
      <li>Medical tracers need short half-lives (minutes/hours)</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk,[10,14,22]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Decay curve
      const ax=W*0.1,ay=H*0.88,gw=W*0.82,gh=H*0.72;
      sk.stroke(255,255,255,40);sk.strokeWeight(1);sk.noFill();
      sk.line(ax,ay-gh,ax,ay);sk.line(ax,ay,ax+gw,ay);
      sk.stroke(231,76,60,200);sk.strokeWeight(2.5);sk.noFill();
      sk.beginShape();
      for(let x=0;x<gw;x+=3){
        sk.vertex(ax+x,ay-gh*Math.exp(-x*0.012));
      }sk.endShape();
      // Half-life markers
      const hl=gw*0.21;
      [[0,'N₀'],[1,'N₀/2'],[2,'N₀/4'],[3,'N₀/8']].forEach(([n,lbl])=>{
        const x=ax+n*hl;
        const y=ay-gh*Math.exp(-n*hl*0.012);
        sk.stroke(255,220,50,100);sk.strokeWeight(1);sk.noFill();
        sk.line(x,y,x,ay);
        sk.fill(255,220,50);sk.noStroke();sk.textSize(8);sk.textAlign(sk.CENTER);
        sk.text(lbl,ax,y-6);sk.text(n?n+'t½':'0',x,ay+12);
        sk.fill(255,220,50,180);sk.noStroke();sk.circle(x,y,8);
      });
      sk.fill(255,255,255,80);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('Each half-life, half the remaining nuclei decay',W/2,H*0.06);
    }
  },
  {
    title:'Nuclear Fission & Fusion',
    body:`<strong>Nuclear fission</strong>: a large, unstable nucleus splits into two smaller nuclei when struck by a neutron, releasing huge energy + more neutrons (chain reaction).
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>Example: ²³⁵U → ¹⁴¹Ba + ⁹²Kr + 3n + energy</li>
      <li>Used in nuclear power stations</li>
    </ul>
    <strong>Nuclear fusion</strong>: two small nuclei join to form a larger nucleus, releasing even more energy.
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>Example: ²H + ³H → ⁴He + n + energy</li>
      <li>Powers the Sun and stars</li>
      <li>Requires extremely high temperature — not yet practical on Earth</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk,[8,10,20]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // FISSION (top)
      sk.fill(255,255,255,80);sk.noStroke();sk.textSize(9);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      sk.text('FISSION',W/2,H*0.08);sk.textStyle(sk.NORMAL);
      const fT=(t*0.5)%sk.TWO_PI;
      if(fT<sk.PI){
        // Before - big nucleus + incoming neutron
        sk.fill(100,50,180,200);sk.noStroke();sk.circle(W*0.45,H*0.24,44);
        sk.fill(255);sk.textSize(9);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('²³⁵U',W*0.45,H*0.24);
        const nx=sk.lerp(W*0.82,W*0.5,(fT/sk.PI));
        sk.fill(150,150,170);sk.noStroke();sk.circle(nx,H*0.24,10);
        sk.fill(255);sk.textSize(6.5);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('n',nx,H*0.24);
      }else{
        const sp=((fT-sk.PI)/sk.PI)*W*0.22;
        [[W*0.35-sp,'¹⁴¹Ba',[231,76,60]],[W*0.55+sp,'⁹²Kr',[52,152,219]]].forEach(([x,l,c])=>{
          sk.fill(...c,200);sk.noStroke();sk.circle(x,H*0.24,28);
          sk.fill(255);sk.textSize(8);sk.textAlign(sk.CENTER,sk.CENTER);sk.text(l,x,H*0.24);
        });
        // Neutrons flying out
        for(let i=-1;i<=1;i+=1){
          const nx2=W*0.45+i*sp*1.5,ny=H*0.24-sp*(1+i*0.3);
          sk.fill(150,150,170,200);sk.noStroke();sk.circle(nx2,ny,8);
        }
      }
      // FUSION (bottom)
      sk.fill(255,255,255,80);sk.noStroke();sk.textSize(9);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      sk.text('FUSION',W/2,H*0.52);sk.textStyle(sk.NORMAL);
      const fuT=(t*0.4+sk.PI)%sk.TWO_PI;
      const sep2=Math.abs(Math.cos(fuT))*W*0.22;
      [[W*0.5-sep2,'²H',[52,152,219]],[W*0.5+sep2,'³H',[46,204,113]]].forEach(([x,l,c])=>{
        sk.fill(...c,200);sk.noStroke();sk.circle(x,H*0.72,22);
        sk.fill(255);sk.textSize(9);sk.textAlign(sk.CENTER,sk.CENTER);sk.text(l,x,H*0.72);
      });
      if(sep2<12){
        // Flash!
        sk.fill(255,220,50,200);sk.noStroke();sk.circle(W*0.5,H*0.72,60);
        sk.fill(255,220,50,200);sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER,sk.CENTER);
        sk.text('ENERGY!',W*0.5,H*0.72);sk.textStyle(sk.NORMAL);
      }
    }
  },
  {
    q:'Atomic Nucleus — Protons &amp; Neutrons',
    content:`<h3>Atomic Structure — Nucleus, Protons and Neutrons</h3><p>All matter is made of atoms. At the centre of every atom is a tiny, dense nucleus containing protons and neutrons, surrounded by electrons in shells. The number of protons (atomic number Z) defines which element the atom is, while the mass number A gives the total number of nucleons.</p><ul><li>Protons carry a +1 charge and have mass ≈ 1 u; they determine the element's identity.</li><li>Neutrons carry no charge and have mass ≈ 1 u; varying the neutron count gives different isotopes of the same element.</li><li>Electrons (−1 charge, negligible mass) orbit in shells; their number equals the proton count in a neutral atom.</li></ul>`,
    visual:`<svg viewBox="0 0 420 265" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">

  <ellipse cx="210" cy="135" rx="90" ry="90" fill="none" stroke="#7986cb" stroke-width="1" stroke-dasharray="4,3"/>
  <ellipse cx="210" cy="135" rx="58" ry="58" fill="none" stroke="#9fa8da" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Nucleus -->
  <circle cx="210" cy="135" r="32" fill="#c5cae9" stroke="#283593" stroke-width="2.5"/>
  <!-- Protons (red) and Neutrons (grey) in nucleus -->
  <circle cx="200" cy="128" r="9" fill="#ef5350" stroke="#c62828" stroke-width="1.5"/>
  <text x="200" y="132" text-anchor="middle" font-size="7" font-weight="bold" fill="#fff">p⁺</text>
  <circle cx="220" cy="128" r="9" fill="#ef5350" stroke="#c62828" stroke-width="1.5"/>
  <text x="220" y="132" text-anchor="middle" font-size="7" font-weight="bold" fill="#fff">p⁺</text>
  <circle cx="210" cy="143" r="9" fill="#78909c" stroke="#546e7a" stroke-width="1.5"/>
  <text x="210" y="147" text-anchor="middle" font-size="7" font-weight="bold" fill="#fff">n⁰</text>
  <circle cx="200" cy="118" r="8" fill="#78909c" stroke="#546e7a" stroke-width="1.5"/>
  <text x="200" y="122" text-anchor="middle" font-size="7" font-weight="bold" fill="#fff">n⁰</text>
  <!-- Electrons on shells -->
  <!-- Shell 1 electrons (2 electrons) -->
  <circle cx="210" cy="77" r="8" fill="#42a5f5" stroke="#1565c0" stroke-width="1.5"/>
  <text x="210" y="81" text-anchor="middle" font-size="7" font-weight="bold" fill="#fff">e⁻</text>
  <circle cx="210" cy="193" r="8" fill="#42a5f5" stroke="#1565c0" stroke-width="1.5"/>

  <circle cx="268" cy="100" r="8" fill="#64b5f6" stroke="#1565c0" stroke-width="1.5"/>
  <text x="268" y="104" text-anchor="middle" font-size="7" fill="#fff">e⁻</text>
  <circle cx="152" cy="170" r="8" fill="#64b5f6" stroke="#1565c0" stroke-width="1.5"/>
  <text x="152" y="174" text-anchor="middle" font-size="7" fill="#fff">e⁻</text>
  <circle cx="268" cy="170" r="8" fill="#64b5f6" stroke="#1565c0" stroke-width="1.5"/>

  <!-- Labels panel right side -->
  <rect x="318" y="55" width="92" height="78" rx="4" fill="#fff" stroke="#283593" stroke-width="1.5"/>

  <circle cx="332" cy="178" r="6" fill="#42a5f5" stroke="#1565c0" stroke-width="1.5"/>

  <!-- Nucleus label -->

</svg>`
  },
  {
    q:'Alpha, Beta &amp; Gamma — Comparison Table',
    content:`<h3>Alpha, Beta and Gamma Radiation — Comparison</h3><p>Unstable nuclei emit one (or more) of three types of nuclear radiation as they decay toward stability. The three types differ in nature, charge, mass, penetrating power, and ionising ability — all of which are examinable comparisons at BGCSE level.</p><ul><li><strong>Alpha (α):</strong> helium nucleus (2p + 2n); charge +2; stopped by paper; highest ionising power.</li><li><strong>Beta (β):</strong> fast electron; charge −1; stopped by a few mm of aluminium; moderate ionising power.</li><li><strong>Gamma (γ):</strong> electromagnetic wave; no charge or mass; needs thick lead or concrete to attenuate; lowest ionising power but most penetrating.</li></ul>`,

  {
    q:'Radioactive Decay Equation — Alpha &amp; Beta',
    content:`<h3>Nuclear Decay Equations — Alpha and Beta</h3><p>Nuclear equations represent radioactive decay processes. They must be balanced: the total mass number (top) and total atomic number (bottom) must be the same on both sides of the equation. Each decay type changes the identity of the element.</p><ul><li><strong>Alpha decay:</strong> the parent nucleus loses 4 in mass number and 2 in atomic number (emits ⁴₂He); e.g. ²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂He.</li><li><strong>Beta decay:</strong> a neutron converts to a proton, emitting an electron; mass number unchanged, atomic number increases by 1; e.g. ¹⁴₆C → ¹⁴₇N + ⁰₋₁e.</li><li><strong>Gamma emission:</strong> accompanies other decays; no change to mass or atomic number — only energy is released.</li></ul>`,
    visual:`<svg viewBox="0 0 420 265" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">

    q:'Half-Life Graph — Exponential Decay',
    content:`<h3>Half-Life Graph — Exponential Decay</h3><p>Half-life is the time taken for half the radioactive nuclei in a sample to decay. The decay follows an exponential curve — each successive half-life halves the remaining activity. Half-life is constant for a given isotope and is unaffected by external conditions such as temperature or pressure.</p><ul><li>After n half-lives, the fraction remaining = (½)ⁿ: 1 → ½ → ¼ → ⅛ → …</li><li>Activity (counts per second) also halves each half-life, so the graph shape is identical.</li><li>Half-life determines suitability for applications: short half-lives (minutes/hours) for medical tracers; long half-lives (thousands of years) for carbon-14 dating.</li></ul>`,
