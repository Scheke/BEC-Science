<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Homeostasis Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Homeostasis — BGCSE Biology Quiz',
  color:'#bf360c',dark:'#7f0000',light:'#fbe9e7',
  mcq:[
    {q:'Homeostasis is the maintenance of a constant:',opts:['External environment','Internal environment','Blood glucose only','Body temperature only'],ans:1,exp:'Homeostasis is the maintenance of a CONSTANT INTERNAL ENVIRONMENT within the body, despite changes in external conditions. This includes temperature, blood glucose, water content, and more.'},
    {q:'Which organ regulates blood glucose concentration?',opts:['Liver','Kidney','Pancreas','Adrenal gland'],ans:2,exp:'The PANCREAS monitors blood glucose. It secretes INSULIN (when glucose is too high) and GLUCAGON (when glucose is too low) from the islets of Langerhans.'},
    {q:'Insulin causes:',opts:['Liver to release glucose from glycogen','Muscles to convert glucose to glycogen','More glucose to be absorbed from intestine','Glycogen to be broken down'],ans:1,exp:'INSULIN is released when blood glucose is HIGH. It causes the liver and muscle cells to convert glucose into GLYCOGEN (glycogenesis) for storage, lowering blood glucose back to normal.'},
    {q:'Type 1 diabetes occurs because:',opts:['Too much insulin is produced','Cells are resistant to insulin','Pancreatic beta cells are destroyed and cannot make insulin','Too much glucose is eaten'],ans:2,exp:'Type 1 diabetes: the immune system destroys BETA CELLS in the pancreas, so NO INSULIN is produced. Blood glucose rises dangerously. Treatment: regular insulin injections.'},
    {q:'The kidney\'s main roles include:',opts:['Producing insulin','Filtering blood and regulating water content (osmoregulation)','Producing digestive enzymes','Storing glycogen'],ans:1,exp:'The kidneys FILTER blood to remove waste (urea), control water and ion balance (OSMOREGULATION), and maintain blood pH. They produce urine containing urea, excess water and ions.'},
    {q:'When body temperature rises above 37°C, which response helps cool the body?',opts:['Vasoconstriction and shivering','Vasodilation and increased sweating','Reduced blood flow to skin','Increased metabolic rate'],ans:1,exp:'When TOO HOT: skin blood vessels DILATE (vasodilation) — more blood near surface loses heat. SWEAT is produced — evaporation removes heat. These are negative feedback responses.'},
    {q:'Glucagon is released by the pancreas when:',opts:['Blood glucose is too high','Blood glucose is too low','Body temperature is too high','Body temperature is too low'],ans:1,exp:'GLUCAGON is released when blood glucose is LOW. It travels to the liver and stimulates the conversion of stored glycogen back into glucose, raising blood glucose levels.'},
    {q:'Which of the following is NOT a component of the homeostatic control system?',opts:['Receptor','Coordination centre (brain/pancreas)','Effector','External environment'],ans:3,exp:'Homeostatic systems control the INTERNAL environment. The core components are: RECEPTOR (detects change) → COORDINATION CENTRE (processes info) → EFFECTOR (carries out response).'},
    {q:'When body temperature drops below 37°C, which response helps warm the body?',opts:['Sweating','Vasoconstriction and shivering','Vasodilation','Hairs lie flat'],ans:1,exp:'When TOO COLD: skin blood vessels CONSTRICT (vasoconstriction) — reduces heat loss from skin. SHIVERING generates heat through muscle contractions. Hairs stand up to trap insulating air.'},
    {q:'The role of the liver in blood glucose control is:',opts:['To produce insulin','To store glucose as glycogen and release it as glucagon stimulates','To filter blood','To produce urine'],ans:1,exp:'The liver acts as an effector. Under INSULIN, it converts glucose to GLYCOGEN for storage. Under GLUCAGON, it breaks down glycogen back into glucose for release into the blood.'},
    {q:'What is osmoregulation?',opts:['Regulation of oxygen levels','Regulation of body temperature','Regulation of water and ion balance','Regulation of glucose levels'],ans:2,exp:'OSMOREGULATION is the homeostatic control of water and ion concentrations in the body fluids. This is primarily carried out by the kidneys under the influence of ADH.'},
    {q:'Where is ADH (Anti-Diuretic Hormone) produced?',opts:['Pancreas','Kidney','Pituitary gland','Liver'],ans:2,exp:'ADH is produced in the HYPOTHALAMUS and released from the PITUITARY GLAND. It is released when blood water content is too low (blood is too concentrated).'},
    {q:'The effect of ADH on the kidney is:',opts:['To increase urine production','To make the collecting duct more permeable to water','To decrease water reabsorption','To filter more blood'],ans:1,exp:'ADH makes the walls of the collecting duct in the kidney MORE PERMEABLE to water. This means more water is reabsorbed back into the blood, producing a small volume of concentrated urine.'},
    {q:'If a person drinks a large amount of water, what happens to ADH secretion?',opts:['Increases','Decreases','Stays the same','Stops completely'],ans:1,exp:'When you drink too much water, blood water content rises (dilute). ADH secretion DECREASES. The kidneys reabsorb less water, producing a large volume of dilute urine to restore balance.'},
    {q:'A negative feedback mechanism involves:',opts:['Amplifying the original stimulus','Moving the body away from the set point','Reversing the change back to the set point','Ignoring the stimulus completely'],ans:2,exp:'Negative feedback acts to REVERSE a change. For example, if glucose rises, insulin brings it DOWN. If temperature rises, cooling mechanisms bring it DOWN. It restores the optimal set point.'},
    {q:'Glycogen is stored in the:',opts:['Kidney and pancreas','Liver and skeletal muscles','Brain and heart','Stomach and intestine'],ans:1,exp:'GLYCOGEN is a polysaccharide stored primarily in the LIVER and MUSCLE cells. It acts as a reserve of glucose that can be broken down when blood sugar levels fall.'},
    {q:'Which process describes the breakdown of glycogen into glucose?',opts:['Glycogenesis','Glycogenolysis','Gluconeogenesis','Glycolysis'],ans:1,exp:'GLYCOGENOLYSIS is the biochemical process of breaking down stored glycogen into glucose. This is stimulated by GLUCAGON. (Glycogenesis is the reverse — making glycogen).'},
    {q:'In homeostasis, the "set point" for human body temperature is approximately:',opts:['25°C','30°C','37°C','40°C'],ans:2,exp:'The optimal set point for human body temperature is approximately 37°C. The thermoregulatory centre in the hypothalamus works to keep the core temperature extremely close to this value.'},
    {q:'Excretion in the body is primarily performed by the:',opts:['Lungs and liver','Kidneys, lungs, and skin','Heart and blood vessels','Pancreas and spleen'],ans:1,exp:'EXCRETION removes metabolic waste. KIDNEYS remove urea and excess water/ions (urine). LUNGS remove CO₂. SKIN removes water and salts through sweat.'},
    {q:'Why can Type 2 diabetes often be managed by diet and exercise?',opts:['Because the pancreas still makes insulin, but cells are resistant','Because the pancreas has been destroyed','Because insulin injections cure the disease','Because diet increases insulin production'],ans:0,exp:'In Type 2 diabetes, the pancreas STILL produces insulin, but the body\'s cells become resistant to it. A healthy diet reduces blood glucose spikes, and exercise increases cell sensitivity to insulin, managing the condition without injections.'},
  ],
  match:[
    {term:'Insulin',def:'Hormone that lowers blood glucose by promoting glycogen storage'},
    {term:'Glucagon',def:'Hormone that raises blood glucose by breaking down glycogen'},
    {term:'Osmoregulation',def:'Control of water and ion balance in the body'},
    {term:'Negative feedback',def:'A response that reverses a change to restore the set point'},
    {term:'Vasodilation',def:'Widening of blood vessels near skin surface to lose heat'},
    {term:'Vasoconstriction',def:'Narrowing of blood vessels near skin surface to conserve heat'},
    {term:'Glycogen',def:'Storage form of glucose in the liver and muscle cells'},
    {term:'ADH',def:'Hormone that increases water reabsorption in the kidney collecting duct'},
    {term:'Pituitary gland',def:'Endocrine gland at the base of the brain that releases ADH'},
    {term:'Pancreas',def:'Organ that secretes insulin and glucagon to regulate blood glucose'},
    {term:'Liver',def:'Main organ involved in storing and releasing glucose as glycogen'},
    {term:'Kidney',def:'Organ that filters blood and regulates water content (osmoregulation)'},
    {term:'Diabetes',def:'A metabolic disorder characterized by high blood glucose levels'},
    {term:'Glycogenolysis',def:'The breakdown of glycogen into glucose (stimulated by glucagon)'},
    {term:'Glycogenesis',def:'The formation of glycogen from glucose (stimulated by insulin)'},
    {term:'Receptor',def:'A cell or organ that detects changes in the internal environment'},
    {term:'Effector',def:'An organ (muscle or gland) that carries out the corrective response'},
    {term:'Thermoregulation',def:'The homeostatic control of body temperature'},
    {term:'Set point',def:'The optimal normal value that the body tries to maintain'},
    {term:'Sweat glands',def:'Skin glands that secrete water to cool the body via evaporation'},
  ],
  flashcards:[
    {q:'What is negative feedback?',a:'A control mechanism where a change from the set point triggers responses that REVERSE the change and restore the normal level. Used in blood glucose, temperature, and water control.'},
    {q:'What is the difference between Type 1 and Type 2 diabetes?',a:'Type 1: pancreas cannot make insulin (autoimmune destruction of beta cells). Type 2: cells become resistant to insulin. Type 1 needs insulin injections; Type 2 is often managed with diet and exercise.'},
    {q:'What happens in the kidney nephron?',a:'Blood is filtered at the glomerulus → useful substances reabsorbed (glucose, water, ions) → waste (urea) and excess water remain → excreted as urine.'},
    {q:'How does the body respond to LOW blood glucose?',a:'Pancreas releases GLUCAGON → liver converts glycogen back to glucose (glycogenolysis) → blood glucose rises back to normal.'},
    {q:'What is the role of sweat in thermoregulation?',a:'Sweat (mostly water) is secreted onto skin surface. EVAPORATION of sweat removes thermal energy from the body, cooling the skin and blood flowing near the surface.'},
    {q:'What is ADH and what does it do?',a:'Anti-Diuretic Hormone (ADH) is released by the pituitary gland when blood is too concentrated. It makes kidney tubules MORE permeable to water → more water reabsorbed → concentrated urine produced.'},
    {q:'Describe the homeostatic control of blood glucose when a person eats a sugary meal.',a:'Blood glucose rises → pancreas detects rise → pancreas releases INSULIN → insulin travels to liver/muscle → cells take up glucose and store it as GLYCOGEN → blood glucose falls back to normal.'},
    {q:'Explain how the body uses negative feedback to control temperature when it gets too cold.',a:'Body temp drops → hypothalamus detects drop → signals effectors: VASOCONSTRICTION (reduce heat loss), SHIVERING (produce heat), hairs stand up (trap insulating air). → Body temp rises back to normal.'},
    {q:'Why is a constant internal environment important for enzyme function?',a:'Enzymes have an OPTIMAL TEMPERATURE and pH. If conditions change significantly, enzymes denature (change shape) and stop working. Homeostasis ensures enzymes operate efficiently.'},
    {q:'How does the kidney respond if a person is dehydrated?',a:'Blood water content is low → hypothalamus detects → pituitary releases ADH → ADH makes kidney collecting ducts more permeable → more water reabsorbed into blood → concentrated urine is produced.'},
    {q:'Why do patients with Type 1 diabetes need insulin injections rather than tablets?',a:'Insulin is a PROTEIN hormone. If swallowed, it would be digested and broken down by enzymes in the digestive system before it could reach the blood. Therefore, it must be injected into the bloodstream.'},
    {q:'What is the role of the hypothalamus in homeostasis?',a:'The HYPOTHALAMUS is the main coordination centre of the brain. It monitors blood temperature, water content, and glucose concentration, and sends nerve impulses or hormonal signals to effectors to correct deviations.'},
    {q:'Explain the difference between glycogen and glucose.',a:'GLUCOSE is a simple sugar (monosaccharide) that circulates in the blood and is used for cellular respiration to produce ATP. GLYCOGEN is a complex storage polysaccharide of glucose, stored in the liver and muscles.'},
    {q:'What causes the sensation of thirst?',a:'Thirst is triggered when the body is dehydrated. Osmoreceptors in the hypothalamus detect decreased water content (increased solute concentration) in the blood, signalling the brain to produce the sensation of thirst so the person drinks.'},
    {q:'What is the effect of vasodilation on heat loss?',a:'VASODILATION widens the arterioles near the surface of the skin. This increases the flow of warm blood to the surface, allowing more heat to be lost to the environment via radiation and convection.'},
    {q:'How does the body respond to a low blood glucose level (hypoglycemia)?',a:'Low glucose is detected by the pancreas → glucagon is released into the blood → glucagon reaches the liver → liver breaks down glycogen into glucose via glycogenolysis → glucose is released into the blood, raising levels back to normal.'},
    {q:'What are the symptoms of uncontrolled diabetes mellitus?',a:'High blood glucose causes GLUCOSURIA (glucose in urine). The kidney cannot reabsorb all glucose, pulling water with it, leading to frequent urination, constant thirst, fatigue, and weight loss.'},
    {q:'Explain the relationship between the hypothalamus and the pituitary gland in osmoregulation.',a:'Osmoreceptors in the HYPOTHALAMUS detect low water content. They send nervous signals to the PITUITARY GLAND, which releases ADH into the bloodstream to act on the kidneys.'},
    {q:'Why does exercise help manage Type 2 diabetes?',a:'Exercise increases the sensitivity of muscle cells to insulin. It allows cells to absorb glucose from the blood more effectively without needing as much insulin, lowering overall blood sugar levels.'},
    {q:'What is the "set point" for blood glucose concentration in a healthy human?',a:'The set point for fasting blood glucose is approximately 4.0 to 5.5 mmol/L (millimoles per litre). Homeostatic mechanisms (insulin and glucagon) work constantly to keep the concentration within this narrow range.'},
  ],
  blanks:{
    passage:'The pancreas secretes [_] when blood glucose is high. This causes the liver to convert glucose into [_] for storage, which lowers blood glucose. When blood glucose is low, the pancreas releases [_], which signals the liver to break down glycogen. This control system is an example of [_] feedback. The kidneys regulate water balance in a process called [_].',
    answers:['insulin','glycogen','glucagon','negative','osmoregulation'],
    wordbank:['insulin','glycogen','glucagon','negative','osmoregulation','positive','glucose','pancreas'],
  },
  sentences:[
    {prompt:'Explain how the body responds when blood glucose rises after a meal.',keywords:['insulin','pancreas','glycogen','liver','blood','glucose'],hint:'Which organ detects the rise? What hormone is released? What happens to the glucose?'},
    {prompt:'Describe how the skin helps regulate body temperature when you are too hot.',keywords:['vasodilation','sweat','evaporation','heat','blood vessels','cool'],hint:'Think about blood vessels near the surface and the cooling effect of sweat.'},
    {prompt:'Explain why a diabetic person must monitor their blood glucose and inject insulin.',keywords:['insulin','glucose','diabetes','pancreas','homeostasis','injection'],hint:'What goes wrong in Type 1 diabetes? Why can\'t they just take insulin as a pill?'},
    {prompt:'Describe the homeostatic control of water balance in the kidneys when a person has been sweating heavily.',keywords:['ADH','pituitary','kidney','reabsorb','water','urine','concentrated'],hint:'What happens to blood water content? Which hormone is released? How does the kidney respond?'},
    {prompt:'Explain the difference between vasodilation and vasoconstriction.',keywords:['vasodilation','widen','heat loss','vasoconstriction','narrow','heat conservation'],hint:'One happens when you are hot, the other when you are cold. What physically happens to the blood vessels?'},
    {prompt:'Outline the role of the liver and pancreas in maintaining blood glucose levels.',keywords:['pancreas','insulin','glucagon','liver','glycogen','glucose'],hint:'The pancreas does the detection/secretion, the liver does the storage/release action.'},
    {prompt:'Explain what is meant by a "negative feedback" loop using body temperature as an example.',keywords:['negative feedback','receptor','coordinator','effector','reverse','37°C'],hint:'What happens when the temperature moves away from 37°C? Does the body increase the change or reverse it?'},
    {prompt:'Why do human bodies need to maintain a core temperature close to 37°C?',keywords:['enzymes','denature','optimum','temperature','37°C','reactions'],hint:'What happens to proteins and chemical reactions if the body gets too hot or too cold?'},
    {prompt:'Describe the process of glycogenesis and glycogenolysis.',keywords:['glycogenesis','glycogen','store','glucose','glycogenolysis','breakdown'],hint:'One builds up a store, the other takes the store apart. Which hormones trigger these?'},
    {prompt:'Explain how the body alerts the brain to drink water when dehydrated.',keywords:['osmoreceptors','hypothalamus','water','thirst','dehydrated','brain'],hint:'What sensors detect low water, and what feeling does the brain produce to force action?'},
    {prompt:'Compare and contrast Type 1 and Type 2 diabetes.',keywords:['Type 1','insulin','injection','Type 2','resistance','diet','exercise'],hint:'One is an autoimmune destruction; the other is a lifestyle and resistance issue. How are they treated?'},
    {prompt:'Describe the journey of a glucose molecule after it is absorbed into the blood following a carbohydrate-rich meal.',keywords:['glucose','pancreas','insulin','liver','glycogen','storage'],hint:'How does the body ensure the glucose doesn\'t stay dangerously high in the blood?'},
    {prompt:'Explain how the kidneys produce concentrated urine when water is scarce.',keywords:['ADH','permeable','collecting duct','water','reabsorb','concentrated','urine'],hint:'Which hormone acts on which part of the kidney tubule, and what is the result for water movement?'},
    {prompt:'What are the three main components of a homeostatic control system?',keywords:['receptor','coordination centre','effector','stimulus','response'],hint:'Think about how a change is detected, processed, and acted upon.'},
    {prompt:'Explain why sweating is an effective cooling mechanism in hot climates.',keywords:['evaporation','latent heat','sweat','cool','skin','blood'],hint:'What physical process happens to liquid water on a hot surface? How does this remove heat from the body?'},
    {prompt:'Describe the specific role of the pancreas in detecting high blood glucose.',keywords:['pancreas','beta cells','detect','glucose','insulin','secrete'],hint:'Which cells in the pancreas are responsible for sensing the sugar level and releasing insulin?'},
    {prompt:'Explain how the pituitary gland and the kidney work together in osmoregulation.',keywords:['pituitary','ADH','kidney','collecting duct','water','balance'],hint:'The pituitary sends a chemical messenger to the kidney. What does that messenger do?'},
    {prompt:'What would happen to a person\'s urine output if their pancreas stopped producing insulin?',keywords:['diabetes','glucose','urine','osmosis','water','frequent'],hint:'If glucose is in the urine, how does that affect the movement of water out of the body?'},
    {prompt:'Explain the concept of a "set point" in homeostasis.',keywords:['set point','normal','optimal','internal environment','control','constant'],hint:'Is homeostasis about keeping a value perfectly still, or maintaining it around a specific healthy target?'},
    {prompt:'Describe how the body uses both behavioral and physiological responses to control temperature.',keywords:['behavioral','clothing','physiological','vasodilation','sweating','shivering'],hint:'Behavioral is what you consciously do; physiological is what your body automatically does.'},
  ],
});
</script></body></html>
