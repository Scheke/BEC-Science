<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Metals Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Metals & Reactivity — BGCSE Chemistry Quiz',
  color:'#37474f',dark:'#102027',light:'#eceff1',
  mcq:[
    {q:'Which metal is most reactive in the reactivity series?',opts:['Copper','Iron','Potassium','Zinc'],ans:2,exp:'The reactivity series (most to least reactive): K > Na > Ca > Mg > Al > Zn > Fe > Ni > Sn > Pb > H > Cu > Ag > Au. POTASSIUM is the most reactive of these common metals.'},
    {q:'Displacement reactions occur when:',opts:['A more reactive metal displaces a less reactive metal from its compound','Two metals react together','A metal reacts with water only','Acids react with bases'],ans:0,exp:'A MORE REACTIVE metal displaces a LESS REACTIVE metal from its compound. e.g. Fe + CuSO₄ → FeSO₄ + Cu (iron is more reactive than copper, so displaces it).'},
    {q:'The extraction method for a metal depends on:',opts:['Its colour','Its position in the reactivity series','Its density','Its melting point'],ans:1,exp:'Metals HIGH in the reactivity series (K, Na, Ca, Mg, Al) are extracted by ELECTROLYSIS. Metals in the MIDDLE (Zn, Fe, Pb) are extracted by REDUCTION with carbon/coke. Very UNREACTIVE metals (Cu, Ag, Au) may occur natively.'},
    {q:'During electrolysis of molten aluminium oxide, aluminium forms at the:',opts:['Anode','Cathode','Both electrodes','In the solution'],ans:1,exp:'During electrolysis: CATHODE (negative electrode) attracts Al³⁺ cations → they gain electrons (reduction) → Al metal is deposited. At the ANODE, O²⁻ anions lose electrons → oxygen gas is released.'},
    {q:'Rusting of iron requires:',opts:['Only water','Only oxygen','Both water AND oxygen','Carbon dioxide'],ans:2,exp:'Rusting requires BOTH WATER AND OXYGEN. The chemical reaction: 4Fe + 3O₂ + 6H₂O → 2Fe₂O₃.3H₂O (hydrated iron oxide = rust). Salt water speeds up rusting (better electrolyte).'},
    {q:'Which method of rust prevention forms a barrier AND provides sacrificial protection?',opts:['Painting','Galvanising (zinc coating)','Alloying','Oiling'],ans:1,exp:'GALVANISING coats iron/steel with ZINC. Zinc provides: (1) BARRIER protection (blocks air/water), AND (2) SACRIFICIAL PROTECTION — zinc is more reactive than iron, so it corrodes preferentially, protecting the iron even where the coating is scratched.'},
    {q:'When a piece of zinc is placed into a solution of copper(II) sulphate, what is observed?',opts:['Nothing happens','The zinc dissolves and a red-brown copper coating appears','The solution turns green','The zinc sinks to the bottom'],ans:1,exp:'Zinc is ABOVE copper in the reactivity series. Therefore, zinc displaces copper: Zn + CuSO₄ → ZnSO₄ + Cu. The blue solution fades, and a reddish-brown coating of copper metal forms on the zinc.'},
    {q:'In the blast furnace, the main reducing agent for iron oxide is:',opts:['Coke (Carbon)','Carbon monoxide (CO)','Oxygen','Limestone'],ans:1,exp:'In the blast furnace, COKE burns to form CO₂, then reduces to CO. CARBON MONOXIDE (CO) is the main reducing agent: Fe₂O₃ + 3CO → 2Fe + 3CO₂. It removes oxygen from the iron ore.'},
    {q:'Which metal does NOT react with cold water or steam?',opts:['Potassium','Calcium','Sodium','Copper'],ans:3,exp:'COPPER is lower than hydrogen in the reactivity series. It does NOT react with water or steam under normal conditions. Potassium, Sodium, and Calcium are highly reactive and react vigorously with water.'},
    {q:'Which of the following is a method of rust prevention that works solely by acting as a barrier?',opts:['Galvanising','Painting','Sacrificial protection','Connecting to a magnesium block'],ans:1,exp:'PAINTING provides a physical BARRIER that prevents oxygen and water from reaching the iron surface. It does not provide sacrificial protection. Galvanising and magnesium blocks provide BOTH barrier and sacrificial protection.'},
    {q:'In the electrolysis of a molten metal halide, the metal is deposited at the:',opts:['Anode (positive electrode)','Cathode (negative electrode)','Both electrodes','The middle of the solution'],ans:1,exp:'Metal ions (cations) are POSITIVE. They are attracted to the NEGATIVE electrode (CATHODE). At the cathode, they gain electrons (reduction) and are deposited as pure metal atoms.'},
    {q:'Which metal can be found uncombined (natively) in the Earth\'s crust?',opts:['Sodium','Iron','Gold','Aluminium'],ans:2,exp:'GOLD is very low in the reactivity series. It is extremely unreactive and does not readily form compounds. Therefore, it is often found in its native (pure) metallic state, unlike reactive metals which are always found as ores (compounds).'},
    {q:'When a metal reacts with dilute hydrochloric acid, the products are:',opts:['Metal chloride and water','Metal chloride and hydrogen gas','Metal oxide and hydrogen','Metal sulfate and water'],ans:1,exp:'Acid + Metal → Salt + Hydrogen gas. Metal + Hydrochloric Acid → Metal Chloride + H₂. Example: Zn + 2HCl → ZnCl₂ + H₂. The hydrogen gas can be identified by the "squeaky pop" test (burning splint).'},
    {q:'The reactivity series is determined by a metal\'s tendency to:',opts:['Gain neutrons','Gain electrons','Lose electrons (form positive ions)','Lose protons'],ans:2,exp:'The reactivity series ranks metals based on their tendency to LOSE ELECTRONS to form positive ions (cations). The more readily a metal loses electrons, the MORE REACTIVE it is. Potassium loses electrons most readily; gold loses them with great difficulty.'},
    {q:'Why does iron rust faster in coastal areas than in inland deserts?',opts:['The air is hotter','Salt in the air acts as an electrolyte, speeding up the electrochemical process','The desert has more oxygen','The sand scratches the metal'],ans:1,exp:'Rusting is an electrochemical process. Salt (sodium chloride) in the air near the coast acts as an ELECTROLYTE, increasing the conductivity of the water layer on the iron surface. This significantly speeds up the electrochemical corrosion of iron.'},
    {q:'In the extraction of iron, limestone is added to the blast furnace to:',opts:['Reduce the iron oxide','Lower the melting point of iron','Remove impurities as slag (calcium silicate)','Supply oxygen for combustion'],ans:2,exp:'LIMESTONE (CaCO₃) decomposes to CaO and CO₂. CaO reacts with acidic impurities (like sand/SiO₂) in the iron ore to form CALCIUM SILICATE (CaSiO₃), which is called SLAG. Slag is less dense and floats on top of the molten iron, where it is removed.'},
    {q:'Which of the following metals reacts with steam (but not cold water) to produce hydrogen?',opts:['Sodium','Calcium','Iron','Potassium'],ans:2,exp:'IRON is moderately reactive. It does not react with cold water, but it does react with STEAM: 3Fe + 4H₂O → Fe₃O₄ + 4H₂. Sodium, Potassium, and Calcium react violently with cold water.'},
    {q:'The process of using electricity to decompose a molten compound into its elements is called:',opts:['Reduction','Oxidation','Electrolysis','Displacement'],ans:2,exp:'ELECTROLYSIS is the decomposition of a compound using an electric current. It is used to extract highly reactive metals (like Al, Na, Mg) because they cannot be reduced by carbon. The ionic compound must be molten to allow ions to flow.'},
    {q:'Why is aluminium more expensive to extract than iron?',opts:['Aluminium is rarer than iron','Aluminium requires electrolysis (high electricity costs), while iron is reduced with carbon','Aluminium is less reactive','Aluminium has a higher melting point'],ans:1,exp:'Aluminium is ABOVE carbon in the reactivity series, so it cannot be reduced by carbon. It MUST be extracted by ELECTROLYSIS of molten aluminium oxide. Electrolysis consumes massive amounts of electrical energy, making it expensive. Iron is reduced using cheap coke/carbon.'},
    {q:'Sacrificial protection uses a more reactive metal connected to iron. An example of this is:',opts:['Painting the iron','Connecting an iron pipe to a block of magnesium','Galvanising with tin','Storing iron in a dry place'],ans:1,exp:'When a block of MAGNESIUM (more reactive) is connected to an iron pipe, the magnesium corrodes preferentially. It releases electrons that travel to the iron, preventing the iron from losing electrons and rusting. The magnesium is "sacrificed" to protect the iron.'},
  ],
  match:[
    {term:'Reactivity series',def:'Ranking of metals from most to least reactive based on their ability to lose electrons'},
    {term:'Displacement reaction',def:'A reaction where a more reactive metal pushes out a less reactive metal from its compound/salt solution'},
    {term:'Electrolysis',def:'Using an electric current to decompose a molten ionic compound to extract highly reactive metals'},
    {term:'Galvanising',def:'Coating iron with a layer of zinc to provide both barrier and sacrificial protection against rusting'},
    {term:'Reduction',def:'The gain of electrons (or loss of oxygen) by a substance; used to extract metals with carbon'},
    {term:'Sacrificial protection',def:'Connecting a more reactive metal to a less reactive metal so that the more reactive metal corrodes first'},
    {term:'Blast furnace',def:'A tall industrial furnace used to extract iron from its ore using carbon monoxide'},
    {term:'Slag',def:'The waste product (calcium silicate) formed when limestone reacts with impurities in the blast furnace'},
    {term:'Coke',def:'A form of carbon (derived from coal) used as a fuel and reducing agent in the blast furnace'},
    {term:'Ore',def:'A naturally occurring rock or mineral from which a useful metal can be extracted economically'},
    {term:'Cathode',def:'The negative electrode in electrolysis where cations gain electrons and are deposited'},
    {term:'Anode',def:'The positive electrode in electrolysis where anions lose electrons'},
    {term:'Alloy',def:'A mixture of a metal with other elements (metals or non-metals) to improve properties'},
    {term:'Rust',def:'Hydrated iron(III) oxide (Fe₂O₃·xH₂O), formed when iron corrodes in the presence of oxygen and water'},
    {term:'Corrosion',def:'The gradual destruction of a metal by chemical reaction with its environment'},
    {term:'Electrolyte',def:'A molten or dissolved ionic compound that can conduct electricity due to free-moving ions'},
    {term:'Oxidation',def:'The loss of electrons (or gain of oxygen) by a substance'},
    {term:'Native metal',def:'A metal that is found in its pure, uncombined form in nature (e.g., gold, silver)'},
    {term:'Salt',def:'A compound formed when the hydrogen in an acid is replaced by a metal or ammonium ion'},
    {term:'Carbon reduction',def:'Using carbon (or carbon monoxide) to remove oxygen from a metal oxide to extract the metal'},
  ],
  flashcards:[
    {q:'State the reactivity series in order (most to least reactive).',a:'K > Na > Ca > Mg > Al > (C) > Zn > Fe > (H) > Cu > Ag > Au\n\nMemory aid: "King Solomon Can Make All Zinc Factories Into Copper, Silver, Gold"'},
    {q:'What happens during electrolysis of copper sulphate solution with copper electrodes?',a:'ANODE (positive): Cu → Cu²⁺ + 2e⁻ (copper atoms dissolve into solution). CATHODE (negative): Cu²⁺ + 2e⁻ → Cu (copper ions deposit as solid copper). Net result: copper transfers from the anode to the cathode. Used in electroplating and copper purification.'},
    {q:'Explain how carbon reduces iron oxide in a blast furnace.',a:'Coke (C) burns with hot air: C + O₂ → CO₂. Then CO₂ + C → 2CO. Carbon monoxide REDUCES iron oxide: Fe₂O₃ + 3CO → 2Fe + 3CO₂. The molten iron sinks to the bottom of the furnace.'},
    {q:'Why is aluminium more expensive to produce than iron?',a:'Aluminium is MORE REACTIVE than carbon, so it CANNOT be extracted by reduction with carbon. Electrolysis MUST be used instead. Electrolysis requires large amounts of electricity, making the process vastly more expensive than the carbon reduction used for iron.'},
    {q:'What is an alloy? Give two examples.',a:'An ALLOY is a mixture of a metal with other elements (metals or non-metals) to enhance specific properties. Examples: 1. STEEL (iron + carbon) — harder and stronger than pure iron. 2. BRONZE (copper + tin) — harder than pure copper. 3. BRASS (copper + zinc) — corrosion-resistant.'},
    {q:'Why do more reactive metals form more stable compounds?',a:'More reactive metals have a stronger tendency to LOSE ELECTRONS. Consequently, their ions are more stable when combined with non-metals in compounds. Metals like K and Na react vigorously with water/air, while gold and silver do not react at all under normal conditions.'},
    {q:'Describe the observations when a piece of iron is placed into copper(II) sulphate solution.',a:'Iron is MORE reactive than copper. A displacement reaction occurs: Fe + CuSO₄ → FeSO₄ + Cu. Observations: The blue colour of the copper sulphate solution fades (becomes green due to FeSO₄). A reddish-brown layer of solid copper is deposited on the iron.'},
    {q:'Explain why iron rusts faster in saltwater than in fresh water.',a:'Rusting is an electrochemical process. Saltwater (containing dissolved sodium chloride) acts as a much better ELECTROLYTE than fresh water. The better electrolyte increases the rate of electron transfer between the iron and the oxygen, accelerating the formation of hydrated iron(III) oxide (rust).'},
    {q:'What is the purpose of adding cryolite to the electrolysis of aluminium oxide?',a:'Pure aluminium oxide has a very high melting point (~2050°C). Cryolite is added to LOWER the melting point to about 950°C. This reduces the energy costs significantly and makes the process commercially viable.'},
    {q:'Why can carbon be used to extract iron but not sodium?',a:'Carbon is more reactive than iron (Fe), so it can remove oxygen from iron oxide (reduction). However, Sodium (Na) is MORE reactive than carbon. Carbon CANNOT remove oxygen from sodium oxide; sodium must be extracted via electrolysis.'},
    {q:'How does galvanising protect iron from rusting when the zinc coating is scratched?',a:'When scratched, the zinc coating exposes the iron underneath. Because zinc is MORE reactive than iron, it acts as a SACRIFICIAL anode. The zinc corrodes preferentially, protecting the iron from rusting even at the scratch point.'},
    {q:'Describe the reactions that occur in a blast furnace to extract iron.',a:'1. Coke burns: C + O₂ → CO₂ (provides heat). 2. CO₂ + C → 2CO (forms reducing agent). 3. Fe₂O₃ + 3CO → 2Fe + 3CO₂ (iron is reduced). 4. CaCO₃ → CaO + CO₂. 5. CaO + SiO₂ → CaSiO₃ (slag formation).'},
    {q:'What is the "squeaky pop" test used for?',a:'The "squeaky pop" test is used to identify HYDROGEN GAS. A burning splint is placed near the mouth of a test tube containing the gas. If hydrogen is present, it reacts with the oxygen in the air and burns with a distinctive squeaky pop sound.'},
    {q:'Explain what happens to the mass of a piece of iron when it rusts.',a:'The mass of the iron INCREASES. This is because the iron reacts with oxygen from the air and water to form hydrated iron(III) oxide (rust). The added mass comes from the oxygen and water incorporated into the rust compound.'},
    {q:'Why is steel (an alloy) preferred over pure iron for construction?',a:'Pure iron is relatively soft and malleable. By adding small amounts of carbon (and other elements) to make STEEL, the regular metallic lattice is disrupted. This makes the alloy much HARDER and STRONGER than pure iron, making it suitable for bridges and building frames.'},
    {q:'When metals react with water, what is the general word equation?',a:'Metal + Water → Metal Hydroxide + Hydrogen gas. Example: 2Na + 2H₂O → 2NaOH + H₂. Very reactive metals react violently; less reactive metals may only react with steam.'},
    {q:'Why is it important to recycle metals?',a:'Recycling metals is important because: 1. It conserves limited mineral resources (ores). 2. It uses much less energy (and reduces CO₂ emissions) than extracting metals from their ores. 3. It reduces the amount of waste sent to landfills.'},
    {q:'Describe the electrochemical process of rusting.',a:'In rusting, a small electrochemical cell is set up on the iron surface. Iron atoms lose electrons at the anode (Fe → Fe²⁺ + 2e⁻). The electrons travel through the metal to the cathode, where oxygen and water gain them to form hydroxide ions (O₂ + 2H₂O + 4e⁻ → 4OH⁻). The Fe²⁺ reacts with OH⁻ and O₂ to form hydrated iron(III) oxide (rust).'},
    {q:'What is the role of oxygen in the extraction of metals via carbon reduction?',a:'Oxygen is NOT a reactant in the reduction. Carbon is used to REMOVE oxygen from the metal oxide. The oxygen leaves the metal oxide and joins with the carbon to form carbon dioxide (CO₂), leaving the pure metal behind.'},
    {q:'Compare the extraction methods for potassium and copper.',a:'Potassium is extracted by ELECTROLYSIS of its molten chloride because it is too reactive to be reduced by carbon. Copper can be extracted by HEATING its ore with carbon (reduction), or by smelting, or it can be found natively because it is very unreactive.'},
  ],
  blanks:{
    passage:'The reactivity series ranks metals from most to least reactive. A [_] reaction occurs when a more reactive metal displaces a less reactive one from its salt solution. Very reactive metals like aluminium are extracted by [_]. Iron rusts when exposed to both water and [_]. [_] iron with zinc provides both barrier and sacrificial protection. In the blast furnace, [_] is the main reducing agent used to extract iron from its oxide.',
    answers:['displacement','electrolysis','oxygen','Galvanising','carbon monoxide'],
    wordbank:['displacement','electrolysis','oxygen','Galvanising','carbon monoxide','reduction','carbon dioxide','copper'],
  },
  sentences:[
    {prompt:'Explain why iron is extracted using carbon reduction, but aluminium must be extracted using electrolysis.',keywords:['reactivity series','carbon','iron','aluminium','electrolysis','reduction','expensive'],hint:'Compare where Aluminium and Iron appear in the reactivity series relative to Carbon. What happens when a metal is above Carbon?'},
    {prompt:'Describe the observations and the chemical equation for the displacement reaction between iron and copper(II) sulphate solution.',keywords:['more reactive','iron','copper','blue','colour change','FeSO₄','Cu'],hint:'What colour is copper sulphate solution initially? What colour does it become when iron is added? What is formed on the iron?'},
    {prompt:'Explain TWO ways zinc protects iron from rusting when the iron is galvanised.',keywords:['barrier','sacrificial','oxygen','water','zinc','corrodes','preferentially'],hint:'Think about what happens physically (1) when the coating is intact, and (2) when the coating is scratched to reveal the iron underneath.'},
    {prompt:'Write a balanced equation for the reaction of magnesium with dilute hydrochloric acid.',keywords:['Mg','HCl','MgCl₂','H₂','squeaky pop','salt'],hint:'What are the general products of a metal reacting with an acid? Balance the atoms on both sides.'},
    {prompt:'Explain the role of the anode and cathode in the electrolysis of molten sodium chloride.',keywords:['anode','positive','cathode','negative','Cl₂','Na','reduction','oxidation'],hint:'Which electrode attracts the positive ions (cations), and which attracts the negative ions (anions)? What happens to each ion?'},
    {prompt:'Describe the observations when a small piece of sodium is dropped into a trough of water.',keywords:['sodium','water','fizzing','floats','melts','hydrogen','NaOH'],hint:'What does the sodium do? Does it stay still? Does it make a sound? What gas is produced?'},
    {prompt:'Explain why the cost of extracting aluminium is so much higher than extracting iron.',keywords:['aluminium','electrolysis','electricity','energy','iron','carbon','coke','cheap'],hint:'What extraction method does each metal require, and how does the method affect the energy cost?'},
    {prompt:'Describe the industrial process for extracting iron in a blast furnace, including the raw materials used.',keywords:['iron ore','coke','limestone','hot air','CO','reduction','slag'],hint:'What are the three main raw materials fed into the top of the furnace? What is the function of each?'},
    {prompt:'Explain the term "sacrificial protection" and give an example of how it is used to prevent rusting.',keywords:['sacrificial','more reactive','corrodes','preferentially','magnesium','iron'],hint:'How does connecting a more reactive metal to iron stop the iron from rusting?'},
    {prompt:'Why does iron rust more rapidly in a coastal city compared to a dry, inland desert?',keywords:['salt','electrolyte','electrochemical','speed','corrosion','water','oxygen'],hint:'What substance is present in coastal air that is absent in the desert, and how does it affect the rate of the rusting reaction?'},
    {prompt:'Write the chemical equation for the rusting of iron.',keywords:['Fe','O₂','H₂O','Fe₂O₃','rust','hydrated'],hint:'What are the three reactants required for rusting, and what is the chemical name and formula for rust?'},
    {prompt:'Explain how alloys differ from pure metals in terms of structure and properties.',keywords:['alloy','mixture','different atoms','disrupt','layers','slide','harder','stronger'],hint:'How does adding atoms of different sizes affect the layers of ions in the metal lattice?'},
    {prompt:'Describe the reactivity of copper compared to zinc, and predict what happens when zinc is placed in copper sulphate solution.',keywords:['zinc','copper','displacement','coating','blue','fades','more reactive'],hint:'Which metal is higher in the reactivity series? What happens to the blue solution and the zinc metal?'},
    {prompt:'Explain why potassium is stored under oil and gold is found as a native metal.',keywords:['potassium','reactive','oil','exclude','air','water','gold','unreactive','native'],hint:'How reactive is potassium with air and water? How reactive is gold?'},
    {prompt:'What is slag, and why is it formed during the extraction of iron in a blast furnace?',keywords:['slag','limestone','impurities','sand','SiO₂','calcium silicate','remove'],hint:'What does the limestone (calcium carbonate) react with in the furnace, and what is the waste product called?'},
    {prompt:'Explain what happens to the electrons at the anode and cathode during the electrolysis of copper chloride solution.',keywords:['anode','oxidation','lose','electrons','cathode','reduction','gain','electrons'],hint:'Which electrode gives up electrons to the external circuit, and which electrode takes electrons from the external circuit?'},
    {prompt:'Why is carbon a suitable reducing agent for iron but not for sodium?',keywords:['carbon','reducing agent','iron','sodium','reactivity','above','below'],hint:'A reducing agent must be more reactive than the metal it is trying to reduce. Where are C, Fe, and Na placed in the reactivity series?'},
    {prompt:'Describe a laboratory method to demonstrate the displacement reaction between iron and copper(II) sulphate.',keywords:['iron nail','beaker','CuSO₄','blue','green','copper','deposit'],hint:'What apparatus is needed, and what observations would you record?'},
    {prompt:'Explain why recycling aluminium is beneficial to the environment.',keywords:['recycling','energy','electrolysis','electricity','CO₂','ores','conservation'],hint:'How does the energy requirement for recycling compare to the energy requirement for extracting aluminium from its ore?'},
    {prompt:'State the reactivity series order for the metals: Calcium, Copper, Gold, Iron, Potassium, Sodium, Zinc.',keywords:['K','Na','Ca','Zn','Fe','Cu','Au','most reactive','least reactive'],hint:'Arrange them from the most reactive to the least reactive based on standard reactivity series rankings.'},
  ],
});
</script></body></html>
