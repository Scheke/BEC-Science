<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mechanics Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Mechanics — BGCSE Physics Quiz',
  color:'#0d47a1',dark:'#002171',light:'#e3f2fd',
    mcq:[
    {q:'A 10 kg object accelerates at 3 m/s². What is the net force?',opts:['3.3 N','13 N','30 N','0.3 N'],ans:2,exp:'F = m × a = 10 × 3 = 30 N (Newton\'s Second Law).'},
    {q:'An object moving at constant velocity has:',opts:['A large net force','Zero net force','Increasing acceleration','Decreasing mass'],ans:1,exp:'Constant velocity means NO ACCELERATION. Newton\'s First Law: if net force = 0, the object stays at rest or moves at constant velocity. So zero net force.'},
    {q:'The unit of pressure is:',opts:['Newton (N)','Pascal (Pa) = N/m²','Joule (J)','Watt (W)'],ans:1,exp:'Pressure is force per unit area. Unit: PASCAL (Pa) = Newton per square metre (N/m²). P = F/A.'},
    {q:'Work done = ?',opts:['Mass × acceleration','Force × distance moved in direction of force','Power × time','Pressure × volume'],ans:1,exp:'Work Done (J) = Force (N) × Distance moved in the direction of the force (m). This is the definition of work/energy transferred.'},
    {q:'Which object has the most momentum? (mass in kg, velocity in m/s)',opts:['2kg at 10m/s','5kg at 3m/s','10kg at 1m/s','1kg at 20m/s'],ans:3,exp:'Momentum = mass × velocity. A: 2×10=20, B: 5×3=15, C: 10×1=10, D: 1×20=20. Both A and D have 20 kg·m/s — but D is 1kg×20m/s = 20 kg·m/s. Equal with A.'},
    {q:'A 50 N force acts over an area of 2 m². What is the pressure?',opts:['100 Pa','52 Pa','48 Pa','25 Pa'],ans:3,exp:'P = F/A = 50/2 = 25 Pa.'},
    {q:'What is the weight of a 5 kg mass on Earth (g = 10 N/kg)?',opts:['5 N','0.5 N','50 N','500 N'],ans:2,exp:'Weight (W) = mass × gravitational field strength (g). W = 5 kg × 10 N/kg = 50 N. Weight is a FORCE, measured in Newtons.'},
    {q:'A stationary object has zero:',opts:['Mass','Weight','Momentum','Potential energy'],ans:2,exp:'Momentum = mass × velocity. Since the object is stationary, velocity = 0, so momentum = 0. It still has mass, weight, and potential energy.'},
    {q:'Power is defined as:',opts:['Force × distance','Energy transferred per second (J/s)','Mass × acceleration','Force per unit area'],ans:1,exp:'Power (Watts) is the RATE of doing work or transferring energy. Power = Work Done / Time = Energy / Time. P = W/t (J/s).'},
    {q:'If the distance a force acts over is doubled, the work done (assuming force is constant):',opts:['Doubles','Halves','Stays the same','Quadruples'],ans:0,exp:'Work = Force × Distance. If distance doubles, work DOUBLES. Work is directly proportional to distance for a constant force.'},
    {q:'Action and reaction forces act on:',opts:['The same object','Different objects','The same object and cancel out','Only moving objects'],ans:1,exp:'Newton\'s Third Law: action and reaction forces act on DIFFERENT objects. They are equal in magnitude and opposite in direction, but because they are on different objects, they do NOT cancel out.'},
    {q:'A ball is thrown upward. At the peak of its path, what is its acceleration?',opts:['0 m/s²','9.8 m/s² downward','9.8 m/s² upward','Depends on its mass'],ans:1,exp:'Even at the peak (when velocity is 0), gravity is still pulling the ball downward at 9.8 m/s². Acceleration due to gravity is ALWAYS constant near the Earth\'s surface, regardless of velocity.'},
    {q:'Gravitational Potential Energy (GPE) depends on:',opts:['Mass and velocity','Mass, height, and gravitational field strength','Height and velocity','Force and area'],ans:1,exp:'GPE = mgh (mass × gravitational field strength × height). It is the stored energy an object has due to its position in a gravitational field.'},
    {q:'In the equation F = ma, what does "a" represent?',opts:['Velocity','Acceleration','Mass','Force'],ans:1,exp:'F = ma is Newton\'s Second Law. "a" represents ACCELERATION (the rate of change of velocity). Acceleration is a vector, meaning it has both magnitude and direction.'},
    {q:'If the mass of an object doubles, its kinetic energy (KE = ½mv²) will:',opts:['Stay the same','Double','Halve','Quadruple'],ans:1,exp:'KE = ½mv². If mass (m) doubles, KE directly doubles. If velocity doubles, KE quadruples (since v is squared).'},
    {q:'The principle of conservation of momentum applies when:',opts:['Friction is present','There are no external forces (closed system)','The objects are stationary','The collision is perfectly elastic'],ans:1,exp:'Momentum is conserved ONLY in a CLOSED SYSTEM where there are NO EXTERNAL FORCES acting (like friction, air resistance, or an external push).'},
    {q:'A skydiver falls at constant speed. The forces acting on them are:',opts:['Unbalanced','Balanced','Zero','Only weight'],ans:1,exp:'At constant speed (terminal velocity), the downward FORCE OF WEIGHT is exactly balanced by the upward FORCE OF DRAG (air resistance). Net force is zero, so acceleration is zero.'},
    {q:'What is the SI unit of work and energy?',opts:['Newton','Watt','Joule','Pascal'],ans:2,exp:'The JOULE (J) is the SI unit of work, energy, and heat. 1 Joule = 1 Newton × 1 metre (1 N·m). It is also 1 Watt × 1 second (1 W·s).'},
    {q:'When a force does work on an object, the work is NEGATIVE if:',opts:['The force moves the object forward','The force opposes the direction of motion','The object is stationary','The force is zero'],ans:1,exp:'Work is negative when the force is directed OPPOSITE to the direction of motion. For example, friction does negative work on a moving car because it acts opposite to the car\'s motion, removing energy.'},
    {q:'A 1000 kg car accelerates from 5 m/s to 15 m/s. What is the change in kinetic energy?',opts:['100,000 J','50,000 J','112,500 J','62,500 J'],ans:0,exp:'Initial KE = ½ × 1000 × (5²) = 12,500 J. Final KE = ½ × 1000 × (15²) = 112,500 J. Change in KE = 112,500 - 12,500 = 100,000 J.'},
  ],
  match:[
    {term:'Newton\'s 1st Law',def:'An object at rest stays at rest, or moves at constant velocity, unless acted upon by a resultant/net force'},
    {term:'Newton\'s 2nd Law',def:'The acceleration of an object is directly proportional to the net force acting on it (F = ma)'},
    {term:'Newton\'s 3rd Law',def:'For every action force, there is an equal and opposite reaction force acting on a different object'},
    {term:'Momentum',def:'The product of an object\'s mass and its velocity (p = mv); a vector quantity measured in kg·m/s'},
    {term:'Work done',def:'The product of the force applied and the distance moved in the direction of that force (W = Fd); measured in Joules'},
    {term:'Pressure',def:'The force exerted per unit area (P = F/A); measured in Pascals (N/m²)'},
    {term:'Kinetic Energy (KE)',def:'The energy an object possesses due to its motion; KE = ½mv²'},
    {term:'Gravitational Potential Energy (GPE)',def:'The energy an object possesses due to its height above a reference point; GPE = mgh'},
    {term:'Power',def:'The rate at which work is done or energy is transferred; P = W/t; measured in Watts (J/s)'},
    {term:'Weight',def:'The force of gravity acting on an object\'s mass; W = mg; measured in Newtons'},
    {term:'Mass',def:'The amount of matter in an object; a scalar quantity measured in kilograms (kg)'},
    {term:'Velocity',def:'Speed in a given direction; a vector quantity measured in m/s'},
    {term:'Acceleration',def:'The rate of change of velocity; a vector quantity measured in m/s²'},
    {term:'Terminal velocity',def:'The constant maximum velocity reached when the upward drag force equals the downward weight force (net force = 0)'},
    {term:'Scalar quantity',def:'A physical quantity with only magnitude (e.g., speed, mass, distance, time, energy)'},
    {term:'Vector quantity',def:'A physical quantity with both magnitude and direction (e.g., force, velocity, acceleration, momentum, displacement)'},
    {term:'Conservation of momentum',def:'In a closed system with no external forces, the total momentum before a collision equals the total momentum after the collision'},
    {term:'Drag force',def:'Air resistance or fluid friction that opposes the motion of an object through a fluid'},
    {term:'Impulse',def:'The change in momentum of an object when a force is applied over a period of time (Impulse = Force × Time)'},
    {term:'Elastic collision',def:'A collision where both momentum AND kinetic energy are conserved'},
  ],
  flashcards:[
    {q:'State Newton\'s three laws of motion.',a:'1st Law (Law of Inertia): An object remains at rest or in uniform motion unless acted upon by a resultant force.\n2nd Law (F = ma): The acceleration of an object is directly proportional to the net force and inversely proportional to its mass.\n3rd Law (Action-Reaction): For every action, there is an equal and opposite reaction acting on different objects.'},
    {q:'What is the difference between mass and weight?',a:'MASS: The amount of matter in an object (kg). It is a scalar and is constant everywhere in the universe. WEIGHT: The gravitational force exerted on an object (N). It is a vector and varies depending on gravitational field strength (W = mg). On Earth g ≈ 10 N/kg; on the Moon g ≈ 1.6 N/kg.'},
    {q:'State the principle of conservation of momentum.',a:'In a CLOSED SYSTEM (no external forces like friction or air resistance), the TOTAL MOMENTUM before a collision equals the total momentum AFTER the collision. Mathematically: m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂ (where u = initial velocity, v = final velocity).'},
    {q:'What is terminal velocity?',a:'Terminal velocity is the constant maximum velocity achieved by a falling object when the UPWARD DRAG FORCE exactly equals the DOWNWARD WEIGHT FORCE. At this point, the net force is zero, so acceleration is zero, and the object falls at a constant speed.'},
    {q:'Explain the difference between scalar and vector quantities.',a:'SCALAR quantities have ONLY magnitude (size or amount). Examples include: speed, mass, distance, time, energy, and temperature. VECTOR quantities have BOTH magnitude and direction. Examples include: velocity, force, acceleration, displacement, and momentum.'},
    {q:'Define kinetic and potential energy and give the formula for each.',a:'KINETIC ENERGY (KE): Energy an object has due to its motion. Formula: KE = ½mv² (where m = mass in kg, v = velocity in m/s).\nGRAVITATIONAL POTENTIAL ENERGY (GPE): Stored energy due to an object\'s height in a gravitational field. Formula: GPE = mgh (where m = mass, g = gravitational field strength, h = height).'},
    {q:'Explain the relationship between work, force, and distance.',a:'Work is done when a force moves an object through a distance in the direction of the force. The formula is: WORK (J) = FORCE (N) × DISTANCE (m). If the force and distance are in the same direction, work is positive. If they are in opposite directions, work is negative (e.g., friction).'},
    {q:'Calculate the kinetic energy of a 2 kg ball moving at 10 m/s.',a:'KE = ½mv² = 0.5 × 2 kg × (10 m/s)² = 1 × 100 = 100 Joules. The ball has 100 J of kinetic energy.'},
    {q:'Explain why a heavy truck and a small car both moving at 60 km/h have different kinetic energies.',a:'KE = ½mv². Since the velocity is the same, the kinetic energy depends entirely on MASS. A truck has a much larger mass than a car, so it possesses significantly MORE kinetic energy, requiring a much larger braking force to stop it.'},
    {q:'How does Newton\'s Third Law apply to a rocket launching into space?',a:'The rocket engine exerts a downward FORCE (action) on the hot exhaust gases. According to Newton\'s 3rd Law, the exhaust gases exert an EQUAL and OPPOSITE upward FORCE (reaction) on the rocket. This reaction force pushes the rocket upward.'},
    {q:'Describe the energy changes that occur when a pendulum swings.',a:'At the highest point, the pendulum has MAXIMUM Gravitational Potential Energy (GPE) and ZERO Kinetic Energy (KE). As it swings down, GPE is converted into KE. At the lowest point, it has MAXIMUM KE and MINIMUM GPE. This cycle repeats, with energy being continuously transformed between the two forms.'},
    {q:'Why does an object in free fall (ignoring air resistance) accelerate even though its weight is constant?',a:'Weight is constant (W = mg), but as the object falls, its velocity increases. According to Newton\'s 2nd Law (F = ma), a constant net force causes a CONSTANT ACCELERATION (g = 9.8 m/s²). The object continues to speed up because the constant force continuously increases its velocity.'},
    {q:'Define the "Principle of Conservation of Energy".',a:'Energy cannot be created or destroyed; it can only be transferred, stored, or transformed from one form to another. The TOTAL ENERGY in a closed system remains constant. (e.g., GPE converting to KE as an object falls).'},
    {q:'What is the difference between work and power?',a:'WORK is the transfer of energy (Joules). POWER is the RATE at which work is done (Joules per second = Watts). A high-power machine can do the same amount of work in a much shorter time compared to a low-power machine.'},
    {q:'Explain why a sharp knife cuts better than a blunt knife.',a:'Pressure = Force / Area. A sharp knife has a very THIN blade, which means a very SMALL surface area. By applying the same force over a much smaller area, the PRESSURE exerted is much greater, allowing the knife to cut through material easily.'},
    {q:'A 50 kg box is lifted 2 m above the ground. How much potential energy does it gain? (g = 10 N/kg)',a:'GPE = mgh = 50 kg × 10 N/kg × 2 m = 1000 Joules. The box gains 1000 J of gravitational potential energy.'},
    {q:'Define the term "impulse" and its relationship to momentum.',a:'IMPULSE is the product of the net force applied to an object and the time duration it is applied (Impulse = F × t). According to Newton\'s 2nd Law, Impulse is equal to the CHANGE IN MOMENTUM (Δp = F × t). This is why a longer impact time (like a padded airbag) reduces the force experienced during a collision.'},
    {q:'Explain what is meant by a "closed system" in physics.',a:'A CLOSED SYSTEM is a physical system where NO EXTERNAL FORCES (such as friction, air resistance, or gravity from outside the system) act upon it. Within a closed system, internal forces are the only forces present, which is why momentum is conserved perfectly in these idealized conditions.'},
    {q:'Compare the kinetic energy of a 1000 kg car at 20 m/s and a 2000 kg truck at 10 m/s.',a:'Car KE = ½ × 1000 × 20² = 500 × 400 = 200,000 J. Truck KE = ½ × 2000 × 10² = 1000 × 100 = 100,000 J. The car has twice the kinetic energy of the truck, even though the truck is heavier, because kinetic energy depends heavily on velocity (v²).'},
    {q:'Why do sports cars have low-profile, wide tyres?',a:'Low-profile, wide tyres have a much LARGER surface area in contact with the road. According to P = F/A, for the same weight (force) of the car, a larger area results in LOWER pressure. This prevents the tyres from sinking into the road and provides better grip, especially at high speeds.'},
  ],
  blanks:{
    passage:'Newton\'s second law states that the resultant force equals the object\'s [_] multiplied by its acceleration. If the net force acting on an object is [_], it will move at a constant velocity. The quantity defined as the product of an object\'s mass and velocity is called [_]. Work is only done when a force causes an object to move in the [_] of the force. The SI unit of pressure, defined as force per unit area, is the [_].',
    answers:['mass','zero','momentum','direction','Pascal'],
    wordbank:['mass','zero','momentum','direction','Pascal','velocity','weight','force'],
  },
  sentences:[
    {prompt:'Explain why a skydiver reaches a constant speed (terminal velocity) after falling for a while, and state what happens to the forces.',keywords:['weight','drag','air resistance','net force','zero','acceleration','terminal velocity'],hint:'What force increases as the skydiver falls faster? When do the upward and downward forces balance perfectly?'},
    {prompt:'A car of mass 1000 kg accelerates uniformly from rest to a speed of 20 m/s in 8 seconds. Calculate the net force required to achieve this acceleration.',keywords:['acceleration','v-u/t','2.5 m/s²','F=ma','2500 N','Newton\'s 2nd Law'],hint:'First, calculate the acceleration using the formula a = (v - u) / t. Then, apply Newton\'s Second Law (F = ma) to find the force.'},
    {prompt:'Explain Newton\'s Third Law of Motion using the example of a swimmer pushing off the side of a swimming pool.',keywords:['action','reaction','equal','opposite','pushes','water','wall','different objects'],hint:'What does the swimmer push against? What pushes the swimmer forward? Do these forces act on the same object?'},
    {prompt:'A 60 kg person walks up a flight of stairs, gaining 5 m in height. Calculate the gravitational potential energy gained. (g = 10 N/kg)',keywords:['GPE','mgh','60 kg','5 m','10 N/kg','3000 J'],hint:'Use the formula GPE = mgh.'},
    {prompt:'Explain the difference between work and power, using a simple example.',keywords:['work','force','distance','Joules','power','rate','Watts','time'],hint:'One is the total energy transferred; the other is how FAST that energy is transferred. Think about lifting a weight quickly versus slowly.'},
    {prompt:'A football of mass 0.5 kg is kicked and reaches a velocity of 20 m/s. Calculate its momentum.',keywords:['momentum','mass','velocity','p=mv','0.5×20','10 kg·m/s'],hint:'Use the formula: Momentum = mass × velocity.'},
    {prompt:'A 1200 kg car travels at 25 m/s. Calculate its kinetic energy.',keywords:['KE','½mv²','1200','25','375,000 J','kinetic energy'],hint:'Use the formula KE = ½mv². Remember to square the velocity first.'},
    {prompt:'Explain why a person can walk on a sandy beach without sinking if they wear snowshoes, but sink when wearing high-heeled shoes.',keywords:['pressure','force','area','snowshoes','high heels','P=F/A','sink'],hint:'How does surface area affect the pressure exerted on the sand for the same body weight (force)?'},
    {prompt:'State Newton\'s three laws of motion and give a real-world example for each.',keywords:['1st law','inertia','seatbelt','2nd law','F=ma','acceleration','3rd law','action','reaction','rocket'],hint:'Think about an object at rest, accelerating an object, and forces between interacting objects.'},
    {prompt:'A 5 kg rifle fires a 0.01 kg bullet at 500 m/s. Using the principle of conservation of momentum, calculate the recoil velocity of the rifle.',keywords:['conservation of momentum','momentum before','momentum after','recoil','-1 m/s','closed system'],hint:'Use the equation: m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂, assuming the rifle is initially at rest (u = 0).'},
    {prompt:'Define the term "terminal velocity" and explain the forces involved.',keywords:['terminal velocity','constant speed','weight','drag','air resistance','balanced forces','net force zero'],hint:'What happens to the acceleration and speed when the upward and downward forces become equal?'},
    {prompt:'A 2 kg object is dropped from a height of 10 m. Assuming no energy loss, calculate its velocity just before it hits the ground. (g = 10 N/kg)',keywords:['conservation of energy','GPE','KE','mgh','½mv²','14.1 m/s','10 m'],hint:'Use the conservation of energy principle: GPE lost = KE gained. Cancel mass from both sides.'},
    {prompt:'Explain why it is safer to land on a soft, padded mattress than on a hard concrete floor after a fall.',keywords:['impulse','force','time','momentum','change','cushioning','airbag'],hint:'Impulse = Force × Time. Does a mattress increase or decrease the time over which the impact occurs? What effect does this have on the force?'},
    {prompt:'A 50 N force is applied to push a box a distance of 3 m across a floor. Calculate the work done on the box.',keywords:['work','force','distance','W=Fd','50 N','3 m','150 J'],hint:'Use the work formula: Work = Force × Distance.'},
    {prompt:'Describe the energy transformations that take place when a ball is thrown upwards and then falls back down to the ground.',keywords:['kinetic energy','GPE','maximum height','conversion','energy transfer','velocity'],hint:'What happens to the speed as it goes up? What happens to its height? How do KE and GPE change during the flight?'},
    {prompt:'Calculate the power of a motor that lifts a 40 kg mass at a constant speed of 2 m/s. (g = 10 N/kg)',keywords:['power','force','velocity','P=Fv','weight','40×10','800 W'],hint:'First calculate the weight of the mass (force). Then use the formula for power when a force moves at a constant velocity: P = F × v.'},
    {prompt:'Explain what is meant by a "resultant force" and how it determines the motion of an object.',keywords:['resultant force','net force','vector sum','acceleration','balanced','motion'],hint:'If you add all the forces acting on an object together, taking direction into account, what is the total force? What does this determine about the object\'s acceleration?'},
    {prompt:'A 2 kg block is pulled by a 10 N force across a rough surface with a friction force of 4 N. Calculate the acceleration of the block.',keywords:['resultant force','10N-4N','6N','F=ma','acceleration','3 m/s²'],hint:'First, calculate the net (resultant) force by subtracting friction from the pulling force. Then apply Newton\'s Second Law (F = ma).'},
    {prompt:'Explain the difference between an elastic and an inelastic collision.',keywords:['elastic','KE','conserved','inelastic','kinetic energy','lost','heat','sound','deformation'],hint:'In one type, kinetic energy is completely conserved. In the other, some kinetic energy is transformed into other forms like heat or sound.'},
    {prompt:'State two differences between scalar and vector quantities and give two examples of each.',keywords:['scalar','magnitude','mass','speed','vector','direction','force','velocity','momentum'],hint:'One has only a number; the other has a number and a specific direction. Think about the physical quantities you have learned.'},
  ],
});
</script></body></html>
