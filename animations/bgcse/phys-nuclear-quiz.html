<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nuclear Physics Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Nuclear Physics — BGCSE Physics Quiz',
  color:'#4a148c',dark:'#12005e',light:'#f3e5f5',
    mcq:[
    {q:'Alpha (α) particles are:',opts:['High-energy electrons','Helium nuclei (2 protons + 2 neutrons)','High-energy electromagnetic radiation','Single protons'],ans:1,exp:'Alpha particles (α) = HELIUM NUCLEI: 2 protons + 2 neutrons, charge +2, mass 4. They have low penetration power (stopped by paper or a few cm of air) but high ionising ability.'},
    {q:'Which type of radiation has the greatest penetrating power?',opts:['Alpha (α)','Beta (β)','Gamma (γ)','All are equal'],ans:2,exp:'GAMMA (γ) rays have the greatest penetrating power — they are not stopped by paper or a few mm of aluminium. They require several cm of LEAD or metres of CONCRETE to significantly reduce them. Gamma rays are electromagnetic waves.'},
    {q:'After 2 half-lives, what fraction of a radioactive sample remains?',opts:['1/2','1/4','1/8','3/4'],ans:1,exp:'After 1 half-life: 1/2 remains. After 2 half-lives: 1/2 × 1/2 = 1/4 remains. After 3 half-lives: 1/8. After n half-lives: (1/2)ⁿ.'},
    {q:'During beta-minus (β⁻) decay, a neutron changes into:',opts:['A proton + alpha particle','A proton + electron (emitted as beta particle) + antineutrino','Two protons','An electron and a neutron'],ans:1,exp:'β⁻ decay: n → p + e⁻ + antineutrino. A NEUTRON converts to a PROTON (the nucleus\'s proton number increases by 1, mass number stays the same), releasing an ELECTRON as the beta particle.'},
    {q:'Nuclear fission involves:',opts:['Small nuclei joining together','A large nucleus splitting into two smaller nuclei + neutrons + energy','Electrons being emitted','Alpha particles joining with nuclei'],ans:1,exp:'FISSION: a large nucleus (e.g. U-235) absorbs a neutron and splits into two smaller nuclei + several neutrons + large amount of energy (E=mc²). The released neutrons can trigger a CHAIN REACTION.'},
    {q:'Background radiation comes from:',opts:['Only nuclear power stations','Natural sources (rocks, radon gas, cosmic rays) and artificial sources','Only medical X-rays','The sun only'],ans:1,exp:'BACKGROUND RADIATION comes from: NATURAL sources (radon gas from rocks/soil, cosmic rays, food, building materials) and ARTIFICIAL sources (medical X-rays, nuclear industry). Natural sources dominate — typically ~85% of background radiation.'},
    {q:'The decay of a radioactive isotope is best described as:',opts:['A chemical change','A random and spontaneous process','A reversible reaction','A physical change'],ans:1,exp:'Radioactive decay is a RANDOM and SPONTANEOUS process. It is impossible to predict which nucleus will decay next, but we can predict the statistical rate of decay (half-life) for a large sample.'},
    {q:'Which type of radiation has the highest ionising ability?',opts:['Alpha (α)','Beta (β)','Gamma (γ)','All are equal'],ans:0,exp:'ALPHA particles have the highest ionising ability because they are relatively large and highly charged (+2). They collide with atoms frequently, knocking electrons off and creating many ions per centimetre of path.'},
    {q:'A radioactive sample has an activity of 80 Bq. After 10 years, its activity is 20 Bq. What is the half-life?',opts:['5 years','10 years','20 years','2.5 years'],ans:0,exp:'80 Bq → 40 Bq (1 half-life) → 20 Bq (2 half-lives). 10 years = 2 half-lives. Half-life = 10 years / 2 = 5 years.'},
    {q:'In nuclear equations, the total mass number and atomic number must:',opts:['Always decrease','Always increase','Be conserved (balanced) on both sides','Be zero'],ans:2,exp:'In nuclear decay equations, the TOTAL MASS NUMBER (top numbers) and TOTAL ATOMIC NUMBER (bottom numbers) must be EQUAL on both the reactant and product sides. This follows the conservation of mass/charge.'},
    {q:'Which type of radiation is deflected toward the positive plate in an electric field?',opts:['Alpha (α)','Beta (β)','Gamma (γ)','Neutron radiation'],ans:1,exp:'BETA particles are negatively charged (-1) electrons. They are attracted toward the POSITIVE plate. Alpha particles (+2) are attracted to the negative plate. Gamma rays (neutral) pass undeflected.'},
    {q:'A tracer used in medical imaging must:',opts:['Have a very long half-life','Be highly radioactive for safety','Have a short half-life and emit gamma rays that can be detected','Emit alpha particles'],ans:2,exp:'Medical tracers need a SHORT half-life (minutes to hours) to minimise patient radiation dose. They emit GAMMA rays (highly penetrating) which can be detected outside the body by a gamma camera to image the organ.'},
    {q:'Nuclear fusion is the process of:',opts:['Splitting a large nucleus','Combining two light nuclei (e.g., deuterium and tritium) to form a heavier one','Emitting beta particles','Absorbing neutrons'],ans:1,exp:'FUSION: two light nuclei (like isotopes of hydrogen: deuterium and tritium) combine to form a heavier nucleus (helium) + a neutron + HUGE energy. It powers the Sun and stars. It is difficult to achieve on Earth due to the extreme temperature needed.'},
    {q:'What is the main advantage of nuclear fission for energy production?',opts:['It produces no waste','It releases a huge amount of energy from a small mass of fuel','It is completely safe','It produces no CO₂ or greenhouse gases'],ans:1,exp:'Nuclear fission releases EXTREMELY LARGE amounts of energy from a very small mass of fuel (e.g., 1 kg of U-235 releases as much energy as burning millions of kg of coal). While it doesn\'t produce CO₂, it creates radioactive waste.'},
    {q:'Which radiation type is blocked by a thin sheet of aluminium (a few mm thick)?',opts:['Alpha (α)','Beta (β)','Gamma (γ)','Neutron radiation'],ans:1,exp:'BETA particles are moderately penetrating and are stopped by a few millimetres of ALUMINIUM. Alpha is stopped by paper/skin, and Gamma requires thick lead or concrete to be significantly absorbed.'},
    {q:'The half-life of carbon-14 (used for dating) is 5730 years. If a fossil has 1/8 of the carbon-14 of a living sample, how old is it?',opts:['5730 years','11,460 years','17,190 years','22,920 years'],ans:2,exp:'1/8 = (1/2)³, meaning 3 half-lives have passed. 3 × 5730 = 17,190 years old. Scientists use this to date archaeological remains up to about 50,000 years old.'},
    {q:'In a nuclear fission reaction, the mass of the products is slightly less than the mass of the reactants. The "missing" mass:',opts:['Is destroyed','Has been converted into energy (E = mc²)','Has turned into neutrons','Is lost to the environment'],ans:1,exp:'Einstein\'s famous equation E=mc² explains the energy released in fission. The "lost" mass (mass defect) is CONVERTED directly into LARGE amounts of energy. The binding energy released is what powers reactors.'},
    {q:'Neutron radiation has the ability to:',opts:['Ionise atoms very strongly','Penetrate lead easily','Induce fission in certain nuclei like U-235','Be easily deflected by electric fields'],ans:2,exp:'Neutrons have NO charge, so they are not deflected by electric or magnetic fields. They are particularly dangerous because they can be absorbed by nuclei, causing them to become unstable or trigger fission (as in U-235).'},
    {q:'Alpha particles cannot penetrate human skin. Why are they still dangerous if inhaled or ingested?',opts:['They emit gamma rays','They can ionise internal cells very heavily, causing DNA damage and cancer','They release large amounts of heat','They stay in the body forever'],ans:1,exp:'While alpha particles are stopped by the dead outer layer of skin, if an alpha-emitting source is INHALED or INGESTED, the particles are directly placed against living cells. Because they are highly ionising, they cause severe localised cell damage and increase cancer risk.'},
    {q:'Why is the storage of high-level radioactive waste a major challenge?',opts:['It is expensive and takes thousands of years to decay safely','It can be easily recycled','It emits alpha particles','It is biodegradable'],ans:0,exp:'High-level waste (e.g., spent fuel rods) remains dangerously radioactive for THOUSANDS OF YEARS (e.g., half-lives of thousands of years). It must be stored in secure, deep geological repositories, sealed from groundwater, and monitored for extremely long periods.'},
  ],
  match:[
    {term:'Alpha particle',def:'Helium nucleus (2 protons + 2 neutrons), charge +2, stopped by paper or skin'},
    {term:'Beta particle',def:'Fast-moving electron emitted from the nucleus, charge -1, stopped by aluminium'},
    {term:'Gamma ray',def:'High-energy electromagnetic wave, no charge, requires lead/concrete to absorb'},
    {term:'Half-life',def:'The time required for half the radioactive nuclei in a sample to decay'},
    {term:'Nuclear fission',def:'A large, unstable nucleus splits into two smaller nuclei, releasing neutrons and energy'},
    {term:'Nuclear fusion',def:'Two light nuclei combine to form a heavier nucleus, releasing enormous energy'},
    {term:'Ionisation',def:'The process of removing an electron from an atom, creating a positive ion'},
    {term:'Activity',def:'The number of decays per second in a radioactive sample; measured in Becquerels (Bq)'},
    {term:'Background radiation',def:'The low-level radiation present in the environment from natural and artificial sources'},
    {term:'Chain reaction',def:'A self-sustaining sequence of nuclear fission reactions where released neutrons trigger more reactions'},
    {term:'Mass defect',def:'The difference between the total mass of the individual nucleons and the actual mass of the nucleus'},
    {term:'Tracer',def:'A radioactive isotope used to follow the path of a substance in a system (e.g., medical diagnosis)'},
    {term:'Radiotherapy',def:'The use of ionising radiation (e.g., gamma rays) to destroy cancer cells'},
    {term:'Shielding',def:'A physical barrier (lead, concrete) used to absorb radiation and protect people'},
    {term:'Geiger-Muller (GM) tube',def:'An instrument used to detect and measure ionising radiation'},
    {term:'Carbon-14 dating',def:'A method of determining the age of once-living materials using the decay of carbon-14'},
    {term:'Transmutation',def:'The change of one element into another through radioactive decay (e.g., neutron → proton)'},
    {term:'Radon gas',def:'A naturally occurring radioactive gas that seeps from rocks and soil, contributing to background radiation'},
    {term:'Nuclear reactor',def:'A device that initiates and controls a sustained nuclear fission chain reaction'},
    {term:'Einstein\'s equation',def:'E = mc²; the equation that explains the conversion of mass into energy in nuclear reactions'},
  ],
  flashcards:[
    {q:'Compare the three types of nuclear radiation: Alpha, Beta, and Gamma.',a:'Alpha (α): +2 charge, mass 4, stopped by paper/skin, high ionisation. Beta (β): -1 charge, mass ~0, stopped by thin aluminium, medium ionisation. Gamma (γ): no charge, mass 0, requires thick lead/concrete, low ionisation (but high penetration).'},
    {q:'Define half-life and explain why it is a useful concept.',a:'HALF-LIFE (t½) is the time taken for HALF the radioactive nuclei in a sample to decay. It is CONSTANT for each isotope and unaffected by temperature, pressure, or chemical bonds. It is used in RADIOCARBON DATING (C-14, t½ = 5730 years) and in medicine to choose tracers.'},
    {q:'What is a chain reaction in nuclear fission?',a:'U-235 + neutron → fission products + 2-3 neutrons + energy. The released neutrons can cause further fissions in neighbouring U-235 nuclei. If CONTROLLED (moderated by graphite/water and controlled by control rods), it sustains a steady output in a reactor. If UNCONTROLLED, a massive explosion occurs (atomic bomb).'},
    {q:'State TWO uses of radioactive isotopes in medicine and industry.',a:'1. Medicine: Radioactive tracers (e.g., Technetium-99m) to image organs. 2. Medicine: Radiotherapy (Co-60) to kill cancerous tumours. 3. Industry: Smoke detectors (Am-241 emits alpha particles). 4. Sterilisation: Gamma rays used to sterilise medical equipment.'},
    {q:'What safety precautions must be taken when handling radioactive sources in a laboratory?',a:'1. Use tongs or forceps to keep the source at a DISTANCE. 2. Minimise EXPOSURE TIME. 3. Use SHIELDING (place sources in lead-lined containers). 4. Never point the source at a person. 5. Wash hands thoroughly after handling. 6. Wear a radiation dosimeter badge.'},
    {q:'Why is nuclear fusion difficult to achieve on Earth?',a:'Fusion requires EXTREMELY HIGH TEMPERATURES (around 100 million °C) and immense pressure to overcome the electrostatic repulsion between positively charged nuclei. No solid material can withstand these temperatures, so it is confined using magnetic fields (tokamak) or lasers (inertial confinement). It remains experimental.'},
    {q:'Write the nuclear equation for the alpha decay of Radium-226 (Ra).',a:'²²⁶Ra₈₈ → ²²²Rn₈₆ + ⁴He₂. Radium emits an alpha particle (²⁴He) and becomes Radon. The mass number decreases by 4 (226→222), and the atomic number decreases by 2 (88→86).'},
    {q:'How does a smoke detector use a radioactive source?',a:'A smoke detector contains a small amount of AMERICIUM-241 (an alpha emitter). The alpha particles ionise the air between two electrodes, allowing a current to flow. When smoke enters the detector, it absorbs the alpha particles, reducing the ionisation. The drop in current triggers the alarm.'},
    {q:'Explain the meaning of the term "ionising radiation".',a:'Ionising radiation is radiation with enough energy to REMOVE electrons from atoms or molecules, creating ions. Alpha, Beta, and Gamma are all ionising. Alpha is the most ionising, and Gamma is the least. Ionisation can damage living cells and DNA.'},
    {q:'Why are gamma rays used in cancer treatment (radiotherapy) rather than alpha or beta?',a:'Gamma rays are highly PENETRATING. This allows them to pass through healthy tissue and reach deep-seated tumours. They can be focused to deliver a high dose to cancer cells while minimising damage to surrounding healthy tissue. Alpha and beta would be absorbed by the skin or before reaching the tumour.'},
    {q:'Describe the process of nuclear fission.',a:'A slow-moving neutron is captured by a large, unstable nucleus like Uranium-235 (U-235). The nucleus becomes highly unstable and splits into TWO smaller daughter nuclei (e.g., Barium and Krypton), releasing 2-3 more neutrons and a huge amount of energy (E=mc²).'},
    {q:'What is a nuclear moderator, and what does it do in a fission reactor?',a:'A MODERATOR (e.g., graphite rods or water) slows down the fast-moving neutrons released in fission. It does this through elastic collisions. Slower (thermal) neutrons are much more likely to be captured by U-235 nuclei, sustaining the chain reaction.'},
    {q:'Explain why the atomic number of a nucleus increases by 1 during beta decay.',a:'In beta-minus (β⁻) decay, a neutron inside the nucleus transforms into a PROTON and an ELECTRON. The electron is emitted as the beta particle. Since the number of protons increases by 1, the element moves one position up the periodic table (transmutation).'},
    {q:'Define "activity" and give its SI unit.',a:'Activity (A) is the rate at which a radioactive sample decays. It is defined as the number of decays per second. The SI unit is the BECQUEREL (Bq). 1 Bq = 1 decay per second. It is a very small unit, so activities are often measured in kBq (kilobecquerels) or MBq.'},
    {q:'What is the difference between nuclear fission and nuclear fusion in terms of fuel and products?',a:'FISSION uses a large, heavy fuel like Uranium-235 and splits it into two lighter nuclei. It produces highly radioactive waste. FUSION uses light fuels like Deuterium and Tritium and combines them to form Helium. Fusion produces much less radioactive waste and more energy per gram, but is very hard to control.'},
    {q:'How does the ionising power of a particle relate to its penetration depth?',a:'There is an INVERSE relationship: particles with HIGH ionising power (like alpha) have very LOW penetration depth (stopped by air/paper). Particles with LOW ionising power (like gamma) have very HIGH penetration depth (requires lead).'},
    {q:'State the two main sources of background radiation.',a:'1. NATURAL sources: Radon gas from rocks and soil, cosmic rays from outer space, food and drink (e.g., potassium-40), and building materials. 2. ARTIFICIAL sources: Medical X-rays, nuclear power plant discharges, and fallout from nuclear weapons tests (historical).'},
    {q:'Why is carbon-14 dating limited to objects less than about 50,000 years old?',a:'Carbon-14 has a half-life of 5730 years. After about 9 half-lives, only 1/512 of the original carbon-14 remains. This tiny amount is incredibly difficult to measure accurately. Beyond ~50,000 years, the remaining C-14 is too small for reliable dating.'},
    {q:'Describe the function of control rods in a nuclear reactor.',a:'Control rods (often made of Boron or Cadmium) are inserted into the reactor core to ABSORB NEUTRONS. By adjusting the depth of the control rods, operators can control the rate of the chain reaction. Lowering the rods reduces the neutron population, slowing down the reaction or shutting it off entirely.'},
    {q:'What is mass defect, and how does it relate to nuclear energy?',a:'When nucleons come together to form a nucleus, they lose some mass. This lost mass (mass defect) is converted into binding energy that holds the nucleus together. The relationship is given by E = mc². In fission/fusion, the mass defect between reactants and products is released as a large amount of energy.'},
  ],
  blanks:{
    passage:'Alpha particles are helium [_], consisting of 2 protons and 2 neutrons. Beta particles are fast-moving [_] emitted from the nucleus when a neutron changes into a proton. [_] radiation is an electromagnetic wave with the highest penetrating power, requiring thick lead to absorb it. The time it takes for half of the radioactive atoms in a sample to decay is called the [_]. The process of splitting a large nucleus to release energy is known as nuclear [_].',
    answers:['nuclei','electrons','Gamma','half-life','fission'],
    wordbank:['nuclei','electrons','Gamma','half-life','fission','protons','fusion','radiation'],
  },
  sentences:[
    {prompt:'A radioactive isotope has a half-life of 4 years and an initial activity of 800 Bq. Calculate its activity after 12 years.',keywords:['12 years','4 years','3 half-lives','1/8','100 Bq','half-life calculation'],hint:'First, determine how many half-lives have passed (12 ÷ 4 = 3). Then, apply the formula: Activity = Initial × (1/2)ⁿ.'},
    {prompt:'Explain why gamma radiation is used for treating deep cancers, whereas alpha radiation is used for treating surface skin cancers.',keywords:['gamma','penetrating','deep','tumour','alpha','ionising','skin','surface','damage'],hint:'Which type of radiation can reach a tumour inside the body without being stopped by skin? Why is alpha too dangerous to use internally?'},
    {prompt:'Describe the process of nuclear fission of Uranium-235, including how a chain reaction occurs.',keywords:['U-235','neutron','absorb','split','fission products','energy','neutrons released','chain reaction','control'],hint:'What starts the fission of a U-235 nucleus? What is released along with the energy? How do these released products cause a self-sustaining chain reaction?'},
    {prompt:'A sample of carbon-14 has an activity of 120 counts per minute. After 17,190 years (t½ = 5730 years), what is its activity?',keywords:['5730','17,190','3 half-lives','120','15 counts/min','decay'],hint:'Calculate the number of half-lives that have passed, then halve the activity that many times.'},
    {prompt:'Compare the ionising power and penetrating power of alpha, beta, and gamma radiation.',keywords:['alpha','high ionising','low penetrating','paper','beta','medium','aluminium','gamma','low ionising','high penetrating','lead'],hint:'List them from highest to lowest for both properties. Note the inverse relationship between ionising and penetrating power.'},
    {prompt:'Explain the process of beta-minus decay in terms of nuclear composition.',keywords:['beta-minus','neutron','proton','electron','atomic number','increase','transmutation'],hint:'What happens to a neutron in the nucleus? How does this affect the atomic number and the element?'},
    {prompt:'Why are radioisotopes with long half-lives problematic for waste disposal?',keywords:['long half-life','radioactive','waste','storage','thousands of years','dangerous','geological repository'],hint:'If a radioactive isotope has a half-life of 10,000 years, how long does it take for it to decay to a safe level?'},
    {prompt:'Describe how a nuclear fission power plant generates electricity.',keywords:['fission','heat','reactor','coolant','steam','turbine','generator','electricity'],hint:'Trace the energy from the nuclear reaction in the core to the rotation of the turbine.'},
    {prompt:'Explain why fusion reactions release more energy per unit mass than fission reactions.',keywords:['fusion','fission','energy','mass defect','E=mc²','binding energy'],hint:'Compare the mass defect per nucleon in fusion versus fission. Which transformation results in a greater percentage of mass being converted to energy?'},
    {prompt:'A radiation detector measures a count rate of 500 Bq. After 4 half-lives, what is the count rate?',keywords:['500 Bq','4 half-lives','(1/2)⁴','31.25 Bq','initial','decay'],hint:'The fraction remaining after n half-lives is (1/2)ⁿ. Multiply the initial count rate by this fraction.'},
    {prompt:'Explain the purpose of control rods and moderators in a nuclear reactor.',keywords:['control rods','absorb neutrons','moderator','slow down neutrons','sustain','chain reaction'],hint:'How do control rods allow operators to shut down the reactor? How does a moderator prevent the chain reaction from stopping?'},
    {prompt:'Write a balanced nuclear equation for the alpha decay of Polonium-210 (²¹⁰Po₈₄).',keywords:['²¹⁰Po₈₄','alpha decay','⁴He₂','²⁰⁶Pb₈₂','helium nucleus','conservation'],hint:'Remember that mass number decreases by 4 and atomic number decreases by 2. The product is Lead-206.'},
    {prompt:'Why do tracers used in medical imaging emit gamma rays instead of alpha or beta particles?',keywords:['gamma','penetrate','body','detect','outside','tracer','alpha','beta','absorbed'],hint:'Can alpha or beta particles escape from deep inside the body to reach a detector placed outside?'},
    {prompt:'Explain what is meant by "background radiation" and list two natural and two artificial sources.',keywords:['background','radiation','natural','radon','cosmic','artificial','X-ray','nuclear'],hint:'What is the constant low-level radiation we are all exposed to? Where does it come from?'},
    {prompt:'Describe how radioactive decay is a random and spontaneous process.',keywords:['random','spontaneous','unpredictable','statistical','half-life','probability'],hint:'Can we predict which specific nucleus will decay next? How do we predict the behaviour of a large sample of nuclei?'},
    {prompt:'Explain the physical difference between nuclear fission and nuclear fusion.',keywords:['fission','splitting','large nucleus','U-235','fusion','combining','small nuclei','helium','energy'],hint:'One process breaks a heavy atom apart. The other forces light atoms together. Which powers stars, and which powers current nuclear reactors?'},
    {prompt:'Calculate the fraction of a radioactive sample that remains after 5 half-lives.',keywords:['5 half-lives','(1/2)⁵','1/32','decay','remaining'],hint:'The general formula is (1/2)ⁿ where n is the number of half-lives.'},
    {prompt:'Why are ionising radiations dangerous to living organisms?',keywords:['ionise','atoms','DNA','damage','mutations','cancer','cells'],hint:'What happens when radiation strikes a molecule like DNA inside a living cell?'},
    {prompt:'Explain why the atomic number of an element increases by 2 during alpha decay.',keywords:['alpha decay','helium nucleus','2 protons','atomic number','lose 2','decrease','transmutation'],hint:'What is lost from the nucleus during alpha decay? How many protons are in an alpha particle?'},
    {prompt:'Describe the difference between controlled nuclear fission (in a reactor) and uncontrolled fission (in a bomb).',keywords:['controlled','moderator','control rods','rate','energy','steady','uncontrolled','explosive','chain reaction'],hint:'What mechanisms are used to keep the chain reaction from accelerating out of control in a reactor?'},
  ],
});
</script></body></html>
