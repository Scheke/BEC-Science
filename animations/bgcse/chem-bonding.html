new p5(sk=>{

  function drawIonic(){
    // Na loses electron → Na+; Cl gains → Cl-
    let na={x:100,y:180};let cl={x:380,y:180};
    // NaCl crystal lattice at bottom
    sk.fill(30,30,120);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('Ionic Bonding — NaCl (Sodium Chloride) Example',248,22);sk.textStyle(sk.NORMAL);
    // Na atom
    sk.fill(180,90,0,40);sk.stroke(180,90,0);sk.strokeWeight(2);sk.ellipse(na.x,na.y,80,80);
    sk.noFill();sk.stroke(180,90,0,100);sk.strokeWeight(1.5);sk.ellipse(na.x,na.y,110,110);
    // Na's electron
    let ea=tick*sk.TWO_PI;
    let ex=na.x+Math.cos(ea)*55,ey=na.y+Math.sin(ea)*55;
    sk.fill(30,80,200,220);sk.noStroke();sk.ellipse(ex,ey,11);
    sk.fill(180,90,0);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('Na',na.x,na.y+4);sk.textStyle(sk.NORMAL);
    sk.fill(80);sk.textSize(8.5);sk.textAlign(sk.CENTER);sk.text('11 protons\n11 electrons\n2,8,1',na.x,na.y+62);

    // Cl atom
    sk.fill(30,160,30,40);sk.stroke(30,160,30);sk.strokeWeight(2);sk.ellipse(cl.x,cl.y,80,80);
    sk.noFill();sk.stroke(30,160,30,100);sk.strokeWeight(1.5);sk.ellipse(cl.x,cl.y,110,110);
    sk.fill(30,160,30,180);sk.noStroke();
    for(let i=0;i<7;i++){let a2=i*sk.TWO_PI/7;sk.ellipse(cl.x+Math.cos(a2)*55,cl.y+Math.sin(a2)*55,11);}
    sk.fill(30,160,30);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('Cl',cl.x,cl.y+4);sk.textStyle(sk.NORMAL);
    sk.fill(80);sk.textSize(8.5);sk.text('17 protons\n17 electrons\n2,8,7',cl.x,cl.y+62);

    // Electron transfer arrow
    let arrowProgress=electronT;
    let arrowX=na.x+60+(cl.x-na.x-110)*arrowProgress,arrowY=na.y-40;
    sk.fill(30,80,200,220);sk.noStroke();sk.ellipse(arrowX,arrowY,11);
    sk.stroke(30,80,200,160);sk.strokeWeight(2);sk.setLineDash([5,4]);
    sk.line(na.x+60,na.y-20,cl.x-60,cl.y-20);sk.setLineDash([]);
    sk.noStroke();sk.fill(30,80,200);sk.textSize(9);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('e⁻ transferred',240,na.y-50);sk.textStyle(sk.NORMAL);

    // Ion labels
    sk.fill(180,90,0);sk.textSize(13);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('Na⁺',na.x,na.y-70);sk.textStyle(sk.NORMAL);
    sk.fill(80);sk.textSize(9);sk.text('(loses 1e⁻)',na.x,na.y-58);
    sk.fill(30,160,30);sk.textSize(13);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('Cl⁻',cl.x,cl.y-70);sk.textStyle(sk.NORMAL);
    sk.fill(80);sk.textSize(9);sk.text('(gains 1e⁻)',cl.x,cl.y-58);

    // Crystal lattice

    sk.fill(30);sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);
    sk.text('NaCl Crystal Lattice (ionic lattice):',lx,ly-12);sk.textStyle(sk.NORMAL);

  function drawCovalent(){
    sk.fill(30,80,160);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('Covalent Bonding — Sharing Electron Pairs',248,22);sk.textStyle(sk.NORMAL);

  function drawAtom(x,y,r,sym,ve,col){
    sk.fill(col[0],col[1],col[2],50);sk.stroke(col[0],col[1],col[2]);sk.strokeWeight(1.5);sk.ellipse(x,y,r*2,r*2);
    sk.noStroke();sk.fill(col[0],col[1],col[2]);sk.textSize(r*0.65);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);sk.text(sym,x,y+r*0.28);sk.textStyle(sk.NORMAL);
  }

  function drawMetallic(){
    // Sea of electrons model
    sk.fill(100,60,0);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('Metallic Bonding — Sea of Delocalised Electrons',248,22);sk.textStyle(sk.NORMAL);
    // Grid of + ions
    let gx=30,gy=70,cs=56;let rows=5,cols=8;
    for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){
      let x2=gx+c*cs,y2=gy+r*cs;
      sk.fill(220,160,60,200);sk.stroke(160,100,0);sk.strokeWeight(2);sk.ellipse(x2,y2,36);
      sk.noStroke();sk.fill(120,60,0);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);sk.text('M⁺',x2,y2+4);sk.textStyle(sk.NORMAL);
    }}
    lbl('Metal cations\n(positive ions\nin fixed lattice)',gx-14,gy+rows*cs/2,[150,80,0]);
    // Floating electrons
    for(let i=0;i<28;i++){
      let ex=gx+10+(tick*0.5+i*0.7)%(cols*cs-20);
      let ey=gy+10+(i*37+tick*0.3)%(rows*cs-20);
      sk.fill(30,80,200,200);sk.noStroke();sk.ellipse(ex,ey,9);
    }
    lbl('Free/delocalised electrons\n(sea of electrons)',220,gy+rows*cs+20,[30,80,200]);
    // Arrows for conduction
    sk.stroke(30,80,200,180);sk.strokeWeight(2);
    sk.line(30,gy+rows*cs+45,430,gy+rows*cs+45);
    sk.noStroke();sk.fill(30,80,200,200);sk.triangle(430,gy+rows*cs+40,430,gy+rows*cs+50,442,gy+rows*cs+45);
    sk.fill(0,60,160);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('Electrons flow freely → electrical conduction',248,gy+rows*cs+62);sk.textStyle(sk.NORMAL);
    // Properties box
    let py=390;
    sk.fill(255,245,220,220);sk.stroke(160,80,0,80);sk.strokeWeight(1);sk.rect(14,py,462,110,7);sk.noStroke();
    sk.fill(120,60,0);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);
    sk.text('METALLIC BONDING PROPERTIES:',20,py+14);sk.textStyle(sk.NORMAL);
    const props=[['High melting/boiling points','Strong electrostatic attraction between M⁺ ions and electron sea'],['Electrical conductivity','Delocalised electrons carry current freely'],['Thermal conductivity','Free electrons transfer kinetic energy'],['Malleability/Ductility','Layers of ions can slide without breaking bond'],['Lustre (shiny)','Free electrons reflect light']];
    props.forEach((p,i)=>{
      sk.fill(140,70,0);sk.textSize(9);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);sk.text(p[0]+':',20,py+30+i*16);
      sk.fill(30);sk.textStyle(sk.NORMAL);sk.textSize(9);sk.text(p[1],140,py+30+i*16);
    });
  }

  function lbl(txt,x,y,col){
    sk.fill(col[0],col[1],col[2]);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    txt.split('\n').forEach((l,i)=>sk.text(l,x,y+i*13));sk.textStyle(sk.NORMAL);
  }

  function drawComparison(){
    sk.fill(60,0,120);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('Comparison of Bond Types',248,22);sk.textStyle(sk.NORMAL);
    const rows=[
      ['Property','Ionic','Covalent\n(simple)','Covalent\n(giant)','Metallic'],
      ['Particles','Na⁺ and Cl⁻','Molecules','Giant lattice','M⁺ + e⁻ sea'],
      ['Bonding force','Electrostatic\n(+ and − ions)','Shared e⁻\npair','Shared e⁻','Attraction:\nM⁺ & e⁻'],
      ['Melting point','HIGH','LOW','VERY HIGH','HIGH'],
      ['Electrical cond.','Conducts when\nmolten/dissolved','Does NOT\nconduct','Does NOT\nconduct (except\ngraphite)','Always\nconducts'],
      ['Solubility','Often soluble\nin water','Often\ninsoluble','Insoluble','Insoluble'],
      ['Examples','NaCl, MgO\nCaCl₂','H₂O, CO₂\nHCl, NH₃','Diamond, SiO₂\nSilica','Na, Cu, Fe\nAl, Mg'],
    ];
    const colW=[100,82,82,82,82];const colX=[14,114,196,278,360];
    const colCols=[[60,0,120],[160,60,0],[30,80,200],[30,80,200],[100,60,0]];
    rows.forEach((row,ri)=>{
      let ry=46+ri*56;let rh=52;
      if(ri===0){sk.fill(60,0,120,200);sk.noStroke();sk.rect(14,ry-2,448,rh,6);
        row.forEach((cell,ci)=>{
          sk.fill(255);sk.textSize(9);sk.textStyle(sk.BOLD);sk.textAlign(ci===0?sk.LEFT:sk.CENTER);
          cell.split('\n').forEach((l,li)=>sk.text(l,ci===0?colX[ci]+4:colX[ci]+colW[ci]/2,ry+14+li*11));sk.textStyle(sk.NORMAL);
        });
      } else {
        if(ri%2===0){sk.fill(240,235,255,180);sk.noStroke();sk.rect(14,ry-2,448,rh,4);}
        row.forEach((cell,ci)=>{
          let cc=colCols[ci];
          sk.fill(cc[0],cc[1],cc[2]);sk.textSize(8.5);sk.textStyle(ci===0?sk.BOLD:sk.NORMAL);sk.textAlign(ci===0?sk.LEFT:sk.CENTER);
          cell.split('\n').forEach((l,li)=>sk.text(l,ci===0?colX[ci]+4:colX[ci]+colW[ci]/2,ry+12+li*11));sk.textStyle(sk.NORMAL);
        });
      }
    });
  }

  function drawInfoPanel(){
    let px=498,py=8,pw=374,ph=494;let c=[80,0,140];
    sk.fill(255,255,255,240);sk.stroke(c[0],c[1],c[2]);sk.strokeWeight(2.5);
    sk.rect(px,py,pw,ph,10);sk.noStroke();
    sk.fill(c[0],c[1],c[2],210);sk.rect(px+8,py+8,pw-16,34,7);
    sk.fill(255);sk.textSize(13);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    const titles=['Ionic Bonding','Covalent Bonding','Metallic Bonding','Comparison'];
    sk.text(titles[tab],px+pw/2,py+30);sk.textStyle(sk.NORMAL);
    let sy=py+52;
    const allBoxes=[
      [{t:'What is Ionic Bonding?',b:'Transfer of electrons from metal to non-metal.\nForms oppositely charged ions (cations + anions).\nElectrostatic attraction between ions.'},{t:'Formation',b:'Metal loses electrons → cation (+).\nNon-metal gains electrons → anion (−).\nAtoms achieve full outer shell (noble gas config).'},{t:'Ionic Lattice',b:'Ions arranged in regular 3D giant lattice.\nEach ion surrounded by opposite-charge ions.\nVery strong forces → high melting point.'},{t:'Electrical Conductivity',b:'Solid: ions fixed, cannot move → no conduction.\nMolten or dissolved: ions free to move → conducts.\nThis is why NaCl doesn\'t conduct when solid.'}],
      [{t:'What is Covalent Bonding?',b:'SHARING of electron pairs between non-metals.\nEach atom contributes one electron per bond.\nBoth atoms achieve full outer shell.'},{t:'Bond Types',b:'Single bond: 1 shared pair (e.g. H-H, H-Cl).\nDouble bond: 2 shared pairs (e.g. O=O, CO₂).\nTriple bond: 3 shared pairs (e.g. N≡N).'},{t:'Lone Pairs',b:'Electrons not involved in bonding.\nStill present on atom in molecule.\nAffect shape of molecule (e.g. H₂O bent).'},{t:'Giant Covalent',b:'Millions of atoms bonded in large network.\nDiamond: each C bonded to 4 C → very hard.\nSilica (SiO₂): similar structure, high MP.'}],
      [{t:'What is Metallic Bonding?',b:'Metal atoms lose outer electrons → M⁺ ions.\nElectrons form a "sea" of delocalised electrons.\nAttraction between M⁺ ions and electron sea.'},{t:'Why Metals Conduct',b:'Delocalised electrons move freely under voltage.\nNo fixed structure to electrons → good conductor.\nBetter conductor = more free electrons.'},{t:'Why Metals are Malleable',b:'Layers of positive ions can slide past each other.\nElectron sea holds them together throughout.\nThis makes metals bendable without breaking.'},{t:'Alloys',b:'Mixture of metals (or metal + non-metal).\nDifferent-sized atoms disrupt regular layers.\nHarder and stronger than pure metals (e.g. steel).'}],
      [{t:'Choosing Bond Type',b:'Metal + non-metal → ionic bonding.\nNon-metal + non-metal → covalent bonding.\nMetal atoms only → metallic bonding.'},{t:'Structure-Property Link',b:'Bond type determines structure → determines properties.\nIonic: giant lattice → high MP, brittle.\nCovalent simple: separate molecules → low MP.'},{t:'Testing Bond Type',b:'Dissolves in water & conducts → ionic.\nLow MP, doesn\'t conduct → simple covalent.\nConducts electricity → metallic or dissolved ionic.'},{t:'Intermolecular Forces',b:'Forces BETWEEN molecules (not within bonds).\nWeaker than covalent/ionic bonds.\nDeterminate BP of simple molecular substances.'}],
    ];
    allBoxes[tab].forEach(box=>{
      let lines=box.b.split('\n');let bh=16+lines.length*14+8;
      sk.fill(c[0],c[1],c[2],18);sk.stroke(c[0],c[1],c[2],60);sk.strokeWeight(1);
      sk.rect(px+10,sy,pw-20,bh,6);sk.noStroke();
      sk.fill(c[0],c[1],c[2]);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);
      sk.text(box.t,px+16,sy+13);sk.textStyle(sk.NORMAL);
      sk.fill(30);sk.textSize(10.5);lines.forEach((l,i)=>sk.text(l,px+16,sy+27+i*14));
      sy+=bh+10;
    });
  }
  sk.mouseClicked=()=>{ if(bondMcq){ bondMcqClick(sk.mouseX,sk.mouseY); } };
  sk.setLineDash=a=>sk.drawingContext.setLineDash(a);
});
</script>
