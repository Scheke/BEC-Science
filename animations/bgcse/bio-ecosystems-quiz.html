<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ecosystems Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Ecosystems — BGCSE Biology Quiz',
  color:'#2e7d32',dark:'#1b5e20',light:'#e8f5e9',
    
  mcq:[
    {q:'What is the main source of energy for almost all ecosystems on Earth?',opts:['The wind','The sun','Volcanoes','The moon'],ans:1,exp:'The SUN is the primary source of energy for nearly all ecosystems. Plants (producers) capture this light energy through photosynthesis to make food, which then passes through the food chain.'},
    {q:'Which of the following is a living (biotic) component of a habitat?',opts:['Soil','Rocks','A tree','Water'],ans:2,exp:'Living components are called BIOTIC factors. A tree is a living organism. Soil, rocks, and water are non-living (ABIOTIC) components that support the habitat.'},
    {q:'A food chain always starts with:',opts:['A carnivore','A consumer','A decomposer','A producer'],ans:3,exp:'All food chains start with a PRODUCER. Producers (green plants) make their own food using sunlight. They are eaten by consumers.'},
    {q:'In the food chain "Grass → Grasshopper → Frog → Snake", what is the frog?',opts:['A producer','A primary consumer','A secondary consumer','A decomposer'],ans:2,exp:'The frog eats the grasshopper (primary consumer). Therefore, the frog is a SECONDARY consumer (carnivore), situated on the third trophic level.'},
    {q:'What do decomposers (such as bacteria and fungi) do in an ecosystem?',opts:['They make their own food','They eat large animals','They break down dead organisms','They chase away predators'],ans:2,exp:'DECOMPOSERS break down dead plants and animals. This is very important because it returns valuable nutrients back into the soil for plants to use again.'},
    {q:'A habitat is BEST defined as:',opts:['A group of the same species living together','The natural place where an organism lives','The job of an organism in an ecosystem','A large community of organisms'],ans:1,exp:'A HABITAT is the specific natural environment or place where a plant or animal lives. For example, a fish\'s habitat is water; a lion\'s habitat is the grassland.'},
    {q:'Which of the following animals is a herbivore?',opts:['Lion','Zebra','Snake','Eagle'],ans:1,exp:'A HERBIVORE eats only plants. A zebra feeds on grass. The other options are carnivores (meat-eaters).'},
    {q:'What is a "consumer" in a food chain?',opts:['An organism that makes its own food','An organism that eats other organisms','A non-living thing in the environment','A plant that grows in the sun'],ans:1,exp:'CONSUMERS cannot make their own food. They must eat other organisms (plants or animals) to get the energy they need to survive.'},
    {q:'If a plant dies and falls to the ground, what will happen to it?',opts:['It will stay there forever','It will be eaten by a lion','Decomposers will break it down','It will turn into a rock'],ans:2,exp:'When a plant dies, DECOMPOSERS (like fungi, bacteria, and worms) break down the dead matter. They recycle the nutrients back into the soil.'},
    {q:'In a food web, the arrows represent:',opts:['The direction of movement','The direction of energy flow','The size of the animal','The age of the animal'],ans:1,exp:'In food chains and webs, the ARROWS show the direction of ENERGY FLOW. They point from the organism being eaten to the organism that eats it (e.g., Grass → Rabbit means energy flows from grass to rabbit).'},
    {q:'Which of these is an example of a carnivore?',opts:['Cow','Rabbit','Cheetah','Giraffe'],ans:2,exp:'A CARNIVORE is an animal that eats only meat. The cheetah hunts and eats other animals. Cows, rabbits, and giraffes are herbivores.'},
    {q:'Why are plants called "producers"?',opts:['Because they produce oxygen and food','Because they produce baby animals','Because they produce soil','Because they produce water'],ans:0,exp:'Plants are called PRODUCERS because they produce their own food (glucose/sugar) using sunlight, water, and carbon dioxide through photosynthesis. They also produce oxygen as a byproduct.'},
    {q:'What is an abiotic factor in a river habitat?',opts:['Fish','Water lilies','Water','Frogs'],ans:2,exp:'ABIOTIC factors are the non-living parts of a habitat. Water is non-living. Fish, water lilies, and frogs are living (biotic) factors.'},
    {q:'If a farmer kills all the snakes in his field, what is the most likely effect on the rats?',opts:['Rats will disappear','Rats will increase in number','Rats will turn into snakes','Rats will stop eating'],ans:1,exp:'If snakes (predators) are removed, rats (prey) will have fewer enemies. The rat population will increase rapidly, which is harmful because rats will eat too much of the farmer\'s crops.'},
    {q:'What is a community in ecology?',opts:['All the different species living in a habitat','All the non-living things in an area','A single family of animals','The weather in a habitat'],ans:0,exp:'A COMMUNITY is made up of all the different populations (various species) of plants and animals living and interacting together in a specific habitat.'},
    {q:'Which of the following is a food chain?',opts:['Sun → Water → Soil','Apple tree → Caterpillar → Bird','Bird → Caterpillar → Apple tree','Grass → Sun → Rabbit'],ans:1,exp:'A correct food chain always starts with a producer (plant) and shows energy flowing upwards (e.g., Apple tree (producer) → Caterpillar (primary consumer) → Bird (secondary consumer)).'},
    {q:'An omnivore eats:',opts:['Only meat','Only plants','Both plants and animals','Only dead things'],ans:2,exp:'An OMNIVORE is an animal that eats both plants and animals. Humans, pigs, and bears are common examples of omnivores.'},
    {q:'What is the function of chlorophyll in plants?',opts:['It makes the plant waterproof','It absorbs sunlight for photosynthesis','It helps the plant float','It protects the plant from animals'],ans:1,exp:'CHLOROPHYLL is the green pigment inside plant leaves. Its main job is to absorb light energy from the sun, which drives the process of photosynthesis.'},
    {q:'If a population of rabbits suddenly declines, which organism will be most affected first?',opts:['The grass','The fox','The snake','The bacteria'],ans:1,exp:'Rabbits are the prey for foxes. If rabbits decline, foxes will run out of food and their population will drop rapidly. The grass will grow more because fewer rabbits are eating it.'},
    {q:'Decomposers are important because they:',opts:['Make food for large animals','Recycle nutrients back into the soil','Produce oxygen for the air','Eat up all the plants'],ans:1,exp:'Decomposers act as nature\'s recyclers. By breaking down dead matter, they release vital nutrients (like nitrogen and phosphorus) back into the soil so that new plants can grow healthy.'},
  ],
  match:[
    {term:'Producer',def:'An organism that makes its own food using sunlight (e.g., plants)'},
    {term:'Consumer',def:'An organism that eats other organisms to get energy'},
    {term:'Decomposer',def:'An organism that breaks down dead plants and animals, returning nutrients to the soil'},
    {term:'Herbivore',def:'An animal that eats only plants'},
    {term:'Carnivore',def:'An animal that eats only other animals'},
    {term:'Omnivore',def:'An animal that eats both plants and other animals'},
    {term:'Biotic factors',def:'The living parts of an environment (plants, animals, bacteria)'},
    {term:'Abiotic factors',def:'The non-living parts of an environment (water, sun, soil, temperature)'},
    {term:'Habitat',def:'The natural place or environment where a plant or animal lives'},
    {term:'Niche',def:'The role or "job" of an organism within its habitat'},
    {term:'Food chain',def:'A simple linear diagram showing who eats what and the flow of energy'},
    {term:'Food web',def:'A complex network showing interconnected food chains in an ecosystem'},
    {term:'Population',def:'A group of organisms of the same species living in a specific area'},
    {term:'Community',def:'All the different populations of species living together in a habitat'},
    {term:'Ecosystem',def:'The community of living organisms and the non-living environment they interact with'},
    {term:'Photosynthesis',def:'The process by which green plants use sunlight to make their own food'},
    {term:'Predator',def:'An animal that hunts and eats other animals'},
    {term:'Prey',def:'An animal that is hunted and eaten by another animal'},
    {term:'Chlorophyll',def:'The green pigment inside plant leaves that absorbs sunlight'},
    {term:'Nutrients',def:'Minerals in the soil (like nitrates and phosphates) that plants need to grow'},
  ],
  flashcards:[
    {q:'What is the difference between a habitat and a niche?',a:'A HABITAT is the physical place where an organism lives (e.g., a pond). A NICHE is the specific "job" or role the organism plays in that habitat (e.g., the pond snail feeds on algae and provides food for fish).'},
    {q:'What is a food chain? Give an example from a grassland.',a:'A food chain is a simple diagram showing "who eats what" in an ecosystem. Example: Grass → Rabbit → Fox. The arrows show the direction of energy flow (energy moves from the grass to the rabbit to the fox).'},
    {q:'Why are decomposers important for the environment?',a:'Decomposers (like earthworms, fungi, and bacteria) act as nature\'s recyclers. They break down dead matter and release essential minerals (like nitrogen and phosphorus) back into the soil so that new plants can grow.'},
    {q:'If all the frogs in a wetland ecosystem were suddenly removed, what might happen?',a:'If frogs are removed, the population of insects (their food) would increase rapidly. Then, the animals that eat the frogs (like snakes) would lose their food source and their population would decrease, disrupting the natural balance of the habitat.'},
    {q:'What is an adaptation? Give an example.',a:'An ADAPTATION is a special feature or behavior that helps an organism survive in its habitat. Example: A camel has humps to store fat and long eyelashes to keep out sand, helping it survive in the hot desert.'},
    {q:'What is the difference between a food chain and a food web?',a:'A FOOD CHAIN is a single, straight line showing energy flow (A eats B eats C). A FOOD WEB is a more realistic, complex diagram showing several interconnected food chains because most animals eat a variety of foods.'},
    {q:'Why is sunlight essential for an ecosystem?',a:'Sunlight is the primary energy source. Without sunlight, plants cannot perform photosynthesis to make food. If plants die, consumers have no food and the entire ecosystem would collapse.'},
    {q:'What is the difference between a predator and a prey?',a:'A PREDATOR is an animal that hunts and eats other animals. A PREY is the animal that is hunted and eaten. For example, a lion (predator) hunts a zebra (prey).'},
    {q:'What happens to energy as it moves up a food chain?',a:'Energy decreases or is lost at each step. Plants use most of the sun\'s energy for their own growth. When an animal eats the plant, only a small fraction of that original energy is passed on to the animal.'},
    {q:'What is a population in ecology?',a:'A POPULATION is a group of organisms of the exact same species living in a specific area. For example, all the zebras living together in a national park make up a zebra population.'},
    {q:'Give an example of how the food chain is affected by human activity.',a:'If humans cut down a forest (deforestation), the plants (producers) disappear. Animals that eat the plants lose their food, and predators that eat those animals lose their food, causing the whole food web to collapse.'},
    {q:'What is a biotic factor? Give three examples.',a:'Biotic factors are the living parts of an ecosystem. Examples include: 1) Plants (like trees and grass), 2) Animals (like lions and rabbits), and 3) Microorganisms (like bacteria and fungi).'},
    {q:'What is an abiotic factor? Give three examples.',a:'Abiotic factors are the non-living parts of an ecosystem. Examples include: 1) Water, 2) Temperature/Sunlight, and 3) Soil and rocks.'},
    {q:'How does a herbivore differ from a carnivore in terms of diet?',a:'A HERBIVORE eats only plant matter (e.g., cows, rabbits). A CARNIVORE eats only the meat of other animals (e.g., lions, eagles).'},
    {q:'Explain what would happen if all the decomposers in a forest died.',a:'If decomposers died, dead leaves and animal bodies would pile up. Nutrients would not be returned to the soil, making it infertile. New plants would not grow, eventually causing the whole forest to die.'},
    {q:'What is an omnivore? Give an example.',a:'An OMNIVORE is an animal that eats both plant material and animal meat. Examples include humans, pigs, and bears.'},
    {q:'Why are there fewer top carnivores than producers in an ecosystem?',a:'Because energy is lost at every stage of a food chain, there is less energy available for animals at the top. Therefore, the ecosystem can only support a small number of large carnivores compared to a huge number of plants.'},
    {q:'What is the role of chlorophyll in a plant?',a:'CHLOROPHYLL is the green pigment inside the plant\'s leaves. It captures light energy from the sun to power the process of photosynthesis, turning water and carbon dioxide into food (glucose) and oxygen.'},
    {q:'What is the relationship between a plant and an animal in a food chain?',a:'The relationship is one of energy transfer. The plant produces food (energy) through photosynthesis. The animal (consumer) eats the plant to acquire that energy for its own survival.'},
    {q:'How do plants obtain the nutrients they need from the soil?',a:'Plants absorb dissolved mineral nutrients (like nitrates and phosphates) from the soil through their roots. These nutrients are essential for healthy growth and are cycled back into the soil by decomposers.'},
  ],
  blanks:{
    passage:'A group of different species living together in a place is called a [_]. All the living and non-living things interacting in an area form an [_]. The role an organism plays in its habitat is its [_]. Animals that only eat plants are called [_]. Animals that only eat other animals are called [_]. A diagram showing who eats what in a straight line is a [_], while a more complex network is a [_].',
    answers:['community','ecosystem','niche','herbivores','carnivores','food chain','food web'],
    wordbank:['community','ecosystem','niche','herbivores','carnivores','food chain','food web','producer','decomposer','energy'],
  },
  sentences:[
    {prompt:'Describe the journey of energy from the sun to a frog.',keywords:['sun','producer','plant','grasshopper','consumer','frog','energy'],hint:'Think about who eats whom to get the energy.'},
    {prompt:'Explain what would happen to a garden ecosystem if all the earthworms and bacteria were killed by a chemical.',keywords:['decomposers','dead matter','nutrients','soil','plants','die'],hint:'What job do worms and bacteria do for the soil?'},
    {prompt:'Give one way that a polar bear is adapted to live in cold, icy habitats.',keywords:['adaptation','fur','blubber','white','camouflage','heat'],hint:'Think about its body features that keep it warm or hidden.'},
    {prompt:'Why is it important to have a variety of plants (biodiversity) in a forest ecosystem?',keywords:['biodiversity','food','habitat','oxygen','stable','plants'],hint:'What do plants provide for animals?'},
    {prompt:'Explain how the removal of a top predator can harm an ecosystem.',keywords:['predator','prey','population','increase','overgrazing','collapse'],hint:'What happens to the animals that the predator used to eat?'},
    {prompt:'What is the difference between a habitat and an ecosystem?',keywords:['habitat','place','ecosystem','living','non-living','community'],hint:'One is just a place to live, the other includes interactions between life and the environment.'},
    {prompt:'Explain why grass is essential for a herbivore like a rabbit.',keywords:['grass','energy','producer','photosynthesis','food','herbivore'],hint:'How does the rabbit get its energy to live?'},
    {prompt:'Describe the process of photosynthesis in simple terms.',keywords:['sunlight','carbon dioxide','water','glucose','oxygen','chlorophyll'],hint:'What does a plant need to make its food, and what does it release?'},
    {prompt:'Why is a food web considered more realistic than a food chain?',keywords:['food web','multiple','connected','eats','variety','realistic'],hint:'Do animals only eat one type of food in the wild?'},
    {prompt:'Explain what a niche is and give an example.',keywords:['niche','role','job','habitat','example','function'],hint:'Think about what an organism "does" in its home.'},
    {prompt:'How does deforestation affect the local ecosystem and biodiversity?',keywords:['deforestation','habitat','loss','biodiversity','soil','erosion'],hint:'What happens to animals when their homes are cut down?'},
    {prompt:'Explain the role of the sun in a pond ecosystem.',keywords:['sun','energy','plants','algae','food','photosynthesis'],hint:'What starts the food chain in the pond?'},
    {prompt:'Why are plants called producers and animals called consumers?',keywords:['producers','make','food','consumers','eat','energy'],hint:'Look at the words "produce" and "consume".'},
    {prompt:'Describe what would happen if the population of mice in a desert suddenly increased.',keywords:['mice','increase','snakes','food','population','balance'],hint:'What happens to the animals that eat the mice, and the plants the mice eat?'},
    {prompt:'Explain why soil fertility is important for plant growth.',keywords:['fertility','nutrients','soil','roots','growth','plants'],hint:'What do plants take out of the soil to get bigger?'},
    {prompt:'Give an example of a biotic factor and an abiotic factor interacting in a forest.',keywords:['biotic','tree','abiotic','sunlight','photosynthesis','grow'],hint:'How does a non-living thing help a living thing?'},
    {prompt:'Explain how decomposers help keep the ecosystem clean.',keywords:['decomposers','clean','dead','break down','waste','recycle'],hint:'What happens to dead leaves and bodies without them?'},
    {prompt:'Why can an ecosystem only support a small number of top carnivores?',keywords:['energy','lost','heat','carnivores','support','small number'],hint:'Is there a lot of energy left at the top of a food chain?'},
    {prompt:'Describe one way humans can positively help maintain an ecosystem.',keywords:['humans','protect','habitats','recycle','plant trees','conservation'],hint:'What actions can we take to help animals and plants?'},
    {prompt:'What is the difference between a primary consumer and a secondary consumer?',keywords:['primary','herbivore','plant','secondary','carnivore','meat'],hint:'What does the first consumer eat, and what does the second consumer eat?'},
  ],
});
</script></body></html>
