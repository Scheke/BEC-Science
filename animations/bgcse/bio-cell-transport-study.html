/* ═══════════════════════════════════════════════
   SHARED HELPERS for draw functions
═══════════════════════════════════════════════ */
function bg(sk, col){ sk.background(col || 20, 20, 35); }
function label(sk, txt, x, y, sz, col){
  sk.noStroke(); sk.fill(col || 255);
  sk.textSize(sz || 13); sk.textAlign(sk.CENTER, sk.CENTER);
  sk.text(txt, x, y);
}

/* ─── STEP 1 — Diffusion intro ─── */
const diffState = { particles: null, t: 0 };
function setupDiff(sk, st) {
  st.particles = [];
  for (let i = 0; i < 60; i++) {
    const side = i < 40 ? 'left' : 'right';
    st.particles.push({
      x : side === 'left' ? sk.random(30, sk.width/2 - 10) : sk.random(sk.width/2+10, sk.width-30),
      y : sk.random(40, sk.height-40),
      vx: sk.random(-1.2, 1.2),
      vy: sk.random(-1.2, 1.2),
      r : side === 'left' ? 7 : 6,
      col: side === 'left' ? [52,152,219] : [149,165,166],
    });
  }
  console.log(`[diffusion setup] Initialized with ${st.particles.length} particles`);
}
function drawDiff(sk, st) {
  if (!st.particles) return;
  bg(sk);
  st.t += 0.02;

  // Zone labels
  sk.noStroke(); sk.fill(52,152,219,80);
  sk.rect(0, 0, sk.width/2, sk.height);
  sk.fill(149,165,166,40);
  sk.rect(sk.width/2, 0, sk.width/2, sk.height);

  sk.fill(52,152,219); sk.textSize(11); sk.textStyle(sk.BOLD);
  sk.textAlign(sk.LEFT); sk.text('HIGH CONCENTRATION', 12, 20);
  sk.fill(180); sk.textAlign(sk.RIGHT);
  sk.text('LOW CONCENTRATION', sk.width-10, 20);
  sk.textStyle(sk.NORMAL);

  // Dashed divider
  sk.stroke(255,255,255,60); sk.strokeWeight(1);
  for (let y = 0; y < sk.height; y+=12) {
    if (Math.floor(y/12)%2===0) sk.line(sk.width/2, y, sk.width/2, y+8);
  }

  st.particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < p.r || p.x > sk.width-p.r)  p.vx *= -1;
    if (p.y < p.r || p.y > sk.height-p.r) p.vy *= -1;
    // Gradual drift toward right (net diffusion)
    if (p.col[0] > 100 && p.x < sk.width - 20) p.vx += 0.003;

    sk.noStroke(); sk.fill(...p.col, 210);
    sk.circle(p.x, p.y, p.r*2);
  });

  // Arrow showing direction
  sk.stroke(255,200,50,180); sk.strokeWeight(2.5); sk.fill(255,200,50,180);
  const ax = sk.width/2 + 30 + Math.sin(st.t*2)*10;
  sk.line(ax-18, sk.height/2, ax+18, sk.height/2);
  sk.triangle(ax+18, sk.height/2, ax+10, sk.height/2-5, ax+10, sk.height/2+5);
}

/* ─── STEP 2 — Osmosis ─── */
const osmState = { t: 0, waterLeft: 40, waterRight: 15 };
function drawOsm(sk, st) {
  bg(sk, [15,30,15]);
  st.t += 0.025;

  const mx = sk.width/2;

  // Chambers
  sk.noStroke(); sk.fill(0,100,160,90);
  sk.rect(0, 0, mx, sk.height);
  sk.fill(0,150,100,50);
  sk.rect(mx, 0, mx, sk.height);

  // Membrane
  sk.stroke(220,180,50); sk.strokeWeight(3);
  sk.line(mx, 0, mx, sk.height);
  // Pores (small gaps)
  sk.stroke(15,30,15); sk.strokeWeight(4);
  for (let y = 60; y < sk.height-40; y+=40) sk.line(mx-1, y, mx+1, y+18);

  // Labels
  sk.noStroke(); sk.fill(255); sk.textSize(10); sk.textStyle(sk.BOLD);
  sk.textAlign(sk.CENTER);
  sk.text('SALT SOLUTION\n(high solute)', mx/2, 22);
  sk.text('PURE WATER\n(low solute)', mx + mx/2, 22);

  // Water molecules (blue dots)
  const wCols = [[100,180,255],[80,160,235],[120,200,255]];
  for (let i = 0; i < 30; i++) {
    const ang = (i / 30) * sk.TWO_PI + st.t * 0.3;
    const side = i < 20 ? 0 : 1;
    const cx = side === 0 ? mx/2 + Math.sin(ang+i)*mx*0.38 : mx + mx/2 + Math.sin(ang+i+2)*mx*0.35;
    const cy = 40 + ((i*47 + st.t*22) % (sk.height-80));
    sk.fill(...wCols[i%3], 200); sk.circle(cx, cy, 9);
  }

  // Net movement arrow (right to left)
  sk.stroke(100,220,255,200); sk.strokeWeight(3); sk.fill(100,220,255,200);
  const ay = sk.height * 0.65 + Math.sin(st.t)*4;
  sk.line(mx+25, ay, mx-25, ay);
  sk.triangle(mx-25, ay, mx-15, ay-5, mx-15, ay+5);
  sk.noStroke(); sk.fill(100,220,255); sk.textSize(10);
  sk.textAlign(sk.CENTER);
  sk.text('Net water flow', mx, ay+18);

  // Membrane label
  sk.fill(220,180,50); sk.textSize(9);
  sk.textAlign(sk.LEFT);
  sk.text('Semi-permeable\nmembrane', mx+5, sk.height-30);
}

/* ─── STEP 3 — Active Transport ─── */
const atState = { t: 0, pumps: [
  { y: 0.3 }, { y: 0.65 }
]};
function drawAT(sk, st) {
  bg(sk, [20,10,30]);
  st.t += 0.03;

  const mx = sk.width/2;

  // Membrane (thick)
  sk.noStroke(); sk.fill(90,50,140,180);
  sk.rect(mx-14, 0, 28, sk.height);

  // Labels
  sk.fill(255); sk.textSize(10); sk.textStyle(sk.BOLD); sk.textAlign(sk.CENTER);
  sk.text('LOW\nCONC.', mx/2, 22);
  sk.text('HIGH\nCONC.', mx+mx/2, 22);

  // Protein pumps
  st.pumps.forEach(p => {
    const cy = p.y * sk.height;
    const phase = (st.t + p.y * 4) % sk.TWO_PI;
    const open  = Math.sin(phase) > 0;

    sk.fill(255,165,50); sk.noStroke();
    sk.ellipse(mx, cy, 26, 40);

    // Channel opening
    sk.fill(open ? [255,100,100] : [60,30,80]);
    sk.ellipse(mx, cy, 10, 20);

    // ATP label
    if (open) {
      sk.fill(255,220,50); sk.textSize(9); sk.textAlign(sk.CENTER);
      sk.text('ATP', mx, cy-26);
    }

    // Molecule being pumped
    const progress = (Math.sin(phase) + 1) / 2;
    const molX = sk.lerp(mx-50, mx+50, progress);
    sk.fill(100,220,120,200); sk.circle(molX, cy, 10);
  });

  // Gradient indicator
  for (let i = 0; i < 8; i++) {
    const x = mx + 30 + i * (mx*0.8/8);
    const alpha = 40 + i * 25;
    sk.fill(100,220,120, alpha); sk.noStroke();
    sk.circle(x, sk.height*0.88, 8);
  }

  // Arrow going AGAINST gradient
  sk.stroke(255,80,80,200); sk.strokeWeight(2.5); sk.fill(255,80,80,200);
  const ay = sk.height*0.78;
  sk.line(mx-30, ay, mx+30, ay);
  sk.triangle(mx+30, ay, mx+20, ay-5, mx+20, ay+5);
  sk.noStroke(); sk.fill(255,80,80); sk.textSize(9); sk.textAlign(sk.CENTER);
  sk.text('against gradient', mx, ay+14);

  sk.textStyle(sk.NORMAL);
}

/* ─── STEP 4 — Comparison diagram (static visual) ─── */
function drawCompare(sk) {
  bg(sk, [18,20,28]);
  const W = sk.width, H = sk.height;
  const cols = [
    [52,152,219],   // diffusion - blue
    [46,204,113],   // osmosis - green
    [231,76,60],    // active - red
  ];
  const labels = ['Diffusion','Osmosis','Active Transport'];
  const subs   = ['High → Low','Water: High → Low\n(water potential)','Low → High\n(needs ATP)'];
  const icons  = ['→','💧→','⚡ pump'];

  const bw = W/3;
  cols.forEach((c,i) => {
    const x = i * bw;

    sk.noStroke(); sk.fill(...c, 40);
    sk.rect(x, 0, bw, H);

    sk.fill(...c);
    sk.rect(x, H-4, bw, 4);

    // Icon area
    sk.fill(...c,180); sk.circle(x+bw/2, H*0.3, 60);
    sk.fill(255); sk.textSize(i===2?12:18); sk.textAlign(sk.CENTER,sk.CENTER);
    sk.text(icons[i], x+bw/2, H*0.3);

    // Title
    sk.fill(255); sk.textSize(13); sk.textStyle(sk.BOLD);
    sk.textAlign(sk.CENTER,sk.TOP);
    sk.text(labels[i], x+bw/2, H*0.54);

    // Sub
    sk.fill(200); sk.textSize(10); sk.textStyle(sk.NORMAL);
    sk.textAlign(sk.CENTER,sk.TOP);
    sk.text(subs[i], x+bw/2, H*0.65);

    // Divider
    if (i < 2) {
      sk.stroke(255,255,255,20); sk.strokeWeight(1);
      sk.line(x+bw, 0, x+bw, H);
    }
  });
}
