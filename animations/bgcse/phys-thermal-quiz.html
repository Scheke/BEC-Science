<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Thermal Physics Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Thermal Physics — BGCSE Physics Quiz',
  color:'#bf360c',dark:'#870000',light:'#fbe9e7',
    mcq:[
    {q:'Heat transfer through a vacuum occurs by:',opts:['Conduction','Convection','Radiation','All three equally'],ans:2,exp:'Only RADIATION can travel through a vacuum (as electromagnetic waves — infrared). Conduction and convection both need particles (a medium) to transfer energy.'},
    {q:'A thermometer works on the principle of:',opts:['Convection of mercury','Thermal expansion of a liquid','Radiation from a bulb','Conduction through glass'],ans:1,exp:'A thermometer measures temperature using the THERMAL EXPANSION of a liquid (mercury or coloured alcohol). As temperature rises, the liquid EXPANDS and rises up the narrow tube.'},
    {q:'The specific heat capacity of water is 4200 J/(kg·K). This means:',opts:['Water boils at 4200°C','4200 J heats 1kg of water by 1°C','Water has a mass of 4200 kg','4200 kg of water is needed to heat 1J'],ans:1,exp:'Specific heat capacity (c) is the energy needed to raise the temperature of 1 kg of a substance by 1°C (or 1K). For water, c = 4200 J/(kg·K) — water requires a lot of energy to heat up.'},
    {q:'Which surface is the best absorber of infrared radiation?',opts:['Shiny white','Shiny silver','Matt black','Matt white'],ans:2,exp:'MATT BLACK surfaces are the BEST absorbers (and emitters) of infrared radiation. Shiny/white surfaces are the poorest absorbers (best reflectors). This is why solar panels are black and vacuum flasks are silvered.'},
    {q:'Energy transferred = mass × specific heat capacity × temperature change. 2kg of iron (c=450) heated from 20°C to 70°C absorbs:',opts:['45,000 J','22,500 J','900 J','450 J'],ans:0,exp:'E = mcΔT = 2 × 450 × (70-20) = 2 × 450 × 50 = 45,000 J.'},
    {q:'Convection occurs because:',opts:['Hot fluids become denser and sink','Hot fluids become less dense and rise, cold fluids sink','All fluids are heated at the same rate','Particles in a fluid cannot move'],ans:1,exp:'CONVECTION: heating a fluid causes it to EXPAND → LESS DENSE → it RISES. Cooler, denser fluid sinks to replace it. This sets up a CONVECTION CURRENT. Convection only occurs in fluids (liquids and gases).'},
    {q:'Which method of heat transfer is primarily responsible for heating the Earth from the Sun?',opts:['Conduction','Convection','Radiation','Evaporation'],ans:2,exp:'The Sun\'s heat reaches the Earth through the vacuum of space via RADIATION (infrared and other electromagnetic waves). No medium is required, making it the only possible mechanism across the vast distance.'},
    {q:'A metal spoon in a hot cup of soup feels warm at the handle because of:',opts:['Radiation','Convection','Conduction','Expansion'],ans:2,exp:'Heat travels along the solid metal spoon by CONDUCTION. The particles in the heated end vibrate more and pass the vibration (kinetic energy) to neighbouring particles along the spoon towards the handle.'},
    {q:'Which surface is the best emitter of infrared radiation?',opts:['Shiny silver','Matt white','Matt black','Clear glass'],ans:2,exp:'MATT BLACK surfaces are the BEST emitters of infrared radiation. Shiny surfaces are poor emitters and good reflectors. This is why cooling fins on engines are often painted matt black.'},
    {q:'The reason for the difference in heating between land and sea (sea breeze) is:',opts:['Water has a higher specific heat capacity than land','Land has a higher specific heat capacity than water','Water reflects all radiation','Land absorbs no radiation'],ans:0,exp:'Water has a HIGHER specific heat capacity than land. It takes more energy to heat up water than it does to heat up land. During the day, land heats up faster, causing air above it to rise, drawing cooler air from the sea (sea breeze).'},
    {q:'Thermal expansion in a liquid-in-glass thermometer is dangerous because:',opts:['The liquid expands and breaks the glass','The glass expands at a different rate to the liquid','The glass does not expand','The liquid evaporates'],ans:1,exp:'If the liquid is heated, it expands more than the glass. If the thermometer is heated too quickly or beyond its range, the liquid expands faster than the glass tube can accommodate, causing the bulb to crack or explode.'},
    {q:'When a liquid is heated at the bottom of a container, the bottom layer:',opts:['Expands, becomes denser, and rises','Expands, becomes less dense, and rises','Contracts, becomes denser, and sinks','Remains unchanged'],ans:1,exp:'Heating the liquid causes it to EXPAND. This increases the volume but keeps the mass the same, so it becomes LESS DENSE. The less dense, hot liquid RISES, while the cooler, denser liquid sinks to take its place.'},
    {q:'A copper block has a mass of 0.5 kg and a specific heat capacity of 385 J/(kg·K). How much energy is required to heat it from 20°C to 60°C?',opts:['7,700 J','3,850 J','770 J','38,500 J'],ans:0,exp:'E = mcΔT = 0.5 × 385 × (60 - 20) = 0.5 × 385 × 40 = 7,700 J.'},
    {q:'Why do coastal regions have milder climates than inland regions?',opts:['The sea has a lower specific heat capacity','The sea has a higher specific heat capacity, absorbing and releasing heat slowly','The sea is deeper','Coastal regions are windier'],ans:1,exp:'Water has a very HIGH specific heat capacity (4200 J/(kg·K)). It absorbs a large amount of solar energy in summer without a large temperature rise, and releases that heat slowly in winter, keeping coastal temperatures moderate.'},
    {q:'In a vacuum flask, the vacuum between the inner and outer glass walls is designed to reduce heat transfer by:',opts:['Radiation only','Conduction and Convection','Convection and Radiation','Conduction only'],ans:1,exp:'The VACUUM removes the particles needed for CONDUCTION and CONVECTION. Since there is no medium, no collisions can occur, so these two mechanisms cannot transfer energy. The silvered walls primarily deal with radiation.'},
    {q:'If two objects of different temperatures are placed in contact, energy will flow from:',opts:['The object with more mass','The object with higher temperature','The object with higher specific heat capacity','The larger object'],ans:1,exp:'Heat energy ALWAYS flows from the object at a HIGHER TEMPERATURE to the object at a LOWER TEMPERATURE. This flow continues until they reach thermal equilibrium (equal temperature). It does not depend on mass or material.'},
    {q:'Why do bimetallic strips bend when heated?',opts:['One metal expands more than the other','Both metals expand equally','One metal contracts and the other expands','The metals melt at different temperatures'],ans:0,exp:'A bimetallic strip is made of two different metals with DIFFERENT rates of thermal expansion. When heated, one metal expands more than the other. This causes the strip to BEND towards the side of the metal that expands less.'},
    {q:'Which material is the best conductor of heat?',opts:['Air','Wood','Copper','Glass'],ans:2,exp:'Metals, especially COPPER and silver, are excellent conductors of heat because they have DELOCALISED (free) electrons that can move quickly and carry thermal energy through the lattice. Air, wood, and glass are thermal insulators.'},
    {q:'Forced convection is different from natural convection because:',opts:['It occurs in solids','It involves an external pump or fan to move the fluid','It only happens in vacuums','It does not transfer energy'],ans:1,exp:'NATURAL convection occurs due to density differences caused by heating (e.g., a radiator in a room). FORCED convection uses an external mechanical device (like a pump or fan) to circulate the fluid, increasing the rate of heat transfer.'},
    {q:'The amount of energy required to raise the temperature of 1 kg of water by 10°C (c=4200) is:',opts:['42,000 J','420 J','4,200 J','420,000 J'],ans:0,exp:'E = mcΔT = 1 kg × 4200 J/(kg·K) × 10°C = 42,000 J. Water requires a high amount of energy to change its temperature.'},
  ],
  match:[
    {term:'Conduction',def:'Heat transfer through solids via vibrating particles (kinetic energy transfer)'},
    {term:'Convection',def:'Heat transfer in fluids through the movement of the fluid itself (convection currents)'},
    {term:'Radiation',def:'Heat transfer via infrared electromagnetic waves; requires no medium (can occur in a vacuum)'},
    {term:'Specific heat capacity',def:'The amount of energy required to raise the temperature of 1 kg of a substance by 1°C (J/(kg·K))'},
    {term:'Thermal expansion',def:'The increase in volume or length of a material when its temperature is increased'},
    {term:'Matt black surface',def:'The best surface for absorbing and emitting infrared radiation'},
    {term:'Shiny silver surface',def:'The best surface for reflecting infrared radiation (poor absorber/emitter)'},
    {term:'Insulator',def:'A material that does not conduct heat well (e.g., wood, plastic, air)'},
    {term:'Conductor',def:'A material that conducts heat well (e.g., copper, silver, aluminium)'},
    {term:'Thermal equilibrium',def:'The state where two objects in contact reach the same temperature, and net heat transfer stops'},
    {term:'Infrared radiation',def:'Electromagnetic waves with a wavelength longer than visible light; responsible for thermal radiation'},
    {term:'Vacuum flask',def:'A container designed to minimise heat transfer using a vacuum and reflective silvered walls'},
    {term:'Bimetallic strip',def:'Two different metals joined together that bend when heated due to unequal thermal expansion; used in thermostats'},
    {term:'Convection current',def:'The circular flow of fluid caused by hot, less dense material rising and cool, denser material sinking'},
    {term:'Latent heat',def:'The energy required to change the state of a substance (e.g., melting or boiling) without changing its temperature'},
    {term:'Calorimeter',def:'An apparatus used to measure the heat energy released or absorbed during a physical or chemical change'},
    {term:'Thermometer',def:'An instrument that measures temperature using the thermal expansion of a liquid'},
    {term:'Greenhouse effect',def:'The trapping of infrared radiation by gases (like CO₂) in the atmosphere, leading to global warming'},
    {term:'Delocalised electrons',def:'Free-moving electrons in metals that are responsible for high thermal and electrical conductivity'},
    {term:'Temperature gradient',def:'The rate of change of temperature over a distance; drives heat flow'},
  ],
  flashcards:[
    {q:'State the formula for thermal energy (specific heat capacity).',a:'ΔE = mcΔT\nWhere: ΔE = Energy transferred (J), m = mass (kg), c = specific heat capacity (J/(kg·K)), ΔT = temperature change (°C or K).'},
    {q:'Why do metals feel colder than wood at the same room temperature?',a:'Metals are good CONDUCTORS of heat. When you touch a metal surface, it conducts heat energy AWAY from your hand rapidly, so your skin cools down and feels cold. Wood is an INSULATOR, so it conducts heat away very slowly and feels warm.'},
    {q:'Explain how a vacuum flask (Thermos) reduces heat loss.',a:'1. The VACUUM between the double walls prevents CONDUCTION and CONVECTION (no medium for particles to vibrate/move). 2. The SILVERED (shiny) walls REFLECT infrared radiation back towards the inner flask, reducing radiation loss. 3. The STOPER prevents convection through the opening.'},
    {q:'What is the difference between heat and temperature?',a:'TEMPERATURE is a measure of the average kinetic energy of the particles in a substance (measured in °C or K). HEAT (thermal energy) is the total amount of energy transferred from one object to another due to a temperature difference (measured in Joules). A large object at 30°C can contain more thermal energy than a small object at 80°C.'},
    {q:'Why does water have a high specific heat capacity?',a:'Water molecules are strongly attracted to each other by HYDROGEN BONDS. A large amount of energy is required to overcome these bonds and increase the kinetic energy (temperature) of the particles. This makes water a very effective coolant and heat store (e.g., in radiators and for climate regulation).'},
    {q:'How does a greenhouse trap heat?',a:'Glass (or greenhouse gases in the atmosphere) allows SHORT-WAVE solar radiation to pass through. This energy is absorbed by the surfaces inside, which then re-radiate the energy as LONG-WAVE INFRARED radiation. The glass/greenhouse gases ABSORB this outgoing infrared radiation and re-emit it back downwards, trapping the heat inside.'},
    {q:'Explain the mechanism of heat conduction in a metal rod.',a:'When one end of a metal rod is heated, the ions in that region gain kinetic energy and vibrate more vigorously. These vibrating ions collide with neighbouring ions, passing on the vibrational energy. Additionally, DELOCALISED (free) electrons in the metal move rapidly, carrying thermal energy quickly throughout the rod.'},
    {q:'Describe how a bimetallic strip works in a thermostat.',a:'A bimetallic strip is made of two metals with different coefficients of thermal expansion. When heated, one metal expands more than the other, causing the strip to BEND towards the metal with the smaller expansion. In a thermostat, this movement can break an electrical contact, switching off a heater.'},
    {q:'Why is water used as a coolant in car engines?',opts:['Water has a very HIGH specific heat capacity and is abundant, so it can absorb a lot of heat without a large temperature rise.'],hint:'What property allows water to absorb a large amount of heat energy while only rising a small amount in temperature?'},
    {q:'Explain the difference between natural and forced convection.',a:'NATURAL convection occurs due to density differences caused by heating, creating natural convection currents (e.g., warm air rising from a radiator). FORCED convection uses an external force like a pump or a fan to move the fluid, greatly increasing the rate of heat transfer (e.g., a cooling fan in a computer).'},
    {q:'State three differences between conduction and convection.',a:'1. CONDUCTION occurs in solids; CONVECTION occurs only in fluids (liquids and gases). 2. Conduction is transfer of vibrational energy; convection is transfer of the bulk movement of particles. 3. Conduction needs a medium; convection needs a medium and gravity.'},
    {q:'Calculate the energy required to heat 2 kg of ethanol from 20°C to 50°C. (c_ethanol = 2400 J/(kg·K))',a:'E = mcΔT = 2 kg × 2400 J/(kg·K) × (50 - 20)°C = 2 × 2400 × 30 = 144,000 J.'},
    {q:'What is the function of a calorimeter in an experiment?',a:'A calorimeter is a device used to measure the amount of heat energy absorbed or released during a physical or chemical change. It is usually insulated to minimise heat loss to the surroundings, allowing for accurate measurement of specific heat capacity or enthalpy changes.'},
    {q:'Explain why land heats up and cools down faster than water.',a:'Land has a much LOWER specific heat capacity (typically ~800-1000 J/(kg·K)) compared to water (4200 J/(kg·K)). This means land requires much less energy to raise its temperature by 1°C. As a result, land heats up faster during the day and cools down faster at night.'},
    {q:'How does a convection current form in a pan of water heated on a stove?',a:'The water at the bottom expands when heated, becoming LESS DENSE. It rises towards the surface. The cooler, denser water at the surface sinks to the bottom, displacing the hot water. This continuous cycle forms a convection current that heats the entire pan of water.'},
    {q:'Why do houses in hot climates often have light-coloured or white roofs?',a:'Light-coloured or white surfaces are POOR absorbers and GOOD reflectors of solar radiation. They reflect a large portion of the incoming infrared radiation, reducing the heat absorbed by the building and keeping the interior cooler.'},
    {q:'Explain why the specific heat capacity of a solid is usually much lower than that of a liquid like water.',a:'In a solid, particles are held in fixed positions by relatively strong bonds. A small amount of energy increases the vibration of these particles (temperature rise). In a liquid (especially water), the particles are held by strong intermolecular bonds (hydrogen bonds) that must be broken to increase particle kinetic energy, requiring much more energy.'},
    {q:'Describe the energy transformation involved in a vacuum flask storing hot coffee.',a:'The coffee has thermal (heat) energy. The vacuum flask minimises heat transfer outwards: conduction/convection are blocked by the vacuum, and radiation is reflected by the silvered inner wall. The thermal energy is therefore stored efficiently, keeping the coffee hot.'},
    {q:'A piece of copper of mass 0.1 kg is heated from 25°C to 75°C. Calculate the energy absorbed. (c_Cu = 385 J/(kg·K))',a:'E = mcΔT = 0.1 kg × 385 J/(kg·K) × (75 - 25)°C = 0.1 × 385 × 50 = 1925 J.'},
    {q:'What is the practical application of thermal expansion in the construction of railway lines?',a:'Railway lines and bridges are laid with EXPANSION GAPS. This allows the metal rails to expand freely on hot days without buckling or bending. If there were no gaps, the thermal expansion would cause the rails to exert huge forces and deform.'},
  ],
  blanks:{
    passage:'The transfer of heat through a solid via vibrating particles is called [_]. In fluids, heat is transferred by the physical movement of the fluid, known as [_]. Radiation can travel through a [_] because it consists of infrared electromagnetic waves. The energy required to raise the temperature of 1 kg of a substance by 1°C is its [_]. A [_] black surface is the most efficient at absorbing and emitting infrared radiation.',
    answers:['conduction','convection','vacuum','specific heat capacity','Matt'],
    wordbank:['conduction','convection','vacuum','specific heat capacity','Matt','Shiny','thermal expansion','insulator'],
  },
  sentences:[
    {prompt:'Explain why a hot cup of coffee stays warm for a longer time in a polystyrene cup than in a metallic cup.',keywords:['conduction','insulator','conductor','polystyrene','metal','heat transfer'],hint:'Which material conducts heat away from the coffee more effectively: polystyrene or metal? How does this affect the rate of cooling?'},
    {prompt:'Describe how a convection current is established when a room radiator is switched on.',keywords:['hot air rises','less dense','cool air sinks','circulation','radiator','convection current'],hint:'What happens to the temperature and density of the air immediately next to the radiator? What does the cooler air above do?'},
    {prompt:'Explain why the plates of a solar water heater are painted with a matt black surface rather than a shiny silver surface.',keywords:['infrared','radiation','absorbs','emits','matt black','shiny','reflection'],hint:'Which surface absorbs the maximum amount of solar radiation? Why is this crucial for the efficiency of the heater?'},
    {prompt:'Calculate the energy required to heat 250 g of water from 20°C to 100°C. (c_water = 4200 J/(kg·K))',keywords:['250 g','0.25 kg','ΔT','80°C','energy','mcΔT','84,000 J'],hint:'Remember to convert the mass to kilograms. Then apply the formula E = mcΔT.'},
    {prompt:'Explain how a bimetallic strip is used to turn off an electric iron automatically when it gets too hot.',keywords:['bimetallic strip','expand','bend','contact','break','thermostat','cool'],hint:'What happens to the two metals when the iron heats up? How does their different expansion cause a switch to open?'},
    {prompt:'Describe the energy transfers that occur when a metal rod is heated at one end and the other end becomes warm.',keywords:['conduction','particles','vibrations','kinetic energy','electrons','heat transfer'],hint:'How does the kinetic energy of particles at the hot end pass along to the cold end?'},
    {prompt:'A student heats 1.5 kg of oil (c=2000 J/(kg·K)) from 30°C to 80°C. Calculate the energy absorbed.',keywords:['1.5 kg','2000','ΔT 50°C','E=mcΔT','150,000 J','energy'],hint:'Plug the values into the specific heat capacity equation.'},
    {prompt:'Explain why the sea is warmer than the land during a winter night.',keywords:['specific heat capacity','water','high','land','low','store heat','cool down','slow'],hint:'Which material releases stored heat energy more slowly? Does water or land have a higher specific heat capacity?'},
    {prompt:'Compare the roles of conduction, convection, and radiation in heating a room.',keywords:['conduction','convection','radiation','heater','room','circulate','infrared'],hint:'Which method heats the solid objects directly? Which method circulates the hot air? Which method acts instantly without a medium?'},
    {prompt:'Why do vacuum flasks have silvered inner walls?',keywords:['silvered','reflect','radiation','infrared','heat loss','vacuum flask'],hint:'What property do shiny surfaces have regarding infrared radiation? How does this reduce energy loss?'},
    {prompt:'Calculate the temperature rise of 0.4 kg of aluminium (c=900 J/(kg·K)) if it absorbs 21,600 J of energy.',keywords:['E=mcΔT','21,600 J','0.4 kg','900','ΔT','60°C'],hint:'Rearrange the specific heat capacity equation to solve for ΔT = E / (mc).'},
    {prompt:'Explain why coastal cities have less extreme temperature variations than inland cities.',keywords:['coastal','sea','inland','land','specific heat','cool','moderate'],hint:'How does the high specific heat capacity of water affect the temperature of the adjacent land?'},
    {prompt:'Describe how heat travels from the filament of a light bulb to the surrounding air.',keywords:['filament','radiation','infrared','glass','conduction','convection','air'],hint:'Trace the three mechanisms of heat transfer from the hot filament to the air outside the bulb.'},
    {prompt:'A metal pot with a wooden handle is heated on a stove. Explain why the pot gets hot but the handle remains relatively cool.',keywords:['pot','metal','conductor','handle','wood','insulator','conduction'],hint:'Compare the thermal conductivity of metal and wood. Which one allows heat to flow through it easily?'},
    {prompt:'Explain the role of thermal expansion in the design of a bridge.',keywords:['bridge','thermal expansion','gaps','metal','heat','temperature','buckle'],hint:'What happens to the metal structure of a bridge when the temperature increases? How do engineers prevent damage?'},
    {prompt:'Calculate the energy released when 5 kg of water cools from 80°C to 20°C.',keywords:['5 kg','c=4200','ΔT=60°C','E=mcΔT','1,260,000 J','energy released'],hint:'Use the same formula, but note that cooling releases the same amount of energy.'},
    {prompt:'Explain how a solar water heater uses the greenhouse effect to warm water.',keywords:['glass','transmit','solar','absorb','re-radiate','infrared','trap','heat'],hint:'How does the glass let sunlight in but stop heat from escaping?'},
    {prompt:'Why are cooking pans often made of copper or aluminium, but their handles are made of wood or plastic?',keywords:['conduction','conductor','metal','insulator','pan','heat','handle','safe'],hint:'Which material needs to transfer heat to the food quickly? Which material needs to stay cool to protect the cook?'},
    {prompt:'Describe the experiment to measure the specific heat capacity of a metal block.',keywords:['electric heater','thermometer','mass','energy','ΔT','c=E/mΔT','insulation'],hint:'What equipment is used to supply a measured amount of energy, and what measurements need to be taken?'},
    {prompt:'Explain why it is dangerous to put a glass jar in the microwave if it is sealed tightly.',keywords:['expansion','pressure','steam','glass','microwave','explode','gas'],hint:'What happens to the air or liquid inside the jar when heated? What happens to the pressure?'},
  ],
});
</script></body></html>
