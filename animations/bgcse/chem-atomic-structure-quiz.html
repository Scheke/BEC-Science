<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Atomic Structure Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Atomic Structure — BGCSE Chemistry Quiz',
  color:'#e65100',dark:'#bf360c',light:'#fbe9e7',
  mcq:[
    {q:'The atomic number of an element equals:',opts:['Number of neutrons','Number of protons','Mass number','Number of electrons + neutrons'],ans:1,exp:'The ATOMIC NUMBER = number of PROTONS in the nucleus. It defines the element. In a neutral atom, the number of electrons equals the number of protons.'},
    {q:'The mass number of an atom is:',opts:['Number of protons only','Number of neutrons only','Protons + neutrons','Protons + electrons'],ans:2,exp:'MASS NUMBER = number of PROTONS + NEUTRONS in the nucleus. Electrons have negligible mass so they are not included. Example: ¹²C has 6 protons + 6 neutrons = mass number 12.'},
    {q:'Isotopes are atoms of the same element with:',opts:['Different numbers of protons','Same mass number but different proton numbers','Same number of protons but different numbers of neutrons','Different chemical properties'],ans:2,exp:'ISOTOPES have the same atomic number (same element, same protons) but different mass numbers — because they have different numbers of NEUTRONS. They have the same chemical properties but different physical properties.'},
    {q:'An electron configuration of 2,8,1 means:',opts:['Mass number 11','Atom has 3 shells with 11 electrons total','Atom has 11 protons','This is sodium (Na), atomic number 11'],ans:3,exp:'2,8,1 means: 2 electrons in shell 1, 8 in shell 2, 1 in shell 3. Total = 11 electrons = 11 protons = atomic number 11 = SODIUM (Na).'},
    {q:'Which particle has no charge?',opts:['Proton','Electron','Neutron','Ion'],ans:2,exp:'NEUTRONS have NO CHARGE (neutral). Protons have +1 charge. Electrons have -1 charge. Neutrons and protons are in the nucleus; electrons orbit in shells.'},
    {q:'An ion is formed when an atom:',opts:['Gains or loses neutrons','Fuses with another atom','Gains or loses electrons','Changes its proton number'],ans:2,exp:'An ION forms when an atom GAINS electrons (forming a negative anion, e.g. Cl⁻) or LOSES electrons (forming a positive cation, e.g. Na⁺). The proton number (atomic number) does NOT change.'},
    {q:'The maximum number of electrons in the first three shells (K, L, M) are:',opts:['2, 8, 8','8, 8, 8','2, 8, 18','2, 2, 2'],ans:0,exp:'The electron shell capacity rule (for the first three shells): Shell 1 = 2 electrons. Shell 2 = 8 electrons. Shell 3 = 8 electrons (for the first 18 elements). This gives the stable noble gas configurations.'},
    {q:'Which of the following is a correct pair of isotopes?',opts:['¹⁴C and ¹⁴N','¹²C and ¹⁴C','³⁹K and ⁴⁰Ca','¹⁶O and ¹⁷O²⁻'],ans:1,exp:'Isotopes must be atoms of the SAME element. ¹²C and ¹⁴C are both carbon (6 protons), but they have 6 and 8 neutrons respectively. The others are different elements or ions.'},
    {q:'The relative atomic mass (RAM) of an element is calculated using:',opts:['The mass of the most common isotope','The weighted average of isotope masses and abundances','The mass number of the heaviest isotope','The number of protons only'],ans:1,exp:'RAM is the WEIGHTED AVERAGE mass of all naturally occurring isotopes, taking into account their percentage abundances. Example: Chlorine (35Cl at 75% and 37Cl at 25%) has RAM 35.5.'},
    {q:'Rutherford\'s gold foil experiment proved that:',opts:['The atom is a solid sphere','Electrons orbit the nucleus in fixed paths','The atom has a small, dense, positive nucleus','Neutrons exist in the nucleus'],ans:2,exp:'Rutherford\'s experiment showed that most alpha particles passed straight through (empty space), a few deflected (positive nucleus), and some bounced back (dense, heavy nucleus). This proved the NUCLEAR MODEL of the atom.'},
    {q:'Magnesium (atomic number 12) has a complete outer shell after it:',opts:['Gains 2 electrons','Loses 2 electrons','Loses 1 electron','Gains 6 electrons'],ans:1,exp:'Mg electron config = 2,8,2. To achieve a stable noble gas configuration (2,8), it LOSES 2 electrons, forming a Mg²⁺ cation.'},
    {q:'The proton number of an atom determines:',opts:['Its mass','Its chemical properties (which element it is)','Its isotope number','Its atomic weight'],ans:1,exp:'The PROTON NUMBER (atomic number) is the unique identifier of an element. All atoms with 8 protons are oxygen, regardless of their neutron count. It defines the chemical identity.'},
    {q:'Electrons in an atom are arranged in:',opts:['The nucleus','Energy levels or shells','Random orbits','The neutron cloud'],ans:1,exp:'Electrons orbit the nucleus in specific ENERGY LEVELS called SHELLS. Each shell has a fixed maximum capacity (2, 8, 8...). Electrons fill from the lowest energy shell first.'},
    {q:'Oxygen has atomic number 8. Its electron configuration is:',opts:['2,8','2,6','2,2,4','2,4,2'],ans:1,exp:'Oxygen (Z=8) has 8 electrons. Shell 1 holds 2. The remaining 6 go into Shell 2. Therefore, the configuration is 2,6. It needs 2 more electrons to achieve a stable octet (2,8).'},
    {q:'If an atom has 11 protons and 12 neutrons, its mass number is:',opts:['1','11','12','23'],ans:3,exp:'Mass Number = Protons + Neutrons = 11 + 12 = 23. This atom is Sodium-23 (²³Na), a naturally occurring isotope of sodium.'},
    {q:'Why do isotopes of the same element have different physical properties?',opts:['Because they have different electron configurations','Because they have different masses (due to different neutron numbers)','Because they have different proton numbers','Because they are different elements'],ans:1,exp:'Isotopes have the same electron configuration (so same chemical properties) but different masses. The difference in mass affects physical properties such as density, melting point, and boiling point.'},
    {q:'The charged particles found in the nucleus are:',opts:['Electrons only','Protons and neutrons','Protons only','Neutrons only'],ans:2,exp:'The nucleus contains PROTONS (positively charged) and NEUTRONS (neutral, no charge). Electrons are negatively charged and orbit the nucleus in shells.'},
    {q:'When a magnesium atom loses 2 electrons, it becomes:',opts:['Mg²⁻','Mg²⁺','Mg⁺','Mg'],ans:1,exp:'When an atom LOSES electrons, it becomes a positive CATION. Magnesium (2,8,2) loses its 2 valence electrons to achieve a stable octet, forming the Mg²⁺ ion (2,8).'},
    {q:'The mass of an electron is:',opts:['Equal to the mass of a proton','Approximately 1/1840 the mass of a proton','Approximately twice the mass of a proton','Negligible and not counted in mass number'],ans:1,exp:'Electrons are incredibly tiny. Their mass is approximately 1/1840 the mass of a proton or neutron. Because they are so light, their mass is ignored when calculating the mass number.'},
    {q:'The electron arrangement 2,8,7 corresponds to:',opts:['A stable noble gas','An element in Group 7 (halogen)','An element in Group 1 (alkali metal)','An element in Period 2'],ans:1,exp:'The 2,8,7 arrangement has 7 outer electrons. This places the element in GROUP 7 (the Halogens). It has atomic number 17, which is Chlorine. It gains 1 electron to become a stable anion (Cl⁻).'},
  ],
  match:[
    {term:'Proton',def:'Positively charged particle in the nucleus; determines the element'},
    {term:'Neutron',def:'Neutral (no charge) particle in the nucleus; contributes to mass number'},
    {term:'Electron',def:'Negatively charged particle that orbits the nucleus in electron shells'},
    {term:'Atomic number',def:'The number of protons in the nucleus of an atom'},
    {term:'Mass number',def:'The total number of protons plus neutrons in the nucleus'},
    {term:'Isotope',def:'Atoms of the same element with the same atomic number but different mass numbers (different neutron counts)'},
    {term:'Cation',def:'A positively charged ion formed when an atom loses electrons'},
    {term:'Anion',def:'A negatively charged ion formed when an atom gains electrons'},
    {term:'Electron configuration',def:'The arrangement of electrons in energy levels/shells around the nucleus'},
    {term:'Shell (energy level)',def:'A region around the nucleus where electrons orbit; holds a maximum number of electrons'},
    {term:'Nucleus',def:'The central, dense core of an atom, containing protons and neutrons'},
    {term:'Relative atomic mass',def:'The weighted average mass of all isotopes of an element compared to 1/12 of carbon-12'},
    {term:'Valence electrons',def:'The electrons in the outermost shell of an atom; involved in chemical bonding'},
    {term:'Period (in periodic table)',def:'A horizontal row in the periodic table; corresponds to the number of electron shells'},
    {term:'Group (in periodic table)',def:'A vertical column in the periodic table; elements share the same number of valence electrons'},
    {term:'Noble gas configuration',def:'A stable electron arrangement with a full outer shell (e.g., 2, 2,8, 2,8,8)'},
    {term:'Ion',def:'A charged atom or group of atoms formed by the loss or gain of electrons'},
    {term:'Alpha particle',def:'A helium nucleus (²He⁴) emitted during radioactive decay; used in Rutherford\'s scattering experiment'},
    {term:'Rutherford scattering',def:'The deflection of alpha particles by the positive nucleus, proving its existence'},
    {term:'Electron cloud',def:'The region of space around the nucleus where there is a high probability of finding an electron'},
  ],
  flashcards:[
    {q:'What is the structure of an atom?',a:'A central NUCLEUS containing protons (+) and neutrons (neutral), surrounded by ELECTRON SHELLS containing electrons (-). The nucleus is tiny but contains almost all the mass.'},
    {q:'How do you calculate the number of neutrons in an atom?',a:'Neutrons = Mass number − Atomic number. Example: chlorine-35 (mass number 35, atomic number 17): 35 − 17 = 18 neutrons.'},
    {q:'What is the electron configuration of calcium (atomic number 20)?',a:'2, 8, 8, 2. Shells fill in order: Shell 1 holds max 2, Shell 2 holds max 8, Shell 3 holds max 8 (for first 18 elements), Shell 4 holds the remaining 2 electrons.'},
    {q:'How do isotopes affect relative atomic mass (RAM)?',a:'RAM is the weighted AVERAGE of all isotope masses, taking into account their relative abundances. Example: chlorine has ³⁵Cl (75%) and ³⁷Cl (25%), so RAM = (35×75 + 37×25) / 100 = 35.5.'},
    {q:'What is the difference between a cation and an anion?',a:'CATION: a positively charged ion — formed when an atom LOSES electrons (metals). ANION: a negatively charged ion — formed when an atom GAINS electrons (non-metals). e.g., Na⁺ is a cation; Cl⁻ is an anion.'},
    {q:'What evidence supports the nuclear model of the atom?',a:'Rutherford\'s gold foil experiment: alpha particles fired at thin gold foil. Most passed straight through (atom is mostly empty space). A few deflected at large angles (small, dense, positive nucleus). Some bounced back (direct collision with the dense nucleus).'},
    {q:'Define the term "isotopes".',a:'Isotopes are atoms of the SAME element (same atomic number/proton number) that have DIFFERENT mass numbers because they contain different numbers of NEUTRONS.'},
    {q:'Explain why the mass number ignores the mass of electrons.',a:'Electrons have a mass that is approximately 1/1840th the mass of a proton or neutron. This mass is so exceedingly small that it is considered negligible when calculating the total mass number of the atom.'},
    {q:'What is the significance of the valence electrons?',a:'Valence electrons are the electrons in the OUTERMOST shell of an atom. They determine the chemical properties of the element because they are involved in forming chemical bonds (ionic and covalent).'},
    {q:'Describe the arrangement of electrons in a potassium atom (atomic number 19).',a:'Potassium (Z=19) has 19 electrons. The configuration is 2, 8, 8, 1. It has 1 valence electron, placing it in Group 1. It readily loses this electron to form a K⁺ cation.'},
    {q:'Why do different isotopes of the same element have the same chemical properties?',a:'Chemical properties depend entirely on the number of electrons (specifically the valence electrons) and the proton number. Since isotopes have the same number of protons and electrons, they react in the exact same chemical way.'},
    {q:'What is a "stable octet" in chemistry?',a:'A stable octet refers to an atom having 8 valence electrons in its outermost shell (equivalent to a noble gas configuration, e.g., Neon: 2,8). Atoms gain, lose, or share electrons to achieve this stable octet.'},
    {q:'How does Rutherford\'s experiment disprove the "plum pudding" model?',a:'The plum pudding model suggested the atom was a solid sphere of positive charge with electrons scattered in it. Rutherford\'s results (some alpha particles bouncing back) proved that the atom MUST have a tiny, dense, concentrated positive nucleus, which the plum pudding model lacked.'},
    {q:'Why is the relative atomic mass of chlorine 35.5, and not a whole number?',a:'Chlorine has two naturally occurring isotopes: ³⁵Cl (75% abundance) and ³⁷Cl (25% abundance). The RAM is calculated as the weighted average: (35×75) + (37×25) / 100 = 35.5. Because it is an average of two mass numbers, it is a decimal.'},
    {q:'Explain what the period number and group number tell you about an atom.',a:'The PERIOD number tells you the number of electron shells the atom has (e.g., Period 3 = 3 shells). The GROUP number tells you the number of valence electrons the atom has (e.g., Group 2 = 2 valence electrons).'},
    {q:'How does an atom of sodium (Na) become a Na⁺ ion?',a:'Sodium has the configuration 2,8,1. To achieve a stable noble gas configuration (2,8), it LOSES its single valence electron. Because it lost a negatively charged electron, the remaining atom has a net positive charge, becoming Na⁺.'},
    {q:'What is the maximum number of electrons in the first three main electron shells?',a:'The theoretical maximums are: Shell 1 (K) = 2 electrons. Shell 2 (L) = 8 electrons. Shell 3 (M) = 18 electrons. However, for the first 18 elements (up to Argon), the third shell holds a maximum of 8 electrons before the 4th shell starts to fill.'},
    {q:'What are the properties of electrons within an atom?',a:'Electrons are subatomic particles with a NEGATIVE charge (-1) and virtually no mass (1/1840 of a proton). They orbit the nucleus at high speeds in discrete energy levels or shells.'},
    {q:'How can you determine the number of protons in a neutral atom?',a:'In a neutral atom, the number of protons ALWAYS equals the number of electrons. Therefore, if you know the electron configuration (e.g., 2,8,1 = 11 electrons), you know there are 11 protons, and the atomic number is 11.'},
    {q:'Why is the nucleus considered to be the most dense part of an atom?',a:'The nucleus contains protons and neutrons, which are vastly heavier than electrons (each proton/neutron is ~1840x heavier than an electron). Yet, the nucleus is incredibly small (about 100,000 times smaller than the atom itself). This gives it an extraordinarily high density.'},
  ],
  blanks:{
    passage:'The atomic number of an element equals the number of [_] in the nucleus. The mass number equals the number of [_] plus [_]. Atoms of the same element with different mass numbers are called [_]. In a neutral atom, the number of electrons equals the number of [_]. When an atom loses electrons, it forms a positive [_]; when it gains electrons, it forms a negative [_].',
    answers:['protons','protons','neutrons','isotopes','protons','cation','anion'],
    wordbank:['protons','protons','neutrons','isotopes','protons','cation','anion','electrons','mass'],
  },
  sentences:[
    {prompt:'Explain what isotopes are and give an example of two isotopes of carbon.',keywords:['isotopes','protons','neutrons','mass number','carbon-12','carbon-14'],hint:'What stays the same between isotopes of the same element, and what changes?'},
    {prompt:'Describe Rutherford\'s gold foil experiment and what it proved about the structure of the atom.',keywords:['alpha particles','gold foil','nucleus','deflected','bounced back','empty space'],hint:'What were the three different results observed when the alpha particles hit the foil, and what did each result imply?'},
    {prompt:'Explain how to work out the electron configuration of phosphorus (atomic number 15) and state which group it belongs to.',keywords:['shells','2','8','5','configuration','Group 5'],hint:'Fill the shells in order (2, then 8, then the rest). How many electrons are in the outermost shell?'},
    {prompt:'Calculate the number of protons, neutrons, and electrons in an atom of Magnesium-24 (atomic number 12).',keywords:['protons','12','neutrons','mass number','24','electrons'],hint:'Use the formulas: Protons = Atomic number. Electrons = Protons. Neutrons = Mass number − Atomic number.'},
    {prompt:'Explain why sodium (2,8,1) forms a Na⁺ ion, while chlorine (2,8,7) forms a Cl⁻ ion.',keywords:['sodium','lose','electron','Na⁺','chlorine','gain','Cl⁻','stable octet'],hint:'What must each atom do to achieve a full outer shell of 8 electrons?'},
    {prompt:'Describe the difference between atomic number and mass number.',keywords:['atomic number','protons','mass number','protons','neutrons','identity'],hint:'One defines the element; the other defines the specific isotope of that element.'},
    {prompt:'Explain why the relative atomic mass of copper is 63.5, even though no single copper atom has that mass.',keywords:['RAM','weighted average','isotopes','abundance','63','65'],hint:'Copper exists as two isotopes, ⁶³Cu and ⁶⁵Cu. How is 63.5 calculated from them?'},
    {prompt:'Using the electron shell rules, determine the configuration of Argon (atomic number 18).',keywords:['2','8','8','full shells','noble gas','stable'],hint:'Start with shell 1 (max 2), then shell 2 (max 8), then shell 3. How many electrons does Argon have in total?'},
    {prompt:'Explain how an atom of oxygen (2,6) achieves a stable configuration.',keywords:['gain','2 electrons','O²⁻','anion','stable octet','bonding'],hint:'Does it lose or gain electrons? How many?'},
    {prompt:'Describe the relationship between the period number of an element and its electron shells.',keywords:['Period','horizontal','shells','energy levels','electrons','row'],hint:'If an element is in Period 3, how many electron shells does its atom have?'},
    {prompt:'Why do atoms form ions rather than just existing as neutral atoms?',keywords:['stability','noble gas','octet','gain','lose','ions'],hint:'What configuration do atoms try to achieve, and how does forming ions help them achieve it?'},
    {prompt:'Explain the difference between the mass number and the relative atomic mass.',keywords:['mass number','integer','single atom','RAM','weighted average','decimal'],hint:'One is a count of particles in one specific atom. The other is an average based on abundance across a sample of atoms.'},
    {prompt:'Outline the steps to write the electron configuration for Lithium (atomic number 3).',keywords:['shell 1','2','shell 2','1','2,1','Group 1'],hint:'How many electrons go into the first shell, and how many go into the second?'},
    {prompt:'Describe what happens to the number of protons, neutrons, and electrons when a neutral Calcium atom forms a Ca²⁺ ion.',keywords:['protons','stay same','electrons','lost 2','neutrons','stay same','Ca²⁺'],hint:'Does the identity of the element change? Which subatomic particle is affected?'},
    {prompt:'Explain why atoms are electrically neutral.',keywords:['protons','positive','electrons','negative','equal','neutral','balance'],hint:'What is the ratio of protons to electrons in a neutral atom?'},
    {prompt:'Describe the significance of the group number in the periodic table.',keywords:['Group','vertical','valence electrons','outer shell','reactivity','similar'],hint:'What do all the elements in Group 2 have in common regarding their outermost shell?'},
    {prompt:'Explain what alpha particles are and why they were used in Rutherford\'s scattering experiment.',keywords:['alpha','helium nucleus','positive','gold foil','nucleus','deflect'],hint:'Alpha particles are positively charged. What happens when a positive charge hits another positive charge?'},
    {prompt:'An atom has an electron configuration of 2,8,5. Identify the element and state how many electrons it needs to gain to achieve a noble gas configuration.',keywords:['2,8,5','15','phosphorus','gain','3','stable'],hint:'Count the total electrons. What element is that? How many electrons are needed to fill the outer shell to 8?'},
    {prompt:'Explain the principle behind electron shells filling up from the lowest energy level first.',keywords:['lowest energy','inner shells','outer shells','stability','order','2,8,8'],hint:'Why does shell 1 fill completely before any electrons go into shell 2?'},
    {prompt:'Describe how a proton, a neutron, and an electron differ in terms of mass, charge, and location.',keywords:['proton','+1','nucleus','neutron','0','nucleus','electron','-1','shells'],hint:'Compare all three subatomic particles across these three specific categories.'},
  ],
});
</script></body></html>
