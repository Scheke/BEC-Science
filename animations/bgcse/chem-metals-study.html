const STEPS=[
  {
    title:'The Reactivity Series',
    body:`The <strong>reactivity series</strong> ranks metals from most to least reactive based on how readily they form positive ions.
    <br><br>
    <strong>Most reactive → Least reactive:</strong>
    <br>
    <em>K, Na, Ca, Mg, Al, Zn, Fe, Ni, Sn, Pb, (H), Cu, Ag, Au, Pt</em>
    <br><br>
    Memory tip: <em><strong>K</strong>ing <strong>Na</strong>poleon <strong>Ca</strong>refully <strong>Mg</strong>ade <strong>Al</strong>l <strong>Z</strong>inc <strong>Fe</strong>rmentations — <strong>N</strong>ot <strong>S</strong>o <strong>P</strong>leasant <strong>Cu</strong>ring <strong>S</strong>ores <strong>A</strong>nd <strong>G</strong>aining <strong>P</strong>ain</em>
    <br><br>
    More reactive metals react vigorously with water and acids; less reactive ones don't.`,

      const bw=W/(metals.length+1);
      metals.forEach((m,i)=>{
        const x=(i+1)*bw;

      sk.textAlign(sk.RIGHT);sk.text('Least →',W*0.97,H*0.9);

  },
  {
    title:'Displacement Reactions',
    body:`A more reactive metal can <strong>displace</strong> a less reactive metal from its salt solution.
    <br><br>
    <strong>Rule:</strong> If metal A is more reactive than metal B, then A will displace B from B's salt solution.
    <br><br>
    Examples:
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li>Fe + CuSO₄ → FeSO₄ + Cu ✓ (Fe more reactive than Cu)</li>
      <li>Cu + ZnSO₄ → no reaction ✗ (Cu less reactive than Zn)</li>
      <li>Zn + 2HCl → ZnCl₂ + H₂ (Zn displaces hydrogen from acid)</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk,[10,14,28]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;

      sk.fill(52,152,219,60);sk.noStroke();sk.rect(W*0.22,H*0.3,W*0.56,H*0.5,0,0,8,8);

      sk.rect(W*0.48,H*0.15,8,H*0.5);
      // Copper depositing on rod
      if(t>2){
        const copperH=Math.min(H*0.3,((t-2)*8));
        sk.fill(184,115,51,200);sk.noStroke();
        sk.rect(W*0.46,H*0.55,12,copperH,2);
      }
      // Labels
      sk.fill(255,255,255,120);sk.textSize(10);sk.textAlign(sk.CENTER);
      sk.text('CuSO₄ (aq)',W*0.5,H*0.38);
      sk.fill(150,150,150);sk.textSize(9);sk.textAlign(sk.LEFT);
      sk.text('Fe rod',W*0.55,H*0.22);

      sk.text('Fe + CuSO₄ → FeSO₄ + Cu',W*0.5,H*0.9);
    }
  },
  {
    q:'Reactivity Series — K to Au with Reactions',
    content:`<h3>The Reactivity Series</h3><p>The reactivity series ranks metals in order of how readily they lose electrons and form positive ions. Metals at the top react vigorously with cold water and dilute acids; those at the bottom are largely inert. This series also determines which extraction method is needed.</p><ul><li>Most reactive (K, Na, Ca): react violently with cold water producing hydrogen gas and a metal hydroxide; extracted by electrolysis</li><li>Moderately reactive (Mg, Al, Zn, Fe): react with dilute acids but not cold water (or only slowly); extracted by reduction with carbon in a blast furnace</li><li>Least reactive (Cu, Ag, Au): do not react with dilute acids or water; found as native metals or extracted by simple smelting/electrolytic refining</li></ul>`,

  },
  {
    q:'Displacement Reaction — Iron Rod in CuSO₄',
    content:`<h3>Displacement Reaction: Fe + CuSO₄</h3><p>A displacement reaction occurs when a more reactive metal pushes a less reactive metal out of its salt solution. Iron is above copper in the reactivity series, so iron can displace copper from copper sulfate solution.</p><ul><li>Iron rod placed in blue CuSO₄ solution: Fe atoms lose electrons (oxidation) forming Fe²⁺ ions in solution — the blue colour fades as Cu²⁺ ions are removed</li><li>Cu²⁺ ions in solution gain those electrons (reduction) and are deposited as reddish-brown copper metal on the iron rod</li><li>Overall ionic equation: Fe + Cu²⁺ → Fe²⁺ + Cu — this is a redox reaction (simultaneous oxidation and reduction)</li></ul>`,
    visual:`<svg viewBox="0 0 420 265" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">

  {
    q:'Rusting — Conditions Required (Water + Oxygen)',
    content:`<h3>Conditions Required for Rusting</h3><p>Rusting is the corrosion of iron to form hydrated iron(III) oxide (Fe₂O₃·xH₂O). The classic three-tube experiment demonstrates that both water AND oxygen must be present simultaneously — neither alone is sufficient.</p><ul><li>Tube 1 (water + air): the iron nail rusts — both water and dissolved oxygen are present, so the electrochemical corrosion process occurs</li><li>Tube 2 (dry air only): no rusting — silica gel removes all moisture, so even though oxygen is present, there is no water to enable the reaction</li><li>Tube 3 (boiled water sealed with oil): no rusting — boiling removes dissolved oxygen and the oil layer prevents more entering, so even though water is present, there is no oxygen</li></ul>`,
    visual:`<svg viewBox="0 0 420 275" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e65100"/></marker></defs>

  <!-- Tube 1: Water + Air → Rusts -->

  <text x="75" y="52" text-anchor="middle" fill="#e65100" font-size="10" font-weight="bold">Tube 1</text>

  <text x="75" y="62" text-anchor="middle" fill="#a0522d" font-size="8">nail</text>
  <text x="75" y="200" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="bold">RUSTS</text>
  <!-- Tube 2: Dry air only → No rust -->
  <rect x="155" y="35" width="110" height="175" rx="6" fill="#fff" stroke="#e65100" stroke-width="2"/>
  <text x="210" y="52" text-anchor="middle" fill="#e65100" font-size="10" font-weight="bold">Tube 2</text>

  <text x="210" y="200" text-anchor="middle" fill="#c62828" font-size="11" font-weight="bold">NO RUST</text>
  <!-- Tube 3: Boiled water (no O2) → No rust -->
  <rect x="290" y="35" width="110" height="175" rx="6" fill="#fff" stroke="#e65100" stroke-width="2"/>
  <text x="345" y="52" text-anchor="middle" fill="#e65100" font-size="10" font-weight="bold">Tube 3</text>
  <!-- Boiled water (no dissolved O2) -->
  <rect x="302" y="80" width="86" height="120" rx="4" fill="#42a5f5" opacity="0.35"/>
  <!-- Oil layer on top -->
  <rect x="302" y="80" width="86" height="12" rx="4" fill="#ffd54f" opacity="0.7"/>
  <text x="345" y="90" text-anchor="middle" fill="#333" font-size="8">Oil (seals)</text>

  <rect x="340" y="65" width="10" height="135" rx="2" fill="#78909c"/>

  <!-- Conclusion -->
  <rect x="10" y="220" width="400" height="48" rx="6" fill="#e65100" opacity="0.12" stroke="#e65100" stroke-width="1.5"/>
  <text x="210" y="237" text-anchor="middle" fill="#e65100" font-size="12" font-weight="bold">Conclusion: Rusting requires BOTH water AND oxygen</text>

  },
  {
    q:'Extraction of Iron — Blast Furnace Zones',
    content:`<h3>Blast Furnace — Iron Extraction</h3><p>Iron is extracted from iron ore (Fe₂O₃) in a blast furnace using coke (carbon) as the reducing agent and limestone as a flux to remove acidic impurities. The furnace operates continuously at temperatures up to 1900°C.</p><ul><li>Zone 2 (~1000°C): coke burns in the hot air blast to form CO₂, which reacts with more coke to form carbon monoxide (CO) — the actual reducing agent</li><li>Zone 3 (~1500°C): CO reduces Fe₂O₃ to molten iron (Fe₂O₃ + 3CO → 2Fe + 3CO₂); limestone (CaCO₃) decomposes and its CaO reacts with silica impurities to form molten slag (CaSiO₃)</li><li>Zone 4 (bottom): molten iron is denser than slag and sinks — both are tapped off separately, iron for steel-making and slag for road-building</li></ul>`,
    visual:`<svg viewBox="0 0 420 290" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e65100"/></marker></defs>
  <rect width="420" height="290" fill="#fff8e1" rx="8"/>
