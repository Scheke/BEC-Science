<div class="topbar"><span class="logo">BEC Animations</span><a href="../../index.html#senior/Physics">&#8592; Physics</a></div>
<div class="topic-header"><span class="label">BGCSE · Physics</span><h1>Mechanics — Motion, Momentum &amp; Energy</h1></div>
<div id="sketch-wrap"><div id="sketch"></div></div>
<div id="controls">

  <button class="btn mode-btn"    id="b1" onclick="setTab(1)" title="Momentum" aria-label="Momentum">💫 <span class="mode-lbl">Momentum</span></button>
  <button class="btn mode-btn"    id="b2" onclick="setTab(2)" title="Energy & Work" aria-label="Energy & Work">⚡ <span class="mode-lbl">Energy & Work</span></button>
  <button class="btn mode-btn"    id="b3" onclick="setTab(3)" title="Gravity & Forces" aria-label="Gravity & Forces">🌍 <span class="mode-lbl">Gravity & Forces</span></button>
</div>
<script>
let tab=0;
function setTab(n){tab=n;[0,1,2,3].forEach(i=>document.getElementById('b'+i).classList.toggle('on',i===n));}
let mechMcq=false;
const MECH_MCQ=[
  {q:'Momentum is calculated by:',opts:['mass × velocity','force × time','mass × acceleration','force × distance'],c:0,tip:'Momentum (p) = mass (m) × velocity (v). Unit: kg·m/s.'},
  {q:'A 2 kg object moving at 5 m/s has a momentum of:',opts:['10 kg·m/s','7 kg·m/s','0.4 kg·m/s','25 kg·m/s'],c:0,tip:'p = mv = 2 × 5 = 10 kg·m/s.'},
  {q:'Work done equals:',opts:['Force × distance moved in direction of force','Mass × acceleration','Force × time','Energy × time'],c:0,tip:'Work (J) = Force (N) × distance (m). Only the component in the direction of force counts.'},
  {q:'Which of these is NOT a vector quantity?',opts:['Speed','Velocity','Acceleration','Force'],c:0,tip:'Speed has magnitude only (no direction) — it is a scalar. Velocity is speed with direction.'},
  {q:'Kinetic energy is calculated by:',opts:['½mv²','mv²','mgh','F×d'],c:0,tip:'KE = ½mv². A 4 kg object at 3 m/s has KE = ½ × 4 × 9 = 18 J.'},
  {q:'On a velocity-time graph, the area under the line represents:',opts:['Displacement','Acceleration','Force','Momentum'],c:0,tip:'Area under a v-t graph = displacement. Gradient of v-t graph = acceleration.'},
  {q:'Newton\'s 3rd law states:',opts:['Every action has an equal and opposite reaction','F = ma','Objects continue at rest unless acted on by a force','Momentum is conserved'],c:0,tip:'Newton\'s 3rd law: action-reaction pairs act on DIFFERENT objects.'}
];
let mechMcqIdx=0,mechMcqSel=-1,mechMcqScore=0,mechMcqDone=false,mechMcqFeedback=null;
function setMechPractice(on){mechMcq=on;let b=document.getElementById('b-prac');b.classList.toggle('on',on);b.style.background=on?'#f9a825':'';b.style.color=on?'#fff':'#f9a825';if(on){mechMcqIdx=0;mechMcqSel=-1;mechMcqScore=0;mechMcqDone=false;mechMcqFeedback=null;}}
function drawMechMCQ(s){s.background(252,252,240);if(mechMcqDone){s.fill(13,71,161);s.textSize(22);s.textStyle(s.BOLD);s.textAlign(s.CENTER,s.BASELINE);s.noStroke();s.text('Quiz Complete!',440,180);s.textSize(16);s.text('Score: '+mechMcqScore+'/'+MECH_MCQ.length,440,215);let msg=mechMcqScore===MECH_MCQ.length?'Perfect! You know Mechanics!':mechMcqScore>=5?'Great job!':'Review momentum, energy & Newton\'s laws.';s.textSize(13);s.fill(60);s.text(msg,440,250);s.fill(249,168,37);s.noStroke();s.rect(310,290,260,44,22);s.fill(255);s.textSize(14);s.text('Play Again',440,317);return;}let q=MECH_MCQ[mechMcqIdx];s.fill(220);s.noStroke();s.rect(30,18,820,10,5);s.fill(100,180,100);s.rect(30,18,820*(mechMcqIdx/MECH_MCQ.length),10,5);s.fill(13,71,161);s.textSize(10);s.textStyle(s.NORMAL);s.textAlign(s.LEFT,s.TOP);s.text('Question '+(mechMcqIdx+1)+' of '+MECH_MCQ.length,30,32);s.fill(30);s.textSize(15);s.textStyle(s.BOLD);s.textAlign(s.CENTER,s.TOP);s.text(q.q,440,55,820,80);q.opts.forEach((o,i)=>{let x=30+(i%2)*430,y=155+(Math.floor(i/2))*90,w=410,h=70;let isSel=mechMcqSel===i,correct=mechMcqFeedback!==null&&i===q.c,wrong=mechMcqFeedback!==null&&isSel&&i!==q.c;s.fill(correct?[220,255,220]:wrong?[255,220,220]:isSel?[255,248,200]:[248,248,255]);s.stroke(correct?[0,150,0]:wrong?[200,0,0]:isSel?[200,160,0]:[200]);s.strokeWeight(isSel||correct?2.5:1.5);s.rect(x,y,w,h,10);s.fill(30);s.noStroke();s.textSize(13);s.textStyle(s.NORMAL);s.textAlign(s.CENTER,s.CENTER);s.text(o,x+w/2,y+h/2,w-20,h-10);});if(mechMcqFeedback){s.fill(mechMcqFeedback==='correct'?[0,120,0]:[150,0,0]);s.textSize(11);s.textStyle(s.BOLD);s.textAlign(s.CENTER,s.BASELINE);s.noStroke();s.text(mechMcqFeedback==='correct'?'✓ Correct!':'✗ Wrong — '+q.tip,440,450,820,40);}}
function mechMcqClick(mx,my){if(mechMcqDone){if(mx>310&&mx<570&&my>290&&my<334){mechMcqIdx=0;mechMcqSel=-1;mechMcqScore=0;mechMcqDone=false;mechMcqFeedback=null;}return;}if(mechMcqFeedback!==null){mechMcqIdx++;mechMcqSel=-1;mechMcqFeedback=null;if(mechMcqIdx>=MECH_MCQ.length)mechMcqDone=true;return;}MECH_MCQ[mechMcqIdx].opts.forEach((o,i)=>{let x=30+(i%2)*430,y=155+(Math.floor(i/2))*90,w=410,h=70;if(mx>x&&mx<x+w&&my>y&&my<y+h){mechMcqSel=i;mechMcqFeedback=i===MECH_MCQ[mechMcqIdx].c?'correct':'wrong';if(i===MECH_MCQ[mechMcqIdx].c)mechMcqScore++;}});}
new p5(sk=>{
  const W=880,H=510;let tick=0;
  // Ball state for motion
  let ballX=30,ballVx=4,ballAx=0.08;
  sk.setup=()=>{sk.createCanvas(W,H).parent('sketch');sk.textFont('Arial');};
  sk.draw=()=>{
    if(mechMcq){ drawMechMCQ(sk); return; }
    tick+=0.025;
    sk.background(245,248,255);
    if(tab===0) drawMotionGraphs();
    else if(tab===1) drawMomentum();
    else if(tab===2) drawEnergy();
    else drawGravity();
    drawInfoPanel();
  };

  function drawMotionGraphs(){
    sk.fill(20,60,180);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('Velocity-Time Graphs',248,22);sk.textStyle(sk.NORMAL);
    let gx=14,gy=290,gw=462,gh=190;
    // Grid
    sk.stroke(220,220,240);sk.strokeWeight(1);
    for(let i=0;i<=5;i++){sk.line(gx,gy-i*gh/5,gx+gw,gy-i*gh/5);}
    for(let i=0;i<=6;i++){sk.line(gx+i*gw/6,gy-gh,gx+i*gw/6,gy);}
    // Axes
    sk.stroke(80,80,100);sk.strokeWeight(2);
    sk.line(gx,gy,gx+gw,gy);sk.line(gx,gy,gx,gy-gh);
    sk.noStroke();sk.fill(60);sk.textSize(9);sk.textStyle(sk.ITALIC);sk.textAlign(sk.CENTER);
    sk.text('Time (s) →',gx+gw/2,gy+16);
    sk.push();sk.translate(gx-16,gy-gh/2);sk.rotate(-sk.PI/2);sk.text('Velocity (m/s) →',0,0);sk.pop();
    // Segments: uniform accel → constant → deceleration → rest
    const segs=[
      {x1:0,y1:0,x2:100,y2:100,col:[30,120,200],lbl:'Uniform\nacceleration',lx:50,ly:40},
      {x1:100,y1:100,x2:230,y2:100,col:[0,160,60],lbl:'Constant\nvelocity\n(no accel.)',lx:165,ly:70},
      {x1:230,y1:100,x2:330,y2:0,col:[200,80,30],lbl:'Uniform\ndeceleration',lx:280,ly:55},
      {x1:330,y1:0,x2:462,y2:0,col:[100,100,100],lbl:'At rest',lx:396,ly:-14},
    ];
    segs.forEach(seg=>{
      let x1=gx+seg.x1,y1=gy-seg.y1,x2=gx+seg.x2,y2=gy-seg.y2;
      sk.stroke(seg.col[0],seg.col[1],seg.col[2],220);sk.strokeWeight(3.5);sk.line(x1,y1,x2,y2);
      sk.noStroke();sk.fill(seg.col[0],seg.col[1],seg.col[2]);sk.textSize(9);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      seg.lbl.split('\n').forEach((l,i)=>sk.text(l,gx+seg.lx,gy-seg.ly+i*12));sk.textStyle(sk.NORMAL);
    });
    // Shaded area = displacement
    sk.fill(30,120,200,30);sk.noStroke();
    sk.beginShape();sk.vertex(gx,gy);sk.vertex(gx+100,gy-100);sk.vertex(gx+230,gy-100);sk.vertex(gx+330,gy);sk.vertex(gx,gy);sk.endShape(sk.CLOSE);
    sk.fill(30,120,200,150);sk.textSize(8.5);sk.textStyle(sk.ITALIC);sk.textAlign(sk.CENTER);
    sk.text('Area under graph = displacement',gx+gw/2,gy-12);sk.textStyle(sk.NORMAL);
    // Equations box above graph
    let ey=40;
    sk.fill(240,245,255,220);sk.stroke(30,60,200,80);sk.strokeWeight(1);sk.rect(14,ey,462,210,7);sk.noStroke();
    sk.fill(20,60,180);sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);
    sk.text('SUVAT Equations of Motion:',20,ey+14);sk.textStyle(sk.NORMAL);
    const eqs=[['v = u + at','(s: displacement, u: initial velocity, v: final velocity)'],['s = ut + ½at²','(a: acceleration, t: time)'],['v² = u² + 2as',''],['s = (u+v)/2 × t','']];
    eqs.forEach((eq,i)=>{
      sk.fill(20,60,180);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);sk.text(eq[0],20,ey+30+i*44);
      sk.fill(60);sk.textStyle(sk.NORMAL);sk.textSize(9.5);sk.text(eq[1],140,ey+30+i*44);
      if(i>0){
        sk.fill(30,120,200);sk.textSize(10.5);sk.textStyle(sk.BOLD);
        const extra=[['a = (v−u)/t','slope of v-t graph'],['s = area under v-t graph',''],['v² = u² + 2as','useful when t unknown'],['avg vel = ½(u+v)','for uniform acceleration']];
        sk.text(extra[i][0],20,ey+44+i*44);sk.textStyle(sk.NORMAL);sk.fill(80);sk.textSize(8.5);sk.text(extra[i][1],160,ey+44+i*44);
      }
    });
  }

  function drawMomentum(){
    sk.fill(20,60,180);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('Momentum & Newton\'s Laws',248,22);sk.textStyle(sk.NORMAL);
    // p = mv formula
    let fy=40;
    sk.fill(240,245,255,220);sk.stroke(30,60,200,80);sk.strokeWeight(1);sk.rect(14,fy,462,50,7);sk.noStroke();
    sk.fill(20,60,180);sk.textSize(14);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('p = mv          F = ma          Impulse = FΔt = Δp',248,fy+32);sk.textStyle(sk.NORMAL);
    // Collision animation
    let cy=160;
    let t2=((tick*0.3)%1);
    let c1x=30+t2*120,c2x=200+t2*40;
    sk.fill(20,60,200,200);sk.noStroke();sk.ellipse(c1x,cy,40,40);
    sk.fill(200,80,30,200);sk.ellipse(c2x,cy,50,50);
    sk.fill(20,60,200);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('m₁=2kg',c1x,cy+30);sk.text('v₁=6 m/s →',c1x,cy+44);
    sk.fill(200,80,30);sk.text('m₂=3kg',c2x,cy+34);sk.text('v₂=0',c2x,cy+48);sk.textStyle(sk.NORMAL);
    // Momentum arrows
    sk.stroke(20,60,200);sk.strokeWeight(2);sk.line(c1x+22,cy,c1x+60,cy);
    sk.noStroke();sk.fill(20,60,200);sk.triangle(c1x+60,cy-4,c1x+60,cy+4,c1x+70,cy);
    sk.fill(20,60,200);sk.textSize(9);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);sk.text('p₁=12 kg⋅m/s',c1x+72,cy+3);sk.textStyle(sk.NORMAL);
    // After collision
    let ax=320;
    sk.fill(180,80,200,200);sk.noStroke();sk.ellipse(ax+10,cy,92,42);
    sk.fill(255);sk.textSize(9);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('merged',ax+10,cy+3);sk.textStyle(sk.NORMAL);
    sk.fill(100,0,180);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('m=5kg  v=?',ax+10,cy+30);
    sk.text('v = 12/5 = 2.4 m/s →',ax+10,cy+46);sk.textStyle(sk.NORMAL);
    sk.stroke(100,0,180);sk.strokeWeight(2);sk.line(ax+56,cy,ax+80,cy);
    sk.noStroke();sk.fill(100,0,180);sk.triangle(ax+80,cy-4,ax+80,cy+4,ax+90,cy);
    // Conservation law box
    let cly=220;
    sk.fill(240,240,255,220);sk.stroke(60,0,160,80);sk.strokeWeight(1);sk.rect(14,cly,462,58,7);sk.noStroke();
    sk.fill(60,0,160);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('LAW OF CONSERVATION OF MOMENTUM:',248,cly+16);sk.textStyle(sk.NORMAL);
    sk.fill(30);sk.textSize(10.5);
    sk.text('Total momentum BEFORE collision = Total momentum AFTER collision',248,cly+34);
    sk.text('(provided no external forces act on the system)',248,cly+50);
    // Newton's laws
    let ny=290;
    sk.fill(245,250,255,220);sk.stroke(30,60,200,80);sk.strokeWeight(1);sk.rect(14,ny,462,212,7);sk.noStroke();
    sk.fill(20,60,180);sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);
    sk.text('NEWTON\'S LAWS OF MOTION:',20,ny+14);sk.textStyle(sk.NORMAL);
    const laws=[
      ['1st Law (Inertia):','An object remains at rest or uniform velocity UNLESS a resultant force acts on it.'],
      ['2nd Law (F=ma):','The resultant force on an object = mass × acceleration. (F in N, m in kg, a in m/s²)'],
      ['3rd Law:','For every action there is an equal and opposite reaction (same type of force, different objects).'],
    ];
    laws.forEach((l,i)=>{
      sk.fill(20,60,180);sk.textStyle(sk.BOLD);sk.textSize(10);sk.textAlign(sk.LEFT);sk.text(l[0],20,ny+36+i*56);
      sk.fill(30);sk.textStyle(sk.NORMAL);sk.textSize(10.5);sk.text(l[1],20,ny+52+i*56);
      sk.fill(80,120,200,60);sk.noStroke();sk.rect(14,ny+24+i*56,462,38);
    });
  }

  function drawEnergy(){
    sk.fill(20,60,180);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('Work, Energy & Power',248,22);sk.textStyle(sk.NORMAL);
    // Formulae
    let fy=40;
    sk.fill(240,245,255,220);sk.stroke(30,60,200,80);sk.strokeWeight(1);sk.rect(14,fy,462,55,7);sk.noStroke();
    sk.fill(20,60,180);sk.textSize(12);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('W = Fd      KE = ½mv²      GPE = mgh      P = W/t = Fv',248,fy+22);sk.textStyle(sk.NORMAL);
    sk.fill(30);sk.textSize(9.5);sk.text('W=work(J), F=force(N), d=distance(m), m=mass(kg), v=velocity(m/s), h=height(m)',248,fy+42);
    // Ball rolling down ramp
    let ry=108;let ramp_t=(tick*0.4)%1;
    sk.fill(180,180,200,180);sk.noStroke();
    sk.beginShape();sk.vertex(14,ry);sk.vertex(300,ry);sk.vertex(300,ry+170);sk.endShape(sk.CLOSE);
    let bx2=14+ramp_t*286,by2=ry+ramp_t*170-12;
    sk.fill(30,80,200,220);sk.noStroke();sk.ellipse(bx2,by2,24);
    // Labels on ramp
    let h2=170*(1-ramp_t);
    sk.stroke(200,60,30);sk.strokeWeight(1.5);sk.setLineDash([4,3]);sk.line(300,ry+170,300,by2);sk.setLineDash([]);
    sk.noStroke();sk.fill(200,60,30);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);
    sk.text('h = '+(h2/10).toFixed(1)+'m',308,by2+20);
    sk.fill(200,60,30);sk.text('GPE = '+((170-h2)*0.18).toFixed(1)+'J',308,by2+36);
    sk.fill(30,80,200);sk.text('KE = '+(h2*0.18).toFixed(1)+'J',308,by2+52);sk.textStyle(sk.NORMAL);
    // Conservation marker
    sk.fill(0,120,60);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('GPE + KE = constant (conservation of energy)',165,ry+195);sk.textStyle(sk.NORMAL);
    // Efficiency
    let eff=324;
    sk.fill(255,245,220,220);sk.stroke(180,100,0,80);sk.strokeWeight(1);sk.rect(14,eff,462,72,7);sk.noStroke();
    sk.fill(140,70,0);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('Efficiency = (useful output energy / total input energy) × 100%',248,eff+20);sk.textStyle(sk.NORMAL);
    sk.fill(30);sk.textSize(10);sk.text('Energy is NEVER created or destroyed, only transferred between stores.',248,eff+40);
    sk.text('Losses: usually heat from friction, sound, light',248,eff+56);
    // Worked examples
    let we=406;
    sk.fill(240,255,240,220);sk.stroke(0,120,60,80);sk.strokeWeight(1);sk.rect(14,we,462,98,7);sk.noStroke();
    sk.fill(0,80,40);sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);
    sk.text('WORKED EXAMPLES:',20,we+14);sk.textStyle(sk.NORMAL);
    sk.fill(30);sk.textSize(10.5);
    ['Ex 1: Force 50N moves box 8m. Work done = 50×8 = 400 J',
     'Ex 2: KE of 10kg car at 20m/s = ½×10×20² = 2000 J',
     'Ex 3: GPE of 5kg rock at 10m = 5×10×10 = 500 J  (g=10 N/kg)',
     'Ex 4: Power = 500J done in 25s → P = 500/25 = 20 W'].forEach((e,i)=>sk.text(e,20,we+30+i*18));
  }

  function drawGravity(){
    sk.fill(20,60,180);sk.textSize(11);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('Forces, Gravity & Equilibrium',248,22);sk.textStyle(sk.NORMAL);
    // Free body diagram
    let bx=160,by=180;
    sk.fill(180,140,80,200);sk.noStroke();sk.rect(bx-30,by-20,60,40,4);
    sk.fill(80,50,0);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    sk.text('OBJECT',bx,by+4);sk.textStyle(sk.NORMAL);
    // Weight down
    let wy=by+60;
    sk.stroke(200,30,30);sk.strokeWeight(3);sk.line(bx,by+20,bx,wy);
    sk.noStroke();sk.fill(200,30,30);sk.triangle(bx-6,wy,bx+6,wy,bx,wy+12);
    sk.fill(200,30,30);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);sk.text('Weight W=mg',bx,wy+26);sk.textStyle(sk.NORMAL);
    // Normal force up
    sk.stroke(30,120,200);sk.strokeWeight(3);sk.line(bx,by-20,bx,by-70);
    sk.noStroke();sk.fill(30,120,200);sk.triangle(bx-6,by-70,bx+6,by-70,bx,by-82);
    sk.fill(30,120,200);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);sk.text('Normal force N',bx,by-88);sk.textStyle(sk.NORMAL);
    // Friction left
    sk.stroke(0,160,80);sk.strokeWeight(3);sk.line(bx-32,by,bx-82,by);
    sk.noStroke();sk.fill(0,160,80);sk.triangle(bx-82,by-5,bx-82,by+5,bx-94,by);
    sk.fill(0,160,80);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);sk.text('Friction f',bx-100,by+16);sk.textStyle(sk.NORMAL);
    // Applied force right
    sk.stroke(200,80,200);sk.strokeWeight(3);sk.line(bx+32,by,bx+82,by);
    sk.noStroke();sk.fill(200,80,200);sk.triangle(bx+82,by-5,bx+82,by+5,bx+94,by);
    sk.fill(200,80,200);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);sk.text('Applied F',bx+108,by+16);sk.textStyle(sk.NORMAL);
    // Equations
    let ey=280;
    sk.fill(240,245,255,220);sk.stroke(30,60,200,80);sk.strokeWeight(1);sk.rect(14,ey,462,220,7);sk.noStroke();
    sk.fill(20,60,180);sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);
    sk.text('KEY EQUATIONS & CONCEPTS:',20,ey+14);sk.textStyle(sk.NORMAL);
    const concepts=[
      ['Weight','W = mg  (g = 10 N/kg on Earth, 1.6 N/kg on Moon)'],
      ['Mass vs Weight','Mass (kg) = amount of matter. Weight (N) = gravitational force.'],
      ['Resultant force','Vector sum of all forces on an object.'],
      ['Equilibrium','Net force = 0, net torque = 0. Object at rest or constant velocity.'],
      ['Pressure','P = F/A  (Pa). Pressure in fluids: P = ρgh'],
      ['Density','ρ = m/V  (kg/m³)'],
      ['Friction','Force opposing relative motion between surfaces.'],
      ['Drag','Air/fluid resistance. Increases with speed.'],
      ['Terminal velocity','When drag = weight → no net force → constant velocity.'],
    ];
    concepts.forEach((c,i)=>{
      sk.fill(20,60,180);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);sk.text(c[0]+':',20,ey+32+i*20);
      sk.fill(30);sk.textStyle(sk.NORMAL);sk.textSize(9.5);sk.text(c[1],100,ey+32+i*20);
    });
  }

  function drawInfoPanel(){
    let px=498,py=8,pw=374,ph=494;let c=[20,60,180];
    sk.fill(255,255,255,240);sk.stroke(c[0],c[1],c[2]);sk.strokeWeight(2.5);
    sk.rect(px,py,pw,ph,10);sk.noStroke();
    sk.fill(c[0],c[1],c[2],210);sk.rect(px+8,py+8,pw-16,34,7);
    sk.fill(255);sk.textSize(13);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
    const titles=['Motion Graphs','Momentum','Energy & Work','Gravity & Forces'];
    sk.text(titles[tab],px+pw/2,py+30);sk.textStyle(sk.NORMAL);
    let sy=py+52;
    const allBoxes=[
      [{t:'Speed, Velocity, Acceleration',b:'Speed: how fast (scalar, m/s).\nVelocity: speed in a direction (vector, m/s).\nAcceleration: rate of change of velocity (m/s²).'},{t:'Displacement-Time Graph',b:'Slope (gradient) = velocity.\nFlat line = at rest.\nCurving = acceleration.'},{t:'Velocity-Time Graph',b:'Slope = acceleration.\nArea under = displacement.\nFlat line = constant velocity.'},{t:'Free Fall',b:'Objects fall at same rate regardless of mass.\ng ≈ 10 m/s² on Earth surface.\nIgnoring air resistance: a = g for all objects.'}],
      [{t:'Momentum (p = mv)',b:'Momentum = mass × velocity.\nUnit: kg⋅m/s. Vector quantity.\nDirection matters — define positive direction.'},{t:'Conservation of Momentum',b:'Applies to closed systems (no external forces).\nTotal p before = total p after.\nApplies to explosions AND collisions.'},{t:'Impulse',b:'Impulse = FΔt = change in momentum.\nUnit: N⋅s = kg⋅m/s.\nLonger collision time → smaller force (airbags, helmets).'},{t:'Elastic vs Inelastic',b:'Elastic: KE conserved (bouncy ball).\nInelastic: KE lost to heat/sound/deformation.\nMomentum conserved in BOTH types.'}],
      [{t:'Law of Conservation of Energy',b:'Energy cannot be created or destroyed.\nIt is only converted from one form to another.\nTotal energy in a closed system = constant.'},{t:'Energy Forms',b:'Kinetic, Gravitational PE, Elastic PE, Chemical,\nElectrical, Thermal, Radiant, Nuclear.'},{t:'Work Done',b:'W = Fd × cos(θ)\nWork done ONLY when force has a component in the direction of motion.\nUnit: joule (J) = N⋅m.'},{t:'Power',b:'Power = energy transferred per unit time.\nP = W/t = Fv\nUnit: watt (W). 1W = 1 J/s.'}],
      [{t:'Newton\'s Law of Gravitation',b:'Every mass attracts every other mass.\nF = Gm₁m₂/r²\nStrong at small distances, weakens with distance².'},{t:'Weight & Mass',b:'W = mg (g = gravitational field strength).\ng = 10 N/kg on Earth, 1.6 on Moon.\nMass is same everywhere; weight varies.'},{t:'Pressure',b:'P = F/A.  Units: Pa = N/m²\nFluid pressure: P = ρgh\nBuoyancy: upthrust = weight of displaced fluid.'},{t:'Moments & Equilibrium',b:'Moment = Force × perpendicular distance.\nFor equilibrium: sum of clockwise moments =\nsum of anticlockwise moments.'}],
    ];
    allBoxes[tab].forEach(box=>{
      let lines=box.b.split('\n');let bh=16+lines.length*14+8;
      sk.fill(c[0],c[1],c[2],18);sk.stroke(c[0],c[1],c[2],60);sk.strokeWeight(1);
      sk.rect(px+10,sy,pw-20,bh,6);sk.noStroke();
      sk.fill(c[0],c[1],c[2]);sk.textSize(9.5);sk.textStyle(sk.BOLD);sk.textAlign(sk.LEFT);
      sk.text(box.t,px+16,sy+13);sk.textStyle(sk.NORMAL);
      sk.fill(30);sk.textSize(10.5);lines.forEach((l,i)=>sk.text(l,px+16,sy+27+i*14));
      sy+=bh+10;
    });
  }
  sk.mouseClicked=()=>{ if(mechMcq){ mechMcqClick(sk.mouseX,sk.mouseY); } };
  sk.setLineDash=a=>sk.drawingContext.setLineDash(a);
});
</script>
