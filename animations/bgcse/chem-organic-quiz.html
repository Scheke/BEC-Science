<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Organic Chemistry Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Organic Chemistry — BGCSE Chemistry Quiz',
  color:'#33691e',dark:'#003d00',light:'#f1f8e9',
    mcq:[
    {q:'Which homologous series has the general formula CₙH₂ₙ₊₂?',opts:['Alkenes','Alkanes','Alkynes','Alcohols'],ans:1,exp:'ALKANES have the general formula CₙH₂ₙ₊₂. They are saturated hydrocarbons (single C-C bonds only). Examples: methane CH₄ (n=1), ethane C₂H₆ (n=2), propane C₃H₈ (n=3).'},
    {q:'Alkenes differ from alkanes because alkenes:',opts:['Contain only C and H','Have higher melting points','Contain at least one C=C double bond','React only with oxygen'],ans:2,exp:'ALKENES (CₙH₂ₙ) contain at least one C=C DOUBLE BOND. This makes them UNSATURATED and much more reactive than alkanes, especially in addition reactions.'},
    {q:'The test for unsaturation (C=C bond) uses:',opts:['Universal indicator','Bromine water — decolourises from orange to colourless','Lime water','Fehling\'s solution'],ans:1,exp:'BROMINE WATER (orange) is decolourised to COLOURLESS when added to an alkene. The Br₂ adds across the C=C double bond (addition reaction). Alkanes do NOT decolourise bromine water.'},
    {q:'Polymerisation of ethene produces:',opts:['Ethanol','Poly(ethene) — a plastic','Methane','Ethanoic acid'],ans:1,exp:'ADDITION POLYMERISATION of ethene (CH₂=CH₂) produces POLY(ETHENE) — also called polyethylene or polythene. Many ethene monomers join together, breaking the C=C bond to form long polymer chains.'},
    {q:'Fermentation produces ethanol from glucose using:',opts:['High temperature and pressure','Yeast enzyme at ~30°C','An acid catalyst','Electrolysis'],ans:1,exp:'FERMENTATION: glucose + YEAST (enzymes) → ethanol + CO₂. Conditions: ~30°C, absence of oxygen (anaerobic). The ethanol produced is the basis of alcoholic beverages.'},
    {q:'Fractional distillation of crude oil separates it based on:',opts:['Colour differences','Different boiling points (related to chain length)','Density differences','Melting point'],ans:1,exp:'FRACTIONAL DISTILLATION separates crude oil into FRACTIONS based on different BOILING POINTS. Longer carbon chain = higher boiling point. Fractions (from top to bottom of column): gases, petrol, kerosene, diesel, fuel oil, bitumen.'},
    {q:'The general formula for an alkene is:',opts:['CₙH₂ₙ₊₂','CₙH₂ₙ','CₙH₂ₙ₋₂','CₙH₂ₙ₊₁OH'],ans:1,exp:'ALKENES have the general formula CₙH₂ₙ. They contain one C=C double bond. The simplest alkene is ethene (C₂H₄). Propene is C₃H₆. They have two fewer hydrogen atoms than the corresponding alkane.'},
    {q:'Which of the following is a saturated hydrocarbon?',opts:['Ethene','Propene','Ethane','Butene'],ans:2,exp:'ETHANE (C₂H₆) is an ALKANE. It contains only single C-C bonds, making it SATURATED (all carbon valencies are filled with hydrogen). Ethene, propene, and butene contain double bonds and are unsaturated.'},
    {q:'The products of the complete combustion of a hydrocarbon are:',opts:['Carbon monoxide and water','Carbon dioxide and water','Carbon and hydrogen','Carbon dioxide and hydrogen'],ans:1,exp:'COMPLETE combustion (in excess oxygen) produces CARBON DIOXIDE (CO₂) and WATER (H₂O). In limited oxygen, incomplete combustion occurs, producing poisonous CARBON MONOXIDE (CO) and soot (carbon).'},
    {q:'In fractional distillation, which fraction has the lowest boiling point?',opts:['Bitumen','Diesel','Petrol','Kerosene'],ans:2,exp:'PETROL has very short carbon chains (C₅–C₁₀), so it has the LOWEST boiling point among these options. It rises to the top of the distillation tower. Bitumen (C₆₀+) has the highest boiling point and is collected at the bottom.'},
    {q:'The monomers used to produce poly(propene) are:',opts:['Ethene','Propane','Propene','Polypropene'],ans:2,exp:'POLY(PROPENE) is made from the monomer PROPENE (C₃H₆). During addition polymerisation, the C=C double bond in the propene monomers opens up, allowing them to join together into a long chain.'},
    {q:'The functional group of an alcohol is:',opts:['-CO-','-OH','-COOH','-NH₂'],ans:1,exp:'The functional group of ALCOHOLS is the HYDROXYL GROUP (-OH). It is bonded to a carbon atom. For example, ethanol (C₂H₅OH) is an alcohol used in alcoholic drinks and as a fuel.'},
    {q:'Cracking in the petroleum industry is used to:',opts:['Combine small molecules into larger ones','Break long-chain hydrocarbons into shorter, more useful ones','Remove impurities from crude oil','Distill crude oil into fractions'],ans:1,exp:'CRACKING is a chemical process where long-chain hydrocarbons (less useful) are broken down into smaller, more useful molecules like petrol and alkenes. It is usually done with a catalyst and high temperatures.'},
    {q:'When bromine water is added to a sample of propane (an alkane), what is observed?',opts:['The orange colour decolourises','The orange colour remains unchanged','A white precipitate forms','Effervescence occurs'],ans:1,exp:'PROPANE is an ALKANE (saturated). It does NOT react with bromine water. The orange colour remains unchanged. Only alkenes (unsaturated with C=C bonds) decolourise bromine water via an addition reaction.'},
    {q:'Ethanol can be converted to ethanoic acid by:',opts:['Fermentation','Oxidation using an oxidising agent (e.g., potassium dichromate)','Distillation','Neutralisation'],ans:1,exp:'ETHANOL can be OXIDISED to ETHANOIC ACID using an oxidising agent (e.g., acidified potassium dichromate). The -OH group is oxidised to -COOH, producing an organic acid.'},
    {q:'Monomers are:',opts:['Long chains of polymers','Small molecules that join together to form polymers','The products of combustion','Waste products of crude oil'],ans:1,exp:'MONOMERS are small, simple molecules that react together to form long chain molecules called POLYMERS. In addition polymerisation, monomers must contain a C=C double bond to open up and link together.'},
    {q:'The major environmental concern regarding the combustion of fossil fuels is:',opts:['The production of oxygen','The release of greenhouse gases (CO₂) and pollutants','The production of water vapor','The depletion of nitrogen'],ans:1,exp:'Burning fossil fuels releases large amounts of CARBON DIOXIDE (CO₂), a major greenhouse gas contributing to global warming. It also releases pollutants like sulfur dioxide (causes acid rain) and nitrogen oxides.'},
    {q:'Which of the following is NOT a naturally occurring hydrocarbon?',opts:['Methane','Crude oil','Poly(ethene)','Natural gas'],ans:2,exp:'POLY(ETHENE) is a synthetic plastic made by addition polymerisation of ethene. It is man-made. Methane, crude oil, and natural gas are naturally occurring fossil fuels found in the earth.'},
    {q:'In the addition reaction between ethene and hydrogen bromide (HBr), the product is:',opts:['Ethane','Bromoethane','Ethanol','Ethanoic acid'],ans:1,exp:'Ethene (CH₂=CH₂) reacts with HBr in an addition reaction. The C=C double bond opens up, and H and Br add across the carbon atoms. The product is BROMOETHANE (C₂H₅Br).'},
    {q:'Why is ethanol mixed with petrol to form "gasohol"?',opts:['To increase the boiling point','To act as a renewable fuel additive, reducing dependence on fossil fuels','To increase the density','To make the fuel colourless'],ans:1,exp:'ETHANOL can be produced by fermentation of crops (renewable). It is mixed with petrol to form GASOHOL. This reduces the reliance on non-renewable fossil fuels, reduces CO₂ emissions (as the plants absorbed CO₂ during growth), and acts as an oxygenator.'},
  ],
  match:[
    {term:'Alkane',def:'Saturated hydrocarbon with general formula CₙH₂ₙ₊₂ and single bonds only'},
    {term:'Alkene',def:'Unsaturated hydrocarbon with general formula CₙH₂ₙ and a C=C double bond'},
    {term:'Alcohol',def:'Organic compound containing the -OH (hydroxyl) functional group'},
    {term:'Carboxylic acid',def:'Organic compound containing the -COOH (carboxyl) functional group'},
    {term:'Polymerisation',def:'The process of many small monomers joining to form a long chain polymer'},
    {term:'Fermentation',def:'Anaerobic process: glucose → ethanol + CO₂, using yeast enzymes at ~30°C'},
    {term:'Cracking',def:'Breaking large hydrocarbon molecules into smaller, more useful ones using heat and a catalyst'},
    {term:'Fractional distillation',def:'Separation of crude oil into fractions based on different boiling points'},
    {term:'Functional group',def:'A specific group of atoms within a molecule that determines its chemical properties and reactions'},
    {term:'Hydrocarbon',def:'A compound made entirely of hydrogen and carbon atoms'},
    {term:'Saturated',def:'Containing only single covalent bonds (e.g., alkanes)'},
    {term:'Unsaturated',def:'Containing one or more double or triple bonds (e.g., alkenes)'},
    {term:'Bromine water',def:'Orange/brown reagent used to test for unsaturation (decolourises in alkenes)'},
    {term:'Monomer',def:'A small molecule that can join with many others to form a polymer'},
    {term:'Polymer',def:'A long chain molecule made from many repeating monomer units'},
    {term:'Addition polymerisation',def:'Polymerisation where monomers with C=C bonds join without losing any small molecules'},
    {term:'Condensation polymerisation',def:'Polymerisation where monomers join with the loss of a small molecule (e.g., H₂O, HCl)'},
    {term:'Complete combustion',def:'Burning a hydrocarbon in excess oxygen to produce CO₂ and H₂O'},
    {term:'Incomplete combustion',def:'Burning a hydrocarbon in limited oxygen to produce toxic CO and/or carbon/soot'},
    {term:'Gasohol',def:'A fuel blend consisting of petrol (gasoline) and ethanol'},
  ],
  flashcards:[
    {q:'What is a homologous series?',a:'A HOMOLOGOUS SERIES is a group of organic compounds with the same GENERAL FORMULA, same FUNCTIONAL GROUP, and similar chemical properties. Each member differs by a CH₂ unit. Physical properties (like boiling point) change gradually as the chain length increases.'},
    {q:'State the conditions for the addition of hydrogen to an alkene.',a:'Hydrogenation: alkene (CₙH₂ₙ) + H₂ → alkane (CₙH₂ₙ₊₂). Conditions: NICKEL CATALYST and a temperature of approximately 200°C. This process is used to convert unsaturated vegetable oils into solid fats for making margarine.'},
    {q:'What is the difference between addition polymerisation and condensation polymerisation?',a:'ADDITION polymerisation: monomers with C=C double bonds join together; NO small molecules are lost (e.g., ethene → poly(ethene)). CONDENSATION polymerisation: different monomers react; a small molecule like H₂O or HCl is eliminated with each link formed (e.g., nylon, polyester, proteins).'},
    {q:'Name the main fractions from crude oil distillation and their uses.',a:'1. Refinery gas (LPG) — fuel for cooking/heating. 2. Petrol/Gasoline — car fuel. 3. Naphtha — chemical feedstock. 4. Kerosene — jet fuel. 5. Diesel — fuel for heavy vehicles. 6. Fuel oil — ships and power stations. 7. Bitumen — road surfacing and roofing.'},
    {q:'What is the test for unsaturation?',a:'Add BROMINE WATER (which is orange/brown). If the compound is an ALKENE (unsaturated), the bromine water is decolourised to COLOURLESS. This occurs because the Br₂ adds across the C=C bond. If the compound is an alkane (saturated), the orange colour remains unchanged.'},
    {q:'What are the products of complete and incomplete combustion?',a:'COMPLETE combustion (excess oxygen): Hydrocarbon + O₂ → CO₂ + H₂O. INCOMPLETE combustion (limited oxygen): produces CARBON MONOXIDE (CO, which is toxic) and/or carbon/soot particles. Incomplete combustion is dangerous because of the carbon monoxide.'},
    {q:'Explain why alkenes are more reactive than alkanes.',a:'Alkenes contain a C=C DOUBLE BOND. The electrons in the double bond are exposed and less stable, making them susceptible to electrophilic attack. This allows alkenes to undergo ADDITION reactions, where atoms add across the double bond. Alkanes, with only single bonds, are much less reactive.'},
    {q:'Describe the industrial process of cracking.',a:'CRACKING is a thermal decomposition process. Long-chain hydrocarbons (high boiling points, low demand) are heated to high temperatures (~600°C) with a catalyst (like zeolite or silica-alumina). The long chains break into shorter, more valuable alkanes and alkenes (e.g., used for petrol and plastics).'},
    {q:'Why are alkenes used as the starting materials for making polymers?',a:'Alkenes contain a C=C DOUBLE BOND. Under the right conditions (heat and a catalyst), this double bond can open up. The monomers can then link together end-to-end, forming long chains of polyalkenes (addition polymers) like poly(ethene) and poly(propene), which are the basis of many plastics.'},
    {q:'Describe the conditions needed for fermentation to produce ethanol.',a:'1. Glucose solution. 2. Yeast (which provides the enzymes zymase). 3. Anaerobic conditions (no oxygen). 4. Warm temperature (~30°C). The process produces ethanol and carbon dioxide: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂.'},
    {q:'Why is incomplete combustion of a hydrocarbon dangerous?',a:'Incomplete combustion occurs in limited oxygen. It produces CARBON MONOXIDE (CO) — a colourless, odourless, and highly TOXIC gas. Carbon monoxide binds irreversibly to haemoglobin, preventing oxygen transport in the blood, which can be fatal.'},
    {q:'How does fractional distillation separate crude oil into useful fractions?',a:'Crude oil is heated to evaporate it. The vapours rise up a tall tower which is cooler at the top. Compounds with shorter carbon chains have LOWER BOILING POINTS, so they rise to the top and condense. Longer chains have higher boiling points and condense lower down in the tower.'},
    {q:'What is the difference between a saturated and an unsaturated hydrocarbon?',a:'SATURATED hydrocarbons (alkanes) contain only single C-C bonds; all available bonds are full. UNSATURATED hydrocarbons (alkenes) contain at least one C=C double bond; they can add more atoms across the double bond.'},
    {q:'Why are alkanes generally unreactive?',a:'Alkanes have strong, non-polar C-C and C-H single covalent bonds. The electrons are tightly held in the bonds. They do not have an exposed electron-rich area like the C=C bond in alkenes, making them unable to undergo addition reactions. They primarily burn (combustion).'},
    {q:'State the word equation for the complete combustion of methane.',a:'Methane + Oxygen → Carbon dioxide + Water. Balanced equation: CH₄ + 2O₂ → CO₂ + 2H₂O. This is a highly exothermic reaction that releases heat energy, which is why methane is used as a fuel.'},
    {q:'What functional group is found in carboxylic acids?',a:'The CARBOXYL group (-COOH). It consists of a carbonyl group (C=O) and a hydroxyl group (-OH) attached to the same carbon atom. Examples include ethanoic acid (CH₃COOH), found in vinegar.'},
    {q:'How can ethanol be produced synthetically (not by fermentation)?',a:'Ethanol can be produced via the HYDRATION (addition of water) of ethene: C₂H₄ + H₂O → C₂H₅OH. This requires a phosphoric acid catalyst and high temperature/pressure. This is a industrial method, unlike fermentation which uses biological yeast.'},
    {q:'Describe the environmental advantages of using ethanol as a fuel.',a:'Ethanol is considered RENEWABLE because it is produced by fermenting crops (like sugarcane or corn). The CO₂ released when it burns is offset by the CO₂ the crops absorbed during photosynthesis, leading to a lower net carbon footprint compared to fossil fuels.'},
    {q:'Why does petrol have a lower boiling point than diesel?',a:'Petrol is made up of shorter hydrocarbon chains (typically C₅–C₁₀) compared to diesel (C₁₀–C₂₀). Shorter molecules have weaker intermolecular forces, so they require less energy to boil — hence a lower boiling point.'},
    {q:'What is the "cracking" process and why is it important in the petrochemical industry?',a:'Cracking is breaking down large, heavy hydrocarbon molecules into smaller, more valuable ones like petrol and alkenes. It is crucial because it balances supply and demand: heavy fractions (like fuel oil) are low-demand, while smaller fractions (like petrol and alkenes for plastics) are high-demand.'},
  ],
  blanks:{
    passage:'Alkanes are saturated hydrocarbons with the general formula [_]. Alkenes contain a [_] bond, making them unsaturated and more reactive. The test for an alkene is to add [_] water, which decolourises from orange to colourless. [_] of crude oil separates it into fractions based on different boiling points. [_] is a biological process that uses yeast to convert glucose into ethanol, which is used in alcoholic drinks and as a biofuel.',
    answers:['CₙH₂ₙ₊₂','C=C','bromine','Fractional distillation','Fermentation'],
    wordbank:['CₙH₂ₙ₊₂','C=C','bromine','Fractional distillation','Fermentation','CₙH₂ₙ','polymerisation','cracking'],
  },
  sentences:[
    {prompt:'Explain why alkenes are chemically more reactive than alkanes.',keywords:['C=C','double bond','unsaturated','addition','reaction','bromine','water'],hint:'What structural feature makes alkenes reactive? What specific type of chemical reaction do they undergo that alkanes do not?'},
    {prompt:'Describe how ethanol is produced by fermentation and state the necessary conditions.',keywords:['glucose','yeast','enzymes','30°C','anaerobic','oxygen','absence','CO₂'],hint:'What are the starting materials? What is the optimal temperature? Does oxygen need to be present?'},
    {prompt:'Explain why fractional distillation of crude oil produces fractions with different physical properties.',keywords:['chain length','boiling point','intermolecular forces','evaporate','condense','column','temperature gradient'],hint:'How does the length of the carbon chain affect the intermolecular forces and, consequently, the boiling point?'},
    {prompt:'Describe the addition polymerisation of ethene to form poly(ethene).',keywords:['ethene','monomer','C=C','double bond','open','polymer','poly(ethene)'],hint:'What happens to the double bond in the monomer to allow it to link up into a long chain?'},
    {prompt:'Compare and contrast the products of complete combustion and incomplete combustion of hydrocarbons.',keywords:['complete','excess','oxygen','CO₂','water','incomplete','limited','CO','toxic','soot'],hint:'What happens to the carbon when there is plenty of oxygen, versus when there is a shortage of oxygen?'},
    {prompt:'Explain why bromine water is used to distinguish between an alkane and an alkene.',keywords:['bromine water','orange','decolourise','colourless','alkene','C=C','addition','alkane','no reaction'],hint:'What is the observation for each, and what chemical reaction causes the observed change?'},
    {prompt:'Describe the process of cracking in the petroleum industry and explain why it is economically important.',keywords:['cracking','long chain','short chain','valuable','petrol','alkenes','catalyst','heat'],hint:'What type of molecules are fed into the cracker, and what are the desired products?'},
    {prompt:'Explain why ethanol is mixed with petrol to produce "gasohol".',keywords:['ethanol','renewable','biofuel','petrol','gasohol','reduce','fossil','fuels','CO₂'],hint:'What is the source of ethanol, and what is the environmental benefit of adding it to petrol?'},
    {prompt:'What is a homologous series? Give an example and state how the properties change as the series is ascended.',keywords:['homologous series','general formula','functional group','CH₂','boiling point','increases'],hint:'What are the three defining features of a homologous series? How does the chain length affect physical properties?'},
    {prompt:'Write the balanced equation for the complete combustion of propane (C₃H₈).',keywords:['C₃H₈','O₂','CO₂','H₂O','combustion','complete','balanced'],hint:'What are the products of complete combustion? Balance the carbon, hydrogen, and oxygen atoms on both sides of the equation.'},
    {prompt:'Describe how an alkene can be converted to an alcohol via hydration.',keywords:['alkene','ethene','hydration','water','H₂O','phosphoric acid','catalyst','ethanol'],hint:'What is added to the alkene to make an alcohol, and what is the industrial catalyst used?'},
    {prompt:'Explain why it is crucial to separate crude oil into fractions rather than burning it as a whole.',keywords:['crude oil','fractions','different properties','efficient','uses','petrol','diesel','bitumen'],hint:'Do the different hydrocarbons in crude oil all serve the same purpose? Why is separation beneficial?'},
    {prompt:'Give the molecular formula, name, and structural formula of the first member of the alkane series.',keywords:['CH₄','methane','alkane','single bond','structural','tetrahedral'],hint:'What is the first alkane? Draw or describe its structure showing the single bonds.'},
    {prompt:'Explain why alkenes are used as the starting materials for making plastics.',keywords:['alkenes','C=C','polymerisation','addition','monomers','plastics','poly(ethene)'],hint:'What feature of alkenes allows them to join together into long chains, and what type of polymerisation is this?'},
    {prompt:'Compare the advantages and disadvantages of using ethanol as a fuel compared to petrol.',keywords:['ethanol','renewable','biofuel','CO₂','neutral','petrol','energy','density','crops'],hint:'Think about its source (renewable vs non-renewable), its environmental impact, and its energy content.'},
    {prompt:'Define a functional group and give an example of one found in alcohols.',keywords:['functional group','chemical properties','reactivity','alcohol','-OH','hydroxyl'],hint:'What is the functional group that defines alcohols? How does this group determine how the molecule reacts?'},
    {prompt:'Describe the conditions and products of the fermentation of glucose.',keywords:['glucose','yeast','zymase','anaerobic','30°C','ethanol','CO₂'],hint:'What biological agent is used, what temperature is optimal, and what is the gas given off?'},
    {prompt:'Explain why the boiling points of alkanes increase as the number of carbon atoms increases.',keywords:['carbon chain','intermolecular forces','Van der Waals','surface area','boiling point','increase'],hint:'What happens to the strength of the intermolecular forces when the molecule becomes larger and longer?'},
    {prompt:'What environmental problems are associated with the combustion of fossil fuels?',keywords:['CO₂','greenhouse','global warming','SO₂','acid rain','pollution','particulates'],hint:'Besides carbon dioxide, what other harmful gases and particles are released when fossil fuels are burned?'},
    {prompt:'What is the difference between an alkane and an alkene in terms of their general formulas and chemical reactivity?',keywords:['alkane','CₙH₂ₙ₊₂','saturated','unreactive','alkene','CₙH₂ₙ','unsaturated','reactive','addition'],hint:'Compare their formulas (do they have the same ratio of carbon to hydrogen?) and compare their major chemical reaction types.'},
  ],
});
</script></body></html>
