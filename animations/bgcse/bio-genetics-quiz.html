<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Genetics Quiz</title></head><body>
<script src="../quiz-engine.js"></script>
<script>
initQuiz({
  title:'Genetics — BGCSE Biology Quiz',
  color:'#1565c0',dark:'#003c8f',light:'#e3f2fd',
  mcq:[
    {q:'A dominant allele is one that:',opts:['Only appears in homozygous organisms','Always expressed even with one copy','Causes disease','Is recessive in heterozygotes'],ans:1,exp:'A DOMINANT allele is always expressed in the phenotype, even when only one copy is present (i.e., in heterozygotes). Represented by a capital letter (e.g., T).'},
    {q:'An organism that is homozygous dominant has genotype:',opts:['Tt','tt','TT','Tr'],ans:2,exp:'HOMOZYGOUS DOMINANT means both alleles are the same dominant allele — TT. Homozygous recessive = tt. Heterozygous = Tt.'},
    {q:'If both parents are Tt (heterozygous), the probability of a homozygous recessive offspring is:',opts:['0%','25%','50%','75%'],ans:1,exp:'Tt × Tt cross gives: TT : 2Tt : tt = 1:2:1 ratio. So 1/4 = 25% chance of homozygous recessive (tt).'},
    {q:'Sex chromosomes in a human male are:',opts:['XX','XY','YY','XO'],ans:1,exp:'Human males have XY sex chromosomes. Females have XX. The Y chromosome carries the SRY gene that triggers male development.'},
    {q:'Meiosis differs from mitosis because meiosis:',opts:['Produces identical cells','Occurs only in skin cells','Produces 4 haploid cells with genetic variation','Doubles the chromosome number'],ans:2,exp:'MEIOSIS produces 4 haploid (n) cells with genetic variation (through crossing over and independent assortment). Mitosis produces 2 diploid (2n) identical cells for growth and repair.'},
    {q:'A mutation is:',opts:['A change in phenotype only','A change in the DNA base sequence','Always harmful','Caused only by radiation'],ans:1,exp:'A MUTATION is a change in the DNA base sequence. It may be spontaneous or caused by mutagens (radiation, certain chemicals). Mutations can be harmful, neutral, or rarely beneficial.'},
    {q:'In a monohybrid cross between TT and tt, all offspring will be:',opts:['TT','tt','Tt','50% TT and 50% tt'],ans:2,exp:'TT (dominant parent) × tt (recessive parent) produces all Tt offspring (100% heterozygous). All offspring will express the dominant phenotype.'},
    {q:'Which of the following is an example of a discontinuous variation?',opts:['Human height','Blood group','Weight of dogs','Skin colour'],ans:1,exp:'DISCONTINUOUS variation has distinct categories with no intermediates (e.g., blood groups A, B, AB, O; tongue rolling). Height, weight, and skin colour show CONTINUOUS variation (a spectrum).'},
    {q:'The physical appearance of an organism is its:',opts:['Genotype','Phenotype','Allele','Chromosome'],ans:1,exp:'PHENOTYPE is the observable physical characteristic (e.g., eye colour, height). Genotype is the genetic code inside the cells.'},
    {q:'A carrier of a recessive genetic disorder has the genotype:',opts:['AA','aa','Aa','aA'],ans:2,exp:'A CARRIER is heterozygous (Aa). They do not express the disease because the dominant allele (A) masks the recessive allele (a), but they can pass the recessive allele to their offspring.'},
    {q:'During meiosis, crossing over occurs in:',opts:['Prophase I','Metaphase II','Anaphase I','Telophase II'],ans:0,exp:'CROSSING OVER occurs during PROPHASE I of meiosis. Homologous chromosomes pair up and exchange genetic material, creating new combinations of alleles and increasing genetic variation.'},
    {q:'If a father has blood type AB and the mother has blood type O, what is the probability of a child having blood type B?',opts:['0%','25%','50%','75%'],ans:2,exp:'Father (IAIB) × Mother (ii) gives offspring: 50% IAi (Type A) and 50% IBi (Type B). Therefore, there is a 50% chance of a child having blood type B.'},
    {q:'Which of these is NOT a source of genetic variation?',opts:['Mutations','Independent assortment','Crossing over','Mitosis'],ans:3,exp:'MITOSIS produces exact identical copies of cells and does NOT create genetic variation. Mutations, independent assortment, and crossing over during meiosis are the main sources of genetic variation.'},
    {q:'The term "homozygous" means:',opts:['Having two different alleles','Having two identical alleles','Having a dominant allele','Having a recessive allele'],ans:1,exp:'HOMOZYGOUS means the organism possesses two identical alleles for a specific gene (e.g., TT or tt). Heterozygous means two different alleles (Tt).'},
    {q:'In a pedigree chart, a shaded symbol represents:',opts:['A carrier of the trait','An individual expressing the trait','An unaffected individual','A male individual'],ans:1,exp:'In pedigree charts, SHADED shapes represent individuals who express the trait (phenotype) being tracked. Unshaded shapes represent unaffected individuals.'},
    {q:'The chromosome number in human gametes (sperm and egg) is:',opts:['46','23','44','92'],ans:1,exp:'Human gametes are HAPLOID (n) and contain 23 chromosomes. Somatic (body) cells are DIPLOID (2n) and contain 46 chromosomes.'},
    {q:'What is a test cross used for?',opts:['To determine the sex of an offspring','To determine if an organism is homozygous dominant or heterozygous','To create new mutations','To clone an organism'],ans:1,exp:'A TEST CROSS involves crossing an organism showing the dominant phenotype (unknown genotype TT or Tt) with a homozygous recessive organism (tt). The offspring ratios reveal the unknown genotype.'},
    {q:'Which genetic term describes two different forms of the same gene?',opts:['Genotype','Phenotype','Allele','Chromosome'],ans:2,exp:'An ALLELE is an alternative form of a gene. For example, the gene for eye colour may have a blue allele and a brown allele.'},
    {q:'An example of a sex-linked trait in humans is:',opts:['Blood type','Tongue rolling','Colour blindness','Height'],ans:2,exp:'COLOUR BLINDNESS is sex-linked because the gene is located on the X chromosome. Males (XY) are more likely to express it because they only have one X chromosome.'},
    {q:'If a trait is X-linked recessive, which parent must pass the affected X chromosome to a affected son?',opts:['Father','Mother','Both parents','Neither parent'],ans:1,exp:'A son inherits his Y chromosome from his father and his X chromosome from his MOTHER. Therefore, an affected son must inherit the affected X chromosome from his mother (who is either a carrier or affected).'},
  ],
  match:[
    {term:'Genotype',def:'The alleles an organism carries (genetic makeup)'},
    {term:'Phenotype',def:'The observable physical characteristics of an organism'},
    {term:'Homozygous',def:'Carrying two identical alleles for a gene'},
    {term:'Heterozygous',def:'Carrying two different alleles for a gene'},
    {term:'Dominant',def:'Allele expressed in the phenotype even when only one copy is present'},
    {term:'Recessive',def:'Allele only expressed in the phenotype when two copies are present'},
    {term:'Allele',def:'Different forms of the same gene (e.g., blue vs brown eye alleles)'},
    {term:'Haploid',def:'Cell containing one complete set of chromosomes (n), e.g., gametes'},
    {term:'Diploid',def:'Cell containing two complete sets of chromosomes (2n), e.g., body cells'},
    {term:'Meiosis',def:'Cell division producing 4 genetically variable haploid gametes'},
    {term:'Mitosis',def:'Cell division producing 2 genetically identical diploid cells for growth/repair'},
    {term:'Carrier',def:'Heterozygous individual who carries a recessive allele but does not express the trait'},
    {term:'Mutation',def:'A random change in the base sequence of DNA'},
    {term:'Mutagen',def:'An agent that increases the rate of mutations (e.g., UV radiation, chemicals)'},
    {term:'Continuous variation',def:'Variation with a full range of intermediate types (e.g., height, weight)'},
    {term:'Discontinuous variation',def:'Variation with distinct, separate categories (e.g., blood group, tongue rolling)'},
    {term:'Test cross',def:'Crossing a dominant phenotype with a homozygous recessive to determine genotype'},
    {term:'Sex-linked gene',def:'A gene located on one of the sex chromosomes (most commonly the X chromosome)'},
    {term:'Pedigree chart',def:'A family tree diagram used to track the inheritance of traits over generations'},
    {term:'Crossing over',def:'Exchange of genetic material between homologous chromosomes during Prophase I of meiosis'},
  ],
  flashcards:[
    {q:'What is the difference between genotype and phenotype?',a:'GENOTYPE is the genetic code an organism carries (e.g., Tt). PHENOTYPE is the observable trait that is expressed (e.g., tall). The same phenotype can have different genotypes (TT and Tt both appear tall).'},
    {q:'What is a Punnett square used for?',a:'A Punnett square predicts the possible genotypes and their probabilities in offspring from a genetic cross. Parental alleles are placed on top and side; all combinations are filled in the boxes.'},
    {q:'What is co-dominance? Give an example.',a:'Co-dominance occurs when both alleles are expressed equally in the heterozygote. Example: In human blood groups, the IA and IB alleles are co-dominant. A person with the genotype IAIB expresses both A and B antigens (Blood type AB).'},
    {q:'How is sex determined in humans?',a:'Females have XX chromosomes. Males have XY chromosomes. Sperm cells carry either X or Y; egg cells always carry X. If a Y-carrying sperm fertilises the egg → male (XY). If an X-carrying sperm → female (XX). Therefore, the FATHER determines the sex of the offspring.'},
    {q:'What is the difference between mitosis and meiosis?',a:'MITOSIS produces 2 diploid identical daughter cells for growth and repair. MEIOSIS produces 4 haploid, genetically variable daughter cells (gametes) for sexual reproduction. Meiosis involves two rounds of division.'},
    {q:'What are mutagens? Give two examples.',a:'MUTAGENS are agents that increase the rate of mutation. Examples: 1. UV radiation from the sun (can cause skin cancer). 2. X-rays. 3. Chemicals found in tobacco smoke (carcinogens). They damage or alter the DNA base sequence.'},
    {q:'Explain what is meant by a "carrier" in genetics.',a:'A CARRIER is an individual who is heterozygous (Aa) for a recessive trait. They do not express the recessive trait in their phenotype because the dominant allele masks it, but they possess the recessive allele and can pass it on to their offspring.'},
    {q:'What is a test cross and why is it performed?',a:'A TEST CROSS is a genetic cross between an individual with a dominant phenotype (unknown genotype of either TT or Tt) and a homozygous recessive individual (tt). It is performed to determine whether the dominant individual is homozygous (TT) or heterozygous (Tt).'},
    {q:'What is the difference between continuous and discontinuous variation?',a:'CONTINUOUS variation shows a spectrum of intermediate types (e.g., height, weight, skin colour) and is usually polygenic. DISCONTINUOUS variation shows distinct, separate categories (e.g., blood type, tongue rolling) and is usually controlled by single genes.'},
    {q:'Define crossing over and state its biological importance.',a:'CROSSING OVER is the exchange of genetic material between non-sister chromatids of homologous chromosomes during Prophase I of meiosis. Its importance is that it creates NEW combinations of alleles on chromosomes, increasing genetic variation in offspring.'},
    {q:'What is a monohybrid cross?',a:'A MONOHYBRID cross is a genetic cross between parents that differ in only ONE single characteristic or gene (e.g., looking at plant height only: Tall × Short). The genotype and phenotype ratios of the offspring are then analyzed.'},
    {q:'Why are sex-linked recessive traits more common in males than females?',a:'Males have only one X chromosome (XY). Therefore, if a male inherits a recessive allele on his single X chromosome, he will express it because there is no second X chromosome with a dominant allele to mask it. Females (XX) need two copies of the recessive allele to express it.'},
    {q:'How is genetic variation introduced during meiosis?',a:'Genetic variation is introduced in two key ways during meiosis: 1. CROSSING OVER during Prophase I exchanges alleles between homologous chromosomes. 2. INDEPENDENT ASSORTMENT of homologous chromosomes during Metaphase I randomly distributes maternal and paternal alleles into gametes.'},
    {q:'If a recessive allele is rare in a population, why are most carriers heterozygous?',a:'Because the recessive allele is rare, the probability of two carriers (heterozygotes) mating is much higher than the probability of two homozygous recessive individuals mating. Therefore, the recessive allele is mostly "hidden" in heterozygous carriers.'},
    {q:'What is a pedigree chart used for in genetics?',a:'A PEDIGREE CHART is a diagram that shows the genetic relationships and phenotypic traits over multiple generations within a family. It is used by geneticists to trace the inheritance patterns of specific traits or diseases (e.g., tracing whether a trait is dominant or recessive).'},
    {q:'Explain why clones (produced by mitosis) show no genetic variation.',a:'Mitosis is a process of asexual reproduction where a single parent cell divides to produce two genetically identical daughter cells. Because there is no mixing of gametes, no crossing over, and no independent assortment, the offspring are exact clones with identical DNA.'},
    {q:'What is independent assortment?',a:'INDEPENDENT ASSORTMENT is the random alignment and separation of homologous chromosomes during Metaphase I of meiosis. It ensures that the distribution of alleles for one gene into gametes is independent of the distribution of alleles for another gene, creating new genetic combinations.'},
    {q:'Why is blood type AB an example of co-dominance rather than complete dominance?',a:'Complete dominance would mean one allele hides the other (e.g., A dominates O). In co-dominance, both alleles are equally expressed. In blood type AB, the IA allele produces A antigens, and the IB allele produces B antigens. Neither masks the other, so both are visible in the phenotype.'},
    {q:'How can a mutation be both harmful and beneficial?',a:'The effect of a mutation depends on the environment. For example, a mutation causing sickle cell anaemia is HARMFUL in normal oxygen conditions (causes painful blood clotting). However, it is BENEFICIAL in malaria-endemic regions because heterozygous carriers are resistant to the malaria parasite.'},
    {q:'If a mother is colourblind (XcXc) and the father has normal vision (XCY), what is the probability of their son being colourblind?',a:'100% of their sons will be colourblind. The mother can only pass on Xc. The father passes on the Y chromosome to his sons. Therefore, the sons will be XcY, which results in colourblindness because the Xc allele is recessive and there is no second X chromosome to mask it.'},
  ],
  blanks:{
    passage:'The genetic makeup of an organism is called its [_], while its physical characteristics are its [_]. An organism with two identical alleles for a gene is [_], and one with two different alleles is [_]. The [_] allele is always expressed if present. A change in the DNA sequence is a [_], which can be caused by [_] like UV radiation.',
    answers:['genotype','phenotype','homozygous','heterozygous','dominant','mutation','mutagens'],
    wordbank:['genotype','phenotype','homozygous','heterozygous','dominant','mutation','mutagens','recessive','allele','haploid'],
  },
  sentences:[
    {prompt:'Explain why a recessive trait can "skip" a generation in a family pedigree.',keywords:['carrier','heterozygous','recessive','allele','phenotype','parent'],hint:'Think about parents who carry a trait but do not show it — what must happen for their child to show the trait?'},
    {prompt:'Describe the genotype and phenotype ratios from a cross between two heterozygous parents (Tt × Tt).',keywords:['Punnett square','TT','Tt','tt','ratio','dominant'],hint:'Draw a Punnett square with Tt and Tt. Count the resulting genotypes and translate them to phenotypes.'},
    {prompt:'Explain how sex is genetically determined in humans, including the role of the gametes.',keywords:['XY','XX','X','Y','sperm','father','gamete'],hint:'Who determines the sex of the baby — mother or father? Why? Which chromosome does each parent contribute?'},
    {prompt:'Compare and contrast mitosis and meiosis in terms of location, chromosome number, and genetic variation.',keywords:['mitosis','somatic','2n','identical','meiosis','gametes','haploid','n','variation'],hint:'Think about what type of cells they produce, how many chromosomes they have, and if they are identical.'},
    {prompt:'Explain how a mutation can affect an organism\'s phenotype.',keywords:['mutation','DNA','base sequence','protein','change','phenotype'],hint:'If the DNA changes, what does that do to the protein produced, and how does that physically affect the organism?'},
    {prompt:'Use a Punnett square to show the offspring of a cross between a homozygous tall plant (TT) and a homozygous short plant (tt).',keywords:['TT','tt','Tt','Punnett','dominant','all tall'],hint:'Place TT on the top and tt on the side. Fill in the boxes. What is the genotype and phenotype of all the offspring?'},
    {prompt:'Explain why females are the "default" sex in human development if the Y chromosome is absent.',keywords:['X','Y','SRY gene','testis','development','female'],hint:'What gene is located on the Y chromosome, and what does it trigger?'},
    {prompt:'Describe the process of crossing over and how it increases genetic diversity.',keywords:['crossing over','Prophase I','homologous','chromosomes','swap','genes','variation'],hint:'What happens when chromosomes pair up during meiosis, and why does this change the offspring?'},
    {prompt:'What is the difference between an allele and a gene?',keywords:['gene','allele','DNA','chromosome','form','trait'],hint:'Think about a gene as a broad instruction, and an allele as a specific version of that instruction.'},
    {prompt:'Explain why an individual who is a carrier (Aa) does not express the recessive trait.',keywords:['dominant','recessive','allele','mask','heterozygous','express'],hint:'What happens when a dominant allele and a recessive allele are present together?'},
    {prompt:'A woman has blood type A (genotype IAi) and a man has blood type B (genotype IBi). What are the possible blood types of their children?',keywords:['IA','IB','i','Punnett','AB','A','B','O'],hint:'Draw a Punnett square using the alleles IA, i, and IB, i. What are the resulting genotypes and phenotypes?'},
    {prompt:'Explain why genetic variation is essential for the long-term survival of a species.',keywords:['variation','evolution','adaptation','environment','disease','survival'],hint:'If all individuals are identical, what happens if a deadly virus or drastic climate change occurs?'},
    {prompt:'Describe the structure of a chromosome.',keywords:['chromosome','DNA','protein','histone','gene','chromatid'],hint:'What is a chromosome physically made of, and what unit of heredity does it carry?'},
    {prompt:'Explain the pattern of inheritance for a sex-linked trait like red-green colour blindness.',keywords:['sex-linked','X chromosome','recessive','male','carrier','female'],hint:'Why do more males than females suffer from red-green colour blindness?'},
    {prompt:'What is meant by the term "homozygous recessive"? Give an example.',keywords:['homozygous','recessive','allele','tt','aa','example'],hint:'What does homozygous mean? What does recessive mean? Put them together.'},
    {prompt:'Explain how a Punnett square can be used to predict the probability of an offspring inheriting a genetic disorder.',keywords:['Punnett square','carrier','parent','allele','probability','disorder'],hint:'If both parents are carriers for cystic fibrosis (Ff), how do you calculate the odds of a child having the disease (ff)?'},
    {prompt:'Describe the major differences between continuous and discontinuous variation, providing two examples of each.',keywords:['continuous','discontinuous','height','weight','blood type','tongue rolling','environment','genes'],hint:'One type has a smooth spectrum; the other has clear groups. Think of examples that fit each category.'},
    {prompt:'Why is a test cross used when determining the genotype of a plant with a dominant phenotype?',keywords:['dominant','genotype','test cross','homozygous','heterozygous','recessive'],hint:'If a plant is tall, it could be TT or Tt. How do you tell which one it is without sequencing its DNA?'},
    {prompt:'Explain the biological importance of meiosis.',keywords:['meiosis','gametes','haploid','genetic variation','reproduction','life cycle'],hint:'Why can\'t organisms just use mitosis to reproduce sexually? What unique advantages does meiosis provide?'},
    {prompt:'Describe how independent assortment contributes to genetic diversity.',keywords:['independent assortment','chromosomes','homologous','align','random','gametes'],hint:'What happens to the maternal and paternal chromosomes during Metaphase I of meiosis, and how does this create different combinations?'},
  ],
});
</script></body></html>
