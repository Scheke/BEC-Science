<script>
function bg(sk,c){sk.background(...(c||[10,14,20]))}

const STEPS=[
  {
    title:'Introduction to Organic Chemistry',
    body:`<strong>Organic chemistry</strong> is the study of carbon-based compounds. Carbon is unique because it can form:
    <ul style="margin:8px 0 0 18px;line-height:2">
      <li>Long chains and rings</li>
      <li>Single, double, and triple bonds</li>
      <li>Bonds with H, O, N, S, and halogens</li>
    </ul>
    <strong>Homologous series</strong> — a family of organic compounds with:
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li>The same general formula and functional group</li>
      <li>Each member differs by CH₂</li>
      <li>Similar chemical properties, gradually changing physical properties</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Carbon forming bonds
      const cx=W/2,cy=H*0.45;
      sk.fill(100,100,100,200);sk.noStroke();sk.circle(cx,cy,40);
      sk.fill(255);sk.textSize(12);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('C',cx,cy);sk.textStyle(sk.NORMAL);
      // 4 bonds
      const dir=[[0,-1],[1,0],[0,1],[-1,0]];
      const bAtoms=['C','H','O','N'];
      const bCols=[[100,100,100],[180,180,255],[231,76,60],[100,200,100]];
      dir.forEach(([dx,dy],i)=>{
        const bx=cx+dx*H*0.22,by=cy+dy*H*0.22;
        sk.stroke(...bCols[i],180);sk.strokeWeight(3);sk.noFill();
        sk.line(cx+dx*22,cy+dy*22,bx-dx*18,by-dy*18);
        sk.fill(...bCols[i],200);sk.noStroke();sk.circle(bx,by,30);
        sk.fill(255);sk.textSize(11);sk.textAlign(sk.CENTER,sk.CENTER);sk.text(bAtoms[i],bx,by);
      });
      sk.fill(255,220,50);sk.noStroke();sk.textSize(10);sk.textAlign(sk.CENTER);
      sk.text('Carbon forms 4 bonds — the backbone of organic chemistry',W/2,H*0.9);
    }
  },
  {
    title:'Alkanes — Saturated Hydrocarbons',
    body:`<strong>Alkanes</strong> contain only C–H and C–C <em>single</em> bonds — they are <strong>saturated</strong>.
    <br><br>
    General formula: <strong>CₙH₂ₙ₊₂</strong>
    <br><br>
    First four members:
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li>Methane (CH₄) — main component of natural gas</li>
      <li>Ethane (C₂H₆) — fuel</li>
      <li>Propane (C₃H₈) — LPG gas bottles</li>
      <li>Butane (C₄H₁₀) — camping gas</li>
    </ul>
    Alkanes <strong>burn well</strong> (combustion) but are relatively <em>unreactive</em> — no functional group to attack.`,
    draw:(sk)=>{
      bg(sk,[12,18,28]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Draw methane and ethane structures
      const drawMethane=(cx,cy,sz)=>{
        sk.fill(80,80,80,200);sk.noStroke();sk.circle(cx,cy,sz*1.6);
        sk.fill(255);sk.textSize(sz*0.55);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('C',cx,cy);
        [[0,-1],[1,0],[0,1],[-1,0]].forEach(([dx,dy])=>{
          const hx=cx+dx*sz*1.2,hy=cy+dy*sz*1.2;
          sk.stroke(180,180,255,150);sk.strokeWeight(2);sk.noFill();
          sk.line(cx+dx*sz*0.8,cy+dy*sz*0.8,hx-dx*sz*0.5,hy-dy*sz*0.5);
          sk.fill(180,180,255,200);sk.noStroke();sk.circle(hx,hy,sz*0.9);
          sk.fill(255);sk.textSize(sz*0.4);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('H',hx,hy);
        });
      };
      drawMethane(W*0.22,H*0.42,22);
      sk.fill(255,255,255,120);sk.noStroke();sk.textSize(10);sk.textAlign(sk.CENTER);
      sk.text('CH₄\n(Methane)',W*0.22,H*0.75);
      // Ethane
      [W*0.55,W*0.72].forEach((cx,i)=>{
        sk.fill(80,80,80,200);sk.noStroke();sk.circle(cx,H*0.42,26);
        sk.fill(255);sk.textSize(11);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('C',cx,H*0.42);
        [[0,-1],[0,1],i===0?[-1,0]:[1,0]].forEach(([dx,dy])=>{
          const hx=cx+dx*24,hy=H*0.42+dy*24;
          sk.stroke(180,180,255,150);sk.strokeWeight(2);sk.noFill();
          sk.line(cx+dx*13,H*0.42+dy*13,hx-dx*10,hy-dy*10);
          sk.fill(180,180,255,200);sk.noStroke();sk.circle(hx,hy,18);
          sk.fill(255);sk.textSize(9);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('H',hx,hy);
        });
      });
      sk.stroke(80,80,80,200);sk.strokeWeight(3);sk.line(W*0.55+13,H*0.42,W*0.72-13,H*0.42);
      sk.fill(255,255,255,120);sk.noStroke();sk.textSize(10);sk.textAlign(sk.CENTER);
      sk.text('C₂H₆\n(Ethane)',W*0.635,H*0.75);
    }

    q:'Alkane Homologous Series — CH₄ to C₄H₁₀',
    content:`<h3>Alkane Homologous Series</h3><p>Alkanes are saturated hydrocarbons (containing only C–C single bonds) that form a homologous series — a family of compounds sharing the same general formula CₙH₂ₙ₊₂. Each successive member adds one CH₂ unit, causing a gradual and predictable change in physical properties.</p><ul><li>Methane (CH₄, n=1): gas, BP −162°C — main component of natural gas used for cooking and heating</li><li>Propane (C₃H₈) and Butane (C₄H₁₀): stored as liquefied petroleum gas (LPG) in pressurised bottles for camping and heating</li><li>Boiling point increases down the series as longer chains have stronger intermolecular forces; flammability decreases and viscosity increases with chain length</li></ul>`,

  {
    q:'Functional Groups — Alcohol, Aldehyde, Ketone, Carboxylic Acid, Ester',
    content:`<h3>Functional Groups in Organic Chemistry</h3><p>A functional group is a specific atom or group of atoms within an organic molecule that determines its characteristic chemical reactions. Different families of organic compounds are defined by their functional groups.</p><ul><li>Alcohol (–OH): ethanol (C₂H₅OH) is the alcohol in beverages and is also used as a biofuel; reacts with sodium, can be oxidised to carboxylic acids</li><li>Carboxylic acid (–COOH): ethanoic acid (CH₃COOH) is the acid in vinegar; weak acids that react with bases and carbonates</li><li>Ester (–COO–): formed by the reaction of an alcohol with a carboxylic acid with an acid catalyst — responsible for fruit flavours and aromas; used as solvents and in perfumes</li></ul>`,
    visual:`<svg viewBox="0 0 420 290" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">

  {
    q:'Combustion Products — Complete vs Incomplete',
    content:`<h3>Combustion of Hydrocarbons — Complete vs Incomplete</h3><p>When hydrocarbons burn, the products depend entirely on the oxygen supply. Complete combustion (excess oxygen) is clean and produces only carbon dioxide and water. Incomplete combustion (limited oxygen) is dangerous and produces toxic and polluting by-products.</p><ul><li>Complete combustion: CₙH₂ₙ₊₂ + O₂ → CO₂ + H₂O — blue flame, all carbon fully oxidised; used when fuels burn efficiently in engines and boilers</li><li>Incomplete combustion: limited O₂ produces CO (carbon monoxide) and/or C (soot) + H₂O — yellow/orange smoky flame indicating inefficient burning</li><li>Carbon monoxide is particularly dangerous because it is colourless, odourless, and binds irreversibly to haemoglobin in red blood cells, preventing oxygen transport</li></ul>`,

  {
    q:'Fermentation — Glucose to Ethanol (Conditions)',
    content:`<h3>Fermentation: Glucose → Ethanol</h3><p>Fermentation is an anaerobic (without oxygen) biological process in which yeast converts glucose into ethanol and carbon dioxide. The enzyme zymase in the yeast catalyses this reaction and is highly sensitive to temperature and oxygen levels.</p><ul><li>Equation: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂ — glucose is broken down into two molecules each of ethanol and carbon dioxide</li><li>Conditions: yeast (contains zymase enzyme), warm temperature 25–35°C (too hot denatures the enzyme; too cold slows it), anaerobic (no oxygen — oxygen kills the yeast), and slightly acidic pH 4–6</li><li>Ethanol concentration is limited to about 14–15% because higher concentrations kill the yeast; distillation is used to concentrate the ethanol further for fuel or industrial applications</li></ul>`,

  {
    title:'Alkenes — Unsaturated Hydrocarbons',
    body:`<strong>Alkenes</strong> contain a C=C <em>double</em> bond — they are <strong>unsaturated</strong>.
    <br><br>
    General formula: <strong>CₙH₂ₙ</strong>
    <br><br>
    Examples:
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li>Ethene (C₂H₄) — used to make poly(ethene)/polyethylene</li>
      <li>Propene (C₃H₆)</li>
    </ul>
    Key reaction: <strong>Addition reactions</strong> — the C=C double bond opens and new atoms add across it.
    <br><br>
    Test for alkenes: add <strong>bromine water</strong>. Orange → colourless = alkene present (bromine adds across the double bond).`,
    draw:(sk)=>{
      bg(sk,[10,14,25]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Ethene structure
      const cx=W/2,cy=H*0.38;
      const carbons=[[cx-28,cy],[cx+28,cy]];
      carbons.forEach((c,i)=>{
        sk.fill(80,80,80,200);sk.noStroke();sk.circle(...c,30);
        sk.fill(255);sk.textSize(12);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('C',...c);
        [[-1,0],[0,-1],[0,1]].forEach(([dx,dy])=>{
          if(i===0&&dx>0||i===1&&dx<0)return;
          const hx=c[0]+dx*30,hy=c[1]+dy*28;
          sk.stroke(180,180,255,150);sk.strokeWeight(1.5);sk.noFill();
          sk.line(c[0]+dx*15,c[1]+dy*15,hx-dx*11,hy-dy*11);
          sk.fill(180,180,255,180);sk.noStroke();sk.circle(hx,hy,18);
          sk.fill(255);sk.textSize(9);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('H',hx,hy);
        });
      });
      // Double bond
      sk.stroke(255,220,50,200);sk.strokeWeight(3);sk.noFill();
      sk.line(carbons[0][0]+15,cy-3,carbons[1][0]-15,cy-3);
      sk.line(carbons[0][0]+15,cy+3,carbons[1][0]-15,cy+3);
      sk.fill(255,220,50);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('C=C double bond',cx,H*0.56);
      // Bromine test
      const testProg=Math.min(1,t/8);
      sk.fill(230,130,0,180*(1-testProg));sk.noStroke();
      sk.circle(W*0.5,H*0.75,40);
      sk.fill(testProg>0.5?[200,220,200]:[230,130,0]);
      sk.textSize(9);sk.textAlign(sk.CENTER,sk.CENTER);
      sk.text(testProg>0.7?'Colourless\n(alkene!)':'Br₂\norange',W*0.5,H*0.75);
      sk.fill(255,255,255,80);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('Bromine water test',W*0.5,H*0.9);
    }
  },

  {
    title:'Functional Groups — Alcohols & Acids',
    body:`A <strong>functional group</strong> determines the chemical behaviour of an organic compound.
    <br><br>
    <strong>Alcohols</strong> — contain –OH group:
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>General formula: CₙH₂ₙ₊₁OH</li>
      <li>Ethanol (C₂H₅OH) — in drinks, used as fuel/solvent</li>
      <li>React with sodium, combust in air, oxidise to acids</li>
    </ul>
    <strong>Carboxylic acids</strong> — contain –COOH group:
    <ul style="margin:4px 0 0 18px;line-height:1.8">
      <li>Ethanoic acid (CH₃COOH) — in vinegar</li>
      <li>React with bases/carbonates, react with alcohols to make esters</li>
    </ul>`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Ethanol
      sk.fill(52,152,219,50);sk.noStroke();sk.rect(0,0,W/2,H);
      sk.fill(255);sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);sk.text('ALCOHOL',W*0.25,H*0.1);sk.textStyle(sk.NORMAL);
      // CH3CH2OH diagram (simplified)
      [[W*0.1,'C',[80,80,80]],[W*0.2,'C',[80,80,80]],[W*0.32,'O',[231,76,60]],[W*0.4,'H',[180,180,255]]].forEach(([x,s,c])=>{
        sk.fill(...c,200);sk.noStroke();sk.circle(x,H*0.42,22);
        sk.fill(255);sk.textSize(10);sk.textAlign(sk.CENTER,sk.CENTER);sk.text(s,x,H*0.42);
      });
