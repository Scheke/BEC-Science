<script>
function bg(sk,c){sk.background(...(c||[12,15,25]))}

const STEPS=[
  {
    title:'Inside the Atom',
    body:`All matter is made of <strong>atoms</strong>. Each atom has:
    <ul style="margin:8px 0 0 18px;line-height:2.2">
      <li><strong>Protons</strong> — positive charge (+1), mass 1 — in the nucleus</li>
      <li><strong>Neutrons</strong> — no charge (0), mass 1 — in the nucleus</li>
      <li><strong>Electrons</strong> — negative charge (−1), mass ~0 — in shells around nucleus</li>
    </ul>
    An atom is <strong>electrically neutral</strong> — number of protons = number of electrons.
    <br><br>
    <strong>Atomic number (Z)</strong> = number of protons<br>
    <strong>Mass number (A)</strong> = protons + neutrons`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      const cx=W/2,cy=H/2;
      // Nucleus
      sk.fill(231,76,60,220);sk.noStroke();sk.circle(cx,cy,52);
      sk.fill(255);sk.textSize(10);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('Nucleus',cx,cy);
      // Protons/neutrons inside
      [[8,255,100,100],[6,200,200,200]].forEach(([n,r,g,b],type)=>{
        for(let i=0;i<n;i++){
          const ang=i*(sk.TWO_PI/n);
          const r2=type===0?18:10;
          const nx=cx+Math.cos(ang)*r2,ny=cy+Math.sin(ang)*r2;
          // Just colour the nucleus
        }
      });
      sk.fill(255,150,150);sk.textSize(8);sk.textAlign(sk.CENTER);sk.text('p⁺ & n⁰',cx,cy+28);
      // Electron shells
      const shells=[2,8,8];
      const radii=[H*0.18,H*0.3,H*0.42];
      radii.forEach((r,si)=>{
        sk.noFill();sk.stroke(255,255,255,25);sk.strokeWeight(1);
        sk.circle(cx,cy,r*2);
        const n=shells[si];
        for(let i=0;i<n;i++){
          const ang=t*(1-si*0.3)+(i/n)*sk.TWO_PI;
          const ex=cx+Math.cos(ang)*r,ey=cy+Math.sin(ang)*r;
          sk.fill(100,180,255,220);sk.noStroke();sk.circle(ex,ey,9);
        }
        sk.fill(255,255,255,60);sk.noStroke();sk.textSize(8);sk.textAlign(sk.LEFT);
        sk.text('Shell '+(si+1)+': '+n,cx+r+5,cy);
      });
    }
  },
  {
    title:'Electron Configuration',
    body:`Electrons fill shells in order, with a maximum in each:
    <ul style="margin:8px 0 0 18px;line-height:2">
      <li><strong>Shell 1</strong> — maximum 2 electrons</li>
      <li><strong>Shell 2</strong> — maximum 8 electrons</li>
      <li><strong>Shell 3</strong> — maximum 8 electrons (for BGCSE)</li>
    </ul>
    Examples:
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li>Sodium (Na, Z=11): <strong>2, 8, 1</strong></li>
      <li>Chlorine (Cl, Z=17): <strong>2, 8, 7</strong></li>
      <li>Calcium (Ca, Z=20): <strong>2, 8, 8, 2</strong></li>
    </ul>
    The outer shell electrons (<strong>valence electrons</strong>) determine how an element reacts.`,
    draw:(sk)=>{
      bg(sk,[10,15,30]);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      // Show Na: 2,8,1
      const cx=W/2,cy=H/2;
      const configs=[[2,H*0.14],[8,H*0.26],[1,H*0.38]];
      sk.noFill();sk.stroke(231,76,60,80);sk.strokeWeight(2);sk.circle(cx,cy,22);// Nucleus
      sk.fill(231,76,60);sk.noStroke();sk.circle(cx,cy,22);
      sk.fill(255);sk.textSize(8);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('Na',cx,cy);
      configs.forEach(([n,r],si)=>{
        sk.noFill();sk.stroke(255,255,255,20);sk.strokeWeight(1);sk.circle(cx,cy,r*2);
        for(let i=0;i<n;i++){
          const ang=t*(1-si*0.2)+(i/n)*sk.TWO_PI;
          const ex=cx+Math.cos(ang)*r,ey=cy+Math.sin(ang)*r;
          const isValence=si===2;
          sk.fill(isValence?[255,220,50]:[100,180,255]);
          sk.noStroke();sk.circle(ex,ey,si===2?12:8);
          if(isValence){
            sk.fill(255);sk.textSize(8);sk.textAlign(sk.CENTER,sk.CENTER);sk.text('1',ex,ey);
          }
        }
      });
      sk.fill(255,220,50);sk.noStroke();sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
      sk.text('Na: 2, 8, 1',W/2,H*0.86);
      sk.textStyle(sk.NORMAL);sk.fill(255,255,255,80);sk.textSize(9);
      sk.text('Valence = 1 (highlighted)',W/2,H*0.93);
    }
  },
  {
    q:'Sodium Atom — Electron Shell Diagram (Na, Z=11)',
    content:`<h3>Sodium Atom — Electron Shell Diagram (Na, Z=11)</h3><p>Sodium has atomic number 11, meaning it has 11 protons in its nucleus and 11 electrons arranged in three shells. The nucleus also contains 12 neutrons, giving a mass number of 23.</p><ul><li>Shell 1 holds 2 electrons (maximum for shell 1)</li><li>Shell 2 holds 8 electrons (maximum for shell 2)</li><li>Shell 3 holds 1 valence electron — this single outer electron makes sodium very reactive</li></ul>`,

</svg>`
  },
  {
    q:'Isotopes Comparison — Carbon-12, Carbon-13, Carbon-14',
    content:`<h3>Isotopes of Carbon — ¹²C, ¹³C, ¹⁴C</h3><p>Isotopes are atoms of the same element that have the same number of protons but different numbers of neutrons. All three carbon isotopes have 6 protons (Z=6), but their mass numbers differ because of differing neutron counts.</p><ul><li>¹²C: 6 protons, 6 neutrons — the most abundant isotope (~98.9%), used as the standard for atomic mass</li><li>¹³C: 6 protons, 7 neutrons — stable but rare (~1.1%), used in NMR spectroscopy</li><li>¹⁴C: 6 protons, 8 neutrons — radioactive, used in carbon dating to determine the age of ancient organic materials</li></ul>`,

</svg>`

  {
    q:'History of Atomic Models — Timeline',
    content:`<h3>Development of the Atomic Model</h3><p>Our understanding of the atom has evolved over two centuries as new experimental evidence challenged existing models. Each scientist built on the work of the previous one, revising the model to fit new data.</p><ul><li>Dalton (1803): solid indivisible sphere — atoms cannot be split</li><li>Thomson (1904): "plum pudding" model — electrons embedded in a positive sphere, discovered after the electron was identified</li><li>Rutherford (1911): nuclear model — gold foil experiment showed most mass is in a tiny dense positive nucleus, with electrons orbiting outside</li><li>Bohr (1913): planetary model — electrons occupy fixed energy levels (shells), explaining atomic line spectra</li></ul>`,

  {
    q:'Periodic Table Block Structure — s, p, d Blocks',
    content:`<h3>Periodic Table Block Structure</h3><p>The periodic table is divided into blocks based on which type of orbital the outermost electrons occupy. Understanding blocks helps predict element properties and electronic configurations at a glance.</p><ul><li>s-block (Groups 1 & 2): outermost electrons in s orbitals — includes reactive metals like Na and Ca, and hydrogen and helium</li><li>p-block (Groups 13–18): outermost electrons in p orbitals — includes non-metals, metalloids, and noble gases</li><li>d-block (Groups 3–12, Period 4 onwards): transition metals such as Fe, Cu, and Zn — known for variable oxidation states and coloured compounds</li></ul>`,
    visual:`<svg viewBox="0 0 420 255" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:system-ui,sans-serif">

  {
    title:'Isotopes & Relative Atomic Mass',
    body:`<strong>Isotopes</strong> are atoms of the same element with the <em>same atomic number</em> but <em>different mass numbers</em> (different numbers of neutrons).
    <br><br>
    Example — Carbon isotopes:
    <ul style="margin:6px 0 0 18px;line-height:2">
      <li>¹²C — 6 protons, 6 neutrons (most common, ~99%)</li>
      <li>¹³C — 6 protons, 7 neutrons</li>
      <li>¹⁴C — 6 protons, 8 neutrons (radioactive)</li>
    </ul>
    <strong>Relative Atomic Mass (Ar)</strong> = weighted average mass of all isotopes relative to ¹²C.
    <br><br>
    Chlorine: Ar = 35.5 because it is ~75% ³⁵Cl and ~25% ³⁷Cl.`,
    draw:(sk)=>{
      bg(sk);
      const W=sk.width,H=sk.height,t=sk.frameCount*0.025;
      const isotopes=[
        {mass:12,n:6,x:0.18,pct:98.9,c:[52,152,219]},
        {mass:13,n:7,x:0.5,pct:1.1,c:[155,89,182]},
        {mass:14,n:8,x:0.82,pct:0.01,c:[231,76,60]},
      ];
      isotopes.forEach(iso=>{
        const x=iso.x*W,y=H*0.5;
        // Bar height based on abundance
        const barH=H*0.55*(iso.pct/100);
        sk.fill(...iso.c,160);sk.noStroke();sk.rect(x-22,y-barH,44,barH,4,4,0,0);
        // Nucleus
        sk.fill(...iso.c,220);sk.circle(x,y+25,38);
        sk.fill(255);sk.textSize(10);sk.textAlign(sk.CENTER,sk.CENTER);
        sk.text(`¹${iso.mass}C`,x,y+20);sk.text(`n=${iso.n}`,x,y+32);
        // Abundance
        sk.fill(...iso.c);sk.noStroke();sk.textSize(10);sk.textStyle(sk.BOLD);sk.textAlign(sk.CENTER);
        sk.text(iso.pct+'%',x,y-barH-8);sk.textStyle(sk.NORMAL);
      });
      sk.fill(255,255,255,80);sk.textSize(9);sk.textAlign(sk.CENTER);
      sk.text('Same element (6 protons) — different neutrons = different mass',W/2,H*0.92);
    }

    body:`The periodic table arranges elements by <strong>increasing atomic number</strong>.

    <strong>Periods</strong> (horizontal rows) — elements in the same period have the same number of electron shells.
    <br><br>
    <strong>Groups</strong> (vertical columns) — elements in the same group have the same number of <em>valence electrons</em>, so they react similarly.

    draw:(sk)=>{

      const W=sk.width,H=sk.height,t=sk.frameCount*0.02;
      // Simple periodic table sketch

      const highlight={1:[231,76,60],7:[52,152,219],0:[46,204,113]};
      for(let row=0;row<4;row++){
        for(let col=0;col<18;col++){
          const x=col*cw+W*0.02,y=row*ch+H*0.1;

          else if(grp===18||grp===0)c=[...highlight[0],120];
          sk.fill(...c);sk.noStroke();sk.rect(x,y,cw-2,ch-2,2);
